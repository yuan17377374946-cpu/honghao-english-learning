ferent tools.","C":"Ravens were able to plan for their future needs.","D":"Ravens liked working with monkeys to get treats."},"answer":"C","explanation":"根据第二段“This showed they could remember how to use the tools and plan ahead to get the treat later.”说明渡鸦能记住如何使用工具，并提前计划以后获取食物。"},{"n":17,"stem":"Which of the following can be put in    ▲   ?","options":{"A":"Ravens also live in groups all year round.","B":"Ravens are good at solving real-life problems.","C":"Ravens are good at looking for food alone, too.","D":"Ravens also live easily in any new environment."},"answer":"B","explanation":"根据第三段“They use sticks to dig insects out of trees, and some even drop nuts on roads so cars can crack them open. They can solve problems that require several steps...”它们用树枝把昆虫从树里挖出来，有些甚至把坚果扔到路上，好让汽车把坚果压开，它们能解决需要多个步骤的问题，这些都是渡鸦解决现实生活问题的具体例子。"},{"n":18,"stem":"What does the underlined phrase “hold grudges against” probably mean?","options":{"A":"Keep bad feelings towards.","B":"Teach new skills to.","C":"Feel truly thankful to.","D":"Share food together with."},"answer":"A","explanation":"根据第四段“They can hold grudges against people who have treated them badly, and even teach their young to stay away from those people.”可知渡鸦会记住对自己不好的人，并教幼鸟远离他们，因此“hold grudges against”意为“对……怀恨在心”。"},{"n":19,"stem":"What’s the purpose of the article?","options":{"A":"To explain how to train ravens to use tools.","B":"To show different living habits of wild ravens.","C":"To introduce ravens and call for people’s protection.","D":"To compare ravens’ intelligence with other animals."},"answer":"C","explanation":"全文先介绍渡鸦的高智商，再说明其社会生活，最后指出它们面临栖息地丧失和污染，呼吁人们保护它们。"},{"n":20,"stem":"On which website can we most probably read the article?","options":{"A":"www.naturelife.com.","B":"www.smartstar.com.","C":"www.goodhabit.com.","D":"www.funtrip.com."},"answer":"A","explanation":"本文属于介绍动物习性、智力及保护问题的科普类文章，最可能出现在自然生活类网站上。"}],"bank":{},"paragraphs":["Many people think birds have simple minds, but ravens (渡鸦) are a surprising exception. Their intelligence has long been compared to that of monkeys and even humans. One of the most surprising things they can do is to make plans for the future.","In one experiment, ravens were trained to use a tool to get food. Later, they were given a choice among several things, including the tool and other useless objects. Most of the ravens chose the tool, even with no food reward at once. This showed they could remember how to use the tools and plan ahead to get the treat later.","▲    They use sticks to dig insects out of trees, and some even drop nuts (坚果) on roads so cars can crack them open. They can solve problems that require several steps, like using a short stick to get a longer one, then using the long stick to reach food.","Their intelligence isn’t just about solving problems. Ravens have rich social lives. They remember different faces, including those of other ravens and humans. They can hold grudges against people who have treated them badly, and even teach their young to stay away from those people.","Sadly, many kinds of ravens are suffering from habitat (栖息地) loss and pollution. As we learn more about their intelligence, scientists hope people will see them as more than just “common birds” and take action to protect them."],"sourceNote":"根据用户提供的对应年份原卷和解析卷整理；统一题号，保留原题内容。"}}</script><script>'use strict';

const norm=s=>String(s??'').trim().toLowerCase();
const ravenLink='../english-exams-2022-2026/?module=exams&paper=2026-2';
function overview(){return `<div class="eyebrow">OCT 30 · ONE CLASSROOM</div><h1>今晚的英语课堂</h1><p class="lead">今天写句子，回看昨天的阅读和拼读。同一入口按顺序切换，原有记录继续保留。</p><div class="grid2"><a class="course" href="../english-exams-2022-2026/?module=writing"><div class="number">01</div><h2>简单句写作</h2><p>Reading can help us… / We should… / Let’s…<br>拆句、换语块，再写五句话。</p><span class="go">进入已做好的写作模块 →</span></a><a class="course" href="${ravenLink}"><div class="number">02</div><h2>讲昨天的渡鸦阅读</h2><p>2026年 · 阅读B ·《渡鸦的智慧》<br>第16—20题，直接回到原文和作答。</p><span class="go">打开渡鸦原题与解析 →</span></a><button class="course" data-act="view" data-id="dictation" style="text-align:left"><div class="number">03</div><h2>10个新词听写</h2><p>换一组不同单词复习原来的组合，先听音写词，再核对拼写、中文和字母组合。</p><span class="go">开始10词听写 →</span></button><button class="course" data-act="view" data-id="phonics" style="text-align:left"><div class="number">04</div><h2>新组合：th / ph / ng</h2><p>th 的两种读音分开看；ph、ng 结合熟词练习。每组沿用昨天词库，保留20个以上例词。</p><span class="go">查看今晚备选组合 →</span></button></div><div class="tip">组合是今晚的备选安排，老师可按时间挑选，不代表此前已掌握或今晚需要全部讲完。</div><section class="panel"><h2>查阅昨天的网页</h2><div class="actions"><a href="../english-exams-2022-2026/?module=questions">一般疑问句与特殊疑问句 →</a><a href="../phonics-combinations/">完整自然拼读词库 →</a><a href="../english-exams-2022-2026/?module=exams">近五年中考真题 →</a></div><p class="muted">渡鸦阅读保持原题、原选项与原解析。新增的听写与备选组合仅用于今晚课堂安排。</p></section><details><summary>渡鸦阅读：讲题时先看问题问什么</summary>${DATA.raven.questions.map(q=>`<div class="question"><span class="tag">第${q.n}题</span><p class="en">${esc(q.stem)}</p><details><summary>教师核对与原解析</summary><p class="en">${q.answer}. ${esc(q.options[q.answer])}</p><p class="muted">${esc(q.explanation)}</p></details></div>`).join('')}</details>`}
function dictation(){const w=DATA.dictation[state.idx],done=!!state.checked[state.idx],peek=transient.peek===state.idx,right=norm(state.answers[state.idx])===w.word.toLowerCase();const checked=Object.keys(state.checked).filter(k=>state.checked[k]),correct=checked.filter(k=>norm(state.answers[k])===DATA.dictation[Number(k)].word.toLowerCase());return `<div class="eyebrow">REVIEW · LISTEN AND SPELL</div><h1>听音写词，复习已学组合</h1><p class="lead">第二组新词，共10词。先听完整单词，写完再核对；批改前不显示拼写、中文和组合提示。</p><div class="grid3"><div class="stat"><b>${state.idx+1} / 10</b><span>当前单词</span></div><div class="stat"><b>${checked.length} / 10</b><span>已核对</span></div><div class="stat"><b>${correct.length}</b><span>核对正确</span></div></div><section class="panel"><span class="tag">第${state.idx+1}个词</span><div class="listenbox"><h2>听一听，写下来</h2><div class="actions">${speechButton(w.word,'播放单词')}${speechButton(w.word,'慢速再听',true)}<button class="small" data-act="stop" disabled>■ 停止播放</button><button class="small" data-act="peek">${peek?'收起拼写':'教师展开本词'}</button></div>${peek?`<p class="en">${mark(w.word,w.letters)}</p><p class="zh">${w.meaning}</p>`:''}<p class="caption">点击“停止播放”或按 Esc 可停音；再次点击正在播放的按钮也可停止。没有英语语音时，可由老师口头听写。</p></div><label for="spelling">你的拼写</label><input id="spelling" class="answer" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(state.answers[state.idx]||'')}" placeholder="输入听到的单词" ${done?'disabled':''}><div class="actions"><button class="primary" data-act="check-one" ${done?'disabled':''}>核对本词</button>${done?'<button data-act="retry-one">重写本词</button>':''}<button data-act="dict-jump" data-index="${state.idx+1}" ${state.idx===9?'disabled':''}>下一个 →</button></div>${done?`<div class="feedback ${right?'':'bad'}" role="status"><strong>${right?'拼写正确':'再看一看字母组合'}</strong><div class="en">${mark(w.word,w.letters)}</div><p>${w.meaning} · ${w.letters} ${w.sound==='∅'?'在这里不发音':'/'+w.sound+'/'}</p><p>先看高亮部分，再把读音和拼写对应起来。</p><a href="../phonics-combinations/#${w.gid}">回昨天词库查看这一组 →</a></div>`:''}<div class="jump">${DATA.dictation.map((w,i)=>`<button data-act="dict-jump" data-index="${i}" class="${i===state.idx?'active':''} ${state.checked[i]?(norm(state.answers[i])===w.word?'correct':'wrong'):''}" aria-label="第${i+1}个词">${i+1}</button>`).join('')}</div><div class="actions"><button class="small" data-act="check-all">批改已写的单词</button><button class="small" data-act="export">导出听写记录</button></div></section><details><summary>教师查看今晚10词与结果</summary><div class="scroll"><table><thead><tr><th>序号</th><th>复习词</th><th>中文</th><th>组合</th><th>学生拼写</th></tr></thead><tbody>${DATA.dictation.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.word)}</td><td>${x.meaning}</td><td>${x.letters}</td><td>${esc(state.answers[i]||'未填写')}</td></tr>`).join('')}</tbody></table></div><p class="caption">本组已更换全部10词，复习原来的字母组合。eight 中的 gh 不发音；新旧两组听写记录分别保存。</p></details>`}
function phonics(){const g=DATA.groups.find(g=>g.id===state.group)||DATA.groups[0],words=state.all?g.words:g.words.slice(0,8);return `<div class="eyebrow">NEW SOUNDS · PHONICS</div><h1>用熟词认识新组合</h1><p class="lead">建议从 th、ph、ng 中挑选。th 的清、浊两种读音单独练；点击朗读播放的是完整例词。</p><div class="pills">${DATA.groups.map(x=>`<button data-act="group" data-id="${x.id}" class="${g.id===x.id?'active':''}">${x.letters} /${x.sound}/</button>`).join('')}</div><section class="panel"><span class="tag">${g.category}</span><div class="grid2"><div><div class="group-title">${g.letters}</div><div class="sound">/${g.sound}/</div><p>${g.tip}</p></div><div><h3>怎样发这个音？</h3><p class="muted">${g.mouth}</p>${g.note?`<div class="tip">${g.note}</div>`:''}</div></div><div class="actions"><button class="small" data-act="all-words">${state.all?'先看前8个词':`展开全部${g.words.length}个例词`}</button><button class="small" data-act="hide-zh">${state.hideZh?'显示中文':'遮住中文'}</button><a href="../phonics-combinations/#${g.id}">打开昨天完整分组 →</a></div><div class="words">${words.map(w=>`<div class="word"><div class="en">${mark(w.word,g.letters)}${w.extension?'<span class="extension">补充</span>':''}</div><p class="zh meaning">${w.meaning}</p>${speechButton(w.word)}</div>`).join('')}</div><p class="caption">共${g.words.length}个例词，默认先看8个；较长的拓展词可留到后面。语音示范为例词，不把字母名称当成组合的纯音。</p></section>${g.letters==='th'?'<div class="tip">对比 thin / think 中的 /θ/ 和 this / that 中的 /ð/。两者舌位相近，/ð/ 有声带振动；不能把所有 th 都读成同一个音。</div>':''}`}
function render(){document.documentElement.style.setProperty('--size',state.font+'px');document.body.classList.toggle('hide-zh',state.hideZh);$('#tabs').innerHTML=[['overview','今晚安排'],['dictation','10词听写'],['phonics','新字母组合']].map(([id,t])=>`<button data-act="view" data-id="${id}" class="${state.view===id?'active':''}">${t}</button>`).join('');$('#content').innerHTML=state.view==='dictation'?dictation():state.view==='phonics'?phonics():overview();syncSpeechControls()}
function initVoices(){voices='speechSynthesis'in window?speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)):[];const el=$('#voice');el.innerHTML=voices.length?voices.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${v.lang})</option>`).join(''):'<option value="">暂无英语语音</option>';const v=voices.find(v=>v.voiceURI===state.voice)||voices.find(v=>v.lang==='en-GB')||voices[0];if(v){state.voice=v.voiceURI;el.value=v.voiceURI}$('#voice-note').textContent=voices.length?'可选择设备英语语音；听写与例词均朗读完整单词。':'此设备暂无英语语音，请由老师朗读；听写输入和核对可以照常使用。'}
document.addEventListener('input',e=>{if(e.target.id==='spelling'){state.answers[state.idx]=e.target.value;persist()}});
document.addEventListener('change',e=>{if(e.target.id==='voice'){stop();state.voice=e.target.value;persist()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stop();return}if(e.key==='Enter'&&e.target.id==='spelling'){$('[data-act="check-one"]').click()}});
document.addEventListener('click',event=>{const b=event.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,n=Number(b.dataset.index);if(a==='stop'){stop();return}if(a==='speak'){speak(b.dataset.text,b.dataset.slow==='true');return}if(a==='view'){state.view=b.dataset.id;stop();transient.peek=undefined;window.scrollTo(0,0)}if(a==='font')state.font=state.font===19?22:state.font===22?25:19;
 if(a==='dict-jump'){if(n<0||n>9)return;state.idx=n;transient.peek=undefined;stop()}
 if(a==='peek')transient.peek=transient.peek===state.idx?undefined:state.idx;
 if(a==='check-one'){if(!norm(state.answers[state.idx]))return toast('先写下听到的单词。');state.checked[state.idx]=true;transient.peek=undefined}
 if(a==='retry-one'){state.checked[state.idx]=false;state.answers[state.idx]='';transient.peek=undefined}
 if(a==='check-all'){const filled=DATA.dictation.map((_,i)=>i).filter(i=>norm(state.answers[i]));if(!filled.length)return toast('先写下听到的单词。');filled.forEach(i=>state.checked[i]=true);toast(`已批改${filled.length}个已填写的词。`)}
 if(a==='group'){state.group=b.dataset.id;state.all=false;stop()}
 if(a==='all-words')state.all=!state.all;if(a==='hide-zh')state.hideZh=!state.hideZh;
 if(a==='export'){const rows=['10月30日英语听写记录','序号\t单词\t中文\t组合\t学生拼写\t核对'];DATA.dictation.forEach((w,i)=>rows.push([i+1,w.word,w.meaning,w.letters,state.answers[i]||'',state.checked[i]?(norm(state.answers[i])===w.word?'正确':'待复习'):'未核对'].join('\t')));const u=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/plain;charset=utf-8'})),link=document.createElement('a');link.href=u;link.download='10月30日_英语听写.txt';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
 persist();render();
});
if(!['overview','dictation','phonics'].includes(state.view))state.view='overview';if(!Number.isInteger(state.idx)||state.idx<0||state.idx>9)state.idx=0;if(![19,22,25].includes(state.font))state.font=19;
render();initVoices();if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',initVoices);
</script></body></html>
