,"走到哪里，就从哪里看下一段。"],["return","原路返回","路段倒序，每段方向反过来。"],["pair","数对与定位方法","先明确方格约定，通常先列后行。"],["travel","综合与说理","分清路长和直线距离，再列式计算。"]],"modules":[["base","看懂位置","观察点、方向标与定位条件",["obs","axis","angle","enough"]],["angle","方向角变变变","从哪条线开始量？",["angle","equiv"]],["reverse","换个位置看","分清同向改写和反向位置",["reverse","obs","equiv"]],["draw","地图小画家","距离换算、量角与落点",["scale","plot"]],["route","去程与返程","分段路线、倒序与方向",["route","return"]],["mixed","定位与应用","数对、比较与行程综合",["pair","travel"]]],"questions":[{"id":"d01","module":"diag","kind":"choice","tags":["obs"],"title":"谁在看谁","prompt":"“图书馆在学校北偏东30°方向上。”应站在哪里观察图书馆？","steps":["把关系句读成“站在学校，看图书馆”。","学校是观察点，图书馆是目标点。"],"hint":"先把句子改成“站在___看___”。","options":["图书馆","学校","地图右上角","任意地点"],"answer":1,"diagram":{"mode":"rays","step":100,"points":[{"b":30,"d":400,"name":"图书馆","arcStart":"北","arc":30}],"origin":"学校"}},{"id":"d02","module":"diag","kind":"choice","tags":["angle"],"title":"从哪边开始","prompt":"“南偏西25°”应该怎样量角？","steps":["“南”是起始方向。","由正南向西侧偏转25°。"],"hint":"偏字前面的方向是起始方向。","options":["从南向西量25°","从西向南量25°","从北向西量25°","从南向东量25°"],"answer":0,"diagram":{"mode":"rays","step":100,"points":[{"b":205,"d":300,"name":"目标","arcStart":"南","arc":25}],"origin":"学校"}},{"id":"d03","module":"diag","kind":"fields","tags":["equiv"],"title":"同一条方向","prompt":"北偏东20°，也可以说成东偏北多少度？","steps":["北与东夹角90°。","同一射线与这两条轴的夹角之和是90°。","90－20＝70，所以是东偏北70°。"],"hint":"观察点和目标都没变。","fields":[{"label":"东偏北","type":"number","answer":70,"unit":"°"}],"diagram":{"mode":"rays","step":100,"points":[{"b":20,"d":300,"name":"目标","arcStart":"北","arc":20}],"origin":"学校"}},{"id":"d04","module":"diag","kind":"direction","tags":["reverse"],"title":"换到另一端","prompt":"学校在家的北偏东20°方向600米处。家在学校的什么位置？","steps":["观察点由家换成学校，看的目标也互换。","北换成南，东换成西，采用对应起始方向时角度20°不变。","家在学校南偏西20°、600米处，也可说西偏南70°。"],"hint":"先画学校到家的返回箭头。","bearing":200,"distance":600,"diagram":{"mode":"rays","step":200,"points":[{"b":20,"d":600,"name":"学校","arcStart":"北","arc":20}],"origin":"家"},"explainReverse":true},{"id":"d05","module":"diag","kind":"choice","tags":["enough"],"title":"只给距离够吗","prompt":"只知道小象距营地600米，能确定小象的唯一位置吗？","steps":["距营地600米的点不止一个。","这些点在以营地为圆心、600米为半径的圆上。","还需要具体方向来确定其中一个点。"],"hint":"想一想营地东边和西边600米处是不是都符合。","options":["能，已经知道600米","不能，还需要具体方向"],"answer":1,"diagram":{"mode":"circle","step":200,"d":600,"origin":"营地"}},{"id":"d06","module":"diag","kind":"fields","tags":["scale"],"title":"地图有多远","prompt":"图上1厘米表示实际200米，图上2.5厘米表示多少米？","steps":["每1厘米对应200米。","2.5份200米：2.5×200＝500米。"],"hint":"图上长度是几个1厘米？","fields":[{"label":"实际距离","type":"number","answer":500,"unit":"米"}],"diagram":{"mode":"rays","step":200,"points":[{"b":70,"d":500,"name":"目标","arcStart":"东","arc":20}],"origin":"学校"}},{"id":"d07","module":"diag","kind":"plot","tags":["plot","scale"],"title":"亲手定一个点","prompt":"以营地为观察点，标出北偏西40°、距离450米的监测点。","steps":["先从北向西量40°，确定射线。","每圈代表150米，450米对应3圈。","在正确方向的第3圈标出监测点。"],"hint":"先定方向，再数距离圈。","bearing":320,"distance":450,"target":"监测点","diagram":{"mode":"plot","step":150,"origin":"营地"}},{"id":"d08","module":"diag","kind":"route","tags":["return"],"title":"原路返回","prompt":"去程先向东走200米，再向北走300米。根据地图填写返程的两段路线。","steps":["先按实际行走顺序列出各段的起点和终点。","每一段都以当前出发点为观察点；返程要将路段倒过来。","对照方向标填写各段的方向、角度和距离。"],"hint":"先说清第一段从哪里出发。","segments":[{"b":180,"d":300},{"b":270,"d":200}],"diagram":{"mode":"route","segments":[{"b":90,"d":200},{"b":0,"d":300}],"names":["家","书店","学校"]}},{"id":"b01","module":"base","kind":"choice","tags":["obs"],"title":"看清关系句","prompt":"“营地在水塘的西偏北30°方向500米处。”这句话的观察点与目标分别是？","steps":["“在水塘的……”告诉我们从水塘观察。","目标是句子开头的营地。"],"hint":"改成“站在水塘，看营地”。","options":["营地；水塘","水塘；营地","水塘；北方","北方；营地"],"answer":1,"diagram":{"mode":"rays","step":200,"points":[{"b":300,"d":500,"name":"营地","arcStart":"西","arc":30}],"origin":"水塘"}},{"id":"b02","module":"base","kind":"choice","tags":["axis"],"title":"方向标转了","prompt":"这张小地图的北向箭头指向画面右方。那么画面上方是什么方向？","steps":["地图要以指北箭头为准。","当北朝右时，东朝下、南朝左、西朝上。"],"hint":"从北向顺时针转90°是东。","options":["东","西","南","北"],"answer":1,"diagram":{"mode":"rotated"}},{"id":"b03","module":"base","kind":"choice","tags":["enough"],"title":"信息够不够","prompt":"以同一个营地为观察点，哪些信息能确定一个唯一位置？（可多选）","steps":["先约定同一个观察点。","具体方向与距离都给出时可以定点。","单独距离或单独方向仍有多个可能位置。"],"hint":"逐项检查具体方向和距离是否都齐全。","options":["北偏东30°方向，距离400米","距离营地400米","正西方向，距离300米","北偏西20°方向"],"answer":[0,2],"diagram":{"mode":"circle","step":100,"d":300,"origin":"营地"}},{"id":"b04","module":"base","kind":"choice","tags":["angle"],"title":"是哪条射线","prompt":"以学校为观察点，哪一个点在南偏东30°方向上？","steps":["从正南往东偏30°。","这是右下区域、靠近南向的射线。","图中C点符合。"],"hint":"先找正南，再向东转。","options":["A点","B点","C点","D点"],"answer":2,"diagram":{"mode":"rays","origin":"学校","step":100,"points":[{"b":30,"d":300,"name":"A"},{"b":120,"d":300,"name":"B"},{"b":150,"d":300,"name":"C"},{"b":210,"d":300,"name":"D"}]}},{"id":"b05","module":"base","kind":"direction","tags":["angle","scale"],"title":"动物园报告","prompt":"看图，以喷泉为观察点，完整描述熊猫馆的位置。","steps":["观察点是喷泉。","角弧从北向东量25°。","熊猫馆在第3圈，每圈200米，即600米。"],"hint":"先看角弧贴着哪条方向线。","bearing":25,"distance":600,"diagram":{"mode":"rays","step":200,"points":[{"b":25,"d":600,"name":"熊猫馆","arcStart":"北","arc":25}],"origin":"喷泉"}},{"id":"b06","module":"base","kind":"direction","tags":["angle"],"title":"另一侧的目标","prompt":"看图，以广场为观察点，描述音乐厅的位置。","steps":["音乐厅在左上区域。","角弧从西向北量25°。","西偏北25°，也就是北偏西65°；距离400米。"],"hint":"图上的25°从西方向开始量。","bearing":295,"distance":400,"diagram":{"mode":"rays","step":100,"points":[{"b":295,"d":400,"name":"音乐厅","arcStart":"西","arc":25}],"origin":"广场"}},{"id":"b07","module":"base","kind":"choice","tags":["enough"],"title":"方向已经很准确","prompt":"“北偏东15°”已经给出了准确方向，为什么还不能确定唯一位置？","steps":["准确方向只能确定一条射线。","近处和远处的多个点都在这条射线上。","还需距离来选择其中一点。"],"hint":"同一方向可以有近处和远处的点。","options":["还不知道目标距离观察点多远","还要知道目标的颜色","15°太小，不能使用","只有45°才能定位置"],"answer":0,"diagram":{"mode":"rays","origin":"营地","step":100,"points":[{"b":15,"d":200,"name":"近点"},{"b":15,"d":500,"name":"远点"}]}},{"id":"b08","module":"base","kind":"choice","tags":["axis","obs"],"title":"移动观察中心","prompt":"从广场走到车站，准备画车站的方向标。北向线应怎样画？","steps":["观察点移动，地图的北向不因此改变。","在车站画与原北向线平行的北向线。"],"hint":"变的是观察中心，地图没有 const TYPES={choice:'选择与判断',fields:'填空计算',direction:'方向与位置',plot:'地图画点',route:'路线填写',sort:'路线排序',match:'配对辨析'};
const DIRS=['北偏东','东偏北','东偏南','南偏东','南偏西','西偏南','西偏北','北偏西','正北','正东','正南','正西'];
function bearing(dir,a){const n=Number(a);return (({'北偏东':n,'东偏北':90-n,'东偏南':90+n,'南偏东':180-n,'南偏西':180+n,'西偏南':270-n,'西偏北':270+n,'北偏西':360-n,'正北':0,'正东':90,'正南':180,'正西':270}[dir]??NaN)+360)%360}
function diff(a,b){return Math.abs(((a-b+540)%360)-180)}
function dirText(b){b=(b+360)%360;if(b%90===0)return ['正北','正东','正南','正西'][b/90];if(b<90)return `北偏东${b}°`;if(b<180)return `东偏南${b-90}°`;if(b<270)return `南偏西${b-180}°`;return `西偏北${b-270}°`}
function dirParts(b){const t=dirText(b);return t.startsWith('正')?{dir:t,angle:''}:{dir:t.slice(0,3),angle:parseFloat(t.slice(3))}}
function numValue(v){if(typeof v==='number')return Number.isFinite(v)?v:NaN;const s=String(v??'').trim().replace(/[０-９．]/g,c=>c==='．'?'.':String(c.charCodeAt(0)-65296));return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN}
function gradeDirection(r,b,d){if(!r?.dir)return {valid:false};const a=r.dir.startsWith('正')?0:numValue(r.angle);if(!Number.isFinite(a)||a<0||a>90)return {valid:false};if(d!==null&&d!==undefined&&!Number.isFinite(numValue(r.distance)))return {valid:false};return {valid:true,correct:diff(bearing(r.dir,a),b)<.001&&(d===null||d===undefined||Math.abs(numValue(r.distance)-d)<.001)}}
function grade(q,r){
 if(q.kind==='choice'){if(!r?.length)return {valid:false};const expected=Array.isArray(q.answer)?q.answer:[q.answer];return {valid:true,correct:r.length===expected.length&&expected.every(v=>r.includes(v))}}
 if(q.kind==='fields'){if(!r||r.length!==q.fields.length||r.some(v=>String(v).trim()===''))return {valid:false};const wrong=[];q.fields.forEach((f,i)=>{const n=numValue(r[i]);if(f.type==='number'){if(!Number.isFinite(n)||Math.abs(n-f.answer)>.001)wrong.push(i)}else{const opts=Array.isArray(f.answer)?f.answer:[f.answer];if(!opts.some(a=>String(a).replace(/\s/g,'')===String(r[i]).replace(/\s/g,'')))wrong.push(i)}});return {valid:true,correct:!wrong.length,wrong}}
 if(q.kind==='direction')return gradeDirection(r,q.bearing,q.distance);
 if(q.kind==='plot'){if(!r||!Number.isFinite(r.b)||!Number.isFinite(r.d))return {valid:false};return {valid:true,correct:diff(r.b,q.bearing)<=4&&Math.abs(r.d-q.distance)<=q.diagram.step*.18}}
 if(q.kind==='route'){if(!r||r.length!==q.segments.length)return {valid:false};const gs=q.segments.map((s,i)=>gradeDirection(r[i],s.b,s.d));return {valid:gs.every(g=>g.valid),correct:gs.every(g=>g.correct),wrong:gs.flatMap((g,i)=>g.correct?[]:[i])}}
 if(q.kind==='sort'){return {valid:!!r&&r.length===q.answer.length,correct:!!r&&r.every((v,i)=>v===q.answer[i])}}
 if(q.kind==='match'){if(!r||r.some(v=>!v))return {valid:false};const wrong=q.pairs.flatMap((p,i)=>r[i]===p[1]?[]:[i]);return {valid:true,correct:!wrong.length,wrong}}
 return {valid:false};
}

function bank(){const visible=activeFilter==='all'?Q:Q.filter(q=>q.module===activeFilter);$('app').innerHTML=`<div class="section-title"><div><h1>分类练习</h1><p class="muted" style="margin-top:10px">按需要选题，或从第一题开始。图解默认收起。</p></div><button class="btn primary" data-action="practice-visible">练这一组</button></div><div class="filterbar">${[['all','全部72题'],['diag','8题摸底'],...DATA.modules.map(m=>[m[0],m[1]]),['test','整章检测']].map(m=>`<button data-filter="${m[0]}" class="${activeFilter===m[0]?'active':''}">${m[1]}</button>`).join('')}</div><div class="question-list">${visible.map((q,i)=>`<button data-question="${q.id}"><span><b>${i+1}. ${q.title}</b><br><small>${TYPES[q.kind]} · ${q.tags.map(skillName).join(' / ')}</small></span><span class="tag">${rec(q).correct?'已答对':rec(q).everWrong?'待回练':'未练习'}</span></button>`).join('')}</div>`}
function start(ids,index=0){if(!ids.length){toast('这一组暂时没有题目。');return}state.queue=ids;state.index=index;draft={};feedback=null;hintOpen=false;protractor=false;sortOrder=[];page='quiz';render();window.scrollTo({top:0,behavior:'instant'})}
function startModule(m){start(Q.filter(q=>q.module===m).map(q=>q.id))}
function current(){return Q.find(q=>q.id===state.queue[state.index])}
function initDraft(q){if(draft.id===q.id)return;draft={id:q.id,choice:[],fields:q.fields?.map(()=>''),direction:{dir:'',angle:'',distance:''},route:q.segments?.map(()=>({dir:'',angle:'',distance:''})),match:q.pairs?.map(()=>''),plot:null};sortOrder=q.cards?.map((_,i)=>i).reverse()||[];}
function dirInputs(r={},id='',distance=true){return `<div class="direction-row"><select aria-label="${id}方向" data-dir="${id}"><option value="">选择方向</option>${DIRS.map(d=>`<option ${r.dir===d?'selected':''}>${d}</option>`).join('')}</select><input aria-label="${id}角度" data-angle="${id}" type="number" inputmode="decimal" min="0" max="90" step="any" placeholder="角度" value="${esc(r.angle)}" ${r.dir?.startsWith('正')?'disabled':''}><span>°</span>${distance?`<input class="distance-input" aria-label="${id}距离（米）" data-distance="${id}" type="number" inputmode="decimal" min="0" step="any" placeholder="距离" value="${esc(r.distance)}"><span>米</span>`:''}</div>`}
function answerForm(q){
 if(q.kind==='choice')return `<div class="caption">${Array.isArray(q.answer)?'可多选：选出所有符合的选项。':'单选：选择一个符合的答案。'}</div><div class="choices">${q.options.map((o,i)=>`<button class="option ${draft.choice.includes(i)?'selected':''}" data-choice="${i}" aria-pressed="${draft.choice.includes(i)}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
 if(q.kind==='fields')return `<div class="fields">${q.fields.map((f,i)=>`<div class="field" data-field-row="${i}"><label for="field-${i}">${f.label}</label><input id="field-${i}" data-field="${i}" type="${f.type==='number'?'number':'text'}" inputmode="${f.type==='number'?'decimal':'text'}" step="any" value="${esc(draft.fields[i])}" autocomplete="off"><span>${f.unit||''}</span></div>`).join('')}</div>`;
 if(q.kind==='direction')return `<div class="caption">选择方向，填写角度${q.distance!=null?'和距离':''}。同方向的等价说法都可以。</div>${dirInputs(draft.direction,'answer',q.distance!=null)}`;
 if(q.kind==='plot')return `<div class="caption">方法一：直接点击地图落点。<br>方法二：输入你判断的方向、角度和实际距离，再点击落点。</div>${dirInputs(draft.direction,'plot',true)}<button class="btn small light" data-action="place" style="margin-top:15px">按我的数据落点</button><p class="plot-note" id="plot-location">${plotLocation()}</p><p class="notice">每圈代表${q.diagram.step}米。轻点新位置可以修改；开启量角辅助可查看角度刻度。画点允许少量操作误差。</p>`;
 if(q.kind==='route')return q.segments.map((s,i)=>`<div class="route-segment" data-route-row="${i}"><div class="segment-label">第${i+1}段</div>${dirInputs(draft.route[i],`route-${i}`,true)}</div>`).join('');
 if(q.kind==='match'){const options=q.pairs.map(p=>p[1]).slice(1).concat(q.pairs[0][1]);return q.pairs.map((p,i)=>`<div class="match-row" data-match-row="${i}"><label for="match-${i}">${p[0]}</label><select id="match-${i}" data-match="${i}"><option value="">选择配对</option>${options.map(o=>`<option ${draft.match[i]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`).join('')}
 if(q.kind==='sort')return `<p class="caption">用上下按钮调整顺序，第一段放最上面。</p><div class="sort-list">${sortOrder.map((v,i)=>`<div class="sort-item"><span><b>${i+1}.</b> ${q.cards[v]}</span><span class="sort-controls"><button aria-label="第${i+1}段上移" data-sort="${i},-1" ${i===0?'disabled':''}>↑</button><button aria-label="第${i+1}段下移" data-sort="${i},1" ${i===sortOrder.length-1?'disabled':''}>↓</button></span></div>`).join('')}</div>`;
 return '';
}
function plotLocation(){if(!draft.plot)return '尚未落点。先判断，再动手。';return `已落点：${dirText(Math.round(draft.plot.b))}附近，距观察点约${Math.round(draft.plot.d)}米。`}
function answerSummary(q){if(q.kind==='choice')return (Array.isArray(q.answer)?q.answer:[q.answer]).map(i=>`${String.fromCharCode(65+i)}. ${q.options[i]}`).join('；');if(q.kind==='fields')return q.fields.map(f=>`${f.label}：${Array.isArray(f.answer)?f.answer[0]:f.answer}${f.unit||''}`).join('；');if(['direction','plot'].includes(q.kind))return `${dirText(q.bearing)}${q.distance!=null?`，${q.distance}米`:''}`;if(q.kind==='route')return q.segments.map((s,i)=>`第${i+1}段：${dirText(s.b)}，${s.d}米`).join('；');if(q.kind==='sort')return q.answer.map((i,n)=>`${n+1}. ${q.cards[i]}`).join('；');if(q.kind==='match')return q.pairs.map(p=>`${p[0]}：${p[1]}`).join('；');return ''}
function question(){const q=current();if(!q){go('home');return}initDraft(q);const c=counts(state.queue.map(id=>Q.find(q=>q.id===id)).filter(Boolean));$('app').innerHTML=`<section class="panel"><div class="question-head"><div><div class="qmeta"><span class="tag">${TYPES[q.kind]}</span>${q.tags.map(t=>`<span class="tag">${skillName(t)}</span>`).join('')}</div><h2>${q.title}</h2></div><div class="q-progress">第 ${state.index+1} / ${state.queue.length} 题<br><span class="muted" id="group-answered">本组已答 ${c.answered} 题</span></div></div><p class="q-prompt">${q.prompt}</p><div class="exercise"><div><div class="map-frame" id="question-map">${mapSVG(q.diagram||rayFallback(),false,q.kind==='plot'?draft.plot:null,protractor)}<div class="map-note">${mapNote(q.diagram,q.kind)}</div>${q.kind==='plot'?'<div class="map-toolbar"><button class="btn small light" data-action="protractor">'+(protractor?'收起量角辅助':'打开量角辅助')+'</button><button class="btn small light" data-action="clearplot">清除落点</button></div>':''}</div></div><div class="answer-block" id="answer-block">${answerForm(q)}</div></div><div class="check-row"><button class="btn primary" data-action="check">检查答案</button><button class="btn" data-action="hint">${hintOpen?'收起提示':'给我一点提示'}</button>${state.teacher?'<button class="btn light" data-action="explain">展开讲解</button>':''}<button class="btn small light" data-action="retry">重新作答</button></div><div id="feedback" aria-live="polite">${feedbackHTML()}</div><div id="hint">${hintOpen?`<div class="hint-box">${q.hint}</div>`:''}</div><details class="solution" id="solution"><summary>分步图解与答案</summary><div class="solution-body"><ol>${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="solution-answer">参考答案：${answerSummary(q)}</div><div class="solution-figure map-frame">${mapSVG(q.diagram||rayFallback(),true,q.kind==='plot'?{b:q.bearing,d:q.distance}:null,false,q.explainReverse)}</div></div></details></section><div class="qnav"><button class="btn" data-action="prev" ${state.index===0?'disabled':''}>上一题</button><button class="btn small light" data-action="round">查看本组记录</button><button class="btn blue" data-action="next">${state.index===state.queue.length-1?'完成本组':'下一题'}</button></div><div class="question-strip" aria-label="本组题目导航">${state.queue.map((id,i)=>{const r=state.records[id]||{};return `<button class="question-dot ${r.correct?'correct':r.everWrong?'wrong':''} ${i===state.index?'current':''}" data-index="${i}" aria-label="第${i+1}题${r.correct?'已答对':r.everWrong?'待回练':'未练习'}" ${i===state.index?'aria-current="step"':''}>${i+1}</button>`}).join('')}</div><p class="notice">可以跳题。未作答的题会保留为“未练习”，展开图解不会计为答对。</p>`;bindQuiz();}
function feedbackHTML(){return feedback?`<div class="feedback ${feedback.type}">${esc(feedback.text)}</div>`:''}
function response(q){if(q.kind==='choice')return draft.choice;if(q.kind==='fields')return draft.fields;if(q.kind==='direction')return draft.direction;if(q.kind==='plot')return draft.plot;if(q.kind==='route')return draft.route;if(q.kind==='sort')return sortOrder;if(q.kind==='match')return draft.match}
function check(){const q=current(),g=grade(q,response(q));document.querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));if(!g.valid){feedback={type:'neutral',text:q.kind==='plot'?'请先在地图上落一个点。':q.kind==='choice'?'请先选择答案。':q.kind==='fields'?'请把所有空格填完整。':q.kind==='match'?'请把每一项都配对。':'请选方向并填写距离；偏向角填0—90°，正方向不需要填角度。'};$('feedback').innerHTML=feedbackHTML();return}const old=rec(q);if(!draft.checkedCorrect){state.records[q.id]={...old,attempts:(old.attempts||0)+1,firstCorrect:old.attempts?old.firstCorrect:g.correct,correct:g.correct,everWrong:old.everWrong||!g.correct,last:Date.now()};}draft.checkedCorrect=g.correct;feedback=g.correct?{type:'good',text:'答对了！可以展开分步图解，讲一讲你是怎么判断的。'}:{type:'bad',text:`还需要调整${g.wrong?.length?'，请检查标出的项目':''}。${q.hint}\n你可以继续修改，也可以展开分步图解。`};if(g.wrong)g.wrong.forEach(i=>document.querySelector(`[data-${q.kind==='fields'?'field':q.kind==='route'?'route':'match'}-row="${i}"]`)?.classList.add('invalid'));$('feedback').innerHTML=feedbackHTML();syncChrome();document.querySelectorAll('[data-index]').forEach(b=>{const r=state.records[state.queue[Number(b.dataset.index)]]||{};b.classList.toggle('correct',!!r.correct);b.classList.toggle('wrong',!!r.everWrong&&!r.correct);b.setAttribute('aria-label',`第${Number(b.dataset.index)+1}题${r.correct?'已答对':r.everWrong?'待回练':'未练习'}`)});if($('group-answered'))$('group-answered').textContent=`本组已答 ${counts(state.queue.map(id=>Q.find(q=>q.id===id)).filter(Boolean)).answered} 题`;}
function mutate(){draft.checkedCorrect=false;feedback=null;if($('feedback'))$('feedback').innerHTML=''}
function bindQuiz(){const q=current();document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.choice);draft.choice=Array.isArray(q.answer)?(draft.choice.includes(i)?draft.choice.filter(v=>v!==i):[...draft.choice,i]):[i];mutate();document.querySelectorAll('[data-choice]').forEach(el=>{const selected=draft.choice.includes(Number(el.dataset.choice));el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',selected)})});document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{draft.fields[Number(el.dataset.field)]=el.value;mutate()});bindDirectionInputs();document.querySelectorAll('[data-match]').forEach(el=>el.onchange=()=>{draft.match[Number(el.dataset.match)]=el.value;mutate()});document.querySelectorAll('[data-sort]').forEach(el=>el.onclick=()=>{const [i,d]=el.dataset.sort.split(',').map(Number);[sortOrder[i],sortOrder[i+d]]=[sortOrder[i+d],sortOrder[i]];mutate();question();bindActions()});document.querySelectorAll('[data-index]').forEach(el=>el.onclick=()=>jump(Number(el.dataset.index)));if(q.kind==='plot'){$('plot-map')?.addEventListener('click',e=>{const svg=e.currentTarget;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const loc=pt.matrixTransform(svg.getScreenCTM().inverse());const dx=loc.x-245,dy=loc.y-210;const radius=Math.hypot(dx,dy);if(radius>182)return;draft.plot={b:(Math.atan2(dx,-dy)*180/Math.PI+360)%360,d:radius/40*q.diagram.step};mutate();updatePlot()});}}
function bindDirectionInputs(){for(const kind of ['dir','angle','distance'])document.querySelectorAll(`[data-${kind}]`).forEach(el=>el.addEventListener(kind==='dir'?'change':'input',()=>{const key=el.dataset[kind],r=key.startsWith('route-')?draft.route[Number(key.split('-')[1])]:draft.direction;r[kind]=el.value;if(kind==='dir'){const inp=el.parentElement.querySelector('[data-angle]');inp.disabled=el.value.startsWith('正');if(inp.disabled){inp.value='';r.angle=''}}mutate()}));}
function updatePlot(){const q=current(),frame=$('question-map');frame.querySelector('svg').outerHTML=mapSVG(q.diagram,false,draft.plot,protractor);$('plot-location').textContent=plotLocation();const svg=$('plot-map');svg?.addEventListener('click',e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse()),dx=p.x-245,dy=p.y-210,r=Math.hypot(dx,dy);if(r>182)return;draft.plot={b:(Math.atan2(dx,-dy)*180/Math.PI+360)%360,d:r/40*q.diagram.step};mutate();updatePlot()})}
function jump(i){state.index=i;draft={};feedback=null;hintOpen=false;protractor=false;render();window.scrollTo({top:0,behavior:'instant'})}
function wrong(){const qs=Q.filter(q=>rec(q).everWrong&&(wrongAll||!rec(q).correct));$('app').innerHTML=`<div class="section-title"><div><h1>错题回练</h1><p class="muted" style="margin-top:10px">做错过的题会留下记录。重新答对后，移入“已订正”。</p></div>${qs.length?'<button class="btn primary" data-action="start-wrong">开始回练</button>':''}</div><div class="filterbar"><button data-wrong="pending" class="${!wrongAll?'active':''}">待回练 ${counts().wrong}</button><button data-wrong="all" class="${wrongAll?'active':''}">全部错题记录 ${Q.filter(q=>rec(q).everWrong).length}</button></div>${qs.length?`<div class="question-list">${qs.map(q=>`<button data-question="${q.id}"><span><b>${q.title}</b><br><small>${q.tags.map(skillName).join(' / ')}</small></span><span class="tag">${rec(q).correct?'已订正':'待回练'}</span></button>`).join('')}</div>`:'<div class="empty"><h2>这里暂时没有待回练的题</h2><p>先去做一组练习。需要重练的题会自动收集到这里。</p><button class="btn primary" data-view="practice">去选一组题</button></div>'}`;document.querySelectorAll('[data-wrong]').forEach(el=>el.onclick=()=>{wrongAll=el.dataset.wrong==='all';render()})}
function report(){const c=counts(),first=Q.filter(q=>rec(q).attempts),firstGood=first.filter(q=>rec(q).firstCorrect).length;$('app').innerHTML=`<div class="section-title"><div><h1>每一步都有记录</h1><p class="muted" style="margin-top:10px">“已答对”记录最近一次结果。知识点数量允许交叉统计。</p></div></div><div class="round-report"><div><strong>${c.answered}/72</strong>已练习</div><div><strong>${c.correct}</strong>最近已答对</div><div><strong>${first.length?Math.round(firstGood/first.length*100):0}%</strong>首次作答正确率</div></div><section class="panel"><h2 style="margin-bottom:14px">知识点覆盖检查</h2><div class="table-wrap"><table class="report-table"><thead><tr><th>知识点</th><th>对应题数</th><th>已练习</th><th>已答对</th><th>继续练习</th></tr></thead><tbody>${DATA.skills.map(s=>{const qs=Q.filter(q=>q.tags.includes(s[0])),cc=counts(qs);return `<tr><td>${s[1]}</td><td>${qs.length}</td><td>${cc.answered}</td><td>${cc.correct}</td><td><button class="btn small light" data-skill="${s[0]}">练习</button></td></tr>`}).join('')}</tbody></table></div></section><section class="panel" style="margin-top:22px"><h2>保存与备份</h2><p class="muted small-text" style="margin:10px 0 16px">进度只保存在当前设备的浏览器。换设备前可导出备份，到另一台设备导入。清除浏览器数据也会清除这里的记录。</p><div class="button-row"><button class="btn" data-action="export">导出进度</button><button class="btn" data-action="import">导入进度</button><button class="btn danger" data-action="reset">清空练习记录</button></div><input type="file" accept="application/json,.json" id="import-file" hidden></section><section class="panel" style="margin-top:22px"><h3>题目与范围</h3><p class="muted small-text">本页72题为围绕教材目标编写的练习，覆盖7种交互形式，包含单选、多选、判断、填空、配对、排序与画点等任务。不是学校真题或考试频率统计。依据用户提供的北师大六上课本第67—72页，并参考公开教学与练习题型。</p><p class="small-text"><a href="https://zy.21cnjy.com/26322361" target="_blank" rel="noopener">配套教学参考</a> · <a href="https://zy.21cnjy.com/26359101" target="_blank" rel="noopener">公开题型参考</a></p></section>`;}
function round(){const qs=state.queue.map(id=>Q.find(q=>q.id===id)).filter(Boolean),c=counts(qs);$('app').innerHTML=`<section class="panel"><h1>本组练习记录</h1><p class="muted" style="margin-top:12px">先看哪些题还没练，再回看需要调整的地方。</p><div class="round-report"><div><strong>${c.correct}</strong>已答对</div><div><strong>${c.wrong}</strong>待回练</div><div><strong>${qs.length-c.answered}</strong>未练习</div></div><div class="button-row">${c.wrong?'<button class="btn primary" data-action="round-wrong">只练本组错题</button>':''}${qs.length>c.answered?'<button class="btn blue" data-action="round-unanswered">完成未练习题</button>':''}<button class="btn" data-view="home">返回探险地图</button></div></section><div class="question-list" style="margin-top:22px">${qs.map((q,i)=>`<button data-resume-index="${i}"><span>${i+1}. ${q.title}</span><span class="tag">${rec(q).correct?'已答对':rec(q).everWrong?'待回练':'未练习'}</span></button>`).join('')}</div>`;document.querySelectorAll('[data-resume-index]').forEach(b=>b.onclick=()=>{page='quiz';jump(Number(b.dataset.resumeIndex))})}
function labPage(){$('app').innerHTML=`<div class="section-title"><div><h1>方向实验室</h1><p class="muted" style="margin-top:10px">转动一条射线，看清“同方向换说法”和“反向看位置”。</p></div></div><div class="lab-layout"><div class="map-frame" id="lab-map">${labMap()}<div class="map-note">每圈100米 · 蓝线是北向 · 橙线指向目标</div></div><section class="panel lab-controls"><label for="lab-dir">从哪个方向开始，向哪边偏？</label><select id="lab-dir">${DIRS.filter(d=>!d.startsWith('正')).map(d=>`<option ${lab.dir===d?'selected':''}>${d}</option>`).join('')}</select><label for="lab-angle" style="display:block;margin-top:18px">偏转角度：<span id="lab-angle-label">${lab.angle}</span>°</label><input id="lab-angle" type="range" min="5" max="85" value="${lab.angle}" step="5"><label for="lab-distance">距离：<span id="lab-distance-label">${lab.d}</span>米</label><input id="lab-distance" type="range" min="100" max="400" value="${lab.d}" step="50"><label class="lab-reverse"><input id="lab-reverse" type="checkbox" ${lab.reverse?'checked':''}> 换到目标点，往回看营地</label><div class="lab-readout" id="lab-readout">${labReadout()}</div><p class="notice">这里只用于观察与探索，不计入答题记录。</p><button class="btn primary" data-start="angle" style="margin-top:16px">用题目检验一下</button></section></div>`;for(const id of ['dir','angle','distance','reverse'])$('lab-'+id).addEventListener(id==='dir'||id==='reverse'?'change':'input',()=>{lab.dir=$('lab-dir').value;lab.angle=Number($('lab-angle').value);lab.d=Number($('lab-distance').value);lab.reverse=$('lab-reverse').checked;$('lab-angle-label').textContent=lab.angle;$('lab-distance-label').textContent=lab.d;$('lab-map').querySelector('svg').outerHTML=labMap();$('lab-readout').innerHTML=labReadout()})}
function labMap(){return mapSVG({mode:'rays',origin:'营地',step:100,points:[{b:bearing(lab.dir,lab.angle),d:lab.d,name:'目标',arcStart:lab.dir[0],arc:lab.angle}]},true,null,false,lab.reverse)}
function labReadout(){const other=lab.dir[2]+'偏'+lab.dir[0];let str=`目标在营地${lab.dir}${lab.angle}°、${lab.d}米处。<br><span class="small-text">同方向也可说：${other}${90-lab.angle}°。</span>`;if(lab.reverse)str+=`<br><span class="small-text">反过来看：营地在目标${dirText((bearing(lab.dir,lab.angle)+180)%360)}、${lab.d}米处。</span>`;return str}
function mapNote(d,kind){if(d?.mode==='lighthouse')return '示意图：灯塔位置已知，结合具体方向作出定位射线';if(d?.mode==='route')return '箭头表示去程 · 每段的起点旁都有方向标 · 角度从标出的起始线量起';if(d?.mode==='grid')return '横向为列，纵向为行 · 本图按先列后行的约定';if(d?.mode==='rotated')return '只给出北向箭头，请据此辨认其他方向';return `每圈代表${d?.step||100}米 · ${kind==='plot'?'点击圆形范围内落点':'图中的角弧表示所量角度'}${d?.mode==='circle'?' · 圆上各点到中心距离相同':''}`}
function rayFallback(){return {mode:'rays',origin:'观察点',step:100,points:[{b:30,d:300,name:'目标',arcStart:'北',arc:30}]}}
let svgID=0;const coord=(b,r,cx=245,cy=210)=>({x:cx+Math.sin(b*Math.PI/180)*r,y:cy-Math.cos(b*Math.PI/180)*r});
function ln(x1,y1,x2,y2,color='#9db7c8',width=1.5,extra=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${extra}/>`}
function textSVG(x,y,t,color='#284a60',size=17,anchor='middle',extra=''){return `<text x="${x}" y="${y}" fill="${color}" font-size="${size}" font-family="Microsoft YaHei, sans-serif" text-anchor="${anchor}" ${extra}>${esc(t)}</text>`}
function arcSVG(cx,cy,start,b,label,r=44){const aa=coord(start,r,cx,cy),bb=coord(b,r,cx,cy);let delta=((b-start+540)%360)-180;const mid=coord(start+delta/2,r+17,cx,cy);return `<path d="M${aa.x},${aa.y} A${r},${r} 0 0 ${delta>=0?1:0} ${bb.x},${bb.y}" fill="none" stroke="#dc8500" stroke-width="2.5"/>${textSVG(mid.x,mid.y+5,label,'#a55a00',15)}`}
function mapSVG(d,explain=false,point=null,pro=false,reverse=false){const id='m'+(++svgID),arrow=id+'a';let out=`<svg ${d.mode==='plot'&&!explain?'id="plot-map" tabindex="0" aria-label="作图区域。可点击落点，或使用右侧方向和距离输入完成作图。"':'role="img" aria-label="'+esc(mapDescription(d))+'"'} viewBox="0 0 500 440" xmlns="http://www.w3.org/2000/svg"><defs><marker id="${arrow}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087ee6"/></marker></defs><rect width="500" height="440" fill="#f7fbfd"/>`;
 if(d.mode==='route')return out+routeSVG(d,arrow,explain)+'</svg>';
 if(d.mode==='lighthouse'){out+=ln(95,90,365,335,'#dd8c0a',3)+ln(400,85,175,355,'#087ee6',3);out+=`<path d="M85 92 L90 52 L102 52 L107 92 Z" fill="#ffc742" stroke="#a46a00" stroke-width="2"/><path d="M389 87 L394 47 L406 47 L411 87 Z" fill="#ffc742" stroke="#a46a00" stroke-width="2"/>`;out+=textSVG(95,36,'灯塔A','#173044',20)+textSVG(400,31,'灯塔B','#173044',20)+textSVG(245,383,'两条定位射线只有一个交点时，可据此定位','#3c5b70',17);return out+'</svg>'}
 if(d.mode==='grid'){for(let i=0;i<=6;i++){out+=ln(65+i*55,365,65+i*55,35,'#d0e1eb',1)+ln(65,365-i*55,395,365-i*55,'#d0e1eb',1);out+=textSVG(65+i*55,392,String(i),'#526c7d',15)+textSVG(44,371-i*55,String(i),'#526c7d',15)}out+=textSVG(430,385,'列','#1a6aab',18)+textSVG(45,22,'行','#1a6aab',18);if(d.point){const x=65+d.point[0]*55,y=365-d.point[1]*55;out+=`<circle cx="${x}" cy="${y}" r="7" fill="#087ee6"/>`+textSVG(x+13,y-12,d.label,'#154a6d',18,'start')}return out+'</svg>'}
 if(d.mode==='rotated'){out+=ln(245,210,420,210,'#087ee6',4,`marker-end="url(#${arrow})"`)+textSVG(443,216,'北','#075390',24)+ln(245,210,245,55,'#a9c2d1',2,'stroke-dasharray="6 6"')+ln(245,210,245,365,'#a9c2d1',2,'stroke-dasharray="6 6"')+textSVG(245,37,'？','#c67a00',30)+textSVG(245,405,'？','#c67a00',30)+textSVG(245,245,'观察点','#173044',17);return out+'</svg>'}
 let scale=d.mode==='plot'?40/(d.step||100):160/Math.max((d.step||100)*4,...(d.points||[]).map(p=>p.d),d.d||0);const stepPx=(d.step||100)*scale;const rings=Math.floor(172/stepPx);for(let i=1;i<=Math.min(rings,6);i++)out+=`<circle cx="245" cy="210" r="${i*stepPx}" fill="none" stroke="${i===rings?'#bdd4e2':'#d5e5ee'}" stroke-width="1.4"/>`+textSVG(245+i*stepPx*.707,210+i*stepPx*.707+4,`${i}`,'#687f8e',13);
 out+=ln(245,210,245,20,'#0d7bdd',2.5)+ln(245,210,245,399)+ln(53,210,437,210);out+=textSVG(245,17,'北','#0664ab',21)+textSVG(455,217,'东','#284a60',21)+textSVG(245,426,'南','#284a60',21)+textSVG(34,217,'西','#284a60',21);
 if(pro){for(let b=0;b<360;b+=10){const a=coord(b,163),z=coord(b,b%30===0?174:169);out+=ln(a.x,a.y,z.x,z.y,'#7e9cac',1);if(b%30===0){const t=coord(b,184);out+=textSVG(t.x,t.y+4,`${b}°`,'#4a6372',12)}}}
 if(d.mode==='circle')out+=`<circle cx="245" cy="210" r="${d.d*scale}" fill="#087ee610" stroke="#087ee6" stroke-width="3"/>`;
 (d.points||[]).forEach((p,i)=>{const z=coord(p.b,p.d*scale);out+=ln(245,210,z.x,z.y,i?'#57a217':'#dd8c0a',3)+`<circle cx="${z.x}" cy="${z.y}" r="6" fill="${i?'#498e0c':'#e7910b'}"/>`;const right=z.x>=245;out+=textSVG(Math.max(70,Math.min(430,z.x+(right?12:-12))),Math.max(31,Math.min(397,z.y-10)),p.name,'#23485f',18,right?'start':'end');if(p.arcStart&&p.arc!=null)out+=arcSVG(245,210,{'北':0,'东':90,'南':180,'西':270}[p.arcStart],p.b,`${p.arc}°`);if(reverse&&i===0){out+=ln(z.x,z.y,245,210,'#087ee6',3,`marker-end="url(#${arrow})" stroke-dasharray="7 4"`)+ln(z.x,z.y,z.x,z.y-45,'#087ee6',1.5)+textSVG(z.x,z.y-52,'北','#0664ab',13);}});
 if(point){const z=coord(point.b,point.d*scale);out+=ln(245,210,z.x,z.y,explain?'#418908':'#087ee6',3,'stroke-dasharray="6 4"')+`<circle cx="${z.x}" cy="${z.y}" r="9" fill="${explain?'#57b200':'#087ee6'}" stroke="white" stroke-width="3"/>`+textSVG(Math.max(70,Math.min(425,z.x+14)),Math.max(30,z.y-14),explain?'目标点':'我的落点',explain?'#367400':'#0054a1',17,z.x>360?'end':'start');}
 out+=`<circle cx="245" cy="210" r="6" fill="#173044" stroke="white" stroke-width="2"/>`+textSVG(235,236,d.origin||'观察点','#173044',17,'end');return out+'</svg>';
}
function mapDescription(d){if(d.mode==='lighthouse')return '两座已知灯塔的定位射线相交于一点的示意图。';if(d.mode==='route')return `路线图：${d.names.join('，')}。各段给出方向角和距离。`;if(d.mode==='grid')return `方格图，横向列，纵向行。${d.label||''}位置为第${d.point?.[0]}列、第${d.point?.[1]}行。`;if(d.mode==='rotated')return '北向箭头指向画面右边的地图。';if(d.mode==='circle')return `以${d.origin}为中心的等距离圆，每圈${d.step}米。`;return `以${d.origin||'学校'}为观察点，每圈${d.step}米。${(d.points||[]).map(p=>`${p.name}在${dirText(p.b)}方向${p.d}米处`).join('；')}`}
function routeSVG(d,arrow,explain){let pts=[{x:0,y:0}];d.segments.forEach(s=>{const p=pts[pts.length-1];pts.push({x:p.x+Math.sin(s.b*Math.PI/180)*s.d,y:p.y-Math.cos(s.b*Math.PI/180)*s.d})});const minx=Math.min(...pts.map(p=>p.x)),maxx=Math.max(...pts.map(p=>p.x)),miny=Math.min(...pts.map(p=>p.y)),maxy=Math.max(...pts.map(p=>p.y));const k=Math.min(305/Math.max(maxx-minx,100),265/Math.max(maxy-miny,100));pts=pts.map(p=>({x:95+(p.x-minx)*k,y:95+(p.y-miny)*k}));let s='';pts.forEach((p,i)=>{s+=ln(p.x-31,p.y,p.x+35,p.y,'#bed1df',1.2,'stroke-dasharray="4 3"')+ln(p.x,p.y+32,p.x,p.y-42,'#8bb6d4',1.4)+textSVG(p.x,p.y-49,'北','#1378b8',13);if(i<d.segments.length){const n=pts[i+1],seg=d.segments[i],part=dirParts(seg.b);s+=ln(p.x,p.y,n.x,n.y,'#087ee6',3.3,`marker-end="url(#${arrow})"`);const mx=(p.x+n.x)/2,my=(p.y+n.y)/2;s+=`<rect x="${mx-39}" y="${my-27}" width="78" height="24" rx="7" fill="#f7fbfd"/>`+textSVG(mx,my-9,seg.d+'米','#1a4c6d',15);if(part.angle)s+=arcSVG(p.x,p.y,{'北':0,'东':90,'南':180,'西':270}[part.dir[0]],seg.b,part.angle+'°',24);if(explain){s+=textSVG(mx,my+25,dirText(seg.b),'#346e07',14);}}s+=`<circle cx="${p.x}" cy="${p.y}" r="6" fill="${i===0?'#173044':'#57a514'}" stroke="white" stroke-width="2"/>`+textSVG(p.x,p.y+48,d.names[i]||`地点${i}`,'#173044',16);});return s}
function bindActions(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startModule(b.dataset.start));document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>start(Q.filter(q=>q.tags.includes(b.dataset.skill)).map(q=>q.id)));document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{const qs=page==='wrong'?Q.filter(q=>rec(q).everWrong&&(wrongAll||!rec(q).correct)):activeFilter==='all'?Q:Q.filter(q=>q.module===activeFilter);const ids=qs.map(q=>q.id);start(ids,ids.indexOf(b.dataset.question))});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));}
function action(a){
 if(a==='resume'){start((state.queue||[]).filter(id=>Q.some(q=>q.id===id)),Math.min(state.index||0,state.queue.length-1));return}
 if(a==='practice-visible'){start((activeFilter==='all'?Q:Q.filter(q=>q.module===activeFilter)).map(q=>q.id));return}
 if(a==='start-wrong'){start(Q.filter(q=>rec(q).everWrong&&(wrongAll||!rec(q).correct)).map(q=>q.id));return}
 if(a==='check'){check();return}
 if(a==='hint'){hintOpen=!hintOpen;$('hint').innerHTML=hintOpen?`<div class="hint-box">${current().hint}</div>`:'';document.querySelector('[data-action="hint"]').textContent=hintOpen?'收起提示':'给我一点提示';return}
 if(a==='explain'){$('solution').open=true;return}
 if(a==='retry'){draft={};feedback=null;hintOpen=false;question();bindActions();return}
 if(a==='prev'&&state.index>0){jump(state.index-1);return}
 if(a==='next'){if(state.index<state.queue.length-1)jump(state.index+1);else go('round');return}
 if(a==='round'){go('round');return}
 if(a==='round-wrong'||a==='round-unanswered'){const ids=state.queue.filter(id=>a==='round-wrong'?state.records[id]?.everWrong&&!state.records[id]?.correct:!state.records[id]?.attempts);start(ids);return}
 if(a==='place'){const r=draft.direction,g=gradeDirection(r,0,null);if(!g.valid||!Number.isFinite(numValue(r.distance))||numValue(r.distance)<=0){toast('请完整填写方向、0—90°角度和大于0的距离。');return}const q=current(),d=numValue(r.distance);if(d>q.diagram.step*4.3){toast(`地图范围为${q.diagram.step*4.3}米以内，请检查距离。`);return}draft.plot={b:bearing(r.dir,r.angle),d};mutate();updatePlot();return}
 if(a==='protractor'){protractor=!protractor;updatePlot();document.querySelector('[data-action="protractor"]').textContent=protractor?'收起量角辅助':'打开量角辅助';return}
 if(a==='clearplot'){draft.plot=null;mutate();updatePlot();return}
 if(a==='export'){const blob=new Blob([JSON.stringify({version:1,records:state.records,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='确定位置-学习进度.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('已导出学习进度。');return}
 if(a==='import'){const f=$('import-file');f.onchange=async()=>{const file=f.files[0];if(!file)return;try{if(file.size>1000000)throw Error();const data=JSON.parse(await file.text());if(!validState(data))throw Error();const allowed=new Set(Q.map(q=>q.id));const clean={};for(const [id,r] of Object.entries(data.records)){if(!allowed.has(id))continue;if(!r||typeof r!=='object'||!Number.isInteger(r.attempts)||r.attempts<0||r.attempts>100000||typeof r.correct!=='boolean'||typeof r.everWrong!=='boolean'||typeof r.firstCorrect!=='boolean')throw Error();clean[id]={attempts:r.attempts,correct:r.correct,everWrong:r.everWrong,firstCorrect:r.firstCorrect,last:Number(r.last)||0}}modal('导入进度',`将合并${Object.keys(clean).length}道题的记录；同一题保留更新时间较晚的结果。`,()=>{for(const [id,r] of Object.entries(clean))if(!state.records[id]||(r.last||0)>(state.records[id].last||0))state.records[id]=r;save();render();toast('进度已合并。')},'确认导入')}catch(e){toast('这个文件不是有效的学习进度备份。')}f.value=''};f.click();return}
 if(a==='reset'){modal('清空练习记录','这会删除当前浏览器的答题与错题记录。需要保留时，请先导出进度。',()=>{state.records={};state.queue=[];state.index=0;save();render();toast('练习记录已清空。')},'确认清空');return}
}
function modal(title,body,yes,label){const root=$('modal-root');root.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${title}</h2><p>${body}</p><div class="button-row"><button class="btn" id="modal-cancel">取消</button><button class="btn blue" id="modal-confirm">${label}</button></div></section></div>`;const prev=document.activeElement;const close=()=>{root.innerHTML='';prev?.focus()};$('modal-cancel').onclick=close;$('modal-confirm').onclick=()=>{close();yes()};$('modal-cancel').focus();root.onkeydown=e=>{if(e.key==='Escape'){close()}if(e.key==='Tab'){const a=$('modal-cancel'),b=$('modal-confirm');if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}};}
const API={DATA,grade,bearing,dirText,dirParts,numValue,mapSVG,answerSummary};window.POSITION_APP=API;
if(!window.__POSITION_TEST__){$('font-button').onclick=()=>{state.font=!state.font;syncChrome()};$('teacher-button').onclick=()=>{state.teacher=!state.teacher;syncChrome();if(page==='quiz'){question();bindActions()}};document.addEventListener('keydown',e=>{if(page!=='quiz'||$('modal-root').innerHTML||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type==='number'){e.preventDefault();check()}});render();}
</script></body></html>
