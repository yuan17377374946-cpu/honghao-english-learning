,"d":400,"name":"A","arcStart":"南","arc":30},{"b":330,"d":300,"name":"B","arcStart":"北","arc":30},{"b":60,"d":200,"name":"C","arcStart":"东","arc":30}]},"parts":[{"kind":"fields","label":"先推比例","fields":[{"label":"每圈代表","type":"number","answer":100,"unit":"米"}]},{"kind":"direction","label":"再报告B点","bearing":330,"distance":300}],"animationScene":"radar"},{"id":"h03","module":"ha卷","kind":"case","tags":["pair","angle","scale"],"title":"棋盘定位：数对与斜向移动","prompt":"棋盘约定先列后行，每个小正方形的对角线长2厘米。填出“车”的数对，再找它南偏东45°、6厘米处的棋子。","steps":["横轴是列，纵轴是行，“车”在第1列、第5行，数对为（1，5）。","6÷2＝3，要沿右下方向连续走3条小正方形对角线。","列数加3、行数减3，到达（4，2），对应“将”。"],"hint":"南偏东45°是右下方向；6厘米对应几条小格对角线？","source":"《好卷》第21—22页·填空第5题、选择第6题，同类改编","diagram":{"mode":"board","cols":8,"rows":6,"diagonal":2,"points":[{"x":1,"y":5,"name":"车"},{"x":4,"y":2,"name":"将"},{"x":6,"y":4,"name":"炮"},{"x":4,"y":6,"name":"卒"}]},"parts":[{"kind":"fields","label":"车的数对","fields":[{"label":"列","type":"number","answer":1,"unit":""},{"label":"行","type":"number","answer":5,"unit":""}]},{"kind":"choice","label":"沿斜向找棋子","options":["将","炮","卒"],"answer":0}],"animationScene":"board"},{"id":"h04","module":"ha卷","kind":"direction","tags":["turn","angle","equiv"],"title":"机器人右转：不是往回看","prompt":"机器人原来面向北偏东35°。原地向右转90°后，它面向什么方向？只填方向和角度。","steps":["“向右转”是从原朝向顺时针转动。","原朝向从北顺时针35°，转后为35＋90＝125°。","125°在东南区域，为东偏南35°，也可说南偏东55°。","这是转90°；两点互相看相当于反向180°，两种情况不能混用。"],"hint":"先在草图中转身，再从南或东重新看夹角。","source":"《好卷》第21—22页·选择第4题，同类改编","diagram":{"mode":"turn","origin":"机器人","step":100,"points":[{"b":35,"d":300,"name":"原朝向","arcStart":"北","arc":35}],"turn":90},"bearing":125,"distance":null,"animationScene":"turn"},{"id":"h05","module":"ha卷","kind":"plot","tags":["plot","scale","angle"],"title":"地图作图：方向和长度都要对","prompt":"以小宇家为观察点，标出书店的位置：西偏北30°、250米处。纸图比例为1厘米表示100米；网页上每圈也代表100米。","steps":["先在小宇家建立方向标，从正西向北量30°。","图上长度250÷100＝2.5厘米；网页对应第2.5圈。","沿射线定点并标注书店，再分别检查角度和距离。"],"hint":"网页按距离圈落点；纸上作图时要用量角器和尺子量2.5厘米。","source":"《好卷》第21—22页·操作第1题，同类改编","diagram":{"mode":"plot","origin":"小宇家"," function bearing(dir,a){const n=Number(a);return (({'北偏东':n,'东偏北':90-n,'东偏南':90+n,'南偏东':180-n,'南偏西':180+n,'西偏南':270-n,'西偏北':270+n,'北偏西':360-n,'正北':0,'正东':90,'正南':180,'正西':270}[dir]??NaN)+360)%360}
function diff(a,b){return Math.abs(((a-b+540)%360)-180)}
function dirText(b){b=(b+360)%360;if(b%90===0)return ['正北','正东','正南','正西'][b/90];if(b<90)return `北偏东${b}°`;if(b<180)return `东偏南${b-90}°`;if(b<270)return `南偏西${b-180}°`;return `西偏北${b-270}°`}
function dirParts(b){const t=dirText(b);return t.startsWith('正')?{dir:t,angle:''}:{dir:t.slice(0,3),angle:parseFloat(t.slice(3))}}
function numValue(v){if(typeof v==='number')return Number.isFinite(v)?v:NaN;const s=String(v??'').trim().replace(/[０-９．]/g,c=>c==='．'?'.':String(c.charCodeAt(0)-65296));return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN}
function gradeDirection(r,b,d){if(!r?.dir)return {valid:false};const a=r.dir.startsWith('正')?0:numValue(r.angle);if(!Number.isFinite(a)||a<0||a>90)return {valid:false};if(d!==null&&d!==undefined&&!Number.isFinite(numValue(r.distance)))return {valid:false};return {valid:true,correct:diff(bearing(r.dir,a),b)<.001&&(d===null||d===undefined||Math.abs(numValue(r.distance)-d)<.001)}}
function grade(q,r){
 if(q.kind==='case')return gradeCase(q,r);if(q.kind==='crossplot')return gradeCross(q,r);
 if(q.kind==='choice'){if(!r?.length)return {valid:false};const expected=Array.isArray(q.answer)?q.answer:[q.answer];return {valid:true,correct:r.length===expected.length&&expected.every(v=>r.includes(v))}}
 if(q.kind==='fields'){if(!r||r.length!==q.fields.length||r.some(v=>String(v).trim()===''))return {valid:false};const wrong=[];q.fields.forEach((f,i)=>{const n=numValue(r[i]);if(f.type==='number'){if(!Number.isFinite(n)||Math.abs(n-f.answer)>.001)wrong.push(i)}else{const opts=Array.isArray(f.answer)?f.answer:[f.answer];if(!opts.some(a=>String(a).replace(/\s/g,'')===String(r[i]).replace(/\s/g,'')))wrong.push(i)}});return {valid:true,correct:!wrong.length,wrong}}
 if(q.kind==='direction')return gradeDirection(r,q.bearing,q.distance);
 if(q.kind==='plot'){if(!r||!Number.isFinite(r.b)||!Number.isFinite(r.d))return {valid:false};return {valid:true,correct:diff(r.b,q.bearing)<=4&&Math.abs(r.d-q.distance)<=q.diagram.step*.18}}
 if(q.kind==='route'){if(!r||r.length!==q.segments.length)return {valid:false};const gs=q.segments.map((s,i)=>gradeDirection(r[i],s.b,s.d));return {valid:gs.every(g=>g.valid),correct:gs.every(g=>g.correct),wrong:gs.flatMap((g,i)=>g.correct?[]:[i])}}
 if(q.kind==='sort'){return {valid:!!r&&r.length===q.answer.length,correct:!!r&&r.every((v,i)=>v===q.answer[i])}}
 if(q.kind==='match'){if(!r||r.some(v=>!v))return {valid:false};const wrong=q.pairs.flatMap((p,i)=>r[i]===p[1]?[]:[i]);return {valid:true,correct:!wrong.length,wrong}}
 return {valid:false};
}

function check(){const q=current(),g=grade(q,response(q));document.querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));if(!g.valid){feedback={type:'neutral',text:q.kind==='plot'?'请先在地图上落一个点。':q.kind==='choice'?'请先选择答案。':q.kind==='fields'?'请把所有空格填完整。':q.kind==='case'?'请完成各小问，包括选择、填空或落点。':q.kind==='crossplot'?'请为两个观察点分别选择方向并填好角度。':q.kind==='match'?'请把每一项都配对。':'请选方向并填写距离；偏向角填0—90°，正方向不需要填角度。'};showFeedback(false);const missing=firstMissingInput();if(missing)missing.focus();return}const old=rec(q);if(!draft.checkedCorrect||!old.correct){state.records[q.id]={...old,attempts:(old.attempts||0)+1,firstCorrect:old.attempts?old.firstCorrect:g.correct,correct:g.correct,everWrong:old.everWrong||!g.correct,last:Date.now()};}draft.checkedCorrect=g.correct;draft.dirty=false;feedback=g.correct?{type:'good',text:'答对了！可以展开分步图解，讲一讲你是怎么判断的。'}:{type:'bad',text:`还需要调整${g.wrong?.length?'，请检查标出的项目':''}。${q.hint}\n你可以继续修改，也可以展开分步图解。`};if(g.wrong)g.wrong.forEach(i=>document.querySelector(`[data-${q.kind==='fields'?'field':q.kind==='route'?'route':q.kind==='case'?'case':q.kind==='crossplot'?'cross':'match'}-row="${i}"]`)?.classList.add('invalid'));showFeedback(g.correct);rememberDraft(true);syncChrome();document.querySelectorAll('[data-index]').forEach(b=>{const r=state.records[state.queue[Number(b.dataset.index)]]||{};b.classList.toggle('correct',!!r.correct);b.classList.toggle('wrong',!!r.everWrong&&!r.correct);b.classList.toggle('has-draft',draftStatus(state.queue[Number(b.dataset.index)])==='有草稿');b.setAttribute('aria-label',`第${Number(b.dataset.index)+1}题${draftStatus(state.queue[Number(b.dataset.index)])}`)});if($('group-answered'))$('group-answered').textContent=`本组已答 ${counts(state.queue.map(id=>Q.find(q=>q.id===id)).filter(Boolean)).answered} 题`;}
function mutate(){draft.checkedCorrect=false;draft.dirty=true;feedback=null;if($('feedback'))$('feedback').innerHTML='';rememberDraft()}
function bindQuiz(){const q=current();bindWorkbook(q);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.choice);draft.choice=Array.isArray(q.answer)?(draft.choice.includes(i)?draft.choice.filter(v=>v!==i):[...draft.choice,i]):[i];mutate();document.querySelectorAll('[data-choice]').forEach(el=>{const selected=draft.choice.includes(Number(el.dataset.choice));el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',selected)})});document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{draft.fields[Number(el.dataset.field)]=el.value;mutate()});bindDirectionInputs();document.querySelectorAll('[data-match]').forEach(el=>el.onchange=()=>{draft.match[Number(el.dataset.match)]=el.value;mutate()});document.querySelectorAll('[data-sort]').forEach(el=>el.onclick=()=>{const [i,d]=el.dataset.sort.split(',').map(Number);[sortOrder[i],sortOrder[i+d]]=[sortOrder[i+d],sortOrder[i]];draft.sortChanged=true;mutate();question();bindActions()});document.querySelectorAll('[data-index]').forEach(el=>el.onclick=()=>jump(Number(el.dataset.index)));if(q.kind==='plot'){$('plot-map')?.addEventListener('click',e=>{const svg=e.currentTarget;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const loc=pt.matrixTransform(svg.getScreenCTM().inverse());const dx=loc.x-245,dy=loc.y-210;const radius=Math.hypot(dx,dy);if(radius>182)return;draft.plot={b:(Math.atan2(dx,-dy)*180/Math.PI+360)%360,d:radius/40*q.diagram.step};mutate();updatePlot()});}}
function bindDirectionInputs(){for(const kind of ['dir','angle','distance'])document.querySelectorAll(`[data-${kind}]`).forEach(el=>el.addEventListener(kind==='dir'?'change':'input',()=>{const key=el.dataset[kind],r=key.startsWith('route-')?draft.route[Number(key.split('-')[1])]:draft.direction;r[kind]=el.value;if(kind==='dir'){const inp=el.parentElement.querySelector('[data-angle]');inp.disabled=el.value.startsWith('正');if(inp.disabled){inp.value='';r.angle=''}}mutate()}));}
function updatePlot(){const q=current(),frame=$('question-map');frame.querySelector('svg').outerHTML=mapSVG(q.diagram,false,draft.plot,protractor);$('plot-location').textContent=plotLocation();const svg=$('plot-map');svg?.addEventListener('click',e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse()),dx=p.x-245,dy=p.y-210,r=Math.hypot(dx,dy);if(r>182)return;draft.plot={b:(Math.atan2(dx,-dy)*180/Math.PI+360)%360,d:r/40*q.diagram.step};mutate();updatePlot()})}
function jump(i){rememberDraft(true);state.index=i;draft={};feedback=null;hintOpen=false;protractor=false;render();window.scrollTo({top:0,behavior:'instant'})}
function wrong(){const qs=Q.filter(q=>rec(q).everWrong&&(wrongAll||!rec(q).correct));$('app').innerHTML=`<div class="section-title"><div><h1>错题回练</h1><p class="muted" style="margin-top:10px">做错过的题会留下记录。重新答对后，移入“已订正”。</p></div>${qs.length?'<button class="btn primary" data-action="start-wrong">开始回练</button>':''}</div><div class="filterbar"><button data-wrong="pending" class="${!wrongAll?'active':''}">待回练 ${counts().wrong}</button><button data-wrong="all" class="${wrongAll?'active':''}">全部错题记录 ${Q.filter(q=>rec(q).everWrong).length}</button></div>${qs.length?`<div class="question-list">${qs.map(q=>`<button data-question="${q.id}"><span><b>${q.title}</b><br><small>${q.tags.map(skillName).join(' / ')}</small></span><span class="tag">${rec(q).correct?'已订正':'待回练'}</span></button>`).join('')}</div>`:'<div class="empty"><h2>这里暂时没有待回练的题</h2><p>先去做一组练习。需要重练的题会自动收集到这里。</p><button class="btn primary" data-view="practice">去选一组题</button></div>'}`;document.querySelectorAll('[data-wrong]').forEach(el=>el.onclick=()=>{wrongAll=el.dataset.wrong==='all';render()})}
function report(){const c=counts(),cc=counts(visibleQuestions('core')),ec=counts(visibleQuestions('exit'));$('app').innerHTML=`<div class="section-title"><div><h1>每一步都有记录</h1><p class="muted" style="margin-top:10px">先看课堂主线的完成情况，需要时再查看完整覆盖。</p></div></div><div class="round-report"><div><strong>${cc.correct}/8</strong>主线已答对</div><div><strong>${ec.correct}/2</strong>出口已答对</div><div><strong>${c.wrong}</strong>待回练</div></div><section class="panel"><h2 style="margin-bottom:14px">课堂四个重点</h2><div class="table-wrap"><table class="report-table"><thead><tr><th>课堂重点</th><th>对应题数</th><th>已练习</th><th>已答对</th><th>继续练习</th></tr></thead><tbody>${CORE_PHASES.map((p,i)=>{const qs=p.ids.map(id=>Q.find(q=>q.id===id)),c=counts(qs);return `<tr><td>${p.title}</td><td>2</td><td>${c.answered}</td><td>${c.correct}</td><td><button class="btn small light" data-core-phase="${i}">回看这一段</button></td></tr>`}).join('')}</tbody></table></div><details class="focus-extra"><summary>查看完整知识点覆盖</summary>${fullCoverageHTML()}</details></section><section class="panel" style="margin-top:22px"><h2>保存与备份</h2><p class="muted small-text" style="margin:10px 0 16px">进度只保存在当前设备的浏览器。换设备前可导出备份，到另一台设备导入。清除浏览器数据也会清除这里的记录。</p><div class="button-row"><button class="btn" data-action="export">导出进度</button><button class="btn" data-action="import">导入进度</button><button class="btn danger" data-action="reset">清空练习记录</button></div><input type="file" accept="application/json,.json" id="import-file" hidden></section><section class="panel" style="margin-top:22px"><h3>题目与范围</h3><p class="muted small-text">主线8题、检查2题及4道按需加练，参考用户上传的《好卷数学BS6上》第21—22页考法重新编写，题旁标有对应题号。其余教材配套练习保留在完整题库。依据北师大六上课本第67—72页。</p><p class="small-text"><a href="https://zy.21cnjy.com/26322361" target="_blank" rel="noopener">配套教学参考</a> · <a href="https://zy.21cnjy.com/26359101" target="_blank" rel="noopener">公开题型参考</a></p></section>`;}
function round(){const qs=state.queue.map(id=>Q.find(q=>q.id===id)).filter(Boolean),c=counts(qs);$('app').innerHTML=`<section class="panel"><h1>${isChapterQueue()?'本章14题讲练记录':isCoreQueue()?'主线8题回顾':isExitQueue()?'独立检查结果':'本组练习记录'}</h1><p class="muted" style="margin-top:12px">先看哪些题还没练，再回看需要调整的地方。</p><div class="round-report"><div><strong>${c.correct}</strong>已答对</div><div><strong>${c.wrong}</strong>待回练</div><div><strong>${qs.length-c.answered}</strong>未练习</div></div><div class="button-row">${isCoreQueue()?'<button class="btn blue" data-start="exit">用2题独立检查</button>':''}${c.wrong?'<button class="btn primary" data-action="round-wrong">只练本组错题</button>':''}${qs.length>c.answered?'<button class="btn blue" data-action="round-unanswered">完成未练习题</button>':''}<button class="btn" data-view="home">返回章节目录</button></div></section><div class="question-list" style="margin-top:22px">${qs.map((q,i)=>`<button data-resume-index="${i}"><span>${i+1}. ${q.title}</span><span class="tag">${draftStatus(q.id)}</span></button>`).join('')}</div>`;document.querySelectorAll('[data-resume-index]').forEach(b=>b.onclick=()=>{page='quiz';jump(Number(b.dataset.resumeIndex))})}

 if(pro){for(let b=0;b<360;b+=10){const a=coord(b,163),z=coord(b,b%30===0?174:169);out+=ln(a.x,a.y,z.x,z.y,'#7e9cac',1);if(b%30===0){const t=coord(b,184);out+=textSVG(t.x,t.y+4,`${b}°`,'#4a6372',12)}}}

function bindWorkbookMap(q){if(q.kind!=='case'||!q.parts.some(p=>p.kind==='plot'))return;const i=q.parts.findIndex(p=>p.kind==='plot');$('plot-map')?.addEventListener('click',e=>{const svg=e.currentTarget,pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const v=pt.matrixTransform(svg.getScreenCTM().inverse()),x=v.x-245,y=v.y-210,d=Math.hypot(x,y);if(d>182)return;draft.parts[i]={b:(Math.atan2(x,-y)*180/Math.PI+360)%360,d:d/40*q.diagram.step};mutate();refreshWorkbookMap();$('case-plot-note').textContent='已落点，可点击新位置修改。'});}

rkbookMap()}));bindWorkbookMap(q);}
function crossVector(b){return {x:Math.sin(b*Math.PI/180),y:-Math.cos(b*Math.PI/180)}}
function crossing(d,r){if(!r?.every(v=>gradeDirection(v,0,null).valid))return null;const [a,b]=d.observers,[u,v]=r.map(z=>crossVector(bearing(z.dir,numValue(z.angle)||0))),dx=b.x-a.x,dy=b.y-a.y,det=u.x*v.y-u.y*v.x;if(Math.abs(det)<1e-8)return null;const t=(dx*v.y-dy*v.x)/det,s=(dx*u.y-dy*u.x)/det;if(t<0||s<0)return null;return {x:a.x+t*u.x,y:a.y+t*u.y}}
function localCompass(x,y){return ln(x-35,y,x+35,y,'#b6cddd',1.2)+ln(x,y+30,x,y-55,'#087ee6',1.8)+textSVG(x,y-63,'北','#0765a9',16)}
function crossFigure(d,r,explain=false){let out='';d.observers.forEach((p,i)=>{out+=localCompass(p.x,p.y)+`<circle cx="${p.x}" cy="${p.y}" r="7" fill="#173044"/>`+textSVG(p.x,p.y+29,p.name,'#173044',18);if(r?.[i]&&gradeDirection(r[i],0,null).valid){const b=bearing(r[i].dir,numValue(r[i].angle)||0),v=crossVector(b),color=i?'#087ee6':'#dd8c0a';out+=ln(p.x,p.y,p.x+v.x*380,p.y+v.y*380,color,3);const start={北:0,东:90,南:180,西:270}[r[i].dir[0]];if(!r[i].dir.startsWith('正'))out+=arcSVG(p.x,p.y,start,b,r[i].angle+'°',35)}});const hit=crossing(d,r);if(hit&&hit.x>20&&hit.x<480&&hit.y>25&&hit.y<400)out+=`<circle cx="${hit.x}" cy="${hit.y}" r="9" fill="#57b200" stroke="white" stroke-width="3"/>`+textSVG(hit.x,hit.y-19,explain?d.target:'我的交点','#337400',19);else if(r?.every(v=>gradeDirection(v,0,null).valid))out+=textSVG(250,40,'两条向前的射线在图内没有交点','#a12f37',16);return `<g clip-path="url(#cross-frame)">${out}</g>`}
function workbookMap(d,explain,point,arrow){if(!['board','intersection','turn','campus'].includes(d.mode))return null;let s=`<svg role="img" aria-label="${esc(workbookMapDescription(d))}" viewBox="0 0 500 440" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="cross-frame"><rect x="8" y="8" width="484" height="424"/></clipPath></defs><rect width="500" height="440" fill="#f7fbfd"/>`;
 if(d.mode==='board'){for(let x=0;x<=d.cols;x++){const xx=55+x*46;s+=ln(xx,370,xx,370-d.rows*46,'#c6dbe7',1.3)+textSVG(xx,398,x,'#4f6979',17)}for(let y=0;y<=d.rows;y++){const yy=370-y*46;s+=ln(55,yy,55+d.cols*46,yy,'#c6dbe7',1.3)+textSVG(35,yy+6,y,'#4f6979',17)}s+=textSVG(460,398,'列','#0767b4',18)+textSVG(35,55,'行','#0767b4',18);d.points.forEach(p=>{const x=55+p.x*46,y=370-p.y*46;s+=`<circle cx="${x}" cy="${y}" r="17" fill="#fff" stroke="#087ee6" stroke-width="2.5"/>`+textSVG(x,y+7,p.name,'#064c82',21)});if(explain)s+=ln(101,140,239,278,'#57a514',4,'stroke-dasharray="7 4"')+textSVG(175,220,'3条对角线','#337400',17);s+=textSVG(250,426,'每条小格对角线长'+d.diagonal+'厘米','#536b7a',16);}

 if(d.mode==='turn'){const p=d.points[0],z=coord(p.b,145);s+=localCompass(245,240)+ln(245,240,z.x,z.y+30,'#dd8c0a',4)+arcSVG(245,240,0,p.b,p.arc+'°',45)+textSVG(z.x+10,z.y+22,'原朝向','#9a6300',18,'start');if(explain){const end=coord((p.b+d.turn)%360,145,245,240);s+=ln(245,240,end.x,end.y,'#087ee6',4)+arcSVG(245,240,p.b,(p.b+d.turn)%360,'右转90°',88)+textSVG(end.x,end.y+30,'转后方向','#075b9b',18)}s+=`<circle cx="245" cy="240" r="8" fill="#173044"/>`+textSVG(245,360,'从原朝向顺时针右转90°','#526b7c',18)}
 if(d.mode==='campus'){d.edges.forEach(([a,b,dist])=>{const p=d.nodes[a],q=d.nodes[b],x=(p.x+q.x)/2,y=(p.y+q.y)/2;s+=ln(p.x,p.y,q.x,q.y,'#087ee6',4)+`<rect x="${x-37}" y="${y-12}" width="74" height="25" rx="7" fill="white"/>`+textSVG(x,y+7,dist+'米','#173044',16)});d.nodes.forEach(p=>{s+=`<circle cx="${p.x}" cy="${p.y}" r="7" fill="#173044"/>`+textSVG(p.x,p.y+32,p.name,'#173044',18)});if(explain)s+=ln(85,305,245,305,'#57a514',6)+ln(245,305,245,110,'#57a514',6);s+=textSVG(250,405,'只沿蓝色道路行走','#526b7a',16)}return s+'</svg>';}

function workbookAnimationModel(scene,q){const d=q?.diagram;if(!['radar','board','intersection','turn','campus','opposite','displacement'].includes(scene))return null;const m={scene,diagram:d,origin:d?.origin||'观察点',unitStep:d?.step||100};if(scene==='radar'){m.diagram=d?.hideScale?d:Q.find(q=>q.id==='h02').diagram;const dd=m.diagram,known=dd.points[0],n=known.d/dd.step,target=dd.points[1];m.steps=[`先找到已知点${known.name}，它在第${n}圈，距离为${known.d}米。`,`平均每圈：${known.d}÷${n}＝${dd.step}米。`,`目标${target.name}在第${target.d/dd.step}圈，实际距离为${target.d}米。`,`从角弧起始边读方向，完整描述目标位置。`];}
 if(scene==='board'){m.diagram=d?.mode==='board'?d:Q.find(q=>q.id==='h03').diagram;m.steps=['先确认横轴列数、纵轴行数。','找到车：第1列、第5行，记作（1，5）。','南偏东45°是右下方；6÷2＝3，移动3条小格对角线。','列加3、行减3，到（4，2），这里是将。'];}

 if(scene==='turn'){m.diagram=d?.mode==='turn'?d:Q.find(q=>q.id==='h04').diagram;const b=m.diagram.points[0].b;m.steps=[`原朝向为北偏东${b}°，先固定地图北向。`,'从原朝向顺时针转90°，不是从正北重新转90°。',`朝向从北顺时针为${b}＋90＝${b+90}°。`,`转后为东偏南${b}°，也可说南偏东${90-b}°。`];}
 if(scene==='opposite'||scene==='displacement'){m.diagram=d||Q.find(q=>q.id===(scene==='opposite'?'h10':'h11')).diagram;m.steps=scene==='opposite'?['从A点出发，先画两个方向。','把北偏东60°改写为东偏北30°。','另一条是西偏南30°，两个方向相反，A在B、C之间。','所以B、C距离是40＋30＝70米。']:['按三段路线画出草图，先分清路程与直线距离。','第一段与第三段方向相反，长度都是500米。','两段等长、反向的移动正好抵消。','起点到终点的移动等于中间一段：离家300米；沿路走了1300米。'];}
 if(scene==='campus'){m.diagram=d?.mode==='campus'?d:Q.find(q=>q.id==='h12').diagram;m.steps=['只能走图中已给道路，不能凭空画直线穿过去。','经广场：200＋330＝530米。','经广场、湖、教学楼：200＋100＋300＋260＝860米。','比较总路程，530＜860，所以经广场最近。'];}m.max=m.steps.length-1;return m;}
function workbookAnimationSVG(m,t=anim.position){if(!['radar','board','intersection','turn','campus','opposite','displacement'].includes(m.scene))return null;const d=m.diagram;if(m.scene==='opposite'){let svg=mapSVG(d,false);if(t>=3)svg=svg.replace('</svg>',textSVG(250,390,'B、C相距40＋30＝70米','#327100',21)+'</svg>');return svg;}if(m.scene==='displacement'){let svg=mapSVG(d,false);if(t>=2){const ps=routeCoordinates(d);svg=svg.replace('</svg>',ln(ps[0].x,ps[0].y,ps[3].x,ps[3].y,'#57a514',5,'stroke-dasharray="7 4"')+textSVG(250,405,'起点到终点：300米','#327100',21)+'</svg>')}return svg;}if(m.scene==='intersection'){const r=d.observers.map((p,i)=>t>=i+1?{...dirParts(p.b)}:{dir:'',angle:''});return workbookMap(d,t>=3,r).replace('我的交点',t>=3?'图书馆':'交点');}if(m.scene==='radar'){let svg=mapSVG(d,false);if(t>=1)svg=svg.replace('</svg>',`<rect x="85" y="355" width="330" height="46" rx="10" fill="#eaf7da"/>${textSVG(250,384,'每圈'+d.step+'米','#327100',23)}</svg>`);if(t>=2){const p=d.points[1],z=coord(p.b,p.d/d.step*40);svg=svg.replace('</svg>',`<circle cx="${z.x}" cy="${z.y}" r="12" fill="none" stroke="#57a514" stroke-width="4"/>`+textSVG(250,35,'B距中心'+p.d+'米','#327100',20)+'</svg>')}return svg;}if(m.scene==='turn'){let svg=workbookMap(d,false,null);const b=d.points[0].b+d.turn*clamp(t),p=coord(b,145,245,240);return svg.replace('</svg>',ln(245,240,p.x,p.y,'#087ee6',4)+(t>=1?arcSVG(245,240,d.points[0].b,b,'右转90°',88):'')+'</svg>');}if(m.scene==='board'){let svg=workbookMap(d,false),f=clamp(t-1),x=101+138*f,y=140+138*f;return svg.replace('</svg>',(t>=1?ln(101,140,x,y,'#57a514',4)+`<circle cx="${x}" cy="${y}" r="22" fill="none" stroke="#57a514" stroke-width="4"/>`:'')+'</svg>');}return workbookMap(d,t>=3,null);}

function sanitizeWorkbookDraft(q,raw){const scalar=v=>typeof v==='string'||typeof v==='number'?String(v).slice(0,32):'',dir=v=>({dir:DIRS.includes(v?.dir)?v.dir:'',angle:scalar(v?.angle),distance:scalar(v?.distance)});const clean=(p,r)=>{if(p.kind==='fields')return p.fields.map((_,i)=>scalar(r?.[i]));if(p.kind==='direction')return dir(r);if(p.kind==='route')return p.segments.map((_,i)=>dir(r?.[i]));if(p.kind==='choice')return (Array.isArray(r)?r:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<p.options.length);if(p.kind==='plot'&&Number.isFinite(r?.b)&&Number.isFinite(r?.d)&&r.d>=0&&r.d<=p.diagram.step*4.5)return {b:r.b,d:r.d};return null};const d={id:q.id,dirty:!!raw.dirty,updatedAt:Number(raw.updatedAt)||0,casePlotDirection:dir(raw.casePlotDirection)};if(q.kind==='case')d.parts=q.parts.map((p,i)=>clean(p,raw.parts?.[i]));if(q.kind==='crossplot')d.cross=q.diagram.observers.map((_,i)=>dir(raw.cross?.[i]));d.checkedCorrect=!!raw.checkedCorrect&&grade(q,d.parts||d.cross).correct;if(d.checkedCorrect)d.dirty=false;return d;}

function corePhase(q){return CORE_PHASES.find(p=>p.ids.includes(q.id))}
function visibleQuestions(filter){if(filter==='core')return CORE_IDS.map(id=>Q.find(q=>q.id===id));if(filter==='workbook')return Q.filter(q=>q.source);if(filter==='extra')return ['h09','h10','h11','h12'].map(id=>Q.find(q=>q.id===id));if(filter==='exit')return EXIT_IDS.map(id=>Q.find(q=>q.id===id));return filter==='all'?Q:Q.filter(q=>q.module===filter)}
function focusCue(q){if(isChapterQueue())return `<div class="focus-cue ${EXIT_IDS.includes(q.id)?'exit':''}"><strong>${EXIT_IDS.includes(q.id)?'独立检查：先完成，再看图解。':'本题重点：'+(CORE_PURPOSE[q.id]||q.hint)}</strong></div>`;if(isCoreQueue()){const p=corePhase(q),i=CORE_PHASES.indexOf(p);return `<div class="focus-cue"><strong>本题只抓：${CORE_PURPOSE[q.id]}</strong></div>`}if(isExitQueue())return '<div class="focus-cue exit"><strong>出口检查：先独立完成，再展开提示和讲解。</strong></div>';return ''}
function lessonEntry(){return {label:'从第1题开始',ids:CHAPTER_IDS,index:0}}
function home(){$('app').innerHTML=`<div class="chapter-home"><header class="chapter-heading"><div><p class="lesson-eyebrow">北师大六上 · 参考《好卷》第21—22页</p><h1>确定位置</h1><p class="chapter-intro">按知识点选题，或从第1题顺着讲。</p></div><button class="btn primary" data-tonight>从第1题开始</button></header><p class="chapter-total">全部14道精选题：<strong>8道重点讲练</strong>、4道综合加练、2道独立检查</p><div class="chapter-groups">${CHAPTER_GROUPS.map((g,i)=>`<section class="chapter-group"><header><span class="chapter-group-number">${i+1}</span><div><h2>${g.title}</h2><p>${g.method}</p></div><span class="chapter-group-count">${g.ids.length}题</span></header><ol>${g.ids.map(id=>{const n=CHAPTER_IDS.indexOf(id)+1;return `<li><button data-chapter-question="${id}"><span class="chapter-question-number">${n}</span><span class="chapter-question-name">${CHAPTER_TITLES[id]}</span><span class="chapter-role ${CORE_IDS.includes(id)?'core':EXIT_IDS.includes(id)?'test':'extra'}">${chapterRole(id)}</span><span class="chapter-state">${draftStatus(id)}</span></button></li>`}).join('')}</ol></section>`).join('')}</div><p class="chapter-footnote">重点讲练先讲透，综合加练按掌握情况选做。图解和动画都在对应题目里。</p></div>`}
function learn(){$('app').innerHTML=`<div class="section-title"><div><h1>四条关键方法</h1><p class="muted" style="margin-top:10px">先记住每一条该怎么用，再做对应的两道代表题。</p></div></div><div class="focus-methods">${CORE_PHASES.map((p,i)=>`<article class="panel"><h2>${i+1}. ${p.title}</h2><p class="focus-rule">${p.rule}</p><p class="muted small-text">容易混：${p.trap}</p><button class="btn small light" data-core-phase="${i}" style="margin-top:15px">做这一段的2题</button></article>`).join('')}</div><details class="focus-extra"><summary>展开完整知识清单</summary><div class="knowledge-grid" style="margin-top:16px">${DATA.skills.map(s=>`<article class="knowledge-card"><h3>${s[1]}</h3><p>${s[2]}</p><details><summary>展开讲解与例子</summary><div><p>${lessons[s[0]]?.[0]||s[2]}</p><p>${lessons[s[0]]?.[1]||'先明确题目条件，再根据图示选择方法。'}</p></div></details><button class="btn small light" data-skill="${s[0]}">按需补练</button></article>`).join('')}</div></details>`}
function bank(){if(['core','exit','workbook'].includes(activeFilter))activeFilter='extra';const visible=visibleQuestions(activeFilter);$('app').innerHTML=`<div class="section-title"><div><h1>补充练习</h1><p class="muted" style="margin-top:10px">今晚的讲练结束后，再按需要选做。</p></div><button class="btn primary" data-action="practice-visible">练这一组</button></div><label class="extra-select" for="extra-topic">选择内容<select id="extra-topic">${[['extra','4道综合加练'],...DATA.modules.map(m=>[m[0],m[1]]),['test','整章检测'],['all','全部题目']].map(m=>`<option value="${m[0]}" ${activeFilter===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select></label><div class="question-list">${visible.map((q,i)=>`<button data-question="${q.id}"><span><b>${i+1}. ${q.title}</b><br><small>${TYPES[q.kind]} · ${q.tags.map(skillName).join(' / ')}</small></span><span class="tag">${draftStatus(q.id)}</span></button>`).join('')}</div>`;$('extra-topic').onchange=e=>{activeFilter=e.target.value;render()}}
function bindFocusActions(){document.querySelectorAll('[data-chapter-question]').forEach(b=>b.onclick=()=>start(CHAPTER_IDS,CHAPTER_IDS.indexOf(b.dataset.chapterQuestion)));document.querySelectorAll('[data-tonight]').forEach(b=>b.onclick=()=>{const e=lessonEntry();start(e.ids,e.index)});document.querySelectorAll('[data-extra-bank]').forEach(b=>b.onclick=()=>{activeFilter='extra';go('practice')});document.querySelectorAll('[data-core-phase]').forEach(b=>b.onclick=()=>start(CORE_IDS,Number(b.dataset.corePhase)*2));document.querySelectorAll('[data-all-bank]').forEach(b=>b.onclick=()=>{activeFilter='all';go('practice')})}
function fullCoverageHTML(){return `<div class="table-wrap"><table class="report-table"><thead><tr><th>知识点</th><th>对应题数</th><th>已练习</th><th>已答对</th><th>补练</th></tr></thead><tbody>${DATA.skills.map(s=>{const qs=Q.filter(q=>q.tags.includes(s[0])),c=counts(qs);return `<tr><td>${s[1]}</td><td>${qs.length}</td><td>${c.answered}</td><td>${c.correct}</td><td><button class="btn small light" data-skill="${s[0]}">按需补练</button></td></tr>`}).join('')}</tbody></table></div>`}

const API={DATA,gradeCase,gradeCross,crossing,workbookMap,caseForm,sanitizeWorkbookDraft,grade,bearing,dirText,dirParts,numValue,mapSVG,answerSummary,animationModel,animationValues,animationRoutePoints,animationSVG,hasDraftInput,draftStatus,directionPairText,cleanDraft,CORE_IDS,EXIT_IDS,CORE_PHASES,CHAPTER_IDS,CHAPTER_GROUPS,visibleQuestions,isCoreQueue,isChapterQueue,lessonEntry};window.POSITION_APP=API;
if(!window.__POSITION_TEST__){$('font-button').onclick=()=>{state.font=!state.font;syncChrome()};$('teacher-button').onclick=()=>{state.teacher=!state.teacher;syncChrome();if(page==='quiz'){question();bindActions()}};window.addEventListener('pagehide',()=>rememberDraft(true));document.addEventListener('keydown',e=>{if(page!=='quiz'||$('modal-root').innerHTML||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type==='number'){e.preventDefault();const inputs=[...$('answer-block').querySelectorAll('input:not(:disabled),select:not(:disabled)')],i=inputs.indexOf(e.target),next=inputs.slice(i+1).find(el=>!String(el.value).trim());if(next)next.focus();else check()}});render();}
</script></body></html>
