const DATA=JSON.parse(document.getElementById('phonics-data').textContent);

const KEY='honghao-phonics-v1';let loaded={};try{loaded=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}

if(!Array.isArray(state.words))state.words=[];if(!Array.isArray(state.learned))state.learned=[];

function stopAudio(){sequence++;speakingWord='';if('speechSynthesis'in window)speechSynthesis.cancel()}

function voice(){return voices.find(v=>v.voiceURI===state.voiceURI)||voices.find(v=>v.lang.toLowerCase()==='en-gb')||voices.find(v=>v.lang.toLowerCase().startsWith('en-gb'))||voices[0]}
function updateVoiceUI(){const el=document.querySelector('#voice-select');if(el)el.innerHTML=voiceOptions();const text=document.getElementById('voice-info');if(text)text.textContent=voice()?`当前：${voice().name} · ${voice().lang}。音标按常见英式，设备朗读口音可能不同。`:'此浏览器暂未提供英语语音；可在有英语语音的设备上朗读，或由老师示范。'}
function voiceOptions(){const chosen=voice()?.voiceURI;return voices.length?voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===chosen?'selected':''}>${esc(v.lang+' · '+v.name)}</option>`).join(''):'<option value="">设备英语语音</option>'}
function speakOne(text,rate=state.rate,done){if(!('speechSynthesis'in window)){toast('当前浏览器不支持语音朗读。');done?.();return}if(!voices.length)loadVoices();const selected=voice();if(!selected){toast('设备暂未提供英语语音，请检查系统英语语音设置，或由老师示范。');done?.();return}const u=new SpeechSynthesisUtterance(text);u.voice=selected;u.lang=selected.lang;u.rate=rate;u.onstart=()=>{speakingWord=text;document.querySelectorAll('[data-action="listen"]').forEach(b=>{if(b.dataset.word===text)b.textContent='正在朗读…'})};u.onend=()=>{speakingWord='';document.querySelectorAll('[data-action="listen"]').forEach(b=>{b.textContent='▷ 听单词'});done?.()};u.onerror=(event)=>{speakingWord='';document.querySelectorAll('[data-action="listen"]').forEach(b=>b.textContent='▷ 听单词');if(!['canceled','interrupted'].includes(event.error))toast('语音未能播放，可重试或换一个英语声音。');done?.()};speechSynthesis.speak(u)}

function mark(word,g,mask=state.mask){const s=word.toLowerCase(),pat=g.letters;let ranges=[];if(pat.includes('-')){const a=pat[0],i=s.lastIndexOf(a,s.length-2);if(i>=0)ranges=[[i,i+1],[s.length-1,s.length]]}else{const i=s.indexOf(pat);if(i>=0)ranges=[[i,i+pat.length]]}let result='',at=0;for(const [a,b]of ranges){result+=esc(word.slice(at,a));result+=mask?`<span class="mask">${'_'.repeat(b-a)}</span>`:`<span class="target">${esc(word.slice(a,b))}</span>`;at=b}return result+esc(word.slice(at))}

an></footer></main></div>`;updateVoiceUI()}
function home(){const list=DATA.filter(g=>(state.category==='all'||g.category===state.category)&&(state.filter==='all'||state.filter==='priority'&&g.priority||state.filter==='review'&&state.learned.includes(g.id))&&(!search||[g.letters,g.sound,g.tip,g.category,...g.words.flatMap(w=>[w.word,w.meaning])].join(' ').toLowerCase().includes(search.toLowerCase())));return `<div class="hero"><div><span class="pill">发音规律 · 例词集合 · 课堂选词</span><h1>自然拼读字母组合</h1><p class="subtitle">每组至少20个例词。先认组合，再听例词；相同拼写的不同读音分开学。</p></div><div class="stat-list"><div class="stat"><b>${new Set(DATA.map(g=>g.letters)).size}</b><small>种常见拼写</small></div><div class="stat"><b>${DATA.length}</b><small>个发音分组</small></div><div class="stat"><b>${new Set(DATA.flatMap(g=>g.words.map(w=>w.word.toLowerCase()))).size}</b><small>个不同单词</small></div></div></div><div class="toolbar"><label class="search"><span>⌕</span><input id="search" aria-label="搜索字母组合、英文或中文" placeholder="搜索组合、单词或中文，例如 ow、train、雨" value="${esc(search)}"></label><div class="view-filters"><button class="${state.filter==='priority'?'active':''}" data-action="filter" data-filter="priority">优先复习</button><button class="${state.filter==='all'?'active':''}" data-action="filter" data-filter="all">全部分组</button><button class="${state.filter==='review'?'active':''}" data-action="filter" data-filter="review">已复习</button></div></div><div class="sectionbar"><h2>${search?'搜索结果':state.filter==='priority'?'优先复习这'+list.length+'组':state.category==='all'?'常见组合总览':state.category}</h2><span>${list.length} 组 · 点击查看读音与单词</span></div><div class="group-grid">${list.map(g=>`<button class="group-card ${state.learned.includes(g.id)?'learned':''}" data-action="group" data-id="${g.id}"><div class="card-top"><span>${g.category}</span>${g.priority?'<span class="priority-tag">优先复习</span>':''}</div><div class="group-sound"><strong>${esc(g.letters)}</strong><span>${g.sound==='∅'?'不发音':'/'+esc(g.sound)+'/'}</span></div><p>${g.words.slice(0,3).map(w=>mark(w.word,g,false)).join(' · function wordCard(w,g,i){const selected=hasWord(w.word);return `<article class="word-card ${selected?'selected':''}"><div class="word-top"><small>${String(i+1).padStart(2,'0')} ${page==='session'?' · '+esc(g.letters):''}${w.extension?' · 补充':''}</small><button class="add-word ${selected?'in':''}" data-action="add" data-word="${esc(w.word)}" data-id="${g.id}">${selected?'✓ 已加入':'＋ 本节'}</button></div><h3 class="word">${mark(w.word,g)}</h3><div class="meaning ${state.showMeaning?'':'hidden'}">${state.showMeaning?esc(w.meaning):'中文已遮住'}</div><div class="word-audio"><button data-action="listen" data-word="${esc(w.word)}" aria-label="朗读第${i+1}个单词">▷ 听单词</button><button class="slow" data-action="slow" data-word="${esc(w.word)}" aria-label="慢速朗读第${i+1}个单词">慢速</button></div></article>`}
function audioSettings(){return `<div class="audio-settings"><span>英语声音</span><select id="voice-select" aria-label="选择英语朗读声音">${voiceOptions()}</select><button class="quiet" data-action="read-group">▷ 逐词带读</button><button class="quiet" data-action="stop">停止朗读</button></div><p class="voice-note" id="voice-info"></p>`}
function session(){return `<div class="hero"><div><span class="pill">课堂选词 · 每次最多20个</span><h1>本节课的单词</h1><p class="subtitle">从组合词库中挑选，听音、辨认组合，再遮住拼写练一遍。相同单词只收录一次。</p></div><div class="stat-list"><div class="stat"><b>${state.words.length}<span style="color:#a4b199;font-size:17px"> / 20</span></b><small>已选择的单词</small></div></div></div><div class="session-actions"><button class="quiet" data-action="overview">＋ 继续选词</button><button class="quiet" data-action="meaning">${state.showMeaning?'遮住中文':'显示中文'}</button><button class="quiet" data-action="mask">${state.mask?'显示组合拼写':'遮住字母组合'}</button><button class="quiet" data-action="export">导出词表 ↓</button><button class="quiet" data-action="print">打印词表</button><button class="quiet" data-action="clear">清空本节</button></div>${state.words.length?`<div class="word-grid">${state.words.map((w,i)=>wordCard(w,find(w.group),i)).join('')}</div>${audioSettings()}`:'<div class="session-empty"><h2>先选几个要练的单词</h2><p>打开一个组合，点单词右上角“＋ 本节”。<br>也可以把整组例词加入，再调整到最多20个。</p><button class="primary" data-action="overview">去组合词库选词 →</button></div>'}`}
function sources(){return `<div class="source-note"><span>英式读音参考 · “发音分组”不等于不同音素数量；辅音连缀保留多个声音。词汇难度有差异，可按课堂情况选用。</span><span><a href="https://home.oxfordowl.co.uk/reading/what-is-letters-and-sounds/" target="_blank" rel="noopener">Oxford Owl 拼读指南 ↗</a> · <a href="https://home.oxfordowl.co.uk/phonics-videos/" target="_blank" rel="noopener">纯音示范指南 ↗</a></span></div>`}
function addWord(w,g){const i=state.words.findIndex(x=>wordKey(x.word)===wordKey(w.word));if(i>=0){state.words.splice(i,1);save();render();return}if(state.words.length>=20){toast('本节已经选了20个词，先移除一个再加入。');return}state.words.push({...w,group:g.id});save();render()}
function exportWords(){if(!state.words.length){toast('先加入几个本节要练的单词。');return}const lines=['宏浩自然拼读 本节词表','日期：'+new Date().toLocaleDateString('zh-CN'),''];state.words.forEach((w,i)=>{const g=find(w.group);lines.push(`${i+1}. ${w.word}  ${w.meaning}  [${g.letters} ${g.sound==='∅'?'此处不发音':'/'+g.sound+'/'}]`)});const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='宏浩_自然拼读本节词表.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportLibrary(){const lines=['宏浩自然拼读 常见字母组合与单词集合','英式音标参考；同一拼写的不同读法分组列出。',''];for(const g of DATA){lines.push(g.category+' | '+g.letters+' '+(g.sound==='∅'?'此处不发音':'/'+g.sound+'/'),g.tip,g.words.map(w=>w.word+' '+w.meaning).join('；'));if(g.note)lines.push('注意：'+g.note);if(g.extensionNote)lines.push(g.extensionNote);lines.push('')}const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='宏浩_自然拼读完整词库.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function modal(title,text,buttons){const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><p>${text}</p><div class="modal-actions">${buttons}</div></div>`;document.body.append(el);el.querySelector('button')?.focus()}
function closeModal(){document.querySelector('.modal-backdrop')?.remove()}
root.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;search=e.target.value;if(search&&state.filter==='priority')state.filter='all';render();const el=document.getElementById('search');el?.focus();el?.setSelectionRange(start,start)}});
root.addEventListener('change',e=>{if(e.target.id==='voice-select'){state.voiceURI=e.target.value;stopAudio();save();updateVoiceUI()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;switch(a){case'overview':overview();break;case'category':state.category=b.dataset.cat;state.filter='all';search='';overview();save();break;case'filter':state.filter=b.dataset.filter;save();render();break;case'group':navTo(find(b.dataset.id));break;case'session':stopAudio();page='session';history.replaceState(null,'',location.pathname+location.search);render();window.scrollTo(0,0);break;case'font-up':state.font=Math.min(48,state.font+3);save();render();break;case'font-down':state.font=Math.max(25,state.font-3);save();render();break;case'focus':focusMode=!focusMode;render();break;case'learned':if(state.learned.includes(current.id))state.learned=state.learned.filter(x=>x!==current.id);else state.learned.push(current.id);save();render();break;case'meaning':state.showMeaning=!state.showMeaning;save();render();break;case'mask':state.mask=!state.mask;save();render();break;case'step':step=step===Infinity?1:Math.min(current.words.length,step+1);render();break;case'show-all':step=Infinity;render();break;case'add':{const g=find(b.dataset.id),w=g.words.find(x=>x.word===b.dataset.word);addWord(w,g);break}case'add-group':{let count=0;for(const w of current.words){if(state.words.length>=20)break;if(!hasWord(w.word)){state.words.push({...w,group:current.id});count++}}save();render();toast(count?`已加入 ${count} 个词，本节共 ${state.words.length} 个。`:'本组已加入，或本节已选满20个词。');break}case'listen':listen(b.dataset.word);break;case'slow':listen(b.dataset.word,true);break;case'demo':readGroup(current.words.slice(0,3).map(w=>w.word));break;case'read-group':readGroup((page==='session'?state.words:current.words.slice(0,step)).map(w=>w.word));break;case'stop':stopAudio();document.querySelectorAll('[data-action="listen"]').forEach(b=>b.textContent='▷ 听单词');break;case'export':exportWords();break;case'export-all':exportLibrary();break;case'print':if(!state.words.length){toast('先选择本节要练的单词。');return}window.print();break;case'clear':if(!state.words.length)return;modal('清空本节词表','清空后可以重新选择本节要练的20个词。已复习分组会保留。','<button class="quiet" data-action="close">取消</button><button class="primary" data-action="confirm-clear">清空本节</button>');break;case'confirm-clear':state.words=[];save();closeModal();render();break;case'close':closeModal();break;case'help':modal('课堂怎么用','① 默认先展示优先复习的10组，点“全部分组”查看完整词库。<br>② 先看音标和发音提示，再听示范词；朗读播放的是完整单词。<br>③ 用“逐词显示”带读，再遮住中文或字母组合练习。<br>④ 点“＋ 本节”选择最多20个词，可打印或导出词表。<br>⑤ 音标按常见英式。声音取自设备提供的英语语音，优先选 en-GB。<br>⑥ 一种拼写可能有多种读音；连缀里多个辅音都要保留，不能把连缀都当作一个音。','<button class="primary" data-action="close">知道了</button>');break}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();stopAudio()}});
window.addEventListener('hashchange',()=>{const g=find(location.hash.slice(1));if(g){current=g;page='detail';step=Infinity}else{page='overview';current=null}render()});
render();loadVoices();if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',loadVoices);
</script></body></html>
