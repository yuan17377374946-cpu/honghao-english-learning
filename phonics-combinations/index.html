function home(){const list=DATA.filter(g=>(state.category==='all'||g.category===state.category)&&(state.filter==='all'||state.filter==='priority'&&g.priority||state.filter==='review'&&state.learned.includes(g.id))&&(!search||[g.letters,g.sound,g.tip,g.category,...g.words.flatMap(w=>[w.word,w.meaning])].join(' ').toLowerCase().includes(search.toLowerCase())));return `<div class="hero"><div><span class="pill">发音规律 · 例词集合 · 课堂选词</span><h1>自然拼读字母组合</h1><p class="subtitle">先认组合，再听例词。相同拼写的不同读音分开学，遇到新词再核对。</p></div><div class="stat-list"><div class="stat"><b>${new Set(DATA.map(g=>g.letters)).size}</b><small>种常见拼写</small></div><div class="stat"><b>${DATA.length}</b><small>个发音分组</small></div><div class="stat"><b>${new Set(DATA.flatMap(g=>g.words.map(w=>w.word.toLowerCase()))).size}</b><small>个不同单词</small></div></div></div><div class="toolbar"><label class="search"><span>⌕</span><input id="search" aria-label="搜索字母组合、英文或中文" placeholder="搜索组合、单词或中文，例如 ow、train、雨" value="${esc(search)}"></label><div class="view-filters"><button class="${state.filter==='priority'?'active':''}" data-action="filter" data-filter="priority">优先复习</button><button class="${state.filter==='all'?'active':''}" data-action="filter" data-filter="all">全部分组</button><button class="${state.filter==='review'?'active':''}" data-action="filter" data-filter="review">已复习</button></div></div><div class="sectionbar"><h2>${search?'搜索结果':state.filter==='priority'?'优先复习这'+list.length+'组':state.category==='all'?'常见组合总览':state.category}</h2><span>${list.length} 组 · 点击查看读音与单词</span></div><div class="group-grid">${list.map(g=>`<button class="group-card ${state.learned.includes(g.id)?'learned':''}" data-action="group" data-id="${g.id}"><div class="card-top"><span>${g.category}</span>${g.priority?'<span class="priority-tag">优先复习</span>':''}</div><div class="group-sound"><strong>${esc(g.letters)}</strong><span>${g.sound==='∅'?'不发音':'/'+esc(g.sound)+'/'}</span></div><p>${g.words.slice(0,3).map(w=>mark(w.word,g,false)).join(' · ') root.addEventListener('change',e=>{if(e.target.id==='voice-select'){state.voiceURI=e.target.value;stopAudio();save();updateVoiceUI()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;switch(a){case'overview':overview();break;case'category':state.category=b.dataset.cat;state.filter='all';search='';overview();save();break;case'filter':state.filter=b.dataset.filter;save();render();break;case'group':navTo(find(b.dataset.id));break;case'session':stopAudio();page='session';history.replaceState(null,'',location.pathname+location.search);render();window.scrollTo(0,0);break;case'font-up':state.font=Math.min(48,state.font+3);save();render();break;case'font-down':state.font=Math.max(25,state.font-3);save();render();break;case'focus':focusMode=!focusMode;render();break;case'learned':if(state.learned.includes(current.id))state.learned=state.learned.filter(x=>x!==current.id);else state.learned.push(current.id);save();render();break;case'meaning':state.showMeaning=!state.showMeaning;save();render();break;case'mask':state.mask=!state.mask;save();render();break;case'step':step=step===Infinity?1:Math.min(current.words.length,step+1);render();break;case'show-all':step=Infinity;render();break;case'add':{const g=find(b.dataset.id),w=g.words.find(x=>x.word===b.dataset.word);addWord(w,g);break}case'add-group':{let count=0;for(const w of current.words){if(state.words.length>=20)break;if(!hasWord(w.word)){state.words.push({...w,group:current.id});count++}}save();render();toast(count?`已加入 ${count} 个词，本节共 ${state.words.length} 个。`:'本组已加入，或本节已选满20个词。');break}case'listen':listen(b.dataset.word);break;case'slow':listen(b.dataset.word,true);break;case'demo':readGroup(current.words.slice(0,3).map(w=>w.word));break;case'read-group':readGroup((page==='session'?state.words:current.words.slice(0,step)).map(w=>w.word));break;case'stop':stopAudio();document.querySelectorAll('[data-action="listen"]').forEach(b=>b.textContent='▷ 听单词');break;case'export':exportWords();break;case'export-all':exportLibrary();break;case'print':if(!state.words.length){toast('先选择本节要练的单词。');return}window.print();break;case'clear':if(!state.words.length)return;modal('清空本节词表','清空后可以重新选择本节要练的20个词。已复习分组会保留。','<button class="quiet" data-action="close">取消</button><button class="primary" data-action="confirm-clear">清空本节</button>');break;case'confirm-clear':state.words=[];save();closeModal();render();break;case'close':closeModal();break;case'help':modal('课堂怎么用','① 默认先展示优先复习的10组，点“全部分组”查看完整词库。<br>② 先看音标和发音提示，再听示范词；朗读播放的是完整单词。<br>③ 用“逐词显示”带读，再遮住中文或字母组合练习。<br>④ 点“＋ 本节”选择最多20个词，可打印或导出词表。<br>⑤ 音标按常见英式。声音取自设备提供的英语语音，优先选 en-GB。<br>⑥ 一种拼写可能有多种读音；连缀里多个辅音都要保留，不能把连缀都当作一个音。','<button class="primary" data-action="close">知道了</button>');break}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();stopAudio()}});
window.addEventListener('hashchange',()=>{const g=find(location.hash.slice(1));if(g){current=g;page='detail';step=Infinity}else{page='overview';current=null}render()});
render();loadVoices();if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',loadVoices);
</script></body></html>
