<script>
'use strict';
const WORDS = [
 [1,'meet the neighbours','结识邻居'],[1,'make new friends','交新朋友'],[1,'go ice skating','去滑冰'],[1,'throw snowballs','扔雪球'],[1,'ago','以前'],[1,'postcard','明信片'],[1,'lonely','孤独的'],[1,'miss','想念'],[1,'PS','附言'],[1,'homeless','无家可归的'],[1,'ski','滑雪'],[1,'raise money','筹款'],[1,"I’m so excited!",'我太激动了！'],
 [2,'ink painting','水墨画'],[2,'oil painting','油画'],[2,'artist','艺术家'],[2,'paintbrush','画笔'],[2,'powerful','有力量的'],[2,'express','表达'],[2,'painter','画家'],[2,'own','自己的'],[2,'anyone','任何人'],[2,'share','分享'],[2,"touch one’s heart",'打动某人的心'],[2,"show one’s feelings",'表达某人的情感'],[2,'be famous for','因……而出名'],
 [3,'protect','保护'],[3,'warm up','热身'],[3,'get hurt','受伤'],[3,'call for help','呼叫救援'],[3,'break','打破；使断裂'],[3,'arm','手臂'],[3,'skatepark','滑板运动场'],[3,'luckily','幸好'],[3,'helmet','头盔'],[3,'pad','防护垫'],[3,'call an ambulance','叫救护车'],[3,'check injuries','检查受伤情况'],[3,'emergency worker','应急工作人员'],[3,'X-ray','X光检查'],[3,'choose','选择'],[3,'lost','迷路的']
].map((v,i)=>({id:'w'+i,u:v[0],en:v[1],zh:v[2]}));
// Core items practise Units 1–3. Transfer items are deliberately labelled as 易错补充.
const QUESTIONS=[];
function q(u,scope,tag,shown,ok,fix,why,example,context='判断短语搭配是否正确。') {QUESTIONS.push({id:'q'+QUESTIONS.length,u,scope,tag,shown,ok,fix,why,example,context});}
q(1,'core','交朋友','make new friends',true,'make new friends','交朋友用 make friends；friend 在这个搭配中通常用复数。','I made new friends at school.');
q(1,'core','交朋友','make new friend',false,'make new friends','表达“交朋友”时用 make friends；要说交一个新朋友，可以用 make a new friend。','She made a new friend yesterday.');
q(1,'core','运动短语','go ice skating',true,'go ice skating','go 后接这类运动时，用 -ing 形式。','We went ice skating last weekend.');
q(1,'core','运动短语','go ice skate',false,'go ice skating','“去滑冰”是 go ice skating，不能把 skating 写成 skate。','They like to go ice skating.');
q(1,'core','筹款','raise money for homeless animals',true,'raise money for homeless animals','为某人或某项事业筹款，用 raise money for。','We raised money for homeless animals.');
q(1,'core','筹款','raise money to homeless animals',false,'raise money for homeless animals','这里 for 表示筹款帮助的对象，不用 to。','They raised money for the children.');
q(1,'core','过去时间','two weeks ago',true,'two weeks ago','一段时间放在 ago 前面，表示“多久以前”，句子通常用一般过去时。','I moved here two weeks ago.');
q(1,'core','过去时间','ago two weeks',false,'two weeks ago','ago 放在一段时间之后。','She visited us two weeks ago.');
q(1,'core','过去式','I move to Shenzhen last year.',false,'I moved to Shenzhen last year.','last year 是过去时间；move 的过去式是 moved。','My family moved to Shenzhen last year.','判断句子是否正确。');
q(1,'core','did 后原形','Did you made new friends?',false,'Did you make new friends?','did 已经表示过去，后面的实义动词用原形 make。','Did you make new friends at school?','判断句子是否正确。');
q(1,'core','did 后原形','I didn’t go skiing yesterday.',true,'I didn’t go skiing yesterday.','didn’t 后用动词原形 go。','I didn’t go skiing yesterday.','判断句子是否正确。');
q(1,'core','be 动词过去式','They was excited yesterday.',false,'They were excited yesterday.','They 是复数主语，过去时用 were。','They were excited yesterday.','判断句子是否正确。');
q(1,'core','be 动词过去式','I was lonely at first.',true,'I was lonely at first.','I 的 be 动词过去式是 was；lonely 是形容词。','I was lonely at first, but now I have friends.','判断句子是否正确。');
q(1,'extra','邀请','invite sb to do sth',true,'invite sb to do sth','邀请某人做某事：invite＋人＋to＋动词原形。','My friends invited me to play football.');
q(1,'extra','邀请','invite sb do sth',false,'invite sb to do sth','invite 后面接人，再接 to do，不能漏掉 to。','She invited me to join the club.');
q(1,'core','固定介词','at first',true,'at first','at first 表示“起初”，是固定短语。','At first, I felt lonely.');
q(2,'core','擅长','be good at painting',true,'be good at painting','at 是介词，后面接动词时用 -ing 形式。','Xu Beihong was good at painting horses.');
q(2,'core','擅长','be good at paint',false,'be good at painting','be good at doing sth 表示“擅长做某事”。','She is good at drawing.');
q(2,'core','出名','be famous for',true,'be famous for','be famous for 表示“因……而出名”。','Xu Beihong is famous for his paintings of horses.');
q(2,'core','出名','be famous at beautiful paintings',false,'be famous for beautiful paintings','表示“因漂亮的画而出名”，介词用 for。','The artist is famous for his beautiful paintings.');
q(2,'core','分享','share sth with sb',true,'share sth with sb','与某人分享某物：share＋物＋with＋人。','I share my pictures with my friends.');
q(2,'core','分享','share sth to sb',false,'share sth with sb','这个搭配中的介词是 with。','She shared her story with us.');
q(2,'core','情感表达','show our feelings',true,'show our feelings','表达我们的情感可以用 show our feelings；feelings 在这里通常用复数。','Art can show our feelings.');
q(2,'core','打动人心',"touch people’s hearts",true,"touch people’s hearts",'touch one’s heart 表示“打动某人的心”；people 对应复数 hearts。',"Music can touch people’s hearts.");
q(2,'core','be 动词过去式','Van Gogh is a Dutch artist. He died in 1890.',false,'Van Gogh was a Dutch artist. He died in 1890.','这里介绍已经去世的画家及其生平，用 was 与后面的过去时间保持一致。','Van Gogh was a Dutch artist.','根据已给的生平语境，判断时态是否恰当。');
q(2,'core','过去式','He painted beautiful flowers.',true,'He painted beautiful flowers.','paint 的规则过去式是 painted。','He painted beautiful flowers in bright colours.','判断句子是否正确。');
q(2,'extra','喜欢','enjoy looking at paintings',true,'enjoy looking at paintings','enjoy 后面接动词 -ing 形式。','I enjoy looking at paintings.');
q(2,'extra','喜欢','enjoy to look at paintings',false,'enjoy looking at paintings','enjoy doing sth，不用 enjoy to do sth。','We enjoy making art.');
q(2,'extra','想要','want to paint a picture',true,'want to paint a picture','想要做某事：want to do sth。','I want to paint a picture.');
q(2,'extra','想要','want paint a picture',false,'want to paint a picture','want 后接另一个动词时，这里需要 to。','She wants to learn painting.');
q(2,'extra','情态动词','Art can helps us.',false,'Art can help us.','can 后面接动词原形，不能加 -s。','Art can help us express our feelings.','判断句子是否正确。');
q(2,'extra','让某人做','make sb do sth',true,'make sb do sth','主动语态中，“使某人做某事”用 make＋人＋动词原形。','The funny story makes me laugh.');
q(2,'extra','让某人做','make sb to do sth',false,'make sb do sth','这里练习主动语态的使役用法，make 后接人，再接动词原形，不加 to。','The music makes me feel happy.');
q(2,'extra','让某人做','let sb do sth',true,'let sb do sth','让某人做某事：let＋人＋动词原形。','Let me help you.');
q(2,'extra','让某人做','let sb to do sth',false,'let sb do sth','let 后接人，再接动词原形，不加 to。','Let him try again.');
q(3,'core','热身','warm up before doing sport',true,'warm up before doing sport','before 是介词时，后接动词 -ing 形式。','We should warm up before doing sport.');
q(3,'core','热身','warm up before do sport',false,'warm up before doing sport','这里 before 后直接接动作，需要用 doing。也可以接完整句子 before we do sport。','Warm up before you do sport.');
q(3,'core','求助','call for help',true,'call for help','呼救用 call for help。','If you get hurt, call for help.');
q(3,'core','求助','call to help（表示“呼救”）',false,'call for help','表示“呼救”时用 call for help。call to help 在别的句子里可能表示“打电话来帮忙”。','He called for help loudly.');
q(3,'core','情态动词','should wear a helmet',true,'should wear a helmet','should 后面接动词原形 wear。','You should wear a helmet.');
q(3,'core','情态动词','should to wear a helmet',false,'should wear a helmet','should 后直接接动词原形，不加 to。','We should protect ourselves.');
q(3,'core','情态动词','shouldn’t plays on busy roads',false,'shouldn’t play on busy roads','shouldn’t 后也用动词原形 play。','We shouldn’t play on busy roads.');
q(3,'core','保护','protect our heads',true,'protect our heads','protect 是动词，可以直接接保护的对象。our 后用名词 heads。','Helmets protect our heads.');
q(3,'core','受伤','get hurt',true,'get hurt','“受伤”用 get hurt；hurt 的过去式也写作 hurt。','He got hurt yesterday.');
q(3,'core','不规则过去式','He fell and break his arm yesterday.',false,'He fell and broke his arm yesterday.','两个动作都发生在昨天；fall 变 fell，break 变 broke。','He fell and broke his arm yesterday.','判断句子是否正确。');
q(3,'core','顺序表达','First ... Next ... Then ... Finally ...',true,'First ... Next ... Then ... Finally ...','这些词可以按顺序说明急救或安全处理步骤。','First, stay calm. Next, call for help.');
q(3,'core','形容词与副词','Luckily, he wasn’t hurt.',true,'Luckily, he wasn’t hurt.','Luckily 是副词，放在句首，表示“幸好”。','Luckily, he wasn’t hurt.','判断句子是否正确。');
q(3,'extra','让人做与叫人做','ask sb to do sth',true,'ask sb to do sth','要求某人做某事：ask＋人＋to＋动词原形。','The teacher asked us to warm up.');
q(3,'extra','让人做与叫人做','ask sb do sth',false,'ask sb to do sth','ask 的这个搭配需要 to；不要与 make、let 混淆。','He asked me to call an ambulance.');
q(3,'extra','告诉某人做','tell sb to do sth',true,'tell sb to do sth','告诉某人做某事：tell＋人＋to＋动词原形。','Mum told me to wear a helmet.');
q(3,'extra','告诉某人不做','tell sb not to do sth',true,'tell sb not to do sth','告诉某人不要做某事：tell＋人＋not to do。','Dad told me not to play on the road.');
q(3,'extra','告诉某人不做','tell sb not do sth',false,'tell sb not to do sth','tell sb not to do sth 表示告诉某人不要做某事；not 后还需要 to。','She told us not to run here.');
q(3,'extra','帮助','help sb do sth',true,'help sb do sth / help sb to do sth','help 后的 to 可以省略；两种形式都正确。','Please help me carry the bag.');
q(3,'extra','帮助','help sb to do sth',true,'help sb do sth / help sb to do sth','help sb to do sth 也正确，不要误以为 help 后一定不能加 to。','Please help me to carry the bag.');
q(3,'extra','看见动作','Look! I can see a boy playing football.',true,'Look! I can see a boy playing football.','这里强调现在看到正在进行的动作，用 see＋人＋doing。','I can see a girl running in the park.','根据 Look! 和正在发生的语境，判断句子是否正确。');
q(3,'extra','看见动作','I saw him to fall.',false,'I saw him fall.','see 后接人和动作，可用 do 强调整个动作，或 doing 强调进行中；不用 to do。','I saw him fall off his bike.','判断句子是否正确。');
q(1,'extra','正在进行','Look! They are throw snowballs.',false,'Look! They are throwing snowballs.','现在进行时是 am/is/are＋动词 -ing。','Look! They are throwing snowballs.','判断句子是否正确。');
q(1,'extra','问答匹配','When did you move here? — Yes, I did.',false,'When did you move here? — Two weeks ago.','When 问时间，需要回答具体时间；Yes, I did 回答 Did 引导的一般疑问句。','Did you move here last month? — Yes, I did.','判断问句和答句是否匹配。');
q(2,'extra','问答匹配','Why do you like art? — Because it is interesting.',true,'Why do you like art? — Because it is interesting.','Why 询问原因，可以用 Because 引导原因。','Why do you like painting? — Because it is fun.','判断问句和答句是否匹配。');
const RULES=[
 ['前三单元','一般过去时','过去时间 ＋ 动词过去式','yesterday、last week、two days ago 都是常见线索。','I moved here last year.','易错：did / didn’t 后的动词要还原。'],
 ['前三单元','was 与 were','I / he / she / it was；we / you / they were','先找主语，再判断单复数。','They were excited yesterday.','易错：They was ...'],
 ['前三单元','不规则过去式','go–went · make–made · fall–fell · break–broke','还有 do–did、meet–met、throw–threw、get–got、hurt–hurt、see–saw、feel–felt、choose–chose。','He fell and broke his arm.','易错：不是所有动词都加 -ed。'],
 ['前三单元','情态动词','can / should / shouldn’t ＋ 动词原形','后面的动词不加 to，不加 -s。','You should wear a helmet.','易错：should to wear；can helps'],
 ['前三单元','介词后面的动作','be good at doing；before doing','at、before 作介词，后接动作时用 -ing；before 也可以接完整句子。','Warm up before doing sport.','易错：be good at paint'],
 ['前三单元','固定搭配','share sth with sb；be famous for','share ... with ...：与某人分享；be famous for：因……而出名。','She shares her paintings with us.','易错：share ... to ...'],
 ['易错补充','make 与 let','make / let ＋ sb ＋ do sth','主动语态中，使役动词后接人和动词原形。','The story makes me laugh. Let me try.','易错：make sb to do；let sb to do'],
 ['易错补充','ask、tell、want、invite','ask / tell / want / invite ＋ sb ＋ to do sth','它们后面接“某人做某事”，通常需要 to；want to do 也表示“自己想做”。','Mum asks me to wear a helmet.','否定：tell / ask sb not to do sth。'],

try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1){db={...fresh(),...d};if(!db.word||typeof db.word!=='object')db.word={};if(!db.question||typeof db.question!=='object')db.question={};}}catch(e){storageOK=false;}
let mode='match',unit='all',sound=false,session=null,quiz=null,matchQueue=[],matchKey='',roundNumber=0,matchOnlyWrong=false,bookSection='rules',scope='tonight',timer=null;
const $=s=>document.querySelector(s),app=$('#app');

function inUnit(x){return unit==='all'||x.u===Number(unit);}

function updateChrome(){const all=WORDS.filter(x=>db.word[x.id]?.pending).length+QUESTIONS.filter(x=>db.question[x.id]?.pending).length;$('#wrong-count').textContent=all;$('#save-note').textContent=storageOK?'进度保存在当前浏览器':'当前浏览器无法保存，仍可继续练习';}
function record(type,id,right,resolve=false){const old=db[type][id]||{right:0,wrong:0,pending:false};old[right?'right':'wrong']++;old.pending=right?(resolve?false:old.pending):true;db[type][id]=old;save();}

function side(){let totalWords=WORDS.filter(inUnit).length,known=WORDS.filter(x=>inUnit(x)&&db.word[x.id]?.right>0).length,accuracy=db.quizAttempts?Math.round(db.quizRight/db.quizAttempts*100)+'%':'—';return `<aside class="aside"><div class="coach"><h3>今晚，先练这三步</h3><p>先认词，再辨搭配，最后把错的重来一遍。</p><ol class="steps"><li><span class="step-no">1</span><span>中英配对<br>读出英文，再点中文</span></li><li><span class="step-no">2</span><span>判断搭配<br>说出理由，再看解析</span></li><li><span class="step-no">3</span><span>错题回练<br>换一个例句，再试一次</span></li></ol><div class="stats"><div class="stat"><strong>${known}/${totalWords}</strong><span>已配对词条</span></div><div class="stat"><strong>${accuracy}</strong><span>判断累计正确率</span></div></div></div><div class="mini"><strong>这几个，一起辨</strong><p>make / let sb do<br>ask / tell sb to do<br>help sb (to) do<br>enjoy doing</p></div></aside>`;}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-current',b.dataset.mode===mode?'page':'false');});document.querySelectorAll('[data-unit]').forEach(b=>{b.classList.toggle('active',b.dataset.unit===unit);b.setAttribute('aria-pressed',b.dataset.unit===unit);});if(mode==='match')renderMatch();if(mode==='quiz')renderQuiz();if(mode==='rules')renderBook();if(mode==='wrongs')renderWrongs();if(mode==='paper')renderPaper();updateChrome();}
function beginMatch(onlyWrong=false){matchOnlyWrong=onlyWrong;const pool=onlyWrong?pending('word'):WORDS.filter(inUnit);const key=unit+':'+onlyWrong;if(key!==matchKey||!matchQueue.length){matchQueue=shuffle(pool);matchKey=key;roundNumber=0;}else if(onlyWrong){const ids=new Set(pool.map(x=>x.id));matchQueue=matchQueue.filter(x=>ids.has(x.id));}if(!matchQueue.length){session=null;return;}const words=matchQueue.splice(0,12);if(!onlyWrong&&words.length<12){const used=new Set(words.map(w=>w.id));words.push(...shuffle(pool.filter(w=>!used.has(w.id))).slice(0,12-words.length));}roundNumber++;session={words,tiles:shuffle(words.flatMap(w=>[{key:w.id+'-en',id:w.id,lang:'en',text:w.en},{key:w.id+'-zh',id:w.id,lang:'zh',text:w.zh}])),selected:null,matched:[],locked:false,attempts:0,wrong:0,completed:false};}
function renderMatch(){if(!session){app.innerHTML=`<section class="panel empty"><strong>这一轮已经练完了</strong><p>可以返回单词消消乐，或继续短语判断。</p><button class="primary" data-action="normal-match">返回单词消消乐</button></section>`;return;}const n=session.words.length;app.innerHTML=`<div class="layout"><section class="panel"><div class="panel-title"><div><h2>${matchOnlyWrong?'错词消消乐':'找到它的好搭档'}</h2><p class="sub">${matchOnlyWrong?'点英文找中文，按待练错词数量配对，不限时。':'每轮 12 个词，24 张中英文卡片；不限时。'}</p></div><span class="counter" id="match-counter">${session.matched.length} / ${n} 对</span></div><div class="progress" aria-label="本轮配对进度"><span id="match-progress" style="width:${session.matched.length/n*100}%"></span></div><div class="board" aria-label="中英文配对卡片">${session.tiles.map(t=>`<button class="tile ${t.lang}${session.matched.includes(t.id)?' matched':''}" data-tile="${t.key}" aria-label="${t.lang==='en'?'英文':'中文'}：${esc(t.text)}" aria-pressed="false" ${session.matched.includes(t.id)?'disabled':''}>${t.lang==='en'?'<span class="tile-label">'+t.text.split(/\s+/).map(word=>'<span class="keep-word">'+esc(word)+'</span>').join(' ')+'</span>':esc(t.text)}</button>`).join('')}</div><p class="message" id="match-message" aria-live="polite">${session.completed?'本轮完成！准备好就进入下一轮。':'先读一遍，再配对。点错的词会加入错题回练。'}</p><div class="board-footer"><span class="sub">第 ${roundNumber} 轮 · 尚未出场 ${matchQueue.length} 词</span><div><button class="secondary" data-action="repeat-match">重练本轮</button> <button class="primary" id="next-round" data-action="next-match" ${session.completed?'':'disabled'}>${matchOnlyWrong?'继续错词':'下一轮'}</button></div></div></section>${side()}</div>`;requestAnimationFrame(fitClassroomBoard);}
function selectTile(key){if(mode!=='match'||!session||session.locked||session.completed)return;const t=session.tiles.find(x=>x.key===key),el=document.querySelector(`[data-tile="${key}"]`);if(!t||session.matched.includes(t.id))return;if(sound&&t.lang==='en')speak(t.text);if(session.selected===key){el.classList.remove('selected');el.setAttribute('aria-pressed','false');session.selected=null;return;}if(!session.selected){session.selected=key;el.classList.add('selected');el.setAttribute('aria-pressed','true');return;}const a=session.tiles.find(x=>x.key===session.selected);const ae=document.querySelector(`[data-tile="${a.key}"]`);if(a.lang===t.lang){ae.classList.remove('selected');ae.setAttribute('aria-pressed','false');session.selected=key;el.classList.add('selected');el.setAttribute('aria-pressed','true');return;}session.attempts++;db.matchAttempts++;if(a.id===t.id){db.matchRight++;session.matched.push(t.id);record('word',t.id,true,matchOnlyWrong);for(const tile of [ae,el]){tile.classList.remove('selected');tile.classList.add('matched');tile.disabled=true;tile.setAttribute('aria-pressed','false');}session.selected=null;$('#match-counter').textContent=session.matched.length+' / '+session.words.length+' 对';$('#match-progress').style.width=session.matched.length/session.words.length*100+'%';$('#match-message').className='message';$('#match-message').textContent='配对成功：'+session.words.find(w=>w.id===t.id).en;const stat=document.querySelector('.stat strong');if(stat)stat.textContent=WORDS.filter(w=>inUnit(w)&&db.word[w.id]?.right>0).length+'/'+WORDS.filter(inUnit).length;if(session.matched.length===session.words.length){session.completed=true;$('#match-message').textContent=session.wrong===0?'全部一次配对成功！读一遍这些词，再进入下一轮。':'本轮完成！刚才混淆的词，课后可以再练一次。';$('#next-round').disabled=false;}save();}else{session.wrong++;record('word',a.id,false);record('word',t.id,false);session.locked=true;ae.classList.add('wrong');el.classList.add('wrong');$('#match-message').className='message bad';$('#match-message').textContent='这两个不是一对，再读读看。';const current=session;setTimeout(()=>{if(session!==current||mode!=='match')return;for(const tile of [ae,el]){tile.classList.remove('wrong','selected');tile.setAttribute('aria-pressed','false');}session.selected=null;session.locked=false;},650);}}
function quizPool(){let pool=QUESTIONS.filter(inUnit);if(scope==='core')return pool.filter(x=>x.scope==='core');if(scope==='extra')return pool.filter(x=>x.scope==='extra');if(scope==='wrong')return pending('question');return pool;}
function startQuiz(){let pool=quizPool();if(scope==='tonight'){const core=shuffle(pool.filter(x=>x.scope==='core')),extra=shuffle(pool.filter(x=>x.scope==='extra'));let selected=[];const anchors=['make sb do sth','make sb to do sth','ask sb do sth','help sb to do sth','let sb to do sth','enjoy to look at paintings'];for(const shown of anchors){const x=extra.find(x=>x.shown===shown);if(x)selected.push(x);}const perUnit=unit==='all'?4:12;for(const u of (unit==='all'?[1,2,3]:[Number(unit)])){selected.push(...core.filter(x=>x.u===u).slice(0,perUnit));}selected.push(...extra.filter(x=>!selected.includes(x)).slice(0,Math.max(0,18-selected.length)));pool=selected.slice(0,18);}quiz={items:shuffle(pool),i:0,right:0,answered:false,picked:null,done:false};}
function quizControls(){return `<div class="section-controls"><label for="quiz-scope">题目范围</label><select id="quiz-scope"><option value="tonight" ${scope==='tonight'?'selected':''}>今晚精选 · 最多18题</option><option value="core" ${scope==='core'?'selected':''}>前三单元基础</option><option value="extra" ${scope==='extra'?'selected':''}>易错搭配补充</option><option value="wrong" ${scope==='wrong'?'selected':''}>只练错题</option><option value="all" ${scope==='all'?'selected':''}>全部判断题</option></select><button class="plain" data-action="restart-quiz">重新开始</button></div>`;}

function renderBook(){const wordView=bookSection==='words';app.innerHTML=`<section><div class="panel-title"><div><h2>知识口袋</h2><p class="sub">先记住结构，再把它放进句子。</p></div></div><div class="section-controls"><button class="chip ${wordView?'':'active'}" data-book="rules">语法与搭配</button><button class="chip ${wordView?'active':''}" data-book="words">前三单元词表</button>${wordView?'<input class="search" id="word-search" type="search" placeholder="搜索英文或中文" aria-label="搜索词表">':''}</div>${wordView?`<div class="panel"><p class="sub">当前范围 ${WORDS.filter(inUnit).length} 个词条。点击“读”可以听英文。</p><table class="word-table"><thead><tr><th>单元</th><th>英文</th><th>中文</th><th>朗读</th></tr></thead><tbody id="word-rows">${wordRows('')}</tbody></table></div>`:`<div class="book-grid">${RULES.map(r=>`<article class="rule"><span class="tag ${r[0]==='易错补充'?'extra':''}">${r[0]}</span><h3>${r[1]}</h3><div class="formula">${r[2]}</div><p>${r[3]}</p><p>${r[4]}</p><p class="pitfall">${r[5]}</p></article>`).join('')}</div>`}</section>`;}

const GEESE_PASSAGE=`Every autumn, when the leaves turn golden and the wind gets cool, we look up and see wild geese（大雁）flying south in a “V” shape. They fly in groups and call to each other loudly when they fly thousands of kilometres. They do this because winter is coming soon.

In the north, the weather will become very cold and snowy soon. The lakes and rivers will freeze over, and it will be hard for the geese to find enough water, grass and small insects（昆虫）to eat. So they have to leave their home to find a better place. The south is much warmer than the north. The sun shines brightly, and there is a lot of food and clean water for the geese. So they fly a very long way to live there safely through the cold winter. Flying in a “V” shape is very clever: it helps them fly easily and save（节省）a lot of energy.

When spring comes and the north becomes warm again, the ice melts and the grass turns green. The geese will fly back to their old home. Their long trip is a clear sign of the changing seasons. It also tells us how wise nature is and how clever animals are.`;
let paperGroup='choice',paperIndex=0;
db.paper=db.paper&&typeof db.paper==='object'?db.paper:{};
function paperRecord(id){return db.paper[id]||{value:'',checked:false,reveal:false,hint:false};}
function putPaper(id,patch){db.paper[id]={...paperRecord(id),...patch};save();}
function normalizePaper(s){return String(s).trim().toLowerCase().replace(/[.。]$/,'');}
function paperCorrect(x){return normalizePaper(paperRecord(x.id).value)===normalizePaper(x.answer);}
function paperInput(id){let r=paperRecord(id);return `<label class="paper-inline"><span>${id.split('-').pop()}.</span><input type="text" data-paper-fill="${id}" aria-label="Lily 第${id.split('-').pop()}空" autocomplete="off" spellcheck="false" value="${esc(r.value)}" class="${r.checked?(paperCorrect(PAPER_GROUPS[1].items.find(x=>x.id===id))?'good-input':'bad-input'):''}"></label>`;}
function paperPassage(){if(paperGroup==='cloze')return `<div class="paper-passage"><div class="paper-wordbank">词库：${PAPER_GROUPS[1].wordbank}</div><p>Lily is a lovely and hard-working girl. She ${paperInput('a10-1')} to Shanghai with her family last year. Before that, she ${paperInput('a10-2')} in Shenyang. She felt lonely at first, but now she ${paperInput('a10-3')} many new friends here. They often study and do sport together after class. She likes painting very much. Because she thinks drawing can ${paperInput('a10-4')} her feelings. She wants to be a famous ${paperInput('a10-5')} when she grows up. She often helps homeless animals and people in need. Everyone likes her very much.</p></div>`;
 if(paperGroup==='dialogue')return `<div class="paper-passage dialogue-script"><p><b>Lanlan:</b> Why did you look so tired, Diandian?</p><p><b>Diandian:</b> <em>1. ________</em></p><p><b>Lanlan:</b> Oh no. What did you do to help?</p><p><b>Diandian:</b> First, my dad called 119 and told them the address of the building. <span class="given">2. Then, we made loud noises to warn people inside.（已填E）</span></p><p><b>Lanlan:</b> <em>3. ________</em></p><p><b>Diandian:</b> Yes. We called an ambulance. <span class="given">4. The emergency workers checked people’s injuries and took them to the hospital.（已填C）</span></p><p><b>Lanlan:</b> You’re so great! Fire is dangerous. <em>5. ________</em></p><p><b>Diandian:</b> We should cover the mouth and nose with a wet towel（毛巾）. And don’t use the elevator（电梯）! We must be careful.</p></div>`;
 if(paperGroup==='reading')return `<details class="paper-reading" open><summary>展开／收起原文</summary><div class="paper-passage">${GEESE_PASSAGE.split('\n\n').map(p=>'<p>'+esc(p)+'</p>').join('')}</div></details>`;return '';}
function paperQuestion(x,index){const r=paperRecord(x.id),correct=paperCorrect(x);let form=x.type==='choice'?`<p class="paper-question" lang="en">${esc(x.text)}</p><div class="paper-options">${x.options.map((o,i)=>{let key=String.fromCharCode(65+i);return `<label class="paper-option ${r.value===key?'chosen':''}"><input type="radio" name="paper-${x.id}" data-paper-choice="${x.id}" value="${key}" ${r.value===key?'checked':''}><span><b>${key}.</b> ${esc(o)}</span></label>`;}).join('')}</div>`:`<p class="sub">在上方短文中填写第 ${index+1} 空。</p>`;let feedback=r.checked?`<div class="paper-result ${correct?'good':'bad'}" role="status">${correct?'✓ 本题答对':'这题需要再想一想'}${!correct?'，可以修改后重新检查。':''}</div>`:'';let reveal=r.reveal?`<div class="paper-analysis"><strong>答案：${esc(x.answer)}${x.type==='choice'?' · '+esc(x.options[x.answer.charCodeAt(0)-65]):''}</strong><p>${esc(x.why)}</p>${x.complete?'<p lang="en">'+esc(x.complete)+'</p>':''}</div>`:'';return `<article class="paper-item" id="paper-item-${x.id}"><div class="paper-item-head"><strong>${x.type==='fill'?esc(x.label):'第 '+(index+1)+' 题'}</strong><span class="sub">原卷 ${x.source}</span></div>${form}${feedback}<div class="paper-item-actions"><button class="plain" data-paper-hint="${x.id}">${r.hint?'收起提示':'给一点提示'}</button><button class="plain" data-paper-reveal="${x.id}">${r.reveal?'收起解析':'做完看解析'}</button></div>${r.hint?'<div class="paper-hint">'+esc(x.hint)+'</div>':''}${reveal}</article>`;}
function renderPaper(){const group=PAPER_GROUPS.find(x=>x.id===paperGroup);paperIndex=Math.min(paperIndex,group.items.length-1);const all=PAPER_GROUPS.filter(x=>!x.optional).flatMap(x=>x.items),done=all.filter(x=>paperRecord(x.id).checked).length,right=all.filter(x=>paperRecord(x.id).checked&&paperCorrect(x)).length;app.innerHTML=`<section class="panel paper-room"><div class="panel-title"><div><h2>复习完，一起做原题</h2><p class="sub">《好卷》Units 1–3 A 能力评价 · 原卷第13–14页</p></div><span class="counter">必做已检查 ${done} / 11</span></div><details class="paper-source-wrap"><summary>选题与答案来源</summary><p class="paper-source">选题依据：以前易混的过去时、动词形式、词性变化和问答衔接。共11小题；阅读2题选做。答案按配套答案第56页核对。</p></details><nav class="paper-group-tabs" aria-label="原题题型">${PAPER_GROUPS.map(g=>`<button class="chip ${g.id===paperGroup?'active':''}" data-paper-group="${g.id}">${g.short}</button>`).join('')}</nav><div class="paper-group-title"><div><h3>${group.title}</h3><p class="sub">${group.intro}</p></div><span class="tag">${group.time}</span></div><p class="paper-filter-note">这里的原题固定来自前三单元综合卷，不随上方单元按钮筛选。</p>${paperGroup==='dialogue'?'<details class="paper-context-details"><summary>查看完整对话</summary>'+paperPassage()+'</details>':paperPassage()}${paperGroup!=='cloze'?`<div class="paper-slide-controls"><button class="secondary" data-paper-step="-1" ${paperIndex===0?'disabled':''}>上一题</button><strong>${paperIndex+1} / ${group.items.length}</strong><button class="secondary" data-paper-step="1" ${paperIndex===group.items.length-1?'disabled':''}>下一题</button></div>`:''}<div class="paper-items">${paperGroup==='cloze'?group.items.map(paperQuestion).join(''):paperQuestion(group.items[paperIndex],paperIndex)}</div><div class="paper-bottom"><p class="sub">必做题当前答对 ${right} / 11 · 输入和作答记录保存在当前浏览器</p><div><button class="secondary" data-paper-action="check">${paperGroup==='cloze'?'检查本组已作答':'检查本题'}</button> <button class="primary" data-paper-action="next">${paperGroup==='reading'?'回到单项选择':'下一题型'}</button></div></div></section>`;}
document.addEventListener('input',e=>{if(e.target.dataset.paperFill){const id=e.target.dataset.paperFill;putPaper(id,{value:e.target.value,checked:false,reveal:false});e.target.classList.remove('good-input','bad-input');}});
document.addEventListener('change',e=>{if(e.target.dataset.paperChoice){putPaper(e.target.dataset.paperChoice,{value:e.target.value,checked:false,reveal:false});renderPaper();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.paperGroup){paperGroup=b.dataset.paperGroup;paperIndex=0;renderPaper();}else if(b.dataset.paperHint){const id=b.dataset.paperHint;putPaper(id,{hint:!paperRecord(id).hint});renderPaper();}else if(b.dataset.paperReveal){const id=b.dataset.paperReveal;putPaper(id,{reveal:!paperRecord(id).reveal});renderPaper();}else if(b.dataset.paperAction==='check'){const group=PAPER_GROUPS.find(x=>x.id===paperGroup),items=paperGroup==='cloze'?group.items:[group.items[paperIndex]],answered=items.filter(x=>paperRecord(x.id).value.trim());if(!answered.length){notify('先作答一题，或口头回答后点击“做完看解析”。');return;}answered.forEach(x=>putPaper(x.id,{checked:true}));renderPaper();const missing=items.length-answered.length;if(missing)notify('已检查 '+answered.length+' 题，还有 '+missing+' 题未填写。');}else if(b.dataset.paperAction==='next'){let i=PAPER_GROUPS.findIndex(x=>x.id===paperGroup);paperGroup=PAPER_GROUPS[(i+1)%PAPER_GROUPS.length].id;paperIndex=0;renderPaper();window.scrollTo({top:0,behavior:'smooth'});}});



function fitClassroomBoard(){
 const board=document.querySelector('.board');
 if(!board||mode!=='match'||!session)return;
 if(window.innerWidth<1101){board.style.removeProperty('grid-auto-rows');return;}
 const panel=board.closest('.panel'),foot=panel.querySelector('.board-footer'),message=panel.querySelector('.message');
 const style=getComputedStyle(board),columns=style.gridTemplateColumns.split(' ').filter(Boolean).length;
 const rows=Math.max(1,Math.ceil(session.tiles.length/columns)),gap=parseFloat(style.rowGap)||10;
 const reserve=(foot?foot.getBoundingClientRect().height:50)+(message?message.getBoundingClientRect().height:28)+68;
 const available=window.innerHeight-board.getBoundingClientRect().top-reserve;
 let height=Math.max(88,Math.floor((available-gap*(rows-1))/rows));
 if(session.words.length<12)height=Math.min(height,160);
 board.style.gridAutoRows=height+'px';
}
let boardFrame=0;
window.addEventListener('resize',()=>{cancelAnimationFrame(boardFrame);boardFrame=requestAnimationFrame(fitClassroomBoard);});
if(document.fonts)document.fonts.ready.then(()=>requestAnimationFrame(fitClassroomBoard));

const FONT_KEY='hongren-classroom-font-v1',FONT_SCALES=[1,1.15,1.3];
let fontLevel=0;
try{const level=Number(localStorage.getItem(FONT_KEY));if(Number.isInteger(level)&&level>=0&&level<FONT_SCALES.length)fontLevel=level;}catch(e){}
function applyFont(){requestAnimationFrame(fitClassroomBoard);document.documentElement.style.setProperty('--lesson-scale',FONT_SCALES[fontLevel]);$('#font-size-label').textContent='字号 '+Math.round(FONT_SCALES[fontLevel]*100)+'%';$('#font-down').disabled=fontLevel===0;$('#font-up').disabled=fontLevel===FONT_SCALES.length-1;try{localStorage.setItem(FONT_KEY,String(fontLevel));}catch(e){}}
$('#font-down').addEventListener('click',()=>{fontLevel=Math.max(0,fontLevel-1);applyFont();});
$('#font-up').addEventListener('click',()=>{fontLevel=Math.min(FONT_SCALES.length-1,fontLevel+1);applyFont();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-paper-step]');if(!b||b.disabled)return;const group=PAPER_GROUPS.find(x=>x.id===paperGroup);paperIndex=Math.max(0,Math.min(group.items.length-1,paperIndex+Number(b.dataset.paperStep)));renderPaper();});
applyFont();

if(location.hash==='#paper')mode='paper';
beginMatch();render();
</script>
