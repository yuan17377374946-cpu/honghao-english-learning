const D={"title": "六年级英语第三单元测试", "subtitle": "笔试卷　满分100分　建议用时60分钟", "dialog_options": ["What did you do before cycling?", "I met two club helpers.", "How did you feel about the trip?", "Because it can protect my head.", "Where did you ride your bikes?"], "dialogue": [["Amy", "Hi, Ben! You weren't at the Safety Club yesterday."], ["Ben", "I went cycling in the park with my dad."], ["Amy", "Why did you wear a helmet?"], ["Ben", "(6) __________ It wasn't too big or too small."], ["Amy", "(7) __________"], ["Ben", "We rode on the bike path, away from cars."], ["Amy", "(8) __________"], ["Ben", "We checked our bikes and warmed up first."], ["Amy", "Who did you meet there?"], ["Ben", "(9) __________ They taught us how to ride safely."], ["Amy", "That's great! (10) __________"], ["Ben", "I felt happy. Now I want to share the tips with our club."], ["Amy", "Good idea! Let's do that today."]], "cloze": "Sports are fun, but safety tips can (13) ______ us. Many (14) ______ joined our school's Safety Day last Friday. Our PE teacher (15) ______ us a short film about sport. In the film, a boy rode his bike very fast and fell. Luckily, he wore a helmet. After the film, the teacher asked, 'How can we protect (16) ______?' We talked in groups. We should choose a safe place and (17) ______ the sports rules. We should also warm up before doing sport. The teacher said, '(18) ______ on the road.' Now we know more about safety. These tips are useful for everyone. When we are tired, we should take a break and drink some water.", "cloze_options": [["forget", "protect", "draw"], ["child", "children", "childrens"], ["show", "showing", "showed"], ["ourselves", "our", "us"], ["follow", "break", "drink"], ["Doesn't play", "Don't play", "Not playing"]], "phonics_samples": ["b<u>e</u>d", "h<u>a</u>t", "c<u>oa</u>t", "bl<u>ue</u>"], "phonics_words": ["bed", "hat", "coat", "blue"], "phonics_task": "For a safe trip, I can take a (1) ______, a (2) ______, a (3) ______ and some (4) ______.", "survey": "Our school did a survey about the favourite Safety Club activities of the students in Class 1 and Class 2, Grade 6. Every student chose one of five activities: swimming, cycling, poster making, safety games and safety films. Look at the chart and see what we can learn.", "chart": {"labels": ["Swimming", "Cycling", "Poster\nmaking", "Safety\ngames", "Safety\nfilms"], "boys": [8, 7, 6, 4, 5], "girls": [10, 5, 8, 6, 7]}, "process_intro": "How to make a safety poster", "process_preamble": "Do you know how to make a safety poster for your class?", "process_materials": ["a big piece of paper", "a pencil", "some coloured pens"], "process_steps": ["Get a big piece of paper.", "(26) __________", "(27) __________", "(28) __________", "Colour the pictures to make the poster bright.", "Show your poster to your class."], "process_options": ["Write a safety tip under each picture.", "Write a title at the top of the paper.", "Draw two pictures below the title."], "diary": [["6th June", "Today I went cycling in the park with Dad. I wanted to start quickly, but Dad asked me to put on my helmet first. I felt unhappy because I wanted to ride at once. Then Dad showed me how to check it. My helmet was in my size, and it did not fall when I moved my head."], ["10th June", "I joined the school Safety Club today because I wanted to learn how to protect myself. Our teacher used pictures and a game to teach us. We checked our helmets before getting on our bikes. Then we warmed up and followed the sports rules. I learned a lot."], ["13th June", "Our club visited the playground today. Two young children were running near the stairs. I told them not to run there. A teacher thanked me. I felt happy because I could help others stay safe. After the visit, I talked with my friends about a safety project for the weekend. This weekend, __________. I am looking forward to it! Our club can help more children stay safe."]], "profiles": [["Lily", "I want to be a safety helper at school. I like helping young children. I want to show them how to walk safely on the stairs. They should walk slowly and should not push others. In the hallway, I want to remind them not to run. School safety is important."], ["Max", "I want to be a safety helper at an underground station. I often help my little brother take the underground. We should wait behind the yellow line and should not push other people. When the train arrives, we should let people get off first. I want to share these tips."], ["Eva", "I want to be a safety helper in the park. I enjoy cycling with my friends there. I want to help children check their helmets before cycling. We should choose a safe place away from cars and warm up first. I think these good habits can help us protect ourselves."], ["Sam", "I want to be a safety helper at a sports club. I like sport and making posters. I want to make posters about sports safety. They can remind children to follow the rules and take a break when they feel tired. I also want to learn first aid from teachers."]], "questions": {"1": "Take a helmet for your bike ride.", "2": "Take your cap.", "3": "Bring a phone with you.", "4": "Take some food.", "5": "What other things can you take to keep yourself safe on a trip?", "11": "What do you think of wearing a helmet when you cycle?", "12": "Why do you think so?", "19": "What sport do you like doing?", "20": "Why do you like it?", "21": "Eighteen students like swimming best.", "22": "Girls' favourite Safety Club activity is cycling.", "23": "Sixty-six students answered the survey.", "24": "Which Safety Club activity do you like best?", "25": "Why do you like this activity?", "29": "What safety poster can you make?", "30": "What do you need to make it?", "31": "Why did the writer join the Safety Club?", "32": "How did the writer feel in the park on 6th June?", "33": "Which of the following is NOT right?", "34": "This weekend, __________.", "35": "Where did you do sport last week?", "36": "How did you feel after doing sport?", "37": "Where does Max want to be a safety helper?", "38": "What does Eva want to do in the park?", "39": "Which of the following is right?", "40": "Where do you want to be a safety helper?", "41": "Why do you want to help there?", "42": "Look at the picture. Write three or more complete sentences.", "43": "When you see a fire in the park, what should you do?"}, "reading_options": {"31": ["To learn how to protect himself.", "To learn how to paint helmets.", "To ride a bike on the road."], "32": ["Lonely.", "Unhappy.", "Happy."], "33": ["The writer wanted to start cycling quickly in the park.", "The teacher used pictures and a game to teach safety.", "On 10th June, Tom checked his helmet after getting on his bike."], "38": ["She wants to swim in the river.", "She wants to help children check their helmets.", "She wants to teach Max how to get on a train."], "39": ["Lily wants to help children wait behind the yellow line.", "Max wants to help children ride bikes in the park.", "The four children want to be safety helpers in different places."]}};
const ANSWERS={"1": {"answer": "helmet", "why": "bed画线的e读/e/，helmet中的第一个e也读/e/。写出句中完整的helmet，不能只抄字母e。"}, "2": {"answer": "cap", "why": "hat画线的a读/æ/，cap中的a也读/æ/。找到的词再填回下面任务句的第2空。"}, "3": {"answer": "phone", "why": "coat中的oa读/əʊ/，phone中的o也有这一读音（美式标作/oʊ/）。相同发音可以由不同字母组合表示。"}, "4": {"answer": "food", "why": "blue中的ue与food中的oo都读/uː/。四个词共同组成安全出行物品清单：a helmet、a cap、a phone、some food。"}, "5": {"answer": "I can take a torch and some water.", "why": "开放题。对应原卷“还能使用什么材料”，这里拓展还能携带什么安全出行物品，而不是问能做什么行为。可写水、手电筒、哨子等合理物品，can后用动词原形。"}, "6": {"answer": "D", "why": "Why did you wear a helmet?问原因，Because it can protect my head.回答戴头盔的原因。"}, "7": {"answer": "E", "why": "后句说在远离汽车的自行车道骑车，是地点，故选Where did you ride your bikes?"}, "8": {"answer": "A", "why": "回答讲检查自行车、先热身，是骑车前做了什么，故选What did you do before cycling?"}, "9": {"answer": "B", "why": "后面的They指two club helpers；对应Who did you meet there?"}, "10": {"answer": "C", "why": "I felt happy.说感受，对应How did you feel about the trip?"}, "11": {"answer": "I think it is important.", "why": "开放题。问戴头盔的看法，不是问去哪儿骑车。safe、useful等合理评价也可。"}, "12": {"answer": "Because it can protect my head.", "why": "理由应与11题对戴头盔的看法一致，because后说明原因。"}, "13": {"answer": "B protect", "why": "安全提示能保护我们，protect us。forget为忘记，draw为画，不符合句意。三个选项都是动词原形，直接考词义。"}, "14": {"answer": "B children", "why": "Many后这里需要复数名词。child的复数是不规则变化children，不能写childrens。"}, "15": {"answer": "C showed", "why": "叙述上周五的活动，用一般过去时。teacher showed us a film表示老师给我们看了一段影片。"}, "16": {"answer": "A ourselves", "why": "主语we与被保护的人相同，表示保护我们自己，用反身代词ourselves。our后接名词，us在这里不能准确表达自我保护。"}, "17": {"answer": "A follow", "why": "follow the sports rules表示遵守运动规则。break为违反，drink为喝，不符合安全建议。"}, "18": {"answer": "B Don't play", "why": "这里直接提醒别人不要在马路上玩，用否定祈使句Don't加动词原形。Doesn't用于一般现在时的第三人称单数否定句；Not playing不能构成这里的完整命令句。"}, "19": {"answer": "I like swimming.", "why": "开放题。回答自己喜欢的运动；cycling、running、playing basketball等合理表达都可以。"}, "20": {"answer": "Because it is fun.", "why": "开放题。原因与19题所选运动对应，句意完整。"}, "21": {"answer": "A", "why": "最喜欢游泳：男生8人，女生10人，合计18人。题目问students，要把男生女生相加。"}, "22": {"answer": "B", "why": "女生最喜欢的活动是游泳10人，不是骑自行车5人。要只比较女生这一组，不能看全体人数或自己的喜好。"}, "23": {"answer": "A", "why": "男生8+7+6+4+5=30；女生10+5+8+6+7=36；合计66。正文明确每人只选一项，因此可以相加。"}, "24": {"answer": "I like safety games best.", "why": "对应原卷“个人喜好＋原因”。回答自己最喜欢的活动，不是抄图表中人数最多的活动。五项活动都可选。"}, "25": {"answer": "Because I can learn safety rules in a fun way.", "why": "理由须与24题的选择对应。若喜欢骑车，可说明骑车有趣等，不要求逐字照抄参考答案。"}, "26": {"answer": "B", "why": "拿好纸后先在纸的上方写标题；后一步要在标题下方画画，因此标题须先存在。"}, "27": {"answer": "C", "why": "在标题下方画两幅画。下步需要在每幅图下面写提示，因此要先有图片。"}, "28": {"answer": "A", "why": "在每幅图下面写一条安全提示。之后给图片涂色，最后展示海报。三句均为正确的祈使句，考的是动作依赖和先后顺序。"}, "29": {"answer": "I can make a poster about road safety.", "why": "对应原卷“自己能制作什么”。结合实际回答想制作的安全海报主题，不必复述原文。school safety、sports safety等合理主题也可。can后用make原形。"}, "30": {"answer": "I need a big piece of paper, a pencil and some coloured pens.", "why": "对应原卷“制作需要什么材料”。it指29题的海报，材料应与作品相符。开放题允许其他合理材料，不限定必须逐字抄材料清单。"}, "31": {"answer": "A", "why": "10th June：I joined...because I wanted to learn how to protect myself.选项将第一人称myself转为himself，指Tom。"}, "32": {"answer": "B", "why": "6th June的公园经历中明确写I felt unhappy。后面的happy是13日的感受，不能跨日期替换。"}, "33": {"answer": "C", "why": "日记说checked our helmets before getting on our bikes；C却改成after，上车前后关系被颠倒。A、B均有明确原文依据。"}, "34": {"answer": "This weekend, we will make safety posters for our school.", "why": "开放续写题。可写制作安全海报、写安全提示等与安全项目有关的合理计划。用will或be going to等合适表达。题干已给This weekend，只需补后面的内容。"}, "35": {"answer": "I did sport in the park last week.", "why": "真实经历题。地点按实际改写；如过去一周没有运动，可如实说I did not do sport last week.，不要强迫虚构。"}, "36": {"answer": "I felt happy after doing sport.", "why": "真实经历题。tired、excited等合理感受也可。feel的过去式是felt；没有运动经历时按真实情况核对。"}, "37": {"answer": "B", "why": "Max第一句明确想在地铁站当安全小帮手，对应B站台图。A为学校楼梯，C为骑车公园；图片不再用英文地点标签提示答案。"}, "38": {"answer": "B", "why": "Eva说I want to help children check their helmets before cycling，B与原文对应。A凭空添加游泳活动；C把Max相关的地铁活动混到Eva。"}, "39": {"answer": "C", "why": "四个人分别想在学校、地铁站、公园和运动俱乐部当小帮手，地点不同。A把Max的黄线信息移给Lily；B把Eva的公园骑车信息移给Max。"}, "40": {"answer": "I want to be a safety helper at school.", "why": "开放题。学校、公园、运动场等合理地点都可；want to be和地点表达要完整。"}, "41": {"answer": "Because I want to help young children stay safe.", "why": "理由与40题地点相对应；不按参考答案逐字判分。"}, "42": {"answer": "A child is riding a bike. The child is wearing a helmet. Another child is warming up. A child is drinking water. A child is resting on a bench.", "why": "从图中选择至少三句完整表达即可，不必写全五句。现在进行时适合描述正在发生的动作；There is...等符合画面的句子也可。children用are；单个人用is；ride去e加ing。图中人物用child、boy或girl均可，不因性别判断扣分。"}, "43": {"answer": "First, I should stay calm and keep away from the fire. Next, I should call 119 from a safe place and tell them where the fire is. Then, I should ask an adult for help. Finally, I should wait for the firefighters in a safe place. I should not go back for my things. Safety comes first.", "why": "示例约60词。四个顺序词组织合理的安全做法，should或should not后用动词原形。内容允许其他合理表达，不要求与范文完全一致。"}};

function hwApplyColours(){document.querySelectorAll('[data-hw-key]').forEach(el=>{const c=hwState.words[el.dataset.hwKey]?.colour;if(HW_COLOURS[c])el.setAttribute('data-hw-colour',c);else el.removeAttribute('data-hw-colour')})}
function hwRefreshCount(){const el=document.getElementById('hwCount');if(el)el.textContent=Object.keys(hwState.words).length}
function hwSpeech(text,slow=false){const status=document.getElementById('hwStatus');if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined'){if(status)status.textContent='当前浏览器不支持朗读，请换用系统浏览器。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=slow?.6:.85;const voices=speechSynthesis.getVoices(),voice=voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(voice)u.voice=voice;u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled'&&status)status.textContent='朗读暂不可用，请检查设备声音，或换用系统浏览器。'};if(status)status.textContent=slow?'慢速朗读中……':'朗读中……';u.onend=()=>{if(status)status.textContent='可以再听一次，或换一种颜色。'};speechSynthesis.speak(u)}
function hwClose(){document.getElementById('hwPanel').hidden=true;hwActive='';if(hwAnchor?.isConnected)hwAnchor.focus({preventScroll:true})}
function hwShow(el){if(state.mode==='test')return;hwAnchor=el;hwActive=hwKey(el.dataset.hwWord);hwLookup(el.dataset.hwWord);hwApplyColours();hwRefreshCount();hwFillPanel();document.getElementById('hwPanel').hidden=false;}
function hwFillPanel(){const r=hwState.words[hwActive];if(!r)return;const e=e16Esc;document.getElementById('hwPanel').innerHTML=`<div class="hw-top"><div><span class="hw-kicker">点词查词</span><h3>${e(r.word)}</h3></div><button id="hwClose" aria-label="关闭查词卡">×</button></div><div class="hw-ipa" aria-label="美式音标">${e(hwPhonetics(r.word)||'暂无音标')}</div><p class="hw-ipa-note">${e(hwPhoneticNote(r.word))}</p><p class="hw-meaning">${e(r.meaning||hwMeaning(r.word)||'此词暂未收录，可以请老师补充中文意思。')}</p><div class="hw-actions"><button id="hwSpeak">🔊 听读音</button><button id="hwSlow">慢速听</button></div><p class="hw-label">给这个词标色 · 同一个词会一起变色</p><div class="hw-actions">${Object.entries(HW_COLOURS).map(([k,c])=>`<button data-hw-colourpick="${k}" class="hw-swatch" style="--swatch:${c[1]}" aria-label="标为${c[0]}" aria-pressed="${r.colour===k}">${r.colour===k?'✓ ':''}${c[0]}</button>`).join('')}<button id="hwClearColour">取消标色</button></div><details><summary>补充／修改词义</summary><label for="hwCustomMeaning" class="hw-label">按这句话的意思写中文</label><input id="hwCustomMeaning" type="text" value="${e(r.meaning||hwMeaning(r.word))}" placeholder="老师可以补充这个词在文中的意思"><button id="hwSaveMeaning">保存词义</button></details><div class="hw-bottom"><span>已加入生词本</span><button id="hwShowBook">查看生词本</button></div><p id="hwStatus" role="status">首次查词默认标色，可随时更换或取消。</p>`;document.getElementById('hwClose').onclick=hwClose;document.getElementById('hwSpeak').onclick=()=>hwSpeech(r.word);document.getElementById('hwSlow').onclick=()=>hwSpeech(r.word,true);document.querySelectorAll('[data-hw-colourpick]').forEach(b=>b.onclick=()=>hwSetColour(hwActive,b.dataset.hwColourpick));document.getElementById('hwClearColour').onclick=()=>hwSetColour(hwActive,'');document.getElementById('hwShowBook').onclick=hwBook;document.getElementById('hwSaveMeaning').onclick=()=>{r.meaning=document.getElementById('hwCustomMeaning').value.trim();hwSave();hwFillPanel();document.getElementById('hwStatus').textContent='已保存词义。'};}
function hwBook(){const el=document.getElementById('hwBook');el.hidden=false;document.getElementById('hwPanel').hidden=true;const rows=Object.entries(hwState.words).reverse();el.innerHTML=`<div class="hw-bookcard"><div class="hw-top"><div><span class="hw-kicker">MY WORD NOTES</span><h3>宏仁的生词本 · ${rows.length}词</h3></div><button id="hwCloseBook" aria-label="关闭生词本">×</button></div><p class="hw-label">保存在当前设备、当前浏览器。点单词可继续查词、听音、换颜色。</p><div class="hw-actions"><button id="hwCopyBook">复制生词本</button><span id="hwBookStatus" role="status"></span></div><div class="hw-rows">${rows.length?rows.map(([k,r])=>`<article class="hw-row"><button data-hw-openword="${e16Esc(k)}" style="background:${HW_COLOURS[r.colour]?.[1]||'#f1f4f5'}">${e16Esc(r.word)}</button><span>${e16Esc(r.meaning||hwMeaning(r.word)||'待补充词义')}</span><button data-hw-readword="${e16Esc(k)}" aria-label="朗读${e16Esc(r.word)}">🔊</button><button data-hw-removeword="${e16Esc(k)}" aria-label="从生词本移除${e16Esc(r.word)}">移除</button></article>`).join(''):'<p>点一下文章里的英文单词，就会记录在这里。</p>'}</div><textarea id="hwBookCopy" aria-label="生词本复制文本" hidden></textarea></div>`;document.getElementById('hwCloseBook').onclick=()=>{el.hidden=true;hwActive=''};document.querySelectorAll('[data-hw-openword]').forEach(b=>b.onclick=()=>{hwActive=b.dataset.hwOpenword;el.hidden=true;hwFillPanel();document.getElementById('hwPanel').hidden=false});document.querySelectorAll('[data-hw-readword]').forEach(b=>b.onclick=()=>hwSpeech(hwState.words[b.dataset.hwReadword].word));document.querySelectorAll('[data-hw-removeword]').forEach(b=>b.onclick=()=>{delete hwState.words[b.dataset.hwRemoveword];hwSave();hwApplyColours();hwRefreshCount();hwBook()});document.getElementById('hwCopyBook').onclick=async()=>{const txt=rows.map(([k,r])=>r.word+'\t'+(r.meaning||hwMeaning(r.word))+'\t'+(HW_COLOURS[r.colour]?.[0]||'未标色')).join('\n');try{await navigator.clipboard.writeText(txt);document.getElementById('hwBookStatus').textContent='已复制'}catch{const a=document.getElementById('hwBookCopy');a.hidden=false;a.value=txt;a.focus();a.select();document.getElementById('hwBookStatus').textContent='请选中文本复制'}};}
function hwWrapWords(){const root=document.getElementById('app');if(!root)return;hwObserver?.disconnect();const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||!/[A-Za-z]{2,}|\b[AI]\b/.test(n.nodeValue)||p.closest('script,style,textarea,input,select,option,svg,code,pre,[data-hw-key],#hwPanel,#hwBook'))return NodeFilter.FILTER_REJECT;if(p.closest('.e16-opt > b'))return NodeFilter.FILTER_REJECT;if(p.closest('button')&&!p.closest('.e16-opt'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}}),texts=[];while(walker.nextNode())texts.push(walker.currentNode);for(const n of texts){const re=/[A-Za-z]+(?:['’][A-Za-z]+)*/g,frag=document.createDocumentFragment();let pos=0,m;while((m=re.exec(n.nodeValue))){frag.append(document.createTextNode(n.nodeValue.slice(pos,m.index)));const w=m[0];if(w.length===1&&!/^[AI]$/.test(w)){frag.append(document.createTextNode(w))}else{const s=document.createElement('span');s.className='hw-word';s.dataset.hwWord=w;s.dataset.hwKey=hwKey(w);s.textContent=w;s.setAttribute('role','button');s.setAttribute('tabindex',state.mode==='test'?'-1':'0');s.setAttribute('aria-label','查词和听读音：'+w);const c=hwState.words[hwKey(w)]?.colour;if(HW_COLOURS[c])s.dataset.hwColour=c;frag.append(s)}pos=m.index+w.length}frag.append(document.createTextNode(n.nodeValue.slice(pos)));n.replaceWith(frag)}hwObserver?.observe(root,{childList:true,subtree:true});}
function hwQueueWrap(){if(hwQueued)return;hwQueued=true;queueMicrotask(()=>{hwQueued=false;hwWrapWords()})}
function hwInit(){const panel=document.createElement('section');panel.id='hwPanel';panel.className='hw-panel';panel.hidden=true;panel.setAttribute('role','dialog');panel.setAttribute('aria-label','单词中文、发音和标色');document.body.append(panel);const book=document.createElement('section');book.id='hwBook';book.className='hw-book';book.hidden=true;book.setAttribute('role','dialog');book.setAttribute('aria-modal','true');book.setAttribute('aria-label','宏仁的生词本');document.body.append(book);const tools=document.createElement('button');tools.id='hwTools';tools.className='hw-tools';tools.innerHTML='📚 生词本 <span id="hwCount">0</span><small>点英文查词 · 听音 · 标色</small>';tools.onclick=()=>{if(state.mode==='test'){notify('先切换到课堂讲解，再打开生词本。');return;}hwBook()};document.body.append(tools);const root=document.getElementById('app');root.addEventListener('click',e=>{const el=e.target.closest('[data-hw-key]');if(!el||state.mode==='test')return;e.preventDefault();e.stopImmediatePropagation();hwShow(el)},true);root.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const el=e.target.closest('[data-hw-key]');if(!el||state.mode==='test')return;e.preventDefault();e.stopImmediatePropagation();hwShow(el)},true);document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('hwBook').hidden=true;hwClose()}});book.addEventListener('click',e=>{if(e.target===book)book.hidden=true});hwObserver=new MutationObserver(hwQueueWrap);hwWrapWords();hwRefreshCount();}
hwInit();

render();clock();setInterval(clock,1000);
</script></body></html>
