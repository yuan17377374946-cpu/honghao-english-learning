<script>
'use strict';
const lessons={
math:[
{id:'m0',label:'例题 · 积不变',type:'例题｜一个因数变大，另一个变小',prompt:'4.8 × 2.5 和 48 × 0.25 的积相等吗？说说理由。',formula:'4.8 × 2.5　?　48 × 0.25',requirement:'先比较两个因数分别怎样变化，不急着算出积。',hint:'4.8 变成 48，是乘几？2.5 变成 0.25，是除以几？把两次变化合起来看。',answer:'两个算式的积相等。',steps:[['题意','4.8 变成 48，乘了 10；2.5 变成 0.25，除以 10。'],['依据','一个因数乘 10，另一个因数除以 10，积不变。整体变化是“× 10 ÷ 10”。'],['结论','所以 4.8 × 2.5 = 48 × 0.25。']],visual:'product',mistake:'“一个变大，一个变小”还不够。要说出它们乘、除的是同一个非零数。',extra:'计算核验：4.8 × 2.5 = 12，48 × 0.25 = 12。计算能核验，但本题重点是解释变化规律。'},
{id:'m1',label:'第1题 · 积的变化',type:'作业第1题｜积的变化规律',prompt:'小安说，把 3.6 × 2.4 中的 3.6 改成 36，2.4 不变，积就增加 10。你同意吗？说清楚积实际上怎样变。',requirement:'分清“乘 10”和“增加 10”。用完整的三步说明理由。',hint:'一个因数乘 10，另一个因数不变，积也怎样变？“增加 10”表示加 10，还是乘 10？',answer:'不同意。积变为原来的 10 倍。',steps:[['题意','3.6 变成 36，是原来的 10 倍；另一个因数 2.4 不变。'],['依据','根据积的变化规律，一个因数乘 10，另一个因数不变，积也乘 10。'],['结论','所以积变为原来的 10 倍，小安说“积增加 10”不对。']],mistake:'“变为原来的 10 倍”是新积 = 原积 × 10；“增加 10”是新积 = 原积 + 10，意思不同。',extra:'计算核验：原积 3.6 × 2.4 = 8.64，新积 36 × 2.4 = 86.4。增加的量是 86.4 − 8.64 = 77.76，不是 10。'},
{id:'m2',label:'第2题 · 商不变',type:'作业第2题｜商不变的性质',prompt:'小雨说，12.6 ÷ 0.35 = 126 ÷ 35。你同意吗？说明理由。再把原式改写成除数是整数、商相等的算式。',formula:'12.6 ÷ 0.35　?　126 ÷ 35',requirement:'分别检查被除数和除数的变化，不能只看小数点移了没有。',hint:'12.6 变成 126，乘了几？0.35 变成 35，乘了几？这两个数相同吗？',answer:'不同意。正确改写：12.6 ÷ 0.35 = 1260 ÷ 35。',steps:[['题意','12.6 变成 126，乘了 10；0.35 变成 35，乘了 100。两个数乘的倍数不同。'],['依据','商不变需要被除数和除数同时乘或除以同一个非零数。要把 0.35 变成整数 35，两个数都应乘 100。'],['结论','所以 12.6 ÷ 0.35 = 1260 ÷ 35，小雨的改写不对。']],visual:'quotient',mistake:'不是“都去掉小数点，商就不变”。应当让小数点同时向同一方向移动相同的位数。',extra:'计算核验：1260 ÷ 35 = 36，而 126 ÷ 35 = 3.6。原式的商是错误改写后商的 10 倍。'},
{id:'m3',label:'第3题 · 比较大小',type:'作业第3题｜比较商与被除数',prompt:'6.48 ÷ 0.9 的商和 6.48 比，谁更大？不求出准确的商，写出你的判断和理由。',formula:'6.48 ÷ 0.9　?　6.48',requirement:'按题目要求，用除数与 1 的关系来判断。',hint:'先想 6.48 ÷ 1 等于多少。被除数是正数时，除以一个小于 1 的正数，商怎样变化？',answer:'6.48 ÷ 0.9 > 6.48。',steps:[['题意','被除数 6.48 是正数，除数 0.9 大于 0、小于 1。'],['依据','一个正数除以大于 0、小于 1 的数，商比被除数大。也可以想：求多少个 0.9 才组成 6.48，比求多少个 1 需要的个数更多。'],['结论','因此，6.48 ÷ 0.9 的商比 6.48 大。']],mistake:'“除法会越除越小”不总成立。比较商与被除数，要看除数与 1 的关系，同时注意这里被除数是正数。',extra:'对照：6.48 ÷ 1 = 6.48；6.48 ÷ 2 < 6.48；6.48 ÷ 0.9 > 6.48。本题不需要算出准确的商。'},
{id:'m4',label:'第4题 · 估算够不够',type:'作业第4题｜用估算作出判断',prompt:'一本练习本 8.2 元，买 7 本，带 55 元够吗？请用估算说明。',requirement:'写清楚把单价估成多少，以及实际总价比估算结果大还是小。',hint:'试着把每本 8.2 元往小估成 8 元。连估小后的总价都超过 55 元，实际总价会怎样？',answer:'不够。实际总价 > 8 × 7 = 56（元）> 55（元）。',steps:[['题意','买 7 本，每本 8.2 元，带了 55 元；把 8.2 元往小估成 8 元。'],['依据','8 × 7 = 56（元）。因为 8.2 > 8，所以实际总价大于 56 元，而 56 元已经大于 55 元。'],['结论','实际总价比 55 元多，所以带 55 元不够。']],mistake:'只写“约等于 56 元，所以不够”缺少关键理由。一定要补上：这是往小估，实际总价更大。',extra:'反过来想：如果把 8.2 元往大估成 9 元，得到 9 × 7 = 63（元）。63 元比 55 元多，仅凭这次往大估，不能断定实际钱够不够。'}
],
english:[
{id:'e1',label:'第1题 · 句子完整',type:'改错第1题｜每句只有一处错误',prompt:'My good friend Lily.',requirement:'圈出需要修改的位置，写出正确的完整句子。',hint:'这句话有“我的好朋友”和“Lily”，它们之间缺少表示“是”的词。',answer:'My good friend is Lily.',steps:[['错因','原句只有“我的好朋友 Lily”，缺少谓语，句子不完整。'],['依据','介绍“某人是谁”可以用“主语 + be 动词 + 人名”。My good friend 是单数，be 动词用 is。'],['改法','在 friend 后补 is。也可以写 Lily is my good friend.']],translation:'我的好朋友是莉莉。',mistake:'句子中有了人名，不代表句子就完整。读一遍，检查有没有说清“是谁／做什么／怎么样”。'},
{id:'e2',label:'第2题 · like / likes',type:'改错第2题｜每句只有一处错误',prompt:'She like drawing animals.',requirement:'先找主语，再检查动词的形式。',hint:'She 是第三人称单数。一般现在时里，like 在这里需要怎样变化？',answer:'She likes drawing animals.',steps:[['错因','主语是 She，原句的 like 没有使用第三人称单数形式。'],['依据','一般现在时，主语是 he、she 或单个人名时，实义动词通常用第三人称单数形式。like 变成 likes。'],['改法','把 like 改成 likes，drawing animals 保留。like doing sth. 表示“喜欢做某事”。']],translation:'她喜欢画动物。',mistake:'不要把 drawing 也改掉。likes 与主语 She 对应，drawing 是 like 后的动词 -ing 形式。'},
{id:'e3',label:'第3题 · 找回主语',type:'改错第3题｜每句只有一处错误',prompt:'After school, often play badminton in the park.',requirement:'读出“谁经常打羽毛球”，再补全句子。',hint:'After school 交代时间，in the park 交代地点。句子还没有说是谁在做这件事。',answer:'After school, we often play badminton in the park.',steps:[['错因','原句有时间、频率、动作和地点，却缺少动作的发出者，也就是主语。'],['依据','陈述句需要把“谁做什么”说完整。结合朋友话题，可以补 we。often 通常放在实义动词 play 前。'],['改法','在 often 前补 we。补 I 或 they 也可以成立；如果用 she，还要把 play 改成 plays。']],translation:'放学后，我们经常在公园打羽毛球。',mistake:'After school 只是时间短语，不能当作“谁”。不要因为句首已有单词，就以为主语已经有了。'},
{id:'e4',label:'第4题 · can 后原形',type:'改错第4题｜每句只有一处错误',prompt:'Lily can plays badminton very well.',requirement:'注意动词前有没有 can。',hint:'can 表示“会、能”。can 后面的动词要用什么形式？',answer:'Lily can play badminton very well.',steps:[['错因','原句在 can 后用了 plays。'],['依据','情态动词 can 后接动词原形，不因主语 Lily 是第三人称单数而加 -s。'],['改法','把 plays 改成 play。Lily plays badminton. 和 Lily can play badminton. 的动词形式要区分。']],translation:'莉莉羽毛球打得很好。',mistake:'先看有没有 can，再判断动词形式。不能只看到 Lily，就给 play 加 -s。'},
{id:'e5',label:'第5题 · because 从句',type:'改错第5题｜每句只有一处错误',prompt:'I like playing with her because she kind.',requirement:'分别检查 because 前后的意思是否完整。',hint:'kind 是“友善的”，用来形容人。“她很友善”中还缺少哪个词？',answer:'I like playing with her because she is kind.',steps:[['错因','because 后面的 she kind 缺少 be 动词。kind 是形容词，不能直接当作谓语动词。'],['依据','“某人怎么样”可以用“主语 + be 动词 + 形容词”。主语 she 后用 is。'],['改法','在 she 后补 is，让 because 后的原因成为完整的句子。']],translation:'我喜欢和她一起玩，因为她很友善。',mistake:'because 后面要说明完整的原因。检查“谁 + 做什么／怎么样”，不要只拼接几个单词。'},
{id:'e6',label:'第6题 · 时间和地点',type:'扩句第6题｜提示词都要用上',prompt:'We read books.',requirement:'提示：after school / often / in the library。把短句写具体，注意句首大写和标点。',hint:'先保留主干 We read books，再加入“什么时候”“多经常”“在哪里”。often 放在 read 前。',answer:'After school, we often read books in the library.',steps:[['主干','We read books. 先说清“我们读书”。'],['扩写','加 after school 说明时间；加 often 说明频率；加 in the library 说明地点。'],['检查','After school 放句首时，After 要大写，短语后可以加逗号。句末用句号。We often read books in the library after school. 也是正确的安排。']],translation:'放学后，我们经常在图书馆读书。',mistake:'先保证主干完整，再加细节。不要为了加入提示词，把 We 或 read 漏掉。'},
{id:'e7',label:'第7题 · when 连句',type:'扩句第7题｜把帮助发生的情境写清楚',prompt:'Lily helps me.',requirement:'用 when 写清楚“我不会拼单词时，她会帮助我”。',hint:'“不会拼单词”可以说 I can’t spell words。用 when 把这个情境接在原句后面。',answer:'Lily helps me when I can’t spell words.',steps:[['主干','Lily helps me. 说清谁帮助谁。Lily 是第三人称单数，所以用 helps。'],['情境','when I can’t spell words 表示“当我不会拼单词时”。can’t 后用动词原形 spell。'],['连句','也可以写 When I can’t spell words, Lily helps me. when 从句放在前面时，后面加逗号。']],translation:'当我不会拼单词时，莉莉会帮助我。',mistake:'when 后面也要有完整的主语和谓语。不能只写 when can’t spell words。'}
],
writing:[{id:'w0',label:'六句作文 · 我的朋友',type:'六句小作文｜换成自己的朋友',prompt:'My Good Friend',requirement:'每条提示写一句。先说自己的内容，再组织英文；尽量用上 and、but、when、because。',composition:true}]
};
const writingPrompts=[
['朋友是谁？你们是什么关系？','Lily is my good friend and we are classmates.','and 连接两个有关联的信息。人名和关系要换成自己的真实情况。'],
['他／她喜欢什么？补一个具体细节。','She likes drawing animals, especially cats.','主语是 She，注意 likes；especially cats 补充“尤其是猫”这个具体细节。'],
['你们常在什么时候、哪里做什么？','After school, we often play badminton in the park.','先说完整主干 we play badminton，再补时间、频率和地点。'],
['你们有什么不同？用 but。','She likes drawing, but I like reading.','but 表示转折。She likes 与 I like 要分别检查。'],
['他／她怎样帮助过你？用 when。','She helps me when I can’t spell words.','when 后的 I can’t spell words 有完整的主语和谓语。can’t 后用 spell 原形。'],
['你为什么喜欢这个朋友？用 because。','I like her because she is kind and helpful.','because 后说明完整原因。kind 和 helpful 是形容词，前面需要 is。']
];
const KEY='grade5-class-20261118-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){}
const state={subject:['math','english','writing'].includes(saved.subject)?saved.subject:'math',index:0,answers:saved.answers||{},ink:saved.ink||{},reviewed:saved.reviewed||{},checks:saved.checks||{}};
const undoStacks={};let tool='browse',activeStroke=null,toastTimer;
const $=id=>document.getElementById(id);
const current=()=>lessons[state.subject][state.index];
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isEnglish=()=>state.subject!=='math';
function save(){try{localStorage.setItem(KEY,JSON.stringify({subject:state.subject,answers:state.answers,ink:state.ink,reviewed:state.reviewed,checks:state.checks}));$('saveStatus').textContent='已自动保存';}catch(e){$('saveStatus').textContent='本次可用，浏览器未允许保存';}}
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3300);}
function updateSidebar(){
 const qs=lessons[state.subject];
 $('questionList').innerHTML=qs.map((q,i)=>`<button class="question-link ${i===state.index?'active':''}" data-index="${i}" ${i===state.index?'aria-current="step"':''}><span class="q-index">${state.subject==='math'?(i===0?'例':i):i+1}</span><span>${safe(q.label)}</span>${state.reviewed[q.id]?'<span class="check">✓</span>':''}</button>`).join('');
 const done=qs.filter(q=>state.reviewed[q.id]).length;
 $('progressBar').style.width=`${done/qs.length*100}%`;$('progressText').textContent=`已讲完 ${done} / ${qs.length}`;
 document.querySelectorAll('[data-subject]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.subject===state.subject)));
 const config={math:['数学说理','11月17日作业 · 先口头说明，再落笔','说理三步','先说题意<br>再写依据<br>最后得出结论'],english:['英语改错与扩句','11月16日作业 · 先找问题，再核对句子','检查顺序','谁是主语？<br>动词形式对吗？<br>句子意思完整吗？'],writing:['六句话写我的朋友','11月16日作业 · 先写对，再写具体','写作顺序','先说自己的内容<br>再写完整的句子<br>最后检查并连成文章']}[state.subject];
 [$('sectionTitle').textContent,$('sectionSubtitle').textContent,$('sideTitle').textContent]=config;
 $('sideText').innerHTML=config[3];$('currentNum').textContent=state.index+1;$('totalNum').textContent=` / ${qs.length}`;
 document.documentElement.style.setProperty('--accent',state.subject==='math'?'#254775':'#226347');document.documentElement.style.setProperty('--soft',state.subject==='math'?'#eaf0f8':'#edf5ef');
}
function render(){
 activeStroke=null;setTool('browse');updateSidebar();
 const q=current();
 let html=`<div class="question-type">${safe(q.type)}</div><div class="prompt ${isEnglish()?'en':''}">${safe(q.prompt)}</div>${q.formula?`<div class="math-expression">${safe(q.formula)}</div>`:''}<p class="requirement">${safe(q.requirement)}</p>`;
 if(q.composition){
 html+=`<div class="task-prompts"><p>先口头回答：朋友是谁？你们一起做什么？你为什么喜欢他／她？</p><p>下面每条写一句。参考句按需展开，不用照抄。</p></div><div id="composition">`;
 html+=writingPrompts.map((p,i)=>`<section class="compose-line"><h3>${i+1}. ${safe(p[0])}</h3><textarea class="en-input" data-answer="w${i+1}" aria-label="作文第${i+1}句" placeholder="写自己的句子…">${safe(state.answers['w'+(i+1)]||'')}</textarea><details><summary>看这一句的参考写法与讲解</summary><div class="model">${safe(p[1])}</div><p>${safe(p[2])}</p></details></section>`).join('');
 html+=`</div><div class="self-check">${['主语和动词完整','like / likes 正确','can 后用原形','连接词后意思完整','句首大写','句末有标点'].map((s,i)=>`<label><input type="checkbox" data-check="${i}" ${state.checks[i]?'checked':''}>${s}</label>`).join('')}</div><div class="reveal-actions"><button id="paragraphBtn" class="primary">连成一篇作文</button></div><div id="paragraph" class="solution" hidden><h3>我的六句作文</h3><div id="paragraphText" class="prompt en"></div><p class="requirement">读一遍，检查有没有重复、主语变化和遗漏的词。</p></div>`;
 }else{
 if(state.subject==='math')html+=`<div class="writing">${['题意','依据','结论'].map((l,i)=>`<div class="write-row"><label for="note${i}">${l}</label><textarea id="note${i}" data-answer="${q.id}-${i}" aria-label="${l}" placeholder="${['说清楚题目中的变化或要比较的量…','写出适用的规律或算式…','用“所以”写清判断…'][i]}">${safe(state.answers[q.id+'-'+i]||'')}</textarea></div>`).join('')}</div>`;
 else html+=`<div class="writing"><label class="badge" for="englishAnswer">我的订正／扩句</label><textarea id="englishAnswer" class="en-input" data-answer="${q.id}" aria-label="我的英文作答" placeholder="可以先口头说，也可以在这里写…">${safe(state.answers[q.id]||'')}</textarea></div>`;
 html+=`<div class="reveal-actions"><button id="hintBtn" aria-expanded="false" aria-controls="hint">给一点提示</button><button id="answerBtn" class="primary" aria-expanded="false" aria-controls="solution">${isEnglish()?'核对答案':'看参考答案'}</button><button id="explainBtn" aria-expanded="false" aria-controls="explanation">展开详细解析</button></div><div class="hint" id="hint" hidden>${safe(q.hint)}</div><section class="solution" id="solution" hidden><h3>${isEnglish()?'参考句子':'参考答案'}</h3><div class="answer ${isEnglish()?'en':''}">${safe(q.answer)}</div><div id="explanation" hidden>${visual(q)}<div class="explanation">${q.steps.map(s=>`<div class="step"><span class="step-label">${safe(s[0])}</span><div>${safe(s[1])}</div></div>`).join('')}</div><div class="mistake"><strong>易错提醒：</strong>${safe(q.mistake)}</div>${q.translation?`<details class="translation"><summary>查看中文意思</summary><p>${safe(q.translation)}</p></details>`:''}${q.extra?`<details><summary>再核验／对照一下</summary><p>${safe(q.extra)}</p></details>`:''}</div></section>`;
 }
 $('boardContent').innerHTML=html;
 $('reviewed').checked=Boolean(state.reviewed[q.id]);$('prevBtn').disabled=state.index===0&&state.subject==='math';$('nextBtn').textContent=state.index===lessons[state.subject].length-1?(state.subject==='math'?'进入英语':state.subject==='english'?'进入作文':'本课讲完'):'下一题';
 $('boardContent').querySelectorAll('textarea').forEach(t=>t.addEventListener('input',()=>{state.answers[t.dataset.answer]=t.value;save();}));
 $('boardContent').querySelectorAll('[data-check]').forEach(t=>t.addEventListener('change',()=>{state.checks[t.dataset.check]=t.checked;save();}));
 if(!q.composition){
 $('hintBtn').onclick=()=>toggleBlock('hint','hintBtn','给一点提示','收起提示');
 $('answerBtn').onclick=()=>{const willOpen=$('solution').hidden;$('solution').hidden=!willOpen;$('answerBtn').setAttribute('aria-expanded',String(willOpen));$('answerBtn').textContent=willOpen?'收起答案':isEnglish()?'核对答案':'看参考答案';if(!willOpen){$('explanation').hidden=true;$('explainBtn').textContent='展开详细解析';$('explainBtn').setAttribute('aria-expanded','false');}resizeInk();};
 $('explainBtn').onclick=()=>{const willOpen=$('explanation').hidden;$('solution').hidden=false;$('answerBtn').textContent='收起答案';$('answerBtn').setAttribute('aria-expanded','true');$('explanation').hidden=!willOpen;$('explainBtn').textContent=willOpen?'收起详细解析':'展开详细解析';$('explainBtn').setAttribute('aria-expanded',String(willOpen));resizeInk();};
 }else $('paragraphBtn').onclick=()=>{const sentences=writingPrompts.map((_,i)=>(state.answers['w'+(i+1)]||'').trim());if(sentences.some(s=>!s)){toast('请先把六句话都写好，再连成一篇。');return;}$('paragraphText').textContent=sentences.join(' ');$('paragraph').hidden=false;resizeInk();};
 $('boardContent').querySelectorAll('details').forEach(d=>d.addEventListener('toggle',resizeInk));
 renderInk();requestAnimationFrame(resizeInk);save();
}
function visual(q){if(q.visual==='product')return'<div class="transform"><div>4.8 → 48<small>第一个因数 × 10</small></div><div>2.5 → 0.25<small>第二个因数 ÷ 10</small></div><div>× 10 ÷ 10 = 1<small>积不变</small></div></div>';if(q.visual==='quotient')return'<div class="transform"><div>12.6 → 1260<small>被除数 × 100</small></div><div>0.35 → 35<small>除数 × 100</small></div><div>1260 ÷ 35<small>商不变</small></div></div>';return '';}
function toggleBlock(id,btn,closed,open){const el=$(id);el.hidden=!el.hidden;$(btn).textContent=el.hidden?closed:open;$(btn).setAttribute('aria-expanded',String(!el.hidden));resizeInk();}
function navigate(subject,index){state.subject=subject;state.index=index;render();if(window.innerWidth<761)$('sectionTitle').scrollIntoView({block:'start'});else window.scrollTo({top:0});}
document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>navigate(b.dataset.subject,0));
$('questionList').onclick=e=>{const b=e.target.closest('[data-index]');if(b)navigate(state.subject,Number(b.dataset.index));};
$('prevBtn').onclick=()=>{if(state.index>0)navigate(state.subject,state.index-1);else if(state.subject==='english')navigate('math',lessons.math.length-1);else if(state.subject==='writing')navigate('english',lessons.english.length-1);};
$('nextBtn').onclick=()=>{if(state.index<lessons[state.subject].length-1)navigate(state.subject,state.index+1);else if(state.subject==='math')navigate('english',0);else if(state.subject==='english')navigate('writing',0);else{state.reviewed[current().id]=true;$('reviewed').checked=true;updateSidebar();save();toast('本课已讲完。可以从左侧回看需要巩固的题。');}};
$('reviewed').onchange=e=>{state.reviewed[current().id]=e.target.checked;save();updateSidebar();};
$('fontBtn').onclick=()=>{const big=$('fontBtn').getAttribute('aria-pressed')!=='true';$('fontBtn').setAttribute('aria-pressed',String(big));$('fontBtn').textContent=big?'标准字号':'大字';document.documentElement.style.setProperty('--scale',big?'1.18':'1');requestAnimationFrame(resizeInk);};
$('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){toast('当前浏览器不支持全屏，可使用浏览器的全屏功能。');}};
document.addEventListener('fullscreenchange',()=>{$('fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏讲课';resizeInk();});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight')$('nextBtn').click();if(e.key==='ArrowLeft')$('prevBtn').click();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}});
const svg=$('inkLayer'),NS='http://www.w3.org/2000/svg';
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===t)));svg.classList.toggle('drawing',t!=='browse');svg.classList.toggle('erase',t==='erase');$('modeNote').hidden=t==='browse';}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function resizeInk(){const b=$('board').getBoundingClientRect();svg.setAttribute('viewBox',`0 0 1000 ${b.height/b.width*1000}`);}
new ResizeObserver(resizeInk).observe($('board'));
function point(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1000,y:(e.clientY-r.top)/r.width*1000};}
function list(){return state.ink[current().id]||(state.ink[current().id]=[]);}
function snapshot(){const id=current().id;(undoStacks[id]||(undoStacks[id]=[])).push(JSON.stringify(list()));if(undoStacks[id].length>40)undoStacks[id].shift();}
function strokeNode(s){let el;if(s.kind==='circle'){el=document.createElementNS(NS,'ellipse');el.setAttribute('cx',(s.x1+s.x2)/2);el.setAttribute('cy',(s.y1+s.y2)/2);el.setAttribute('rx',Math.max(2,Math.abs(s.x2-s.x1)/2));el.setAttribute('ry',Math.max(2,Math.abs(s.y2-s.y1)/2));}else{el=document.createElementNS(NS,'path');el.setAttribute('d',s.points.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(' '));}el.setAttribute('fill','none');el.setAttribute('stroke',s.color);el.setAttribute('stroke-width',s.width);el.setAttribute('stroke-linecap','round');el.setAttribute('stroke-linejoin','round');el.setAttribute('opacity',s.opacity||1);el.setAttribute('data-stroke',s.id);return el;}
function renderInk(){svg.replaceChildren(...list().map(strokeNode));}
svg.addEventListener('pointerdown',e=>{if(tool==='browse'||e.button>0)return;e.preventDefault();if(tool==='erase'){const target=e.target.closest('[data-stroke]');if(target){snapshot();state.ink[current().id]=list().filter(s=>s.id!==target.dataset.stroke);renderInk();save();}return;}snapshot();const p=point(e);activeStroke={id:String(Date.now())+Math.random().toString(36).slice(2,6),kind:tool==='circle'?'circle':'path',color:tool==='blue'?'#245bbb':tool==='marker'?'#f4cb25':'#c33339',width:tool==='marker'?18:2.7,opacity:tool==='marker'?.34:1,points:[p,{x:p.x+.01,y:p.y+.01}],x1:p.x,y1:p.y,x2:p.x,y2:p.y};list().push(activeStroke);svg.setPointerCapture(e.pointerId);renderInk();});
svg.addEventListener('pointermove',e=>{if(!activeStroke)return;e.preventDefault();const p=point(e);if(activeStroke.kind==='circle'){activeStroke.x2=p.x;activeStroke.y2=p.y;}else activeStroke.points.push(p);const old=svg.lastElementChild;if(old)old.replaceWith(strokeNode(activeStroke));});
function endStroke(){if(!activeStroke)return;activeStroke=null;save();}
svg.addEventListener('pointerup',endStroke);svg.addEventListener('pointercancel',endStroke);svg.addEventListener('lostpointercapture',endStroke);
function undo(){const stack=undoStacks[current().id];if(!stack||!stack.length){toast('这题没有可撤销的笔迹操作。');return;}activeStroke=null;state.ink[current().id]=JSON.parse(stack.pop());renderInk();save();}
$('undoBtn').onclick=undo;$('clearInkBtn').onclick=()=>{if(!list().length)return;snapshot();state.ink[current().id]=[];renderInk();save();toast('本题笔迹已清空，可以撤销。');};
window.addEventListener('resize',resizeInk);
render();
</script>
