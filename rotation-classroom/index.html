<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f2e9">
<meta name="description" content="小学数学旋转互动演示：七个课堂动画，十八道有图、有动画的生活练习。">
<title>图形的旋转｜互动课件</title>
<style>
:root {
  color-scheme:light; --ink:#172b29; --muted:#506561; --paper:#f4f2e9; --white:#fffdf7;
  --line:#d9dfd4; --teal:#146357; --teal-dark:#10443c; --mint:#e5eee5; --rust:#a13f28;
  --orange:#c24f31; --slate:#627f79; --axis:#a7beb4;
}
* {box-sizing:border-box}
body {margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Instrument Sans","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;}
button,select,input {font:inherit;color:inherit;}
button,select {cursor:pointer;}
button {touch-action:manipulation;}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible {outline:3px solid #b65333;outline-offset:3px;}
.skip {position:absolute;left:12px;top:12px;z-index:1;padding:8px 14px;background:#fffdf7;color:var(--teal-dark);transform:translateY(-200%);}
.skip:focus {transform:none;}
[hidden] {display:none!important;}
::selection {background:#f2d0b1;color:#172b29;}
.wrap {width:min(1250px,calc(100% - 64px));margin:auto;}
header {padding:32px 0 20px;border-bottom:1px solid var(--line);}
.mast {display:flex;justify-content:space-between;align-items:end;gap:18px;}
h1,h2,p {margin:0;}
h1 {font-family:"Noto Serif CJK SC","Songti SC",serif;font-weight:900;line-height:1.12;font-size:clamp(36px,5.4vw,66px);letter-spacing:.015em;}
.mast p {color:var(--muted);font-weight:650;padding-bottom:3px;}
main {padding-bottom:36px;}
nav {display:flex;flex-wrap:wrap;gap:8px;padding:16px 0 19px;}
nav button {border:1px solid var(--line);border-radius:8px;min-height:46px;background:var(--white);padding:6px 12px;display:flex;align-items:center;gap:8px;font-weight:700;}
nav button:hover {border-color:#779d88;}
nav button[aria-pressed="true"] {background:var(--teal-dark);border-color:var(--teal-dark);color:#fffef5;}
.index {font-feature-settings:"tnum";font-size:13px;font-weight:800;color:var(--teal);}
nav button[aria-pressed="true"] .index {color:#bae2c8;}
nav button.life-tab:not([aria-pressed="true"]) {border-color:#86a499;background:#e5eee5;color:var(--teal-dark);}
.lesson {display:grid;grid-template-columns:minmax(0,1fr) minmax(292px,350px);gap:20px;align-items:start;}
.board,aside {border:1px solid var(--line);border-radius:15px;background:var(--white);overflow:hidden;min-width:0;}
.board-head {display:flex;min-height:54px;padding:10px 17px;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
.figure-label {display:flex;align-items:center;gap:8px;font-size:14px;font-weight:750;color:var(--muted);}
.figure-label::before {content:"";display:block;width:11px;height:11px;border-radius:50%;background:var(--teal);}
#measure {font-weight:850;font-variant-numeric:tabular-nums;color:var(--rust);}
.stage {display:block;width:100%;height:auto;background:#f9fbf5;aspect-ratio:640/415;}
.stage text {font-family:inherit;font-weight:700;}
.controls {padding:13px 17px 16px;border-top:1px solid var(--line);}
.scrub {display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;margin-bottom:10px;font-size:14px;color:var(--muted);font-weight:700;}
.scrub input {width:100%;margin:0;accent-color:var(--teal);min-height:32px;cursor:pointer;}
.keys {display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.control,select,.choice {border:1px solid #c8d5c9;background:white;border-radius:8px;padding:8px 12px;min-height:44px;font-weight:750;}
.control:not(:disabled):hover,select:hover,.choice:hover {border-color:var(--teal);background:#f1f7ef;}
.control:disabled {background:#f2f1e9;color:#62736e;cursor:default;}
.control.primary {background:var(--teal);border-color:var(--teal);color:white;}
.control.primary:hover {background:var(--teal-dark);}
#speed-label {margin-left:auto;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);}
select {max-width:100%;}
aside {padding:19px 20px 20px;}
#grade {font-size:13px;font-weight:800;color:var(--teal);margin-bottom:4px;letter-spacing:.06em;}
h2 {font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:clamp(24px,2.5vw,33px);line-height:1.3;font-weight:900;}
#intro {margin-top:9px;color:var(--muted);}
.options {display:grid;gap:9px;margin:15px 0;}
.options label {display:grid;gap:4px;font-size:14px;font-weight:800;color:var(--muted);}
.options select {color:var(--ink);font-size:16px;}
.question-nav {display:flex;gap:8px;}
.question-nav button {flex:1;}
.challenge {border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0;margin:15px 0;}
h3 {font-size:16px;margin:0 0 5px;color:var(--teal-dark);}
#question {font-weight:750;margin-bottom:9px;}
.choices {display:flex;gap:6px;flex-wrap:wrap;}
.choice {font-size:14px;text-align:left;line-height:1.4;padding-inline:10px;}
.choice[aria-pressed="true"] {background:var(--mint);border-color:var(--teal);color:var(--teal-dark);}
#feedback {margin-top:8px;font-size:14px;font-weight:700;color:var(--rust);}
#feedback.good {color:var(--teal);}
.explain {padding:12px 13px;background:var(--mint);border-radius:9px;color:#244e45;}
.explain p {font-size:15px;}
details {margin-top:14px;}
summary {color:var(--teal-dark);font-weight:750;cursor:pointer;min-height:38px;padding-top:6px;}
details p {color:var(--muted);font-size:15px;}
@media(max-width:900px) {.wrap {width:calc(100% - 36px);} .lesson {gap:14px;grid-template-columns:minmax(0,1fr) minmax(270px,300px);} aside {padding:15px;} }
@media(max-width:700px) {
  .wrap {width:calc(100% - 24px);} header {padding:21px 0 13px;} .mast {align-items:start;flex-direction:column;gap:4px;}
  .mast p {font-size:14px;} nav {padding:12px 0;gap:6px;} nav button {font-size:14px;padding:4px 7px;gap:5px;}
  .index {font-size:11px;} .lesson {grid-template-columns:1fr;} .board,aside {border-radius:11px;}
  .board-head {padding:8px 11px;min-height:43px;} .figure-label,#measure {font-size:13px;}
  .controls {padding:9px 11px 12px;} .keys {gap:6px;} .control {padding-inline:9px;font-size:14px;}
  #speed-label {font-size:13px;gap:4px;margin-left:0;} #speed {font-size:14px;padding:6px;}
  aside {padding:15px;} #intro {margin-top:7px;}
}
</style>
</head>
<body>
<a class="skip" href="#main">跳到演示</a>
<header><div class="wrap mast"><h1>图形的旋转</h1><p>五年级数学 · 互动课件</p></div></header>
<main class="wrap" id="main">
<nav id="lessons" aria-label="选择演示"></nav>
<div class="lesson">
  <section class="board" aria-label="动画演示">
    <div class="board-head"><span id="figure-label" class="figure-label"></span><output id="measure" aria-label="当前动画状态" aria-live="off"></output></div>
    <svg id="stage" class="stage" viewBox="0 0 640 415" role="img" aria-labelledby="drawing-title"><title id="drawing-title">旋转示意图</title></svg>
    <div class="controls">
      <label class="scrub">演示进度 <input id="timeline" type="range" min="0" max="1000" value="0"></label>
      <div class="keys">
        <button id="play" class="control primary" type="button">播放</button>
        <button id="previous" class="control" type="button">上一步</button>
        <button id="next" class="control" type="button">下一步</button>
        <button id="reset" class="control" type="button">重置</button>
        <label id="speed-label">速度 <select id="speed"><option value="0.5">0.5 倍</option><option value="1" selected>1 倍</option><option value="1.5">1.5 倍</option></select></label>
      </div>
    </div>
  </section>
  <aside aria-labelledby="scene-title">
    <p id="grade"></p>
    <h2 id="scene-title"></h2>
    <p id="intro"></p>
    <div id="options" class="options"></div>
    <section class="challenge" aria-labelledby="challenge-title">
      <h3 id="challenge-title">先猜一猜</h3>
      <p id="question"></p>
      <div class="choices" id="choices"></div>
      <p id="feedback" role="status" hidden></p>
    </section>
    <div class="explain"><h3 id="step-title"></h3><p id="step-copy"></p></div>
    <details id="teacher"><summary>课堂提问</summary><p id="teacher-copy"></p></details>
  </aside>
</div>
</main>
<script>
"use strict";
const byId = id => document.getElementById(id);
const stage = byId("stage");
const teal = "#146357";
const orange = "#c24f31";
const rust = "#a13f28";
const ink = "#172b29";
const muted = "#506561";
const ghost = "#6e8780";
const paper = "#f9fbf5";
const startFill = "#dcece3";
const moveFill = "#f8ddc8";
const tau = Math.PI / 180;
const at = (center, r, angle) => [center[0] + r * Math.cos(angle * tau), center[1] + r * Math.sin(angle * tau)];
const length = (a,b) => Math.hypot(a[0]-b[0],a[1]-b[1]);
const orientation = (p,o) => Math.atan2(p[1]-o[1],p[0]-o[0])/tau;
const rotate = (p,o,angle) => at(o,length(p,o),orientation(p,o)+angle);
const xy = p => p.map(n => Math.round(n*100)/100).join(" ");
const offset = (p,x,y) => [p[0]+x,p[1]+y];
const clamp = n => Math.max(0,Math.min(1,n));
const fmt = n => Math.round(Math.abs(n));
const pos = value => ((value % 12 + 12) % 12) || 12;
const line = (a,b,color=ink,width=2,more="") => '<path d="M '+xy(a)+' L '+xy(b)+'" fill="none" stroke="'+color+'" stroke-width="'+width+'" stroke-linecap="round" '+more+'/>';
const shape = (p,fill,stroke,width=3,extra="") => '<polygon points="'+p.map(xy).join(" ")+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+width+'" stroke-linejoin="round" '+extra+'/>';
const dot = (p,color=ink,r=5) => '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="'+color+'" stroke="'+paper+'" stroke-width="2"/>';
const label = (p,value,color=ink,size=18,anchor="middle") => '<text x="'+p[0]+'" y="'+p[1]+'" text-anchor="'+anchor+'" fill="'+color+'" font-size="'+size+'" paint-order="stroke fill" stroke="'+paper+'" stroke-width="3.5" stroke-linejoin="round">'+value+'</text>';
const dash = 'stroke-dasharray="7 6"';
const definitions = '<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="'+orange+'"/></marker><pattern id="grid" width="32" height="32" x="0" y="16" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#dce6dc" stroke-width="1"/></pattern></defs>';

function sweep(center,r,begin,delta,color=orange,arrow=true,dotted=false) {
  if (Math.abs(delta)<0.5) return "";
  const pieces = Math.ceil(Math.abs(delta)/165);
  let path = "M "+xy(at(center,r,begin));
  for (let i=1;i<=pieces;i++) {
    path += " A "+r+" "+r+" 0 0 "+(delta>0?1:0)+" "+xy(at(center,r,begin+delta*i/pieces));
  }
  return '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="3.5" stroke-linecap="round" '+(arrow?'marker-end="url(#arrow)" ':'')+(dotted?dash:"")+'/>';
}
function pivot(p,name="O") {
  return dot(p,ink,6)+label(offset(p,12,22),name,ink,17,"start");
}
function graph(desc,body,measure) {
  stage.innerHTML = '<title id="drawing-title">'+desc+'</title>'+definitions+body;
  byId("measure").textContent = measure;
}
function grid() {
  return '<rect x="48" y="16" width="544" height="384" rx="4" fill="url(#grid)" stroke="#dce6dc"/>';
}
function callout(x,y,value,color=muted) {
  return label([x,y],value,color,17);
}
function clockScene(t,c) {
  const o=[320,203], angle=(+c.start%12)*30-90;
  const target=(c.dir==="顺时针"?1:-1)*Number(c.deg);
  const delta=target*t;
  let body='<circle cx="320" cy="203" r="162" fill="#fffef8" stroke="#9bb8ab" stroke-width="2"/>';
  for(let i=0;i<60;i++) {
    const a=-90+i*6, major=i%5===0;
    body+=line(at(o,major?145:152,a),at(o,157,a),major?teal:"#98ac9f",major?2.8:1.2);
    if(major) body+=label(offset(at(o,126,a),0,7),pos(i/5),ink,23);
  }
  body+=line(o,at(o,101,angle),ghost,3,dash);
  body+=sweep(o,104,angle,delta);
  body+=line(o,at(o,100,angle+delta),orange,5)+dot(at(o,100,angle+delta),orange,5)+pivot(o);
  if(t===1) body+=callout(320,393,"指向数字 "+pos(+c.start+target/30),rust);
  graph("钟面上指针绕钟心 O 旋转",body,"已转 "+fmt(delta)+"° · "+Math.floor((Math.abs(delta)+0.01)/30)+" 个大格");
}
function gridScene(t,c,triangle) {
  const o=[320,208], a=[224,208], b=[320,80];
  const sign=c.dir==="顺时针"?1:-1;
  const degrees=(triangle?90:Number(c.deg))*sign;
  const angle=degrees*t;
  const aNow=rotate(a,o,angle), bNow=rotate(b,o,angle);
  let body=grid();
  if(triangle) body+=shape([o,a,b],startFill,ghost,2);
  else body+=line(o,b,ghost,3,dash);
  body+=label(offset(b,0,-14),"B",teal,20);
  if(triangle) body+=label(offset(a,-12,20),"A",teal,20);
  if(t>0.005) {
    body+=sweep(o,128,-90,angle,orange,true,true);
    if(triangle) body+=sweep(o,96,180,angle,orange,true,true);
    if(triangle) body+=shape([o,aNow,bNow],moveFill,orange,3,'fill-opacity=".52"');
    else body+=line(o,bNow,orange,5);
    body+=dot(bNow,orange,6)+label(offset(bNow,14,bNow[1]>o[1]?21:-10),"B′",rust,20,"start");
    if(triangle) body+=dot(aNow,orange,6)+label(offset(aNow,-11,aNow[1]>=o[1]?25:-10),"A′",rust,20,"end");
  } else if(triangle) {
    body+=line(o,a,teal,3)+line(o,b,teal,3);
    body+=callout(271,235,"3 格",teal)+callout(355,143,"4 格",teal);
  } else {
    body+=line(o,b,teal,4)+callout(353,144,"4 格",teal);
  }
  body+=dot(b,teal,5)+(triangle?dot(a,teal,5):"")+pivot(o);
  body+=callout(320,389,triangle?"OA 和 OA′ 一样长，OB 和 OB′ 一样长":"B 到 O 的距离始终是 4 格");
  graph(triangle?"方格上三角形 AOB 绕 O 旋转":"方格上线段 OB 绕 O 旋转",body,"已转 "+fmt(angle)+"°");
}
function cardArt(target=false) {
  const bg=target?"#f4f1de":"#f8e5c7";
  return '<rect width="92" height="92" rx="4" fill="'+bg+'" stroke="#b78259" stroke-width="1.6"/><path d="M12 83 Q48 83 53 41 T78 0 M50 48Q37 38 14 38" fill="none" stroke="#53725c" stroke-width="3"/><path d="M 45 22 Q 57 14 66 22 Q 62 35 52 34 Q 44 35 41 30 L 32 34 L 38 25 L 31 18 Z" fill="#be4f31"/><circle cx="59" cy="23" r="1.6" fill="#1e302a"/><path d="M65 24 L73 27 L65 30Z" fill="#775335"/><circle cx="14" cy="38" r="5" fill="#ce704a"/><circle cx="73" cy="7" r="5" fill="#ce704a"/>';
}
function cardScene(t) {
  const p=[196,229], turn=clamp(t/0.48), slide=clamp((t-0.52)/0.48);
  const a=turn*90, dx=190*slide, dy=51*slide;
  let body=label([150,115],"原来的位置",teal,19)+label([478,72],"目标拼图",teal,19);
  for(const [x,y,name] of [[386,96,"2"],[478,96,"3"],[478,188,"4"]]) {
    body+='<rect x="'+x+'" y="'+y+'" width="92" height="92" rx="3" fill="#e4eee0" stroke="#a3baaa" stroke-width="1.5"/>';
    body+=label([x+46,y+55],name,teal,23);
  }
  body+='<g transform="translate(478 188) rotate(90)" opacity=".34">'+cardArt(true)+'</g>';
  body+='<rect x="386" y="188" width="92" height="92" rx="3" fill="none" stroke="'+teal+'" stroke-width="2" '+dash+'/>';
  body+='<rect x="104" y="137" width="92" height="92" rx="3" fill="none" stroke="#a3baaa" stroke-width="2" '+dash+'/>';
  if(t>0 && slide===0) body+=sweep(p,117,-135,a,orange,true,true);
  if(t>=0.52) body+=line(p,[386,280],teal,2,dash);
  body+='<g transform="translate('+dx+' '+dy+') rotate('+a+' 196 229) translate(104 137)">'+cardArt()+'</g>';
  if(slide===0) body+=pivot(p);
  body+=label([150,260],"卡片 1",teal,18);
  body+=callout(320,361,t<0.52?"看小鸟的朝向和卡片的转轴":"朝向保持一致，整张卡片一起移动");
  graph("卡片一先绕右下角顺时针旋转再平移进入空格",body,t<0.52?"旋转 "+fmt(a)+"°":slide<1?"平移中":"拼接完成");
}

const overlapShapes=[
  {name:"长方形",deg:180,points:[[-112,-69],[112,-69],[112,69],[-112,69]]},
  {name:"正方形",deg:90,points:[[-86,-86],[86,-86],[86,86],[-86,86]]},
  {name:"等边三角形",deg:120,points:Array.from({length:3},(_,i)=>at([0,0],121,-90+120*i))},
  {name:"正六边形",deg:60,points:Array.from({length:6},(_,i)=>at([0,0],113,-90+60*i))}
];
function overlapScene(t,c) {
  const g=overlapShapes.find(item=>item.name===c.shape);
  const o=[320,203], original=g.points.map(p=>offset(o,...p)), a=t*g.deg;
  const rotated=original.map(p=>rotate(p,o,a));
  let body=sweep(o,151,-90,a)+shape(original,startFill,teal,4,'stroke-dasharray="9 7"');
  if(t>0) body+=shape(rotated,moveFill,orange,3,'fill-opacity=".66"');
  body+=dot(original[0],teal,6)+dot(rotated[0],orange,5)+pivot(o);
  body+=callout(320,390,t===1?"轮廓重合，标记过的顶点到了另一个位置":"深绿虚线是原轮廓，橙色图形正在转动");
  graph(g.name+"绕中心旋转到第一次与原图重合",body,"已转 "+fmt(a)+"°");
}
function angleScene(t,c) {
  const large=c.example==="100° 例题";
  const o=large?[320,209]:[320,235];
  const a=large?at(o,100,180):at(o,119,-90);
  const b=large?at(o,153.21,80):at(o,119,0);
  const turn=large?100:-45, angle=turn*clamp(t/0.75);
  const aNew=rotate(a,o,angle), bNew=rotate(b,o,angle);
  const names=large?["B","C","B′","C′","A"]:["A","B","A₁","B₁","O"];
  let body=shape([o,a,b],startFill,teal,3)+sweep(o,47,orientation(a,o),angle);
  const nameAt=(p,name,color)=>label(offset(p,p[0]<o[0]?-13:13,p[1]>o[1]?21:-9),name,color,20);
  body+=nameAt(a,names[0],teal)+nameAt(b,names[1],teal)+pivot(o,names[4]);
  if(t>0.015) body+=shape([o,aNew,bNew],moveFill,orange,3,'fill-opacity=".38"')+nameAt(aNew,names[2],rust)+nameAt(bNew,names[3],rust)+dot(aNew,orange,5);
  if(t>=0.75) {
    if(large) {
      body+=sweep(o,74,180,100,orange,false);
      body+=label([274,125],"100°",rust,22)+label([154,192],"30°",ink,17)+label([245,233],"50°",ink,17);
    } else {
      body+=sweep(o,89,0,-135,teal,false,true)+label([401,165],"135°",teal,19)+label([273,179],"45°",rust,21);
    }
  }
  body+=callout(320,389,large?"跟踪 AB → AB′，并观察 AB 与 AC′ 的方向":"跟踪 OA → OA₁，图上圆弧表示转过的角");
  graph("寻找旋转前后的对应点与旋转角",body,t<0.75?"观察对应边":large?"旋转角 100°":"旋转角 45°");
}
function areaScene(t) {
  const a=[252,94], b=[192,254], h=[252,254], c=[412,254], d=[412,154], end=[412,94];
  const angle=-90*t;
  const bn=rotate(b,a,angle), hn=rotate(h,a,angle);
  let body=shape([a,d,c,h],startFill,teal,3);
  body+=shape([a,b,h],"none",ghost,2,dash);
  body+=shape([a,bn,hn],moveFill,orange,3,'fill-opacity=".9"');
  body+=sweep(a,112,90,angle,orange,true,true);
  if(t===1) body+=shape([a,end,c,h],"none",teal,3);
  body+=label(offset(a,-13,-10),"A",ink,19)+dot(a,ink)+label(offset(b,-9,22),"B",ink,18)+label(offset(h,0,25),"H",ink,18);
  body+=label(offset(c,13,21),"C",ink,18)+label(offset(d,14,6),"D",ink,18);
  if(t>0.015) body+=label(offset(hn,16,hn[1]>140?23:-10),"H′",rust,19);
  body+=callout(228,178,"2 dm",teal);
  if(t===1) body+=callout(332,77,"2 dm",teal)+label([320,374],"2 × 2 = 4 dm²",rust,24);
  else body+=callout(320,374,"绿色部分固定，橙色三角形绕 A 转");

function currentLife(c) {
  return lifeCases.find(item=>item.id===c.case)??lifeCases[0];
}
function filteredLife(group) {
  return group==="全部"?lifeCases:lifeCases.filter(item=>item.group===group);
}
function lifeScene(t,c) {
  const item=currentLife(c), index=lifeCases.indexOf(item)+1;
  let status="第 "+index+" / "+lifeCases.length+" 题";
  if(t>0) status=item.deg?"已转 "+Math.round(t*item.deg)+"°":t===1?"演示完成":"演示中";
  graph(item.name+"的旋转演示",item.draw(t),status);
}

const nav=byId("lessons"), scrubber=byId("timeline"), play=byId("play"), previous=byId("previous"), next=byId("next");
const reduced=matchMedia("(prefers-reduced-motion: reduce)");
let scene=scenes[0], activeIndex=0, settings={}, progress=0;
let timer=0, lastTime=null, renderedStep=-1;
function stop() {
  if(timer) cancelAnimationFrame(timer);
  timer=0;
  lastTime=null;
  play.textContent=progress>=1?"重播":"播放";
}
function show(value) {
  progress=clamp(value);
  scrubber.value=String(Math.round(progress*1000));
  scrubber.setAttribute("aria-valuetext",Math.round(progress*100)+"%");
  scene.draw(progress,settings);
  let i=0;
  for(const [index,mark] of scene.markers.entries()) if(progress>=mark-0.00001) i=index;
  if(i!==renderedStep) {
    const [title,copy]=scene.steps(settings)[i];
    byId("step-title").textContent=title;
    byId("step-copy").textContent=copy;
    renderedStep=i;
  }
  previous.disabled=progress===0;
  next.disabled=progress===1;
}
function setProgress(value) {
  stop();
  show(value);
  play.textContent=progress>=1?"重播":"播放";
}
function goToStep(forward) {
  const values=forward?scene.markers:[...scene.markers].reverse();
  const mark=values.find(item=>forward?item>progress+0.0001:item<progress-0.0001);
  setProgress(mark??(forward?1:0));
}
function frame(now) {
  if(lastTime!==null) {
    const speed=Number(byId("speed").value);
    show(progress+(now-lastTime)*speed/(scene.seconds*1000));
  }
  if(progress>=1) {stop();return;}
  lastTime=now;
  timer=requestAnimationFrame(frame);
}
function togglePlay() {
  if(timer) {stop();return;}
  if(progress>=1) show(0);
  if(reduced.matches) {goToStep(true);return;}
  play.textContent="暂停";
  timer=requestAnimationFrame(frame);
}
function question() {
  const [prompt,answers,correct,good,hint]=scene.ask(settings);
  const choices=byId("choices"), feedback=byId("feedback");
  byId("question").textContent=prompt;
  choices.replaceChildren();
  feedback.hidden=true;
  feedback.textContent="";
  for(const answer of answers) {
    const button=document.createElement("button");
    button.type="button";
    button.className="choice";
    button.textContent=answer;
    button.setAttribute("aria-pressed","false");
    button.addEventListener("click",()=>{
      for(const item of choices.children) item.setAttribute("aria-pressed",String(item===button));
      const isCorrect=answer===correct;
      feedback.classList.toggle("good",isCorrect);
      feedback.hidden=false;
      feedback.textContent=isCorrect?good:hint;
    });
    choices.append(button);
  }
}
function lifeOptions(options) {
  const group=document.createElement("select"), cases=document.createElement("select");
  function field(title,select) {
    const fieldLabel=document.createElement("label");
    fieldLabel.textContent=title;
    fieldLabel.append(select);
    options.append(fieldLabel);
  }
  for(const name of lifeGroups) group.add(new Option(name,name));
  field("生活场景",group);
  field("选择题目",cases);

  const actions=document.createElement("div");
  actions.className="question-nav";
  const buttons=["上一题","下一题"].map(label=>{
    const button=document.createElement("button");
    button.type="button";
    button.textContent=label;
    button.className="control";
    actions.append(button);
    return button;
  });
  options.append(actions);

  function showCase() {
    const item=currentLife(settings), list=filteredLife(settings.group);
    const i=list.indexOf(item);
    cases.value=item.id;
    buttons[0].disabled=i<=0;
    buttons[1].disabled=i===list.length-1;
    byId("grade").textContent=item.group+" · 生活练习";
    byId("figure-label").textContent=item.name+" · 旋转示意图";
    byId("scene-title").textContent=item.name;
    byId("teacher-copy").textContent=item.watch;
    byId("teacher").open=false;
    renderedStep=-1;
    question();
    setProgress(0);
  }
  function showList() {
    settings.group=group.value;
    const list=filteredLife(settings.group);
    cases.replaceChildren(...list.map(item=>new Option((lifeCases.indexOf(item)+1)+". "+item.name,item.id)));
    settings.case=list[0].id;
    showCase();
  }
  group.addEventListener("change",showList);
  cases.addEventListener("change",()=>{settings.case=cases.value;showCase();});
  for(const [j,button] of buttons.entries()) {
    button.addEventListener("click",()=>{
      const list=filteredLife(settings.group);
      const item=list[list.indexOf(currentLife(settings))+(j===0?-1:1)];
      if(item) {settings.case=item.id;showCase();}
    });
  }
  showList();
}
function chooseScene(index) {
  activeIndex=index;
  scene=scenes[index];
  settings={};
  for(const [i,button] of [...nav.children].entries()) button.setAttribute("aria-pressed",String(i===index));
  const options=byId("options");
  options.replaceChildren();
  if(scene===lifeLesson) {
    options.hidden=false;
    byId("intro").textContent=scene.intro;
    byId("challenge-title").textContent="先看图做题";
    lifeOptions(options);
    return;
  }
  options.hidden=scene.options.length===0;
  for(const [key,title,values] of scene.options) {
    const labelEl=document.createElement("label"), select=document.createElement("select");
    labelEl.textContent=title;
    settings[key]=values[0];
    for(const value of values) {
      const option=document.createElement("option");
      option.value=value;
      option.textContent=key==="deg"?value+"°":value;
      select.append(option);
    }
    select.addEventListener("change",()=>{
      settings[key]=select.value;
      renderedStep=-1;
      question();
      setProgress(0);
    });
    labelEl.append(select);
    options.append(labelEl);
  }
  byId("figure-label").textContent=scene.figure;
  byId("grade").textContent=scene.grade;
  byId("scene-title").textContent=scene.title;
  byId("intro").textContent=scene.intro;
  byId("challenge-title").textContent="先猜一猜";
  byId("teacher-copy").textContent=scene.teacher;
  byId("teacher").open=false;
  renderedStep=-1;
  question();
  setProgress(0);
}

for(const [i,item] of scenes.entries()) {
  const button=document.createElement("button");
  button.type="button";
  if(item===lifeLesson) button.className="life-tab";
  button.innerHTML='<span class="index" aria-hidden="true">'+(i+1)+'</span>'+item.tab;
  button.addEventListener("click",()=>{if(activeIndex!==i)chooseScene(i);});
  nav.append(button);
}
play.addEventListener("click",togglePlay);
previous.addEventListener("click",()=>goToStep(false));
next.addEventListener("click",()=>goToStep(true));
byId("reset").addEventListener("click",()=>setProgress(0));
scrubber.addEventListener("input",()=>setProgress(Number(scrubber.value)/1000));
reduced.addEventListener("change",()=>stop());
chooseScene(location.hash==="#life"?scenes.indexOf(lifeLesson):0);
</script>
</body>
</html>
