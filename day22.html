","text":"What if there is no one that I hit it off with?"},{"id":"B6","text":"I need some advice."}]}],"questions":[{"id":1,"passage":"A","type":"细节定位","text":"What does Miss Unhappy do in her class?","options":["She helps her classmates with Maths.","She collects the homework.","She cleans the classroom every day.","She writes homework for her friends."],"answer":1,"analysis":"- 月考对应题型：细节定位。\n- 原文线索：A1 collecting the homework in my class\n- 解题方法：找她负责的工作。\n- A错误：没有教数学。\n- B正确：明确收作业。\n- C错误：没有每天打扫教室。\n- D错误：收作业不是替朋友写作业。"},{"id":2,"passage":"A","type":"原因理解","text":"Why was it hard for Miss Unhappy to decide what to do?","options":["Her teacher was not at school.","She had forgotten her own homework.","She wanted to change to another class.","She did not want to get her friend into trouble."],"answer":3,"analysis":"- 月考对应题型：原因理解。\n- 原文线索：A3朋友请求不要告诉老师；A4 I didn’t want to get my friend into trouble\n- 解题方法：找她最初犹豫的原因，不选最后的决定。\n- A错误：没有说老师不在。\n- B错误：忘记作业的是朋友。\n- C错误：没有换班的信息。\n- D正确：不想让朋友陷入麻烦。"},{"id":3,"passage":"A","type":"人物特点推断","text":"What can we learn about Miss Unhappy from her decision?","options":["She thinks carefully before acting.","She enjoys getting her friends into trouble.","She never listens to other people.","She is proud when her friend is unhappy."],"answer":0,"analysis":"- 月考对应题型：人物特点推断。\n- 原文线索：A4不想让朋友陷入麻烦；A5 After giving it a lot of thought\n- 解题方法：根据认真考虑的行为推断，不简单判断告老师必然对或错。\n- A正确：认真思考后才行动。\n- B错误：与A4相反。\n- C错误：never过于绝对且无依据。\n- D错误：A6说难受，不是自豪。"},{"id":4,"passage":"A","type":"语境猜词","text":"What does “awful” in A6 mean?","options":["Very excited.","Very sleepy.","Very unhappy.","Very proud."],"answer":2,"analysis":"- 月考对应题型：语境猜词。\n- 原文线索：A6朋友不再和她说话，作者feel awful\n- 解题方法：联系情境判断情绪。\n- A错误：不符合激动的情绪。\n- B错误：没有困倦信息。\n- C正确：这里表示难受。\n- D错误：没有自豪的信息。"},{"id":5,"passage":"A","type":"最佳标题","text":"What is the best title for the post?","options":["How to Collect Homework","My Friend Does Not Talk to Me","A Happy Day with My Teacher","How to Finish Homework Quic function intro(){let scenes=[['学校','⌂','I feel pressure at school.','我在学校感到压力。'],['朋友','↔','I have a problem with my friend.','我和朋友之间遇到了一个问题。'],['作业','✎','I need help with my homework.','我需要作业方面的帮助。']];return head('01','今天有什么烦恼？','从学校、朋友和作业出发，听一听同龄人的困惑。今天读懂两则求助帖子。','3分钟 · 热身')+`<section class="card hero"><div><span class="tinylabel" style="color:#c6d6b1">TEEN TO TEEN / HELP DESK</span><h2 style="margin-top:15px">每一个问题，<br>都可以从一句话开始。</h2><p>先认识词，再连成句子。最后找到原文里的证据，<br>帮朋友选一句合适的建议。</p><button class="primary" onclick="go(1)">开始今天的学习 →</button></div><div class="heroart" aria-hidden="true"><div class="bubble">What should I do?</div><div class="bubble second">Let's talk about it.</div></div></section><div class="grid3">${scenes.map((x,i)=>`<section class="card"><div class="sceneicon">${x[1]}</div><span class="tinylabel">SCENE / 0${i+1}</span><h3 style="margin-top:12px">${x[0]}</h3><p class="muted">点击看看，怎么用一句话表达？</p><button class="smallbtn" onclick="showScene(${i})">${S.scenes[i]?'隐藏句子':'打开句子'}</button>${S.scenes[i]?`<div class="reveal">${esc(x[2])}<small>${x[3]}</small>${audio(x[2])}</div>`:''}</section>`).join('')}</div><div class="infobar">今天的路线：20个单词 → 6个词组 → 4组句子 → 2则课文 → 问题与建议。每篇5道阅读选择题；六选五和五配六放在选做区；阅读可点词查意思。</div>${S.teacher?'<div class="teacherbox">先让宏浩用中文说一个场景，再听英文。Day 22 接续10月9日的Day 21，今天进入Unit 4。月考复习范围是Unit 1–3。热身只作入门，不替代月考错题复习。</div>':''}`;}
function showScene(i){S.scenes[i]=!S.scenes[i];save();render();}
function setWord(i){S.word=i;S.group=i<10?0:1;save();render();}

function puzzle(i){if(!S.puzzles[i]){let order=D.words[i].parts.map((_,j)=>j);for(let j=order.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]];}if(order.length>1&&order.every((x,j)=>x===j))order.reverse();S.puzzles[i]={order,chosen:[],tries:0,message:'',ok:false};}return S.puzzles[i];}
function wordMark(i,kind){const a=S[kind];let k=a.indexOf(i);if(k<0)a.push(i);else a.splice(k,1);save();render();}
function words(){const i=S.word,w=D.words[i],p=puzzle(i);if(!S.seen.includes(i))S.seen.push(i);save();return head('02','把声音拼成单词','每组10个：先听、看词块，再拼出来。每个词有三句逐渐变长的例句。','14分钟 · 20词')+`<div class="wordlayout"><aside class="card wordlist"><div class="groupbuttons"><button class="${S.group===0?'selected':''}" onclick="setGroup(0)">课本新词 10</button><button class="${S.group===1?'selected':''}" onclick="setGroup(1)">课文基础词 10</button></div><div class="wordlistrows">${D.words.slice(S.group*10,S.group*10+10).map((x,j)=>`<button class="worditem ${i===S.group*10+j?'active':''}" onclick="setWord(${S.group*10+j})"><span class="index">${String(S.group*10+j+1).padStart(2,'0')}</span>${x.en}<span>${S.familiar.includes(S.group*10+j)?'✓':S.review.includes(S.group*10+j)?'复习':''}</span></button>`).join('')}</div></aside><section class="card"><div class="wordhead"><div><span class="tinylabel">WORD ${String(i+1).padStart(2,'0')} / 20</span><div class="bigword" style="margin-top:10px">${w.en}</div></div>${audio(w.en)}</div><p class="wordmeaning">${w.zh} <small style="font-size:14px;margin-left:10px">${w.ipa}</small></p><div class="syllables">${w.parts.map(x=>'<span>'+x+'</span>').join('')}</div><p class="hint">${w.hint}</p><div class="phrasebar">${esc(w.phrase)}</div><div class="sectionlabel">同一个意思，一次加一点信息</div><div class="examples">${w.examples.map((e,j)=>`<div class="example"><span class="num">0${j+1}</span><div><div class="en">${esc(e.en)}</div>${S.showZh['w'+i+'-'+j]?'<div class="zh">'+e.zh+'</div>':''}</div><div style="display:flex;gap:4px"><button data-speak="${esc(e.en)}" aria-label="朗读例句">♪</button><button onclick="toggleZh('w${i}-${j}')">中文</button></div></div>`).join('')}</div><div class="puzzle"><h3>听一听，拼出来</h3><button class="smallbtn" data-speak="${w.en}">再听一次 ♪</button><div class="chips">${p.order.map(j=>`<button class="chip ${p.chosen.includes(j)?'used':''}" onclick="addChip(${j})" ${p.chosen.includes(j)?'disabled':''}>${w.parts[j]}</button>`).join('')}</div><div class="answerwell">${p.chosen.length?p.chosen.map((j,k)=>`<button class="chip" onclick="removeChip(${k})" title="点击撤回">${w.parts[j]}</button>`).join(''):'<small>按听到的顺序点击词块</small>'}</div><div class="actions"><button class="primary" onclick="checkWord()">检查拼写</button><button onclick="clearWord()">重新拼</button><button class="quiet" onclick="showWordAnswer()">看提示</button></div><div class="pronounceinput"><input id="spellInput" placeholder="也可以直接输入完整单词" aria-label="输入完整单词" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkTypedWord()"><button onclick="checkTypedWord()">检查</button></div>${p.message?'<div class="feedback '+(p.ok?'':'wrong')+'">'+esc(p.message)+'</div>':''}</div><div class="actions"><button onclick="wordMark(${i},'familiar')">${S.familiar.includes(i)?'✓ 暂时会了':'标记：暂时会了'}</button><button onclick="wordMark(${i},'review')">${S.review.includes(i)?'已加入复习':'加入复习'}</button><button class="primary" style="margin-left:auto" onclick="setWord(${(i+1)%20})">下一个词 →</button></div></section></div><p class="source">前10词来自Unit 4词表；后10词用于课文阅读基础检查。词块分别采用音节、字母组合或词的组成部分，说明见每张词卡。发音由当前浏览器的英语语音提供。</p>`;}
function toggleZh(k){S.showZh[k]=!S.showZh[k];save();render();}
function addChip(j){let p=puzzle(S.word);if(!p.chosen.includes(j))p.chosen.push(j);p.message='';save();render();}
function removeChip(k){let p=puzzle(S.word);p.chosen.splice(k,1);p.message='';save();render();}
function clearWord(){let p=puzzle(S.word);p.chosen=[];p.message='';p.ok=false;save();render();}
function submitWord(value){const i=S.word,w=D.words[i],p=puzzle(i);p.tries++;p.ok=value.trim().toLowerCase()===w.en;if(p.ok){p.message='拼对了！再读一遍 '+w.en+'，然后选一句例句读出来。';S.wordResults[i]=true;}else{p.message=p.tries===1?'再听一次，检查开头和结尾的词块。':'正确拼法是 '+w.en+'。再听一遍，然后重新拼。';if(!S.review.includes(i))S.review.push(i);}save();render();}
function checkWord(){let p=puzzle(S.word);if(!p.chosen.length){toast('先选词块，或在输入框中输入单词。');return;}submitWord(p.chosen.map(j=>D.words[S.word].parts[j]).join(''));}
function checkTypedWord(){let value=$('spellInput').value;if(!value.trim()){toast('请先输入单词。');return;}submitWord(value);}
function showWordAnswer(){let p=puzzle(S.word);p.message='词块提示：'+D.words[S.word].parts.join(' · ');p.ok=false;if(!S.review.includes(S.word))S.review.push(S.word);save();render();}
function phrases(){let pick=S.phrasePick;return head('03','给单词搭一座桥','先选左边的英文词组，再选右边的中文。配对后，把词组放回句子里读。','6分钟 · 6组')+`<section class="card"><div class="headrow"><span class="tinylabel">PHRASE MATCH</span><span class="tag">${S.phraseMatched.length} / 6 已配对</span></div><div class="matchgrid"><div class="matchcol">${D.phrases.map((p,i)=>`<button class="match ${pick===i?'chosen':''} ${S.phraseMatched.includes(i)?'matched':''}" onclick="pickPhrase(${i})" ${S.phraseMatched.includes(i)?'disabled':''}>${S.phraseMatched.includes(i)?'✓ ':''}${p[0]}</button>`).join('')}</div><div class="matchcol">${S.phraseOrder.map(i=>`<button class="match ${S.phraseMatched.includes(i)?'matched':''}" onclick="matchPhrase(${i})" ${S.phraseMatched.includes(i)?'disabled':''}>${S.phraseMatched.includes(i)?'✓ ':''}${D.phrases[i][1]}</button>`).join('')}</div></div>${S.phraseMatched.length===6?'<div class="feedback">6组都配对了。再任选两个词组，读一读下面的例句。</div>':''}</section><div class="grid3" style="margin-top:20px">${D.phrases.map((p,i)=>`<section class="card learnphrase"><span class="tinylabel">PHRASE 0${i+1}</span><h3 style="margin-top:12px">${p[0]}</h3><p class="en">${p[2]}</p><button class="smallbtn" data-speak="${esc(p[2])}">听句子 ♪</button><button class="smallbtn" onclick="toggleZh('p${i}')">中文</button>${S.showZh['p'+i]?'<p class="hint" style="margin-top:13px">'+p[3]+'</p>':''}</section>`).join('')}</div>`;}
function pickPhrase(i){S.phrasePick=i;save();render();}
function matchPhrase(i){if(S.phrasePick===null){toast('先选择左边的英文词组。');return;}if(S.phrasePick===i){if(!S.phraseMatched.includes(i))S.phraseMatched.push(i);S.phrasePick=null;save();render();toast('配对正确！');}else{toast('还没对应上，想一想动作和对象。');}}
function addedWords(cur,prev){const a=prev.split(' '),b=cur.split(' '),dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=norm(a[i])===norm(b[j])?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);let matched=new Set(),i=0,j=0;while(i<a.length&&j<b.length){if(norm(a[i])===norm(b[j])){matched.add(j);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}return b.map((t,k)=>matched.has(k)?esc(t):`<span class="added">${esc(t)}</span>`).join(' ');}
function sentences(){const i=S.sentenceIndex,g=D.sentences[i],layer=S.layers[i];return head('04','一次只加一点信息','先读懂短句，再点开下一层。绿色部分是新增加的信息。','8分钟 · 4组')+`<div class="sentencenav">${D.sentences.map((x,j)=>`<button class="${i===j?'selected':''}" onclick="setSentence(${j})">0${j+1} ${x.title}</button>`).join('')}</div><div class="ladder">${g.layers.map((x,j)=>j<=layer?`<section class="layer"><div class="layerhead"><span>LAYER 0${j+1} · ${['先找主干','加一点信息','读完整句子'][j]}</span><div><button class="smallbtn" data-speak="${esc(x[0])}">朗读 ♪</button> <button class="smallbtn" onclick="toggleZh('s${i}-${j}')">中文</button></div></div><div class="en">${j===0?esc(x[0]):addedWords(x[0],g.layers[j-1][0])}</div>${S.showZh['s'+i+'-'+j]?'<div class="zh">'+x[1]+'</div>':''}</section>`:`<section class="layer locked">第${j+1}层 · 读懂上一层后再展开</section>`).join('')}</div><div class="actions"><button class="primary" onclick="revealLayer()" ${layer>=2?'disabled':''}>加一点信息 ＋</button><button onclick="resetLayers()">收回到短句</button></div>${layer===2?`<div class="sectionlabel">把完整句子分成几个意思块</div><div class="chunks">${g.chunks.map(c=>`<div class="chunk"><small>${c[1]}</small>${esc(c[0])}</div>`).join('')}</div><p class="hint">${g.note}</p>`:''}${S.teacher?'<div class="teacherbox">先让学生说清“谁、做什么”，再分别问新增加的信息。避免一次要求背主语、宾语等术语。译文和句子层级为课堂辅助，来源说明见每组提示。</div>':''}`;}
function setSentence(i){S.sentenceIndex=i;save();render();}
function revealLayer(){S.layers[S.sentenceIndex]=Math.min(2,S.layers[S.sentenceIndex]+1);save();render();}

function tokenized(text){return text.split(/(\s+)/).map(t=>/^\s+$/.test(t)?t:`<button class="wordtoken ${S.marked[norm(t)]?'marked':''}" data-token="${esc(t)}">${esc(t)}</button>`).join('');}
function passageHtml(p){return `<article class="card passage"><div class="passagetitle"><div><span class="avatar">${p.id}</span><h3>${p.name}</h3></div>${audio(p.sentences.map(s=>s.text).join(' '))}</div><p class="hint" style="margin:15px 0 5px">课本原文 · 印刷第53页</p>${p.sentences.map(s=>`<div class="sentence" id="sentence-${s.id}"><span class="sid">${s.id}</span><div>${tokenized(s.text)}</div></div>`).join('')}<p class="passagehelp">点词：查看中文 / 标记生词。A1、B1等是本页新增的句子编号，不是课本行号。查词不会扣分。</p><details><summary>课文词组提示</summary><div class="hint">${p.id==='A'?'in charge of：负责<br>get somebody into trouble：使某人陷入麻烦<br>give it a lot of thought：认真考虑这件事<br>not ... any more：不再……<br>whenever：每当':'move to：搬到<br>not ... yet：还没有……<br>What if ...?：要是……怎么办？<br>get on with：与……相处<br>hit it off with：与……一见投缘'}</div></details></article>`;}
function questionHtml(q){let value=S.answers[q.id],checked=!!S.checked[q.id],first=S.first[q.id],revealed=checked||S.teacher;const lines=q.analysis.split('\n').filter(Boolean);const feedback=checked?(value===q.answer?'答对了。请在原文中指出你的依据。':'再看原文中的相关句子，注意人物和否定词。'):'教师模式：以下为答案和原文依据。';return `<section class="card qcard"><div class="qtop"><span>${esc(q.type||'阅读选择')} / ${String(q.id).padStart(2,'0')}</span><span>${first!==undefined?'首次作答已记录':'尚未提交'}</span></div><h3>${q.id}. ${esc(q.text)}</h3><div class="options">${q.options.map((o,k)=>`<button class="option ${value===k?'selected':''} ${revealed&&k===q.answer?'correct':''} ${checked&&value===k&&k!==q.answer?'incorrect':''}" onclick="selectAnswer(${q.id},${k})" aria-pressed="${value===k}"><span class="optletter">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="actions"><button class="primary smallbtn" onclick="checkQuestion(${q.id})" ${value===undefined?'disabled':''}>提交答案</button>${revealed?`<button class="smallbtn" onclick="locateEvidence(${q.id})">定位原文</button>`:''}</div>${revealed?`<div class="feedback ${checked&&value!==q.answer?'wrong':''}">${feedback}</div><div class="analysis"><strong>答案 ${'ABCD'[q.answer]}</strong><p>${esc((lines[0]||'').replace(/^- /,''))}</p>${S.teacher?lines.slice(1).map(x=>'<p>'+esc(x.replace(/^- /,''))+'</p>').join(''):`<details><summary>展开解题方法与选项解析</summary>${lines.slice(1).map(x=>'<p>'+esc(x.replace(/^- /,''))+'</p>').join('')}</details>`}</div>`:''}</section>`;}
function reading(){let tab=S.tab==='B'?'B':'A',p=D.passages.find(p=>p.id===tab);return head('05','读懂两则求助帖子','每篇5题，对应月考的细节、原因、推断、猜词、标题或主旨。答案都要回到原文找依据。','两篇 · 每篇5题')+`<div class="readtabs"><button class="${tab==='A'?'selected':''}" onclick="setTab('A')">A · 朋友不理我了</button><button class="${tab==='B'?'selected':''}" onclick="setTab('B')">B · 新学校交友</button></div><div class="readinglayout">${passageHtml(p)}<div>${D.questions.filter(q=>q.passage===tab).map(questionHtml).join('')}</div></div><p class="source">材料来自所上传九年级上册教材第53页。正文保留原文，省略发帖日期；题目为教师自编。没有把朋友请求、作者行为和教师处罚混为同一件事。</p>`;}
function setTab(tab){S.tab=tab;save();render();}

function locateEvidence(id){let refs={1:['A1'],2:['A3','A4'],3:['A4','A5'],4:['A6'],5:['A6','A7','A8'],6:['B2'],7:['B3'],8:['B4','B5','B6'],9:['B4','B5'],10:['B1','B3','B4','B5','B6']}[id];document.querySelectorAll('.evidence').forEach(x=>x.classList.remove('evidence'));let found=false;refs.forEach(r=>{let e=$('sentence-'+r);if(e){e.classList.add('evidence');if(!found)e.scrollIntoView({behavior:'smooth',block:'center'});found=true;}});if(!found)toast('依据在 '+refs.join('、')+'，请回阅读关查看。');}

function extraScore(type){const vals=S.extraFirst[type],correct=type==='match'?D.examMatch.targets.map(t=>t.answer):D.examGap.answers;return {answered:vals?5:0,correct:vals?correct.filter((v,i)=>vals[i+1]===v).length:0};}
function selectExtra(type,id,value){if(S.extraAnswers[type][id]===value){delete S.extraAnswers[type][id];S.extraChecked[type]=false;save();render();return;}if(Object.entries(S.extraAnswers[type]).some(([k,v])=>Number(k)!==id&&v===value)){toast('这个选项已用于另一题，每项最多用一次。');return;}S.extraAnswers[type][id]=value;S.extraChecked[type]=false;save();render();}
function gradeExtra(type){const a=S.extraAnswers[type];if(Array.from({length:5},(_,i)=>a[i+1]).some(v=>v===undefined)){toast('请先完成5题，再提交这一组。');return;}if(!S.extraFirst[type])S.extraFirst[type]={...a};S.extraChecked[type]=true;save();render();}
function extraButtons(type,id,count){const selected=S.extraAnswers[type][id],answer=type==='match'?D.examMatch.targets[id-1].answer:D.examGap.answers[id-1],reveal=S.extraChecked[type]||S.teacher;return '<div class="actions">'+Array.from({length:count},(_,i)=>'<button class="'+(selected===i?'primary ':'')+(reveal&&answer===i?'exam-correct':'')+'" onclick="selectExtra(\''+type+'\','+id+','+i+')" aria-pressed="'+(selected===i)+'">'+String.fromCharCode(65+i)+'</button>').join('')+'</div>';}

function advice(){const m=D.examMatch,g=D.examGap,mc=extraScore('match'),gc=extraScore('gap');return head('06','月考题型加练','与月考相同的结构：五个题目，六个选项，一个多余。可课后练，不要求45分钟内全部完成。','选做 · 不计基础分')+
'<div class="teacherbox">月考对应：26–30题六选五短文填空；31–35题人物需求与选项匹配。今日仍用青少年烦恼和求助主题，降低难度。</div>'+
'<details open class="card exam-module"><summary><strong>匹配阅读 · 五人配六条建议</strong></summary><p class="hint">读五人的问题，从A–F中各选一条最合适的建议。每个选项最多用一次，有一条多余。选择错了可再次点击当前字母取消。</p>'+examBank(m.bank)+m.targets.map(t=>'<section class="exam-item"><span class="tinylabel">M'+t.id+' / '+esc(t.name)+'</span><p class="exam-text">'+tokenized(t.text)+'</p>'+extraButtons('match',t.id,6)+(S.extraChecked.match||S.teacher?'<div class="feedback '+(S.extraChecked.match&&S.extraAnswers.match[t.id]!==t.answer?'wrong':'')+'">答案 '+String.fromCharCode(65+t.answer)+' · '+esc(t.clue)+'<br>'+esc(t.why)+'</div>':'')+'</section>').join('')+'<button class="primary" onclick="gradeExtra(\'match\')">提交匹配答案</button><p class="hint">首次作答：'+mc.correct+' / '+mc.answered+'。'+(S.extraChecked.match||S.teacher?m.unused:'')+'</p><p class="source">'+m.source+'</p></details>'+
'<details class="card exam-module"><summary><strong>短文填空 · 六选五</strong></summary><h3>'+g.title+'</h3><p class="hint">从A–F中选五句填入空白，使短文完整、通顺。每项最多用一次，一个选项多余。再次点击当前字母可取消。</p>'+examBank(g.bank)+g.paragraphs.map((p,i)=>'<section class="exam-item"><p class="exam-text">'+tokenized(p.split('{{'+(i+1)+'}}')[0])+' <strong class="exam-blank">['+(i+1)+'] '+(S.extraAnswers.gap[i+1]===undefined?'____':String.fromCharCode(65+S.extraAnswers.gap[i+1]))+'</strong> '+tokenized(p.split('{{'+(i+1)+'}}')[1])+'</p>'+extraButtons('gap',i+1,6)+(S.extraChecked.gap||S.teacher?'<div class="feedback '+(S.extraChecked.gap&&S.extraAnswers.gap[i+1]!==g.answers[i]?'wrong':'')+'">'+esc(g.analysis[i])+'</div>':'')+'</section>').join('')+'<button class="primary" onclick="gradeExtra(\'gap\')">提交短文填空答案</button><p class="hint">首次作答：'+gc.correct+' / '+gc.answered+'。'+(S.extraChecked.gap||S.teacher?g.unused:'')+'</p><p class="source">'+g.source+'</p></details>';

function showToken(raw){const key=norm(raw);activePop={raw,key};$('wordpop').hidden=false;$('wordpop').innerHTML=`<button class="close" onclick="closePop()" aria-label="关闭">×</button><h3>${esc(raw)}</h3><p>${esc(D.gloss[key]||'当前词表没有这个词的解释，请和老师一起确认。')}</p><div class="actions"><button onclick="speak(activePop.raw)">朗读 ♪</button><button class="primary" onclick="toggleMarked()">${S.marked[key]?'取消生词标记':'标记为生词'}</button></div>`;}
function toggleMarked(){if(!activePop)return;const raw=activePop.raw,key=activePop.key;if(S.marked[key]){delete S.marked[key];delete S.marks[key];}else{S.marked[key]=raw;S.marks[key]='unknown';}save();render();showToken(raw);}
function closePop(){$('wordpop').hidden=true;activePop=null;}
function score(optional=false){const qs=optional?[]:D.questions,answered=qs.filter(q=>S.first[q.id]!==undefined);return {answered:answered.length,correct:answered.filter(q=>S.first[q.id]===q.answer).length,total:qs.length};}
function summary(){const sc=score(),op=score(true),marked=Object.entries(S.marked),wrong=D.questions.filter(q=>S.first[q.id]!==undefined&&S.first[q.id]!==q.answer),total=S.seconds.reduce((a,b)=>a+b,0);return head('REVIEW','今天走到了哪里？','保留第一次作答，订正后仍能看到原先的问题。本机自动保存；登录原有学习账号后可使用云端同步，也可下载备份。','课堂记录')+`<div class="stats"><section class="card stat"><strong>${sc.correct}<small> / ${sc.answered||0}</small></strong><span>基础题首次答对 / 已作答</span><p class="hint">共10题 · 未作答不算错误</p></section><section class="card stat"><strong>${S.seen.length}<small> / 20</small></strong><span>已查看的词卡</span><p class="hint">拼写完成 ${Object.keys(S.wordResults).length} 个</p></section><section class="card stat"><strong>${time(total)}</strong><span>累计关卡用时</span><p class="hint">按“开始计时”后才累计</p></section></div><div class="introgrid"><section class="card"><h3>需要再看一眼的单词</h3><div class="reviewwords">${S.review.length?S.review.map(i=>`<button onclick="S.word=${i};S.group=${i<10?0:1};go(1)">${D.words[i].en}</button>`).join(''):'<p class="hint">暂未加入复习词。拼错的词会自动加入。</p>'}</div><h3 style="margin-top:25px">阅读生词</h3><div class="reviewwords">${marked.length?marked.map(([k,v])=>`<button data-reviewtoken="${esc(v)}">${esc(v)}</button>`).join(''):'<p class="hint">暂未标记。阅读时点词，再选“标记为生词”。</p>'}</div></section><section class="card"><h3>关卡用时</h3><table class="summarytable">${stages.slice(0,6).map((x,i)=>`<tr><td>${x[0]}</td><td>${time(S.seconds[i]||0)} ${S.done.includes(i)?'✓':''}</td></tr>`).join('')}</table><p class="hint" style="margin-top:16px">只记录整关时间，不记录单句理解时间。完成标记由课堂操作确定，不自动等同于已掌握。</p></section></div><section class="card" style="margin-top:20px"><h3>第一次做错的题</h3><div class="scorelist">${wrong.length?wrong.map(q=>`<div class="scoreline"><strong>第${q.id}题</strong> · 首次 ${'ABCD'[S.first[q.id]]} → 正确 ${'ABCD'[q.answer]} <button class="smallbtn" style="float:right" onclick="S.tab='${q.passage==='X'?'A':q.passage}';go(4)">回看</button><p style="margin:8px 0 0">${esc(q.text)}</p></div>`).join(''):'<p class="hint">当前没有已记录的首次错题。</p>'}</div><p class="hint">六选五首次正确 ${extraScore('gap').correct} / ${extraScore('gap').answered}；匹配阅读首次正确 ${extraScore('match').correct} / ${extraScore('match').answered}。重复提交不会改写首次成绩。${S.readingBackup?' 旧版阅读答案已保留为备份，新题单独记录。':''}</p></section><section class="card" style="margin-top:20px"><h3>课堂备注</h3><textarea id="notes" placeholder="记录今天的掌握情况、需复习内容和课后任务……" oninput="S.notes=this.value;save()">${esc(S.notes)}</textarea><div class="actions"><button class="primary" onclick="downloadReport()">下载课堂记录</button><button onclick="printWorksheet()">打印学生阅读题</button><button class="quiet" onclick="resetLesson()">清空本次记录</button></div><p class="disablednote">无需登录也能学习并保存本机记录。登录页面右下角的原有学习账号后，可使用云端同步；联网失败时本机记录仍保留。</p></section>`;}
function downloadReport(){running=false;save();nav();let sc=score(),op=score(true);let text='宏浩 Day 22 Unit 4 课堂记录\n日期：2026年10月12日\n基础题首次正确：'+sc.correct+'/'+sc.answered+'（共10题）\n六选五首次正确：'+extraScore('gap').correct+'/'+extraScore('gap').answered+'；匹配阅读首次正确：'+extraScore('match').correct+'/'+extraScore('match').answered+'\n已查看词卡：'+S.seen.length+'/20\n累计计时：'+time(S.seconds.reduce((a,b)=>a+b,0))+'\n复习词：'+S.review.map(i=>D.words[i].en).join(', ')+'\n阅读生词：'+Object.values(S.marked).join(', ')+'\n\n首次作答\n'+D.questions.map(q=>q.id+'. '+(S.first[q.id]===undefined?'未作答':'ABCD'[S.first[q.id]])+'；正确答案 '+'ABCD'[q.answer]).join('\n')+'\n\n六选五答案\n'+JSON.stringify(S.extraAnswers.gap)+'\n匹配阅读答案\n'+JSON.stringify(S.extraAnswers.match)+'\n旧版阅读备份\n'+JSON.stringify(S.readingBackup)+'\n\n课堂备注\n'+S.notes;let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='宏浩_Day22_20261012_课堂记录.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printWorksheet(){const win=window.open('','_blank');if(!win){toast('请允许弹出窗口，或从浏览器菜单打印。');return;}win.document.write('<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>宏浩 Day 22 学生阅读题</title><style>body{font:16px Georgia,"Microsoft YaHei",serif;line-height:1.7;margin:35px;color:#111}h1{font-size:24px}h2{font-size:20px}.question{break-inside:avoid;margin:20px 0}.passage{font-size:18px}button{display:none}@media print{body{margin:10mm}}</style></head><body><h1>宏浩 Day 22 课文阅读题 学生版</h1><p>姓名 __________ 日期 __________<br>每题选一个最佳答案，并在原文中划出依据。每篇5题。</p>'+D.passages.map(p=>'<h2>'+p.name+'</h2><p class="passage">'+esc(p.sentences.map(s=>s.text).join(' '))+'</p>'+D.questions.filter(q=>q.passage===p.id).map(q=>'<div class="question"><strong>'+q.id+'. '+esc(q.text)+'</strong>'+q.options.map((o,i)=>'<div>'+'ABCD'[i]+'. '+esc(o)+'</div>').join('')+'</div>').join('')).join('')+'<p>来源：用户提供的九年级上册教材第53页。题目为教师自编。</p></body></html>');win.document.close();win.focus();setTimeout(()=>win.print(),300);}
function resetLesson(){if(!window.confirm('清空本次的答案、计时、生词和备注？建议先下载课堂记录。'))return;S=JSON.parse(JSON.stringify(defaults));S.readingRevision='exam-aligned-v2';running=false;save();render();toast('本次记录已清空。');}
document.addEventListener('click',e=>{const token=e.target.closest('[data-token]');if(token)showToken(token.dataset.token);const review=e.target.closest('[data-reviewtoken]');if(review)showToken(review.dataset.reviewtoken);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();});
window.addEventListener('beforeunload',save);
setInterval(()=>{if(!running)return;S.seconds[S.stage]=(S.seconds[S.stage]||0)+1;$('clock').textContent=time(S.seconds[S.stage]);$('bottomnote').textContent='本关计时 '+time(S.seconds[S.stage])+' · 按课堂进度自由切换';if(S.seconds[S.stage]%10===0)save();},1000);
render();

window.findDict=function(word){return {data:['','',D.gloss[norm(word)]||'']};};
