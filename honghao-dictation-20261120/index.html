function renderWrong(){const ids=state.wrong.filter(id=>BY_ID[id]);if(!ids.length){$('view-wrong').innerHTML='<div class="empty"><h2>目前没有待复测的错词</h2><p class="intro">完成听写后，首次写错的单词会出现在这里。</p><button id="wrongBegin" class="primary" style="margin-top:24px">听写今晚12词</button></div>';$('wrongBegin').onclick=()=>startRound(TONIGHT_IDS);return;}$('view-wrong').innerHTML=`<div class="section-heading"><div><h2>这 ${ids.length} 个词再练一遍</h2><p class="intro">订正后仍保留；在新一轮复测中独立写对，才移出待复测列表。</p></div><button id="retryWrong" class="primary">开始错词复测</button></div><div class="word-grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${ids.map(id=>{const w=BY_ID[id];return `<button class="word-card" data-speak="${id}" data-speak-button><span class="word">${highlighted(w)}</span><span class="meaning">${w.meaning}</span><small class="ipa">${w.ipa}</small></button>`;}).join('')}</div><p class="hint">点击卡片听单词；开始复测后，会隐藏英文拼写。</p><div id="audioNotice" class="audio-warning" role="status" hidden></div>`;$('retryWrong').onclick=()=>startRound(ids,'错词复测');bindSpeech($('view-wrong'));}
function formatTime(iso){return new Date(iso).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});}
function renderRecords(){const rounds=[...state.history];if(state.round&&!rounds.some(r=>r.key===state.round.key)&&Object.keys(state.round.attempts).length)rounds.push(state.round);rounds.reverse();$('view-records').innerHTML=`<div class="summary"><h2>课堂记录</h2><p class="intro">本机保留最近30轮。首次作答、订正和复测分开记录。</p>${rounds.length?rounds.map((r,i)=>{const st=roundStats(r);return `<div class="history-item"><div><strong>${esc(r.type)}　${st.correct}/${st.total} 首次正确</strong><p>${formatTime(r.started)}　${r.ended?'已完成':'进行中'}　已作答 ${st.answered} 词</p></div><button data-export-record="${i}">导出这一轮</button></div>`;}).join(''):'<p class="hint">还没有听写记录，完成第一词核对后就会显示。</p>'}<p class="hint">进度只保存在当前设备和浏览器；换电脑前可先导出记录。</p></div>`;$('view-records').querySelectorAll('[data-export-record]').forEach(b=>b.onclick=()=>exportRound(rounds[Number(b.dataset.exportRecord)]));}
function csvCell(v){let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
function exportRound(r){const lines=[['学生','课堂','轮次','开始时间','完成状态','字母组合','单词','中文','首次作答','首次正确','订正','订正正确'],...r.ids.map(id=>{const w=BY_ID[id],a=r.attempts[id];return ['宏浩','2026-11-20',r.type,r.started,r.ended?'已完成':'进行中',w.group,w.word,w.meaning,a?.answer||'',a?(a.correct?'是':'否'):'未作答',a?.correction||'',a&&!a.correct?(a.corrected?'是':'否'):''];})];const blob=new Blob(['\uFEFF'+lines.map(row=>row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='宏浩11月20日听写记录-'+r.key+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$('fontDown').onclick=()=>{state.scale=Math.max(.85,Math.round((state.scale-.05)*100)/100);save();render();};$('fontUp').onclick=()=>{state.scale=Math.min(1.3,Math.round((state.scale+.05)*100)/100);save();render();};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('fullscreen').textContent='可按 F11 全屏';}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏上课';});
$('rate').onchange=e=>{state.rate=Number(e.target.value);save();};$('voiceSelect').onchange=e=>{state.voice=e.target.value;save();};
if('speechSynthesis' in window){window.speechSynthesis.addEventListener('voiceschanged',refreshVoices);window.addEventListener('pagehide',stopSpeech);}refreshVoices();save();render();
</script>
</body>
</html>
