<main><div class="intro"><div><h1>相似三角形 · 八题讲练</h1><p>与纸质作业同题同序 · 先说依据，再写比例，最后算结果</p></div><span class="tag">前四模型 · 课堂讲评</span></div><nav id="nav" aria-label="切换题目"></nav><div class="heading"><h2 id="title"></h2><span class="source" id="source"></span></div><div class="layout"><section class="panel question"><div class="statement" id="statement"></div><div class="figure"><svg id="diagram" viewBox="0 0 560 360" role="img" aria-label="题目几何图"></svg></div><div class="legend" id="legend"></div><div class="figbar"><span>图形为示意图，长度以题设为准</span><button id="resetFigure">只看原图</button></div><details><summary>题目出处</summary><p id="citation"></p></details></section><section class="panel proof"><div class="proofHead"><h3>分步讲解</h3><span class="count" id="count"></span></div><div id="proof" aria-live="polite"></div><div class="controls"><button id="prevStep">上一步</button><button id="nextStep" class="primary">显示第一步</button><button id="allSteps">完整答案</button><button id="hideSteps">收起解析</button></div><div class="hint" id="pitfall" hidden></div></section></div><div class="bottom"><button id="prevQ">← 上一题</button><span id="position"></span><button id="nextQ" class="primary">下一题 →</button></div><p class="keyboard">键盘 ← / → 展开步骤 · PageUp / PageDown 切题 · Esc 退出讲课大屏</p></main>
<script>
const questions=[
{model:'A字模型',name:'测量塔高',source:'2023 · 山东潍坊中考',url:'https://jx.panqjy.cn/doc-18458813.html',text:'《数书九章》中记载了一个测量塔高的问题。如图，AB表示塔高，CD表示竹竿顶端到地面的高度，EF表示人眼到地面的高度。AB、CD、EF垂直于同一水平地面，A、C、E依次共线。已知AC=20米，CE=10米，CD=7米，EF=1.4米，F、D、B共线。求塔高AB。',points:{A:[0,0],B:[0,18.2],C:[20,0],D:[20,7],E:[30,0],F:[30,1.4],Q:[0,1.4],H:[20,1.4]},lines:['AB','AE','CD','EF','BF'],helper:['FQ'],extra:['Q','H'],pairs:[['FDH','FBQ']],steps:[['先让两个直角三角形露出来','过F作FQ∥AE，交AB于Q，交CD于H。<br>因为AB、CD、EF都垂直于地面，所以AQ=CH=EF=1.4米。<span class="equation">DH=7−1.4=5.6，FH=10，FQ=20+10=30。</span>'],['写清相等角和相似顺序','∠FHD=∠FQB=90°，∠DFH=∠BFQ（同一个角）。<span class="equation">△FDH∼△FBQ（两角分别相等）。</span>对应顶点：F↔F，D↔B，H↔Q。'],['用对应边列比例','<span class="equation">DH/BQ=FH/FQ</span>代入已知：5.6/BQ=10/30，所以BQ=16.8米。'],['回到题目要的塔高','<span class="equation">AB=AQ+QB=1.4+16.8=18.2米。</span><span class="answer">答：塔高AB为18.2米。</span>']],pitfall:'CD和AB不能直接按CE∶AE成比例。视线从眼睛F出发，要先减去眼睛的高度。'},
{model:'A字模型',name:'长度比与面积比',source:'2022 · 浙江杭州中考 · 第19题',url:'https://jx.panqjy.cn/doc-16955278.html',text:'在△ABC中，点D、E、F分别在边AB、AC、BC上，连接DE、EF。四边形BFED为平行四边形，DE/BC=1/4。<p>（1）若AB=8，求AD。<br>（2）若△ADE的面积为1，求平行四边形BFED的面积。</p>',points:{A:[0,4],B:[0,0],C:[4,0],D:[0,3],E:[1,3],F:[1,0]},lines:['AB','AC','BC','DE','EF'],pairs:[['ADE','ABC']],steps:[['从平行关系得到相似','四边形BFED是平行四边形，所以DE∥BF。B、F、C共线，故DE∥BC。<br>∠ADE=∠ABC，∠AED=∠ACB。<span class="equation">△ADE∼△ABC。</span>'],['第（1）问：用相似比求边长','<span class="equation">AD/AB=DE/BC=1/4。</span>AB=8，所以AD=8×1/4=2。<span class="answer">（1）AD=2。</span>'],['第（2）问：先求大三角形面积','面积比等于相似比的平方。<span class="equation">S△ADE/S△ABC=(1/4)²=1/16。</span>已知S△ADE=1，因此S△ABC=16。'],['求平行四边形的底与高','BF=DE=BC/4。<br>设△ABC的高为h，则△ADE的高为h/4，平行四边形的高为3h/4。<span class="equation">S平行四边形=(BC/4)×(3h/4)<br>=3BCh/16。</span>'],['把面积换成已知数','S△ABC=BCh/2=16，所以BCh=32。<span class="equation">S平行四边形=3×32/16=6。</span><span class="answer">（2）平行四边形BFED的面积为6。</span>']],pitfall:'相似比为1∶4，面积比是1∶16。平行四边形的面积不能只用“大三角形减小三角形”。'},
{model:'8字模型',name:'正方形中的交点',source:'2022 · 辽宁锦州中考 · 第13题',url:'https://www.yeyulingfeng.com/wendang/614900.html',text:'正方形ABCD中，E为AD的中点，连接BE，与AC交于F。若AB=6，求△AEF的面积。',points:{A:[0,6],B:[0,0],C:[6,0],D:[6,6],E:[3,6],F:[2,4]},lines:['AB','BC','CD','DA','BE','AC'],pairs:[['AEF','CBF']],steps:[['找出交叉的两个三角形','正方形中AD∥BC，所以∠AEF=∠CBF。<br>∠AFE=∠CFB（对顶角相等）。<span class="equation">△AEF∼△CBF。</span>对应：A↔C，E↔B，F↔F。'],['求相似比和线段比','E是AD的中点，所以AE=3，BC=6。<span class="equation">AE/CB=AF/CF=EF/BF=1/2。</span>因此AF∶FC=1∶2。'],['先求△BCF的面积','△ABF与△BCF的底AF、FC在同一直线AC上，从B到底边的高相同。<span class="equation">S△ABF∶S△BCF=AF∶FC=1∶2。</span>S△ABC=6×6÷2=18，所以S△BCF=18×2/3=12。'],['再用面积比求目标','△AEF∼△CBF，相似比为1/2。<span class="equation">S△AEF/S△CBF=(1/2)²=1/4。</span><span class="answer">S△AEF=12÷4=3。</span>']],pitfall:'△AEF对应的是△CBF。先把字母顺序写对，再写AF/CF、EF/BF，避免比值倒过来。'},
{model:'8字模型',name:'平行四边形中的面积比',source:'2023 · 四川乐山中考 · 第15题',url:'https://kaosj.com/papers/2023/07/2023-zhongkao-math-sichuan-6d812af89b-paper/',text:'在平行四边形ABCD中，E在线段AB上，连接AC、DE，交于F。若AE/EB=2/3，求S△ADF/S△AEF。',points:{A:[0,3],B:[5,3],C:[6,0],D:[1,0],E:[2,3],F:[12/7,15/7]},lines:['AB','BC','CD','DA','AC','DE'],pairs:[['AEF','CDF']],steps:[['把局部的比换成对应边的比','AE∶EB=2∶3，因此AE∶AB=2∶5。<br>平行四边形中AB=CD，且AB∥CD。<span class="equation">AE/CD=2/5。</span>'],['用8字模型建立相似','∠AEF=∠CDF（平行线的内错角），<br>∠AFE=∠CFD（对顶角）。<span class="equation">△AEF∼△CDF。</span>对应：A↔C，E↔D，F↔F。'],['从相似得到同一直线上的底边比','<span class="equation">EF/DF=AE/CD=2/5。</span>因此DF/EF=5/2。'],['同高三角形的面积比等于底边比','△ADF与△AEF的底DF、EF都在直线DE上，从A到DE的高相同。<span class="equation">S△ADF/S△AEF=DF/EF=5/2。</span><span class="answer">答案：5/2。</span>']],pitfall:'最后比较的△ADF与△AEF用的是“同高面积比”，不是把5/2再平方。'},
{model:'一线三等角',name:'三个直角串起相似',source:'2023 · 湖南邵阳中考 · 第21题',url:'https://kaosj.com/papers/2023/07/2023-zhongkao-math-hunan-0bb8fb9bd2-paper/',text:'如图，CA⊥AD，ED⊥AD，B在线段AD上，且CB⊥BE。AB=8，AC=6，DE=4。<p>（1）证明△ABC∼△DEB。<br>（2）求BD。</p>',points:{A:[0,0],B:[8,0],C:[0,6],D:[11,0],E:[11,4]},lines:['AD','AC','DE','CB','BE'],pairs:[['ABC','DEB']],steps:[['先写出两个直角','因为CA⊥AD，ED⊥AD，且A、B、D共线，<span class="equation">∠CAB=∠BDE=90°。</span>又因为CB⊥BE，所以∠CBE=90°。'],['同角的余角相等','在Rt△ABC中：∠ACB+∠ABC=90°。<br>在点B处：∠EBD+∠ABC=90°（A、B、D共线，且CB⊥BE）。<span class="equation">∠ACB=∠EBD。</span>'],['按角的对应写相似','∠CAB=∠BDE，∠ACB=∠DBE。<span class="equation">△ABC∼△DEB。</span>对应顶点：A↔D，B↔E，C↔B。'],['选能用到已知边的比例','AB对应DE，AC对应DB。<span class="equation">AB/DE=AC/DB。</span>代入：8/4=6/DB，解得DB=3。<span class="answer">（2）BD=3。</span>']],pitfall:'两个三角形都含B，但两个B不是对应顶点。△ABC中的C，才对应△DEB中的B。'},
{model:'一线三等角',name:'等边三角形中的60°',source:'2023 · 山东东营中考',url:'https://gd.zggdsq.com/doc/3852.html',text:'△ABC为等边三角形，D、E分别在边BC、AB上，∠ADE=60°。若BD=4DC，DE=2.4，求AD。<p>A. 1.8　B. 2.4　C. 3　D. 3.2</p>',points:{A:[2.5,4.330127],B:[0,0],C:[5,0],D:[4,0],E:[.4,.6928203]},lines:['AB','BC','CA','AD','DE'],pairs:[['ADE','ABD']],steps:[['找两个角，别急着算长度','△ABC是等边三角形，D在BC上，所以∠ABD=60°。<br>题设∠ADE=60°，因此∠ADE=∠ABD。<br>E在AB上，射线AE与AB重合，故∠DAE=∠BAD。'],['写出相似及对应关系','<span class="equation">△ADE∼△ABD。</span>对应顶点：A↔A，D↔B，E↔D。<br>对应边：AD↔AB，DE↔BD，AE↔AD。'],['把题设的4倍关系用起来','BD=4DC，所以BC=BD+DC=5DC。<br>等边三角形中AB=BC，故<span class="equation">AB/BD=5/4。</span>'],['列比例，求AD','由相似，AD/AB=DE/BD，<span class="equation">AD=DE×AB/BD=2.4×5/4=3。</span><span class="answer">AD=3，选C。</span>']],pitfall:'BD=4DC，表示BD占BC的4/5；不是AB/BD=4。先把“部分与整体”分清。'},
{model:'射影定理',name:'直角边与它的射影',source:'2023 · 湖南湘潭中考',url:'https://zy.21cnjy.com/19925358',text:'在Rt△ABC中，∠BAC=90°，AD是斜边BC上的高。<p>（1）证明△ABD∼△CBA。<br>（2）若AB=6、BC=10，求BD。</p>',points:{A:[3.6,4.8],B:[0,0],C:[10,0],D:[3.6,0]},lines:['AB','BC','CA','AD'],pairs:[['ABD','CBA']],steps:[['找到“直角＋同一个锐角”','AD是BC上的高，所以∠ADB=90°。<br>已知∠CAB=90°，故∠ADB=∠CAB。<br>D在BC上，所以∠ABD=∠CBA。'],['证明相似，核对顶点顺序','<span class="equation">△ABD∼△CBA。</span>对应顶点：A↔C，B↔B，D↔A。<br>对应边：AB↔CB，BD↔BA，AD↔CA。'],['从比例推导射影关系','<span class="equation">AB/CB=BD/BA。</span>交叉相乘，得到<span class="equation">AB²=BC·BD。</span>也就是：直角边的平方=斜边×该直角边在斜边上的射影。'],['代入数据，检查数量关系','<span class="equation">BD=AB²/BC=6²/10=36/10=18/5。</span><span class="answer">BD=18/5（即3.6）。</span>BD是BC的一部分，3.6小于10，符合图形关系。']],pitfall:'AB对应的射影是BD，所以AB²=BC·BD。别把BD误写成DC。'},
{model:'射影定理',name:'先全等，再用射影',source:'2022 · 湖南湘潭中考 · 第25题第（3）问节选',url:'https://www.yeyulingfeng.com/wendang/636936.html',text:'在△ABC中，∠BAC=90°，AB=AC。直线l经过A，过B、C分别作l的垂线，垂足为D、E，点的位置如图。延长BD交AC于F。若CE=3、DE=1，求△BFC的面积。',points:{A:[0,0],B:[3,4],C:[4,-3],D:[3,0],E:[4,0],F:[3,-2.25]},lines:['AB','AC','BC','AE','BD','CE','DF'],pairs:[['ABD','CAE'],['ADF','BDA']],steps:[['先证明两个外侧直角三角形全等','∠ADB=∠CEA=90°。<br>AB⊥AC，AD⊥CE，故∠BAD=∠ACE（两边分别垂直的锐角相等）。又AB=AC，<span class="equation">△ABD≌△CAE（AAS）。</span>对应：A↔C，B↔A，D↔E。'],['求AD、AE、BD','由全等可得AD=CE=3，BD=AE。<br>由图中A、D、E依次共线，<span class="equation">AE=AD+DE=3+1=4，BD=4。</span>'],['认出Rt△ABF中的斜边高','F在AC上，所以AB⊥AF，△ABF是以A为直角顶点的直角三角形。<br>B、D、F共线，且AD⊥BF，因此AD是斜边BF上的高。<span class="equation">△ADF∼△BDA，AD/BD=DF/AD。</span>'],['用高的射影关系求BF','<span class="equation">AD²=BD·DF。</span>于是DF=3²/4=9/4。<br>D在B、F之间，所以<span class="equation">BF=BD+DF=4+9/4=25/4。</span>'],['最后找准△BFC的高','以BF为底。BF与CE都垂直于直线l，所以BF∥CE，C到直线BF的距离为DE=1。<span class="equation">S△BFC=BF×DE÷2<br>=(25/4)×1÷2=25/8。</span><span class="answer">△BFC的面积为25/8。</span>']],pitfall:'最后面积的高是DE=1，不是CE=3。高必须垂直于所选的底BF。'}
];
let current=0,shown=0,originalOnly=false,fontSize=22;const $=id=>document.getElementById(id);const progress=questions.map(()=>0);
const ns='http://www.w3.org/2000/svg';function el(tag,attrs,text){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n;}
function draw(){$('resetFigure').textContent=originalOnly?'显示讲解图':'只看原图';const q=questions[current],svg=$('diagram');svg.replaceChildren();const vals=Object.values(q.points),xs=vals.map(p=>p[0]),ys=vals.map(p=>p[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),scale=Math.min(420/(xmax-xmin),260/(ymax-ymin));const point=k=>{const p=q.points[k];return[280+(p[0]-(xmin+xmax)/2)*scale,180-(p[1]-(ymin+ymax)/2)*scale]};const active=shown>0&&!originalOnly,pi=current===7&&shown>=3?1:0;
if(active){q.pairs[pi].forEach((tri,i)=>{svg.append(el('polygon',{points:[...tri].map(k=>point(k).join(',')).join(' '),fill:i?'#e19a4f':'#4486ef','fill-opacity':'.18',stroke:i?'#c76b19':'#2465d6','stroke-width':'3',class:'shade'}));});}
for(const line of q.lines){const [a,b]=[...line].map(point);svg.append(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'edges'}));}if(active&&q.helper)for(const line of q.helper){const[a,b]=[...line].map(point);svg.append(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'helper'}));}
const offsets={0:{A:[-17,23],B:[-12,-14],C:[-15,24],D:[0,-15],E:[7,23],F:[10,-8],Q:[-26,5],H:[-23,-8]},1:{A:[-13,-15],B:[-20,23],C:[10,20],D:[-25,4],E:[10,-10],F:[3,24]},2:{A:[-23,-8],B:[-23,20],C:[10,20],D:[10,-8],E:[0,-15],F:[11,5]},3:{A:[-22,-9],B:[10,-7],C:[10,18],D:[-24,20],E:[0,-16],F:[12,8]},4:{A:[-20,24],B:[-8,25],C:[-14,-16],D:[8,24],E:[10,-8]},5:{A:[-5,-15],B:[-23,20],C:[8,20],D:[4,24],E:[-26,-3]},6:{A:[-4,-16],B:[-22,22],C:[10,22],D:[-6,24]},7:{A:[-24,6],B:[-10,-16],C:[10,14],D:[-22,-10],E:[9,-8],F:[-22,10]}};
for(const k of Object.keys(q.points)){if(q.extra?.includes(k)&&!active)continue;const p=point(k),o=offsets[current][k]||[8,-10];svg.append(el('circle',{cx:p[0],cy:p[1],r:3,fill:'#172c3d'}));svg.append(el('text',{x:p[0]+o[0],y:p[1]+o[1]},k));}
if(current===7){const a=point('A');svg.append(el('text',{x:point('E')[0]+24,y:a[1]+5},'l'));}
$('legend').innerHTML=active?q.pairs[pi].map(tri=>'<b>△'+tri+'</b>').join('<span>与</span>'):'';}
function renderProof(){const q=questions[current];$('proof').innerHTML=shown?q.steps.slice(0,shown).map((s,i)=>'<article class="step"><h4>'+String(i+1).padStart(2,'0')+' · '+s[0]+'</h4><p>'+s[1]+'</p></article>').join(''):'<div class="blank"><strong>先独立说一遍思路</strong><span>找哪两个三角形？<br>哪些角相等？对应边怎么写？</span></div>';$('count').textContent=shown+' / '+q.steps.length+' 步';$('prevStep').disabled=shown===0;$('nextStep').disabled=shown===q.steps.length;$('nextStep').textContent=shown===0?'显示第一步':shown===q.steps.length?'已全部展开':'下一步 →';$('pitfall').hidden=shown<q.steps.length;$('pitfall').textContent='易错处：'+q.pitfall;draw();}
function changeStep(n){shown=Math.max(0,Math.min(questions[current].steps.length,n));progress[current]=shown;originalOnly=false;renderProof();$('proof').scrollTop=$('proof').scrollHeight;}
function selectQ(i){current=Math.max(0,Math.min(7,i));shown=progress[current];originalOnly=false;const q=questions[current];$('title').textContent=(current+1)+'. '+q.name;$('source').textContent=q.source;$('statement').innerHTML=q.text;$('citation').innerHTML='<a href="'+q.url+'" target="_blank" rel="noopener">'+q.source+' · 查看来源</a>'+(current===7?'；保留公共条件及第（3）问。':'');$('position').textContent='第 '+(current+1)+' / 8 题 · '+q.model;$('prevQ').disabled=current===0;$('nextQ').disabled=current===7;$('nextQ').textContent=current===7?'八题已到最后':'下一题 →';[...$('nav').children].forEach((b,j)=>{b.classList.toggle('active',j===current);b.setAttribute('aria-current',j===current?'step':'false')});renderProof();}
questions.forEach((q,i)=>{const b=document.createElement('button');b.innerHTML='第 '+(i+1)+' 题<span>'+q.model+'</span>';b.onclick=()=>selectQ(i);$('nav').append(b);});$('prevStep').onclick=()=>changeStep(shown-1);$('nextStep').onclick=()=>changeStep(shown+1);$('allSteps').onclick=()=>changeStep(questions[current].steps.length);$('hideSteps').onclick=()=>changeStep(0);$('prevQ').onclick=()=>selectQ(current-1);$('nextQ').onclick=()=>selectQ(current+1);$('resetFigure').onclick=()=>{originalOnly=!originalOnly;draw();$('resetFigure').textContent=originalOnly?'显示讲解图':'只看原图';};$('focus').onclick=()=>document.body.classList.toggle('focus');$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.body.classList.toggle('focus');}};$('larger').onclick=()=>{fontSize=Math.min(32,fontSize+2);document.documentElement.style.setProperty('--size',fontSize+'px')};$('smaller').onclick=()=>{fontSize=Math.max(18,fontSize-2);document.documentElement.style.setProperty('--size',fontSize+'px')};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();changeStep(shown+1)}if(e.key==='ArrowLeft'){e.preventDefault();changeStep(shown-1)}if(e.key==='PageDown'){e.preventDefault();selectQ(current+1)}if(e.key==='PageUp'){e.preventDefault();selectQ(current-1)}if(e.key==='Escape')document.body.classList.remove('focus')});selectQ(0);
</script></body></html>
