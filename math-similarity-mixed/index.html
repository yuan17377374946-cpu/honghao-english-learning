</style></head><body><header><a href="../math-similarity-next/">← 上次课堂</a><div class="tools"><button id="smaller">字 −</button><button id="larger">字 ＋</button><button id="focus">讲课大屏</button></div></header><main><h1>几何综合练习</h1><p class="intro">10月28日 · 宏浩｜先独立读题、标条件，再说出准备证明的相似关系。<br>共8题：6道新题、2道独立复测。建议课上先做第1—5题；第6题按进度安排，第7—8题选做或留作业。题干保留原题数学条件，文字作简要整理；选择题改为直接作答，综合题仅取标明的小问。</p><nav class="nav" id="nav" aria-label="选择题目"></nav><div class="titleRow"><h2 id="title"></h2><span id="tag"></span></div><div class="grid"><section class="panel question"><div id="given" class="given"></div><div id="source" class="source"></div><p id="review" class="review" hidden>独立复测：先不看上次解析，重新写出完整过程。</p><svg id="diagram" viewBox="0 0 600 400" role="img" aria-label="本题几何示意图"></svg><div class="controls" id="figureControls"></div><div class="legend" id="legend"></div><div class="figureNote">图形按条件重绘，长度以题干为准。</div><div class="status">完成情况：<button data-state="独立完成">独立完成</button> <button data-state="提示后完成">提示后完成</button> <button data-state="待复习">待复习</button> <span id="assess"></span></div></section><section class="panel proof"><div class="proofHead"><h2>讲解</h2><span id="count" class="count"></span></div><div id="steps" aria-live="polite"></div><div class="controls"><button id="prev">← 上一步</button><button id="next" class="primary">显示第一步</button><button id="all">完整解析</button><button id="hide">收起解析</button></div><button id="hintButton" style="margin-top:14px">需要一点提示</button><div id="hint" class="hint" hidden>先标出平行、垂直、等边或中点条件。想一想：所求线段在哪个三角形里？还缺哪一对等角或哪一组边比？</div></section></div><div class="bottom"><button id="previous">← 上一题</button><span id="position"></span><button id="following" class="primary">下一题 →</button></div><p class="intro">方向键 ← / → 控制解析步骤；PageUp / PageDown 切换题目。答案无需输入即可查看。</p></main><script src="questions.js?v=1"></script><script>
const $=x=>document.getElementById(x);let index=0,step=0,font=23,before=false;const progress=Array(8).fill(0);let records={};try{records=JSON.parse(localStorage.getItem('hh-sim-mixed-1028')||'{}')}catch{}
function render(){let q=questions[index];$('nav').innerHTML=questions.map((_,i)=>'<button data-i="'+i+'" class="'+(i===index?'selected':'')+'">'+(i+1)+'</button>').join('');$('title').textContent='第'+(index+1)+'题';$('tag').textContent=index>=6?'选做':q.review?'独立复测':'';$('given').textContent=q.given;$('source').innerHTML='<a target="_blank" rel="noopener" href="'+q.url+'">来源：'+q.source+' ↗</a>';$('review').hidden=!q.review;$('figureControls').innerHTML=index===5?'<button id="before">看旋转前</button><button id="after">看旋转后</button><span class="figureNote">图示旋转角仅作示意，不是已知条件。</span>':'';$('previous').disabled=index===0;$('following').disabled=index===7;$('position').textContent=(index+1)+' / 8';$('hint').hidden=true;show();}
function choose(i){progress[index]=step;index=i;step=progress[i];before=false;render();}
function show(){let q=questions[index];step=Math.max(0,Math.min(step,q.steps.length));progress[index]=step;$('steps').innerHTML=step?q.steps.slice(0,step).map((s,i)=>'<article class="step"><strong>第'+(i+1)+'步</strong>'+s.text+'</article>').join(''):'<div class="empty"><strong>先让他自己找</strong>哪些条件能用？<br>准备证明哪两个三角形相似？<br>对应顶点按什么顺序写？</div>';$('count').textContent=step+' / '+q.steps.length+' 步';$('prev').disabled=step===0;$('next').disabled=step===q.steps.length;$('next').textContent=step===0?'显示第一步':step===q.steps.length?'已全部展开':'下一步 →';$('assess').textContent=records[index]||'';document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('selected',b.dataset.state===records[index]));draw();}
function draw(){const q=questions[index],p=JSON.parse(JSON.stringify(q.p));if(index===5&&before){p.D=[2,0];p.E=[2,1.5];}const hidden=new Set((q.extra||[]).filter(k=>step===0));if(index===3&&step===0)hidden.add('K');const names=Object.keys(p).filter(k=>!hidden.has(k)),vals=names.map(k=>p[k]),xmin=Math.min(...vals.map(p=>p[0])),xmax=Math.max(...vals.map(p=>p[0])),ymin=Math.min(...vals.map(p=>p[1])),ymax=Math.max(...vals.map(p=>p[1])),sc=Math.min(430/Math.max(xmax-xmin,1),270/Math.max(ymax-ymin,1)),at=k=>[300+(p[k][0]-(xmin+xmax)/2)*sc,200-(p[k][1]-(ymin+ymax)/2)*sc],pts=t=>[...t].map(k=>at(k).join(',')).join(' ');let out='<title>第'+(index+1)+'题示意图</title>';let pair=step?q.steps[step-1].pair:null;if(index===5&&before)pair=null;const line=(e,color,width=2.5,dash='')=>{let a=at(e[0]),b=at(e[1]);return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+color+'" stroke-width="'+width+'" stroke-dasharray="'+dash+'"/>';};if(pair)pair.forEach((t,i)=>out+='<polygon points="'+pts(t)+'" fill="'+(i?'#ffe4c6':'#d7e8ff')+'" fill-opacity=".55"/>');for(let e of q.edges)out+=line(e,'#3c5369');for(let [e,s]of q.aux||[])if(step>=s)out+=line(e,'#258462',2.5,'6 5');if(pair)pair.forEach((t,i)=>out+='<polygon points="'+pts(t)+'" fill="none" stroke="'+(i?'#bf6b20':'#2465d6')+'" stroke-width="4" stroke-dasharray="'+(i?'9 5':'none')+'"/>');for(let [ka,kb,kc,start]of q.right||[]){if(step<start)continue;const a=at(ka),b=at(kb),c=at(kc),l=Math.hypot(a[0]-b[0],a[1]-b[1]),m=Math.hypot(c[0]-b[0],c[1]-b[1]);if(!l||!m)continue;const u=[(a[0]-b[0])/l,(a[1]-b[1])/l],v=[(c[0]-b[0])/m,(c[1]-b[1])/m],r=11;out+='<path d="M'+(b[0]+r*u[0])+','+(b[1]+r*u[1])+' l'+(r*v[0])+','+(r*v[1])+' l'+(-r*u[0])+','+(-r*u[1])+'" fill="none" stroke="#65798b" stroke-width="1.5"/>';}const badges=[];for(let [e,text,s,dx,dy]of q.labels||[]){if(step<s)continue;const a=at(e[0]),b=at(e[1]),x=(a[0]+b[0])/2+dx,y=(a[1]+b[1])/2+dy,w=text.length*11+16;badges.push([x,y,w]);out+='<rect x="'+(x-w/2)+'" y="'+(y-14)+'" width="'+w+'" height="28" fill="white" stroke="#b9cde8" rx="5"/><text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" fill="#2465d6" font-size="19">'+text+'</text>';}
const segs=q.edges.map(e=>[at(e[0]),at(e[1])]),placed=[],dist=(x,y,a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/(vx*vx+vy*vy||1)));return Math.hypot(x-a[0]-vx*t,y-a[1]-vy*t)};for(let k of names){const a=at(k);let best,score=-Infinity;for(let j=0;j<16;j++){let t=j*Math.PI/8,x=a[0]+24*Math.cos(t),y=a[1]+24*Math.sin(t),s=Math.min(...segs.map(([a,b])=>dist(x,y,a,b)));for(let b of badges)if(Math.abs(x-b[0])<b[2]/2+10&&Math.abs(y-b[1])<28)s-=100;for(let b of placed)s-=Math.max(0,32-Math.hypot(x-b[0],y-b[1]))*4;if(s>score){score=s;best=[x,y]}}placed.push(best);out+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="3.5" fill="#20374b"/><text x="'+best[0]+'" y="'+(best[1]+6)+'" fill="#20374b" text-anchor="middle" font-size="21" style="paint-order:stroke;stroke:white;stroke-width:4px">'+k+'</text>';}
$('diagram').innerHTML=out;$('legend').innerHTML=pair?'<span class="blue">△'+pair[0]+'</span><span>'+(index===7?'≌':'∼')+'</span><span class="orange">△'+pair[1]+'</span><span>'+[...pair[0]].map((k,i)=>k+'↔'+pair[1][i]).join('，')+'</span>':'';}
$('nav').onclick=e=>{let b=e.target.closest('[data-i]');if(b)choose(+b.dataset.i)};$('next').onclick=()=>{step++;show();$('steps').scrollTop=$('steps').scrollHeight};$('prev').onclick=()=>{step--;show()};$('all').onclick=()=>{step=questions[index].steps.length;show()};$('hide').onclick=()=>{step=0;show()};$('previous').onclick=()=>{if(index)choose(index-1)};$('following').onclick=()=>{if(index<7)choose(index+1)};$('hintButton').onclick=()=>{$('hint').hidden=!$('hint').hidden};$('figureControls').onclick=e=>{if(e.target.id==='before'){before=true;draw()}if(e.target.id==='after'){before=false;draw()}};document.querySelector('.status').onclick=e=>{if(!e.target.dataset.state)return;records[index]=e.target.dataset.state;try{localStorage.setItem('hh-sim-mixed-1028',JSON.stringify(records))}catch{}show()};$('larger').onclick=()=>{font=Math.min(31,font+2);document.documentElement.style.setProperty('--font',font+'px')};$('smaller').onclick=()=>{font=Math.max(19,font-2);document.documentElement.style.setProperty('--font',font+'px')};$('focus').onclick=()=>{document.body.classList.toggle('focus');$('focus').textContent=document.body.classList.contains('focus')?'退出大屏':'讲课大屏'};document.onkeydown=e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key==='PageDown'){e.preventDefault();$('following').click()}if(e.key==='PageUp'){e.preventDefault();$('previous').click()}};render();
