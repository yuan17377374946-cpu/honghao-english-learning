<script>
const D={"id":"hongren-tonight-9-20261021","groups":[{"id":"u21","c":2,"title":"跑道边界：先找真正的直道长","method":"描外边界 → 找直道长 → 合并弧长","items":[{"id":"u21-0","level":"今晚必练","chapter":2,"n":3,"title":"总长不等于直道长","text":"一个运动场由中间的长方形和两端的半圆组成。整个运动场从最左端到最右端长20米，宽8米。沿运动场外边缘围一圈，需要围栏约多少米？","prompt":"先沿外边界描一圈。整个长20米，里面的直道也长20米吗？","captions":["沿运动场最外面看一圈，虚线不是外边界。","宽8米就是半圆直径，两端各伸出一个半径。","总长扣掉两个半径，才是中间的直道长。","直道长20−8=12米；外边界=两条直道+两段半圆弧。"],"answers":[{"label":"计算结果","value":"49.12","unit":"米"}],"steps":["宽8米就是半圆的直径。左右两端各向外伸出一个半径，合起来占8米。","中间长方形的长（直道长）=20−8=12（米）。","两端的半圆弧合成一个整圆的周长：3.14×8=25.12（米）。图内两条直径不在外边界上，不能加入。","围栏长≈12×2+25.12=49.12（米）。"],"formula":"外边界长度 = 2×（总长−宽）+ π×宽","trap":"总长20米包含两端的半径；内侧虚线不属于外边界。","model":{"type":"circleReview"}}]},{"id":"u22","c":2,"title":"剪开纸片：找出新增的边","method":"拆开图形 → 数新增边 → 合计周长","items":[{"id":"u22-0","level":"今晚必练","chapter":2,"n":4,"title":"剪开后，周长多在哪里？","text":"一张直径12厘米的圆形纸片，沿一条直径剪成两个半圆。两个半圆的周长加起来约是多少厘米？","prompt":"先画原来的圆，再把两个半圆分开。哪些边原来没有，剪开以后才出现？","captions":["虚线是剪开的地方。原来这条线在圆的内部。","分成两个半圆后，各自都要算完整边界。","红色是新出现的两条直边，每条都是12厘米。","两段弧合为原圆周长，再加2条直径，得到61.68厘米。"],"answers":[{"label":"计算结果","value":"61.68","unit":"厘米"}],"steps":["两个半圆的弯曲部分合起来，仍然是原来圆的一整圈：3.14×12=37.68（厘米）。","剪开后，每个半圆都新增一条长12厘米的直边，一共新增2条。","两个半圆周长之和≈37.68+12×2=61.68（厘米）。","不能只算原圆周长，也不能只加一条直径；要把两个半圆的边界分别数完整。"],"formula":"两个半圆周长之和 = 原圆周长 + 2条直径","trap":"每个半圆都有一条直边，合计要加两条直径。","model":{"type":"circleReview"}}]},{"id":"u23","c":2,"title":"剪圆剩面积：确定最大圆的直径","method":"找短边 → 定半径 → 算面积差","items":[{"id":"u23-0","level":"今晚必练","chapter":2,"n":5,"title":"最大的圆由哪条边决定？","text":"一张长12厘米、宽8厘米的长方形纸片，从中剪去一个尽可能大的圆。剩下纸片的面积约是多少平方厘米？","prompt":"先把圆画进长方形里。圆再大一点会先碰到哪两条边？","captions":["长方形长12厘米、宽8厘米，先想圆怎样放得下。","最大圆碰到上下两条边，所以直径由宽8厘米决定。","橙色是保留下来的纸，白色圆是剪去的部分。","先算半径4厘米，再用长方形面积减圆面积。"],"answers":[{"label":"计算结果","value":"45.76","unit":"平方厘米"}],"steps":["最大圆要完整放进纸片。圆的直径由较短的边决定，是8厘米，不能用长12厘米作直径。","半径=8÷2=4（厘米），圆面积≈3.14×4×4=50.24（平方厘米）。","长方形面积=12×8=96（平方厘米）。剩余面积≈96−50.24=45.76（平方厘米）。","检验：剪掉的圆和橙色剩余部分拼起来，正好是原来的长方形。"],"formula":"剩余面积 = 长方形面积 − 最大圆面积","trap":"最大圆的直径由长方形较短的边决定。","model":{"type":"circleReview"}}]},{"id":"u32","c":3,"title":"共边拼搭：由小棒根数反求图形个数","method":"找到共用边 → 写规律 → 反求个数","items":[{"text":"用同样长的小棒，把正方形首尾相接摆成一行，相邻两个图形只共用一条边，不重叠。现有31根小棒，全部用完，能摆出多少个正方形？先画出前3个图形，再写出摆n个时的小棒根数。","prompt":"第二个图形还需要完整的一组小棒吗？一共增加了n次，还是n−1次？","model":{"type":"sticks","shape":"square","first":4,"add":3,"total":31,"n":10},"steps":["第一个图形需要4根；以后每增加一个图形，因为共用一条边，只增加3根。","摆n个图形，小棒根数为4+3(n−1)，也就是3n+1。","根据3n+1=31，得到n=(31−1)÷3=10。","检验：4+3×(10−1)=31，所以能摆10个。"],"answers":[{"label":"图形个数","value":"10","unit":"个"}],"captions":["先看前3个图形，圈出相邻图形共用的边。","共用边只算一次；第一个要完整计算。","第一个用4根，后面每次只增加3根。","4+3(n−1)=31，所以n=10。"],"formula":"4+3(n−1)=31","trap":"已经算了第一个，后面只剩n−1个；直接乘完整边数会重复算共用边。","id":"u32-0","level":"今晚必练","chapter":3}]},{"id":"u33","c":3,"title":"拼桌子：扣掉被挡住的座位","method":"画接缝 → 扣座位 → 判断至少多少张","items":[{"text":"餐厅每张正方形桌单独放时能坐4人。把桌子沿同一方向拼成一长排，每拼接一处，就有两个原来的座位不能使用。要安排26人全部坐下，至少需要多少张桌子？","prompt":"请画出1张、2张、3张桌子。桌子有n张，拼接处有几处？","model":{"type":"tables","per":4,"guests":26,"n":12},"steps":["n张桌子分别放，可以坐4n人。拼成一排有n−1处接缝，每处少2个座位。","可坐人数=4n−2(n−1)=2n+2。","先算(26−2)÷2=12。正好是整数。","用12张可以坐26人；用11张只能坐24人，因此至少需要12张。"],"answers":[{"label":"最少桌子数","value":"12","unit":"张"}],"captions":["桌子单独放时，每张四周都可以坐人。","把桌子拼起来，接缝处原来的座位不能再坐。","n张桌子只有n−1处接缝，每处少2个座位。","可坐人数=2n+2，至少要12张桌子。"],"formula":"可坐人数=4n−2(n−1)=2n+2","trap":"拼接处是n−1处；“至少”需要检查取整后的桌子是否够坐。","id":"u33-0","level":"今晚必练","chapter":3}]},{"id":"u34","c":3,"title":"日历规律：已知总和，反求日期","method":"选基准 → 表示相邻日期 → 利用总和","items":[{"text":"某个月的日历上，用一个2×2的方框圈住4个完整的日期。这4个日期的和是80。方框里最大的日期是几号？","prompt":"先选左上角为a，其余3个日期要怎样表示？","model":{"type":"calendar","kind":"block","sum":80,"a":16,"answer":24},"steps":["日历中同一行相邻日期差1，同一列上下相邻日期差7。","若左上角是a，四个数就是a、a+1、a+7、a+8。","四数和为4a+16=80，得到a=(80−16)÷4=16。","最大的是右下角：16+8=24，所以是24号。"],"answers":[{"label":"最大的日期","value":"24","unit":"号"}],"captions":["先画一个2×2日历框，选左上角作为基准。","向右加1，向下加7，而不是向下加10。","把四个日期写成a、a+1、a+7、a+8。","四数和4a+16=80，右下角为24号。"],"formula":"a+(a+1)+(a+7)+(a+8)=80","trap":"日历每行7天；不要把百数表上下相差10的规律套进来。","id":"u34-0","level":"今晚必练","chapter":3}]},{"id":"u41","c":4,"title":"连续对应：先求其中的一部分，再求其余","method":"找两个整体 → 连续求部分 → 回到全体求剩余","items":[{"text":"学校科技小组有48人，其中3/4参加模型制作；参加模型制作的人中，又有2/3参加飞机制作。科技小组中没有参加飞机制作的一共有多少人？","prompt":"两个分数分别对应谁？没参加飞机制作的人，是否全都在模型制作小组外？","model":{"type":"nested","N":48,"a":"3/4","b":"2/3","k":6,"n":12,"inside":24,"rest":24},"steps":["第一个分数3/4对应整个科技小组，模型制作人数为48×3/4=36（人）。","第二个分数2/3对应模型制作人数，飞机制作人数为36×2/3=24（人）。","没有参加飞机制作的人数=48−24=24（人）。","也可以先求飞机制作占整体的1/2，再求其补部分：48×(1−3/4×2/3)=24。"],"answers":[{"label":"未参加飞机制作","value":"24","unit":"人"}],"captions":["整条线段表示学校这个小组的全部人数。","蓝色部分参加模型制作，第一个分数对应全部人数。","只在蓝色部分内部，再找参加飞机制作的人。","最后要求的是飞机制作以外的所有人，包括图中两种未选部分。"],"formula":"48×(1−3/4×2/3)=24","trap":"第二个分数对应模型制作人数；不能直接从整体减去两个分数。","id":"u41-0","level":"今晚必练","chapter":4}]},{"id":"u42","c":4,"title":"比较标准变化：同一个差，两个不同分率","method":"画齐两端 → 标出差 → 分别确定比较标准","items":[{"text":"一件商品原价40元，现在售价50元。（1）现在比原来提高了几分之几？（2）反过来，原来比现在少几分之几？","prompt":"相差量有没有变？两问拿来作比较标准的量，是否相同？","model":{"type":"compare","old":40,"new":50,"diff":10,"unit":"元"},"steps":["两问的相差量相同，都是10元。","第一问以原来的40元为标准，分率=10÷40=1/4。","第二问以现在的50元为标准，分率=10÷50=1/5。","相差量虽然相同，但比较标准不同，两个分率不能照抄。"],"answers":[{"label":"第（1）问","value":"1/4","unit":""},{"label":"第（2）问","value":"1/5","unit":""}],"captions":["两条线段左端对齐，长度按实际数量比例画。","突出两条线段的差，两个问题的差量相同。","第一问用原来作标准，第二问改用现在作标准。","分别得到1/4和1/5，分母随比较标准改变。"],"formula":"第（1）问：10÷40；第（2）问：10÷50","trap":"“比谁多/少”，就除以谁；别只看“多”和“少”选乘除。","id":"u42-0","level":"今晚必练","chapter":4}]},{"id":"u44","c":4,"title":"差量求整体，再求剩余","method":"对齐比较 → 找差对应分率 → 反求整体","items":[{"text":"一条赛道分成环山路段、海滨路段和普通公路。环山路段占全程1/3，海滨路段占全程1/6，环山路段比海滨路段长4千米。赛道全长多少千米？普通公路长多少千米？","prompt":"已知的差量对应整条线段，还是两个分数之间的差？","model":{"type":"difference","N":24,"a":"1/3","b":"1/6","diff":4,"unit":"千米","rest":12},"steps":["两个分数都对应同一个整体。差量占整体的1/3−1/6=1/6。","整体数量=4÷1/6=24（千米）。","其余部分占整体的1−1/3−1/6=1/2。","其余数量=24×1/2=12（千米），与已知两部分相加应回到整体。"],"answers":[{"label":"整体数量","value":"24","unit":"千米"},{"label":"其余数量","value":"12","unit":"千米"}],"captions":["两种部分先用同样长的整体作参照。","对齐左端，比较两个部分的长度。","已知的差量，对应两个分数相减的那一段。","先用差量反求整体，再求两部分以外的剩余。"],"formula":"4÷(1/3−1/6)=24；24×(1−1/3−1/6)=12","trap":"差量不能直接除以其中一个分数；先找差量对应的分率。","id":"u44-0","level":"今晚必练","chapter":4}]}],"focus":["u21-0","u22-0","u23-0","u32-0","u33-0","u34-0","u41-0","u42-0","u44-0"]};

const core=[
{title:'人数差藏着几份？',short:'1. 数量差',prompt:'先把男生和女生画成两条线段。多出的12人，对应全班的几分之几？',text:'六（1）班男生占全班人数的3/5，其余都是女生。男生比女生多12人。全班一共有多少人？',given:['男生占全班3/5','女生是其余部分','男生比女生多12人'],answerText:'60',unit:'人',relation:'全班人数 ×（男生占比 − 女生占比）= 人数差',steps:['全班人数是单位“1”。平均分成5份，男生占3份，女生占2份。','男生多出的1份，就是12人；这1份占全班的1/5。','全班人数：12÷(3/5−2/5)=12÷1/5=60（人）。','检验：男生36人，女生24人，相差12人。'],captions:['把全班看成同一个整体，比较两条线段。','全班分成5份：男生3份，女生是剩下的2份。','对齐左端，多出来的1份对应12人。','先找到“差”对应1/5，再用12÷1/5求全班。']},
{title:'第二次的分数，是谁的几分之几？',short:'2. 连续变化',prompt:'两次说的整体一样吗？先划去第一次用的，再从剩下的里面分。',text:'一袋大米，第一天用去原来总量的1/3，第二天用去第一天剩余量的1/4，最后还剩18千克。这袋大米原来有多少千克？',given:['第一天用原来的1/3','第二天用余下的1/4','最后剩18千克'],answerText:'36',unit:'千克',relation:'原来总量 ×（1−1/3）×（1−1/4）= 最后剩余量',steps:['先把原来的总量画成12份。第一天用去4份，还剩8份。','第二天把剩下的8份看作新的整体，用去它的1/4，也就是2份。不能把第二次的1/4当成原来总量的1/4。','最后剩6份，占原来总量的(1−1/3)×(1−1/4)=1/2。','原来总量：18÷1/2=36（千克）。检验：第一天用12千克，第二天用6千克，最后剩18千克。'],captions:['三行线段都表示原来那一袋米，长度相同。','第一天划去原来的1/3，留下2/3。','只把剩下部分平均分成4份，第二天用其中1份。','最后剩原来的1/2，对应18千克；18÷1/2=36。']},
{title:'14页应该放在线段的哪一段？',short:'3. 剩余关系',prompt:'一条线段同时标出第一天读的、第二天读的和最后剩的，14页对应哪部分？',text:'小宁读一本书，第一天读了全书的2/5，第二天又读了14页，这时还剩全书的1/4没有读。这本书一共有多少页？',given:['第一天读全书2/5','第二天读14页','最后剩全书1/4'],answerText:'40',unit:'页',relation:'全书页数 ×（1−2/5−1/4）= 第二天读的14页',steps:['把全书页数看成单位“1”，它由第一天读的、第二天读的、最后剩的三段组成。','把整条线段分成20份：第一天读8份，最后剩5份，中间第二天读7份。','第二天的14页占全书的1−2/5−1/4=7/20。全书页数：14÷7/20=40（页）。','检验：第一天读16页，第二天读14页，最后剩10页，正好是全书的1/4。'],captions:['整条线段表示全书，先不要把14页当成剩余页数。','左边是第一天读的2/5，右边是最后剩的1/4。','中间那一段才是第二天读的14页。','14页对应1−2/5−1/4=7/20，所以全书有40页。']},
{title:'总长不等于直道长',short:'4. 跑道边界',prompt:'先沿外边界描一圈。整个长20米，里面的直道也长20米吗？',text:'一个运动场由中间的长方形和两端的半圆组成。整个运动场从最左端到最右端长20米，宽8米。沿运动场外边缘围一圈，需要围栏约多少米？',given:['整个运动场总长20米','宽8米','两端各一个半圆'],answerText:'49.12',unit:'米',relation:'外边界长度 = 2×（总长−宽）+ π×宽',steps:['宽8米就是半圆的直径。左右两端各向外伸出一个半径，合起来占8米。','中间长方形的长（直道长）=20−8=12（米）。','两端的半圆弧合成一个整圆的周长：3.14×8=25.12（米）。图内两条直径不在外边界上，不能加入。','围栏长≈12×2+25.12=49.12（米）。'],captions:['沿运动场最外面看一圈，虚线不是外边界。','宽8米就是半圆直径，两端各伸出一个半径。','总长扣掉两个半径，才是中间的直道长。','直道长20−8=12米；外边界=两条直道+两段半圆弧。']},
{title:'剪开后，周长多在哪里？',short:'5. 剪开增周长',prompt:'先画原来的圆，再把两个半圆分开。哪些边原来没有，剪开以后才出现？',text:'一张直径12厘米的圆形纸片，沿一条直径剪成两个半圆。两个半圆的周长加起来约是多少厘米？',given:['原圆直径12厘米','沿直径剪成两个半圆','求两个半圆周长的和'],answerText:'61.68',unit:'厘米',relation:'两个半圆周长之和 = 原圆周长 + 2条直径',steps:['两个半圆的弯曲部分合起来，仍然是原来圆的一整圈：3.14×12=37.68（厘米）。','剪开后，每个半圆都新增一条长12厘米的直边，一共新增2条。','两个半圆周长之和≈37.68+12×2=61.68（厘米）。','不能只算原圆周长，也不能只加一条直径；要把两个半圆的边界分别数完整。'],captions:['虚线是剪开的地方。原来这条线在圆的内部。','分成两个半圆后，各自都要算完整边界。','红色是新出现的两条直边，每条都是12厘米。','两段弧合为原圆周长，再加2条直径，得到61.68厘米。']},
