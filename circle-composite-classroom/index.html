<script>
'use strict';
const questions=JSON.parse(document.querySelector('#questionData').textContent),groups=JSON.parse(document.querySelector('#groupData').textContent);
const $=s=>document.querySelector(s),storageKey='miaosang-circle-curated-20-v1';
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved={},storageOK=true;
try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}');if(!saved||typeof saved!=='object'||Array.isArray(saved))saved={}}catch(e){storageOK=false;saved={}}
if(saved.questionSet!=='without-q12-v1') { const next={};for(const [id,value] of Object.entries(saved.records||{})){const n=Number(id);if(n!==12)next[n>12?n-1:n]=value}saved.records=next;if(saved.current>12)saved.current--;else if(saved.current===12)saved.current=12;saved.questionSet='without-q12-v1'; }
let records=saved.records&&typeof saved.records==='object'&&!Array.isArray(saved.records)?saved.records:{};
let current=Number.isInteger(saved.current)&&saved.current>=1&&saved.current<=questions.length?saved.current:1;
let activeGroup=Number.isInteger(saved.group)&&saved.group>=-1&&saved.group<groups.length?saved.group:-1;
let activeFilter=['all','wrong','unfinished','diagnostic'].includes(saved.filter)?saved.filter:'all';let revealed=0;
function record(id){if(!records[id]||typeof records[id]!=='object')records[id]={done:false,wrong:false,note:''};return records[id]}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({records,current,group:activeGroup,filter:activeFilter,questionSet:'without-q12-v1'}));storageOK=true}catch(e){storageOK=false}updateSaveLabel()}
function updateSaveLabel(){const e=$('#saveState');if(e)e.textContent=storageOK?'已保存到本机':'当前浏览器无法保存，本次仍可练习'}
function filtered(){return questions.filter(q=>(activeGroup<0||q.group===activeGroup)&&(activeFilter==='all'||activeFilter==='wrong'&&record(q.id).wrong||activeFilter==='unfinished'&&!record(q.id).done||activeFilter==='diagnostic'&&q.priority))}
function announce(text){$('#announcement').textContent=text}
function renderNavigation(){const done=questions.filter(q=>record(q.id).done).length,wrong=questions.filter(q=>record(q.id).wrong).length;
$('#progressText').textContent=`已完成 ${done} / ${questions.length}`;$('#progressFill').style.width=done/questions.length*100+'%';$('.progressbar').setAttribute('aria-valuenow',done);$('#wrongCount').textContent=wrong;
$('#groupNav').innerHTML=`<button class="group-button ${activeGroup===-1?'active':''}" data-group="-1" ${activeGroup===-1?'aria-current="true"':''}><span class="group-number">全</span>全部题目<span class="count">${done}/${questions.length}</span></button>`+groups.map((g,i)=>`<button class="group-button ${activeGroup===i?'active':''}" data-group="${i}" ${activeGroup===i?'aria-current="true"':''}><span class="group-number">${String(i+1).padStart(2,'0')}</span><span>${escapeHTML(g[0].split('：')[0])}</span><span class="count">${questions.filter(q=>q.group===i&&record(q.id).done).length}/${questions.filter(q=>q.group===i).length}</span></button>`).join('');
$('#groupSelect').innerHTML='<option value="-1">全部7组 · 19题</option>'+groups.map((g,i)=>`<option value="${i}">${i+1}. ${escapeHTML(g[0])}</option>`).join('');$('#groupSelect').value=activeGroup;
document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('selected',b.dataset.filter===activeFilter);b.setAttribute('aria-pressed',b.dataset.filter===activeFilter)});
}
function refreshChrome(){renderNavigation();const list=filtered(),idx=list.findIndex(q=>q.id===current);$('#prevBtn').disabled=idx<=0;$('#nextBtn').disabled=idx<0||idx===list.length-1;$('#randomBtn').disabled=!list.length;$('#position').textContent=list.length?`当前列表 ${idx+1} / ${list.length} · 全册第 ${String(current).padStart(2,'0')} 题`:'当前列表暂无题目';$('#chips').innerHTML=list.map(q=>`<button title="第${q.id}题 ${escapeHTML(q.title)}" class="qchip ${q.id===current?'current':''} ${record(q.id).done?'done':''} ${record(q.id).wrong?'wrong':''}" data-q="${q.id}" ${q.id===current?'aria-current="true"':''}>${String(q.id).padStart(2,'0')}</button>`).join('')}
function render(){const list=filtered();if(!list.some(q=>q.id===current)&&list.length)current=list[0].id;revealed=0;refreshChrome();$('#question').classList.toggle('hidden',!list.length);$('#empty').classList.toggle('hidden',!!list.length);if(!list.length){$('#emptyTitle').textContent=activeFilter==='wrong'?'这里还没有错题':'当前筛选下没有题目';$('#emptyText').textContent=activeFilter==='wrong'?'做题时点“加入错题”，之后就能在这里集中复习。':'可以换一个题型，或查看全部题目。';persist();return}
const q=questions[current-1],r=record(current);$('#question').innerHTML=`<div class="question-head"><p class="eyebrow"><span>题型 ${String(q.group+1).padStart(2,'0')}</span>${escapeHTML(groups[q.group][0])}</p><h2 class="question-title">第${String(q.id).padStart(2,'0')}题 · ${escapeHTML(q.title)}</h2><p class="stem">${escapeHTML(q.stem)}</p><details class="question-source"><summary>题目来源</summary><p>${escapeHTML(q.sourceLabel)}${q.sourceUrl?` · <a href="${escapeHTML(q.sourceUrl)}" target="_blank" rel="noopener noreferrer">查看题源</a>`:''}<br>${escapeHTML(q.sourceLocation)}</p></details></div><div class="study-grid"><div class="figure-panel"><div>${q.svg}</div><div class="figure-caption"><span>${q.unit==='米'?'长度单位：米。':'长度单位：厘米，字母条件以题干为准。'}</span><button id="zoomBtn" class="quiet">放大图形</button></div></div><div class="workspace"><h3><label for="notes">我的列式与想法</label></h3><p>写下你的判断、理由或算式。</p><div class="symbols" role="group" aria-label="插入数学符号">${['＋','－','×','÷','π','²','（','）'].map(s=>`<button type="button" data-symbol="${s}" aria-label="插入${s}">${s}</button>`).join('')}</div><textarea id="notes" class="notes" spellcheck="false" placeholder="在这里写列式，也可以用纸笔计算。">${escapeHTML(typeof r.note==='string'?r.note:'')}</textarea><div class="save-state" id="saveState" aria-live="polite"></div><div class="status-controls"><button id="doneBtn" class="${r.done?'done-on':''}" aria-pressed="${!!r.done}">${r.done?'已完成 · 可取消':'标记完成'}</button><button id="wrongBtn" class="${r.wrong?'wrong-on':''}" aria-pressed="${!!r.wrong}">${r.wrong?'已在错题本 · 可移出':'加入错题'}</button></div></div></div><div class="learning-tools"><details><summary>先看一点提示</summary><div class="details-body hint-body">${escapeHTML(q.hint)}</div></details><details id="solutionDetails"><summary>分步看解析</summary><div class="details-body"><ol class="steps" id="steps"></ol><div class="step-controls"><button class="primary" id="nextStep">显示第一步</button><button id="allSteps">展开全部步骤</button><span class="step-label" id="stepLabel">共${q.steps.length}步</span></div></div></details><details><summary>核对参考答案</summary><div class="details-body answer-box">${q.answers.map(a=>`<p>${escapeHTML(a)}</p>`).join('')}</div></details></div>`;
$('#notes').addEventListener('input',()=>{record(current).note=$('#notes').value;persist()});$('#doneBtn').onclick=()=>toggleStatus('done');$('#wrongBtn').onclick=()=>toggleStatus('wrong');$('#zoomBtn').onclick=openZoom;$('#nextStep').onclick=()=>showSteps(revealed+1);$('#allSteps').onclick=()=>showSteps(q.steps.length);persist();}
function toggleStatus(field){const q=questions[current-1],r=record(current);r[field]=!r[field];const btn=$(field==='done'?'#doneBtn':'#wrongBtn');btn.setAttribute('aria-pressed',r[field]);btn.classList.toggle(field==='done'?'done-on':'wrong-on',r[field]);btn.textContent=field==='done'?(r.done?'已完成 · 可取消':'标记完成'):(r.wrong?'已在错题本 · 可移出':'加入错题');announce(field==='done'?(r.done?'本题已标记完成':'已取消完成标记'):(r.wrong?'本题已加入错题本':'本题已移出错题本'));const list=filtered();if(!list.some(x=>x.id===current)){const next=list.find(x=>x.id>current)||list[0];if(next)current=next.id;render()}else{refreshChrome();persist()}}
function showSteps(n){const q=questions[current-1];revealed=Math.min(n,q.steps.length);$('#steps').innerHTML=q.steps.slice(0,revealed).map(s=>`<li>${escapeHTML(s)}</li>`).join('');$('#stepLabel').textContent=`已显示 ${revealed} / ${q.steps.length} 步`;$('#nextStep').textContent=revealed===q.steps.length?'已到最后一步':'显示下一步';$('#nextStep').disabled=revealed===q.steps.length;$('#allSteps').disabled=revealed===q.steps.length}
function go(delta){const list=filtered(),idx=list.findIndex(q=>q.id===current),q=list[idx+delta];if(q){current=q.id;render();announce(`第${q.id}题，${q.title}`)}}
function selectGroup(g){activeGroup=g;render()}
$('#groupNav').onclick=e=>{const b=e.target.closest('[data-group]');if(b)selectGroup(Number(b.dataset.group))};$('#groupSelect').onchange=e=>selectGroup(Number(e.target.value));
$('.filterbar').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){activeFilter=b.dataset.filter;if(activeFilter==='diagnostic')activeGroup=-1;render()}};
$('#chips').onclick=e=>{const b=e.target.closest('[data-q]');if(b){current=Number(b.dataset.q);render()}};
$('#prevBtn').onclick=()=>go(-1);$('#nextBtn').onclick=()=>go(1);$('#randomBtn').onclick=()=>{const list=filtered().filter(q=>q.id!==current);if(list.length){current=list[Math.floor(Math.random()*list.length)].id;render()}};$('#backAll').onclick=()=>{activeGroup=-1;activeFilter='all';render()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-symbol]');if(!b)return;const el=$('#notes');if(!el)return;el.setRangeText(b.dataset.symbol,el.selectionStart,el.selectionEnd,'end');el.focus();record(current).note=el.value;persist()});
document.addEventListener('keydown',e=>{if($('#zoomDialog').open||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}if(e.key==='ArrowRight'){e.preventDefault();go(1)}});

    E('#animTimeline').replaceChildren(...lesson.frames.map((f,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${f.title}`;b.className=i===index?'current':i<index?'passed':'';if(i===index)b.setAttribute('aria-current','step');b.onclick=()=>go(i);return b}));
  }


  function paintCustom(frame,gentle){
    E('#animBoard').innerHTML=frame.svg;
    for(const m of frame.animations||[]){
      const node=E('#animBoard').querySelector(m.selector);if(!node)continue;
      if(m.keyframes){const last=m.keyframes[m.keyframes.length-1];if(last.opacity!==undefined)node.style.opacity=String(last.opacity);if(!gentle&&node.animate)animations.push(node.animate(m.keyframes,{duration:m.duration/speed,delay:(m.delay||0)/speed,fill:'both',easing:'linear'}));}else if(m.type==='trace'){
        const length=node.getTotalLength?node.getTotalLength():0;
        if(!gentle&&length&&node.animate){node.style.strokeDasharray=String(length);node.style.strokeDashoffset='0';animations.push(node.animate([{strokeDashoffset:length},{strokeDashoffset:0}],{duration:m.duration/speed,delay:(m.delay||0)/speed,fill:'both',easing:'linear'}))}
      }else{
        node.style.transformBox='view-box';node.style.transformOrigin=(m.origin||[0,0]).map(x=>x+'px').join(' ');node.style.transform=m.to;
        if(!gentle&&node.animate)animations.push(node.animate([{transform:m.from_},{transform:m.to}],{duration:m.duration/speed,delay:(m.delay||0)/speed,fill:'both',easing:'cubic-bezier(.25,.1,.25,1)'}));
      }
    }
    E('#animFormula').hidden=!frame.formula;E('#animFormula').textContent=frame.formula;E('#animStepTitle').textContent=frame.title;E('#animStepText').textContent=frame.text;
    E('#animStepCount').textContent=`第 ${index+1} / ${lesson.frames.length} 步`;E('#animRange').value=index;E('#animPrev').disabled=false;E('#animNext').disabled=index===lesson.frames.length-1;E('#animPlay').textContent=playing?'暂停动画':index===lesson.frames.length-1?'重新播放':'播放动画';
    E('#animTimeline').replaceChildren(...lesson.frames.map((f,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${f.title}`;b.className=i===index?'current':i<index?'passed':'';if(i===index)b.setAttribute('aria-current','step');b.onclick=()=>go(i);return b}));
  }

  function paintOriginal(){
    E('#animBoard').innerHTML=questions[lesson.id-1].svg;E('#animStepCount').textContent=`原图 · 共${lesson.frames.length}个动画步骤`;E('#animStepTitle').textContent='先看图，尝试列式';E('#animStepText').textContent='点“播放动画”快速看关键变化；需要讲解时可暂停，或用“下一步”逐步看。';E('#animFormula').textContent='';E('#animFormula').hidden=true;E('#animRange').value=-1;E('#animPrev').disabled=true;E('#animNext').disabled=false;E('#animPlay').textContent='播放动画';E('#animTimeline').replaceChildren(...lesson.frames.map((f,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${f.title}`;b.onclick=()=>go(i);return b}));
  }
  P('#animPrev').onclick=()=>go(index-1);P('#animNext').onclick=()=>go(index+1);P('#animPlay').onclick=togglePlay;
  P('#animReplay').onclick=()=>{stop();index=0;playing=true;paint(true);schedule(stepDelay())};P('#animOriginal').onclick=()=>go(-1,false);
  P('#animRange').addEventListener('input',e=>go(Number(e.target.value),false));
  P('#animSpeed').onchange=e=>{speed=Number(e.target.value);const was=playing;stop();playing=was;paint(was);if(was)schedule(stepDelay())};
  P('#animReduced').onchange=()=>{const was=playing;stop();playing=was;paint(was);if(was)schedule(stepDelay())};
  document.addEventListener('keydown',e=>{if(!panel.isConnected||!panel.contains(e.target)||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();e.stopImmediatePropagation();go(index+(e.key==='ArrowLeft'?-1:1),false)}},true);
  function install(){
    const card=E('#question');if(!card)return;if(card.classList.contains('hidden')){stop();return}if(card.querySelector('#inlineAnimation'))return;
    const grid=card.querySelector('.study-grid'),figure=card.querySelector('.figure-panel'),workspace=card.querySelector('.workspace'),head=card.querySelector('.question-head');
    if(!grid||!figure||!workspace||!head)return;stop();const id=Number(current);panel.dataset.question=String(id);lesson=circleAnimationLessons[id-1];if(!lesson)return;index=-1;
    const staticDrawing=figure.firstElementChild,caption=figure.querySelector('.figure-caption');if(staticDrawing)staticDrawing.remove();figure.prepend(panel);if(caption)P('#inlineCaption').replaceChildren(caption);
    workspace.prepend(head);E('#animRange').max=lesson.frames.length-1;E('#animLessonInfo').textContent=`第${id}题 · ${lesson.frames.length}步`;E('#animTimelineLabel').textContent=`查看全部${lesson.frames.length}个动画步骤`;paint(false);
  }
  new MutationObserver(install).observe(E('#question'),{childList:true,attributes:true,attributeFilter:['class']});install();
  document.addEventListener('click',e=>{if(e.target.closest('#zoomBtn')&&playing)pause()},true);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});
  let printIndex=-1;window.addEventListener('beforeprint',()=>{if(!panel.isConnected)return;printIndex=index;stop();index=-1;paint(false)});window.addEventListener('afterprint',()=>{if(!panel.isConnected)return;index=printIndex;paint(false)});
})();
</script></body></html>
