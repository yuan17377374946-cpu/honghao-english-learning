  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%235b46f2'/%3E%3Ccircle cx='22' cy='22' r='6' fill='%23ffd84d'/%3E%3Ccircle cx='39' cy='18' r='5' fill='%23ff7c66'/%3E%3Ccircle cx='45' cy='35' r='6' fill='%234ed6b6'/%3E%3Cpath d='M18 43c10 8 24 6 29-2' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#20243a;--muted:#667085;--purple:#5b46f2;--purple2:#7f6cff;--yellow:#ffd84d;--orange:#ff7c66;--mint:#4ed6b6;--blue:#55b7ff;--paper:#fff;--bg:#f5f3ff;--line:#e5e1f7;--ok:#168a68;--bad:#d64b56;--shadow:0 14px 38px rgba(67,51,150,.14)}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:linear-gradient(145deg,#f4f0ff 0%,#eef8ff 52%,#fff8dd 100%);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;font-size:16px}
    button,input,textarea,select{font:inherit} button{cursor:pointer} .app{max-width:1180px;margin:auto;padding:20px 20px 48px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:var(--purple);display:grid;place-items:center;color:#fff;font-size:25px;box-shadow:0 9px 20px rgba(91,70,242,.3)}
    h1{font-size:clamp(1.35rem,3vw,2rem);margin:0;letter-spacing:-.02em}.sub{color:var(--muted);font-size:.94rem;margin-top:3px}.top-actions{display:flex;gap:8px}.ghost{border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:13px;padding:10px 13px;color:var(--ink);font-weight:700}
    .overview{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:20px}.welcome,.stats,.level-card,.game,.result-card{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);border-radius:24px}
    .welcome{padding:25px;position:relative;overflow:hidden}.welcome:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--yellow) 0 16%,var(--orange) 17% 31%,var(--purple) 32% 49%,transparent 50%);right:-45px;bottom:-70px;opacity:.84}.eyebrow{color:var(--purple);font-weight:900;letter-spacing:.08em;font-size:.8rem}.welcome h2{font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.1;margin:8px 0 10px;max-width:620px}.welcome p{max-width:660px;line-height:1.65;color:var(--muted);margin:0;position:relative;z-index:1}.start-row{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1}.primary{border:0;border-radius:14px;background:var(--purple);color:#fff;padding:12px 18px;font-weight:900;box-shadow:0 8px 18px rgba(91,70,242,.25)}.primary:hover{background:#4c38dc}.secondary{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 18px;font-weight:800}
    .stats{padding:20px;display:flex;flex-direction:column;justify-content:center}.stat-title{display:flex;justify-content:space-between;font-weight:900}.progress{height:13px;border-radius:20px;background:#ebe8fa;overflow:hidden;margin:14px 0 18px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:inherit;transition:width .4s}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border-radius:16px;padding:12px;background:#f7f6fc;text-align:center}.stat b{display:block;font-size:1.35rem}.stat span{font-size:.78rem;color:var(--muted)}
    .section-head{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 12px}.section-head h2{margin:0;font-size:1.25rem}.section-head p{margin:0;color:var(--muted);font-size:.88rem}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.level-card{padding:18px;min-height:188px;display:flex;flex-direction:column;transition:transform .16s,box-shadow .16s}.level-card:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(67,51,150,.2)}.level-top{display:flex;justify-content:space-between;align-items:center}.level-num{font-weight:950;color:var(--purple);font-size:.86rem}.level-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.35rem}.level-card h3{margin:11px 0 6px;font-size:1.12rem}.level-card p{margin:0 0 14px;color:var(--muted);font-size:.88rem;line-height:1.5;flex:1}.level-foot{display:flex;align-items:center;justify-content:space-between}.mini-progress{font-size:.78rem;color:var(--muted)}.play{border:0;border-radius:11px;background:#f0edff;color:var(--purple);font-weight:900;padding:8px 12px}
    .hidden{display:none!important}.game{max-width:900px;margin:12px auto 0;overflow:hidden}.game-head{padding:18px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:1.25rem}.game-title b{display:block}.game-title span{font-size:.83rem;color:var(--muted)}.counter{font-weight:900;color:var(--purple)}.qbar{height:7px;background:#ece9fa}.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--mint));transition:width .3s}.question{padding:28px 26px 24px}.type-label{display:inline-block;padding:5px 9px;border-radius:999px;background:#f0edff;color:var(--purple);font-size:.77rem;font-weight:900;margin-bottom:13px}.prompt-row{display:flex;align-items:flex-start;gap:10px}.prompt{font-size:clamp(1.14rem,2.5vw,1.5rem);line-height:1.55;font-weight:850;margin:0;flex:1}.speak{border:0;background:#eef8ff;border-radius:12px;width:40px;height:40px;font-size:1.08rem}.context{background:#f8f9fc;border-left:5px solid var(--blue);border-radius:10px;padding:14px 16px;margin:15px 0;line-height:1.7;color:#394057}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px}.option{border:2px solid var(--line);background:#fff;border-radius:15px;padding:14px;text-align:left;font-weight:750;min-height:55px}.option:hover,.option.selected{border-color:var(--purple);background:#f5f2ff}.option.correct{border-color:var(--ok);background:#eafff7}.option.wrong{border-color:var(--bad);background:#fff0f1}.answer-box{margin-top:21px}.text-answer{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 15px;outline:none;background:#fff}.text-answer:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(91,70,242,.1)}textarea.text-answer{min-height:110px;resize:vertical;line-height:1.6}.word-bank,.sentence-zone{display:flex;flex-wrap:wrap;gap:9px;padding:13px;border-radius:15px;margin-top:14px;min-height:60px}.word-bank{background:#f4f2fb}.sentence-zone{background:#fff;border:2px dashed #cfc8ee}.word{border:1px solid #dcd6f7;background:#fff;border-radius:11px;padding:9px 12px;font-weight:800}.word.used{opacity:.35}.built-word{background:#ece8ff;color:#3f2bbf}
    .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.match-row{display:contents}.match-left{background:#f6f4ff;border-radius:12px;padding:12px;font-weight:800}.match-select{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink);min-width:0}.feedback{border-radius:15px;padding:14px 16px;margin-top:18px;line-height:1.55}.feedback.ok{background:#e9fff7;color:#146f56}.feedback.bad{background:#fff1f2;color:#a93b45}.feedback b{display:block;margin-bottom:3px}.game-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:21px}.check{border:0;border-radius:13px;padding:12px 20px;background:var(--purple);color:#fff;font-weight:900}.check:disabled{opacity:.45}.skip{border:0;background:transparent;color:var(--muted);font-weight:800}.hint{border:1px solid #ffd16c;background:#fff9df;color:#785600;border-radius:13px;padding:11px 13px;margin-top:15px;line-height:1.55}.passage{white-space:pre-line}
    .result-card{max-width:680px;margin:40px auto;padding:34px;text-align:center}.result-icon{font-size:3rem}.result-card h2{font-size:2rem;margin:10px 0}.score-ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:20px auto;background:conic-gradient(var(--purple) var(--score),#ece9fa 0);position:relative}.score-ring:after{content:"";position:absolute;inset:12px;background:#fff;border-radius:50%}.score-ring b{position:relative;z-index:1;font-size:1.8rem}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.wrong-list{text-align:left;margin-top:22px}.wrong-list details{border-top:1px solid var(--line);padding:10px 0}.wrong-list summary{cursor:pointer;font-weight:800}.writing-note{font-size:.85rem;color:var(--muted);margin-top:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#22263b;color:#fff;padding:11px 18px;border-radius:13px;transition:transform .25s;z-index:10}.toast.show{transform:translate(-50%,0)}
    @media(max-width:820px){.overview{grid-template-columns:1fr}.levels{grid-template-columns:1fr 1fr}.welcome:after{opacity:.35}.top-actions .label{display:none}}
    @media(max-width:560px){.app{padding:14px 12px 32px}.topbar{align-items:flex-start}.logo{width:42px;height:42px}.sub{display:none}.overview{gap:12px}.welcome{padding:20px}.welcome h2{font-size:1.75rem}.start-row{flex-direction:column}.start-row button{width:100%}.stats{padding:17px}.levels{grid-template-columns:1fr}.level-card{min-height:165px}.section-head{align-items:start;gap:8px}.section-head p{text-align:right}.game-head{padding:14px;grid-template-columns:auto 1fr}.counter{grid-column:2}.question{padding:21px 16px}.options{grid-template-columns:1fr}.match-grid{grid-template-columns:1fr}.match-row{display:flex;flex-direction:column;gap:6px}.game-actions{flex-wrap:wrap}.check{flex:1}.result-card{margin:20px 0;padding:24px 18px}}

<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="logo" aria-hidden="true">✦</div><div><h1>Unit 2 艺术英语闯关</h1><div class="sub">Why do we make art?</div></div></div>
    <div class="top-actions"><button class="ghost" id="wrongBtn">✎ <span class="label">错题</span> <b id="wrongCount">0</b></button><button class="ghost" id="resetBtn">↻ <span class="label">重置</span></button></div>
  </header>

  <section id="home">
    <div class="overview">
      <div class="welcome">
        <div class="eyebrow">UNIT 2 · ART STUDIO</div>
        <h2>收集颜料，完成你的单元复习画作</h2>
        <p>从单词到句子，从语法到阅读。每次只专心完成一个小任务，做错了也没关系，看懂提示再试一次。</p>
        <div class="start-row"><button class="primary" id="continueBtn">开始第1关</button><button class="secondary" id="quickBtn">综合挑战</button></div>
      </div>
      <div class="stats">
        <div class="stat-title"><span>总进度</span><span id="overallText">0%</span></div><div class="progress"><i id="overallBar"></i></div>
        <div class="stat-grid"><div class="stat"><b id="doneStat">0</b><span>已完成</span></div><div class="stat"><b id="accuracyStat">—</b><span>正确率</span></div><div class="stat"><b id="paintStat">0</b><span>获得颜料</span></div></div>
      </div>
    </div>
    <div class="section-head"><div><h2>选择复习关卡</h2><p>每关约 8—10 个小任务</p></div><p>共 <b id="totalTasks">0</b> 个任务</p></div>
    <div class="levels" id="levels"></div>
  </section>

  <section id="game" class="game hidden">
    <div class="game-head"><button class="back" id="backBtn" aria-label="返回关卡">←</button><div class="game-title"><b id="gameName"></b><span id="gameDesc"></span></div><div class="counter" id="counter"></div></div>
    <div class="qbar"><i id="qbar"></i></div>
    <div class="question" id="question"></div>
  </section>
  <section id="result" class="result-card hidden"></section>
</main>
<div class="toast" id="toast"></div>
<script>
const modules=[
{id:'words',icon:'🎨',color:'#fff0b8',name:'单词换语境',desc:'单词、词组与课文中的真实用法',qs:[
 {t:'choice',p:'“powerful” 在 Art can be very powerful. 中是什么意思？',o:['有力量的；有感染力的','很漂亮的','很困难的','很安静的'],a:0,e:'powerful 表示“有力量的；有感染力的”。'},
 {t:'choice',p:'Artists try to express themselves. 这里 express 的意思是：',o:['保护','表达','分享','制作'],a:1,e:'express 是“表达”。express themselves 表示“表达他们自己”。'},
 {t:'match',p:'把文章的四个组成部分配对。',pairs:[['title','标题'],['heading','小标题'],['picture','图片'],['caption','图片说明']],e:'title 是整篇标题；heading 是小标题；caption 是图片说明。'},
 {t:'choice',p:'Xu Beihong was good at ______.',o:['ink painting','oil painting','recycled art','paper cutting'],a:0,e:'徐悲鸿擅长水墨画：be good at ink painting。'},
 {t:'choice',p:'Vincent van Gogh was famous for using bright ______.',o:['feelings','colours','hearts','strings'],a:1,e:'bright colours 表示“鲜艳的颜色”。'},
 {t:'text',p:'根据中文写词组：打动人们的心',a:['touch people’s hearts',"touch people's hearts"],hint:'touch + people’s + hearts',e:'touch people’s hearts：打动人们的心。'},
 {t:'choice',p:'Artists make recycled art ______ old things.',o:['at','from','to','for'],a:1,e:'make ... from ... 表示“用……制成……”。'},
 {t:'text',p:'根据英文写中文：such as',a:['例如','比如'],hint:'后面常列举例子。',e:'such as 表示“例如；比如”。'}]},
{id:'present',icon:'☀️',color:'#e9f8ff',name:'一般现在时',desc:'第三人称单数、do/does 与日常事实',qs:[
 {t:'choice',p:'Almost everyone ______ looking at works of art.',o:['enjoy','enjoys','enjoyed','is enjoy'],a:1,e:'everyone 看作第三人称单数，所以用 enjoys。'},
 {t:'choice',p:'Artists ______ their feelings through art.',o:['shows','show','showed','showing'],a:1,e:'主语 Artists 是复数，动词用原形 show。'},
 {t:'choice',p:'Some paintings ______ real.',o:['looks','look','looked','is looking'],a:1,e:'paintings 是复数，使用 look。'},
 {t:'text',p:'把句子改成一般疑问句：She likes oil painting.',a:['Does she like oil painting?','does she like oil painting'],hint:'Does 放句首，likes 要恢复原形。',e:'Does she like oil painting?'},
 {t:'choice',p:'______ Vincent van Gogh use bright colours?',o:['Do','Does','Did','Is'],a:1,e:'问一般事实，主语是第三人称单数，用 Does。'},
 {t:'choice',p:'Ginger ______ to make some art for Grandpa.',o:['want','wants','wanted','wanting'],a:1,e:'Ginger 是第三人称单数，want 变 wants。'},
 {t:'text',p:'改错并写出正确句子：He don’t like this painting.',a:["He doesn't like this painting.",'He does not like this painting.'],hint:'主语是 He，否定助动词要用 doesn’t。',e:"He doesn't like this painting."},
 {t:'reorder',p:'排序组成正确句子。',w:['paintings','the painters’ feelings','show','All'],a:'All paintings show the painters’ feelings.',e:'All paintings + show + the painters’ feelings.'}]},
{id:'past',icon:'⏳',color:'#fff0ec',name:'一般过去时',desc:'动词过去式、was/were、did 后用原形',qs:[
 {t:'match',p:'把动词原形和过去式配对。',pairs:[['make','made'],['paint','painted'],['add','added'],['glue','glued']],e:'make 是不规则变化 made；其余三项是规则变化。'},
 {t:'choice',p:'Xu Beihong ______ a Chinese artist.',o:['is','was','were','did'],a:1,e:'介绍过去的人物，用 was。'},
 {t:'choice',p:'They ______ a beautiful snail yesterday.',o:['make','makes','made','making'],a:2,e:'yesterday 是过去时间，make 的过去式是 made。'},
 {t:'choice',p:'What did they ______?',o:['made','make','making','makes'],a:1,e:'did 后面的动词必须用原形 make。'},
 {t:'text',p:'写出动词过去式：like →',a:['liked'],hint:'以不发音 e 结尾，直接加 d。',e:'like → liked'},
 {t:'text',p:'写出动词过去式：do →',a:['did'],hint:'这是不规则变化。',e:'do → did'},
 {t:'choice',p:'The children ______ happy at the art show.',o:['was','were','did','are'],a:1,e:'children 是复数，过去时用 were。'},
 {t:'text',p:'改错：Did Ginger painted a picture?',a:['Did Ginger paint a picture?','did ginger paint a picture'],hint:'看见 Did 后，要检查后面的动词。',e:'Did Ginger paint a picture?'},
 {t:'reorder',p:'排序组成过去时问句。',w:['learn','did','What','you','from the artist'],a:'What did you learn from the artist?',e:'特殊疑问词 + did + 主语 + 动词原形。'},
 {t:'choice',p:'I ______ the string in a circle and ______ a head and a tail.',o:['glued; added','glue; add','did glued; did added','was glue; was add'],a:0,e:'两个动作都发生在过去：glued，added。'}]},
{id:'continuous',icon:'🖌️',color:'#e8fff7',name:'现在进行时',desc:'am/is/are doing 与 -ing 拼写变化',qs:[
 {t:'choice',p:'Ginger ______ some art now.',o:['makes','made','is making','make'],a:2,e:'now 表示正在发生：is making。'},
 {t:'choice',p:'Look! The children ______ pictures.',o:['are drawing','draw','drew','is drawing'],a:0,e:'Look! 提示动作正在进行；children 是复数，用 are drawing。'},
 {t:'text',p:'写出 -ing 形式：make →',a:['making'],hint:'去掉不发音的 e，再加 ing。',e:'make → making'},
 {t:'text',p:'写出 -ing 形式：run →',a:['running'],hint:'末尾是“辅音+元音+辅音”，需要双写最后一个字母。',e:'run → running'},
 {t:'choice',p:'Mum and Dad ______ for Grandpa’s birthday.',o:['is shopping','are shopping','shoped','was shopping'],a:1,e:'Mum and Dad 是两个人，用 are shopping。'},
 {t:'choice',p:'I ______ a birthday card.',o:['am drawing','is drawing','are drawing','drawing'],a:0,e:'I 后面用 am：I am drawing。'},
 {t:'text',p:'改错：She is cuting coloured paper.',a:['She is cutting coloured paper.','she is cutting coloured paper'],hint:'cut 需要双写 t。',e:'She is cutting coloured paper.'},
 {t:'choice',p:'哪一句表示“他现在正在画画”？',o:['He paints every day.','He painted yesterday.','He is painting now.','He wants to paint.'],a:2,e:'is painting now 是现在进行时。'}]},
{id:'patterns',icon:'🧩',color:'#f2edff',name:'动词搭配',desc:'doing、to do 与本单元常用表达',qs:[
 {t:'choice',p:'Almost everyone enjoys ______ at works of art.',o:['look','looking','to looked','looks'],a:1,e:'enjoy 后面接动词 -ing：enjoy looking。'},
 {t:'choice',p:'Artists try ______ themselves.',o:['express','expressing','to express','expressed'],a:2,e:'try to do：努力/尝试做某事。'},
 {t:'choice',p:'He was good at ______ horses.',o:['paint','painting','to paint','painted'],a:1,e:'be good at 后接名词或动词 -ing。'},
 {t:'choice',p:'I want ______ recycled art.',o:['make','making','to make','made'],a:2,e:'want to do：想要做某事。'},
 {t:'choice',p:'She wants a new ______. 这句话中 want 后为什么没有 to？',o:['因为后面是名词','因为主语是 she','因为是过去时','因为句子是否定句'],a:0,e:'want 后面直接接名词时，不加 to。'},
 {t:'text',p:'补全词组：因使用鲜艳的颜色而出名（be famous ___ using bright colours）',a:['for'],hint:'be famous for...',e:'be famous for using bright colours。'},
 {t:'choice',p:'Artists use old paper ______ recycled art.',o:['make','to make','making','made'],a:1,e:'use something to do：用某物做某事。'},
 {t:'reorder',p:'排序组成正确句子。',w:['happy','Bright colours','people','make'],a:'Bright colours make people happy.',e:'make + 人 + 形容词：使某人感到……。'}]},
{id:'grammar',icon:'🔍',color:'#fff7d8',name:'所有格与反身代词',desc:'’s、s’、people’s 与 themselves',qs:[
 {t:'choice',p:'“画家的情感”（一位画家）应该写：',o:["the painter's feelings","the painters' feelings","the painters feelings","the painter feelings"],a:0,e:"一位画家，在 painter 后加 ’s。"},
 {t:'choice',p:'“画家们的情感”（多位画家）应该写：',o:["the painter's feelings","the painters' feelings","the painters's feelings","the painters feelings"],a:1,e:'复数 painters 已有 s，只在末尾加撇号。'},
 {t:'choice',p:'Artists try to express ______.',o:['them','themselves','ourselves','their'],a:1,e:'主语 Artists 指“他们自己”，用 themselves。'},
 {t:'choice',p:'We made the picture by ______.',o:['ourselves','themselves','us','our'],a:0,e:'主语 We 对应反身代词 ourselves。'},
 {t:'text',p:'用正确形式填写：________ birthday（爷爷的生日）',a:["Grandpa's"],hint:'一个人的所属关系，用 ’s。',e:"Grandpa's birthday。"},
 {t:'choice',p:'“人们的心”应该写：',o:["peoples' hearts","people's hearts","peoples hearts","people heart's"],a:1,e:'people 是不以 s 结尾的复数，所有格是 people’s。'},
 {t:'text',p:'改错：The artists express them through art.',a:['The artists express themselves through art.','the artists express themselves through art'],hint:'“表达他们自己”需要反身代词。',e:'The artists express themselves through art.'},

const $=s=>document.querySelector(s); const state=JSON.parse(localStorage.getItem('unit2ArtState')||'{"done":{},"attempts":0,"correct":0,"wrong":[]}');
let currentModule=0,currentQ=0,moduleCorrect=0,mode='module',answerState=null,attempted=false;
const total=modules.reduce((n,m)=>n+m.qs.length,0); $('#totalTasks').textContent=total;
function save(){localStorage.setItem('unit2ArtState',JSON.stringify(state));updateStats()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function normalize(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.?!。？！]+$/,'').replace(/\s+/g,' ')}
function updateStats(){let done=Object.keys(state.done).length;let pct=Math.round(done/modules.length*100);$('#overallText').textContent=pct+'%';$('#overallBar').style.width=pct+'%';$('#doneStat').textContent=done+'/'+modules.length;$('#paintStat').textContent=done;$('#accuracyStat').textContent=state.attempts?Math.round(state.correct/state.attempts*100)+'%':'—';$('#wrongCount').textContent=state.wrong.length;renderLevels()}
function renderLevels(){const wrap=$('#levels');wrap.innerHTML='';modules.forEach((m,i)=>{let d=state.done[m.id];let card=document.createElement('article');card.className='level-card';card.innerHTML=`<div class="level-top"><span class="level-num">LEVEL ${String(i+1).padStart(2,'0')}</span><span class="level-icon" style="background:${m.color}">${m.icon}</span></div><h3>${m.name}</h3><p>${m.desc}</p><div class="level-foot"><span class="mini-progress">${d?`完成 · ${d.score}/${d.total}`:`${m.qs.length} 个任务`}</span><button class="play">${d?'再练一次':'开始'}</button></div>`;card.querySelector('.play').onclick=()=>startModule(i);wrap.appendChild(card)})}
function show(view){['home','game','result'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==view));scrollTo({top:0,behavior:'smooth'})}
function startModule(i){currentModule=i;currentQ=0;moduleCorrect=0;mode='module';show('game');renderQuestion()}
function startQuick(){const pool=[];modules.slice(0,8).forEach((m,mi)=>m.qs.forEach((q,qi)=>pool.push({mi,qi,q})));pool.sort(()=>Math.random()-.5);window.quickQs=pool.slice(0,18);currentQ=0;moduleCorrect=0;mode='quick';show('game');renderQuestion()}
function getItem(){return mode==='quick'?window.quickQs[currentQ]:{mi:currentModule,qi:currentQ,q:modules[currentModule].qs[currentQ]}}
function speak(text){if(!('speechSynthesis'in window))return toast('当前浏览器暂不支持朗读');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[\u4e00-\u9fff]/g,' '));u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function renderQuestion(){answerState=null;attempted=false;const item=getItem(),q=item.q,m=mode==='quick'?{name:'综合挑战',desc:'随机抽取 18 题'}:modules[currentModule],len=mode==='quick'?window.quickQs.length:m.qs.length;$('#gameName').textContent=m.name;$('#gameDesc').textContent=m.desc;$('#counter').textContent=`${currentQ+1} / ${len}`;$('#qbar').style.width=((currentQ+1)/len*100)+'%';const box=$('#question');box.innerHTML='';const label={choice:'选择题',text:q.open?'自由表达':'填空/改错',reorder:'句子排序',match:'配对题'}[q.t];box.insertAdjacentHTML('beforeend',`<span class="type-label">${label}</span><div class="prompt-row"><h2 class="prompt">${q.p}</h2><button class="speak" aria-label="朗读题目">🔊</button></div>${q.c?`<div class="context passage">${q.c}</div>`:''}`);box.querySelector('.speak').onclick=()=>speak((q.c?q.c+' ':'')+q.p);
 if(q.t==='choice'){const d=document.createElement('div');d.className='options';q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>{if(attempted)return;d.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answerState=i};d.appendChild(b)});box.appendChild(d)}
 if(q.t==='text'){const d=document.createElement('div');d.className='answer-box';d.innerHTML=q.long?'<textarea class="text-answer" placeholder="在这里写下你的短文……"></textarea>':'<input class="text-answer" placeholder="在这里输入答案" autocomplete="off">';box.appendChild(d)}
 if(q.t==='reorder'){answerState=[];const zone=document.createElement('div');zone.className='sentence-zone';zone.innerHTML='<span style="color:#8a849f">点击下面的词语组成句子</span>';const bank=document.createElement('div');bank.className='word-bank';[...q.w].sort(()=>Math.random()-.5).forEach((w,i)=>{const b=document.createElement('button');b.className='word';b.textContent=w;b.dataset.i=i;b.onclick=()=>{if(attempted||b.classList.contains('used'))return;b.classList.add('used');answerState.push({w,b});drawBuilt(zone)}});box.append(zone,bank)}
 if(q.t==='match'){const grid=document.createElement('div');grid.className='match-grid';q.pairs.forEach((pair,i)=>{const row=document.createElement('div');row.className='match-row';const opts=[...q.pairs.map(x=>x[1])].sort(()=>Math.random()-.5);row.innerHTML=`<div class="match-left">${pair[0]}</div><select class="match-select" data-i="${i}"><option value="">请选择中文</option>${opts.map(x=>`<option>${x}</option>`).join('')}</select>`;grid.appendChild(row)});box.appendChild(grid)}
 if(q.hint){const h=document.createElement('div');h.className='hint hidden';h.id='hint';h.textContent='提示：'+q.hint;box.appendChild(h)}
 const feedback=document.createElement('div');feedback.id='feedback';feedback.className='feedback hidden';box.appendChild(feedback);const actions=document.createElement('div');actions.className='game-actions';actions.innerHTML=`<button class="skip">${q.hint?'查看提示':'暂时跳过'}</button><button class="check">检查答案</button>`;box.appendChild(actions);actions.querySelector('.skip').onclick=()=>q.hint?$('#hint').classList.remove('hidden'):nextQuestion();actions.querySelector('.check').onclick=checkAnswer;
}
function drawBuilt(zone){zone.innerHTML='';if(!answerState.length){zone.innerHTML='<span style="color:#8a849f">点击下面的词语组成句子</span>';return}answerState.forEach((x,i)=>{const b=document.createElement('button');b.className='word built-word';b.textContent=x.w;b.onclick=()=>{if(attempted)return;x.b.classList.remove('used');answerState.splice(i,1);drawBuilt(zone)};zone.appendChild(b)})}
function checkAnswer(){if(attempted)return;const item=getItem(),q=item.q;let ok=false,raw='';if(q.t==='choice'){if(answerState===null)return toast('先选择一个答案');ok=answerState===q.a;document.querySelectorAll('.option').forEach((b,i)=>{if(i===q.a)b.classList.add('correct');else if(i===answerState)b.classList.add('wrong')})}
 if(q.t==='text'){raw=$('.text-answer').value.trim();if(!raw)return toast('先写下你的答案');ok=q.open?raw.length>2:q.a.some(a=>normalize(a)===normalize(raw))}
 if(q.t==='reorder'){if(!answerState.length)return toast('先把词语排成句子');raw=answerState.map(x=>x.w).join(' ');ok=normalize(raw)===normalize(q.a)}
 if(q.t==='match'){const sels=[...document.querySelectorAll('.match-select')];if(sels.some(s=>!s.value))return toast('请完成全部配对');ok=sels.every((s,i)=>s.value===q.pairs[i][1]);sels.forEach((s,i)=>{s.style.borderColor=s.value===q.pairs[i][1]?'var(--ok)':'var(--bad)'})}
 attempted=true;state.attempts++;if(ok){state.correct++;moduleCorrect++}else{state.wrong.unshift({module:modules[item.mi].name,p:q.p,e:q.e,at:new Date().toLocaleDateString()});state.wrong=state.wrong.slice(0,40)}save();const f=$('#feedback');f.className='feedback '+(ok?'ok':'bad');f.innerHTML=`<b>${ok?(q.open?'已完成这一小步！':'答对了！'):'再看一看'}</b>${q.e}`;f.classList.remove('hidden');const check=$('.check');check.textContent=currentQ===(mode==='quick'?window.quickQs.length:modules[currentModule].qs.length)-1?'查看结果':'下一题';check.onclick=nextQuestion}
function nextQuestion(){const len=mode==='quick'?window.quickQs.length:modules[currentModule].qs.length;if(currentQ<len-1){currentQ++;renderQuestion()}else finishModule()}
function finishModule(){const totalQ=mode==='quick'?window.quickQs.length:modules[currentModule].qs.length;if(mode==='module'){state.done[modules[currentModule].id]={score:moduleCorrect,total:totalQ};save()}show('result');const pct=Math.round(moduleCorrect/totalQ*100);$('#result').innerHTML=`<div class="result-icon">${pct>=85?'🏆':pct>=60?'🎨':'🌱'}</div><h2>${pct>=85?'这一关掌握得很棒！':pct>=60?'完成啦，再巩固一下':'完成了，错题再练一遍'}</h2><p>${mode==='quick'?'综合挑战':modules[currentModule].name}</p><div class="score-ring" style="--score:${pct*3.6}deg"><b>${pct}%</b></div><p>答对 <b>${moduleCorrect}</b> / ${totalQ} 题</p><div class="result-actions"><button class="primary" id="again">再练一次</button><button class="secondary" id="homeBtn">返回关卡</button></div>`;$('#again').onclick=()=>mode==='quick'?startQuick():startModule(currentModule);$('#homeBtn').onclick=()=>show('home')}
function showWrong(){show('result');const list=state.wrong.length?state.wrong.map((w,i)=>`<details><summary>${i+1}. ${w.module}｜${w.p}</summary><p>${w.e}</p></details>`).join(''):'<p>现在还没有错题，继续保持！</p>';$('#result').innerHTML=`<div class="result-icon">📝</div><h2>我的错题本</h2><p>最多保留最近 40 道错题</p><div class="wrong-list">${list}</div><div class="result-actions"><button class="primary" id="homeBtn">返回关卡</button></div>`;$('#homeBtn').onclick=()=>show('home')}
$('#backBtn').onclick=()=>show('home');$('#wrongBtn').onclick=showWrong;$('#quickBtn').onclick=startQuick;$('#continueBtn').onclick=()=>{const i=modules.findIndex(m=>!state.done[m.id]);startModule(i<0?0:i)};$('#resetBtn').onclick=()=>{if(confirm('确定清除全部学习进度和错题吗？')){localStorage.removeItem('unit2ArtState');location.reload()}};updateStats();
</script>
