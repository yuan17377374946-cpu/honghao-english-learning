<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b46f2">
  <title>前四关综合测评｜Unit 2 艺术英语</title>
  <style>
    :root{--ink:#20243a;--muted:#667085;--purple:#5b46f2;--purple2:#7f6cff;--yellow:#ffd84d;--mint:#4ed6b6;--blue:#55b7ff;--orange:#ff7c66;--paper:#fff;--line:#e3def7;--bg:#f5f3ff;--ok:#178760;--bad:#d64b56;--shadow:0 16px 42px rgba(67,51,150,.15)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(145deg,#f4f0ff,#eef8ff 55%,#fff8dd);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:16px}button,input{font:inherit}.app{max-width:980px;margin:auto;padding:18px 18px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:15px;background:var(--purple);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 8px 18px rgba(91,70,242,.28)}h1{font-size:clamp(1.2rem,3vw,1.75rem);margin:0}.sub{font-size:.88rem;color:var(--muted);margin-top:3px}.home-link{color:var(--purple);background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px;text-decoration:none;font-weight:800}.card{background:rgba(255,255,255,.96);border:1px solid #fff;border-radius:24px;box-shadow:var(--shadow)}.hidden{display:none!important}
    .start{padding:30px}.eyebrow{color:var(--purple);font-weight:900;letter-spacing:.08em;font-size:.8rem}.start h2{font-size:clamp(1.7rem,5vw,2.7rem);line-height:1.12;margin:8px 0 12px}.intro{line-height:1.75;color:var(--muted);max-width:720px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.chip{border-radius:999px;padding:8px 12px;font-weight:800;font-size:.86rem;background:#f0edff;color:#4937c7}.chip:nth-child(2){background:#e8f8ff;color:#1471a7}.chip:nth-child(3){background:#fff0ec;color:#b64b36}.chip:nth-child(4){background:#e8fff7;color:#147559}.rules{border-radius:18px;background:#faf9ff;padding:16px 18px;margin:18px 0;line-height:1.7}.rules b{display:block;margin-bottom:4px}.name-row{display:flex;gap:10px;max-width:520px}.name-input{flex:1;border:2px solid var(--line);border-radius:13px;padding:12px 14px;outline:none}.name-input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(91,70,242,.1)}.primary{border:0;border-radius:13px;background:var(--purple);color:#fff;padding:12px 18px;font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(91,70,242,.22)}.primary:hover{background:#4b37dd}.secondary{border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);padding:11px 16px;font-weight:850;cursor:pointer}
    .exam{overflow:hidden}.exam-head{padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.exam-title b{display:block}.exam-title span{color:var(--muted);font-size:.85rem}.timer{border-radius:12px;padding:9px 12px;background:#f0edff;color:var(--purple);font-weight:950;font-variant-numeric:tabular-nums}.timer.warn{background:#fff0ec;color:#b44235}.progress{height:8px;background:#eeeafa}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--mint));transition:width .25s}.q-wrap{padding:27px 25px 22px}.q-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:13px}.section-tag{display:inline-flex;border-radius:999px;padding:6px 10px;background:#f0edff;color:var(--purple);font-size:.78rem;font-weight:900}.points{font-size:.84rem;color:var(--muted);font-weight:800}.prompt{font-size:clamp(1.13rem,2.8vw,1.45rem);line-height:1.58;margin:0}.context{margin-top:14px;background:#f8f9fc;border-left:5px solid var(--blue);padding:13px 15px;border-radius:10px;white-space:pre-line;line-height:1.75}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px}.option{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;font-weight:760;cursor:pointer;min-height:54px}.option:hover,.option.selected{border-color:var(--purple);background:#f5f2ff}.answer{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 15px;outline:none;margin-top:21px}.answer:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(91,70,242,.1)}.tip{font-size:.85rem;color:var(--muted);margin:8px 2px 0}.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:26px}.nav-right{display:flex;gap:9px}.numbers{padding:16px 20px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:7px}.num{width:33px;height:33px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:850;color:var(--muted);cursor:pointer}.num.done{background:#e9fff7;border-color:#a9e9d5;color:#147359}.num.active{background:var(--purple);border-color:var(--purple);color:#fff}.submit{background:#20243a}.submit:hover{background:#111526}
    .result{padding:30px}.result-top{text-align:center}.result-icon{font-size:3rem}.result h2{font-size:2rem;margin:8px 0}.score{width:145px;height:145px;border-radius:50%;display:grid;place-items:center;margin:18px auto;background:conic-gradient(var(--purple) var(--score),#ece9fa 0);position:relative}.score:after{content:"";position:absolute;inset:13px;background:#fff;border-radius:50%}.score b{position:relative;z-index:1;font-size:2rem}.level{font-weight:850;color:var(--purple)}.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:25px 0}.break-item{background:#f7f6fc;border-radius:15px;padding:13px;text-align:center}.break-item b{display:block;font-size:1.22rem}.break-item span{font-size:.78rem;color:var(--muted)}.wrong-title{margin:25px 0 10px}.wrong-list details{border-top:1px solid var(--line);padding:11px 2px}.wrong-list summary{cursor:pointer;font-weight:850;line-height:1.5}.wrong-list p{line-height:1.65;color:#444b62}.wrong-list .mine{color:var(--bad)}.wrong-list .right{color:var(--ok)}.result-actions{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}
    @media(max-width:650px){.app{padding:12px 10px 34px}.topbar{align-items:flex-start}.sub{display:none}.home-link{padding:8px 10px}.start,.result{padding:22px 17px}.name-row{flex-direction:column}.name-row button{width:100%}.q-wrap{padding:22px 16px 18px}.options{grid-template-columns:1fr}.breakdown{grid-template-columns:1fr 1fr}.nav{align-items:stretch}.nav-right{flex:1}.nav-right button{flex:1}.numbers{padding:14px 16px 18px}.exam-head{padding:14px 16px}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">✓</div><div><h1>前四关综合测评</h1><div class="sub">Unit 2 · Art English · 满分100分</div></div></div>
    <a class="home-link" href="./">返回复习主页</a>
  </header>

  <section id="start" class="start card">
    <div class="eyebrow">UNIT 2 · CHECKPOINT</div>
    <h2>看看你真正掌握了多少</h2>
    <p class="intro">这不是背诵检查。题目会更换说法和语境，重点检查能不能把学过的单词、动词形式和时态真正用起来。</p>
    <div class="chips"><span class="chip">单词和词组 20分</span><span class="chip">一般现在时 20分</span><span class="chip">一般过去时 24分</span><span class="chip">现在进行时 20分</span></div>
    <div class="rules"><b>测评说明</b>共27题，满分100分，限时30分钟。答题过程中不显示答案，交卷后自动显示总分、分项得分和错题分析。</div>
    <div class="name-row"><input id="studentName" class="name-input" placeholder="请输入姓名" maxlength="12"><button id="startBtn" class="primary">开始测评</button></div>
  </section>

  <section id="exam" class="exam card hidden">
    <div class="exam-head"><div class="exam-title"><b id="who">宏仁的综合测评</b><span>请独立完成，不查课本和笔记</span></div><div id="timer" class="timer">30:00</div></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="q-wrap">
      <div class="q-meta"><span id="tag" class="section-tag"></span><span id="points" class="points"></span></div>
      <h2 id="prompt" class="prompt"></h2><div id="context" class="context hidden"></div><div id="answerArea"></div>
      <div class="nav"><button id="prev" class="secondary">上一题</button><div class="nav-right"><button id="next" class="primary">下一题</button><button id="submit" class="primary submit">交卷</button></div></div>
    </div>
    <div id="numbers" class="numbers"></div>
  </section>

  <section id="result" class="result card hidden"></section>
</main>
<script>
const questions=[
 {s:'单词和词组',p:4,t:'choice',q:'Art can be very ______. It can touch people’s hearts.',o:['powerful','lonely','heavy','quiet'],a:0,right:'powerful',e:'powerful 表示“有力量的；有感染力的”。'},
 {s:'单词和词组',p:4,t:'choice',q:'Artists use their works to ______ their feelings.',o:['protect','express','choose','move'],a:1,right:'express',e:'express feelings 表示“表达感受”。'},
 {s:'单词和词组',p:4,t:'choice',q:'Xu Beihong was good at ______.',o:['ink painting','oil painting','paper cutting','recycled art'],a:0,right:'ink painting',e:'徐悲鸿擅长水墨画：be good at ink painting。'},
 {s:'单词和词组',p:4,t:'choice',q:'Vincent van Gogh was famous for using bright ______.',o:['strings','captions','colours','headings'],a:2,right:'colours',e:'bright colours 表示“鲜艳的颜色”。'},
 {s:'单词和词组',p:4,t:'choice',q:'Artists can make recycled art ______ old things.',o:['at','from','to','for'],a:1,right:'from',e:'make ... from ... 表示“用……制成……”。'},

 {s:'一般现在时',p:4,t:'choice',q:'Artists ______ their feelings through art.',o:['shows','show','showed','showing'],a:1,right:'show',e:'主语 Artists 是复数，动词用原形 show。'},
 {s:'一般现在时',p:4,t:'choice',q:'Almost everyone ______ looking at works of art.',o:['enjoy','enjoys','enjoyed','is enjoy'],a:1,right:'enjoys',e:'everyone 看作第三人称单数，使用 enjoys。'},
 {s:'一般现在时',p:4,t:'choice',q:'______ Amy like recycled art?',o:['Do','Does','Did','Is'],a:1,right:'Does',e:'一般现在时中，第三人称单数的一般疑问句用 Does。'},
 {s:'一般现在时',p:4,t:'text',q:'把句子改为一般疑问句：She likes oil painting.',a:['Does she like oil painting'],right:'Does she like oil painting?',e:'Does 放在句首，likes 恢复为原形 like。'},
 {s:'一般现在时',p:4,t:'text',q:'改错：He doesn’t likes this picture.',a:["He doesn't like this picture",'He does not like this picture'],right:"He doesn’t like this picture.",e:'doesn’t 后面的动词必须用原形 like。'},

 {s:'一般过去时',p:4,t:'text',q:'写出过去式：make → ______',a:['made'],right:'made',e:'make 的过去式是不规则变化 made。'},
 {s:'一般过去时',p:4,t:'text',q:'写出过去式：glue → ______',a:['glued'],right:'glued',e:'glue 以 e 结尾，直接加 d。'},
 {s:'一般过去时',p:4,t:'choice',q:'Xu Beihong ______ a Chinese artist.',o:['is','was','were','did'],a:1,right:'was',e:'介绍过去的人物，主语为第三人称单数，用 was。'},
 {s:'一般过去时',p:4,t:'choice',q:'The children ______ happy at the art show yesterday.',o:['was','were','are','did'],a:1,right:'were',e:'children 是复数，过去时用 were。'},
 {s:'一般过去时',p:4,t:'choice',q:'Ginger ______ a beautiful picture last night.',o:['makes','made','making','make'],a:1,right:'made',e:'last night 提示一般过去时，make 变为 made。'},
 {s:'一般过去时',p:4,t:'text',q:'改错：Did Amy painted a flower?',a:['Did Amy paint a flower'],right:'Did Amy paint a flower?',e:'Did 后面的动词必须使用原形 paint。'},

 {s:'现在进行时',p:4,t:'text',q:'写出 -ing 形式：make → ______',a:['making'],right:'making',e:'make 去掉不发音的 e，再加 ing。'},
 {s:'现在进行时',p:4,t:'text',q:'写出 -ing 形式：run → ______',a:['running'],right:'running',e:'run 需要双写最后一个 n，再加 ing。'},
 {s:'现在进行时',p:4,t:'choice',q:'Look! Ginger ______ a birthday card.',o:['makes','made','is making','make'],a:2,right:'is making',e:'Look! 提示动作正在发生，Ginger 后用 is making。'},
 {s:'现在进行时',p:4,t:'choice',q:'The children ______ pictures now.',o:['draw','drew','are drawing','is drawing'],a:2,right:'are drawing',e:'now 提示现在进行时；children 是复数，用 are drawing。'},
 {s:'现在进行时',p:4,t:'text',q:'改错：She is cuting coloured paper.',a:['She is cutting coloured paper'],right:'She is cutting coloured paper.',e:'cut 变为 cutting 时要双写 t。'},

 {s:'时态综合',p:2,t:'choice',q:'Amy usually ______ pictures after school.',o:['paint','paints','painted','is painting'],a:1,right:'paints',e:'usually 表示经常发生，Amy 是第三人称单数，用 paints。'},
 {s:'时态综合',p:2,t:'choice',q:'Yesterday, she ______ a picture of a flower.',o:['paint','paints','painted','is painting'],a:2,right:'painted',e:'Yesterday 提示一般过去时，用 painted。'},
 {s:'时态综合',p:2,t:'choice',q:'Now she ______ the picture to her mother.',o:['shows','showed','is showing','show'],a:2,right:'is showing',e:'Now 提示现在进行时，用 is showing。'},
 {s:'时态综合',p:2,t:'choice',q:'Her mother ______ it very much.',o:['like','likes','liked','is liking'],a:1,right:'likes',e:'描述现在的感受，mother 是第三人称单数，用 likes。'},

 {s:'翻译句子',p:4,t:'text',q:'翻译：艺术家们通过艺术表达自己的感受。',a:['Artists express their feelings through art','Artists show their feelings through art'],right:'Artists express their feelings through art.',e:'注意 Artists 是复数，动词用原形 express。'},
 {s:'翻译句子',p:4,t:'text',q:'翻译：孩子们现在正在用旧物制作再生艺术品。',a:['The children are making recycled art from old things now','Children are making recycled art from old things now'],right:'The children are making recycled art from old things now.',e:'now 提示现在进行时；make ... from ... 表示“用……制成……”。'}
];
const answers=Array(questions.length).fill('');let current=0;let seconds=1800;let timerId=null;let started=false;
const $=s=>document.querySelector(s);function norm(v){return String(v).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.?!。？！]+$/,'').replace(/\s+/g,' ')}
function show(id){['start','exam','result'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));scrollTo({top:0,behavior:'smooth'})}
function renderNumbers(){const box=$('#numbers');box.innerHTML='';questions.forEach((q,i)=>{const b=document.createElement('button');b.className='num'+(answers[i]!==''?' done':'')+(i===current?' active':'');b.textContent=i+1;b.onclick=()=>{saveText();current=i;render()};box.appendChild(b)})}
function render(){const q=questions[current];$('#tag').textContent=q.s;$('#points').textContent=`第 ${current+1} / ${questions.length} 题 · ${q.p}分`;$('#prompt').textContent=q.q;$('#bar').style.width=((current+1)/questions.length*100)+'%';$('#context').classList.add('hidden');const area=$('#answerArea');area.innerHTML='';if(q.t==='choice'){const opts=document.createElement('div');opts.className='options';q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='option'+(answers[current]===i?' selected':'');b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>{answers[current]=i;render()};opts.appendChild(b)});area.appendChild(opts)}else{const input=document.createElement('input');input.className='answer';input.placeholder='请在这里输入完整答案';input.value=answers[current];input.id='textAnswer';input.autocomplete='off';input.oninput=()=>{answers[current]=input.value;renderNumbers()};area.appendChild(input);const tip=document.createElement('div');tip.className='tip';tip.textContent='大小写和句末标点不计分，但单词拼写和动词形式要正确。';area.appendChild(tip)}$('#prev').disabled=current===0;$('#next').classList.toggle('hidden',current===questions.length-1);$('#submit').classList.toggle('hidden',current!==questions.length-1);renderNumbers()}
function saveText(){const el=$('#textAnswer');if(el)answers[current]=el.value}
function startExam(){const name=$('#studentName').value.trim()||'宏仁';$('#who').textContent=name+'的综合测评';started=true;show('exam');render();timerId=setInterval(()=>{seconds--;drawTime();if(seconds<=0){clearInterval(timerId);grade(true)}},1000)}
function drawTime(){const m=Math.floor(seconds/60),s=seconds%60;$('#timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('#timer').classList.toggle('warn',seconds<=300)}
function isCorrect(q,a){if(q.t==='choice')return a===q.a;if(a==='')return false;return q.a.some(x=>norm(x)===norm(a))}
function grade(auto=false){saveText();const blank=answers.filter(x=>x==='').length;if(!auto&&blank&&!confirm(`还有 ${blank} 题没有作答，确定现在交卷吗？`))return;if(!auto&&!blank&&!confirm('确定交卷吗？交卷后会显示成绩和答案。'))return;clearInterval(timerId);let total=0;const stats={};const wrong=[];questions.forEach((q,i)=>{if(!stats[q.s])stats[q.s]={got:0,max:0};stats[q.s].max+=q.p;const ok=isCorrect(q,answers[i]);if(ok){total+=q.p;stats[q.s].got+=q.p}else wrong.push({i,q,a:answers[i]})});const level=total>=90?'掌握扎实，可以继续学习后面的内容':total>=75?'基础基本掌握，错题知识需要再练':total>=60?'会背但运用不够稳定，需要继续巩固':'知识点还比较混乱，建议分开重新复习';const icons=total>=90?'🏆':total>=75?'🎨':total>=60?'🌱':'📚';const cards=Object.entries(stats).map(([k,v])=>`<div class="break-item"><b>${v.got}/${v.max}</b><span>${k}</span></div>`).join('');const wrongHtml=wrong.length?wrong.map(x=>`<details><summary>${x.i+1}. ${x.q.q}</summary><p class="mine">你的答案：${x.a===''?'未作答':x.q.t==='choice'?x.q.o[x.a]:x.a}</p><p class="right">正确答案：${x.q.right}</p><p>${x.q.e}</p></details>`).join(''):'<p style="text-align:center;color:var(--ok);font-weight:850">全部答对，太棒了！</p>';$('#result').innerHTML=`<div class="result-top"><div class="result-icon">${icons}</div><h2>测评完成</h2><div class="score" style="--score:${total*3.6}deg"><b>${total}分</b></div><p class="level">${level}</p><p style="color:var(--muted)">${auto?'时间到，系统已自动交卷。':'用时 '+formatUsed()+'。'} 共答错 ${wrong.length} 题。</p></div><div class="breakdown">${cards}</div><h3 class="wrong-title">错题分析</h3><div class="wrong-list">${wrongHtml}</div><div class="result-actions"><button class="primary" onclick="location.reload()">重新测评</button><a class="secondary" href="./" style="text-decoration:none">返回复习主页</a></div>`;show('result')}
function formatUsed(){const used=1800-seconds;return Math.floor(used/60)+'分'+String(used%60).padStart(2,'0')+'秒'}
$('#startBtn').onclick=startExam;$('#studentName').onkeydown=e=>{if(e.key==='Enter')startExam()};$('#prev').onclick=()=>{saveText();if(current>0){current--;render()}};$('#next').onclick=()=>{saveText();if(current<questions.length-1){current++;render()}};$('#submit').onclick=()=>grade(false);drawTime();
</script>
</body>
</html>
