<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#234d43"><title>宏仁的数学课堂 · 前四单元原卷练习</title><link rel="stylesheet" href="style.css?v=20261026a"></head>
<body>
<header class="topbar"><a class="brand" href="#"><span class="brand-icon">∑</span><span>宏仁的数学课堂<small>六年级上册 · 好卷 BS版</small></span></a><div class="top-actions"><span id="progress" class="progress"></span><button id="focus" class="plain">课堂专注</button></div></header>
<main>
<section class="intro"><div><span class="eyebrow">MATH PRACTICE · 原卷练习</span><h1>把每一道题，<br class="mobile">想明白。</h1><p>前四单元原题、图形与表格，第一单元已支持单题练习与分步讲解。先思考，再逐步展开推导。</p></div><div class="intro-count"><strong>4<span>个单元</span></strong><span>7份单元卷 + 2份综合卷</span><span>原卷第1—18页</span></div></section>
<nav id="units" class="units" aria-label="选择单元"></nav>
<section class="workspace">
<aside id="sidebar"><div class="side-title"><span>本卷题组</span><span id="groupCount"></span></div><div class="filter-row"><select id="type" aria-label="筛选题型"><option value="all">全部题型</option></select><select id="status" aria-label="筛选掌握情况"><option value="all">全部进度</option><option value="review">需复习</option><option value="done">已掌握</option><option value="new">未标记</option></select></div><div id="list"></div><p class="local-note">作答与标记保存在当前浏览器。</p></aside>
<div class="lesson"><div class="paperbar"><div id="papers" class="paper-tabs"></div><button id="catalog" class="plain">题目目录</button></div><div class="lesson-toolbar"><span id="breadcrumb"></span><div><button id="smaller" class="icon" aria-label="缩小题目">−</button><span id="zoomValue">100%</span><button id="bigger" class="icon" aria-label="放大题目">＋</button><button id="source" class="plain">查看原页 ↗</button></div></div>
<article class="question-card"><div class="card-heading"><div><span id="questionType" class="type-badge"></span><h2 id="questionTitle"></h2></div><span id="counter"></span></div><div id="continuation" class="continuation" hidden></div><div class="image-scroll"><div id="questionImage"></div></div><div class="answer-input"><label for="work">我的思路与作答</label><div class="math-keys" aria-label="输入数学符号"></div><textarea id="work" rows="3" placeholder="先说清数量关系，再列式计算。也可以在纸上完成，在这里记下关键步骤。"></textarea><span id="saved">自动保存</span></div><div class="card-actions"><div class="marks"><button id="done">✓ 已掌握</button><button id="review">☆ 需复习</button></div><button id="answerToggle" class="answer-button" aria-expanded="false">展开本卷参考答案</button></div><section id="answers" class="answers" hidden><div class="answer-heading"><div><h3>本卷参考答案与点拨</h3><p>按原卷题号查找；本区包含整份试卷的答案。</p></div><button id="answerHide" class="plain">收起 ×</button></div><div id="answerImages"></div></section></article>
<div id="empty" class="empty" hidden><h2>这里还没有题组</h2><p>可以切换题型或进度筛选。</p><button id="resetFilter">显示本卷全部题组</button></div><div class="bottom-nav"><button id="previous">← 上一题组</button><span id="bottomCounter"></span><button id="next" class="primary">下一题组 →</button></div><footer>题目与参考答案来源：你提供的《好卷数学BS6上》 · 第三单元原卷仅设一份素养培优卷</footer>
</div></section></main>
<dialog id="sourceDialog"><div class="dialog-heading"><strong id="sourceTitle">原卷</strong><button id="sourceClose">关闭 ×</button></div><p>手机可双指放大；题目与页码以原卷为准。</p><div class="source-scroll"><img id="sourceImage" alt="试卷原页"></div></dialog>
<script src="content.js"></script><script src="unit1.js?v=20261026a"></script><script src="app.js?v=20261026a"></script></body></html>
