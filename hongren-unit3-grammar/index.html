<script>
const DATA=[{"name": "can 和 should", "short": "能、会、可以与应该", "color": "#087f65", "words": [["can", "能、会；也可以表示允许", "I can swim. / You can use my pen."], ["should", "应该：给建议", "You should warm up first."], ["can’t / cannot", "不能、不会；有时表示不允许", "I can’t swim."], ["shouldn’t / should not", "不应该：劝别人别这样做", "You shouldn’t run when you are tired."]], "intro": "先看意思，再看结构。can 和 should 放在动作前面；后面的动作都用原形。", "lessons": [{"title": "01 先分清：本领、允许、建议", "rule": "can 可以说“会做”，也可以说“允许做”。should 是“应该”，给建议。看完整的意思，不要只盯一个词。", "examples": [{"en": "I can swim.", "cn": "我会游泳。", "note": "说本领：我有这个能力。", "source": "补充例句"}, {"en": "You can use my pen.", "cn": "你可以用我的笔。", "note": "说允许：我同意你用。", "source": "补充例句"}, {"en": "You should warm up first.", "cn": "你应该先热身。", "note": "说建议：这样做更好、更安全。", "source": "补充例句"}]}, {"title": "02 回课文：can 后面可以连两个动作", "rule": "先认词组 get into the water（进入水中），再认 swim（游泳）。can 管着这两个动作，它们都用原形。", "examples": [{"en": "Finally, you can get into the water and swim.", "cn": "最后，你可以进入水中游泳。", "note": "Finally（最后） / you（主语） / can get into the water and swim（谓语部分）。", "source": "课文原句 · p27"}]}, {"title": "03 不加 to，不加 s", "rule": "记住骨架：谁＋can / should＋动作原形。换成 he 或 she，动作也不加 s。", "examples": [{"en": "We should wear safety equipment when we do sport.", "cn": "我们运动时应该穿戴安全装备。", "note": "We（主语） / should wear（谓语） / safety equipment（宾语）；后面说明“什么时候”。主干是主谓宾。", "source": "课文原句 · p36"}, {"en": "He should wear a helmet.", "cn": "他应该戴头盔。", "note": "He / should wear / a helmet。wear 不加 s，也不加 to。", "source": "补充例句"}, {"en": "She can swim.", "cn": "她会游泳。", "note": "即使主语是 she，can 后仍然是 swim。", "source": "补充例句"}]}, {"title": "04 否定：把 not 放在情态动词后", "rule": "can not 通常写成一个词 cannot，也可以缩成 can’t。should not 可以缩成 shouldn’t。后面的动作仍用原形。", "examples": [{"en": "I can’t swim.", "cn": "我不会游泳。", "note": "I can swim. 加上否定，变成 I can’t swim.", "source": "补充例句"}, {"en": "You shouldn’t run when you are tired.", "cn": "你累的时候不应该跑步。", "note": "shouldn’t 是“不应该”，不是“不会”。", "source": "补充例句"}]}, {"title": "05 提问：把 can / should 搬到前面", "rule": "谁＋can＋动作 → Can＋谁＋动作？不用再加 do / does。should 也一样。", "examples": [{"en": "Can you swim?", "cn": "你会游泳吗？", "note": "Yes, I can. / No, I can’t. 问 you，回答自己的情况用 I。", "source": "补充例句"}, {"en": "Should we wear helmets?", "cn": "我们应该戴头盔吗？", "note": "Yes, we should. / No, we shouldn’t.", "source": "补充例句"}, {"en": "How should we protect ourselves?", "cn": "我们应该怎样保护自己？", "note": "How（怎样）＋should＋we＋protect＋ourselves。它要回答具体方法，不能只回答 Yes。", "source": "课文原句 · 单元主题"}]}, {"title": "06 看懂句子，再自己表达", "rule": "先找“谁”，再选 can / should，最后接动作原形。主语、动作、对象分别是谁或什么？", "examples": [{"en": "We should learn some first aid skills.", "cn": "我们应该学习一些急救技能。", "note": "We（主语） / should learn（谓语） / some first aid skills（宾语）。主谓宾。", "source": "课文原句 · p36"}, {"en": "He can help me.", "cn": "他能帮助我。", "note": "He（谁） / can help（能做什么） / me（帮助谁）。", "source": "补充例句"}]}], "check": [{"type": "choice", "tag": "认词检查", "prompt": "can 在 I can swim. 中是什么意思？", "options": ["会，有这个本领", "应该", "昨天"], "answer": "会，有这个本领", "explain": "can 在这里说能力。", "id": "0-0"}, {"type": "choice", "tag": "认词检查", "prompt": "你想给朋友一个建议：“你应该先热身。”选哪个词？", "options": ["can", "should"], "answer": "should", "explain": "should 表示“应该”。", "id": "0-1"}, {"type": "choice", "tag": "认词检查", "prompt": "shouldn’t 的意思是？", "options": ["不会", "应该", "不应该"], "answer": "不应该", "explain": "should 加 not，意思变成“不应该”。", "id": "0-2"}, {"type": "choice", "tag": "规则检查", "prompt": "He can ___ .", "options": ["swim", "swims", "to swim"], "answer": "swim", "explain": "can 后面用动词原形。", "id": "0-3"}], "questions": [{"type": "choice", "tag": "理解意思", "prompt": "“她会游泳。” She ___ swim.", "options": ["can", "should"], "answer": "can", "explain": "中文说的是本领，所以选 can。", "id": "0-4"}, {"type": "choice", "tag": "理解意思", "prompt": "“我们应该先热身。” We ___ warm up first.", "options": ["can", "should"], "answer": "should", "explain": "中文明确说“应该”，用 should。", "id": "0-5"}, {"type": "choice", "tag": "理解意思", "prompt": "You can use my pen. 这里 can 表示什么？", "options": ["允许你用", "建议你用", "你以前用过"], "answer": "允许你用", "explain": "can 也能表示允许，不只是“会”。", "id": "0-6"}, {"type": "choice", "tag": "理解意思", "prompt": "“你不应该在累的时候跑步。” You ___ run when you are tired.", "options": ["can’t", "shouldn’t", "can"], "answer": "shouldn’t", "explain": "这里是劝别人别这样做，用 shouldn’t。", "id": "0-7"}, {"type": "choice", "tag": "动词原形", "prompt": "He should ___ a helmet.", "options": ["wears", "to wear", "wear"], "answer": "wear", "explain": "should 后接 wear，不加 to，不加 s。", "id": "0-8"}, {"type": "choice", "tag": "动词原形", "prompt": "She can ___ me.", "options": ["help", "helps", "helped"], "answer": "help", "explain": "主语是 she，can 后也用原形 help。", "id": "0-9"}, {"type": "choice", "tag": "动词原形", "prompt": "We shouldn’t ___ here.", "options": ["running", "run", "to run"], "answer": "run", "explain": "否定不改变后面动词的形式，仍用原形。", "id": "0-10"}, {"type": "choice", "tag": "动词原形", "prompt": "You can get into the water and ___.", "options": ["swims", "swimming", "swim"], "answer": "swim", "explain": "can 后连接的两个动作都用原形。", "id": "0-11"}, {"type": "text", "tag": "改否定句", "prompt": "把 I can swim. 改成否定句。", "answer": ["I can't swim.", "I cannot swim."], "explain": "在 can 后加 not，动作 swim 不变。", "hint": "保留 I 和 swim，只改“能不能”。", "id": "0-12"}, {"type": "text", "tag": "改否定句", "prompt": "把 He can help me. 改成否定句。", "answer": ["He can't help me.", "He cannot help me."], "explain": "can’t / cannot 放在 help 前。", "hint": "", "id": "0-13"}, {"type": "text", "tag": "改否定句", "prompt": "把 We should run here. 改成否定句。", "answer": ["We shouldn't run here.", "We should not run here."], "explain": "shouldn’t 表示“不应该”。", "hint": "", "id": "0-14"}, {"type": "text", "tag": "改否定句", "prompt": "把 She should wear this hat. 改成否定句。", "answer": ["She shouldn't wear this hat.", "She should not wear this hat."], "explain": "should 后加 not，wear 不变。", "hint": "", "id": "0-15"}, {"type": "text", "tag": "变疑问句", "prompt": "把 You can swim. 改成一般疑问句。", "answer": ["Can you swim?"], "explain": "把 can 移到 you 前，不要添加 do。", "hint": "", "id": "0-16"}, {"type": "text", "tag": "变疑问句", "prompt": "把 We should wear const KEY='hongren-unit3-grammar-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,?!，。？！]/g,' ').replace(/\s+/g,' ').trim();
let state={records:{},seen:{},last:null};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved?.records&&saved?.seen)state=saved}catch(e){}
let li=0,stage='words',teachIndex=0,position=0,mode='normal',selected=null,tiles=[],hideCN=false;
let cacheQuiz=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('当前浏览器不能保存进度，请保持页面打开。')}}
function toast(t){$('#toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').textContent='',4200)}
function speak(t){if(!('speechSynthesis' in window)){toast('当前设备不支持朗读。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;const voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;u.onerror=()=>toast('朗读暂不可用，可以先看文字。');speechSynthesis.speak(u)}
function audio(t){return `<button class="speak" data-say="${esc(t)}" aria-label="朗读 ${esc(t)}">听发音</button>`}
function wireAudio(){document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say))}
function record(q){return state.records[q.id]}
function nums(l){const records=l.questions.map(record);return {done:records.filter(Boolean).length,first:records.filter(r=>r?.first).length,mastered:records.filter(r=>r?.correct).length,wrong:records.filter(r=>r&&!r.correct).length}}
function home(){stage='home';document.documentElement.style.setProperty('--accent','#087f65');const n=DATA.map(nums),total=n.reduce((a,v)=>a+v.done,0);$('#app').innerHTML=`<div class="flex between"><h2>今天练这四关</h2><span class="pill">72 道练习 · 已完成 ${total}</span></div><div class="homeguide"><span>① 整体认词</span><span>② 看例子、学规则</span><span>③ 不计分小检查</span><span>④ 独立练习</span></div><div class="homegrid">${DATA.map((l,i)=>{const s=n[i];return `<article class="card level" style="--accent:${l.color}"><div class="flex"><span class="number">${i+1}</span><h3 style="margin:0">${esc(l.name)}</h3></div><p class="muted space">${esc(l.short)} · ${l.questions.length}题</p><div class="bar"><span style="width:${s.done/l.questions.length*100}%"></span></div><p class="small">已答 ${s.done}/${l.questions.length} · 首次答对 ${s.first} · 当前掌握 ${s.mastered}</p><div class="flex"><button class="primary enter" data-i="${i}">先学词语</button><button class="resume" data-i="${i}">进入练习</button>${s.wrong?`<button class="wrongbtn" data-i="${i}">复习错题 ${s.wrong}</button>`:''}</div></article>`}).join('')}</div><div class="notice space">四关都可以直接打开。课堂先学懂，再练基础与应用；没有做完的题可以课后继续。</div><details class="teacher"><summary>教师课堂提示与学习记录</summary><p>先在句乐部听写。每关认词时抽查含义，讲例句时让学生指出“谁、动作、对象”。选择题答对后仍要说出句意；改句、排序题检查是否能独立运用。</p><p>72题是一套完整练习，不用一节课做完。错题重练不会覆盖首次成绩；重新练整关会开始新一轮记录。</p><p>${DATA.map((l,i)=>`${i+1}. ${l.name}：首答 ${n[i].first}/${n[i].done}，当前 ${n[i].mastered}/${l.questions.length}。`).join('<br>')}</p><button id="resetAll" class="danger">清空全部学习记录</button></details>`;document.querySelectorAll('.enter').forEach(b=>b.onclick=()=>open(+b.dataset.i,'words'));document.querySelectorAll('.resume').forEach(b=>b.onclick=()=>open(+b.dataset.i,'practice'));document.querySelectorAll('.wrongbtn').forEach(b=>b.onclick=()=>open(+b.dataset.i,'practice','wrong'));$('#resetAll').onclick=()=>{if(confirm('确定清空四关的全部记录？')){state={records:{},seen:{},last:null};save();home()}}}
function open(i,s,m='normal'){li=i;stage=s;mode=m;teachIndex=0;selected=null;tiles=[];cacheQuiz=null;const last=state.last?.[i];position=0;if(s==='practice'&&m==='normal'){const qs=DATA[i].questions;const first=qs.findIndex(q=>!record(q));position=first<0?qs.length:first}render();window.scrollTo({top:0,behavior:'instant'})}
function frame(body){const l=DATA[li];document.documentElement.style.setProperty('--accent',l.color);$('#app').innerHTML=`<div class="flex between"><div class="flex"><span class="number">${li+1}</span><h2 style="margin:0">${esc(l.name)}</h2></div><span class="pill">${l.questions.length}道练习</span></div><nav class="nav" aria-label="关卡学习环节">${[['words','1 先认词'],['teach','2 看例子'],['check','3 小检查'],['practice','4 闯关练习']].map(([s,t])=>`<button data-stage="${s}" class="${stage===s?'active':''}" ${stage===s?'aria-current="step"':''}>${t}</button>`).join('')}</nav>${body}`;document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;mode='normal';position=0;selected=null;tiles=[];cacheQuiz=null;render()});wireAudio()}
function render(){state.last??={};state.last[li]={stage,position};save();if(stage==='words')words();else if(stage==='teach')teach();else if(stage==='check'||stage==='practice')quiz()}
function words(){const l=DATA[li];frame(`<section class="card"><div class="flex between"><h3 style="margin:0">把这一关的词整体认识一遍</h3><button id="toggleCN">${hideCN?'显示中文':'遮住中文，自己说'}</button></div><p class="space">${esc(l.intro)}</p><div class="wordgrid">${l.words.map(([en,cn,s])=>`<div class="word"><div class="flex between"><div class="en">${esc(en)}</div>${audio(en.includes('→')?en.split('→')[1]:en.split('/')[0])}</div><div class="cn ${hideCN?'hide':''}">${esc(cn)}</div><div class="sample">${esc(s)}</div></div>`).join('')}</div><div class="notice space">先读英文，再说中文。遮住中文后还能解释意思，就可以看例句了。</div><div class="pager"><button id="toTeach" class="primary">看例子，学规则</button></div></section>`);$('#toggleCN').onclick=()=>{hideCN=!hideCN;words()};$('#toTeach').onclick=()=>{stage='teach';render()}}
function teach(){const l=DATA[li],t=l.lessons[teachIndex];frame(`<section class="card"><div class="flex between"><span class="pill">讲解 ${teachIndex+1} / ${l.lessons.length}</span><span class="muted">课文原句与补充例句分别标注</span></div><h2 class="space">${esc(t.title)}</h2><div class="notice">${esc(t.rule)}</div>${t.examples.map(e=>`<article class="example"><div class="flex between"><span class="source">${esc(e.source)}</span>${audio(e.en)}</div><div class="en space">${esc(e.en)}</div><div>${esc(e.cn)}</div><div class="note">${esc(e.note)}</div></article>`).join('')}<details class="teacher"><summary>老师怎么检查理解</summary><p>先问“这几个词是什么意思？”再问“谁在做？动作是什么？涉及谁或什么？”让学生解释本页例句，再口头换一个主语或情境说一句。</p></details><div class="pager"><button id="prevTeach" ${teachIndex===0?'disabled':''}>上一组例子</button><button id="nextTeach" class="primary">${teachIndex===l.lessons.length-1?'做不计分小检查':'下一组例子'}</button></div></section>`);$('#prevTeach').onclick=()=>{teachIndex--;teach()};$('#nextTeach').onclick=()=>{if(teachIndex<l.lessons.length-1){teachIndex++;teach()}else{stage='check';position=0;cacheQuiz=null;render()}window.scrollTo({top:0,behavior:'instant'})}}
function listQuiz(){if(!cacheQuiz){const l=DATA[li];cacheQuiz=stage==='check'?l.check:mode==='wrong'?l.questions.filter(q=>record(q)&&!record(q).correct):l.questions;if(mode==='wrong')cacheQuiz.forEach(q=>delete q._submitted)}return cacheQuiz}
function quiz(){const list=listQuiz();if(!list.length||position>=list.length){result(list);return}const q=list[position];let r=record(q);
if(mode==='wrong')r=q._submitted?record(q):null;
const submitted=!!r;const currentAnswer=r?.value;const answered=list.filter(x=>record(x)).length;
let controls='';if(q.type==='choice'){controls=`<div class="options">${q.options.map((o,i)=>`<button class="option ${(!submitted&&selected===i)||(submitted&&currentAnswer===o)?'selected':''}" data-choice="${i}" ${submitted?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`}else if(q.type==='text'){controls=`<label class="small" for="answerInput">${q.prompt.includes('只填')?'输入单词':'输入完整英文句子（大小写和句末标点不影响评分）'}</label><textarea id="answerInput" class="answerbox" spellcheck="false" autocapitalize="off" ${submitted?'disabled':''} placeholder="${q.prompt.includes('只填')?'写出连接词':'在这里写英文…'}">${submitted?esc(currentAnswer):''}</textarea>${q.hint?`<details><summary>需要一点提示</summary><p>${esc(q.hint)}</p></details>`:''}`}else{controls=`<p class="muted">依次点击词块或步骤；点击上方已选的块可撤回。</p><div class="assembly" aria-label="已排好的答案">${submitted?`<div class="en">${esc(currentAnswer)}</div>`:tiles.length?tiles.map((idx,j)=>`<button data-remove="${j}">${esc(q.tokens[idx])}</button>`).join(''):'<span class="muted">答案会排在这里</span>'}</div><div class="tokenbank">${q.tokens.map((t,i)=>`<button data-token="${i}" ${submitted||tiles.includes(i)?'disabled':''}>${esc(t)}</button>`).join('')}</div>`}
const correctLabel=q.type==='text'?q.answer.join(' / '):q.answer;
const fb=submitted?`<div class="feedback ${r.correct?'ok':'bad'}" role="status"><strong>${r.correct?'答对了，读出完整意思。':'先看清楚原因，再练一遍。'}</strong><p class="space"><b>参考答案：</b>${esc(correctLabel)}</p><p>${esc(q.explain)}</p></div>`:'';
frame(`<section class="card"><div class="flex between"><span class="pill">${stage==='check'?'不计分检查':mode==='wrong'?'错题重练':'正式练习'} · ${position+1}/${list.length}</span><span class="muted">${esc(q.tag)}</span></div><div class="bar"><span style="width:${(position+1)/list.length*100}%"></span></div><div class="prompt">${esc(q.prompt)}</div>${controls}${fb}<div class="pager"><button id="prevQ" ${position===0?'disabled':''}>上一题</button>${submitted?`<button id="nextQ" class="primary">${position===list.length-1?'查看本关结果':'下一题'}</button>`:'<button id="submit" class="primary">确认答案</button>'}</div><div class="questiondots" aria-label="练习进度">${list.map((x,i)=>`<span class="dot ${record(x)?record(x).correct?'good':'wrong':''} ${position===i?'current':''}"></span>`).join('')}</div><details class="teacher"><summary>课堂提示</summary><p>选择后请学生解释意思。若答错，先让他指出是哪一个词或结构不理解，再看讲解。错题重练保留首次成绩。</p></details></section>`);
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=+b.dataset.choice;quiz()});document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{tiles.push(+b.dataset.token);quiz()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{tiles.splice(+b.dataset.remove,1);quiz()});$('#prevQ').onclick=()=>{position--;selected=null;tiles=[];render()};if($('#nextQ'))$('#nextQ').onclick=()=>{position++;selected=null;tiles=[];render();window.scrollTo({top:0,behavior:'instant'})};if($('#submit'))$('#submit').onclick=()=>{let value;if(q.type==='choice'){if(selected===null){toast('先选一个答案。');return}value=q.options[selected]}else if(q.type==='order'){if(tiles.length!==q.tokens.length){toast('请把所有词块或步骤排完整。');return}value=tiles.map(i=>q.tokens[i]).join(' ')}else{value=$('#answerInput').value.trim();if(!value){toast('先写下你的答案。');return}}const accepted=q.type==='text'?q.answer:[q.answer],correct=accepted.some(a=>norm(a)===norm(value));const old=record(q);state.records[q.id]={value,correct,first:old?old.first:correct,attempts:(old?.attempts||0)+1};if(mode==='wrong')q._submitted=true;save();quiz()}}
function result(list){const l=DATA[li];const checks=stage==='check';const complete=list.every(q=>record(q));const right=list.filter(q=>record(q)?.correct).length;const n=nums(l);const wrong=(checks?list:l.questions).filter(q=>record(q)&&!record(q).correct);frame(`<section class="card"><span class="pill">${checks?'认词与规则检查':'本关学习记录'}</span><h2 class="space">${complete?'这一轮完成了':'还有题目等你完成'}</h2><div class="resultgrid"><div><div class="score">${checks?right:n.first}<span style="font-size:22px;color:var(--muted)"> / ${checks?list.length:n.done}</span></div><div>${checks?'当前答对':'首次答对 / 已答题数'}</div></div><div><div class="score">${checks?wrong.length:n.mastered}<span style="font-size:22px;color:var(--muted)">${checks?'题':' / '+l.questions.length}</span></div><div>${checks?'需要再理解':'当前掌握（含重练后答对）'}</div></div></div><p>${checks?'能选对也能说清楚意思，就可以进入正式练习。':`已答 ${n.done}/${l.questions.length}；还需巩固 ${n.wrong}题。分数之外，也要能解释句意、自己组成句子。`}</p><div class="flex">${checks?'<button id="practiceNext" class="primary">进入正式练习</button>':''}${wrong.length?'<button id="retryWrong" class="primary">重练本关错题</button>':''}<button id="restart">${checks?'再做一次小检查':'新一轮练整关'}</button><button id="homeResult">回四关总览</button></div>${wrong.length?`<h3 class="space">先看错因，再去重练</h3>${wrong.map(q=>{const r=record(q);return `<article class="review"><span class="pill">${esc(q.tag)}</span><p class="space"><b>题目：</b>${esc(q.prompt)}</p><p><b>你的答案：</b>${esc(r.value)}</p><p><b>参考答案：</b>${esc(q.type==='text'?q.answer.join(' / '):q.answer)}</p><p><b>怎么改：</b>${esc(q.explain)}</p></article>`}).join('')}`:'<div class="notice space">本轮已答题目都答对了。再口头换一个句子试试，看看能不能独立说出来。</div>'}</section>`);if($('#practiceNext'))$('#practiceNext').onclick=()=>open(li,'practice');$('#homeResult').onclick=home;$('#restart').onclick=()=>{if(!confirm('开始新一轮会清除这一环节的答题记录，确定吗？'))return;for(const q of checks?l.check:l.questions){delete state.records[q.id];delete q._submitted}save();open(li,checks?'check':'practice')};if($('#retryWrong'))$('#retryWrong').onclick=()=>{if(checks){for(const q of wrong)delete state.records[q.id];open(li,'check')}else{for(const q of l.questions)delete q._submitted;open(li,'practice','wrong')}}}
$('#homeBtn').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();home()};home();
</script></body></html>
