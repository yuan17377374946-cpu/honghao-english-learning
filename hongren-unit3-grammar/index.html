<script>
const DATA=[{"name": "can 和 should", "short": "能、会、可以与应该", "color": "#2557b9", "words": [["can", "能、会；也可以表示允许", "I can swim. / You can use my pen."], ["should", "应该：给建议", "You should warm up first."], ["can’t / cannot", "不能、不会；有时表示不允许", "I can’t swim."], ["shouldn’t / should not", "不应该：劝别人别这样做", "You shouldn’t run when you are tired."]], "intro": "先看意思，再看结构。can 和 should 放在动作前面；后面的动作都用原形。", "lessons": [{"title": "01 先分清：本领、允许、建议", "rule": "can 可以说“会做”，也可以说“允许做”。should 是“应该”，给建议。看完整的意思，不要只盯一个词。", "examples": [{"en": "I can swim.", "cn": "我会游泳。", "note": "说本领：我有这个能力。", "source": "补充例句"}, {"en": "You can use my pen.", "cn": "你可以用我的笔。", "note": "说允许：我同意你用。", "source": "补充例句"}, {"en": "You should warm up first.", "cn": "你应该先热身。", "note": "说建议：这样做更好、更安全。", "source": "补充例句"}]}, {"title": "02 回课文：can 后面可以连两个动作", "rule": "先认词组 get into the water（进入水中），再认 swim（游泳）。can 管着这两个动作，它们都用原形。", "examples": [{"en": "Finally, you can get into the water and swim.", "cn": "最后，你可以进入水中游泳。", "note": "Finally（最后） / you（主语） / can get into the water and swim（谓语部分）。", "source": "课文原句 · p27"}]}, {"title": "03 不加 to，不加 s", "rule": "记住骨架：谁＋can / should＋动作原形。换成 he 或 she，动作也不加 s。", "examples": [{"en": "We should wear safety equipment when we do sport.", "cn": "我们运动时应该穿戴安全装备。", "note": "We（主语） / should wear（谓语） / safety equipment（宾语）；后面说明“什么时候”。主干是主谓宾。", "source": "课文原句 · p36"}, {"en": "He should wear a helmet.", "cn": "他应该戴头盔。", "note": "He / should wear / a helmet。wear 不加 s，也不加 to。", "source": "补充例句"}, {"en": "She can swim.", "cn": "她会游泳。", "note": "即使主语是 she，can 后仍然是 swim。", "source": "补充例句"}]}, {"title": "04 否定：把 not 放在情态动词后", "rule": "can not 通常写成一个词 cannot，也可以缩成 can’t。should not 可以缩成 shouldn’t。后面的动作仍用原形。", "examples": [{"en": "I can’t swim.", "cn": "我不会游泳。", "note": "I can swim. 加上否定，变成 I can’t swim.", "source": "补充例句"}, {"en": "You shouldn’t run when you are tired.", "cn": "你累的时候不应该跑步。", "note": "shouldn’t 是“不应该”，不是“不会”。", "source": "补充例句"}]}, {"title": "05 提问：把 can / should 搬到前面", "rule": "谁＋can＋动作 → Can＋谁＋动作？不用再加 do / does。should 也一样。", "examples": [{"en": "Can you swim?", "cn": "你会游泳吗？", "note": "Yes, I can. / No, I can’t. 问 you，回答自己的情况用 I。", "source": "补充例句"}, {"en": "Should we wear helmets?", "cn": "我们应该戴头盔吗？", "note": "Yes, we should. / No, we shouldn’t.", "source": "补充例句"}, {"en": "How should we protect ourselves?", "cn": "我们应该怎样保护自己？", "note": "How（怎样）＋should＋we＋protect＋ourselves。它要回答具体方法，不能只回答 Yes。", "source": "课文原句 · 单元主题"}]}, {"title": "06 看懂句子，再自己表达", "rule": "先找“谁”，再选 can / should，最后接动作原形。主语、动作、对象分别是谁或什么？", "examples": [{"en": "We should learn some first aid skills.", "cn": "我们应该学习一些急救技能。", "note": "We（主语） / should learn（谓语） / some first aid skills（宾语）。主谓宾。", "source": "课文原句 · p36"}, {"en": "He can help me.", "cn": "他能帮助我。", "note": "He（谁） / can help（能做什么） / me（帮助谁）。", "source": "补充例句"}]}], "check": [{"type": "choice", "tag": "认词检查", "prompt": "can 在 I can swim. 中是什么意思？", "options": ["会，有这个本领", "应该", "昨天"], "answer": "会，有这个本领", "explain": "can 在这里说能力。", "id": "0-0"}, {"type": "choice", "tag": "认词检查", "prompt": "你想给朋友一个建议：“你应该先热身。”选哪个词？", "options": ["can", "should"], "answer": "should", "explain": "should 表示“应该”。", "id": "0-1"}, {"type": "choice", "tag": "认词检查", "prompt": "shouldn’t 的意思是？", "options": ["不会", "应该", "不应该"], "answer": "不应该", "explain": "should 加 not，意思变成“不应该”。", "id": "0-2"}, {"type": "choice", "tag": "规则检查", "prompt": "He can ___ .", "options": ["swim", "swims", "to swim"], "answer": "swim", "explain": "can 后面用动词原形。", "id": "0-3"}], "questions": [{"type": "choice", "tag": "理解意思", "prompt": "“她会游泳。” She ___ swim.", "options": ["can", "should"], "answer": "can", "explain": "中文说的是本领，所以选 can。", "id": "0-4"}, {"type": "choice", "tag": "理解意思", "prompt": "“我们应该先热身。” We ___ warm up first.", "options": ["can", "should"], "answer": "should", "explain": "中文明确说“应该”，用 should。", "id": "0-5"}, {"type": "choice", "tag": "理解意思", "prompt": "You can use my pen. 这里 can 表示什么？", "options": ["允许你用", "建议你用", "你以前用过"], "answer": "允许你用", "explain": "can 也能表示允许，不只是“会”。", "id": "0-6"}, {"type": "choice", "tag": "理解意思", "prompt": "“你不应该在累的时候跑步。” You ___ run when you are tired.", "options": ["can’t", "shouldn’t", "can"], "answer": "shouldn’t", "explain": "这里是劝别人别这样做，用 shouldn’t。", "id": "0-7"}, {"type": "choice", "tag": "动词原形", "prompt": "He should ___ a helmet.", "options": ["wears", "to wear", "wear"], "answer": "wear", "explain": "should 后接 wear，不加 to，不加 s。", "id": "0-8"}, {"type": "choice", "tag": "动词原形", "prompt": "She can ___ me.", "options": ["help", "helps", "helped"], "answer": "help", "explain": "主语是 she，can 后也用原形 help。", "id": "0-9"}, {"type": "choice", "tag": "动词原形", "prompt": "We shouldn’t ___ here.", "options": ["running", "run", "to run"], "answer": "run", "explain": "否定不改变后面动词的形式，仍用原形。", "id": "0-10"}, {"type": "choice", "tag": "动词原形", "prompt": "You can get into the water and ___.", "options": ["swims", "swimming", "swim"], "answer": "swim", "explain": "can 后连接的两个动作都用原形。", "id": "0-11"}, {"type": "text", "tag": "改否定句", "prompt": "把 I can swim. 改成否定句。", "answer": ["I can't swim.", "I cannot swim."], "explain": "在 can 后加 not，动作 swim 不变。", "hint": "保留 I 和 swim，只改“能不能”。", "id": "0-12"}, {"type": "text", "tag": "改否定句", "prompt": "把 He can help me. 改成否定句。", "answer": ["He can't help me.", "He cannot help me."], "explain": "can’t / cannot 放在 help 前。", "hint": "", "id": "0-13"}, {"type": "text", "tag": "改否定句", "prompt": "把 We should run here. 改成否定句。", "answer": ["We shouldn't run here.", "We should not run here."], "explain": "shouldn’t 表示“不应该”。", "hint": "", "id": "0-14"}, {"type": "text", "tag": "改否定句", "prompt": "把 She should wear this hat. 改成否定句。", "answer": ["She shouldn't wear this hat.", "She should not wear this hat."], "explain": "should 后加 not，wear 不变。", "hint": "", "id": "0-15"}, {"type": "text", "tag": "变疑问句", "prompt": "把 You can swim. 改成一般疑问句。", "answer": ["Can you swim?"], "explain": "把 can 移到 you 前，不要添加 do。", "hint": "", "id": "0-16"}, {"type": "text", "tag": "变疑问句", "prompt": "把 We should wear helmets. 改成一般疑问句。", "answer": ["Should we wear helmets?"], "explain": "should 放到 we 前面。", "hint": "", "id": "0-17"}, {"type": "choice", "tag": "简短回答", "prompt": "Can she swim? 用肯定回答。", "options": ["Yes, she can.", "Yes, she does.", "Yes, I can."], "answer": "Yes, she can.", "explain": "问 can she，答 she can。", "id": "0-18"}, {"type": "choice", "tag": "简短回答", "prompt": "Should we run here? 用否定回答。", "options": ["No, we can't.", "No, we shouldn't.", "No, we don’t."], "answer": "No, we shouldn't.", "explain": "问 should，答 shouldn’t；主语保持 we。", "id": "0-19"}, {"type": "order", "tag": "组成句子", "prompt": "组成“他会游泳”。", "tokens": ["swim.", "can", "He"], "answer": "He can swim.", "explain": "谁＋can＋动作原形。", "id": "0-20"}, {"type": "order", "tag": "组成句子", "prompt": "组成“我们应该先热身”。", "tokens": ["first.", "warm up", "We", "should"], "answer": "We should warm up first.", "explain": "先找到主语 We，再放 should 和 warm up。", "id": "0-21"}, {"type": "order", "tag": "组成句子", "prompt": "组成“你会帮助她吗？”", "tokens": ["her?", "help", "you", "Can"], "answer": "Can you help her?", "explain": "Can＋主语＋动作＋对象？", "id": "0-22"}, {"type": "text", "tag": "找错改正", "prompt": "整句改正：He can swims.", "answer": ["He can swim."], "explain": "can 后的 swims 去掉 s，变成 swim。", "hint": "", "id": "0-23"}, {"type": "text", "tag": "找错改正", "prompt": "整句改正：She should to wear a helmet.", "answer": ["She should wear a helmet."], "explain": "should 后不加 to。", "hint": "", "id": "0-24"}, {"type": "text", "tag": "找错改正", "prompt": "整句改正：Does he can help you?", "answer": ["Can he help you?"], "explain": "can 自己可以提问，不需要 does。", "hint": "", "id": "0-25"}]}, {"name": "谁的“自己”", "short": "认识全部反身代词", "color": "#2c8164", "words": [["I → myself", "我 → 我自己", "I protect myself."], ["you → yourself", "你 → 你自己", "You protect yourself."], ["he → himself", "他 → 他自己", "He protects himself."], ["she → herself", "她 → 她自己", "She protects herself."], ["it → itself", "它 → 它自己", "The cat cleans itself."], ["we → ourselves", "我们 → 我们自己", "We protect ourselves."], ["you → yourselves", "你们 → 你们自己", "You two protect yourselves."], ["they → themselves", "他们 / 她们 / 它们 → 自己", "They protect themselves."]], "intro": "反身代词就是“自己”。先找出这个“自己”指谁，再选择对应的词；不要看到主语就机械地填。", "lessons": [{"title": "01 做动作的人，也是动作涉及的人", "rule": "I hurt myself. 是“我弄伤了我自己”。I 和 myself 指同一个人。I hurt him. 则是“我弄伤了他”，是两个人。", "examples": [{"en": "I hurt myself.", "cn": "我弄伤了我自己。", "note": "I（主语） / hurt（谓语） / myself（宾语）。主谓宾。", "source": "补充例句"}, {"en": "I hurt him.", "cn": "我弄伤了他。", "note": "him 是他，myself 是我自己，意思不同。", "source": "补充例句"}]}, {"title": "02 同一个人，换不同的“自己”", "rule": "把“我”换成“他”，我自己也要换成他自己。在有 should 的句子里，protect 一直用原形。", "examples": [{"en": "I should protect myself.", "cn": "我应该保护我自己。", "note": "I 对应 myself。", "source": "补充例句"}, {"en": "He should protect himself.", "cn": "他应该保护他自己。", "note": "He 对应 himself；should 后的 protect 不加 s。", "source": "补充例句"}, {"en": "She should protect herself.", "cn": "她应该保护她自己。", "note": "She 对应 herself。", "source": "补充例句"}]}, {"title": "03 回课文：我们保护我们自己", "rule": "先认 protect（保护）和 ourselves（我们自己）。单元主题里的 we 和 ourselves 指同一群人。", "examples": [{"en": "How should we protect ourselves?", "cn": "我们应该怎样保护自己？", "note": "还原主干：We should protect ourselves. 主语 We，谓语 should protect，宾语 ourselves。", "source": "课文原句 · 单元主题"}, {"en": "They should protect themselves.", "cn": "他们应该保护他们自己。", "note": "we 换成 they，ourselves 跟着换成 themselves。", "source": "补充例句"}]}, {"title": "04 一个“你”和一群“你们”", "rule": "you 既能说“你”，也能说“你们”。只有一个人用 yourself；两个人或更多人用 yourselves。单数常见 self，复数是 selves。", "examples": [{"en": "Tom, protect yourself.", "cn": "汤姆，保护好你自己。", "note": "只对汤姆一个人说话。", "source": "补充例句"}, {"en": "Tom and Lily, protect yourselves.", "cn": "汤姆和莉莉，保护好你们自己。", "note": "对两个人说话，要用 yourselves。", "source": "补充例句"}, {"en": "The cat cleans itself.", "cn": "这只猫清洁它自己。", "note": "一只猫，用 itself。", "source": "补充例句"}]}, {"title": "05 先判断是“自己”，还是别人", "rule": "不是每句有 he 就一定用 himself。要看动作涉及的人是不是他自己。", "examples": [{"en": "He hurt himself.", "cn": "他弄伤了他自己。", "note": "做动作的和受伤的是同一个人。", "source": "补充例句"}, {"en": "He hurt me.", "cn": "他弄伤了我。", "note": "一个是他，一个是我。", "source": "补充例句"}, {"en": "We should help them.", "cn": "我们应该帮助他们。", "note": "我们帮助别人，这里不是 ourselves。", "source": "补充例句"}]}], "check": [{"type": "choice", "tag": "认词检查", "prompt": "“它自己”是哪一个？", "options": ["itself", "himself", "themselves"], "answer": "itself", "explain": "it 对应 itself。", "id": "1-0"}, {"type": "choice", "tag": "认词检查", "prompt": "“你们自己”是哪一个？", "options": ["yourself", "yourselves", "ourselves"], "answer": "yourselves", "explain": "多个“你”要用 yourselves。", "id": "1-1"}, {"type": "choice", "tag": "理解检查", "prompt": "He hurt me. 受伤的是谁？", "options": ["我", "他自己"], "answer": "我", "explain": "me 指我，不是他自己。", "id": "1-2"}, {"type": "choice", "tag": "理解检查", "prompt": "We protect ourselves. 中 ourselves 指谁？", "options": ["我们自己", "他们", "我自己"], "answer": "我们自己", "explain": "we 和 ourselves 指同一群人。", "id": "1-3"}], "questions": [{"type": "choice", "tag": "认识对应", "prompt": "“我自己”选哪个？", "options": ["me", "myself", "himself"], "answer": "myself", "explain": "myself 是我自己，me 只是我。", "id": "1-4"}, {"type": "choice", "tag": "认识对应", "prompt": "“她自己”选哪个？", "options": ["himself", "itself", "herself"], "answer": "herself", "explain": "she 对应 herself。", "id": "1-5"}, {"type": "choice", "tag": "认识对应", "prompt": "“它自己”选哪个？", "options": ["itself", "themselves", "ourselves"], "answer": "itself", "explain": "it 对应 itself。", "id": "1-6"}, {"type": "choice", "tag": "认识对应", "prompt": "“你们自己”选哪个？", "options": ["yourself", "yourselves", "themselves"], "answer": "yourselves", "explain": "you 指多人时，对应 yourselves。", "id": "1-7"}, {"type": "choice", "tag": "理解句意", "prompt": "He hurt himself. 的意思是？", "options": ["他弄伤了我", "我弄伤了他", "他弄伤了他自己"], "answer": "他弄伤了他自己", "explain": "he 和 himself 指同一个人。", "id": "1-8"}, {"type": "choice", "tag": "理解句意", "prompt": "He hurt me. 的意思是？", "options": ["他弄伤了我", "他弄伤了他自己", "我弄伤了我自己"], "answer": "他弄伤了我", "explain": "me 是我，和 he 不同。", "id": "1-9"}, {"type": "choice", "tag": "理解句意", "prompt": "We should protect  <div class="dashboard"><div class="stat-card"><span class="stat-icon">${icon('flag')}</span><div><div class="stat-value">${cleared}<small> / 4</small></div><div class="stat-label">已练熟的星球</div></div></div><div class="stat-card"><span class="stat-icon">${icon('rocket')}</span><div><div class="stat-value">${total}<small> / 72</small></div><div class="stat-label">已完成的练习</div></div></div><div class="stat-card badge-stat"><div><div class="stat-value" style="font-size:17px">我的探险徽章</div><div class="stat-label">练熟一关，点亮一枚</div></div><div class="badge-row">${MISSIONS.slice(0,4).map((m,i)=>`<span class="mini-badge ${n[i].mastered===CORE[i].questions.length?'earned':''}" title="${esc(m.name)}${n[i].mastered===CORE[i].questions.length?'：已获得':'：本关全部练熟后获得'}" aria-label="${esc(m.name)}，${n[i].mastered===CORE[i].questions.length?'已获得':'未获得'}">${m.symbol}</span>`).join('')}</div></div></div>
 <section class="card diagnostic-entry"><div class="flex between"><div><div class="mission-no">特别任务 / 昨天的七句背诵</div><h2 style="margin:0;font-size:24px">七句背诵检测</h2><p class="muted" style="margin:7px 0 0">p26 · B Read and complete　｜　p27 · C Read and order</p><p class="small" style="margin:7px 0 0">20 道选择题：词组 7 题 · 句意 7 题 · 运用 6 题。先独立作答，结束后看答案。</p></div><div class="diagnostic-actions"><span class="pill">已答 ${nums(TEST).done}/20</span><button id="sentenceTestBtn" class="primary">${nums(TEST).done===20?'查看检测结果':nums(TEST).done?'继续检测 →':'开始检测 →'}</button>${nums(TEST).wrong&&nums(TEST).done===20?`<button id="sentenceWrongBtn">再练错题 ${nums(TEST).wrong}</button>`:''}</div></div></section>
 <div class="section-head"><div><h2>选择你的下一站</h2><p>四关都可以直接打开，按课堂进度慢慢练。</p></div><span class="map-caption">MISSION MAP / 01—04</span></div><div class="homeguide"><span>① 整体认词</span><span>② 看例子、学规则</span><span>③ 不计分小检查</span><span>④ 独立练习</span></div>
 <div class="homegrid">${CORE.map((l,i)=>{const v=n[i],m=MISSIONS[i],won=v.mastered===l.questions.length;return `<article class="card level" style="--accent:${l.color};--planet-pale:${m.pale}"><div class="planet-head"><div><div class="mission-no">${esc(m.planet)}</div><h3>${esc(l.name)}</h3><p class="muted">${esc(l.short)}</p></div>${planet(i)}</div><div class="mission-status"><span>练习进度 · ${v.done}/${l.questions.length}</span><b>${won?'★ 徽章已点亮':v.done?'探索进行中':'等待出发'}</b></div><div class="bar"><span style="width:${v.done/l.questions.length*100}%"></span></div><p class="small">首次答对 ${v.first} 题 · 当前掌握 ${v.mastered} 题</p><div class="flex"><button class="primary enter" data-i="${i}">先学词语 →</button><button class="resume" data-i="${i}">进入练习</button>${v.wrong?`<button class="wrongbtn" data-i="${i}">再练错题 · ${v.wrong} 题</button>`:''}</div></article>`}).join('')}</div>
 <div class="mission-help">${robot()}<div><strong>小助手提醒：学懂，比冲得快更重要。</strong><p>单词听写先在句乐部完成。每关先说清楚意思，再自己造句；没做完的题，下次可以继续。</p></div></div>
 <details class="teacher"><summary>教师课堂提示与学习记录</summary><p>先在句乐部听写。每关认词时抽查含义，讲例句时让学生指出“谁、动作、对象”。选择题答对后仍要说出句意；改句、排序题检查是否能独立运用。</p><p>72题是一套完整练习，不用一节课做完。错题重练不会覆盖首次成绩；重新练整关会开始新一轮记录。全部题目练熟后获得本关徽章，重新练整关时徽章也会重新计算。</p><p>${CORE.map((l,i)=>`${i+1}. ${l.name}：首答 ${n[i].first}/${n[i].done}，当前 ${n[i].mastered}/${l.questions.length}。`).join('<br>')}</p><button id="resetAll" class="danger">清空全部学习记录</button></details>`;
 $('#sentenceTestBtn').onclick=()=>open(4,'practice');if($('#sentenceWrongBtn'))$('#sentenceWrongBtn').onclick=()=>open(4,'practice','wrong');document.querySelectorAll('.enter').forEach(b=>b.onclick=()=>open(+b.dataset.i,'words'));document.querySelectorAll('.resume').forEach(b=>b.onclick=()=>open(+b.dataset.i,'practice'));document.querySelectorAll('.wrongbtn').forEach(b=>b.onclick=()=>open(+b.dataset.i,'practice','wrong'));$('#resetAll').onclick=()=>{if(confirm('确定清空四关的全部记录？')){state={records:{},seen:{},last:null};save();home()}}
}
function open(i,s,m='normal'){li=i;stage=s;mode=m;teachIndex=0;selected=null;tiles=[];cacheQuiz=null;const last=state.last?.[i];position=0;if(s==='practice'&&m==='normal'){const qs=DATA[i].questions;const first=qs.findIndex(q=>!record(q));position=first<0?qs.length:first}render();window.scrollTo({top:0,behavior:'instant'})}
function frame(body){const l=DATA[li];document.documentElement.style.setProperty('--accent',l.color);$('#app').innerHTML=`<div class="level-heading"><div class="level-title">${planet(li===4?0:li)}<div><div class="mission-no">${esc(MISSIONS[li].planet)}</div><h2>${esc(l.name)}</h2></div></div><span class="pill">${l.questions.length} 道练习</span></div>${li===4?'<div class="notice space small">出处：p26 B Read and complete；p27 C Read and order（游泳建议短文）。请先合上课本，独立作答；答案与解析在检测结束后显示。</div>':`<nav class="nav" aria-label="关卡学习环节">${[['words','1 先认词'],['teach','2 看例子'],['check','3 小检查'],['practice','4 闯关练习']].map(([s,t])=>`<button data-stage="${s}" class="${stage===s?'active':''}" ${stage===s?'aria-current="step"':''}>${t}</button>`).join('')}</nav>`}${body}`;document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;mode='normal';position=0;selected=null;tiles=[];cacheQuiz=null;render()});wireAudio()}
function render(){state.last??={};state.last[li]={stage,position};save();if(stage==='words')words();else if(stage==='teach')teach();else if(stage==='check'||stage==='practice')quiz()}
function words(){const l=DATA[li];frame(`<section class="card"><div class="flex between"><h3 style="margin:0">把这一关的词整体认识一遍</h3><button id="toggleCN">${hideCN?'显示中文':'遮住中文，自己说'}</button></div><p class="space">${esc(l.intro)}</p><div class="wordgrid">${l.words.map(([en,cn,s])=>`<div class="word"><div class="flex between"><div class="en">${esc(en)}</div>${audio(en.includes('→')?en.split('→')[1]:en.split('/')[0])}</div><div class="cn ${hideCN?'hide':''}">${esc(cn)}</div><div class="sample">${esc(s)}</div></div>`).join('')}</div><div class="notice space">先读英文，再说中文。遮住中文后还能解释意思，就可以看例句了。</div><div class="pager"><button id="toTeach" class="primary">看例子，学规则</button></div></section>`);$('#toggleCN').onclick=()=>{hideCN=!hideCN;words()};$('#toTeach').onclick=()=>{stage='teach';render()}}
function teach(){const l=DATA[li],t=l.lessons[teachIndex];frame(`<section class="card"><div class="flex between"><span class="pill">讲解 ${teachIndex+1} / ${l.lessons.length}</span><span class="muted">课文原句与补充例句分别标注</span></div><h2 class="space">${esc(t.title)}</h2><div class="notice">${esc(t.rule)}</div>${t.examples.map(e=>`<article class="example"><div class="flex between"><span class="source">${esc(e.source)}</span>${audio(e.en)}</div><div class="en space">${esc(e.en)}</div><div>${esc(e.cn)}</div><div class="note">${esc(e.note)}</div></article>`).join('')}<details class="teacher"><summary>老师怎么检查理解</summary><p>先问“这几个词是什么意思？”再问“谁在做？动作是什么？涉及谁或什么？”让学生解释本页例句，再口头换一个主语或情境说一句。</p></details><div class="pager"><button id="prevTeach" ${teachIndex===0?'disabled':''}>上一组例子</button><button id="nextTeach" class="primary">${teachIndex===l.lessons.length-1?'做不计分小检查':'下一组例子'}</button></div></section>`);$('#prevTeach').onclick=()=>{teachIndex--;teach()};$('#nextTeach').onclick=()=>{if(teachIndex<l.lessons.length-1){teachIndex++;teach()}else{stage='check';position=0;cacheQuiz=null;render()}window.scrollTo({top:0,behavior:'instant'})}}
function listQuiz(){if(!cacheQuiz){const l=DATA[li];cacheQuiz=stage==='check'?l.check:mode==='wrong'?l.questions.filter(q=>record(q)&&!record(q).correct):l.questions;if(mode==='wrong')cacheQuiz.forEach(q=>delete q._submitted)}return cacheQuiz}
function quiz(){const list=listQuiz();if(!list.length||position>=list.length){result(list);return}const q=list[position];let r=record(q);
if(mode==='wrong')r=q._submitted?record(q):null;
const submitted=!!r;const currentAnswer=r?.value;const answered=list.filter(x=>record(x)).length;
let controls='';if(q.type==='choice'){controls=`<div class="options">${q.options.map((o,i)=>`<button class="option ${(!submitted&&selected===i)||(submitted&&currentAnswer===o)?'selected':''}" data-choice="${i}" ${submitted?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`}else if(q.type==='text'){controls=`<label class="small" for="answerInput">${q.prompt.includes('只填')?'输入单词':'输入完整英文句子（大小写和句末标点不影响评分）'}</label><textarea id="answerInput" class="answerbox" spellcheck="false" autocapitalize="off" ${submitted?'disabled':''} placeholder="${q.prompt.includes('只填')?'写出连接词':'在这里写英文…'}">${submitted?esc(currentAnswer):''}</textarea>${q.hint?`<details><summary>需要一点提示</summary><p>${esc(q.hint)}</p></details>`:''}`}else{controls=`<p class="muted">依次点击词块或步骤；点击上方已选的块可撤回。</p><div class="assembly" aria-label="已排好的答案">${submitted?`<div class="en">${esc(currentAnswer)}</div>`:tiles.length?tiles.map((idx,j)=>`<button data-remove="${j}">${esc(q.tokens[idx])}</button>`).join(''):'<span class="muted">答案会排在这里</span>'}</div><div class="tokenbank">${q.tokens.map((t,i)=>`<button data-token="${i}" ${submitted||tiles.includes(i)?'disabled':''}>${esc(t)}</button>`).join('')}</div>`}
const correctLabel=q.type==='text'?q.answer.join(' / '):q.answer;
const fb=submitted&&li===4?'<div class="notice space small" role="status">答案已记录。完成这一轮后统一查看解析。</div>':submitted?`<div class="feedback ${r.correct?'ok':'bad'}" role="status"><strong>${r.correct?'答对了，读出完整意思。':'先看清楚原因，再练一遍。'}</strong><p class="space"><b>参考答案：</b>${esc(correctLabel)}</p><p>${esc(q.explain)}</p></div>`:'';
frame(`<section class="card"><div class="flex between"><span class="pill">${stage==='check'?'不计分检查':mode==='wrong'?'错题重练':li===4?'背诵检测':'正式练习'} · ${position+1}/${list.length}</span><span class="muted">${esc(q.tag)}</span></div><div class="bar"><span style="width:${(position+1)/list.length*100}%"></span></div><div class="prompt">${esc(q.prompt)}</div>${controls}${fb}<div class="pager"><button id="prevQ" ${position===0?'disabled':''}>上一题</button>${submitted?`<button id="nextQ" class="primary">${position===list.length-1?'查看本关结果':'下一题'}</button>`:'<button id="submit" class="primary">确认答案</button>'}</div><div class="questiondots" aria-label="练习进度">${list.map((x,i)=>`<span class="dot ${record(x)?li===4?'recorded':record(x).correct?'good':'wrong':''} ${position===i?'current':''}"></span>`).join('')}</div><details class="teacher"><summary>课堂提示</summary><p>${li===4?'先让学生独立完成检测。结束后抽查答对题的理由，检查是否理解；错题再回到对应页码讲解。错题重练保留首次成绩。':'选择后请学生解释意思。若答错，先让他指出是哪一个词或结构不理解，再看讲解。错题重练保留首次成绩。'}</p></details></section>`);
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=+b.dataset.choice;quiz()});document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{tiles.push(+b.dataset.token);quiz()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{tiles.splice(+b.dataset.remove,1);quiz()});$('#prevQ').onclick=()=>{position--;selected=null;tiles=[];render()};if($('#nextQ'))$('#nextQ').onclick=()=>{position++;selected=null;tiles=[];render();window.scrollTo({top:0,behavior:'instant'})};if($('#submit'))$('#submit').onclick=()=>{let value;if(q.type==='choice'){if(selected===null){toast('先选一个答案。');return}value=q.options[selected]}else if(q.type==='order'){if(tiles.length!==q.tokens.length){toast('请把所有词块或步骤排完整。');return}value=tiles.map(i=>q.tokens[i]).join(' ')}else{value=$('#answerInput').value.trim();if(!value){toast('先写下你的答案。');return}}const accepted=q.type==='text'?q.answer:[q.answer],correct=accepted.some(a=>norm(a)===norm(value));const old=record(q);state.records[q.id]={value,correct,first:old?old.first:correct,attempts:(old?.attempts||0)+1};if(mode==='wrong')q._submitted=true;save();quiz()}}

function diagnosticReport(){
 return `<div class="diagnostic-breakdown">${['词组','句意','运用'].map(g=>{const qs=TEST.questions.filter(q=>q.group===g),done=qs.filter(q=>record(q)).length,first=qs.filter(q=>record(q)?.first).length,now=qs.filter(q=>record(q)?.correct).length;return `<div class="word"><strong>${g}</strong><div class="stat-value">${first}<small> / ${qs.length}</small></div><div class="small muted">首次答对 · 已答 ${done} 题<br>当前答对 ${now} 题</div></div>`}).join('')}</div><p class="small muted space">先看哪一类题需要再练，再让学生口头解释两三道答对题。选择题成绩需要结合口头解释一起判断。</p>${nums(TEST).done===20?`<details><summary>查看全部 20 题答案与解析</summary>${TEST.questions.map((q,i)=>`<article class="review"><span class="pill">${i+1} · ${esc(q.tag)}</span><p class="space">${esc(q.prompt)}</p><p><b>参考答案：</b>${esc(q.answer)}</p><p>${esc(q.explain)}</p></article>`).join('')}</details><details><summary>核对七句原文与出处（p26—27）</summary>${TEST.sources.map(([title,lines])=>`<h3 class="space">${esc(title)}</h3>${lines.map(([en,cn])=>`<article class="example"><div class="en">${esc(en)}</div><div>${esc(cn)}</div></article>`).join('')}`).join('')}</details>`:''}`
}

function result(list){const l=DATA[li];const checks=stage==='check';const complete=list.every(q=>record(q));const right=list.filter(q=>record(q)?.correct).length;const n=nums(l);const wrong=(checks?list:l.questions).filter(q=>record(q)&&!record(q).correct);frame(`<section class="card"><span class="pill">${checks?'认词与规则检查':li===4?'七句背诵检测结果':'本关学习记录'}</span><h2 class="space">${complete?'这一轮完成了':'还有题目等你完成'}</h2>${li!==4&&!checks&&n.mastered===l.questions.length?`<div class="badge-award"><div class="award-icon" aria-hidden="true">${MISSIONS[li].symbol}</div><div><strong>${esc(MISSIONS[li].name)}已点亮！</strong><p>这一关的题目都练熟了。试着换一个情境，自己说一句英文吧。</p></div></div>`:''}${li===4?diagnosticReport():''}<div class="resultgrid"><div><div class="score">${checks?right:n.first}<span style="font-size:22px;color:var(--muted)"> / ${checks?list.length:n.done}</span></div><div>${checks?'当前答对':'首次答对 / 已答题数'}</div></div><div><div class="score">${checks?wrong.length:n.mastered}<span style="font-size:22px;color:var(--muted)">${checks?'题':' / '+l.questions.length}</span></div><div>${checks?'需要再理解':'当前掌握（含重练后答对）'}</div></div></div><p>${checks?'能选对也能说清楚意思，就可以进入正式练习。':`已答 ${n.done}/${l.questions.length}；还需巩固 ${n.wrong}题。分数之外，也要能解释句意、自己组成句子。`}</p><div class="flex">${checks?'<button id="practiceNext" class="primary">进入正式练习</button>':''}${wrong.length?'<button id="retryWrong" class="primary">重练本关错题</button>':''}<button id="restart">${checks?'再做一次小检查':'新一轮练整关'}</button><button id="homeResult">回任务地图</button></div>${wrong.length?`<h3 class="space">先看错因，再去重练</h3>${wrong.map(q=>{const r=record(q);return `<article class="review"><span class="pill">${esc(q.tag)}</span><p class="space"><b>题目：</b>${esc(q.prompt)}</p><p><b>你的答案：</b>${esc(r.value)}</p><p><b>参考答案：</b>${esc(q.type==='text'?q.answer.join(' / '):q.answer)}</p><p><b>怎么改：</b>${esc(q.explain)}</p></article>`}).join('')}`:'<div class="notice space">本轮已答题目都答对了。再口头换一个句子试试，看看能不能独立说出来。</div>'}</section>`);if($('#practiceNext'))$('#practiceNext').onclick=()=>open(li,'practice');$('#homeResult').onclick=home;$('#restart').onclick=()=>{if(!confirm('开始新一轮会清除这一环节的答题记录，确定吗？'))return;for(const q of checks?l.check:l.questions){delete state.records[q.id];delete q._submitted}save();open(li,checks?'check':'practice')};if($('#retryWrong'))$('#retryWrong').onclick=()=>{if(checks){for(const q of wrong)delete state.records[q.id];open(li,'check')}else{for(const q of l.questions)delete q._submitted;open(li,'practice','wrong')}}}
$('#homeBtn').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();home()};home();
</script></body></html>
