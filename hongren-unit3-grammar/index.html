<script>
const DATA=[{"name": "can 和 should", "short": "能、会、可以与应该", "color": "#2557b9", "words": [["can", "能、会；也可以表示允许", "I can swim. / You can use my pen."], ["should", "应该：给建议", "You should warm up first."], ["can’t / cannot", "不能、不会；有时表示不允许", "I can’t swim."], ["shouldn’t / should not", "不应该：劝别人别这样做", "You shouldn’t run when you are tired."]], "intro": "先看意思，再看结构。can 和 should 放在动作前面；后面的动作都用原形。", "lessons": [{"title": "01 先分清：本领、允许、建议", "rule": "can 可以说“会做”，也可以说“允许做”。should 是“应该”，给建议。看完整的意思，不要只盯一个词。", "examples": [{"en": "I can swim.", "cn": "我会游泳。", "note": "说本领：我有这个能力。", "source": "补充例句"}, {"en": "You can use my pen.", "cn": "你可以用我的笔。", "note": "说允许：我同意你用。", "source": "补充例句"}, {"en": "You should warm up first.", "cn": "你应该先热身。", "note": "说建议：这样做更好、更安全。", "source": "补充例句"}]}, {"title": "02 回课文：can 后面可以连两个动作", "rule": "先认词组 get into the water（进入水中），再认 swim（游泳）。can 管着这两个动作，它们都用原形。", "examples": [{"en": "Finally, you can get into the water and swim.", "cn": "最后，你可以进入水中游泳。", "note": "Finally（最后） / you（主语） / can get into the water and swim（谓语部分）。", "source": "课文原句 · p27"}]}, {"title": "03 不加 to，不加 s", "rule": "记住骨架：谁＋can / should＋动作原形。换成 he 或 she，动作也不加 s。", "examples": [{"en": "We should wear safety equipment when we do sport.", "cn": "我们运动时应该穿戴安全装备。", "note": "We（主语） / should wear（谓语） / safety equipment（宾语）；后面说明“什么时候”。主干是主谓宾。", "source": "课文原句 · p36"}, {"en": "He should wear a helmet.", "cn": "他应该戴头盔。", "note": "He / should wear / a helmet。wear 不加 s，也不加 to。", "source": "补充例句"}, {"en": "She can swim.", "cn": "她会游泳。", "note": "即使主语是 she，can 后仍然是 swim。", "source": "补充例句"}]}, {"title": "04 否定：把 not 放在情态动词后", "rule": "can not 通常写成一个词 cannot，也可以缩成 can’t。should not 可以缩成 shouldn’t。后面的动作仍用原形。", "examples": [{"en": "I can’t swim.", "cn": "我不会游泳。", "note": "I can swim. 加上否定，变成 I can’t swim.", "source": "补充例句"}, {"en": "You shouldn’t run when you are tired.", "cn": "你累的时候不应该跑步。", "note": "shouldn’t 是“不应该”，不是“不会”。", "source": "补充例句"}]}, {"title": "05 提问：把 can / should 搬到前面", "rule": "谁＋can＋动作 → Can＋谁＋动作？不用再加 do / does。should 也一样。", "examples": [{"en": "Can you swim?", "cn": "你会游泳吗？", "note": "Yes, I can. / No, I can’t. 问 you，回答自己的情况用 I。", "source": "补充例句"}, {"en": "Should we wear helmets?", "cn": "我们应该戴头盔吗？", "note": "Yes, we should. / No, we shouldn’t.", "source": "补充例句"}, {"en": "How should we protect ourselves?", "cn": "我们应该怎样保护自己？", "note": "How（怎样）＋should＋we＋protect＋ourselves。它要回答具体方法，不能只回答 Yes。", "source": "课文原句 · 单元主题"}]}, {"title": "06 看懂句子，再自己表达", "rule": "先找“谁”，再选 can / should，最后接动作原形。主语、动作、对象分别是谁或什么？", "examples": [{"en": "We should learn some first aid skills.", "cn": "我们应该学习一些急救技能。", "note": "We（主语） / should learn（谓语） / some first aid skills（宾语）。主谓宾。", "source": "课文原句 · p36"}, {"en": "He can help me.", "cn": "他能帮助我。", "note": "He（谁） / can help（能做什么） / me（帮助谁）。", "source": "补充例句"}]}], "check": [{"type": "choice", "tag": "认词检查", "prompt": "can 在 I can swim. 中是什么意思？", "options": ["会，有这个本领", "应该", "昨天"], "answer": "会，有这个本领", "explain": "can 在这里说能力。", "id": "0-0"}, {"type": "choice", "tag": "认词检查", "prompt": "你想给朋友一个建议：“你应该先热身。”选哪个词？", "options": ["can", "should"], "answer": "should", "explain": "should 表示“应该”。", "id": "0-1"}, {"type": "choice", "tag": "认词检查", "prompt": "shouldn’t 的意思是？", "options": ["不会", "应该", "不应该"], "answer": "不应该", "explain": "should 加 not，意思变成“不应该”。", "id": "0-2"}, {"type": "choice", "tag": "规则检查", "prompt": "He can ___ .", "options": ["swim", "swims", "to swim"], "answer": "swim", "explain": "can 后面用动词原形。", "id": "0-3"}], "questions": [{"type": "choice", "tag": "理解意思", "prompt": "“她会游泳。” She ___ swim.", "options": ["can", "should"], "answer": "can", "explain": "中文说的是本领，所以选 can。", "id": "0-4"}, {"type": "choice", "tag": "理解意思", "prompt": "“我们应该先热身。” We ___ warm up first.", "options": ["can", "should"], "answer": "should", "explain": "中文明确说“应该”，用 should。", "id": "0-5"}, {"type": "choice", "tag": "理解意思", "prompt": "You can use my pen. 这里 can 表示什么？", "options": ["允许你用", "建议你用", "你以前用过"], "answer": "允许你用", "explain": "can 也能表示允许，不只是“会”。", "id": "0-6"}, {"type": "choice", "tag": "理解意思", "prompt": "“你不应该在累的时候跑步。” You ___ run when you are tired.", "options": ["can’t", "shouldn’t", "can"], "answer": "shouldn’t", "explain": "这里是劝别人别这样做，用 shouldn’t。", "id": "0-7"}, {"type": "choice", "tag": "动词原形", "prompt": "He should ___ a helmet.", "options": ["wears", "to wear", "wear"], "answer": "wear", "explain": "should 后接 wear，不加 to，不加 s。", "id": "0-8"}, {"type": "choice", "tag": "动词原形", "prompt": "She can ___ me.", "options": ["help", "helps", "helped"], "answer": "help", "explain": "主语是 she，can 后也用原形 help。", "id": "0-9"}, {"type": "choice", "tag": "动词原形", "prompt": "We shouldn’t ___ here.", "options": ["running", "run", "to run"], "answer": "run", "explain": "否定不改变后面动词的形式，仍用原形。", "id": "0-10"}, {"type": "choice", "tag": "动词原形", "prompt": "You can get into the water and ___.", "options": ["swims", "swimming", "swim"], "answer": "swim", "explain": "can 后连接的两个动作都用原形。", "id": "0-11"}, {"type": "text", "tag": "改否定句", "prompt": "把 I can swim. 改成否定句。", "answer": ["I can't swim.", "I cannot swim."], "explain": "在 can 后加 not，动作 swim 不变。", "hint": "保留 I 和 swim，只改“能不能”。", "id": "0-12"}, {"type": "text", "tag": "改否定句", "prompt": "把 He can help me. 改成否定句。", "answer": ["He can't help me.", "He cannot help me."], "explain": "can’t / cannot 放在 help 前。", "hint": "", "id": "0-13"}, {"type": "text", "tag": "改否定句", "prompt": "把 We should run here. 改成否定句。", "answer": ["We shouldn't run here.", "We should not run here."], "explain": "shouldn’t 表示“不应该”。", "hint": "", "id": "0-14"}, {"type": "text", "tag": "改否定句", "prompt": "把 She should wear this hat. 改成否定句。", "answer": ["She shouldn't wear this hat.", "She should not wear this hat."], "explain": "should 后加 not，wear 不变。", "hint": "", "id": "0-15"}, {"type": "text", "tag": "变疑问句", "prompt": "把 You can swim. 改成一般疑问句。", "answer": ["Can you swim?"], "explain": "把 can 移到 you 前，不要添加 do。", "hint": "", "id": "0-16"}, {"type": "text", "tag": "变疑问句", "prompt": "把 We should wear yourselves", "你们 → 你们自己", "You two protect yourselves."], ["they → themselves", "他们 / 她们 / 它们 → 自己", "They protect themselves."]], "intro": "反身代词就是“自己”。先找出这个“自己”指谁，再选择对应的词；不要看到主语就机械地填。", "lessons": [{"title": "01 做动作的人，也是动作涉及的人", "rule": "I hurt myself. 是“我弄伤了我自己”。I 和 myself 指同一个人。I hurt him. 则是“我弄伤了他”，是两个人。", "examples": [{"en": "I hurt myself.", "cn": "我弄伤了我自己。", "note": "I（主语） / hurt（谓语） / myself（宾语）。主谓宾。", "source": "补充例句"}, {"en": "I hurt him.", "cn": "我弄伤了他。", "note": "him 是他，myself 是我自己，意思不同。", "source": "补充例句"}]}, {"title": "02 同一个人，换不同的“自己”", "rule": "把“我”换成“他”，我自己也要换成他自己。在有 should 的句子里，protect 一直用原形。", "examples": [{"en": "I should protect myself.", "cn": "我应该保护我自己。", "note": "I 对应 myself。", "source": "补充例句"}, {"en": "He should protect himself.", "cn": "他应该保护他自己。", "note": "He 对应 himself；should 后的 protect 不加 s。", "source": "补充例句"}, {"en": "She should protect herself.", "cn": "她应该保护她自己。", "note": "She 对应 herself。", "source": "补充例句"}]}, {"title": "03 回课文：我们保护我们自己", "rule": "先认 protect（保护）和 ourselves（我们自己）。单元主题里的 we 和 ourselves 指同一群人。", "examples": [{"en": "How should we protect ourselves?", "cn": "我们应该怎样保护自己？", "note": "还原主干：We should protect ourselves. 主语 We，谓语 should protect，宾语 ourselves。", "source": "课文原句 · 单元主题"}, {"en": "They should protect themselves.", "cn": "他们应该保护他们自己。", "note": "we 换成 they，ourselves 跟着换成 themselves。", "source": "补充例句"}]}, {"title": "04 一个“你”和一群“你们”", "rule": "you 既能说“你”，也能说“你们”。只有一个人用 yourself；两个人或更多人用 yourselves。单数常见 self，复数是 selves。", "examples": [{"en": "Tom, protect yourself.", "cn": "汤姆，保护好你自己。", "note": "只对汤姆一个人说话。", "source": "补充例句"}, {"en": "Tom and Lily, protect yourselves.", "cn": "汤姆和莉莉，保护好你们自己。", "note": "对两个人说话，要用 yourselves。", "source": "补充例句"}, {"en": "The cat cleans itself.", "cn": "这只猫清洁它自己。", "note": "一只猫，用 itself。", "source": "补充例句"}]}, {"title": "05 先判断是“自己”，还是别人", "rule": "不是每句有 he 就一定用 himself。要看动作涉及的人是不是他自己。", "examples": [{"en": "He hurt himself.", "cn": "他弄伤了他自己。", "note": "做动作的和受伤的是同一个人。", "source": "补充例句" function vmCreate(words,{group=-1,round=0,kind='mixed'}={}){if(!words.length){vmHub();return}const p=vmEnsure();p.active={ids:words.map(w=>w.id),group,round,kind,phase:'learn',leftOrder:vmShuffle(words.map(w=>w.id)),rightOrder:vmShuffle(words.map(w=>w.id)),matched:[],errors:{},left:null,right:null,badLeft:null,badRight:null,feedback:null};vmHidePast=false;vmHideCN=false;save();vmLearn()}

function vmLearn(){const a=vmEnsure().active;if(!a){vmHub();return}a.phase='learn';save();const words=vmWords(),g=a.group>=0?VM_GROUPS[a.group]:null;vmFrame(`<div class="notice space"><b>先认识这一轮的${words.length}组，再开始配对。</b><p class="small">${esc(g?.rule||'先读原形，再读过去式，再解释中文。读懂后遮住过去式，自己说。')}</p></div><section class="card space"><div class="flex between"><div><span class="pill">${esc(vmRoundTitle(a))}</span><h3 class="space">① 先认词，成对记</h3></div><div class="flex"><button id="vmHidePast">${vmHidePast?'显示过去式':'遮住过去式'}</button><button id="vmHideCN">${vmHideCN?'显示中文':'遮住中文'}</button></div></div><div class="vm-learn-grid">${words.map(w=>`<article class="vm-learn-word"><div class="source">${vmSource(w)}</div><div class="vm-word-line"><span class="en">${esc(w.base)}</span>${vmAudio(w,'base')}</div><div class="vm-word-line vm-past-row"><span class="vm-arrow" aria-hidden="true">→</span><span class="en ${vmHidePast?'vm-hidden':''}">${esc(w.past)}</span>${vmHidePast?'':vmAudio(w,'past')}</div><p class="vm-meaning ${vmHideCN?'vm-hidden':''}">${esc(w.cn)}</p><p class="small muted">${esc(vmHidePast?'先自己说，再打开核对。':w.note)}</p></article>`).join('')}</div><div class="notice space small">老师抽问：这个词什么意思？过去式怎么说？可以先读会，再慢慢记拼写。</div><div class="pager"><button id="vmStart" class="primary">认识好了，开始配对 →</button></div></section>`);$('#vmHidePast').onclick=()=>{vmHidePast=!vmHidePast;vmLearn()};$('#vmHideCN').onclick=()=>{vmHideCN=!vmHideCN;vmLearn()};$('#vmStart').onclick=()=>{for(const w of words)vmEnsure().seen[w.id]=true;a.phase='game';save();vmGame();window.scrollTo({top:0,behavior:'instant'})}}
function vmGame(){const a=vmEnsure().active;if(!a){vmHub();return}a.phase='game';save();const words=vmWords(),complete=a.matched.length===words.length,fb=a.feedback;vmFrame(`<section class="card space vm-game"><div class="flex between"><span class="pill">${esc(vmRoundTitle(a))}</span><span class="vm-counter">已配对 ${a.matched.length}/${words.length}</span></div><h3 class="space">② 帮原形找到过去式</h3><p class="muted">先点一个原形，再点它的过去式。换词时可以重新选择。</p><div class="vm-board">${[['left','原形 · 动作本来的样子'],['right','过去式 · 过去发生的动作']].map(([side,label])=>`<div class="vm-column"><h4>${label}</h4>${a[side+'Order'].map(id=>{const w=words.find(w=>w.id===id),ok=a.matched.includes(id),bad=a[side==='left'?'badLeft':'badRight']===id;return `<button data-vm-side="${side}" data-vm-id="${id}" class="vm-tile ${ok?'vm-matched':a[side]===id?'vm-selected':''} ${bad?'vm-missed':''}" aria-pressed="${a[side]===id}" ${ok?'disabled':''}><span>${esc(side==='left'?w.base:w.past)}</span>${ok?`<small>✓ ${esc(w.cn)}</small>`:''}</button>`}).join('')}</div>`).join('')}</div><div class="vm-feedback ${fb?fb.good?'vm-good':'vm-bad':''}" role="status" aria-live="polite">${fb?fb.good?`<strong>${esc(fb.base)} → ${esc(fb.past)} · ${esc(fb.cn)}</strong><p>${esc(fb.note)}</p>${vmAudio(words.find(w=>w.id===fb.id),'past')}`:`<strong>这两张还没配上。</strong><p>${esc(fb.base)}的过去式不是${esc(fb.past)}。再想一想，也可以打开下面的词表。</p>`:'<span class="muted">先选一张词卡。答对后读出这组词，再说中文。</span>'}</div><details class="teacher"><summary>忘了？回看这一轮词表</summary><div class="vm-hint-list">${words.map(w=>`<p><b>${esc(w.base)} → ${esc(w.past)}</b>　${esc(w.cn)}</p>`).join('')}</div></details><div class="pager"><button id="vmBackLearn">回词卡复习</button><button id="vmFinish" class="primary" ${complete?'':'disabled'}>${complete?'这一轮完成，看记录 →':'配完这一轮再继续'}</button></div></section>`,false);document.querySelectorAll('[data-vm-side]').forEach(b=>b.onclick=()=>vmSelect(b.dataset.vmSide,b.dataset.vmId));$('#vmBackLearn').onclick=vmLearn;$('#vmFinish').onclick=vmFinish}
function vmSelect(side,id){const a=vmEnsure().active;if(!a||a.phase!=='game'||a.matched.includes(id)||!a.ids.includes(id))return;a.badLeft=null;a.badRight=null;a.feedback=null;a[side]=a[side]===id?null:id;if(a.left&&a.right){const w=VM_WORDS.find(w=>w.id===a.left),right=VM_WORDS.find(w=>w.id===a.right),good=a.left===a.right,p=vmEnsure(),r=p.records[w.id]||{attempts:0,matches:0,firstCorrect:null,review:false};if(r.attempts===0)r.firstCorrect=good;r.attempts++;if(good){r.matches++;if(a.kind==='wrong')r.review=false;a.matched.push(w.id);a.feedback={good:true,id:w.id,base:w.base,past:w.past,cn:w.cn,note:w.note}}else{r.review=true;a.errors[w.id]=(a.errors[w.id]||0)+1;a.badLeft=a.left;a.badRight=a.right;a.feedback={good:false,base:w.base,past:right.past}}p.records[w.id]=r;a.left=null;a.right=null;save()}vmGame()}

function vmResume(){const a=vmEnsure().active;if(!a){vmHub();return}if(a.phase==='learn')vmLearn();else if(a.phase==='result')vmResult();else vmGame()}

function wrStepDone(i){const w=wrEnsure();if(i<3)return WR_QUESTIONS.filter(q=>q.step===i).every(q=>w.answers[q.id]?.correct);if(i===3)return WR_QUESTIONS.filter(q=>q.step===3).every(q=>w.answers[q.id]?.correct)&&WR_BUILD.every((_,j)=>w.builders[j]?.correct);if(i===4)return w.drafts.every(t=>/[a-z]/i.test(t));return w.completed}
function wrHub(){stage='writing33';const w=wrEnsure();document.documentElement.style.setProperty('--accent','#9b5218');$('#app').innerHTML=`<div class="wr-top"><div><div class="mission-no">宏仁 · Unit 3 · p33 / WRITING LAB</div><h2>安全小卫士 · 作文工作站</h2></div><button id="wrHome">任务地图</button></div><section class="wr-hero"><div><span class="pill">今天：动词复习＋自己写作文</span><h2>从“我会背”到<br>“这句我会写”。</h2><p>看到公园着火，应该怎么做？<br>先学词组和句型，再按顺序写出自己的建议。</p></div>${wrArt()}</section><div class="wr-map">${WR_STEPS.map((s,i)=>`<button data-wr-step="${i}" class="${wrStepDone(i)?'wr-done':''}"><span class="wr-number">${i+1}</span><strong>${s}</strong><small>${['先看清情境、任务和句型','12组表达，先认意思再说','想清楚哪些做法合适','should＋原形，点击词块组句','中文提示→四句草稿','空白写作、自查、老师核对'][i]}</small><small>${wrStepDone(i)?'✓ 已完成本步练习':w.visited[i]?'已打开，可继续':'可以直接进入'}</small></button>`).join('')}</div><div class="flex"><button class="primary" id="wrResume">继续第${w.step+1}步：${WR_STEPS[w.step]}</button><button id="wrVerbs">先做过去式配对</button></div><details class="wr-teacher"><summary>老师的今晚课堂路线与检查点</summary><p>先在句乐部听写；配对站挑2轮。写作先口头解释题目和词组，选择题不要只看选对，要让他说明意思。should后不加to、不加s、不用过去式。四句可以在纸上写，网页保存最终文字即可。</p><p>本页练习和范文是辅导补充，第33页课本只提供写作题目、call/ask等提示和顺序词开头。作文用I或we都可以，保持一致。课本没有在这页规定字数；先把四个步骤写清楚，再按学校要求调整。</p><p>现实中应及时远离危险、求助报警；作文的四个连接词帮助组织语言，不代表报警前必须按表等待。儿童不贸然参与扑救。</p><a class="wr-link" href="${WR_SOURCE_URL}" target="_blank" rel="noopener">查看江苏消防的儿童报警与求助提示</a><p>本浏览器进度：选择题已答${Object.keys(w.answers).length}/21；词块组句${Object.values(w.builders).filter(x=>x.correct).length}/4；草稿已写${w.drafts.filter(t=>t.trim()).length}/4句。作文由老师检查意思和内容。</p></details>`;$('#wrHome').onclick=home;$('#wrResume').onclick=()=>wrOpen(w.step);$('#wrVerbs').onclick=vmHub;wrBindSteps();window.scrollTo({top:0,behavior:'instant'})}
function wrBindSteps(){document.querySelectorAll('[data-wr-step]').forEach(b=>b.onclick=()=>wrOpen(+b.dataset.wrStep))}
function wrOpen(i){const w=wrEnsure();w.step=Math.max(0,Math.min(5,i));w.visited[w.step]=true;save();wrRender();window.scrollTo({top:0,behavior:'instant'})}
function wrFrame(body){stage='writing33';const w=wrEnsure();document.documentElement.style.setProperty('--accent','#9b5218');$('#app').innerHTML=`<div class="wr-top"><div><div class="mission-no">Unit 3 · 课本p33写作 · 第${w.step+1}/6步</div><h2>${WR_STEPS[w.step]}</h2></div><button id="wrHub">六步总览</button></div><nav class="wr-nav" aria-label="作文学习步骤">${WR_STEPS.map((s,i)=>`<button data-wr-step="${i}" class="${i===w.step?'active':''}" ${i===w.step?'aria-current="step"':''}>${i+1} ${s}${wrStepDone(i)?' ✓':''}</button>`).join('')}</nav>${body}<div class="wr-pager"><button id="wrPrev">${w.step?'← 上一步':'← 六步总览'}</button>${w.step<5?`<button class="primary" id="wrNext">下一步：${WR_STEPS[w.step+1]} →</button>`:'<button id="wrToHub">回六步总览</button>'}</div><p class="wr-hint">文字输入后自动保存到当前浏览器。步骤都能返回修改；下面的参考表达是辅导补充。</p>`;$('#wrHub').onclick=wrHub;$('#wrPrev').onclick=()=>w.step?wrOpen(w.step-1):wrHub();if($('#wrNext'))$('#wrNext').onclick=()=>wrOpen(w.step+1);if($('#wrToHub'))$('#wrToHub').onclick=wrHub;wrBindSteps();wireAudio();wrBindQuiz()}
function wrQuiz(step){const w=wrEnsure();return WR_QUESTIONS.filter(q=>q.step===step).map(q=>{const a=w.answers[q.id];return `<article class="wr-quiz"><h4>${esc(q.p)}</h4><div class="wr-options">${q.o.map((o,i)=>`<button data-wr-q="${q.id}" data-wr-choice="${i}" class="${a?.choice===i?'selected':''}" aria-pressed="${a?.choice===i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${a?`<div class="wr-feedback ${a.correct?'correct':''}" role="status"><strong>${a.correct?'✓ 这次选对了。':'再想一下，可以重新选择。'}</strong> ${esc(q.e)}</div>`:''}</article>`}).join('')}
function wrBindQuiz(){document.querySelectorAll('[data-wr-q]').forEach(b=>b.onclick=()=>{const w=wrEnsure(),q=WR_QUESTIONS.find(x=>x.id===b.dataset.wrQ),choice=+b.dataset.wrChoice,old=w.answers[q.id];w.answers[q.id]={choice,correct:choice===q.a,firstCorrect:old?old.firstCorrect:choice===q.a,attempts:(old?.attempts||0)+1};save();wrRender()})}
function wrRender(){const i=wrEnsure().step;if(i===0)wrTask();if(i===1)wrWords();if(i===2)wrActions();if(i===3)wrSentences();if(i===4)wrDraft();if(i===5)wrEssay()}
function wrTask(){wrFrame(`<section class="card"><span class="wr-source">课本p33 · C Think and write · 题目原文</span><div class="wr-taskline space">When you see a fire in the park,<br>what should you do?</div>${audio('When you see a fire in the park, what should you do?')}<p>当你在公园看到火灾时，你应该怎么做？</p><div class="wr-lead"><strong>先把题目拆成三块。</strong><p>When you see a fire＝当你看到火灾时<br>in the park＝在公园里<br>what should you do＝你应该做什么</p><p>这次写的是做法和建议。用I should…或We should…，加上四个顺序词，把步骤说清楚。</p></div><div class="wr-oral"><strong>先口头说，再做题</strong><p>在哪里？发生什么？题目让你写“过去的经过”还是“应该怎么做”？</p></div>${wrQuiz(0)}<details class="wr-teacher"><summary>老师抽问参考</summary><p>公园；发生火灾；写应该怎么做。先允许用中文说明，再让他说in the park、a fire和should。课本写作框开头有First和Next，提示词有call、ask。</p></details></section>`)}
function wrWords(){const w=wrEnsure();wrFrame(`<section class="card"><div class="flex between"><div><h3>先整体认会这12组表达</h3><p class="wr-hint">前9组写作文会用到；后3组补充或复习。先说中文，再听读，不急着默写整篇。</p></div><button id="wrHideCN">${w.hideCN?'显示中文':'遮住中文，口头抽问'}</button></div><div class="wr-grid">${WR_WORDS.map(([en,cn,note,tag])=>`<article class="wr-word"><span class="pill">${tag}</span><div class="en space">${esc(en)}</div>${audio(en)}${w.hideCN?'<p class="wr-todo">先自己解释，再显示中文核对。</p>':`<p><strong>${esc(cn)}</strong></p><p class="wr-hint">${esc(note)}</p>`}</article>`).join('')}</div><div class="wr-oral"><strong>老师可以这样抽问</strong><p>“向大人求助”怎么说？“等待”后面还有哪个词？away from和near的方向一样吗？call在这里是什么意思？</p></div><h3 class="wr-section">词组意思小检查</h3>${wrQuiz(1)}</section>`);$('#wrHideCN').onclick=()=>{w.hideCN=!w.hideCN;save();wrRender()}}
function wrActions(){const w=wrEnsure(),actions=['远离火源','向大人求助，并及时拨打119','说明火灾地点和情况','待在安全的地方，等待救援'];wrFrame(`<section class="card"><h3>先有想法，再找英文</h3><div class="wr-lead"><p>看到公园火灾，先保护自己，及时找大人求助、拨打119。不要靠近围观、自己冒险灭火，也不要返回拿东西。</p><p class="wr-hint">四个顺序词用于组织作文；现实中的求助报警应及时进行，不必等待按作文逐项完成。</p></div>${wrQuiz(2)}<h3 class="wr-section">我的四个步骤：先用中文说一遍</h3><p>下面是本次写作的四个核心意思。点击每一块，向老师解释你打算写什么。</p><div class="wr-outline-buttons">${actions.map((a,j)=>`<button data-wr-plan="${j}" class="${w.plan?.[j]?'chosen':''}" aria-pressed="${!!w.plan?.[j]}">${j+1}. ${a}${w.plan?.[j]?' ✓':''}</button>`).join('')}</div><details class="wr-teacher"><summary>内容依据与老师提示</summary><p>教材p33提供公园火灾情境。以下动作由辅导课补充。江苏消防提示儿童及时拨打119、告知具体地址和现场情况，不贸然参与扑救；离开后不返回危险区域。</p><a class="wr-link" href="${WR_SOURCE_URL}" target="_blank" rel="noopener">儿童报警与求助提示</a><br><a class="wr-link" href="https://zj.119.gov.cn/art/2024/2/12/art_1229456259_2731.html" target="_blank" rel="noopener">国家消防救援局：离开后不要返回火灾现场</a></details></section>`);document.querySelectorAll('[data-wr-plan]').forEach(b=>b.onclick=()=>{w.plan||={};w.plan[b.dataset.wrPlan]=!w.plan[b.dataset.wrPlan];save();wrRender()})}
function wrBuilder(j){const w=wrEnsure(),b=WR_BUILD[j],r=w.builders[j]||{picked:[],checked:false};return `<article class="wr-work"><span class="pill">组句 ${j+1}/4 · 辅导补充例句</span><h3 class="space">${esc(b.cn)}</h3><p class="wr-hint">依次点词块；点击上方词块可以撤回。先找顺序词，再找谁、should和动作。</p><div class="wr-slots" aria-label="第${j+1}句已选择的词块">${r.picked.length?r.picked.map((idx,k)=>`<button data-wr-remove="${j}:${k}">${esc(b.parts[idx])}</button>`).join(''):'<span class="muted">把词块排到这里</span>'}</div><div class="wr-bank">${b.order.map(idx=>`<button data-wr-token="${j}:${idx}" ${r.picked.includes(idx)?'disabled':''}>${esc(b.parts[idx])}</button>`).join('')}</div><div class="flex space"><button data-wr-checkbuild="${j}">检查这句</button><button data-wr-clearbuild="${j}">重新组句</button></div>${r.checked?`<div class="wr-feedback ${r.correct?'correct':''}" role="status"><strong>${r.correct?'✓ 顺序正确。请读出整句，再说中文。':'还没排对，检查顺序词、I、should和动作的位置。'}</strong><p style="margin:7px 0 0">${r.correct?esc(b.why):'可以继续调整，再检查；第一次的结果会保留。'}</p></div>${r.correct?audio(b.parts.join(' ')):''}`:''}</article>`}
function wrSentences(){wrFrame(`<section class="card"><h3>一句话的骨架，先讲清楚</h3><div class="wr-rules"><div class="wr-rule"><h4>应该做</h4><p>I / We / He＋should＋动词原形。<br><b>I should call 119.</b></p></div><div class="wr-rule"><h4>不应该做</h4><p>should not＋动词原形。<br><b>I should not go back.</b></p></div><div class="wr-rule"><h4>按步骤说</h4><p>First / Next / Then / Finally后加逗号，再接完整句。</p></div></div><div class="wr-lead"><strong>大白话：</strong><p>should后面用动作“本来的样子”。不要写should to call、should called，也不要因为是he就写should calls。</p><p>本页用I写；你写作文时也可以统一用we。不必把每个词都换成过去式。</p></div><h3 class="wr-section">先做6道句型小检查</h3>${wrQuiz(3)}<h3 class="wr-section">再自己把四句话组出来</h3>${WR_BUILD.map((_,j)=>wrBuilder(j)).join('')}<details class="wr-teacher"><summary>老师抽问：组对以后还要检查什么</summary><p>请他遮住中文解释每一句；再把I换成We或He，问后面的call、ask是否变化。tell them里them指接警人员。最后单独抽问wait for、ask…for help，避免只记住整句。</p></details></section>`);const w=wrEnsure();document.querySelectorAll('[data-wr-token]').forEach(b=>b.onclick=()=>{const [j,k]=b.dataset.wrToken.split(':').map(Number),r=w.builders[j]||={picked:[],checked:false};r.picked.push(k);r.checked=false;r.correct=false;save();wrRender()});document.querySelectorAll('[data-wr-remove]').forEach(b=>b.onclick=()=>{const [j,k]=b.dataset.wrRemove.split(':').map(Number),r=w.builders[j];r.picked.splice(k,1);r.checked=false;r.correct=false;save();wrRender()});document.querySelectorAll('[data-wr-clearbuild]').forEach(b=>b.onclick=()=>{const j=+b.dataset.wrClearbuild,old=w.builders[j];w.builders[j]={picked:[],checked:false,firstCorrect:old?.firstCorrect};save();wrRender()});document.querySelectorAll('[data-wr-checkbuild]').forEach(b=>b.onclick=()=>{const j=+b.dataset.wrCheckbuild,r=w.builders[j]||={picked:[],checked:false},n=WR_BUILD[j].parts.length;if(r.picked.length!==n){toast('先把这一句的所有词块排完整。');return}r.correct=r.picked.every((idx,k)=>idx===k);if(r.firstCorrect===undefined)r.firstCorrect=r.correct;r.checked=true;save();wrRender()})}
function wrGrammarNotes(text){const notes=[];if(/\bshould\s+to\b/i.test(text))notes.push('should后不要加to。');if(/\bshould(?:\s+not)?\s+(called|asked|moved|stayed|waited|went|calls|asks|moves|stays|waits|goes)\b/i.test(text))notes.push('should后用动词原形，不加s，也不用过去式。');if(/\bwait\s+help\b/i.test(text))notes.push('“等待救援”写wait for help，别漏for。');if(/\bask\s+(?:an?\s+)?(?:adult|teacher|someone)\s+help\b/i.test(text))notes.push('“向……求助”要有for help。');if(/\bwhere\s+is\s+the\s+fire\b/i.test(text)&&/\btell\b/i.test(text))notes.push('tell them后这块写where the fire is。');return notes}
function wrDraft(){const w=wrEnsure();wrFrame(`<section class="card"><h3>看中文意思，试着自己写四句</h3><p>这一轮没有预填英文答案。先自己写，卡住时只打开需要的提示。写完向老师解释每句意思。</p>${WR_BUILD.map((b,j)=>`<article class="wr-work"><span class="pill">第${j+1}句 · ${['First','Next','Then','Finally'][j]}</span><label class="wr-label" for="wrDraft${j}">${esc(b.cn)}</label><textarea class="wr-area" id="wrDraft${j}" data-wr-draft="${j}" spellcheck="false" placeholder="自己写这一句英文…">${esc(w.drafts[j])}</textarea><details class="wr-hint"><summary>只看词组提示</summary><p>${esc(b.parts.filter(x=>!['First,','Next,','Then,','Finally,','I','should'].includes(x)).join(' / '))}</p></details><details class="wr-hint"><summary>再看句子骨架</summary><p>${['First,','Next,','Then,','Finally,'][j]} I should ______.</p></details><button class="space" data-wr-draftcheck="${j}">检查常见写法</button><div id="wrDraftFeedback${j}" class="wr-status" role="status"></div></article>`).join('')}<button id="wrPreviewDraft">把我写的四句连起来看看</button><div id="wrDraftPreview" class="space"></div><details class="wr-teacher"><summary>老师检查与允许的不同写法</summary><p>用We should…、keep away from the fire、get help from an adult等合理表达也可以。选择题和词块组句有固定答案；自由写作这里只检查部分常见错误，不自动判定整句正确。检查是否说清了安全做法、主语是否一致、意思是否完整。</p></details></section>`);document.querySelectorAll('[data-wr-draft]').forEach(t=>t.oninput=()=>{w.drafts[+t.dataset.wrDraft]=t.value;save();$('#wrDraftFeedback'+t.dataset.wrDraft).textContent='已保存本句。'});document.querySelectorAll('[data-wr-draftcheck]').forEach(b=>b.onclick=()=>{const j=+b.dataset.wrDraftcheck,t=w.drafts[j],notes=wrGrammarNotes(t);$('#wrDraftFeedback'+j).textContent=t.trim()?notes.length?notes.join(' '):'暂未发现本页列出的常见错误。请老师核对句意、其他拼写和标点。':'先写一句英文，再检查。'});$('#wrPreviewDraft').onclick=()=>{const t=w.drafts.filter(s=>s.trim()).join('\n');$('#wrDraftPreview').innerHTML=t?`<div class="wr-preview">${esc(t)}</div><p class="wr-hint">这是你自己写的草稿。还没写的句子可以回上面补齐。</p>`:'<p class="wr-todo">先在上面写下自己的句子。</p>';w.previewed=true;save()}}
function wrEssaySignals(text){const lower=text.toLowerCase(),notes=wrGrammarNotes(text);const connectors=['first','next','then','finally'];return {count:(text.match(/\b[A-Za-z]+(?:['’-][A-Za-z]+)*\b|\b\d+\b/g)||[]).length,lines:text.split(/[.!?]+/).filter(x=>/[a-z]/i.test(x)).length,connectors:connectors.filter(x=>new RegExp('\\b'+x+'\\b','i').test(text)),should:/\bshould\b/i.test(text),context:/\bfire\b/i.test(text)&&/\bpark\b/i.test(text),notes}}
function wrEssayFeedback(text){if(!text.trim())return '<p class="wr-todo">先自己写下英文，再来检查。</p>';const s=wrEssaySignals(text),missing=['first','next','then','finally'].filter(x=>!s.connectors.includes(x));return `<div class="wr-count"><span>正文${s.count}词（数字也计入）</span><span>识别到约${s.lines}句</span><span>顺序词${s.connectors.length}/4</span></div><div class="wr-feedback ${!s.notes.length?'correct':''}" role="status"><strong>先检查这些能直接看见的地方</strong><p>${s.context?'✓ 出现了fire和park，接上题目情境。':'可以在开头或正文交代fire和park，检查有没有回应题目。'}</p><p>${s.should?'✓ 出现了should。再读一遍，检查后面的动作是否用原形。':'还没识别到should。试试用I should…或We should…表达建议。'}</p><p>${missing.length?'还没识别到：'+missing.join('、')+'。本次练习尝试用四个顺序词。':'✓ 四个顺序词都出现了。检查它们是否按步骤使用，后面是否有逗号。'}</p><p>${s.notes.length?s.notes.map(esc).join('<br>'):'暂未发现本页列出的常见错误；这不代表整篇没有其他错误。'}</p><p class="wr-mini">字数只供参考，课本本页没有规定字数。网页不会判断所有拼写、句意或安全内容，最后由老师核对。</p></div>`}
function wrModel(){return `<details class="wr-teacher"><summary>写完后，和老师核对参考范文（辅导补充）</summary><p class="wr-hint">这不是课本原文，不要求一字不差。你的合理表达也可以。</p><h3>Fire Safety in the Park</h3><div class="wr-preview">When I see a fire in the park, I should stay calm.\nFirst, I should move away from the fire.\nNext, I should ask an adult for help and call 119.\nThen, I should tell them where the fire is.\nFinally, I should stay in a safe place and wait for help.</div><p>当我在公园看到火灾时，我应该保持冷静。首先，远离火源。接下来，向大人求助并拨打119。然后，说明火灾在哪里。最后，待在安全的地方等待救援。</p><p class="wr-hint">可选补充句：I should not go back.（我不应该返回。）开头的When…只先理解“当……时”；今晚主要练should和顺序词。</p>${audio('When I see a fire in the park, I should stay calm. First, I should move away from the fire. Next, I should ask an adult for help and call one one nine. Then, I should tell them where the fire is. Finally, I should stay in a safe place and wait for help.')}</details>`}

function dwHub(){stage='writingDeep';const w=dwEnsure();document.documentElement.style.setProperty('--accent','#315d88');$('#app').innerHTML=`<div class="dw-top"><div><div class="mission-no">宏仁 · Unit 3 / WRITING MISSION 02</div><h2>作文深化 · 从会说到会写</h2></div><button id="dwHome">任务地图</button></div><section class="dw-hero"><div><span class="pill">10月14日 · 今晚的写作任务</span><h2>一步步写，<br>留住第一次的想法。</h2><p>公园发生火灾时，我应该怎么做？</p><p>词组 → 句子 → 四个步骤 → 独立写 → 修改</p></div>${dwArt()}</section><div class="flex between"><button data-dw-step="0">先做3题：平时做，还是正在做？${dwDone(0)?' ✓':''}</button><span class="dw-progress">先说清意思，再动笔。</span></div><div class="dw-map">${DW_NAMES.slice(1).map((s,j)=>`<button data-dw-step="${j+1}" class="${dwDone(j+1)?'wr-done':''}"><span class="dw-num">${j+1}</span><b>${s}</b><small>${['学词组，再自己输入句子','should与词组的8道改错','中文想步骤，英文连四句','左右分开滚动，保留初稿','两稿对照，解释为什么改'][j]}</small><small>${dwDone(j+1)?'✓ 已完成本步':w.visited[j+1]?'已打开，可继续':'从这里开始也可以'}</small></button>`).join('')}</div><div class="dw-toolbar"><button id="dwContinue" class="primary">${w.step===0?'开始时态小复习':'继续第'+w.step+'关：'+DW_NAMES[w.step]}</button><button id="dwBankEnter">多看例句：4个情境、8个版本</button><button id="dwYesterday">回昨天的6步作文引导</button><button id="dwVerbs">抽查动词配对</button></div><details class="dw-teacher"><summary>老师今晚怎么带：深化，不必重做所有练习</summary><p>3题时态复习用几分钟带过。先认词组、口头造句，再写；should后不加to、不加s、不用过去式。第一关前4题对应第33页红笔笔记，后4题和校园安全是选练。已经会的题可直接跳过，把时间留给独立写。</p><p>第33页作文题已按新照片确认：公园火灾情境。第29页四句也已更正为Help came quickly等新版文字。第36页提供should安全表达；上传图片覆盖的五句校园安全建议属于补充句，页面分别标明出处。初稿和订正版分开存，不覆盖昨天的作文。</p><p>独立写前收起词组提示，先允许四句；有余力再加开头。第一稿保存后保持原样，订正在下一关完成。网页只识别部分常见写法，意思与安全内容由老师核对。</p><p>现实中应及时远离危险、求助报警，作文的顺序词不代表报警前要逐项等待。安全内容沿用昨天已核对的消防提示。</p></details>${w.history.length?`<details class="dw-teacher"><summary>查看以前保留的${w.history.length}轮作文</summary>${w.history.map((h,i)=>`<article class="dw-card"><strong>第${i+1}轮</strong><p>初稿</p><div class="dw-original">${esc(h.first?.text||'')}</div><p>订正版</p><div class="dw-original">${esc(h.revision||'')}</div></article>`).join('')}</details>`:''}`;$('#dwHome').onclick=home;$('#dwContinue').onclick=()=>dwOpen(w.step);$('#dwBankEnter').onclick=()=>dwBank();$('#dwYesterday').onclick=wrHub;$('#dwVerbs').onclick=vmHub;dwBindNav();window.scrollTo({top:0,behavior:'instant'})}
function dwOpen(i){const w=dwEnsure();w.step=Math.max(0,Math.min(5,i));w.visited[w.step]=true;save();dwRender();window.scrollTo({top:0,behavior:'instant'})}
function dwFrame(body){stage='writingDeep';const w=dwEnsure();document.documentElement.style.setProperty('--accent','#315d88');$('#app').innerHTML=`<div class="dw-top"><div><div class="mission-no">10月14日 · Unit 3 · ${w.step?'第'+w.step+'/5关':'课前3题'}</div><h2>${DW_NAMES[w.step]}</h2></div><button id="dwHub">五关总览</button></div><nav class="dw-nav" aria-label="作文深化学习步骤">${DW_NAMES.map((s,i)=>`<button data-dw-step="${i}" class="${i===w.step?'active':''}" ${i===w.step?'aria-current="step"':''}>${i===0?'复习':i} ${s}${dwDone(i)?' ✓':''}</button>`).join('')}</nav>${body}<div class="dw-pager"><button id="dwPrev">${w.step?'← 上一步':'← 五关总览'}</button>${w.step<5?`<button id="dwNext" class="primary">下一步：${DW_NAMES[w.step+1]} →</button>`:'<button id="dwToHub">回五关总览</button>'}</div><p class="dw-note">进度和文字自动保存在当前设备、当前浏览器。以下练习是辅导补充；各关可以返回修改。</p>`;$('#dwHub').onclick=dwHub;$('#dwPrev').onclick=()=>w.step?dwOpen(w.step-1):dwHub();if($('#dwNext'))$('#dwNext').onclick=()=>dwOpen(w.step+1);if($('#dwToHub'))$('#dwToHub').onclick=dwHub;dwBindNav();wireAudio()}
function dwRender(){[dwWarm,dwSentence,dwRepair,dwMap,dwWrite,dwRevise][dwEnsure().step]()}
function dwWarm(){const w=dwEnsure();dwFrame(`<section class="card">${dwPhotoPanel()}<h3>先分清两个意思</h3><div class="dw-form-grid"><div class="dw-lesson"><strong>平时、经常做</strong><p>I rest at home after school every day.<br>我每天放学后在家休息。</p><p class="dw-note">every day＝每天。说习惯，用一般现在时。</p></div><div class="dw-lesson"><strong>现在正在做</strong><p>He is now resting at home.<br>他现在正在家里休息。</p><span class="wr-source">课文原句 · p29</span><p class="dw-note">now＝现在；is resting＝正在休息。用现在进行时。</p></div></div><div class="dw-focus"><p>先用中文判断：是“平时会做”，还是“现在正在做”？再看句子的形式。不要只看到“现在”就把两个时态当成一样。</p><p>今天的作文是建议：I should…，should后用原形。</p></div>${DW_WARM.map(q=>{const r=w.warm[q.id];return `<article class="dw-choicebox"><h4>${q.p}</h4><div class="dw-options">${q.o.map((o,j)=>`<button data-dw-warm="${q.id}:${j}" class="${r?.choice===j?'selected':''}" aria-pressed="${r?.choice===j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div>${r?`<div class="dw-message ${r.correct?'good':'try'}" role="status">${r.correct?'✓ 选对了。':'再想一下，可以重选。'} ${q.e}</div>`:''}</article>`}).join('')}<details class="dw-teacher"><summary>老师抽问</summary><p>now什么意思？为什么是is resting？如果说“他平时在家休息”，意思改变在哪里？这3题结束后回到作文，不在这里展开新的时态专题。</p></details></section>`);document.querySelectorAll('[data-dw-warm]').forEach(b=>b.onclick=()=>{const [id,n]=b.dataset.dwWarm.split(':'),q=DW_WARM.find(q=>q.id===id),old=w.warm[id],choice=+n;w.warm[id]={choice,correct:choice===q.a,firstCorrect:old?old.firstCorrect:choice===q.a};save();dwRender()})}
function dwNorm(t){return t.toLowerCase().replace(/[’‘]/g,"'").replace(/\bshouldn't\b/g,'should not').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function dwSentenceRecord(q,bank){const r=bank[q.id];return `<article class="dw-card"><span class="pill">${q.kind==='photo'?'书上笔记 · 自己造句':q.source?'选学 · 校园安全':'自己造句 · 辅导练习'}</span>${q.source?`<p class="wr-source">${q.source}</p>`:''}<label class="dw-label" for="dwSentence-${q.id}">${q.cn}</label><textarea id="dwSentence-${q.id}" data-dw-sentence="${q.id}" class="dw-input" spellcheck="false" placeholder="先口头说，再自己写英文…">${esc(r?.text||'')}</textarea><details class="dw-hint"><summary>提示1：只看词组</summary><p>${q.phrase}</p></details><details class="dw-hint"><summary>提示2：看句子骨架</summary><p>${q.subject||(q.id==='he'?'He':q.id==='where'||q.source?'We':'I')} should ${q.id==='negative'||q.id==='school3'?'not ':''}______.</p></details><button data-dw-checksentence="${q.id}">核对这句</button><div id="dwSentenceFeedback-${q.id}">${r?.checked?dwSentenceFeedback(q,r):''}</div></article>`}
function dwSentenceFeedback(q,r){return `<div class="dw-message ${r.correct?'good':'try'}" role="status">${r.correct?'✓ 和本题参考表达相符。读出这句的意思。':'先核对主语、should后的动词和词组。其他合理表达可以请老师确认。'}<p>${q.why}</p>${!r.correct?`<details><summary>查看本题参考句</summary><p>${esc(q.a[0])}</p></details>`:''}</div>`}
function dwSentence(){const w=dwEnsure();dwFrame(`<section class="card"><h3>先整体认词组，再开始写</h3><p class="dw-note">下面9组借鉴第33页笔记，是今天公园火灾作文会用到的表达，先解释意思、听读，再到下面造句。词组不是一句完整的建议。</p><div class="dw-phrase-grid">${DW_PHRASES.map(([en,cn,note])=>`<article class="dw-card"><div class="en">${en}</div><strong>${cn}</strong><p class="dw-note">${note}</p>${audio(en==='call 119'?'call one one nine':en)}</article>`).join('')}</div><section class="dw-lesson"><h3>只示范一组：这样把词组变成句子</h3><div class="dw-demo"><div>① 做什么<strong>call 119</strong>拨打119</div><div>② 谁应该做<strong>I should call 119.</strong>我应该拨打119。</div><div>③ 加上顺序<strong>Next, I should call 119.</strong>接下来，我应该拨打119。</div></div><p class="space">句子骨架：谁＋should＋动作原形。先认词组，再加主语和should，最后根据步骤加顺序词。</p></section><h3 class="dw-heading">书上笔记的四个意思：先自己造句，下一关再加顺序词</h3>${DW_TASKS.slice(0,4).map(q=>dwSentenceRecord(q,w.sentences)).join('')}<details class="dw-teacher"><summary>选练：单句回顾、换主语和写否定（4句）</summary><p>用同一套骨架换主语。should后的动词仍用原形。</p>${DW_TASKS.slice(4).map(q=>dwSentenceRecord(q,w.sentences)).join('')}</details><details class="dw-teacher"><summary>换情境：图中的校园安全补充句（5句）</summary><p class="wr-source">这5句来自上传图片中覆盖在第36页上方的补充材料，并非该页课本原文。</p><p>先整体理解：follow＝遵守；dangerous places＝危险的地方；hallway＝走廊；be careful＝小心；cross the road＝过马路；in danger＝处于危险中。</p>${DW_SCHOOL.map(q=>dwSentenceRecord(q,w.sentences)).join('')}</details><details class="dw-teacher"><summary>老师怎么检查这关</summary><p>先让他用中文解释，再独立写。网页匹配本题参考句，不能识别所有正确表达；不同合理表达由老师确认。句末标点和大小写不影响本题核对。答对以后把I换成We或He再口头说一次。</p></details></section>`);document.querySelectorAll('[data-dw-sentence]').forEach(t=>t.oninput=()=>{const id=t.dataset.dwSentence,old=w.sentences[id]||{};w.sentences[id]={...old,text:t.value,checked:false,correct:false};save();$('#dwSentenceFeedback-'+id).innerHTML='<p class="dw-status">已保存，修改后请重新核对。</p>'});document.querySelectorAll('[data-dw-checksentence]').forEach(b=>b.onclick=()=>{const id=b.dataset.dwChecksentence,q=[...DW_TASKS,...DW_SCHOOL].find(q=>q.id===id),r=w.sentences[id]||={text:''};if(!r.text.trim()){toast('先自己写下英文。');return}r.correct=q.a.some(a=>dwNorm(a)===dwNorm(r.text));if(r.firstCorrect===undefined)r.firstCorrect=r.correct;r.checked=true;save();$('#dwSentenceFeedback-'+id).innerHTML=dwSentenceFeedback(q,r)})}
function dwRepairFeedback(q,r){return `<div class="dw-message ${r.correct?'good':'try'}" role="status">${r.correct?'✓ 修改后的句子和本题参考相符。':'再看看提示，可以继续修改。'}<p>${q.why}</p>${!r.correct?`<details><summary>核对参考答案</summary><p>${q.a[0]}</p></details>`:''}</div>`}
function dwRepair(){const w=dwEnsure();dwFrame(`<section class="card"><h3>先把这几条规则讲清楚</h3><div class="dw-form-grid"><div class="dw-lesson"><strong>should后用原形</strong><p>should call / should ask / should stay。<br>不加to，不加s，不用过去式。</p></div><div class="dw-lesson"><strong>否定和词组别丢词</strong><p>should not go＝不应该去。<br>wait for help；ask…for help。</p></div></div><p>下面每句都有一处主要错误。直接修改句子，再解释为什么要改。</p>${DW_FIX.map((q,i)=>{const r=w.fixes[q.id];return `<article class="dw-card"><span class="pill">修理 ${i+1}/8</span><p class="en">${q.bad}</p><p>${q.cn}</p><label class="dw-label" for="dwFix-${q.id}">我的修改</label><textarea class="dw-input" id="dwFix-${q.id}" data-dw-fix="${q.id}" spellcheck="false">${esc(r?.text??q.bad)}</textarea><details class="dw-hint"><summary>先看一点提示</summary><p>${q.hint}</p></details><button data-dw-checkfix="${q.id}">检查修改</button><div id="dwFixFeedback-${q.id}">${r?.checked?dwRepairFeedback(q,r):''}</div></article>`}).join('')}<details class="dw-teacher"><summary>老师检查：会改还要会说理由</summary><p>“这里为什么不用过去式？”“主语是he为什么不加s？”“这句应该补for还是to？”请他指出改动的词，不只照抄答案。</p></details></section>`);document.querySelectorAll('[data-dw-fix]').forEach(t=>t.oninput=()=>{const id=t.dataset.dwFix,old=w.fixes[id]||{};w.fixes[id]={...old,text:t.value,checked:false,correct:false};save();$('#dwFixFeedback-'+id).innerHTML='<p class="dw-status">已保存你的修改。</p>'});document.querySelectorAll('[data-dw-checkfix]').forEach(b=>b.onclick=()=>{const id=b.dataset.dwCheckfix,q=DW_FIX.find(q=>q.id===id),r=w.fixes[id]||={text:$('#dwFix-'+id).value};r.correct=q.a.some(a=>dwNorm(a)===dwNorm(r.text));if(r.firstCorrect===undefined)r.firstCorrect=r.correct;r.checked=true;save();$('#dwFixFeedback-'+id).innerHTML=dwRepairFeedback(q,r)})}
function dwMapMessage(){const w=dwEnsure();if(w.map.includes(''))return '先为四个位置各选一个做法。';if(new Set(w.map).size!==4)return '有重复的做法，再看看是不是漏了一项。';return '四个做法已安排。口头读出步骤，再核对远离危险、及时求助报警、说明地点、待在安全地方是否都写到了。'}
function dwMap(){const w=dwEnsure();dwFrame(`<section class="card"><h3>先想清楚四件事，再连接四句话</h3><div class="dw-lesson"><p>按第33页红笔笔记先用中文说明：保持冷静并远离火源；拨打119并说明地点；向周围的人求助；在安全的地方等待消防员。现实中及时报警，不必等作文的各个步骤逐项完成。</p><p>用First、Next、Then、Finally组织文字。顺序词后加逗号，再写完整建议；句子里的I或We保持一致。</p></div><p class="dw-note">本页借鉴第33页红笔笔记的四步写法（手写补充，非印刷正文）。合理安排可以由老师确认，不把所有生活做法都规定成唯一顺序。</p><div class="dw-steps">${['First','Next','Then','Finally'].map((s,j)=>`<article class="dw-outline"><h3>${j+1}. ${s}，${['首先','接下来','然后','最后'][j]}</h3><label class="dw-select-label" for="dwAction${j}">我在这里写哪个做法？</label><select id="dwAction${j}" data-dw-map="${j}"><option value="">先选择中文意思</option>${DW_ACTIONS.map(([id,cn])=>`<option value="${id}" ${w.map[j]===id?'selected':''}>${cn}</option>`).join('')}</select><label class="dw-label" for="dwLine${j}">我的英文句子</label><textarea id="dwLine${j}" data-dw-line="${j}" class="dw-input" spellcheck="false" placeholder="${s}, I should …">${esc(w.drafts[j])}</textarea><details class="dw-hint"><summary>需要时再看：当前做法的词组</summary><p id="dwActionHint${j}">${dwActionHint(w.map[j])}</p></details><button data-dw-linecheck="${j}">检查常见写法</button><div id="dwLineFeedback${j}" class="dw-status" role="status"></div></article>`).join('')}</div><div class="dw-toolbar"><button id="dwCheckMap">检查四个做法是否齐全</button><button id="dwShowParagraph">把我写的四句连起来</button></div><div id="dwMapNotice" class="dw-message">${dwMapMessage()}</div><div id="dwParagraph"></div><details class="dw-teacher"><summary>老师怎么判断这一关</summary><p>先检查中文计划有没有漏掉求助报警、说明地点，再检查英文是否与选的做法对应。网页不自动判断每个自由句子的意思。检查first/next/then/finally顺序、主语、should＋原形和标点。</p></details></section>`);document.querySelectorAll('[data-dw-map]').forEach(s=>s.onchange=()=>{w.map[+s.dataset.dwMap]=s.value;save();$('#dwActionHint'+s.dataset.dwMap).textContent=dwActionHint(s.value);$('#dwMapNotice').textContent=dwMapMessage()});document.querySelectorAll('[data-dw-line]').forEach(t=>t.oninput=()=>{w.drafts[+t.dataset.dwLine]=t.value;save();$('#dwLineFeedback'+t.dataset.dwLine).textContent='已保存本句。'});document.querySelectorAll('[data-dw-linecheck]').forEach(b=>b.onclick=()=>{const j=+b.dataset.dwLinecheck,t=w.drafts[j],n=wrGrammarNotes(t);$('#dwLineFeedback'+j).textContent=t.trim()?n.length?n.join(' '):'暂未发现已列出的常见错误，句意、其他拼写和标点请老师核对。':'先写一句英文。'});$('#dwCheckMap').onclick=()=>$('#dwMapNotice').textContent=dwMapMessage();$('#dwShowParagraph').onclick=()=>{const t=w.drafts.filter(t=>t.trim()).join('\n');$('#dwParagraph').innerHTML=t?`<div class="dw-original">${esc(t)}</div><p class="dw-note">这是你自己写的四句。想加开头，可以在下一关再试。</p>`:'<p class="dw-note">先在上面写下自己的句子。</p>'}}

function fcIntro(){const w=fcState();fcFrame(`<span class="pill">第33页写作题 · 公园火灾</span><h3>你在公园里看见火灾，应该怎么做？</h3><p>今晚不是写“昨天发生了什么”，而是告诉别人：遇到这种情况，我应该怎样做。</p><div class="fc-say"><strong>先用中文说，不急着翻译。</strong><p>① 我应该靠近火源，还是远离？<br>② 需要求助时，可以找谁？<br>③ 报警时，别人需要知道什么？<br>④ 在哪里等待才安全？</p></div><h3>这篇作文要写什么？</h3>${fcChoices('intro',['我应该怎么做：给出安全建议','昨天做了什么：讲过去的经历','现在正在做什么：描述正在发生的动作'],w.intro)}${w.intro!==null?`<div class="dw-message ${w.intro===0?'good':'try'}">${w.intro===0?'对，今晚用I should…写建议，不用把动作变成过去式。':'再看题目：问的是“应该怎样做”，不是讲过去发生了什么。'}</div>`:''}<div class="fc-say"><strong>先记住这四个意思</strong><p>保持冷静并远离 → 报警说明地点 → 向周围可信的大人求助 → 在安全处等救援。</p></div><p class="dw-note">这是英语写作练习。现实中要及时远离危险、求助报警；四个连接词不是必须等待的操作顺序。</p>`);fcBindChoice((_,i)=>w.intro=i)}
function fcWords(){const w=fcState(),i=w.word,q=FC_WORDS[i];fcFrame(`<div class="flex between"><span class="pill">词组 ${i+1} / ${FC_WORDS.length}</span><span>每组先会说意思，再放进句子。</span></div><h3 class="fc-big">${esc(q[0])}</h3>${audio(q[0]==='call 119'?'call one one nine':q[0])}<p class="fc-translation">${q[1]}</p><div class="fc-say"><strong>大白话解释</strong><p>${q[2]}</p><p>${['冷静就是先别慌。stay calm这两个词一起记，不是“住在冷静”。','keep away from后面放“要远离什么”。远离火源，就是keep away from the fire。','call就是打电话。119作为号码读one one nine。这里只练表达，不会真的打电话。','tell them＝告诉他们；where the fire is＝火灾在哪里。先把这两个块记住，不急着讲从句术语。','ask是请求，the people around是周围的人，for help是寻求帮助。三块连起来就是向周围的人求助。','wait是等，wait for后面放“等谁”。firefighters是消防员，别漏掉for。','safe是安全的，place是地方。in a safe place一起说，就是在安全的地方。'][i]}</p></div><h3>现在请你开口说</h3><p>老师先读一遍 → 你跟读 → 老师遮住中文，你说意思 → 再看中文，你说英文。</p><details class="dw-hint"><summary>忘了就再看一眼</summary><p>${q[0]}＝${q[1]}</p></details><div class="dw-toolbar"><button id="fcWordPrev" ${i===0?'disabled':''}>上一组</button><button id="fcWordMark" class="primary">我能说出意思和英文，${i===6?'完成词组学习':'学习下一组'} →</button></div><p>${FC_WORDS.map((x,j)=>`${w.words[j]?'✓':'○'} ${x[1]}`).join(' · ')}</p>`);$('#fcWordPrev').onclick=()=>{w.word--;save();fcRender()};$('#fcWordMark').onclick=()=>{w.words[i]=true;if(i<6)w.word++;save();fcRender()}}
function fcGrammar(){const w=fcState(),qs=[['“我应该拨打119”，哪句对？',['I should call 119.','I should to call 119.','I should called 119.'],'should已经表示“应该”，后面直接放动作call。不加to，不用过去式。'],['主语换成he，哪句对？',['He should ask an adult for help.','He should asks an adult for help.','He should asked an adult for help.'],'前面有should，ask就不加s。主语是he也一样。'],['两个动作放在一句里，哪句对？',['I should stay calm and keep away from the fire.','I should stayed calm and keep away from the fire.','I should stay calm and keeps away from the fire.'],'and连接stay和keep，两个都保持原形。']];fcFrame(`<h3>一句话的骨架：我＋应该＋做什么</h3><div class="fc-formula">I ＋ should ＋ 动作原形</div><p><strong>I should call 119.</strong><br>I＝我；should＝应该；call 119＝拨打119。</p><p>想说“我不应该回去”：<strong>I should not go back.</strong><br>not放在should后面，go仍然用原形。</p>${qs.map((q,i)=>`<article class="dw-card"><h3>${i+1}. ${q[0]}</h3>${fcChoices('g'+i,q[1],w.grammar[i])}${w.grammar[i]!==undefined?`<p class="${w.grammar[i]===0?'fc-ok':'fc-warn'}">${w.grammar[i]===0?'✓ 对。':'再看一看。'} ${q[2]}</p>`:''}</article>`).join('')}<p class="dw-note">这里的骨架确认后，下面四句话都沿用它，不会突然换新时态。</p>`);fcBindChoice((id,i)=>w.grammar[+id.slice(1)]=i)}
function fcSentence(j){const w=fcState(),r=w.lines[j],q=FC_LINES[j],ph=['先说清意思','拆开看，再选写法','补全两个词','收起英文，自己写'];let body=`<span class="pill">第${j+1}句话 · 小步 ${r.phase+1} / 4</span><h3>${ph[r.phase]}</h3><div class="fc-mini">${ph.map((t,i)=>`<span class="${i===r.phase?'active':''}">${i+1}. ${t}</span>`).join('')}</div>`;
 if(r.phase===0)body+=`<div class="fc-say"><strong>${q.cn}</strong><p>${q.why}</p></div><p>用自己的话告诉老师：这一句要做什么？为什么不能做危险的事？</p><h3>这一句的意思是哪一个？</h3>${fcChoices('meaning',q.meaning,r.meaning)}${r.meaning!==null?`<p class="${r.meaning===0?'fc-ok':'fc-warn'}">${r.meaning===0?'✓ 意思说清楚了。接下来把它拆成英文词块。':'再读中文目标，先弄懂意思再学英文。'}</p>`:''}`;
 if(r.phase===1)body+=`<p>先一块一块读，再串起来；说完英文块，要能说出它的中文意思。</p><div class="fc-chunks">${q.parts.map(([en,cn])=>`<div><strong>${en}</strong><span>${cn}</span>${audio(en.includes('119')?en.replace('119','one one nine'):en)}</div>`).join('')}</div><p class="fc-say">${q.hint}</p><h3>两种写法，选一种你能解释的</h3><p>两种都可以。会短句先写短句，理解以后再把句子写丰富。</p>${fcChoices('version',[q.short+'（辅导短句）',q.rich+'（按第33页手写笔记整理）'],r.pick)}<div class="fc-say"><strong>你选的句子</strong><p class="en">${esc(r.pick===0?q.short:q.rich)}</p>${audio((r.pick===0?q.short:q.rich).replace('119','one one nine'))}<p>请读给老师听，再说一遍意思。选句只是选素材，下一步仍要自己动笔。</p></div>`;
 if(r.phase===2)body+=`<p>不论选哪种版本，这两个词都值得练。先不看答案，把句子补全。</p><div class="fc-gapline en">${q.gap[0]}</div>${q.gap[1].map((_,i)=>`<label class="dw-label" for="fcGap${i}">第${i+1}个空</label><input class="dw-input" id="fcGap${i}" value="${esc(r.gaps[i])}" autocomplete="off" spellcheck="false">`).join('')}<button id="fcGapCheck">检查这两个词</button><div id="fcGapFeedback">${r.gapCorrect?'<p class="fc-ok">✓ 两个词都补对了，现在试着不看英文写整句。</p>':''}</div><details class="dw-hint"><summary>卡住时只看提示</summary><p>${q.hint}</p></details>`;
 if(r.phase===3)body+=`<div class="fc-say"><strong>只看中文，自己写一句</strong><p>${q.cn}</p><p>可以写刚才选的短句，也可以写笔记版。不要求一字不差，老师会核对其他合理表达。</p></div><label class="dw-label" for="fcLine">我的第${j+1}句</label><textarea id="fcLine" class="dw-input" spellcheck="false" placeholder="英文提示已收起，自己写…">${esc(r.text)}</textarea><p id="fcLineStatus" class="dw-status">输入时自动保存。</p><div class="dw-toolbar"><button id="fcLineCheck">检查我的句子</button><button id="fcLineTeacher">老师核对后：这句话可以</button></div><div id="fcLineFeedback">${r.confirmed?'<p class="fc-ok">✓ 这句已记录，可以写下一句了。</p>':''}</div><details class="dw-hint"><summary>确实忘了，只看词组提示</summary><p>${q.parts.filter(x=>!['First,','Next,','Then,','Finally,','I should','and'].includes(x[0])).map(x=>x[0]).join(' / ')}</p><p>看完收起，再自己写。这次有提示也没关系，整篇独立写时会再练。</p></details>`;
 body+=`<div class="dw-toolbar"><button id="fcMicroPrev" ${r.phase===0?'disabled':''}>← 回看上一个小步</button><button id="fcMicroNext" class="primary" ${r.phase===3||(r.phase===0&&r.meaning!==0)||(r.phase===2&&!r.gapCorrect)?'disabled':''}>进入下一个小步 →</button></div>`;fcFrame(body);fcBindChoice((id,i)=>{if(id==='meaning')r.meaning=i;else r.pick=i});$('#fcMicroPrev').onclick=()=>{r.phase--;save();fcRender()};$('#fcMicroNext').onclick=()=>{r.phase++;save();fcRender()};if(r.phase===2){[0,1].forEach(i=>$('#fcGap'+i).oninput=()=>{r.gaps[i]=$('#fcGap'+i).value;r.gapCorrect=false;save();$('#fcMicroNext').disabled=true;$('#fcGapFeedback').innerHTML=''});$('#fcGapCheck').onclick=()=>{r.gapCorrect=q.gap[1].every((a,i)=>dwNorm(a)===dwNorm(r.gaps[i]));save();$('#fcGapFeedback').innerHTML=r.gapCorrect?'<p class="fc-ok">✓ 两个词都补对了。</p>':`<p class="fc-warn">还需要检查。${q.hint}</p><details><summary>老师讲解时查看答案</summary><p>${q.gap[1].join(' / ')}</p></details>`;$('#fcMicroNext').disabled=!r.gapCorrect}}
 if(r.phase===3){$('#fcLine').oninput=()=>{r.text=$('#fcLine').value;r.confirmed=false;save();$('#fcLineFeedback').innerHTML='';$('#fcLineStatus').textContent='这句话已保存，修改后请重新核对。';fcRefreshNext()};$('#fcLineCheck').onclick=()=>{if(!r.text.trim()){toast('先自己写一句。');return}const notes=wrGrammarNotes(r.text),match=[q.short,q.rich].some(a=>dwNorm(a)===dwNorm(r.text));r.confirmed=match;save();$('#fcLineFeedback').innerHTML=match?'<p class="fc-ok">✓ 与这一步的一种参考表达相符。再用中文说说这句话的意思。</p>':`<div class="dw-message try">${notes.length?notes.map(esc).join('<br>'):'这句话与参考表达不同，不一定是错。请老师核对意思、词组和拼写。'}<p>合理的不同写法可以用“老师核对后”按钮通过。</p></div>`;fcRefreshNext()};$('#fcLineTeacher').onclick=()=>{if(!/[a-z]/i.test(r.text)){toast('先写下英文句子，再请老师核对。');return}r.confirmed=true;save();$('#fcLineFeedback').innerHTML='<p class="fc-ok">已记录为老师核对通过，不是自动判分。</p>';fcRefreshNext()}}
}
function fcAssemble(){const w=fcState(),labels=['首先','接下来','然后','最后'];fcFrame(`<h3>四句话都写过了，现在把文章串起来</h3><p>四个词像路标，让读的人知道你先说什么、接着说什么。它们不改变should后动词的形式。</p>${labels.map((cn,i)=>`<label class="dw-label" for="fcOrder${i}">${i+1}. ${cn}用哪个顺序词？</label><select id="fcOrder${i}" class="dw-input"><option value="">请选择</option>${['Finally','Then','First','Next'].map(x=>`<option value="${x}" ${w.order[i]===x?'selected':''}>${x}</option>`).join('')}</select>`).join('')}<button id="fcOrderCheck">核对四个路标</button><p id="fcOrderFeedback"></p><details class="dw-hint"><summary>回看我刚才自己写的四句话</summary><div class="dw-original">${w.lines.map(r=>esc(r.text)).join('\n')}</div><p>这是你写的句子，不是自动填好的范文。</p></details><h3>把刚才的四句话连成一段</h3><p>自己输入，检查每句开头大写、连接词后逗号、句末句号。暂时不用加很长的开头或结尾。</p><label class="dw-label" for="fcAssembled">我的练习段落（有提示练习）</label><textarea id="fcAssembled" class="dw-input large" spellcheck="false">${esc(w.assembled)}</textarea><p class="dw-note">下一步会收起这些英文，重新独立写。这一段不会自动复制进初稿。</p>`);[0,1,2,3].forEach(i=>$('#fcOrder'+i).onchange=()=>{w.order[i]=$('#fcOrder'+i).value;save();fcRefreshNext()});$('#fcOrderCheck').onclick=()=>$('#fcOrderFeedback').textContent=w.order.every((s,i)=>s===['First','Next','Then','Finally'][i])?'✓ 四个路标对应正确。':'先说首先，再接着，然后，最后。再调整一下。';$('#fcAssembled').oninput=()=>{w.assembled=$('#fcAssembled').value;save();fcRefreshNext()}}
function fcIndependent(){const w=fcState();fcFrame(`<h3>现在，真正自己写一遍</h3><p>不翻英文例句，不复制刚才的练习段落。只看下面的中文意思，写四句话。短句可以，不会的词先做标记。</p><div class="fc-say"><strong>中文提纲</strong><p>① 保持冷静，远离火源。<br>② 报警，说明火灾地点。<br>③ 向周围可信的大人求助。<br>④ 在安全的地方等待救援。</p></div><p>给文章起个标题，例如“公园火灾时怎么办”。标题可以最后再想；今晚先把正文写清楚。</p>${w.first?`<div class="dw-message good">第一次独立写作已保留，不会被后面的订正覆盖。</div><div class="dw-original">${esc(w.first.text)}</div>`:`<label class="dw-label" for="fcDraft">我的第一次独立作文</label><textarea id="fcDraft" class="dw-input large" spellcheck="false" placeholder="这里是空白，四句话由你自己写…">${esc(w.draft)}</textarea><p id="fcDraftStatus" class="dw-status">当前浏览器自动保存；切换步骤也能继续写。</p><button id="fcSaveFirst" class="primary">我写完了，保留这份初稿</button>`}<p class="dw-note">这一步只保留真实初稿，不用先改到全对。接下来和老师一起找问题。</p>`);if(!w.first){$('#fcDraft').oninput=()=>{w.draft=$('#fcDraft').value;save();$('#fcDraftStatus').textContent='初稿输入已自动保存。'};$('#fcSaveFirst').onclick=()=>{if(!/[a-z]/i.test(w.draft)){toast('先自己写下英文正文。');return}w.first={text:w.draft,savedAt:new Date().toISOString()};save();fcRender()}}}
function fcRevise(){const w=fcState();if(!w.first){fcFrame('<h3>先写独立初稿，再来订正</h3><button id="fcReturnFirst">去写初稿</button>');$('#fcReturnFirst').onclick=()=>fcOpen(8);return}fcFrame(`<h3>先读自己的文章，再找要改的地方</h3><div class="dw-pair"><section class="dw-pane"><h3>保留的第一次作文</h3><div class="dw-original">${esc(w.first.text)}</div><p>这一份保持原样，看看你第一次会写多少。</p></section><section class="dw-pane"><h3>我自己修改的版本</h3><button id="fcCopyFirst">复制初稿到订正区，再自己改</button><label class="dw-label" for="fcRevision">订正版</label><textarea id="fcRevision" class="dw-input large" spellcheck="false">${esc(w.revision)}</textarea><button id="fcCheckRevision">检查常见写法</button><div id="fcRevisionFeedback"></div></section></div><h3>按这四项慢慢查</h3><div class="dw-checks">${['我能解释每一句的意思，不只是背出声音。','我写了should＋动作原形，没有多加to、s或过去式。','我检查了ask…for help、wait for和安全地点这些词组。','四个意思说清了，顺序词、大写和标点也检查过了。'].map((t,i)=>`<label><input type="checkbox" data-fc-check="${i}" ${w.checks[i]?'checked':''}><span>${t}</span></label>`).join('')}</div><label class="dw-label" for="fcReason">告诉老师：我改了哪里，为什么改？</label><textarea id="fcReason" class="dw-input" placeholder="中文也可以，例如should后不加to，所以我删掉了to。">${esc(w.reason)}</textarea><button id="fcFinish" class="primary">保留订正版和修改说明</button><div id="fcFinishNotice">${w.done?'<div class="dw-message good">✓ 今晚这篇作文的初稿、订正版和修改说明已保留。</div>':''}</div><details class="dw-teacher"><summary>写完后才展开：按第33页手写笔记整理的参考</summary><div class="dw-original">${DW_PHOTO_MODEL.map(esc).join('\n')}</div><p>这是参考，不是唯一答案。学生写出清楚、合理的短句也可以。</p></details>`);$('#fcCopyFirst').onclick=()=>{if(w.revision.trim()&&!confirm('用保留的初稿替换订正区吗？初稿本身保持不变。'))return;w.revision=w.first.text;w.done=false;save();fcRender()};$('#fcRevision').oninput=()=>{w.revision=$('#fcRevision').value;w.done=false;w.checks={};save();document.querySelectorAll('[data-fc-check]').forEach(c=>c.checked=false);$('#fcFinishNotice').innerHTML='';$('#fcRevisionFeedback').innerHTML=''};$('#fcCheckRevision').onclick=()=>{const notes=wrGrammarNotes(w.revision);$('#fcRevisionFeedback').innerHTML=`<div class="dw-message ${notes.length?'try':'good'}">${notes.length?notes.map(esc).join('<br>'):'暂未发现已列出的常见问题，不代表整篇自动判为正确。'}<p>请老师继续核对意思、内容和拼写。</p></div>`};$('#fcReason').oninput=()=>{w.reason=$('#fcReason').value;w.done=false;save();$('#fcFinishNotice').innerHTML=''};document.querySelectorAll('[data-fc-check]').forEach(c=>c.onchange=()=>{w.checks[c.dataset.fcCheck]=c.checked;w.done=false;save();$('#fcFinishNotice').innerHTML=''});$('#fcFinish').onclick=()=>{if(!/[a-z]/i.test(w.revision)||!w.reason.trim()||![0,1,2,3].every(i=>w.checks[i])){toast('先完成订正版、修改说明和四项检查。');return}w.done=true;save();fcRender()}}

const fb=submitted&&li===4?'<div class="notice space small" role="status">答案已记录。完成这一轮后统一查看解析。</div>':submitted?`<div class="feedback ${r.correct?'ok':'bad'}" role="status"><strong>${r.correct?'答对了，读出完整意思。':'先看清楚原因，再练一遍。'}</strong><p class="space"><b>参考答案：</b>${esc(correctLabel)}</p><p>${esc(q.explain)}</p></div>`:'';
frame(`<section class="card"><div class="flex between"><span class="pill">${stage==='check'?'不计分检查':mode==='wrong'?'错题重练':li===4?'背诵检测':'正式练习'} · ${position+1}/${list.length}</span><span class="muted">${esc(q.tag)}</span></div><div class="bar"><span style="width:${(position+1)/list.length*100}%"></span></div><div class="prompt">${esc(q.prompt)}</div>${controls}${fb}${submitted&&q.evidence?`<div class="evidence"><strong>回到原文找依据</strong><div class="en space">${esc(q.evidence)}</div></div>`:''}<div class="pager"><button id="prevQ" ${position===0?'disabled':''}>上一题</button>${submitted?`<button id="nextQ" class="primary">${position===list.length-1?'查看本关结果':'下一题'}</button>`:'<button id="submit" class="primary">确认答案</button>'}</div><div class="questiondots" aria-label="练习进度">${list.map((x,i)=>`<span class="dot ${record(x)?li===4?'recorded':record(x).correct?'good':'wrong':''} ${position===i?'current':''}"></span>`).join('')}</div><details class="teacher"><summary>课堂提示</summary><p>${li===4?'先让学生独立完成检测。结束后抽查答对题的理由，检查是否理解；错题再回到对应页码讲解。错题重练保留首次成绩。':'选择后请学生解释意思。若答错，先让他指出是哪一个词或结构不理解，再看讲解。错题重练保留首次成绩。'}</p></details></section>`);
