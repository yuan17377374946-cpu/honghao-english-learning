function bindReadTeaching(){if(li>=5){if($('#toggleReadCN'))$('#toggleReadCN').onclick=()=>{readingHideCN=!readingHideCN;teach()};if($('#markRead'))$('#markRead').onclick=()=>{state.seen['reading-20261012-'+teachIndex]=!state.seen['reading-20261012-'+teachIndex];save();teach()};document.querySelectorAll('[data-teachjump]').forEach(b=>b.onclick=()=>{teachIndex=+b.dataset.teachjump;teach();window.scrollTo({top:0,behavior:'instant'})})}}

function home(){
 stage='home';document.documentElement.style.setProperty('--accent','#2557b9');
 const n=CORE.map(nums),total=n.reduce((a,v)=>a+v.done,0),cleared=n.filter((v,i)=>v.mastered===CORE[i].questions.length).length;
 $('#app').innerHTML=`<section class="hero"><div class="hero-copy"><span class="mission-kicker">UNIT 03 / GRAMMAR EXPEDITION</span><h2>宏仁，准备出发！<br>开启你的<em>语法星际任务</em></h2><p class="hero-description">先认词，再学规则。把课文里的句子变成你的本领，一起点亮四颗语法星球。</p><div class="hero-chips"><span>4 颗任务星球</span><span>72 道练习</span><span>随时继续挑战</span></div></div>${spaceScene()}</section>
 <div class="dashboard"><div class="stat-card"><span class="stat-icon">${icon('flag')}</span><div><div class="stat-value">${cleared}<small> / 4</small></div><div class="stat-label">已练熟的星球</div></div></div><div class="stat-card"><span class="stat-icon">${icon('rocket')}</span><div><div class="stat-value">${total}<small> / 72</small></div><div class="stat-label">已完成的练习</div></div></div><div class="stat-card badge-stat"><div><div class="stat-value" style="font-size:17px">我的探险徽章</div><div class="stat-label">练熟一关，点亮一枚</div></div><div class="badge-row">${MISSIONS.slice(0,4).map((m,i)=>`<span class="mini-badge ${n[i].mastered===CORE[i].questions.length?'earned':''}" title="${esc(m.name)}${n[i].mastered===CORE[i].questions.length?'：已获得':'：本关全部练熟后获得'}" aria-label="${esc(m.name)}，${n[i].mastered===CORE[i].questions.length?'已获得':'未获得'}">${m.symbol}</span>`).join('')}</div></div></div>
 ${readingEntry()}
 <section class="card diagnostic-entry"><div class="flex between"><div><div class="mission-no">特别任务 / p26—27七句背诵</div><h2 style="margin:0;font-size:24px">七句背诵检测</h2><p class="muted" style="margin:7px 0 0">p26 · B Read and complete　｜　p27 · C Read and order</p><p class="small" style="margin:7px 0 0">20 道选择题：词组 7 题 · 句意 7 题 · 运用 6 题。先独立作答，结束后看答案。</p></div><div class="diagnostic-actions"><span class="pill">已答 ${nums(TEST).done}/20</span><button id="sentenceTestBtn" class="primary">${nums(TEST).done===20?'查看检测结果':nums(TEST).done?'继续检测 →':'开始检测 →'}</button>${nums(TEST).wrong&&nums(TEST).done===20?`<button id="sentenceWrongBtn">再练错题 ${nums(TEST).wrong}</button>`:''}</div></div></section>
 <div class="section-head"><div><h2>选择你的下一站</h2><p>四关都可以直接打开，按课堂进度慢慢练。</p></div><span class="map-caption">MISSION MAP / 01—04</span></div><div class="homeguide"><span>① 整体认词</span><span>② 看例子、学规则</span><span>③ 不计分小检查</span><span>④ 独立练习</span></div>
 <div class="homegrid">${CORE.map((l,i)=>{const v=n[i],m=MISSIONS[i],won=v.mastered===l.questions.length;return `<article class="card level" style="--accent:${l.color};--planet-pale:${m.pale}"><div class="planet-head"><div><div class="mission-no">${esc(m.planet)}</div><h3>${esc(l.name)}</h3><p class="muted">${esc(l.short)}</p></div>${planet(i)}</div><div class="mission-status"><span>练习进度 · ${v.done}/${l.questions.length}</span><b>${won?'★ 徽章已点亮':v.done?'探索进行中':'等待出发'}</b></div><div class="bar"><span style="width:${v.done/l.questions.length*100}%"></span></div><p class="small">首次答对 ${v.first} 题 · 当前掌握 ${v.mastered} 题</p><div class="flex"><button class="primary enter" data-i="${i}">先学词语 →</button><button class="resume" data-i="${i}">进入练习</button>${v.wrong?`<button class="wrongbtn" data-i="${i}">再练错题 · ${v.wrong} 题</button>`:''}</div></article>`}).join('')}</div>
 <div class="mission-help">${robot()}<div><strong>小助手提醒：学懂，比冲得快更重要。</strong><p>单词听写先在句乐部完成。每关先说清楚意思，再自己造句；没做完的题，下次可以继续。</p></div></div>
 <details class="teacher"><summary>教师课堂提示与学习记录</summary><p>先在句乐部听写。每关认词时抽查含义，讲例句时让学生指出“谁、动作、对象”。选择题答对后仍要说出句意；改句、排序题检查是否能独立运用。</p><p>72题是一套完整练习，不用一节课做完。错题重练不会覆盖首次成绩；重新练整关会开始新一轮记录。全部题目练熟后获得本关徽章，重新练整关时徽章也会重新计算。</p><p>${CORE.map((l,i)=>`${i+1}. ${l.name}：首答 ${n[i].first}/${n[i].done}，当前 ${n[i].mastered}/${l.questions.length}。`).join('<br>')}</p><button id="resetAll" class="danger">清空全部学习记录</button></details>`;
 $('#readingStart').onclick=readingHub;$('#sentenceTestBtn').onclick=()=>open(4,'practice');if($('#sentenceWrongBtn'))$('#sentenceWrongBtn').onclick=()=>open(4,'practice','wrong');document.querySelectorAll('.enter').forEach(b=>b.onclick=()=>open(+b.dataset.i,'words'));document.querySelectorAll('.resume').forEach(b=>b.onclick=()=>open(+b.dataset.i,'practice'));document.querySelectorAll('.wrongbtn').forEach(b=>b.onclick=()=>open(+b.dataset.i,'practice','wrong'));$('#resetAll').onclick=()=>{if(confirm('确定清空全部学习记录（含新课与检测）？')){state={records:{},seen:{},last:null};save();home()}}
}
function open(i,s,m='normal'){li=i;stage=s;mode=m;teachIndex=0;selected=null;tiles=[];cacheQuiz=null;const last=state.last?.[i];position=0;if(s==='practice'&&m==='normal'){const qs=DATA[i].questions;const first=qs.findIndex(q=>!record(q));position=first<0?qs.length:first}render();window.scrollTo({top:0,behavior:'instant'})}
function frame(body){if(li>=5){readingFrame(body);return}const l=DATA[li];document.documentElement.style.setProperty('--accent',l.color);$('#app').innerHTML=`<div class="level-heading"><div class="level-title">${planet(li===4?0:li)}<div><div class="mission-no">${esc(MISSIONS[li].planet)}</div><h2>${esc(l.name)}</h2></div></div><span class="pill">${l.questions.length} 道练习</span></div>${li===4?'<div class="notice space small">出处：p26 B Read and complete；p27 C Read and order（游泳建议短文）。请先合上课本，独立作答；答案与解析在检测结束后显示。</div>':`<nav class="nav" aria-label="关卡学习环节">${[['words','1 先认词'],['teach','2 看例子'],['check','3 小检查'],['practice','4 闯关练习']].map(([s,t])=>`<button data-stage="${s}" class="${stage===s?'active':''}" ${stage===s?'aria-current="step"':''}>${t}</button>`).join('')}</nav>`}${body}`;document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;mode='normal';position=0;selected=null;tiles=[];cacheQuiz=null;render()});wireAudio()}
function render(){state.last??={};state.last[li]={stage,position};if(li>=5)state.readingLast={li,stage,teachIndex,position};save();if(stage==='words')words();else if(stage==='teach')teach();else if(stage==='check'||stage==='practice')quiz()}
function words(){const l=DATA[li];frame(`<section class="card"><div class="flex between"><h3 style="margin:0">把这一关的词整体认识一遍</h3><button id="toggleCN">${hideCN?'显示中文':'遮住中文，自己说'}</button></div><p class="space">${esc(l.intro)}</p><div class="wordgrid">${l.words.map(([en,cn,s,group],i)=>`${group&&group!==l.words[i-1]?.[3]?`<div class="wordgroup-title">${esc(group)}</div>`:''}<div class="word"><div class="flex between"><div class="en">${esc(en)}</div>${audio(en.includes('→')?en.split('→')[1]:en.split('/')[0])}</div><div class="cn ${hideCN?'hide':''}">${esc(cn)}</div><div class="sample">${esc(s)}</div></div>`).join('')}</div><div class="notice space">先读英文，再说中文。遮住中文后还能解释意思，就可以看例句了。</div><div class="pager"><button id="toTeach" class="primary">看例子，学规则</button></div></section>`);$('#toggleCN').onclick=()=>{hideCN=!hideCN;words()};$('#toTeach').onclick=()=>{stage='teach';render()}}
function teach(){const l=DATA[li],t=l.lessons[teachIndex];if(li>=5){state.readingLast={li,stage:'teach',teachIndex,position};save()}frame(`<section class="card"><div class="flex between"><span class="pill">讲解 ${teachIndex+1} / ${l.lessons.length}</span>${li>=5?`<button id="toggleReadCN">${readingHideCN?'显示中文':'遮住中文，自己解释'}</button>`:'<span class="muted">课文原句与补充例句分别标注</span>'}</div>${li>=5?`<div class="teach-jumps space">${l.lessons.map((x,i)=>`<button data-teachjump="${i}" class="${i===teachIndex?'active':''}" title="${esc(x.title)}">${i+1}</button>`).join('')}</div>`:''}<h2 class="space">${esc(t.title)}</h2><div class="notice">${esc(t.rule)}</div>${t.examples.map(e=>`<article class="example"><div class="flex between"><span class="source">${esc(e.source)}</span>${audio(e.en)}</div><div class="en space">${esc(e.en)}</div><div class="${li>=5?'read-cn '+(readingHideCN?'hide':''):''}">${esc(e.cn)}</div>${readingChunks(e)}<div class="note">${esc(e.note)}</div></article>`).join('')}${readingTeacher(t)}<details class="teacher"><summary>老师怎么检查理解</summary><p>先问“这几个词是什么意思？”再问“谁在做？动作是什么？涉及谁或什么？”让学生解释本页例句，再口头换一个主语或情境说一句。</p></details>${readingReadMark()}<div class="pager"><button id="prevTeach" ${teachIndex===0?'disabled':''}>上一组例子</button><button id="nextTeach" class="primary">${teachIndex===l.lessons.length-1?'做不计分小检查':'下一组例子'}</button></div></section>`);$('#prevTeach').onclick=()=>{teachIndex--;teach()};$('#nextTeach').onclick=()=>{if(teachIndex<l.lessons.length-1){teachIndex++;teach()}else{stage='check';position=0;cacheQuiz=null;render()}window.scrollTo({top:0,behavior:'instant'})};bindReadTeaching()}

function listQuiz(){if(!cacheQuiz){const l=DATA[li];cacheQuiz=stage==='check'?l.check:mode==='wrong'?l.questions.filter(q=>record(q)&&!record(q).correct):l.questions;if(mode==='wrong')cacheQuiz.forEach(q=>delete q._submitted)}return cacheQuiz}
function quiz(){const list=listQuiz();if(!list.length||position>=list.length){result(list);return}const q=list[position];let r=record(q);
if(mode==='wrong')r=q._submitted?record(q):null;
const submitted=!!r;const currentAnswer=r?.value;const answered=list.filter(x=>record(x)).length;
let controls='';if(q.type==='choice'){controls=`<div class="options">${q.options.map((o,i)=>`<button class="option ${(!submitted&&selected===i)||(submitted&&currentAnswer===o)?'selected':''}" data-choice="${i}" ${submitted?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`}else if(q.type==='text'){controls=`<label class="small" for="answerInput">${q.inputLabel?esc(q.inputLabel):q.prompt.includes('只填')?'输入单词':'输入完整英文句子（大小写和句末标点不影响评分）'}</label><textarea id="answerInput" class="answerbox" spellcheck="false" autocapitalize="off" ${submitted?'disabled':''} placeholder="${q.prompt.includes('只填')?'写出连接词':'在这里写英文…'}">${submitted?esc(currentAnswer):''}</textarea>${q.hint?`<details><summary>需要一点提示</summary><p>${esc(q.hint)}</p></details>`:''}`}else{controls=`<p class="muted">依次点击词块或步骤；点击上方已选的块可撤回。</p><div class="assembly" aria-label="已排好的答案">${submitted?`<div class="en">${esc(currentAnswer)}</div>`:tiles.length?tiles.map((idx,j)=>`<button data-remove="${j}">${esc(q.tokens[idx])}</button>`).join(''):'<span class="muted">答案会排在这里</span>'}</div><div class="tokenbank">${q.tokens.map((t,i)=>`<button data-token="${i}" ${submitted||tiles.includes(i)?'disabled':''}>${esc(t)}</button>`).join('')}</div>`}
const correctLabel=q.type==='text'?q.answer.join(' / '):q.answer;
const fb=submitted&&li===4?'<div class="notice space small" role="status">答案已记录。完成这一轮后统一查看解析。</div>':submitted?`<div class="feedback ${r.correct?'ok':'bad'}" role="status"><strong>${r.correct?'答对了，读出完整意思。':'先看清楚原因，再练一遍。'}</strong><p class="space"><b>参考答案：</b>${esc(correctLabel)}</p><p>${esc(q.explain)}</p></div>`:'';
frame(`<section class="card"><div class="flex between"><span class="pill">${stage==='check'?'不计分检查':mode==='wrong'?'错题重练':li===4?'背诵检测':'正式练习'} · ${position+1}/${list.length}</span><span class="muted">${esc(q.tag)}</span></div><div class="bar"><span style="width:${(position+1)/list.length*100}%"></span></div><div class="prompt">${esc(q.prompt)}</div>${controls}${fb}${submitted&&q.evidence?`<div class="evidence"><strong>回到原文找依据</strong><div class="en space">${esc(q.evidence)}</div></div>`:''}<div class="pager"><button id="prevQ" ${position===0?'disabled':''}>上一题</button>${submitted?`<button id="nextQ" class="primary">${position===list.length-1?'查看本关结果':'下一题'}</button>`:'<button id="submit" class="primary">确认答案</button>'}</div><div class="questiondots" aria-label="练习进度">${list.map((x,i)=>`<span class="dot ${record(x)?li===4?'recorded':record(x).correct?'good':'wrong':''} ${position===i?'current':''}"></span>`).join('')}</div><details class="teacher"><summary>课堂提示</summary><p>${li===4?'先让学生独立完成检测。结束后抽查答对题的理由，检查是否理解；错题再回到对应页码讲解。错题重练保留首次成绩。':'选择后请学生解释意思。若答错，先让他指出是哪一个词或结构不理解，再看讲解。错题重练保留首次成绩。'}</p></details></section>`);
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=+b.dataset.choice;quiz()});document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{tiles.push(+b.dataset.token);quiz()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{tiles.splice(+b.dataset.remove,1);quiz()});$('#prevQ').onclick=()=>{position--;selected=null;tiles=[];render()};if($('#nextQ'))$('#nextQ').onclick=()=>{position++;selected=null;tiles=[];render();window.scrollTo({top:0,behavior:'instant'})};if($('#submit'))$('#submit').onclick=()=>{let value;if(q.type==='choice'){if(selected===null){toast('先选一个答案。');return}value=q.options[selected]}else if(q.type==='order'){if(tiles.length!==q.tokens.length){toast('请把所有词块或步骤排完整。');return}value=tiles.map(i=>q.tokens[i]).join(' ')}else{value=$('#answerInput').value.trim();if(!value){toast('先写下你的答案。');return}}const accepted=q.type==='text'?q.answer:[q.answer],correct=accepted.some(a=>norm(a)===norm(value));const old=record(q);state.records[q.id]={value,correct,first:old?old.first:correct,attempts:(old?.attempts||0)+1};if(mode==='wrong')q._submitted=true;save();quiz()}}

function diagnosticReport(){
 return `<div class="diagnostic-breakdown">${['词组','句意','运用'].map(g=>{const qs=TEST.questions.filter(q=>q.group===g),done=qs.filter(q=>record(q)).length,first=qs.filter(q=>record(q)?.first).length,now=qs.filter(q=>record(q)?.correct).length;return `<div class="word"><strong>${g}</strong><div class="stat-value">${first}<small> / ${qs.length}</small></div><div class="small muted">首次答对 · 已答 ${done} 题<br>当前答对 ${now} 题</div></div>`}).join('')}</div><p class="small muted space">先看哪一类题需要再练，再让学生口头解释两三道答对题。选择题成绩需要结合口头解释一起判断。</p>${nums(TEST).done===20?`<details><summary>查看全部 20 题答案与解析</summary>${TEST.questions.map((q,i)=>`<article class="review"><span class="pill">${i+1} · ${esc(q.tag)}</span><p class="space">${esc(q.prompt)}</p><p><b>参考答案：</b>${esc(q.answer)}</p><p>${esc(q.explain)}</p></article>`).join('')}</details><details><summary>核对七句原文与出处（p26—27）</summary>${TEST.sources.map(([title,lines])=>`<h3 class="space">${esc(title)}</h3>${lines.map(([en,cn])=>`<article class="example"><div class="en">${esc(en)}</div><div>${esc(cn)}</div></article>`).join('')}`).join('')}</details>`:''}`
}

function result(list){const l=DATA[li];const checks=stage==='check';const complete=list.every(q=>record(q));const right=list.filter(q=>record(q)?.correct).length;const n=nums(l);const wrong=(checks?list:l.questions).filter(q=>record(q)&&!record(q).correct);frame(`<section class="card"><span class="pill">${checks?'认词与规则检查':li===4?'七句背诵检测结果':'本关学习记录'}</span><h2 class="space">${complete?'这一轮完成了':'还有题目等你完成'}</h2>${li!==4&&!checks&&n.mastered===l.questions.length?`<div class="badge-award"><div class="award-icon" aria-hidden="true">${MISSIONS[li].symbol}</div><div><strong>${esc(MISSIONS[li].name)}已点亮！</strong><p>这一关的题目都练熟了。试着换一个情境，自己说一句英文吧。</p></div></div>`:''}${li===4?diagnosticReport():''}<div class="resultgrid"><div><div class="score">${checks?right:n.first}<span style="font-size:22px;color:var(--muted)"> / ${checks?list.length:n.done}</span></div><div>${checks?'当前答对':'首次答对 / 已答题数'}</div></div><div><div class="score">${checks?wrong.length:n.mastered}<span style="font-size:22px;color:var(--muted)">${checks?'题':' / '+l.questions.length}</span></div><div>${checks?'需要再理解':'当前掌握（含重练后答对）'}</div></div></div><p>${checks?'能选对也能说清楚意思，就可以进入正式练习。':`已答 ${n.done}/${l.questions.length}；还需巩固 ${n.wrong}题。分数之外，也要能解释句意、自己组成句子。`}</p><div class="flex">${checks?'<button id="practiceNext" class="primary">进入正式练习</button>':''}${wrong.length?'<button id="retryWrong" class="primary">重练本关错题</button>':''}<button id="restart">${checks?'再做一次小检查':'新一轮练整关'}</button>${li>=5?'<button id="readResultHub">回新课四环节</button>':''}<button id="homeResult">回任务地图</button></div>${wrong.length?`<h3 class="space">先看错因，再去重练</h3>${wrong.map(q=>{const r=record(q);return `<article class="review"><span class="pill">${esc(q.tag)}</span><p class="space"><b>题目：</b>${esc(q.prompt)}</p><p><b>你的答案：</b>${esc(r.value)}</p><p><b>参考答案：</b>${esc(q.type==='text'?q.answer.join(' / '):q.answer)}</p><p><b>怎么改：</b>${esc(q.explain)}</p></article>`}).join('')}`:'<div class="notice space">本轮已答题目都答对了。再口头换一个句子试试，看看能不能独立说出来。</div>'}</section>`);if($('#practiceNext'))$('#practiceNext').onclick=()=>open(li,'practice');$('#homeResult').onclick=home;$('#restart').onclick=()=>{if(!confirm('开始新一轮会清除这一环节的答题记录，确定吗？'))return;for(const q of checks?l.check:l.questions){delete state.records[q.id];delete q._submitted}save();open(li,checks?'check':'practice')};if($('#retryWrong'))$('#retryWrong').onclick=()=>{if(checks){for(const q of wrong)delete state.records[q.id];open(li,'check')}else{for(const q of l.questions)delete q._submitted;open(li,'practice','wrong')}}}
$('#homeBtn').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();home()};home();
</script></body></html>
