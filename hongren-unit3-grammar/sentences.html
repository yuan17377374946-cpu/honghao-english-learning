<script id="lesson-data" type="application/json">{"groups": [{"title": "25—26 单元问题与运动准备", "start": 0, "count": 4}, {"title": "27 游泳步骤与读前问题", "start": 4, "count": 6}, {"title": "28—29 滑板受伤报道与安全建议", "start": 10, "count": 15}, {"title": "30 故事梳理与阅读讨论", "start": 25, "count": 5}, {"title": "31 乘地铁对话与头盔步骤", "start": 30, "count": 12}, {"title": "32 火灾报道与听力填空", "start": 42, "count": 13}, {"title": "33 情境讨论与写作", "start": 55, "count": 8}, {"title": "34—35 拓展阅读", "start": 63, "count": 11}, {"title": "36 阅读活动与单元总结", "start": 74, "count": 8}], "sentences": [{"en": "How should we protect ourselves?", "zh": "我们应该怎样保护自己？", "core": "How + should + we + protect + ourselves；问句有自己的语序。", "id": 0, "group": 0, "marks": {"subject": ["we"], "verb": ["should", "protect"], "object": ["ourselves"]}, "pattern": "question"}, {"en": "How can you protect yourself when you do sport?", "zh": "运动时，你怎样保护自己？", "core": "主问句 How can you protect yourself + 时间从句 when you do sport。", "id": 1, "group": 0, "marks": {"subject": ["you"], "verb": ["can", "protect", "do"], "object": ["yourself", "sport"]}, "pattern": "question"}, {"en": "We should ______ before doing exercise.", "zh": "我们应该在锻炼前……。", "core": "We + should + 动作；before doing exercise 只是时间补充。教材填空：warm up。", "id": 2, "group": 0, "marks": {"subject": ["We"], "verb": ["should"], "object": ["______"]}, "pattern": "modal"}, {"en": "When someone ______, we should try to help.", "zh": "有人……时，我们应该尽力帮助。", "core": "When someone gets hurt + we should try to help。教材填空：gets hurt。", "id": 3, "group": 0, "marks": {"subject": ["someone", "we"], "verb": ["should try", "gets hurt"], "object": ["to help"]}, "pattern": "clause"}, {"en": "Here are some swimming tips for you.", "zh": "这里有一些给你的游泳建议。", "core": "Here + are + some swimming tips；tips 才是主语，for you 作补充。", "id": 4, "group": 1, "marks": {"subject": ["some swimming tips"], "verb": ["are"], "object": []}, "pattern": "there"}, {"en": "First, put on your swimsuit and swimming cap.", "zh": "首先，穿上泳衣，戴上泳帽。", "core": "First + 祈使句 put on + 两个并列的名词短语。", "id": 5, "group": 1, "marks": {"subject": [], "verb": ["put on"], "object": ["your swimsuit", "swimming cap"]}, "pattern": "imperative"}, {"en": "Next, do warm-up exercises.", "zh": "接着，做热身运动。", "core": "Next + 祈使句 do + warm-up exercises。", "id": 6, "group": 1, "marks": {"subject": [], "verb": ["do"], "object": ["warm-up exercises"]}, "pattern": "imperative"}, {"en": "Then, put on your swimming goggles, so the water does not get into your eyes.", "zh": "然后，戴上泳镜，这样水就不会进入眼睛。", "core": "祈使句 put on ... + so + the water does not get ...；so 后另有主语和谓语。", "id": 7, "group": 1, "marks": {"subject": ["the water"], "verb": ["put on", "does not get"], "object": ["your swimming goggles"]}, "pattern": "clause"}, {"en": "Finally, you can get into the water and swim.", "zh": "最后，你可以下水游泳。", "core": "you + can + get into ... and swim；can 后有动作，两个动作共用 can。", "id": 8, "group": 1, "marks": {"subject": ["you"], "verb": ["can get", "swim"], "object": []}, "pattern": "modal"}, {"en": "When someone gets hurt, what can you do to help?", "zh": "有人受伤时，你能做什么来帮忙？", "core": "When 引导时间从句；what can you do 是主问句；to help 表目的。", "id": 9, "group": 1, "marks": {"subject": ["someone", "you"], "verb": ["gets hurt", "can do"], "object": []}, "pattern": "question"}, {"en": "Yesterday afternoon, Wang Hao, a 12-year-old boy from our school, broke his arm at the skatepark.", "zh": "昨天下午，我校一名12岁的男孩王浩在滑板公园摔伤了手臂。", "core": "主干 Wang Hao broke his arm；a 12-year-old boy ... 解释王浩的身份；时间和地点作补充。", "id": 10, "group": 2, "marks": {"subject": ["Wang Hao"], "verb": ["broke"], "object": ["his arm"]}, "pattern": "past"}, {"en": "He was in a game with his friends and went over a small stone on the road.", "zh": "他正和朋友们比赛，滑过了路上的一块小石头。", "core": "He + was ... and went ...；两个并列谓语，不要把 with his friends 当作动作。", "id": 11, "group": 2, "marks": {"subject": ["He"], "verb": ["was", "went"], "object": []}, "pattern": "past"}, {"en": "Wang Hao got hurt and broke his arm.", "zh": "王浩受伤了，摔伤了手臂。", "core": "Wang Hao + got hurt and broke his arm；两个动作共用主语。", "id": 12, "group": 2, "marks": {"subject": ["Wang Hao"], "verb": ["got hurt", "broke"], "object": ["his arm"]}, "pattern": "past"}, {"en": "Luckily, he didn't have more injuries, because he wore a helmet and pads.", "zh": "幸运的是，他没有受更多的伤，因为他戴了头盔和护具。", "core": "主句 he didn't have ... + because he wore ...；didn't 后 have 用原形。", "id": 13, "group": 2, "marks": {"subject": ["he"], "verb": ["didn't have", "wore"], "object": ["more injuries", "a helmet", "pads"]}, "pattern": "clause"}, {"en": "Xu Li, a friend of Wang Hao, called an ambulance.", "zh": "王浩的朋友徐立叫了救护车。", "core": "主干 Xu Li called an ambulance；a friend of Wang Hao 是人物说明。", "id": 14, "group": 2, "marks": {"subject": ["Xu Li"], "verb": ["called"], "object": ["an ambulance"]}, "pattern": "past"}, {"en": "The ambulance arrived soon.", "zh": "救护车很快就到了。", "core": "The ambulance + arrived；soon 补充时间。arrived 后不一定要接宾语。", "id": 15, "group": 2, "marks": {"subject": ["The ambulance"], "verb": ["arrived"], "object": []}, "pattern": "past"}, {"en": "First, the emergency workers checked Wang Hao's injuries.", "zh": "首先，急救人员检查了王浩的伤势。", "core": "the emergency workers + checked + Wang Hao's injuries；First 不代替主语。", "id": 16, "group": 2, "marks": {"subject": ["the emergency workers"], "verb": ["checked"], "object": ["Wang Hao's injuries"]}, "pattern": "past"}, {"en": "Then, they took him to the hospital for an X-ray.", "zh": "然后，他们带他到医院拍X光片。", "core": "they + took + him + to the hospital；him 是被带去的人，不能随意漏掉。", "id": 17, "group": 2, "marks": {"subject": ["they"], "verb": ["took"], "object": ["him"]}, "pattern": "past"}, {"en": "He is now resting at home.", "zh": "他现在正在家里休息。", "core": "He + is resting；now 和 at home 作补充。resting 单独不能充当这里的完整谓语。", "id": 18, "group": 2, "marks": {"subject": ["He"], "verb": ["is now resting"], "object": []}, "pattern": "doing"}, {"en": "Choose a safe place.", "zh": "选择安全的地方。", "core": "肯定祈使句：Choose + a safe place；省略的是 you。", "id": 19, "group": 2, "marks": {"subject": [], "verb": ["Choose"], "object": ["a safe place"]}, "pattern": "imperative"}, {"en": "Always warm up first.", "zh": "总是先热身。", "core": "祈使句：warm up 是动作；Always、first 表频率和顺序。", "id": 20, "group": 2, "marks": {"subject": [], "verb": ["warm up"], "object": []}, "pattern": "imperative"}, {"en": "Follow the sports rules.", "zh": "遵守运动规则。", "core": "祈使句：Follow + the sports rules。", "id": 21, "group": 2, "marks": {"subject": [], "verb": ["Follow"], "object": ["the sports rules"]}, "pattern": "imperative"}, {"en": "Take a break when you are tired.", "zh": "累了就休息一下。", "core": "祈使句 Take a break + 时间从句 when you are tired；从句里 tired 前需要 are。", "id": 22, "group": 2, "marks": {"subject": ["you"], "verb": ["Take", "are"], "object": ["a break"]}, "pattern": "clause"}, {"en": "Drink some water.", "zh": "喝些水。", "core": "祈使句：Drink + some water。", "id": 23, "group": 2, "marks": {"subject": [], "verb": ["Drink"], "object": ["some water"]}, "pattern": "imperative"}, {"en": "How did Wang Hao protect himself?", "zh": "王浩是怎样保护自己的？", "core": "How + did + Wang Hao + protect + himself；did 后 protect 用原形。", "id": 24, "group": 2, "marks": {"subject": ["Wang Hao"], "verb": ["did", "protect"], "object": ["himself"]}, "pattern": "question"}, {"en": "Wang Hao ______ ______.", "zh": "王浩……。", "core": "教材故事图填空；可按原文补 got hurt，或按空格要求写出受伤事件；主语后需有谓语。", "id": 25, "group": 3, "marks": {"subject": ["Wang Hao"], "verb": [], "object": []}, "pattern": "past"}, {"en": "The emergency workers checked Wang Hao's injuries and took him to the ______ for an X-ray.", "zh": "急救人员检查了王浩的伤势，并带他去……拍X光片。", "core": "主语共用：the emergency workers + checked ... and took ...；教材填空 hospital。", "id": 26, "group": 3, "marks": {"subject": ["The emergency workers"], "verb": ["checked", "took"], "object": ["Wang Hao's injuries", "him"]}, "pattern": "past"}, {"en": "Wang Hao is now resting ______.", "zh": "王浩现在正在……休息。", "core": "Wang Hao + is resting 已有主干；教材地点填空 at home。", "id": 27, "group": 3, "marks": {"subject": ["Wang Hao"], "verb": ["is now resting"], "object": []}, "pattern": "doing"}, {"en": "What safety tips did you learn about from the text?", "zh": "你从文章里学到了哪些安全建议？", "core": "What safety tips + did + you + learn about ...；did 后用 learn。", "id": 28, "group": 3, "marks": {"subject": ["you"], "verb": ["did", "learn about"], "object": ["What safety tips"]}, "pattern": "question"}, {"en": "What other safety tips do you know about doing sport?", "zh": "关于运动，你还知道哪些安全建议？", "core": "What other safety tips + do + you + know ...；other 表“其他”。", "id": 29, "group": 3, "marks": {"subject": ["you"], "verb": ["do", "know"], "object": ["What other safety tips"]}, "pattern": "question"}, {"en": "How do you take the underground?", "zh": "你怎样乘坐地铁？", "core": "How + do + you + take + the underground。", "id": 30, "group": 4, "marks": {"subject": ["you"], "verb": ["do", "take"], "object": ["the underground"]}, "pattern": "question"}, {"en": "Let me show you!", "zh": "让我给你示范吧！", "core": "Let + me + show + you；let 后接宾格 me，show 用原形。", "id": 31, "group": 4, "marks": {"subject": [], "verb": ["Let", "show"], "object": ["me", "you"]}, "pattern": "imperative"}, {"en": "First, find the right place.", "zh": "首先，找到正确的位置。", "core": "First + 祈使句 find + the right place。", "id": 32, "group": 4, "marks": {"subject": [], "verb": ["find"], "object": ["the right place"]}, "pattern": "imperative"}, {"en": "Next, wait for the train behind the yellow line.", "zh": "接着，在黄线后面等车。", "core": "祈使句 wait for the train + 地点 behind the yellow line。", "id": 33, "group": 4, "marks": {"subject": [], "verb": ["wait for"], "object": ["the train"]}, "pattern": "imperative"}, {"en": "Finally, get on the train when it arrives.", "zh": "最后，列车到达时上车。", "core": "祈使句 get on the train + 时间从句 when it arrives；不能把 when it arrives 单独当成普通陈述句。", "id": 34, "group": 4, "marks": {"subject": ["it"], "verb": ["get on", "arrives"], "object": ["the train"]}, "pattern": "clause"}, {"en": "But where's the driver?", "zh": "可是司机在哪里？", "core": "where's = where is；Where + is + the driver。", "id": 35, "group": 4, "marks": {"subject": ["the driver"], "verb": ["'s"], "object": []}, "pattern": "question"}, {"en": "Ha ha! This is a driverless train.", "zh": "哈哈！这是一列无人驾驶列车。", "core": "Ha ha 是感叹；完整陈述句为 This + is + a driverless train。", "id": 36, "group": 4, "marks": {"subject": ["This"], "verb": ["is"], "object": ["a driverless train"]}, "pattern": "be"}, {"en": "Choose a helmet in your size.", "zh": "选择适合你尺寸的头盔。", "core": "祈使句 Choose a helmet + in your size；不是只有 in your size。", "id": 37, "group": 4, "marks": {"subject": [], "verb": ["Choose"], "object": ["a helmet"]}, "pattern": "imperative"}, {"en": "Check the helmet.", "zh": "检查头盔。", "core": "祈使句 Check + the helmet。", "id": 38, "group": 4, "marks": {"subject": [], "verb": ["Check"], "object": ["the helmet"]}, "pattern": "imperative"}, {"en": "Always check your helmet before using.", "zh": "使用前一定要检查头盔。", "core": "祈使句 check your helmet + before using；这里 using 后的 it 可从语境理解。", "id": 39, "group": 4, "marks": {"subject": [], "verb": ["check"], "object": ["your helmet"]}, "pattern": "imperative"}, {"en": "Put on the helmet.", "zh": "戴上头盔。", "core": "祈使句 Put on + the helmet；put on 不要拆成只剩 put。", "id": 40, "group": 4, "marks": {"subject": [], "verb": ["Put on"], "object": ["the helmet"]}, "pattern": "imperative"}, {"en": "Make sure it will not fall.", "zh": "确保它不会掉下来。", "core": "祈使句 Make sure + 内容从句 it will not fall；will not 后需有 fall。", "id": 41, "group": 4, "marks": {"subject": ["it"], "verb": ["Make sure", "will not fall"], "object": []}, "pattern": "clause"}, {"en": "There was a fire in a building.", "zh": "一栋楼里发生了火灾。", "core": "There + was + a fire + 地点；there be 用来引出“有、发生”。", "id": 42, "group": 5, "marks": {"subject": ["a fire"], "verb": ["was"], "object": []}, "pattern": "there"}, {"en": "The news reporter Zhou Yan came to interview Li Jie.", "zh": "新闻记者周燕前来采访李杰。", "core": "主语 the news reporter Zhou Yan + came；to interview Li Jie 表目的。", "id": 43, "group": 5, "marks": {"subject": ["The news reporter Zhou Yan"], "verb": ["came"], "object": ["Li Jie"]}, "pattern": "past"}, {"en": "What did Li Jie and other people do to help?", "zh": "李杰和其他人做了什么来帮忙？", "core": "What + did + Li Jie and other people + do；to help 表目的。", "id": 44, "group": 5, "marks": {"subject": ["Li Jie and other people"], "verb": ["did", "do"], "object": []}, "pattern": "question"}, {"en": "First, Li Jie called 119 with his ______.", "zh": "首先，李杰用他的……拨打了119。", "core": "Li Jie + called + 119 + with ...；保留教材听力空格，不能只根据图片把填空答案当成已核实原文。", "id": 45, "group": 5, "marks": {"subject": ["Li Jie"], "verb": ["called"], "object": ["119"]}, "pattern": "past"}, {"en": "He told them the address of the building.", "zh": "他告诉了他们这栋楼的地址。", "core": "He + told + them + the address ...；告诉“谁”和“什么”都写出来。", "id": 46, "group": 5, "marks": {"subject": ["He"], "verb": ["told"], "object": ["them", "the address of the building"]}, "pattern": "past"}, {"en": "Next, he called for ______.", "zh": "接着，他呼叫……。", "core": "he + called for + 内容；保留教材听力空格。", "id": 47, "group": 5, "marks": {"subject": ["he"], "verb": ["called for"], "object": ["______"]}, "pattern": "past"}, {"en": "Then, they made loud noises to warn people inside.", "zh": "然后，他们发出很大的声响，提醒里面的人。", "core": "they + made + loud noises；to warn people inside 表目的，不能代替主句。", "id": 48, "group": 5, "marks": {"subject": ["they"], "verb": ["made"], "object": ["loud noises"]}, "pattern": "past"}, {"en": "Li Jie told them not to use the ______.", "zh": "李杰告诉他们不要使用……。", "core": "Li Jie + told + them + not to use ...；保留教材听力空格。", "id": 49, "group": 5, "marks": {"subject": ["Li Jie"], "verb": ["told"], "object": ["them"]}, "pattern": "past"}, {"en": "______ came very soon.", "zh": "……很快就来了。", "core": "空格处需要主语；came 是谓语；保留教材听力空格。", "id": 50, "group": 5, "marks": {"subject": ["______"], "verb": ["came"], "object": []}, "pattern": "past"}, {"en": "Finally, the firefighters put out the fire.", "zh": "最后，消防员扑灭了大火。", "core": "the firefighters + put out + the fire；First/Finally 只表示顺序。", "id": 51, "group": 5, "marks": {"subject": ["the firefighters"], "verb": ["put out"], "object": ["the fire"]}, "pattern": "past"}, {"en": "Why does the reporter think Li Jie was brave?", "zh": "记者为什么认为李杰很勇敢？", "core": "主问句 Why does the reporter think ...；内容从句 Li Jie was brave。", "id": 52, "group": 5, "marks": {"subject": ["the reporter", "Li Jie"], "verb": ["does", "think", "was"], "object": []}, "pattern": "question"}, {"en": "Li Jie saw the fire.", "zh": "李杰看到了火灾。", "core": "Li Jie + saw + the fire；saw 是 see 的过去式。", "id": 53, "group": 5, "marks": {"subject": ["Li Jie"], "verb": ["saw"], "object": ["the fire"]}, "pattern": "past"}, {"en": "Do you know what to do if there is a fire in your building?", "zh": "如果你所在的楼里发生火灾，你知道该怎么做吗？", "core": "主问句 Do you know ...；what to do 是所知道的内容；if there is ... 表条件。", "id": 54, "group": 5, "marks": {"subject": ["you"], "verb": [{"text": "Do", "occurrence": 0}, "know", "is"], "object": ["a fire"]}, "pattern": "question"}, {"en": "How can people protect themselves?", "zh": "人们怎样保护自己？", "core": "How + can + people + protect + themselves；people 与 themselves 对应。", "id": 55, "group": 6, "marks": {"subject": ["people"], "verb": ["can", "protect"], "object": ["themselves"]}, "pattern": "question"}, {"en": "A little girl is lost in the city.", "zh": "一个小女孩在城里迷路了。", "core": "A little girl + is + lost；lost 表状态，不能漏 is。", "id": 56, "group": 6, "marks": {"subject": ["A little girl"], "verb": ["is"], "object": ["lost"]}, "pattern": "be"}, {"en": "There is a fire in the park.", "zh": "公园里发生了火灾。", "core": "There + is + a fire + 地点；in the park 自己不是完整句。", "id": 57, "group": 6, "marks": {"subject": ["a fire"], "verb": ["is"], "object": []}, "pattern": "there"}, {"en": "Ask someone for help.", "zh": "向他人求助。", "core": "祈使句 Ask + someone + for help；ask someone for help 作整体理解。", "id": 58, "group": 6, "marks": {"subject": [], "verb": ["Ask"], "object": ["someone"]}, "pattern": "imperative"}, {"en": "Call 110.", "zh": "拨打110。", "core": "祈使句：Call + 110。", "id": 59, "group": 6, "marks": {"subject": [], "verb": ["Call"], "object": ["110"]}, "pattern": "imperative"}, {"en": "Call 119.", "zh": "拨打119。", "core": "祈使句：Call + 119。", "id": 60, "group": 6, "marks": {"subject": [], "verb": ["Call"], "object": ["119"]}, "pattern": "imperative"}, {"en": "What should she do?", "zh": "她应该做什么？", "core": "What + should + she + do；回答普通陈述句可用 She should + 动作。", "id": 61, "group": 6, "marks": {"subject": ["she"], "verb": ["should", "do"], "object": []}, "pattern": "question"}, {"en": "When you see a fire in the park, what should you do?", "zh": "当你看到公园里发生火灾时，你应该怎么做？", "core": "When you see ... 是时间从句；what should you do 是主问句。", "id": 62, "group": 6, "marks": {"subject": ["you"], "verb": ["see", "should", "do"], "object": ["a fire"]}, "pattern": "question"}, {"en": "Sit down and lean forward.", "zh": "坐下，身体前倾。", "core": "祈使句：Sit down and lean forward；and 连接两个动作。", "id": 63, "group": 7, "marks": {"subject": [], "verb": ["Sit down", "lean"], "object": []}, "pattern": "imperative"}, {"en": "Press your nose for 5 to 10 minutes.", "zh": "按压鼻子5到10分钟。", "core": "祈使句 Press your nose + 时间长度 for ...。", "id": 64, "group": 7, "marks": {"subject": [], "verb": ["Press"], "object": ["your nose"]}, "pattern": "imperative"}, {"en": "First, take your shoe off.", "zh": "首先，脱下鞋子。", "core": "祈使句 take ... off；教材将 your shoe 放在短语中间。", "id": 65, "group": 7, "marks": {"subject": [], "verb": ["take"], "object": ["your shoe"]}, "pattern": "imperative"}, {"en": "Next, put a cool cloth on your ankle for 15 to 20 minutes.", "zh": "接着，把凉布放在脚踝上15到20分钟。", "core": "put + 物品 a cool cloth + 位置 on your ankle；此处只写 Put a cool cloth 没把放哪里交代完整。", "id": 66, "group": 7, "marks": {"subject": [], "verb": ["put"], "object": ["a cool cloth"]}, "pattern": "imperative"}, {"en": "Then, lift up your ankle and rest it.", "zh": "然后，抬高脚踝，让它休息。", "core": "祈使句 lift up ... and rest it；it 指 your ankle。", "id": 67, "group": 7, "marks": {"subject": [], "verb": ["lift up", "rest"], "object": ["your ankle", "it"]}, "pattern": "imperative"}, {"en": "Clean the bite.", "zh": "清洗被咬的伤口。", "core": "祈使句 Clean + the bite。", "id": 68, "group": 7, "marks": {"subject": [], "verb": ["Clean"], "object": ["the bite"]}, "pattern": "imperative"}, {"en": "If it is bleeding, press it.", "zh": "如果伤口在流血，就按压它。", "core": "条件从句 If it is bleeding + 主句祈使句 press it。", "id": 69, "group": 7, "marks": {"subject": [{"text": "it", "occurrence": 0}], "verb": ["is bleeding", "press"], "object": [{"text": "it", "occurrence": 1}]}, "pattern": "clause"}, {"en": "When it stops bleeding, put some medicine on it.", "zh": "停止流血后，在伤口上涂些药。", "core": "时间从句 When it stops bleeding + 主句祈使句 put ... on it；stop 后接 doing。", "id": 70, "group": 7, "marks": {"subject": [{"text": "it", "occurrence": 0}], "verb": ["stops bleeding", "put"], "object": ["some medicine", {"text": "it", "occurrence": 1}]}, "pattern": "clause"}, {"en": "Cover the bite with a clean cloth.", "zh": "用干净的布盖住伤口。", "core": "祈使句 cover + 物品 + with + 材料。", "id": 71, "group": 7, "marks": {"subject": [], "verb": ["Cover"], "object": ["the bite"]}, "pattern": "imperative"}, {"en": "You should go to see the doctor after getting first aid.", "zh": "接受急救后，你应该去看医生。", "core": "You + should + go ...；to see the doctor 表目的；after getting first aid 表时间。", "id": 72, "group": 7, "marks": {"subject": ["You"], "verb": ["should go"], "object": []}, "pattern": "modal"}, {"en": "CLICK HERE TO JOIN THE FIRST AID CLUB NOW!", "zh": "现在点击这里，加入急救俱乐部！", "core": "祈使句 Click here + 目的 to join ...；大写排版不改变句子结构。", "id": 73, "group": 7, "marks": {"subject": [], "verb": ["CLICK"], "object": []}, "pattern": "imperative"}, {"en": "Look at the children.", "zh": "看看这些孩子。", "core": "祈使句 Look at + the children。", "id": 74, "group": 8, "marks": {"subject": [], "verb": ["Look at"], "object": ["the children"]}, "pattern": "imperative"}, {"en": "What should they do?", "zh": "他们应该做什么？", "core": "What + should + they + do。", "id": 75, "group": 8, "marks": {"subject": ["they"], "verb": ["should", "do"], "object": []}, "pattern": "question"}, {"en": "Put a cool cloth on the ankle.", "zh": "把凉布放在脚踝上。", "core": "祈使句 put + 物品 + 位置；与第34页 your ankle 的表达作比较。", "id": 76, "group": 8, "marks": {"subject": [], "verb": ["Put"], "object": ["a cool cloth"]}, "pattern": "imperative"}, {"en": "Lift up the ankle.", "zh": "抬高脚踝。", "core": "祈使句 Lift up + the ankle。", "id": 77, "group": 8, "marks": {"subject": [], "verb": ["Lift up"], "object": ["the ankle"]}, "pattern": "imperative"}, {"en": "Press the nose.", "zh": "按压鼻子。", "core": "祈使句 Press + the nose。", "id": 78, "group": 8, "marks": {"subject": [], "verb": ["Press"], "object": ["the nose"]}, "pattern": "imperative"}, {"en": "What other first aid tips do you know?", "zh": "你还知道哪些其他急救建议？", "core": "What other first aid tips + do + you + know。", "id": 79, "group": 8, "marks": {"subject": ["you"], "verb": ["do", "know"], "object": ["What other first aid tips"]}, "pattern": "question"}, {"en": "We should wear safety equipment when we do sport.", "zh": "运动时，我们应该穿戴安全装备。", "core": "We + should + wear + safety equipment；when we do sport 表时间。", "id": 80, "group": 8, "marks": {"subject": ["We", "we"], "verb": ["should wear", "do"], "object": ["safety equipment", "sport"]}, "pattern": "clause"}, {"en": "We should learn some first aid skills.", "zh": "我们应该学习一些急救技能。", "core": "We + should + learn + some first aid skills。", "id": 81, "group": 8, "marks": {"subject": ["We"], "verb": ["should learn"], "object": ["some first aid skills"]}, "pattern": "modal"}]}</script>

function ranges(q){const a=[];for(const role of ['subject','verb','object'])for(const spec of q.marks[role]||[]){const token=typeof spec==='string'?spec:spec.text;if(!token)continue;let occurrence=0;const rx=new RegExp(token.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');let m;while((m=rx.exec(q.en))!==null){const before=q.en[m.index-1]||'',after=q.en[m.index+token.length]||'';if(/[a-z]/i.test(token[0])&&/[a-z]/i.test(before))continue;if(/[a-z]/i.test(token.at(-1))&&/[a-z]/i.test(after))continue;if(typeof spec==='object'&&occurrence++!==spec.occurrence)continue;a.push({start:m.index,end:m.index+token.length,role})}}a.sort((x,y)=>x.start-y.start||y.end-x.end);const b=[];let end=-1;for(const x of a)if(x.start>=end){b.push(x);end=x.end}return b}
function markup(q,parts=S.parts,mask=S.mask){let html='',pos=0;for(const r of ranges(q)){html+=esc(q.en.slice(pos,r.start));const t=q.en.slice(r.start,r.end);html+=mask&&r.role==='verb'?`<span class="masked" data-word="${esc(t)}" tabindex="0" role="button" aria-label="显示这个谓语">${'_'.repeat(Math.max(3,Math.min(10,t.length)))}</span>`:`<span class="${r.role}">${esc(t)}</span>`;pos=r.end}html+=esc(q.en.slice(pos));return html}

function renderWriting(){
 let body='';
 if(W.page===0)body=`<span class="pill">教材第33页 · C Think and write</span><div class="writeQuestion">When you see a fire in the park, what should you do?</div><p class="translation">在公园看到火灾，你应该怎么做？</p><div class="writeCard">先让他说：题目给了什么情境？要写哪些内容？应该用什么语气？</div><div class="controls"><button class="primary" data-write-toggle="task">${W.task?'收起审题提示':'展开审题提示'}</button><button data-jump="57">回到本页情境句 ↗</button></div>${W.task?`<div class="writeGrid revealPanel"><div class="writeCard"><b>情境</b><br>在公园看到火灾。<br><b>任务</b><br>写出应该采取的行动和建议。</div><div class="writeCard"><b>句型</b><br>We should + 动词原形…<br>We shouldn’t + 动词原形…<br><b>顺序</b><br>First, … Next, … Then, …</div></div>`:''}<div class="writeNote">教材给出 First、Next 和 call、ask 等提示词，没有规定字数。课堂可以先练4—6句，再根据他的表达调整。</div>`;
 if(W.page===1)body=`<span class="pill">先用中文讲清楚，再想英文</span><h2 class="writeCN">看到火灾后，你会按什么顺序做？</h2><div class="writeGrid"><div class="writeCard"><b>先做什么？</b><br>怎样让自己处在安全的位置？</div><div class="writeCard"><b>接着怎么办？</b><br>拨打什么电话？应该在哪里打？</div><div class="writeCard"><b>还可以找谁？</b><br>怎么请求帮助？</div><div class="writeCard"><b>什么不能做？</b><br>怎样避免再次靠近危险？</div></div><div class="controls"><button class="primary" data-write-toggle="plan">${W.plan?'收起参考思路':'看一组参考思路'}</button></div>${W.plan?`<div class="revealPanel writeCard">保持冷静 → 远离火源 → 在安全处拨打119 → 向成年人求助 → 不靠近火源，在安全处等候。<p class="subtle">允许用自己的合理顺序表达。先说出意思，再选择需要的英文词组。</p></div>`:''}`;
 if(W.page===2){const x=writeSentences[W.sentence];body=`<div class="stagehead"><span class="pill">先独立说，再逐层看提示</span><span>第 ${W.sentence+1} / ${writeSentences.length} 句</span></div><p class="writeCN">${esc(x.cn)}</p><div class="writeCard">先口头说一整句。卡住时，再点一次提示。</div>${W.reveal>=1?`<div class="revealPanel"><div class="label">先想句子结构</div><p class="rule">${esc(x.hint)}</p></div>`:''}${W.reveal>=2?`<div class="wordBank">${x.chunks.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}${W.reveal>=3?`<div class="revealPanel"><div class="label">一种完整表达</div><div class="writeExample writeGood">${esc(x.en)}</div><p class="core">${esc(x.why)}</p></div>`:''}<div class="controls">${W.reveal<3?`<button class="primary" data-write-action="reveal">${['给一点结构提示','看看词块','核对完整句'][W.reveal]}</button>`:''}<button data-write-action="hideSentence">重新遮住再说</button><button data-write-action="sentencePrev" ${W.sentence===0?'disabled':''}>← 前一句</button><button data-write-action="sentenceNext" ${W.sentence===5?'disabled':''}>后一句 →</button>${W.reveal===3?`<button data-speak="${esc(x.en)}">▷ 朗读这一句</button>`:''}</div>`;}
 if(W.page===3)body=`<span class="pill">把提示收起来，自己写一遍</span><div class="writeQuestion">What should we do when we see a fire in the park?</div><p class="translation">先试着写4—6句，把步骤交代完整。可以在纸上写，再读给老师听；也可以直接输入下面。</p><textarea class="writeDraft" id="writeDraft" aria-label="我的作文草稿" placeholder="在这里写自己的短文，或在纸上完成……">${esc(W.draft)}</textarea><div class="subtle" id="writeCount">${W.draft.trim()?W.draft.trim().split(/\s+/).length:0} 个英文词（仅计数，不自动判分） · 输入内容保存在本机浏览器</div><div class="controls"><button data-write-toggle="frame">${W.frame?'收起结构':'需要结构提示'}</button><button data-write-toggle="bank">${W.bank?'收起词组':'需要词组提示'}</button><button data-write-toggle="model">${W.model?'收起参考短文':'写完后看参考短文'}</button></div>${W.frame?`<div class="revealPanel writeCard">开头：遇到什么情况？<br>First, we should …<br>Next, we should …<br>Then, we should …<br>We shouldn’t …<br>最后：补一条安全建议。</div>`:''}${W.bank?`<div class="revealPanel wordBank">${['stay calm','move away from','call 119','from a safe place','ask an adult for help','go near the fire','wait'].map(t=>`<span>${t}</span>`).join('')}</div>`:''}${W.model?`<div class="revealPanel">${writeModel()}</div>`:''}`;
 if(W.page===4)body=`<span class="pill">读自己的作文，逐条检查</span><h2 class="writeCN">每一句，都能解释清楚自己写了什么。</h2><div class="writeChecks">${writeCheckNames.map((t,i)=>`<label><input type="checkbox" data-write-check="${i}" ${W.checks.has(i)?'checked':''}><span>${t}</span></label>`).join('')}</div><div class="writeCard">老师追问：这句话的主语是谁？完整动作在哪里？顺序词后面把事情说完了吗？</div><div class="controls"><button data-write-toggle="errors">${W.errors?'收起改错对照':'看看容易写成的半句'}</button><button data-write-toggle="model">${W.model?'收起参考短文':'对照参考短文'}</button></div>${W.errors?`<div class="revealPanel"><p class="writeExample">First, away from the fire.</p><p class="writeExample writeGood">First, we should move away from the fire.</p><p class="core">First 只是顺序词，补出主语 we 和完整动作 should move。</p><p class="writeExample">Next, we should to call 119.</p><p class="writeExample writeGood">Next, we should call 119.</p><p class="core">should 后接动词原形 call，去掉 to。</p><p class="writeExample">When we see a fire in the park.</p><p class="writeExample writeGood">When we see a fire in the park, we should stay calm.</p><p class="core">when 从句交代情况，还要接上主句，说明应该怎么办。</p></div>`:''}${W.model?`<div class="revealPanel">${writeModel()}</div>`:''}`;
 $('#main').innerHTML=`<div class="topline"><div><div class="eyebrow">Unit 3 / 教材第33页写作任务</div><h1 class="unitTitle">在公园看到火灾，怎么保护自己？</h1></div></div><nav class="writeSteps" aria-label="作文步骤">${writeStepNames.map((n,i)=>`<button data-write-page="${i}" class="${W.page===i?'active':''}" aria-current="${W.page===i?'step':'false'}">${n}</button>`).join('')}</nav><article class="stage">${body}</article><div class="below"><div class="nav"><button data-write-action="prev" ${W.page===0?'disabled':''}>← 上一步</button><button class="primary" data-write-action="next" ${W.page===4?'disabled':''}>下一步 →</button></div><span class="keyboard">← → 切换步骤 · 第3步空格逐层提示</span><span class="count">${W.page+1} / 5</span></div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let changed=false;if(b.dataset.mode==='writing'){W.model=false;render();return}if(b.dataset.writePage!==undefined){W.page=Number(b.dataset.writePage);W.model=false;changed=true}if(b.dataset.writeToggle){W[b.dataset.writeToggle]=!W[b.dataset.writeToggle];changed=true}switch(b.dataset.writeAction){case'next':W.page=Math.min(4,W.page+1);W.model=false;changed=true;break;case'prev':W.page=Math.max(0,W.page-1);W.model=false;changed=true;break;case'reveal':W.reveal=Math.min(3,W.reveal+1);changed=true;break;case'hideSentence':W.reveal=0;changed=true;break;case'sentenceNext':W.sentence=Math.min(5,W.sentence+1);W.reveal=0;changed=true;break;case'sentencePrev':W.sentence=Math.max(0,W.sentence-1);W.reveal=0;changed=true;break}if(changed){render();if(b.dataset.writePage!==undefined||['prev','next'].includes(b.dataset.writeAction))window.scrollTo(0,0)}});
document.addEventListener('input',e=>{if(e.target.id==='writeDraft'){W.draft=e.target.value;$('#writeCount').textContent=`${W.draft.trim()?W.draft.trim().split(/\s+/).length:0} 个英文词（仅计数，不自动判分） · 输入内容保存在本机浏览器`;persist()}});
document.addEventListener('change',e=>{if(e.target.dataset.writeCheck!==undefined){const i=Number(e.target.dataset.writeCheck);e.target.checked?W.checks.add(i):W.checks.delete(i);persist()}});
document.addEventListener('keydown',e=>{if(S.mode!=='writing'||e.target.matches('input,textarea,select')||$('#overlay').children.length)return;if(['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();W.page=Math.max(0,Math.min(4,W.page+(e.key==='ArrowRight'?1:-1)));W.model=false;render();window.scrollTo(0,0)}else if(e.code==='Space'&&W.page===2&&!e.target.closest('button')){e.preventDefault();W.reveal=Math.min(3,W.reveal+1);render()}});
function goto(i){if(i<0||i>=Q.length)return;stopSpeech();S.mode='read';S.idx=i;S.cn=false;S.parts=false;S.mask=false;S.whole=false;render();window.scrollTo({top:0,behavior:'instant'})}
function speak(t){if(!('speechSynthesis'in window)){toast('当前浏览器不支持朗读，可直接带读。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/_+/g,' blank '));u.lang='en-GB';u.rate=.83;u.onerror=()=>toast('朗读暂时不可用，可直接带读。');speechSynthesis.speak(u)}function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function catalog(){const g=D.groups[Q[S.idx].group];$('#overlay').innerHTML=`<div class="drawer" data-backdrop><div class="dialog" role="dialog" aria-modal="true" aria-label="全部课文句子"><div class="dialoghead"><h2>第三单元 · 全部 ${Q.length} 句</h2><button data-action="close">关闭 ✕</button></div><input id="search" class="catalogSearch" placeholder="搜索英文、中文或句子编号" aria-label="搜索句子"><div id="catalogList" class="catalogList"></div><p class="subtle">课本第25—36页；重复原句合并，听力填空保留。</p></div></div>`;catalogResults('');$('#search').focus()}
function catalogResults(s){const term=s.trim().toLowerCase(),list=Q.filter(q=>`${q.id+1} ${q.en} ${q.zh}`.toLowerCase().includes(term));$('#catalogList').innerHTML=list.map(q=>`<button data-jump="${q.id}"><small>${String(q.id+1).padStart(2,'0')} · 教材 ${esc(D.groups[q.group].title.split(' ')[0])} 页 ${S.read.has(q.id)?'· 已讲':''}</small><span>${esc(q.en)}</span></button>`).join('')||'<div class="empty">没有找到这句话，换个词试试。</div>'}
function sample(sentence,title='同句型换词'){const model=Q[S.idx];$('#overlay').innerHTML=`<div class="modal" data-backdrop><div class="dialog" role="dialog" aria-modal="true" aria-label="仿写练习"><div class="dialoghead"><h2>${esc(title)}</h2><button data-action="close">关闭 ✕</button></div><span class="subtle">教学仿写 · 先让他独立说，再检查骨架</span><div class="sentence">${esc(sentence)}</div><div class="explain">谁／什么？完整谓语在哪里？动作需要的对象、状态或位置写全了吗？</div><div class="controls"><button data-speak="${esc(sentence)}">▷ 朗读</button><button class="primary" data-action="close">回到课文</button></div></div></div>`}
const variants={past:'The teacher took the boy to the hospital.',be:'The children are tired after the game.',doing:'She is waiting for the train now.',modal:'We should ask someone for help.',imperative:'Choose a quiet place and read the book.',there:'There is a bus stop near the park.',clause:'Take a break when you are tired.',question:'What should we do when someone gets hurt?'};
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-word]');if(!b){if(e.target.matches('[data-backdrop]'))$('#overlay').innerHTML='';return}if(b.dataset.word){b.textContent=b.dataset.word;b.classList.remove('masked');return}if(b.dataset.mode){S.mode=b.dataset.mode;stopSpeech();render();window.scrollTo(0,0);return}if(b.dataset.group!==undefined){goto(D.groups[Number(b.dataset.group)].start);return}if(b.dataset.jump!==undefined){$('#overlay').innerHTML='';goto(Number(b.dataset.jump));return}if(b.dataset.pattern!==undefined){S.pattern=Number(b.dataset.pattern);render();return}if(b.dataset.speak){speak(b.dataset.speak);return}switch(b.dataset.action){case'close':$('#overlay').innerHTML='';return;case'catalog':catalog();return;case'whole':S.whole=!S.whole;break;case'cn':S.cn=!S.cn;break;case'parts':S.parts=!S.parts;break;case'mask':S.mask=!S.mask;if(S.mask&&!ranges(Q[S.idx]).some(x=>x.role==='verb')){S.mask=false;toast('这句在等你填入谓语，先口头补全。')}break;case'prev':goto(S.idx-1);return;case'next':goto(S.idx+1);return;case'mark':S.read.has(S.idx)?S.read.delete(S.idx):S.read.add(S.idx);break;case'speak':speak(Q[S.idx].en);return;case'speakGroup':speak(Q.filter(q=>q.group===Q[S.idx].group).map(q=>q.en).join(' '));return;case'variant':sample(variants[Q[S.idx].pattern]||variants.past);return;case'patternPrev':S.pattern=Math.max(0,S.pattern-1);break;case'patternNext':S.pattern=Math.min(patterns.length-1,S.pattern+1);break;case'patternSample':sample(patterns[S.pattern].sample,'同一个骨架，再说一句');return;case'repairReveal':S.step=Math.min(3,S.step+1);break;case'repairReset':S.step=0;break;case'repairPrev':S.case=Math.max(0,S.case-1);S.step=0;break;case'repairNext':S.case=Math.min(cases.length-1,S.case+1);S.step=0;break;case'done':S.done.has(S.case)?S.done.delete(S.case):S.done.add(S.case);break;default:return}render()});
$('#overlay').addEventListener('input',e=>{if(e.target.id==='search')catalogResults(e.target.value)});
$('#sizeDown').onclick=()=>{S.scale=Math.max(.85,Math.round((S.scale-.1)*100)/100);render()};$('#sizeUp').onclick=()=>{S.scale=Math.min(1.4,Math.round((S.scale+.1)*100)/100);render()};
$('#fullBtn').onclick=async()=>{const on=document.body.classList.toggle('present');$('#fullBtn').textContent=on?'⛶ 退出大屏':'⛶ 大屏讲课';try{if(on&&!document.fullscreenElement)await document.documentElement.requestFullscreen();else if(!on&&document.fullscreenElement)await document.exitFullscreen()}catch{} };document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('present');$('#fullBtn').textContent='⛶ 大屏讲课'}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.target.matches('[data-word]')&&['Enter','Space'].includes(e.code)){e.preventDefault();e.target.click();return}if(e.target.closest('button')&&['Enter','Space'].includes(e.code))return;if(e.key==='Escape'){$('#overlay').innerHTML='';return}if($('#overlay').children.length)return;if(S.mode==='read'&&!S.whole){if(e.key==='ArrowRight'){e.preventDefault();goto(S.idx+1)}if(e.key==='ArrowLeft'){e.preventDefault();goto(S.idx-1)}if(e.code==='Space'){e.preventDefault();S.parts=!S.parts;render()}if(e.key.toLowerCase()==='c'){S.cn=!S.cn;render()}}else if(S.mode==='repair'&&e.key==='ArrowRight'){S.case=Math.min(cases.length-1,S.case+1);S.step=0;render()}else if(S.mode==='repair'&&e.code==='Space'){e.preventDefault();S.step=Math.min(3,S.step+1);render()}});
render();window.__lesson={D,S,ranges,patterns,cases};
</script></body></html>
