{title:'人数差藏着几份？',short:'1. 数量差',prompt:'先把男生和女生画成两条线段。多出的12人，对应全班的几分之几？',text:'六（1）班男生占全班人数的3/5，其余都是女生。男生比女生多12人。全班一共有多少人？',given:['男生占全班3/5','女生是其余部分','男生比女生多12人'],answerText:'60',unit:'人',relation:'全班人数 ×（男生占比 − 女生占比）= 人数差',steps:['全班人数是单位“1”。平均分成5份，男生占3份，女生占2份。','男生多出的1份，就是12人；这1份占全班的1/5。','全班人数：12÷(3/5−2/5)=12÷1/5=60（人）。','检验：男生36人，女生24人，相差12人。'],captions:['把全班看成同一个整体，比较两条线段。','全班分成5份：男生3份，女生是剩下的2份。','对齐左端，多出来的1份对应12人。','先找到“差”对应1/5，再用12÷1/5求全班。']},
{title:'第二次的分数，是谁的几分之几？',short:'2. 连续变化',prompt:'两次说的整体一样吗？先划去第一次用的，再从剩下的里面分。',text:'一袋大米，第一天用去原来总量的1/3，第二天用去第一天剩余量的1/4，最后还剩18千克。这袋大米原来有多少千克？',given:['第一天用原来的1/3','第二天用余下的1/4','最后剩18千克'],answerText:'36',unit:'千克',relation:'原来总量 ×（1−1/3）×（1−1/4）= 最后剩余量',steps:['先把原来的总量画成12份。第一天用去4份，还剩8份。','第二天把剩下的8份看作新的整体，用去它的1/4，也就是2份。不能把第二次的1/4当成原来总量的1/4。','最后剩6份，占原来总量的(1−1/3)×(1−1/4)=1/2。','原来总量：18÷1/2=36（千克）。检验：第一天用12千克，第二天用6千克，最后剩18千克。'],captions:['三行线段都表示原来那一袋米，长度相同。','第一天划去原来的1/3，留下2/3。','只把剩下部分平均分成4份，第二天用其中1份。','最后剩原来的1/2，对应18千克；18÷1/2=36。']},
{title:'14页应该放在线段的哪一段？',short:'3. 剩余关系',prompt:'一条线段同时标出第一天读的、第二天读的和最后剩的，14页对应哪部分？',text:'小宁读一本书，第一天读了全书的2/5，第二天又读了14页，这时还剩全书的1/4没有读。这本书一共有多少页？',given:['第一天读全书2/5','第二天读14页','最后剩全书1/4'],answerText:'40',unit:'页',relation:'全书页数 ×（1−2/5−1/4）= 第二天读的14页',steps:['把全书页数看成单位“1”，它由第一天读的、第二天读的、最后剩的三段组成。','把整条线段分成20份：第一天读8份，最后剩5份，中间第二天读7份。','第二天的14页占全书的1−2/5−1/4=7/20。全书页数：14÷7/20=40（页）。','检验：第一天读16页，第二天读14页，最后剩10页，正好是全书的1/4。'],captions:['整条线段表示全书，先不要把14页当成剩余页数。','左边是第一天读的2/5，右边是最后剩的1/4。','中间那一段才是第二天读的14页。','14页对应1−2/5−1/4=7/20，所以全书有40页。']},
{title:'总长不等于直道长',short:'4. 跑道边界',prompt:'先沿外边界描一圈。整个长20米，里面的直道也长20米吗？',text:'一个运动场由中间的长方形和两端的半圆组成。整个运动场从最左端到最右端长20米，宽8米。沿运动场外边缘围一圈，需要围栏约多少米？',given:['整个运动场总长20米','宽8米','两端各一个半圆'],answerText:'49.12',unit:'米',relation:'外边界长度 = 2×（总长−宽）+ π×宽',steps:['宽8米就是半圆的直径。左右两端各向外伸出一个半径，合起来占8米。','中间长方形的长（直道长）=20−8=12（米）。','两端的半圆弧合成一个整圆的周长：3.14×8=25.12（米）。图内两条直径不在外边界上，不能加入。','围栏长≈12×2+25.12=49.12（米）。'],captions:['沿运动场最外面看一圈，虚线不是外边界。','宽8米就是半圆直径，两端各伸出一个半径。','总长扣掉两个半径，才是中间的直道长。','直道长20−8=12米；外边界=两条直道+两段半圆弧。']},
{title:'剪开后，周长多在哪里？',short:'5. 剪开增周长',prompt:'先画原来的圆，再把两个半圆分开。哪些边原来没有，剪开以后才出现？',text:'一张直径12厘米的圆形纸片，沿一条直径剪成两个半圆。两个半圆的周长加起来约是多少厘米？',given:['原圆直径12厘米','沿直径剪成两个半圆','求两个半圆周长的和'],answerText:'61.68',unit:'厘米',relation:'两个半圆周长之和 = 原圆周长 + 2条直径',steps:['两个半圆的弯曲部分合起来，仍然是原来圆的一整圈：3.14×12=37.68（厘米）。','剪开后，每个半圆都新增一条长12厘米的直边，一共新增2条。','两个半圆周长之和≈37.68+12×2=61.68（厘米）。','不能只算原圆周长，也不能只加一条直径；要把两个半圆的边界分别数完整。'],captions:['虚线是剪开的地方。原来这条线在圆的内部。','分成两个半圆后，各自都要算完整边界。','红色是新出现的两条直边，每条都是12厘米。','两段弧合为原圆周长，再加2条直径，得到61.68厘米。']},
