const BOOK=[
{id:1,p:40,at:'Movement段第6—8行 · 最后一句',en:'Also, it is easier to move a light thing than a heavy thing.'},

{id:3,p:41,at:'大图下第一段第2—3行 · 最后一句',en:'When you push it with a bigger force, it opens more quickly.'},
{id:4,p:42,at:'B活动 · Cause栏第4项',en:'We open a door with a bigger force.'},
{id:5,p:42,at:'页面底部 · Think',en:'Is it easier to push a box of books or a box of balloons?'},
{id:6,p:43,at:'D歌谣 · 左栏第1行',en:'A horse is faster than a tortoise.'},

{id:11,p:43,at:'D歌谣 · 左栏第7行',en:"I’m bigger than a tortoise."},
{id:12,p:43,at:'D歌谣 · 右栏第2行',en:'And a horse is heavier than me.'},
{id:13,p:43,at:'D歌谣 · 右栏第3行',en:"I’m heavier than a tortoise."},
{id:14,p:43,at:'粉色Learn框 · 第1行',en:'What is slower than a plane?'},
{id:15,p:43,at:'粉色Learn框 · 第2行',en:'A train is slower than a plane.'},
{id:16,p:43,at:'E活动 · 男孩对话框',en:'What’s faster than a bus?'},
{id:17,p:43,at:'E活动 · 女孩对话框',en:'A car is faster than a bus.'},
{id:18,p:45,at:'B活动 · 男孩对话框第2—4行',en:'When we use a bigger force, we can jump higher.'},
{id:19,p:45,at:'C写作 · 提示词组第1行',en:'a bigger force → go faster/run faster/…',kind:'课本词组'},
{id:20,p:45,at:'C写作 · 提示词组第2行',en:'a smaller force → go more slowly/run more slowly/…',kind:'课本词组'},
{id:21,p:46,at:'下方文字框第2行 · Brown Goat的话',en:'“I’m older. I should eat the grass.”'},
{id:22,p:46,at:'下方文字框第4行 · Black Goat的话',en:'“I’m smarter. I should eat it.”'},
{id:23,p:48,at:'表格下方 · Think',en:'When are two forces not bigger than one?'},
{id:24,p:43,at:'D歌谣 · 右栏第1行',en:'A horse is haster than a tortoise.',kind:'PDF排印待核对',note:'上传PDF在这里印作haster，并非规范比较级。不要照此拼写；按重量语境应与heavier核对。该行只作教材核对，不用于归纳规则。'}
];
const SECTIONS=['认词','观察','发现规律','换词表达','课本回看','独立检查'];
const LESSON=[
{sec:0,title:'推，还是拉？',type:'vocab',tag:'教材第38页词汇 · 词组为教学拓展',words:[['push','推','push a box','push'],['pull','拉','pull a box','pull']],qs:[['两个动作有什么不同？','push把物体推离自己；pull把物体拉向自己。'],['把一个动作和一个物品连起来，怎么说？','push a box / pull a box。动作词后接需要推动、拉动的对象。']],hint:'先点“演示动作”，再指认。点击词卡上的朗读，可以带读。'},
{sec:0,title:'先认识特点',type:'vocab',tag:'教材第38页词汇 · 词组为教学拓展',words:[['heavy','重的','a heavy bag','heavy'],['light','轻的','a light bag','light']],qs:[['哪个包重？哪个包轻？','heavy描述重，light描述轻。这里都在说包的特点。'],['heavy是一个词，a heavy bag又在说什么？','a heavy bag是“一个重的包”。描述特点的词放在bag前面。']]},
{sec:0,title:'描述题目的难度',type:'vocab',tag:'教材第38页词汇 · 教学插图',words:[['easy','容易的','an easy question','easy'],['difficult','困难的','a difficult question','hard']],qs:[['哪道题容易？哪道题难？','easy描述容易，difficult描述困难。'],['说出两个完整词组。','an easy question / a difficult question。这里an、a的选择取决于后面单词开头的发音。']]},
{sec:0,title:'认清今天的比较对象',type:'vocab',tag:'课本词汇复习',words:[['a horse','一匹马','fast','horse'],['a tortoise','一只乌龟','slow','tortoise']],qs:[['先读出两个对象，再指出谁快、谁慢。','a horse / a tortoise；fast / slow。'],['A horse is fast. 这句话说谁？说明什么特点？','A horse是主语，is是系动词，fast说明马的特点。先读懂这个短句。']]},
{sec:0,title:'再认识一组交通工具',type:'vocab',tag:'课本词汇复习',words:[['a train','一列火车','fast','train'],['a plane','一架飞机','fast','plane']],qs:[['指认并读出这两个词组。','a train / a plane。'],['生活中还见过什么交通工具？a car和a bus各是什么？','a car是一辆小汽车；a bus是一辆公共汽车。先认读，再回到后面的课本句子。']]},
{sec:1,title:'这两个句子，你注意到了什么？',refs:[6,8],qs:[['哪个词看起来认识，但样子发生了变化？','faster。它与我们刚学的fast有关。'],['你能找出原来的样子吗？多了哪些字母？','fast → faster，多了er。'],['两句话分别是谁和谁在比较？','第一句：a horse和a tortoise；第二句：I和a tortoise。']],hint:'如果找不到，提示“看看描述快慢的那个词”。先等他说，再标出变化。'},
{sec:1,title:'只是快，还是比另一个更快？',type:'meaning',examples:['A horse is fast.','A horse is faster than a tortoise.'],tag:'第一句为教学铺垫 · 第二句为教材第43页原句',qs:[['第二句比第一句多告诉了我们什么？','第一句说明马快；第二句把马和乌龟比较，说明马比乌龟更快。'],['than后面的a tortoise在告诉我们什么？','在告诉我们比较对象：和乌龟比。faster表示“更快”。'],['这种变化，用一个名称怎么概括？','描述特点的词变成比较级，用来表达“更……”。今天先学习几个常见的变化和用法。']]},
{sec:2,title:'把一句话的骨架看清楚',type:'structure',refs:[6],qs:[['谁是主语？哪一个词把主语和特点连接起来？','A horse是主语；is是系动词。'],['说明马特点的整个部分是哪一块？','faster than a tortoise整体作表语；faster是核心，than a tortoise补充比较对象。'],['如果去掉is，只剩A horse faster than a tortoise.，完整吗？','不完整。这是描述特点的普通陈述句，需要系动词is。']],hint:'这里比较的是主语的特点：主语 + 系动词 + 表语。不要把than后的对象当成is的宾语。'},
{sec:2,title:'看一个示范，然后自己说',refs:[14,15],qs:[['先读问句：它在问什么？','请自己口头解释问法。回答时可以选a train作主语。'],['怎样一步步组成回答？','a train（主语）→ is（系动词）→ slower（更慢）→ than a plane（和谁比较）。'],['遮住原句，只看a train / a plane / slow，重新说完整。','A train is slower than a plane.']],hint:'先示范一次自己的思考过程，再遮住句子，让学生重新组织。'},
{sec:2,title:'换个对象，试着自己说',type:'practice',tag:'拓展练习',cues:'a tortoise / a horse / slow',qs:[['以a tortoise开头，把意思说完整。','A tortoise is slower than a horse.'],['这句里的slow为什么要变化？is和than各有什么作用？','在比较两个对象的快慢，所以用slower；is连接主语和特点，than引出比较对象。']]},
{sec:2,title:'第一组：找相同的变化',type:'rule',pairs:[['fast','faster'],['slow','slower']],tag:'从第43页课本原词观察',qs:[['原来的字母有没有变？都增加了什么？','原词保留，在后面加-er。这是许多短形容词的常见变化。'],['试试新词：strong、small。','strong → stronger；small → smaller。']],follow:['Robot A is stronger than Robot B.','Box B is smaller than Box A.'],hint:'先说词形，再看拓展例句。比较信息由后面的数据练习给出。'},
{sec:2,title:'第二组：为什么多了一个g？',refs:[9,10,11],type:'rule',pairs:[['big','bigger']],qs:[['从big到bigger，除了er，还多了哪个字母？','多了一个g：big → bigg → bigger。'],['是不是所有短词都要双写？','不是。big是重读闭音节，短元音后只有一个末尾辅音字母g，所以双写g再加-er。fast和slow不这样变。'],['不看答案，再拼一次big的比较级。','bigger。再用bigger说一句描述两个物体大小的完整句。']],hint:'今天先认准big的变化。双写条件由老师讲清楚，不让学生仅凭词长猜。'},
{sec:2,title:'第三组：y发生了什么变化？',refs:[12,13],type:'rule',pairs:[['heavy','heavier'],['easy','easier']],qs:[['heavy和heavier有什么相同、不同？','辅音字母加y结尾，先把y变成i，再加-er：heavy → heavier。'],['easy也是这样吗？试着说出步骤。','easy → easi → easier。第40页原句中也出现了easier。'],['试试新词happy。','happy → happier。并非所有含y的词都这样变，要看结尾是否为“辅音字母+y”。']]},
{sec:3,title:'从词变成词组',type:'phrases',tag:'拓展词组 · 先认词，再进入数据比较',qs:[['先读词组，指出每组中描述特点的词。','a heavy bag / a light bag：重的包／轻的包；a tall robot / a short robot：高的机器人／矮的机器人；a big box / a small box：大箱子／小箱子。'],['以the blue bag作主语，后面为什么还需要is？','the blue bag是“蓝色的包”这个名词词组。the red bag是“红色的包”。写普通的特点描述句，还要有is和描述特点的表语。']],phrases:['a heavy bag','a light bag','a tall robot','a short robot','a big box','a small box']},
{sec:3,title:'看重量，按顺序组句',type:'build',tag:'拓展练习 · 给词块',board:'bags',cues:'以the blue bag开头。',chips:['than the red bag.','heavier','The blue bag','is'],answer:'The blue bag is heavier than the red bag.',qs:[['先判断哪个包重，再点击词块组成完整句。','The blue bag is heavier than the red bag.'],['把词块收起来，再独立说一遍。','先确定比较方向，再说主语、系动词、比较级和比较对象。']]},

{sec:4,title:'回到课本：每句都读懂',refs:[7,16,17],qs:[['这些句子中的比较对象分别是谁？','a horse和me；问句中以a bus为比较对象；回答中比较a car和a bus。'],['把其中一句的主语、系动词和表语找出来。','例如：A car | is | faster than a bus.。And是连接词；What’s是What is的缩写。']]},
{sec:4,title:'长一点的句子，也能找到变化',refs:[1,5],qs:[['两句都出现了哪个变化后的词？原形是什么？','easier，原形是easy。'],['在第40页这句中，比较的是哪两件事的难易？','移动轻的物体与移动重的物体。It is easier to…是另一种结构，今天先理解意思。'],['第42页这个问题，请先自己解释，再说明理由。','先独立解释问法，再依据书和气球的重量思考。可以尝试：A box of balloons is easier to push than a box of books.（拓展表达）']],hint:'保留课文完整句。不要把所有比较表达都硬套成“A is…than B”。'},
{sec:4,title:'同一句里，有两种程度表达',refs:[2],qs:[['先找两处表示“比……更快”的部分。','faster than a horse；faster than a car。'],['the fastest of all与前面的faster一样吗？','不一样。faster是比较级；the fastest of all表示在所说范围内最快，是最高级，后面再系统学习。'],['把前两个比较关系分别说完整。','A car is faster than a horse. / A high-speed train is faster than a car.（从课文并列长句中拆出的表达）']]},
{sec:4,title:'力变大，动作怎样变化？',refs:[4,3],qs:[['两句里描述force的词是什么？原形是什么？','bigger，原形是big；a bigger force是“一个更大的力”。'],['more quickly在说明门是什么样，还是打开得怎么样？','在说明打开得更快。quickly是描述动作的副词，比较级是more quickly。'],['这两句都有is吗？为什么？','没有。open / opens已经表达动作。不能在动作前面随便再加is。']],hint:'形容词比较级描述特点；副词比较级可以描述动作。先理解，不要求今天背全所有副词规则。'},
{sec:4,title:'运动时怎样使用力？',refs:[18,19,20],qs:[['从完整句中找出两处发生变化的词。','bigger说明力更大；higher说明跳得更高。'],['下面两行是完整句吗？','不是。它们是教材提供的写作提示词组，需要自己补成句子。'],['读一读：bigger、smaller、faster、more slowly，分别说出了什么变化？','力更大、力更小、动作更快、动作更慢。more slowly是slowly的比较级。']]},
{sec:4,title:'把课本词组组成自己的句子',type:'practice',tag:'拓展例句 · 连接教材第45页',examples:['When I use a bigger force, the toy car moves faster.','When I use a smaller force, the toy car moves more slowly.'],qs:[['两句中，哪一部分交代条件？哪一部分交代结果？','When I use…交代条件；the toy car moves…交代结果。'],['moves faster能改成is moves faster吗？','不能。moves是动作；faster说明移动得更快。is faster才是用系动词描述主语特点的另一种结构。'],['收起例句，使用a bigger force和moves faster自己说一句。','When I use a bigger force, the toy car moves faster.']],hint:'这两句为语言练习示例，不把力与速度关系扩展成严格的物理定律。'},
{sec:4,title:'故事里也有这些变化',refs:[21,22],qs:[['找到两只山羊说的变化后的词，并说出原形。','older ← old；smarter ← smart。'],['这两句后面没有than，还是比较级吗？','是。比较对象可以由故事上下文理解；这里在和另一只山羊作比较。比较级并不一定每次都写出than。']]},
{sec:4,title:'把最后一个课本问题读清楚',refs:[23],qs:[['先找到比较级，再找比较对象。','bigger；在比较two forces和one force。'],['注意not。结合两只山羊相互推的故事，你怎样理解？','结合情境思考：两个力方向相反时，不能简单认为效果就比一个力更大。这是一道阅读思考题。']],hint:'先检查英文读懂没有，再讨论情境。无需为了回答而猜复杂科学术语。'},
{sec:5,title:'独立检查 1 / 4',type:'practice',tag:'拓展练习 · 收起所有提示',cues:'heavy → ______     big → ______     slow → ______',qs:[['先独立写出三个词，再核对。','heavier / bigger / slower。'],['任选一个，说出它的变化步骤。','heavy：y变i，再加-er；big：双写g，再加-er；slow：直接加-er。']]},

const $=s=>document.querySelector(s),KEY='unit4-notice-say-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}let current=Number.isInteger(saved.current)?Math.max(0,Math.min(LESSON.length-1,saved.current)):0,scale=Number(saved.scale)||1,done=new Set(saved.done||[]);const states=LESSON.map(()=>({q:0,answer:false,hint:false,mark:false,hidden:false,meaning:false,move:false,chosen:[],judged:false}));
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function paint(s,on){const safe=esc(s);return on?safe.replace(/\b(more quickly|more slowly|faster|slower|bigger|heavier|easier|higher|smaller|older|smarter)\b/g,'<mark>$1</mark>'):safe}function persist(){try{localStorage.setItem(KEY,JSON.stringify({current,scale,done:[...done]}))}catch{}}function book(id){return BOOK.find(b=>b.id===id)}function refRows(ids,st){return(ids||[]).map(id=>{const b=book(id);return `<div class="bookrow"><div class="source">课本第${b.p}页 · ${esc(b.at)}${b.kind?' · '+b.kind:''}</div><div class="english ${b.en.length>120?'long':''}">${st.hidden?'请不看原句，重新组织表达。':paint(b.en,st.mark)}</div></div>`}).join('')}

function board(name){const data=name==='bags'?[['👜','The blue bag','5 kg',90],['👜','The red bag','2 kg',36]]:name==='robots'?[['🤖','Robot A','120 cm · 20 kg',90],['🤖','Robot B','100 cm · 15 kg',75]]:[['📦','Box A','8 kg',90],['📦','Box B','3 kg',34]];return `<div class="compare">${data.map((d,i)=>`<div class="item"><div class="emoji" ${name==='bags'?`style="filter:${i===0?'hue-rotate(150deg)':'hue-rotate(300deg)'}"`:''}>${d[0]}</div><div class="name">${d[1]}</div><div class="data">${d[2]}</div><div class="bar" style="width:${d[3]}%"></div><div class="tiny">${name==='robots'?'身高示意':'重量示意'}</div></div>`).join('')}</div>`}

function render(){const l=LESSON[current],s=states[current];document.documentElement.style.setProperty('--scale',scale);$('.steps').innerHTML=SECTIONS.map((n,i)=>`<button data-section="${i}" class="${l.sec===i?'active':''}" aria-current="${l.sec===i?'step':'false'}">${String(i+1).padStart(2,'0')} ${n}</button>`).join('');$('#eyebrow').textContent='UNIT 4 / '+SECTIONS[l.sec];$('#title').textContent=l.title;$('#count').textContent=`${current+1} / ${LESSON.length}`;let html=l.tag?`<span class="tag">${l.tag}</span>`:'';if(l.type==='vocab')html+=`<div class="vocab">${l.words.map(w=>`<div class="wordcard ${s.move?'moving':''}"><div class="picture">${picture(w[3])}</div><div class="word">${w[0]}</div>${s.meaning?`<div>${w[1]}</div><div class="phrase">${w[2]}</div>`:''}<button data-speak="${w[0]}">▷ 朗读</button></div>`).join('')}</div>`;html+=refRows(l.refs,s);if(l.examples)html+=l.examples.map(x=>`<div class="bookrow"><div class="english ${l.type==='error'?'error':''}">${s.hidden?'请收起例句，自己再说一次。':paint(x,s.mark)}</div></div>`).join('');if(l.type==='rule'&&l.pairs&&!l.refs)html+=`<div class="changes">${l.pairs.map(p=>`<div>${p[0]} → ${s.mark?p[1]:'______'}</div>`).join('')}</div>`;if(l.phrases)html+=`<div class="bank">${l.phrases.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;if(l.board)html+=board(l.board);if(l.cues)html+=`<div class="english" style="font-size:calc(26px*var(--scale));margin:20px 0">${esc(l.cues)}</div>`;if(l.type==='build'&&!s.hidden)html+=`<div class="buildline" aria-label="已组成的句子">${s.chosen.length?s.chosen.map(i=>`<span class="chip">${esc(l.chips[i])}</span>`).join(''):'<span class="empty">点击下面的词块，组成完整句。</span>'}</div><div class="bank">${l.chips.map((x,i)=>`<button data-chip="${i}" ${s.chosen.includes(i)?'disabled':''}>${esc(x)}</button>`).join('')}</div><div class="controls"><button data-action="undo">撤回一个词块</button><button data-action="resetBuild">重新组句</button><button data-action="judge">检查顺序</button></div>${s.judged?`<div class="hint" role=" function go(i){if(i<0||i>=LESSON.length)return;stop();current=i;render();window.scrollTo(0,0)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}function speak(t){if(!('speechSynthesis'in window)){toast('当前浏览器不支持朗读，可以直接带读。');return}stop();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;u.onerror=()=>toast('朗读暂不可用，可以直接带读。');speechSynthesis.speak(u)}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,2600)}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const l=LESSON[current],s=states[current];if(b.dataset.section!==undefined){go(LESSON.findIndex(x=>x.sec===Number(b.dataset.section)));return}if(b.dataset.speak){speak(b.dataset.speak);return}if(b.dataset.chip!==undefined){s.chosen.push(Number(b.dataset.chip));s.judged=false;render();return}if(b.dataset.bookJump){const i=LESSON.findIndex(x=>(x.refs||[]).includes(Number(b.dataset.bookJump)));$('#catalogDialog').close();go(i);return}let act=b.dataset.action;if(!act)return;switch(act){case'answer':s.answer=!s.answer;break;case'qNext':s.q=Math.min(l.qs.length-1,s.q+1);s.answer=false;s.hint=false;break;case'qPrev':s.q=Math.max(0,s.q-1);s.answer=false;s.hint=false;break;case'mark':s.mark=!s.mark;break;case'hide':s.hidden=!s.hidden;s.answer=false;break;case'hint':s.hint=!s.hint;break;case'meaning':s.meaning=!s.meaning;break;case'move':s.move=!s.move;break;case'undo':s.chosen.pop();s.judged=false;break;case'resetBuild':s.chosen=[];s.judged=false;break;case'judge':s.judged=true;break;case'speak':speak((l.refs||[]).map(id=>book(id).en).concat(l.examples||[]).join(' '));return;default:return}render()});
$('#prev').onclick=()=>go(current-1);$('#next').onclick=()=>go(current+1);$('#done').onclick=()=>{done.has(current)?done.delete(current):done.add(current);render()};$('#smaller').onclick=()=>{scale=Math.max(.85,Math.round((scale-.1)*100)/100);render()};$('#larger').onclick=()=>{scale=Math.min(1.4,Math.round((scale+.1)*100)/100);render()};$('#catalogBtn').onclick=()=>{catalog();$('#catalogDialog').showModal()};$('#closeCatalog').onclick=()=>$('#catalogDialog').close();$('#pageFilter').onchange=catalog;$('#catalogDialog').addEventListener('click',e=>{if(e.target===$('#catalogDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
$('#full').onclick=async()=>{const on=document.body.classList.toggle('present');$('#full').textContent=on?'退出大屏':'大屏讲课';try{if(on&&!document.fullscreenElement)await document.documentElement.requestFullscreen();else if(!on&&document.fullscreenElement)await document.exitFullscreen()}catch{}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('present');$('#full').textContent='大屏讲课'}});document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||$('#catalogDialog').open)return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}else if(e.code==='Space'&&!e.target.closest('button')){e.preventDefault();states[current].answer=!states[current].answer;render()}else if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey)$('#full').click()});
render();
</script></body></html>
