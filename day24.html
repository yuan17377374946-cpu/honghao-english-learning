:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#172434;background:#f4f7fb;--blue:#173b67;--line:#dce5ef}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--blue)}button:hover{background:#eaf4ff}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e7a641;outline-offset:2px}header{padding:20px 28px;background:var(--blue);color:white;display:flex;align-items:center;justify-content:space-between;gap:15px}header a{color:white}h1{font-size:25px;margin:5px 0}small,.hint{font-size:13px;line-height:1.8}.hint{color:#657386}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 28px;background:white;border-bottom:1px solid var(--line)}nav{display:flex;gap:8px;flex-wrap:wrap}nav button.active,.primary{background:var(--blue);color:white}main{padding:24px 28px;max-width:1500px;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px}h2{font-size:24px;margin:0 0 14px}h3{margin:0 0 12px}p{line-height:1.9}.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;height:calc(100dvh - 225px);min-height:390px}.pane{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;border:1px solid var(--line);background:white;border-radius:16px;padding:25px}.article{font-size:21px;line-height:2}.article p{margin-bottom:24px}.blank{display:inline-block;border-radius:7px;background:#eaf4ff;color:#173b67;padding:0 7px;font-weight:700;min-width:55px}.place{padding:18px 0;border-bottom:1px solid var(--line)}.place h3{font-size:21px}.place p{margin-top:8px}.person{font-size:19px}.question h3{font-size:19px;line-height:1.7}.sources{font-size:14px;line-height:1.8;margin-top:30px}.sources a{color:var(--blue)}select{max-width:100%}di </style></head><body><header><div><small>2026.10.14 / DAY 24</small><h1>读懂深圳 · 从拼读到旅行</h1></div><a href="index.html">课程首页 ↗</a></header><div class="toolbar"><nav id="nav"></nav><button id="timer" onclick="toggleTimer()">▶ 计时</button><span id="time">00:00</span><button onclick="showWords()">生词本</button><button onclick="download()">下载记录</button><span class="status" id="status">答案自动保存在当前浏览器</span></div><main id="main"></main><div id="tip" role="status" hidden></div><dialog id="wordDialog"><div class="dialoghead"><h2>本课生词本</h2><button onclick="document.getElementById('wordDialog').close()">关闭</button></div><p class="hint">阅读中标记的单词保存在当前浏览器，可随课堂记录下载。</p><div id="wordList"></div></dialog><script src="day24-data.js"></script><script>
'use strict';const KEY='honghao-day24-v1';const names=['10词听写','igh · oa · ow','景点阅读理解','游客信息匹配'];const review=['rain','wait','train','play','stay','back','clock','teacher','fish','green'];const rz=['雨','等待','火车','玩','停留','回来','时钟','老师','鱼','绿色'];const initial={stage:0,group:0,answers:[[],[]],first:[null,null],submitted:[false,false],dict:{},di:0,mean:{},marked:{},seconds:[0,0,0,0]};function loadState(){try{return Object.assign(structuredClone(initial),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(initial)}}let S=loadState(),running=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{document.getElementById('status').textContent='保存失败，请下载记录'}}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(s,slow=false){if(!('speechSynthesis' in window)){tip('浏览器不支持朗读，请老师读词。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=slow?.65:.85;speechSynthesis.speak(u)}function tip(s){let t=document.getElementById('tip');t.textContent=s;t.hidden=false;clearTimeout(window.tipTimer);window.tipTimer=setTimeout(()=>t.hidden=true,3500)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function toggleTimer(){running=!running;document.getElementById('timer').textContent=running?'Ⅱ 暂停':'▶ 计时'}setInterval(()=>{if(running){S.seconds[S.stage]++;save()}document.getElementById('time').textContent=fmt(S.seconds[S.stage])},1000);function go(n){S.stage=n;save();render()}function render(){document.getElementById('nav').innerHTML=names.map((s,i)=>`<button class="${S.stage===i?'active':''}" onclick="go(${i})">${i+1}. ${s}</button>`).join('');document.getElementById('main').innerHTML=S.stage===0?dictation():S.stage===1?phonics():reading(S.stage-2);document.getElementById('time').textContent=fmt(S.seconds[S.stage]);}
function dictation(){let i=S.di,e=S.dict[i]||{},count=Object.values(S.dict).filter(x=>x.first===true).length;return `<section class="card"><span class="badge">复习 ai / ay / ck，穿插 ch / sh / ee</span><h2>先听发音，再推测字母组合</h2><p class="hint">先听发音独立拼写，检查后再看中文提示。抽查昨日组合，并穿插之前学过的词。</p><h3>第 ${i+1} / 10 词</h3><div class="actions"><button class="primary" onclick="say(review[S.di])">♪ 听单词</button><button onclick="say(review[S.di],true)">慢速听</button></div><p><input type="text" id="dict" aria-label="听写答案" autocomplete="off" spellcheck="false" value="${esc(e.value||'')}" oninput="dictInput(this.value)" onkeydown="if(event.key==='Enter')checkDict()"> <button onclick="checkDict()">检查拼写</button></p>${e.checked?`<div class="analysis">${e.correct?'✓ 正确':'再试一次'} · 中文提示：${rz[i]}${e.reveal?' · 正确拼写：'+review[i]:''}</div>`:''}<div class="actions"><button onclick="revealDict()">显示拼写并订正</button><button onclick="dictMove(-1)" ${i===0?'disabled':''}>上一个</button><button onclick="dictMove(1)">${i===9?'返回第1词':'下一个'}</button><button onclick="wrongDict()">重练错词</button></div><p class="hint">首次正确：${count} / 10；订正不改写首次结果。</p></section>`}function dictInput(v){let e=S.dict[S.di]||{};e.value=v;S.dict[S.di]=e;save()}function checkDict(){dictInput(document.getElementById('dict').value);let e=S.dict[S.di];e.correct=e.value.trim().toLowerCase()===review[S.di];if(e.first===undefined)e.first=e.correct;e.checked=true;save();render()}function revealDict(){let e=S.dict[S.di]||{};if(e.first===undefined)e.first=false;e.checked=true;e.reveal=true;S.dict[S.di]=e;save();render()}function dictMove(d){S.di=(S.di+d+10)%10;save();render()}function wrongDict(){let i=review.findIndex((w,i)=>!S.dict[i]?.correct);if(i<0){tip('10个词当前都写对了');return}S.di=i;save();render()}
function phonics(){let g=D.groups[S.group];return `<section class="card"><h2>读句子，猜词义</h2><p class="hint">igh常读/aɪ/，这里的gh不单独发音；oa和本组ow读/əʊ/（美式常读/oʊ/）。ow也有其他读音，如cow、now，本次先练下面这一组。22个例词，先根据句子猜词义，再点开中文。</p><div class="actions">${D.groups.map((x,i)=>`<button class="${i===S.group?'primary':''}" onclick="S.group=${i};save();render()">${x[0]} → ${x[1]} · ${x[2].length}词</button>`).join('')}</div></section><div class="wordgrid">${g[2].map((w,i)=>{let id=g[0]+i;return `<section class="word"><strong>${esc(w[0])}</strong> <button onclick="say(D.groups[S.group][2][${i}][0])">♪</button><p>${esc(w[2]).replace(new RegExp('\\b'+w[0]+'\\b','g'),'<b>'+w[0]+'</b>')}</p><button onclick="S.mean['${id}']=!S.mean['${id}'];save();render()">${S.mean[id]?'隐藏':'我猜好了，查看意思'}</button>${S.mean[id]?`<div class="meaning">${w[1]}</div>`:''}</section>`}).join('')}</div>`}

"waves": "海浪", "models": "模型", "discover": "发现；了解", "several": "几个", "during": "在……期间", "one": "一；一个", "historic": "历史悠久的", "tell": "讲述", "stories": "故事", "protected": "保护了", "area": "区域", "ago": "以前", "view": "景色", "bay": "海湾", "dameisha": "大梅沙", "window": "窗户", "dapeng": "大鹏", "fortress": "城堡；要塞", "watch": "观看", "boat": "小船", "race": "比赛", "house": "房子", "what": "什么", "does": "助动词；用于一般现在时", "paragraph": "段落", "refer": "指；refer to指代", "work": "工作", "centre": "中心", "other": "其他的", "island": "岛", "lily": "莉莉（人名）", "according": "according to 根据", "passage": "文章", "only": "仅仅", "night": "夜晚", "outside": "在外面", "wait": "等待", "another": "另一个", "hills": "小山", "main": "主要的", "purpose": "目的", "explain": "解释", "make": "制作；使", "introduce": "介绍", "give": "给", "visiting": "游览", "advice": "建议", "compare": "比较", "parks": "公园", "is": "是", "a": "一个", "but": "但是", "there": "那里；there are有", "are": "是", "can": "可以；能", "in": "在……里面", "of": "……的", "them": "他们；它们", "it": "它", "has": "有；完成时助动词", "and": "和", "to": "到；动词不定式标记", "the": "特指的人或物", "on": "在……上", "day": "日；天", "you": "你；你们", "if": "如果", "want": "想要", "with": "和；带有", "your": "你的；你们的", "do": "做；助动词", "not": "不", "have": "有；have to必须", "for": "为了；对于", "who": "谁；……的人", "go": "去", "very": "很", "from": "从", "see": "看见", "an": "一个", "some": "一些", "be": "是；成为", "how": "如何", "she": "她", "at": "在", "he": "他", "his": "他的", "her": "她的", "they": "他们；它们", "this": "这个", "no": "没有", "that": "那个；引导从句", "by": "通过；在旁边", "its": "它的", "light": "灯；光", "right": "右边", "fight": "打架；战斗", "bright": "明亮的", "sight": "视力", "tonight": "今晚", "coat": "外套", "goat": "山羊", "road": "道路", "soap": "肥皂", "float": "漂浮", "snow": "雪", "show": "给……看", "grow": "生长", "blow": "吹", "yellow": "黄色的", "follow": "跟随"};function tokens(s){return s.split(/([A-Za-z]+(?:'[A-Za-z]+)?)/g).map(w=>/^[A-Za-z]/.test(w)?`<span class="token ${S.marked[w.toLowerCase()]?'marked':''}" data-word="${esc(w)}" onclick="event.preventDefault();event.stopPropagation();wordClick(this)" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();wordClick(this)}">${esc(w)}</span>`:esc(w)).join('')}function wordClick(el){let w=el.dataset.word,k=w.toLowerCase();S.marked[k]=!S.marked[k];save();document.querySelectorAll('[data-word]').forEach(e=>{if(e.dataset.word.toLowerCase()===k)e.classList.toggle('marked',S.marked[k])});tip(w+' · '+(glossary[k]||'已记录；请结合上下文或向老师确认词义'))}function articlePara(s){return s.split(/(\{\{\d+\}\})/g).map(t=>t.startsWith('{{')?`<span class="blank">(${t.slice(2,-2)}) ____</span>`:tokens(t)).join('')}
function reading(r){let n=5,answers=r===0?D.questions.map(x=>x[2]):D.people.map(x=>x[2]);return `<div class="split"><section class="pane article" aria-label="阅读材料独立滚动区" tabindex="0"><h2>${r===0?'Lianhua Hill Park':'Choose a Place in Shenzhen'}</h2><span class="badge">建议词汇量：约${r===0?'600—800':'700—900'}词（教学估计）</span><span class="badge">${r===0?'正文':'整组材料'} ${D.stats[r][0]}词</span><span class="badge">不同单词 ${D.stats[r][1]}个</span><p class="hint">${r===0?'莲花山公园 · 景点介绍与游玩建议':'6处景点介绍 · 对照右侧5位游客的完整需求'}<br>点击英文词可查看提示并标记，再点一次取消。词数不含标题、题干和选项；匹配材料计入人物需求及景点介绍。</p>${r===0?D.paragraphs.map((p,i)=>`<p><small class="hint">段落 ${i+1}</small><br>${tokens(p)}</p>`).join(''):D.places.map((p,i)=>`<section class="place"><h3>${'ABCDEF'[i]}. ${esc(p[0])}</h3><small class="hint">${esc(p[1])}</small><p>${tokens(p[2])}</p></section>`).join('')}<details class="sources"><summary>素材来源与词数说明</summary><p class="hint">依据真实景点资料简化编写。人物需求为练习设定，游玩建议为教学补充。词数按英文词形统计，忽略大小写，不同词形分别计数。建议词汇量并非测试评级。</p><a href="https://www.sz.gov.cn/en_szgov/news/infocus/park/csgy/content/post_11190503.html" target="_blank" rel="noopener">莲花山公园</a> · <a href="https://www.sz.gov.cn/en_szgov/news/infocus/SZCitywalk/Explore/Districts/NanshanDistrict/content/post_11884972.html" target="_blank" rel="noopener">深圳湾及世界之窗</a> · <a href="https://www.sz.gov.cn/en_szgov/news/infocus/park/csgy/content/post_10986843.html" target="_blank" rel="noopener">大梅沙</a> · <a href="https://www.sz.gov.cn/en_szgov/news/infocus/SZCitywalk/Explore/CitywalkRoutes/VentureSZ/content/post_11894160.html" target="_blank" rel="noopener">历史景点与博物馆</a></details></section><section class="pane" aria-label="题目独立滚动区" tabindex="0"><h2>${r===0?'阅读理解 · 5题':'信息匹配 · 5题'}</h2><p class="hint">${r===0?'每题选出一个最佳答案，回到原文找依据。':'从A—F中为5位游客选择最合适的景点；每项最多用一次，有一项多余。'}</p>${Array.from({length:n},(_,i)=>`<div class="question"><h3>${r===0?i+1:i+6}. ${r===0?tokens(D.questions[i][0]):esc(D.people[i][0])}</h3>${r===1?`<p class="person">${tokens(D.people[i][1])}</p>`:''}${r===0?D.questions[i][1].map((p,j)=>`<label class="option"><input type="radio" name="q${r}-${i}" value="${j}" ${S.answers[r][i]===j?'checked':''} onchange="answer(${r},${i},${j})"><span>${'ABCD'[j]}. ${tokens(p)}</span></label>`).join(''):`<select aria-label="第${i+6}题答案" onchange="answer(1,${i},this.value===''?null:Number(this.value))"><option value="">选择景点</option>${D.places.map((p,j)=>`<option value="${j}" ${S.answers[r][i]===j?'selected':''}>${'ABCDEF'[j]}. ${esc(p[0])}</option>`).join('')}</select>`}${S.submitted[r]?`<div class="analysis">${S.answers[r][i]===answers[i]?'✓ 正确':'需订正'} · 正确答案 ${'ABCDEF'[answers[i]]}<br>${esc(r===0?D.questions[i][3]:D.people[i][3])}</div>`:''}</div>`).join('')}<div class="actions"><button class="primary" onclick="submit(${r})">提交并查看解析</button><button onclick="window.print()">打印学生题</button></div><div id="result" class="result" aria-live="polite">${S.first[r]?`首次成绩：${S.first[r].score} / 5；当前已选 ${S.answers[r].filter(Number.isInteger).length} / 5`:''}</div></section></div>`}
function answer(r,i,v){S.answers[r][i]=v;save();let e=document.getElementById('result');if(e)e.textContent='已保存 · '+S.answers[r].filter(Number.isInteger).length+'题已选；首次成绩'+(S.first[r]?S.first[r].score+'/5':'尚未提交')}
function submit(r){let key=r===0?D.questions.map(x=>x[2]):D.people.map(x=>x[2]);if(key.some((v,i)=>!Number.isInteger(S.answers[r][i]))){tip('请完成所有题目再提交');return}if(r===1&&new Set(S.answers[1]).size<5){tip('每个景点最多匹配一次，请检查重复选项');return}let score=key.filter((v,i)=>S.answers[r][i]===v).length;if(!S.first[r])S.first[r]={answers:[...S.answers[r]],score,date:new Date().toISOString()};S.submitted[r]=true;save();const panes=document.querySelectorAll('.pane'),ys=[...panes].map(x=>x.scrollTop);document.getElementById('main').innerHTML=reading(r);document.querySelectorAll('.pane').forEach((p,i)=>p.scrollTop=ys[i]);tip('本次正确 '+score+' / 5，首次成绩已保留')}
function showWords(){let words=Object.keys(S.marked).filter(k=>S.marked[k]);document.getElementById('wordList').innerHTML=words.length?words.map(w=>`<p><b>${esc(w)}</b> — ${esc(glossary[w]||'结合上下文确认词义')} <button data-vocab="${esc(w)}" onclick="say(this.dataset.vocab)">♪</button><button data-vocab="${esc(w)}" onclick="unmark(this.dataset.vocab)">移除</button></p>`).join(''):'<p>还没有标记生词。阅读时点一个英文词即可加入。</p>';let d=document.getElementById('wordDialog');if(!d.open)d.showModal()}
function unmark(w){S.marked[w]=false;save();document.querySelectorAll('[data-word]').forEach(e=>{if(e.dataset.word.toLowerCase()===w)e.classList.remove('marked')});showWords()}
function download(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='宏浩_Day24_课堂记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
</script></body></html>
