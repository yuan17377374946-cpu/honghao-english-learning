`Last November, Mom and I spent a morning planting flower seeds in the garden. When we finished, however, the ground looked just {{1}} as it was before. There was nothing to see yet. I really hoped the seeds would grow into beautiful flowers. Mom told me to wait. I didn't only wait—I watched. I watched {{2}} all through the winter.`,
`On April 30th, I found the garden full of flowers. Our hard work {{3}}.`,
`“My boy, tomorrow morning,” Mom said, “we will {{4}} a basket of flowers in front of each neighbor's door.”`,
`“What? Flowers are great. Are we selling our flowers?”`,
`“Of course not,” she said excitedly. “In fact, we will give them as a {{5}}. Doesn't that sound fun?”`,
`“Not at all!” I replied {{6}}. “They're ours! We must keep them for ourselves!”`,
`“Flowers are like kindness,” Mom said. “We shouldn't keep them all to ourselves. Their beauty should be {{7}}.”`,
`The next morning, Mom woke me up. We brought the baskets and gifts near the first house. I took one {{8}}, put it by the door and rang the bell. Then we quickly ran away, hid behind the trees and waited.`,
`Finally, the door opened. A man came out, looking surprised. He picked up the flower basket and smiled. Mom hugged me. I got a {{9}} feeling inside. Now I knew what she meant about sharing. {{10}}! I couldn't wait to get to the next basket.`,
`By the time we got home, I was smiling broadly. The garden was empty, but my heart was full.`

{id:'readA',name:'阅读A',title:'Bee English Corner',range:'11—15题',kind:'choice',paras:[
`A simple sentence—“Hello, you look fine!”—is helping delivery riders in Longhua. This sentence is part of a “Bee English Corner”, a practical English training program. It is supported by the local government and run by Jinxiu Community with volunteers.`,
`Real situations, practical skills`,
`Designed around riders' daily work, the classes focus on common situations such as checking addresses, greeting customers and answering basic questions. Through role-play exercises, they learn useful expressions like “delivery”, “address”, and “Have a nice day”. The goal is quick and practical use rather than textbook learning. It is popular because riders meet many foreigners every day.`,
`From gestures to communication`,
`For many riders, the biggest change is confidence. “Before, I could only count on gestures,” said a rider named Wu. “Now I've learned some useful expressions. My pronunciation isn't perfect, but I'm confident enough to speak.”`,
`To match changeable and fast timing of delivery work, each class has review parts, so riders can keep up even if they arrive late or leave early.`,
`Building a friendlier city for foreigners`,
`The English Corner is part of Longhua's wider effort to create a friendlier city for foreigners. Officials say the influence goes beyond communication. Each dialogue between riders and international visitors helps people around the world learn more about the city. “We hope these riders can become grassroots ambassadors connecting local communities with the world,” an organizer said.`
],qs:[
{n:11,stem:'What is the “Bee English Corner”?',opts:['A center to help foreigners in China.','A project to take care of wild bees.','A store to feed community volunteers.','A club to teach delivery riders English.'],a:3,p:0,ev:'a practical English training program',note:'第一段明确这是面向外卖骑手的英语培训项目，D最准确。Bee是名称的一部分，不能因此猜成照顾蜜蜂。'},
{n:12,stem:"Which saying best describes the class's goal?",opts:['Learning by doing.','Good manners matter.','Time is money.','Reading makes a full man.'],a:0,p:2,ev:'Through role-play exercises, they learn useful expressions',note:'课程通过角色扮演、真实工作任务练习英语，体现 Learning by doing＝在实践中学习。不是以阅读或时间管理为重点。'},
{n:13,stem:'How has Wu changed after learning English?',opts:['He does well in pronouncing words.','He gets courage to speak English.','He becomes interested in grammar.','He prefers using body language.'],a:1,p:4,ev:"My pronunciation isn't perfect, but I'm confident enough to speak.",note:'发音还不完美，但已有信心开口，对应B。A说发音很好，与原文不符；C未提到，D与学习后的变化相反。'},
{n:14,stem:'Why did Longhua start the English Corner?',opts:["To develop students' English ability.",'To share local food with foreigners.','To set up new schools for riders.','To help foreigners know the city better.'],a:3,p:7,ev:'helps people around the world learn more about the city',note:'最后一段指出交流帮助外国人更多了解城市，对应D。对象是骑手，不是学校学生；分享食物、建学校均未提及。'},
{n:15,stem:'What is the best title for the passage?',opts:['Interesting clubs in Longhua','Tips on talking with foreigners','English Corner for delivery riders','Skills for community volunteers'],a:2,p:0,ev:'This sentence is part of a “Bee English Corner”, a practical English training program.',note:'全文围绕骑手英语角的课程、学习效果和社会作用，C覆盖全文且准确。其余标题或过宽、或未突出对象。'}]},
{id:'readB',name:'阅读B',title:'Fan Kuan and Nature',range:'16—20题',kind:'choice',paras:[
`Fan Kuan was one of the greatest landscape painters of the Song dynasty. Many young artists always asked him to teach them to paint.`,
`“You must study with a greater master than me,” Fan replied.`,
`“Who is he? Where can we find him?” they asked curiously.`,
`Fan replied with a smile, “He is called Nature. He lives all around you.”`,
`Fan painted with the idea of being in harmony with nature. He believed that if you wanted to understand nature, you had to touch it, smell it and listen to it. That was what he always did. He lived in mountains and forests, and watched the seasons change. However, many people thought he was strange.`,
`One foggy morning, after sleeping under a rock, Fan saw an old farmer.`,
`“Stop right there!” the farmer warned. He never expected to meet a stranger there.`,
`Fan stayed calm. “Don't be scared, my friend! I'm just trying to find my way.”`,
`“What are you doing in the mountains?” the farmer asked.`,
`“Looking. Thinking,” answered Fan.`,
`The farmer relaxed when he was certain this strange man was no danger. He invited Fan to his home and gave him something to eat. Fan, in return, painted a picture for the farmer. Everything in the picture, the farmer, the trees and the mountains, was so vivid that the farmer was shocked. He wondered how Fan had done it.`,
`Fan told him that it was a gift from the mountains.`,
`As Fan was leaving, the farmer asked where he lived. Fan answered that mountains or forests, east or west, all could be his home.`
],qs:[
{n:16,stem:'According to Fan, how should young painters learn painting?',opts:['Learn at different schools.','Practice hard on their own.','Copy the works of masters.','Get thoughts from nature.'],a:3,p:3,ev:'He is called Nature. He lives all around you.',note:'范宽认为自然是更好的老师，年轻画家应从自然获得灵感。C只说临摹大师，未抓住Nature。'},
{n:17,stem:'Why did Fan live in mountains and forests?',opts:['To search for valuable paintings.','To understand nature deeply.','To escape from the young artists.','To find a quiet place for sleep.'],a:1,p:4,ev:'if you wanted to understand nature, you had to touch it, smell it and listen to it',note:'住山林、看季节变化，是为了深入理解自然。岩石下睡觉只是细节，不是主要目的。'},
{n:18,stem:'From his talk with the farmer, what can we learn about Fan?',opts:['He was calm and relaxed.','He was afraid of the farmer.','He was friendly and rich.','He was angry at the warning.'],a:0,p:7,ev:'Fan stayed calm.',note:'面对警告，他保持冷静，还安慰农民不要害怕，选A。C里的rich没有依据，不能因为friendly正确就选整个选项。'},
{n:19,stem:'What does the underlined word “vivid” mean?',opts:['strange and boring','simple and short','clear and lively','old and common'],a:2,p:10,ev:'was so vivid that the farmer was shocked',note:'画中的人、树、山十分逼真、生动，令农民震惊，因此vivid＝清晰生动、栩栩如生。其余含义不符合赞叹的语境。'},
{n:20,stem:'What is the main idea of the article?',opts:['Ways to learn from nature.','Stories between two painters.','Importance of art in real life.','A painter and his artistic idea.'],a:3,p:4,ev:'Fan painted with the idea of being in harmony with nature.',note:'全文讲范宽这位画家，以及向自然学习的艺术理念，D最完整。农民不是第二位画家，A只涵盖一部分。'}]},
{id:'readC',name:'阅读C',title:'Sound Waves and Fire',range:'21—25题',kind:'choice',paras:[
`A wildfire burns in hills, spreading quickly from one piece of dry grass to another. The plants around the house burn, but the house itself refuses to catch fire. There's no water in sight—the fire is being stopped by sound waves. This technology may soon help fight wildfires.`,
`The key parts for a fire are heat, fuel and oxygen. Remove any one of them, and the fire is put out. Sound waves can move oxygen away from the fuel, so the fire cannot get enough air to keep burning.`,
`For this purpose, Geoff Bruder, an energy engineer, founded Sonic Fire Tech (SFT) to build a sound-making machine. Placed on roofs, the machine starts on its own when sensors find a fire, creating sound waves to put out the fire and prevent new fires from starting. It can stop fires from up to 25 feet away.`,
`The major challenge is to make the technology used widely without creating harmful sound effects. SFT solves this problem by using sound waves that people cannot hear. While earlier machines used sound waves from 30 to 60 Hz, SFT stays at or below 20 Hz. Besides, such waves can travel over longer distances.`,
`Although sound waves can effectively control fire, the technology only works for small fires. Even so, it brings a new way. People believe the technology will be a “{{25}}” for fighting against fires. SFT is working with two California companies to develop its technology. Some homeowners have also made agreements with the company, which had 50 test runs early in 2026.`
],qs:[
{n:21,stem:'Why does Paragraph 1 describe a wildfire?',opts:['To remind us to prepare enough water.','To advise on keeping houses safe.','To show how serious wildfires can be.','To introduce a new technology.'],a:3,p:0,ev:'This technology may soon help fight wildfires.',note:'第一段用火被声波阻止的场景引出新技术。C只解释开头的火势，无法覆盖后面的声波灭火。'},
{n:22,stem:'How can sound waves put out a fire?',opts:['By taking air away.','By lowering the heat.','By removing the fuel.','By giving warning sounds.'],a:0,p:1,ev:'Sound waves can move oxygen away from the fuel',note:'按文中描述，声波移走氧气，火得不到足够空气，对应A。没有说降低温度、移除燃料或靠警报声灭火。'},
{n:23,stem:'From Paragraph 3, what can we know about the machine?',opts:['It puts out fires over 25 feet away.','It starts itself when fires break out.','It only works for fires in rooms.','It collects fire data for engineers.'],a:1,p:2,ev:'the machine starts on its own when sensors find a fire',note:'传感器发现火情时机器自动启动，对应B。up to 25 feet＝最远可达25英尺，不是超过25英尺，因此A错。'},
{n:24,stem:"According to Paragraph 4, what is the advantage of SFT's technology?",opts:['Cheaper and safer.','Farther and faster.','Safer and farther.','Closer and greener.'],a:2,p:3,ev:'without creating harmful sound effects / travel over longer distances',note:'这一段比较的是声音影响和传播距离：减少有害声音影响、传播更远，对应C。价格与速度没有比较。'},
{n:25,stem:'Which one can be put back into the blank in Paragraph 5?',opts:['zoo keeper','promise breaker','game changer','trouble maker'],a:2,p:4,ev:'Even so, it brings a new way.',note:'新技术带来新的灭火方式，game changer＝能显著改变局面的事物，符合积极评价。其余分别是动物园饲养员、不守承诺者、制造麻烦者。'}]},
{id:'gap',name:'短文填空',title:'Critical Thinking',range:'26—30题',kind:'gap',bank:[
['A','Is there a better way to divide the work?'],['B','He meant that many messages were not totally true.'],['C','Social media makes our life easier and more enjoyable.'],['D','After all, the smartest students are not the ones who know answers.'],['E','With the right method, everyone can get better at math or languages.'],['F','Today, the saying is more useful than ever, especially with online data.']
],paras:[
`In ancient Rome, people believed that salt could stop poison. If one ate food with a grain of salt, he would be safer. Later, a writer borrowed this idea. {{26}} Instead of trusting the messages blindly, people should accept them “with a grain of salt”.`,
`{{27}} AI can provide fast answers, but it may also create wrong ideas. So we need critical thinking to judge information wisely. Imagine your teammate suggests a plan. Everyone else agrees right away. However, a critical thinker will ask: “Do we have the materials to finish this? {{28}}” These questions do not make you a troublemaker—they make the project stronger.`,
`Critical thinking also shines in facing wrong ideas in your studies. You've probably heard “you're either good at math or languages”. A critical thinker will look for evidence. In fact, studies show that people have different learning styles. {{29}} Critical thinking turns you from a negative learner into an active one.`,
`This spirit goes far beyond teamwork and study. Next time you're going to hit “share” on a post, stop for 10 seconds. Why might they share this information? You'll be surprised by how much better your decisions become. {{30}} Instead, they're the ones who know how to ask the right questions.`
],qs:[
{n:26,a:1,p:0,ev:'Later, a writer borrowed this idea. / Instead of trusting the messages blindly',note:'B的He指前面的作家，说明他的用意是很多信息未必完全真实；messages又与后文衔接。with a grain of salt在这里表示有所保留、不能全信。'},
{n:27,a:5,p:1,ev:'AI can provide fast answers, but it may also create wrong ideas.',note:'F从古老说法转到今天的网络信息环境，引出AI可能产生错误信息，因此衔接自然。'},
{n:28,a:0,p:1,ev:'Do we have the materials to finish this? / These questions',note:'后文These questions说明这里还要补一个问题。A问有没有更好的分工方式，符合团队完成项目的语境。'},
{n:29,a:4,p:2,ev:'people have different learning styles',note:'E说明方法合适，每个人都能在数学或语言上进步，反驳前面的“只能擅长其中一项”。'},
{n:30,a:3,p:3,ev:"Instead, they're the ones who know how to ask the right questions.",note:'D先说最聪明的学生不是只知道答案的人，后文Instead转向知道怎样提正确问题的人，形成对照。C是多余选项。'}]},

{id:'grammar',name:'语法填空',title:'Hakka Bamboo Hats',range:'36—45题',kind:'input',paras:[
`When going out or working in the fields, Hakka women used to wear bamboo hats. In their daily life, the hats played {{36}} important role. They are made with {{37}} (patient) and hard work.`,
`Every few days, Zhang Guanxian goes to a bamboo forest {{38}} (pick) proper bamboo for hat-making. He is one of the few remaining bamboo hat craftsmen in Gankeng Village. Zhang started learning the craft {{39}} the age of sixteen. His worn hands show his long time of hard work. Dating back to over 200 years ago, the craft has been passed on to the {{40}} (six) generation.`,
`Making Gankeng bamboo hats requires 33 steps. Each shows Gankeng people's wisdom. There are two pattern {{41}} (style) of Hakka bamboo hat: Starry Sky and Emei Flowers. Craftsmen can't afford to make any mistakes {{42}} the pattern is too difficult. It requires the effort of both men and women.`,
`However, there is no detailed written record about how to make Hakka bamboo hats. It {{43}} (simple) depends on the master to pass on experience. As Hakka bamboo hats are disappearing from the market, this traditional craft is in danger of dying out.`,
`In 2006, Gankeng bamboo hat {{44}} (list) as Shenzhen's Intangible Cultural Heritage. Experienced craftsmen like Zhang are named as inheritors of the Hakka bamboo hat. At present, Gankeng Village {{45}} (call) on villagers to learn the craft, but only two young villagers are doing so.`
],qs:[
{n:36,answers:['an'],p:0,ev:'played ___ important role',note:'play an important role＝发挥重要作用。role是可数名词单数，important以元音音素开头，因此用an，不是a。'},
{n:37,given:'patient',answers:['patience'],p:0,ev:'with ___ (patient) and hard work',note:'with后需要名词，并与hard work并列。patient（有耐心的）变成patience（耐心），不可数，不加s。'},
{n:38,given:'pick',answers:['to pick'],p:1,ev:'goes to a bamboo forest ___ (pick) proper bamboo',note:'去竹林是为了挑选竹子，to＋动词原形表示目的，因此to pick。'},
{n:39,answers:['at'],p:1,ev:'___ the age of sixteen',note:'at the age of＋年龄＝在……岁时。把整个词组记住。'},
{n:40,given:'six',answers:['sixth'],p:1,ev:'the ___ (six) generation',note:'表示第六代，用序数词sixth，不是表示数量的six。'},
{n:41,given:'style',answers:['styles'],p:2,ev:'two pattern ___ (style)',note:'two说明两种样式，名词style要用复数styles。后面的两种图案也印证复数。'},
{n:42,answers:['because','since','as'],p:2,ev:"can't afford to make any mistakes ___ the pattern is too difficult",note:'后半句解释原因：因为图案太复杂。首选because；since/as在这里也可表达原因，本练习接受这些合理填写。'},
{n:43,given:'simple',answers:['simply'],p:3,ev:'It ___ (simple) depends on the master',note:'修饰动词短语depends on，用副词simply，表示仅仅、只是。不是simple，也不是simplely。'},
{n:44,given:'list',answers:['was listed'],p:4,ev:"In 2006, Gankeng bamboo hat ___ (list) as Shenzhen's Intangible Cultural Heritage.",note:'In 2006表示过去；竹帽是被列入名录，需过去时被动语态。主语为单数，因此was listed。'},
{n:45,given:'call',answers:['is calling','calls'],p:4,ev:'At present, Gankeng Village ___ (call) on villagers to learn the craft',note:'首选is calling，表示目前正在开展号召活动。call on somebody to do something＝号召某人做某事。calls表示当前做法，语法也成立，本练习接受。最终考试评分以学校参考答案为准。'}]},

function options(m,q){return q.opts||m.bank.map(x=>x[1])}
function answerText(m,q){return q.answers?q.answers[0]:String.fromCharCode(65+q.a)+' · '+options(m,q)[q.a]}
function passage(m){if(m.kind==='match')return m.bank.map((b,i)=>`<section class="hall" id="e-${m.id}-${i}"><h3>${b[0]} · ${words(b[1].split(' shows')[0].split(' answers')[0])}</h3><p>${words(b[1])}</p></section>`).join('');return m.paras.map((p,i)=>`<p class="paragraph" id="e-${m.id}-${i}"><span class="paragraph-num">${i+1}</span>${p.split(/(\{\{\d+\}\})/).map(t=>{const match=t.match(/^\{\{(\d+)\}\}$/);if(!match)return words(t);const n=+match[1],q=m.qs.find(x=>x.n===n),v=state.answers[n];const label=state.submitted[m.id]?q.answers?q.answers[0]:options(m,q)[q.a]:q.answers?String(v||'_____'):Number.isInteger(v)?options(m,q)[v]:'_____';return `<button class="blank" data-blank="${n}" type="button">(${n}) ${esc(label||'_____')}</button>`}).join('')}</p>`).join('')}
function question(m,q){const submitted=state.submitted[m.id],v=state.answers[q.n];let content='';
if(q.answers){content=`<div class="entry"><input data-input="${q.n}" aria-label="第${q.n}题填写答案" value="${esc(v||'')}" placeholder="${q.given?'提示词：'+q.given:'输入答案'}" autocomplete="off" autocapitalize="none" spellcheck="false" ${submitted?'disabled':''}></div>`}
else content=`<div class="options ${m.kind==='gap'||m.kind==='match'?'six':'four'}">${options(m,q).map((o,i)=>`<div class="choice ${v===i?'selected':''} ${submitted&&q.a===i?'correct':''} ${submitted&&v===i&&q.a!==i?'wrong':''}"><button class="pick" type="button" data-choice="${q.n}" data-index="${i}" aria-label="第${q.n}题选择${String.fromCharCode(65+i)}" aria-pressed="${v===i}" ${submitted?'disabled':''}>${String.fromCharCode(65+i)}</button><span class="option-text">${words(m.kind==='match'?m.bank[i][1].split(' shows')[0].split(' answers')[0]:o)}</span></div>`).join('')}</div>`;
return `<article class="question-card" id="q-${q.n}"><div class="question-head"><h3>第${q.n}题</h3><button class="secondary context-btn" data-evidence="${m.id}:${q.p}" type="button">看原文</button></div>${q.stem?`<p class="question-stem">${words(q.stem)}</p>`:''}${content}${submitted?`<div class="explain"><p class="${good(q)?'good':'bad'}">${good(q)?'✓ 正确':'需要订正'} · ${words('参考答案：'+answerText(m,q))}${q.n===42||q.n===45?'（接受合理替代答案）':''}</p><p>${words(q.note)}</p><p><strong>原文依据：</strong>${words(q.ev)}</p></div>`:''}</article>`}
function writing(){const w=exam.find(x=>x.id==='writing');return `<div class="writing"><p class="note">假设你是中学生李华，向学校英语报 ${words('My Story')} 栏目投稿。从“智慧之美”和“亲情之美”中任选一个，写出感受美的经历和感悟。约80词，已给开头结尾不计入总词数；不出现真实姓名和校名。</p><div class="theme-row">${w.themes.map(t=>`<button class="secondary ${state.theme===t[0]?'active-theme':''}" data-theme="${t[0]}" type="button">${t[2]} · ${esc(t[1])}</button>`).join('')}</div><details class="vocab-recall"><summary>写作提示：背景、经过、感受、感悟</summary><div class="writing-hints"><p>先选一件具体的事。亲情主题可写家人照顾或帮助你；智慧主题可写用一个好方法解决困难。</p><ol><li>什么时候、在哪里：${words('Last Sunday, I was…')}</li><li>遇到了什么：${words('I felt ill. / I could not…')}</li><li>怎样得到帮助或解决问题：${words('My mother helped me… / I tried a new way.')}</li><li>感受和感悟：${words('I felt warm and thankful. / I learned that…')}</li></ol><p>经历主要用过去时；现在的感悟可以用现在时。这里是提示句，不是完整范文。</p></div></details><p class="english letter">${words("Dear Mr. Long,")}<br>${words("I'm Li Hua. I'm so glad to share with you my experiences of feeling beauty.")}</p><label for="draft"><strong>在这里写正文</strong></label><textarea id="draft" placeholder="先用简单句写清楚发生了什么……" spellcheck="false">${esc(state.draft)}</textarea><p class="muted" id="draftCount"></p><p class="english letter">${words('Thank you! I am looking forward to your reply.')}<br>${words('Yours,')}<br>${words('Li Hua')}</p><p class="note">作文由老师讲评，不自动判分。检查：是否写了具体经历和感悟、动词时态是否正确、是否有大写与标点。</p></div>`}
function render(){const m=exam.find(x=>x.id===state.tab)||exam[0];state.tab=m.id;$('moduleTitle').textContent=m.title;$('range').textContent=m.range;$('moduleTip').textContent=m.kind==='writing'?'选择一个主题，写出一件具体的事。':'点击英文查词；点击选项左侧字母作答。提交后可看解析并重做错题。';$('tabs').innerHTML=exam.map(x=>`<button class="tab ${x.id===m.id?'active':''}" type="button" data-tab="${x.id}" aria-pressed="${x.id===m.id}">${x.name}</button>`).join('');
const visible=state.wrongOnly[m.id]?m.qs.filter(q=>!good(q)):m.qs;const score=m.qs.filter(good).length,answered=m.qs.filter(q=>q.answers?String(state.answers[q.n]||'').trim():Number.isInteger(state.answers[q.n])).length;
$('surface').innerHTML=m.kind==='writing'?writing():`<div class="reading-layout"><article class="passage" id="passage">${passage(m)}</article><div class="reading-questions">${visible.length?visible.map(q=>question(m,q)).join(''):'<p class="note">全部答对！可以切换题型继续学习。</p>'}</div></div><div class="bar"><button class="primary" data-submit type="button" ${state.submitted[m.id]?'disabled':''}>${state.submitted[m.id]?'已提交':'提交本部分'}</button><button class="secondary" data-retry type="button" ${state.submitted[m.id]&&score<m.qs.length?'':'hidden'}>只重做错题</button><button class="secondary" data-showall type="button" ${state.wrongOnly[m.id]?'':'hidden'}>查看全部题目</button><button class="secondary" data-redo type="button">重新练习本部分</button><button class="secondary" data-undo type="button" ${state.backups[m.id]?'':'hidden'}>撤销重新练习</button><p id="result" role="status">${state.submitted[m.id]?`本部分正确 ${score} / ${m.qs.length}`:`已作答 ${answered} / ${m.qs.length}`}</p></div>`;
if(m.kind==='writing')draftCount();renderVocab();progress();}
function progress(){const qs=exam.flatMap(m=>m.qs);const done=qs.filter(q=>{const m=exam.find(x=>x.qs.includes(q));return state.submitted[m.id]&&good(q)}).length;$('overall').textContent=done+' / 45';$('progress').style.width=(done/45*100)+'%'}
function renderVocab(){$('vocabCount').textContent=Object.keys(state.marks).length;$('vocabList').innerHTML=Object.keys(state.marks).length?Object.keys(state.marks).map(w=>`<div class="vocab-item"><button data-dict="${esc(w)}" type="button"><strong>${esc(w)}</strong><span>${esc(findMeaning(w))}</span></button><button class="close" data-unmark="${esc(w)}" type="button" aria-label="取消标记${esc(w)}">×</button></div>`).join(''):'<p class="muted">点过的英文词会自动加入，可在查词窗口或这里取消标记。</p>'}
function draftCount(){const n=(state.draft.match(/\b[A-Za-z]+(?:['’][A-Za-z]+)?\b/g)||[]).length;$('draftCount').textContent=`正文 ${n} 词 · 建议约80词 · 已给开头和结尾不计入`}
function speak(word,slow=false){if(currentAudio)currentAudio.pause();if(window.speechSynthesis)window.speechSynthesis.cancel();const fallback=()=>{if(!window.speechSynthesis){toast('发音暂不可用，请老师报读');return}const s=new SpeechSynthesisUtterance(word);s.lang='en-GB';s.rate=slow?.65:.85;window.speechSynthesis.speak(s)};const a=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(word)+'&type=2');currentAudio=a;a.playbackRate=slow?.72:1;a.onerror=()=>{if(currentAudio===a)fallback()};a.play().catch(()=>{if(currentAudio===a)fallback()})}
let timer;function toast(s){$('toast').hidden=false;$('toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2800)}
function markWord(w){state.marks[w]='unknown';save();if(window.HonghaoCloud)window.HonghaoCloud.trackWord(w,'unknown','month-test',findMeaning(w)).catch(()=>{})}
function openWord(w,target){activeWord=w;lastFocus=target;if(!state.marks[w])markWord(w);document.querySelectorAll('[data-word]').forEach(x=>x.classList.toggle('marked',Boolean(state.marks[x.dataset.word])));$('dialogWord').textContent=w;$('dialogMeaning').textContent=findMeaning(w)||'请和老师一起确认这个词的意思';$('wordDialog').hidden=false;$('toggleMark').textContent=state.marks[w]?'取消生词标记':'标记为生词';renderVocab();$('closeWord').focus()}
function closeWord(){$('wordDialog').hidden=true;if(lastFocus?.isConnected)lastFocus.focus()}
function evidence(id){document.querySelectorAll('.paragraph.focused,.hall.focused').forEach(x=>x.classList.remove('focused'));const el=$('e-'+id.replace(':','-'));if(el){el.classList.add('focused');el.scrollIntoView({behavior:'smooth',block:'center'})}}
document.addEventListener('click',e=>{const t=e.target;const word=t.closest('[data-word],[data-dict]');if(word){openWord(word.dataset.word||word.dataset.dict,word);return}const tab=t.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;save();render();$('lesson').scrollIntoView({block:'start'});return}
const ev=t.closest('[data-evidence]');if(ev){evidence(ev.dataset.evidence);return}const blank=t.closest('[data-blank]');if(blank){state.wrongOnly[state.tab]=false;render();$('q-'+blank.dataset.blank)?.scrollIntoView({behavior:'smooth',block:'center'});return}
const pick=t.closest('[data-choice]');if(pick){const m=exam.find(x=>x.id===state.tab);if(state.submitted[m.id])return;const scroll=$('passage').scrollTop;state.answers[pick.dataset.choice]=+pick.dataset.index;save();render();$('passage').scrollTop=scroll;document.querySelector(`[data-choice="${pick.dataset.choice}"][data-index="${pick.dataset.index}"]`)?.focus({preventScroll:true});return}
const m=exam.find(x=>x.id===state.tab);if(t.closest('[data-submit]')){const missing=m.qs.find(q=>q.answers?!String(state.answers[q.n]||'').trim():!Number.isInteger(state.answers[q.n]));if(missing){toast('还有题目未填写，请先完成第'+missing.n+'题');$('q-'+missing.n)?.scrollIntoView({block:'center'});$('q-'+missing.n)?.querySelector('input')?.focus();return}state.submitted[m.id]=true;save();render();$('result').scrollIntoView({block:'center'});return}
if(t.closest('[data-retry]')){for(const q of m.qs)if(!good(q))delete state.answers[q.n];state.submitted[m.id]=false;state.wrongOnly[m.id]=true;save();render();return}
if(t.closest('[data-showall]')){state.wrongOnly[m.id]=false;save();render();return}
if(t.closest('[data-redo]')){state.backups[m.id]={answers:Object.fromEntries(m.qs.filter(q=>state.answers[q.n]!==undefined).map(q=>[q.n,state.answers[q.n]])),submitted:!!state.submitted[m.id],wrongOnly:!!state.wrongOnly[m.id]};for(const q of m.qs)delete state.answers[q.n];state.submitted[m.id]=false;state.wrongOnly[m.id]=false;save();render();toast('已重新开始，可撤销恢复');return}
if(t.closest('[data-undo]')){const b=state.backups[m.id];if(b){for(const q of m.qs)delete state.answers[q.n];Object.assign(state.answers,b.answers);state.submitted[m.id]=b.submitted;state.wrongOnly[m.id]=b.wrongOnly;delete state.backups[m.id];save();render();toast('已恢复原来的答题记录')}return}
const theme=t.closest('[data-theme]');if(theme){state.theme=theme.dataset.theme;save();render();return}
const remove=t.closest('[data-unmark]');if(remove){delete state.marks[remove.dataset.unmark];save();renderVocab();document.querySelectorAll('[data-word]').forEach(x=>x.classList.toggle('marked',Boolean(state.marks[x.dataset.word])));return}
});
document.addEventListener('input',e=>{if(e.target.matches('[data-input]')){state.answers[e.target.dataset.input]=e.target.value;save();const m=exam.find(x=>x.id===state.tab);$('result').textContent='已作答 '+m.qs.filter(q=>String(state.answers[q.n]||'').trim()).length+' / '+m.qs.length}if(e.target.id==='draft'){state.draft=e.target.value;save();draftCount()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWord();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-word]')){e.preventDefault();openWord(e.target.dataset.word,e.target)}if(e.key==='Tab'&&!$('wordDialog').hidden){const a=[...$('wordDialog').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
$('closeWord').onclick=closeWord;$('wordDialog').onclick=e=>{if(e.target===$('wordDialog'))closeWord()};$('dialogAudio').onclick=()=>speak(activeWord);$('dialogSlow').onclick=()=>speak(activeWord,true);$('toggleMark').onclick=()=>{if(state.marks[activeWord])delete state.marks[activeWord];else markWord(activeWord);save();$('toggleMark').textContent=state.marks[activeWord]?'取消生词标记':'标记为生词';renderVocab();document.querySelectorAll('[data-word]').forEach(x=>x.classList.toggle('marked',Boolean(state.marks[x.dataset.word])))};
document.addEventListener('honghao:cloud-synced',()=>{state=read();render()});
render();
})();
</script><script src="cloud-sync.js?v=9"></script></body></html>
