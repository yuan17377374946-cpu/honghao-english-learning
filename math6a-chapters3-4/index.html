const D={"id": "hongren-ch34-20261021", "groups": [{"id": "u31", "c": 3, "title": "多种数量：先求每份剩余，再用字母表示", "method": "看清字母含义 → 分别计算 → 合并", "items": [{"text": "游船码头有a条大船、b条小船，每条大船能坐6人，每条小船能坐4人。现在每条大船已坐2人，每条小船已坐1人。先用含字母的式子表示剩余座位数，再求a=3、b=2时一共还空多少个座位。", "prompt": "每条船还剩多少座位？a和b分别跟哪一种船相对应？", "model": {"type": "capacity", "capA": 6, "capB": 4, "usedA": 2, "usedB": 1, "a": 3, "b": 2}, "steps": ["先逐条看：每条大船还空6−2=4个座位，每条小船还空4−1=3个座位。", "a条大船空4a个座位，b条小船空3b个座位，合起来是4a+3b。", "代入a=3、b=2：4×3+3×2=18（个）。"], "answers": [{"label": "剩余座位", "value": "18", "unit": "个"}], "captions": ["先画“一条大船”和“一条小船”，别急着把a、b混在一起。", "着色部分是已坐人的座位；空白部分才是所求。", "先求每条空位，再分别乘大船、小船条数。", "剩余座位=4a+3b；代入后为18个。"], "formula": "剩余座位=(6−2)a+(4−1)b", "trap": "a条大船和b条小船是两种数量，不能用同一个字母代替。", "id": "u31-0", "level": "核心题", "chapter": 3}, {"text": "游船码头有a条大船、b条小船，每条大船能坐8人，每条小船能坐5人。现在每条大船已坐3人，每条小船已坐2人。先用含字母的式子表示剩余座位数，再求a=2、b=4时一共还空多少个座位。", "prompt": "每条船还剩多少座位？a和b分别跟哪一种船相对应？", "model": {"type": "capacity", "capA": 8, "capB": 5, "usedA": 3, "usedB": 2, "a": 2, "b": 4}, "steps": ["先逐条看：每条大船还空8−3=5个座位，每条小船还空5−2=3个座位。", "a条大船空5a个座位，b条小船空3b个座位，合起来是5a+3b。", "代入a=2、b=4：5×2+3×4=22（个）。"], "answers": [{"label": "剩余座位", "value": "22", "unit": "个"}], "captions": ["先画“一条大船”和“一条小船”，别急着把a、b混在一起。", "着色部分是已坐人的座位；空白部分才是所求。", "先求每条空位，再分别乘大船、小船条数。", "剩余座位=5a+3b；代入后为22个。"], "formula": "剩余座位=(8−3)a+(5−2)b", "trap": "a条大船和b条小船是两种数量，不能用同一个字母代替。", "id": "u31-1", "level": "对应变式", "chapter": 3}]}, {"id": "u32", "c": 3, "title": "共边拼搭：由小棒根数反求图形个数", "method": "找到共用边 → 写规律 → 反求个数", "items": [{"text": "用同样长的小棒，把正方形首尾相接摆成一行，相邻两个图形只共用一条边，不重叠。现有31根小棒，全部用完，能摆出多少个正方形？先画出前3个图形，再写出摆n个时的小棒根数。", "prompt": "第二个图形还需要完整的一组小棒吗？一共增加了n次，还是n−1次？", "model": {"type": "sticks", "shape": "square", "first": 4, "add": 3, "total": 31, "n": 10}, "steps": ["第一个图形需要4根；以后每增加一个图形，因为共用一条边，只增加3根。", "摆n个图形，小棒根数为4+3(n−1)，也就是3n+1。", "根据3n+1=31，得到n=(31−1)÷3=10。", "检验：4+3×(10−1)=31，所以能摆10个。"], "answers": [{"label": "图形个数", "value": "10", "unit": "个"}], "captions": ["先看前3个图形，圈出相邻图形共用的边。", "共用边只算一次；第一个要完整计算。", "第一个用4根，后面每次只增加3根。", "4+3(n−1)=31，所以n=10。"], "formula": "4+3(n−1)=31", "trap": "已经算了第一个，后面只剩n−1个；直接乘完整边数会重复算共用边。", "id": "u32-0", "level": "核心题", "chapter": 3}, {"text": "用同样长的小棒，把三角形首尾相接摆成一行，相邻两个图形只共用一条边，不重叠。现有25根小棒，全部用完，能摆出多少个三角形？先画出前3个图形，再写出摆n个时的小棒根数。", "prompt": "第二个图形还需要完整的一组小棒吗？一共增加了n次，还是n−1次？", "model": {"type": "sticks", "shape": "triangle", "first": 3, "add": 2, "total": 25, "n": 12}, "steps": ["第一个图形需要3根；以后每增加一个图形，因为共用一条边，只增加2根。", "摆n个图形，小棒根数为3+2(n−1)，也就是2n+1。", "根据2n+1=25，得到n=(25−1)÷2=12。", "检验：3+2×(12−1)=25，所以能摆12个。"], "answers": [{"label": "图形个数", "value": "12", "unit": "个"}], "captions": ["先看前3个图形，圈出相邻图形共用的边。", "共用边只算一次；第一个要完整计算。", "第一个用3根，后面每次只增加2根。", "3+2(n−1)=25，所以n=12。"], "formula": "3+2(n−1)=25", "trap": "已经算了第一个，后面只剩n−1个；直接乘完整边数会重复算共用边。", "id": "u32-1", "level": "对应变式", "chapter": 3}]}, {"id": "u33", "c": 3, "title": "拼桌子：扣掉被挡住的座位", "method": "画接缝 → 扣座位 → 判断至少多少张", "items": [{"text": "餐厅每张正方形桌单独放时能坐4人。把桌子沿同一方向拼成一长排，每拼接一处，就有两个原来的座位不能使用。要安排26人全部坐下，至少需要多少张桌子？", "prompt": "请画出1张、2张、3张桌子。桌子有n张，拼接处有几处？", "model": {"type": "tables", "per": 4, "guests": 26, "n": 12}, "steps": ["n张桌子分别放，可以坐4n人。拼成一排有n−1处接缝，每处少2个座位。", "可坐人数=4n−2(n−1)=2n+2。", "先算(26−2)÷2=12。正好是整数。", "用12张可以坐26人；用11张只能坐24人，因此至少需要12张。"], "answers": [{"label": "最少桌子数", "value": "12", "unit": "张"}], "captions": ["桌子单独放时，每张四周都可以坐人。", "把桌子拼起来，接缝处原来的座位不能再坐。", "n张桌子只有n−1处接缝，每处少2个座位。", "可坐人数=2n+2，至少要12张桌子。"], "formula": "可坐人数=4n−2(n−1)=2n+2", "trap": "拼接处是n−1处；“至少”需要检查取整后的桌子是否够坐。", "id": "u33-0", "level": "核心题", "chapter": 3}, {"text": "餐厅每张长方形桌单独放时能坐6人。把桌子沿同一方向拼成一长排，每拼接一处，就有两个原来的座位不能使用。要安排40人全部坐下，至少需要多少张桌子？", "prompt": "请画出1张、2张、3张桌子。桌子有n张，拼接处有几处？", "model": {"type": "tables", "per": 6, "guests": 40, "n": 10}, "steps": ["n张桌子分别放，可以坐6n人。拼成一排有n−1处接缝，每处少2个座位。", "可坐人数=6n−2(n−1)=4n+2。", "先算(40−2)÷4=9.5。桌子要取整数，9张不够，向上取10张。", "用10张可以坐42人；用9张只能坐38人，因此至少需要10张。"], "answers": [{"label": "最少桌子数", "value": "10", "unit": "张"}], "captions": ["桌子单独放时，每张四周都可以坐人。", "把桌子拼起来，接缝处原来的座位不能再坐。", "n张桌子只有n−1处接缝，每处少2个座位。", "可坐人数=4n+2，至少要10张桌子。"], "formula": "可坐人数=6n−2(n−1)=4n+2", "trap": "拼接处是n−1处；“至少”需要检查取整后的桌子是否够坐。", "id": "u33-1", "level": "对应变式", "chapter": 3}]}, {"id": "u34", "c": 3, "title": "日历规律：已知总和，反求日期", "method": "选基准 → 表示相邻日期 → 利用总和", "items": [{"text": "某个月的日历上，用一个2×2的方框圈住4个完整的日期。这4个日期的和是80。方框里最大的日期是几号？", "prompt": "先选左上角为a，其余3个日期要怎样表示？", "model": {"type": "calendar", "kind": "block", "sum": 80, "a": 16, "answer": 24}, "steps": ["日历中同一行相邻日期差1，同一列上下相邻日期差7。", "若左上角是a，四个数就是a、a+1、a+7、a+8。", "四数和为4a+16=80，得到a=(80−16)÷4=16。", "最大的是右下角：16+8=24，所以是24号。"], "answers": [{"label": "最大的日期", "value": "24", "unit": "号"}], "captions": ["先画一个2×2日历框，选左上角作为基准。", "向右加1，向下加7，而不是向下加10。", "把四个日期写成a、a+1、a+7、a+8。", "四数和4a+16=80，右下角为24号。"], "formula": "a+(a+1)+(a+7)+(a+8)=80", "trap": "日历每行7天；不要把百数表上下相差10的规律套进来。", "id": "u34-0", "level": "核心题", "chapter": 3}, {"text": "某个月的日历上，圈住一个完整的十字形：中间1个日期，以及它上、下、左、右各1个日期。5个日期的和是90。圈住的最早日期是几号？", "prompt": "中间数取a。上下两数、左右两数，分别能怎样配对？", "model": {"type": "calendar", "kind": "cross", "sum": 90, "a": 18, "answer": 11}, "steps": ["把中间日期记为a，左右是a−1、a+1，上下是a−7、a+7。", "左右两数的和是2a，上下两数的和也是2a，再加中间a，总和为5a。", "5a=90，所以中间日期a=18。", "最早的是上方日期：18−7=11，所以是11号。"], "answers": [{"label": "最早的日期", "value": "11", "unit": "号"}], "captions": ["画出完整十字形，中间数作为基准。", "左右差1，上下差7。", "左右配一对、上下配一对，差量正好抵消。", "总和=5×中间日期；中间18号，上方11号。"], "formula": "5a=90；最早日期=a−7", "trap": "求出的中间日期不是最终答案，要继续找到最早的那个。", "id": "u34-1", "level": "对应变式", "chapter": 3}]}, {"id": "u35", "c": 3, "title": "花坛扩建：没有原尺寸也能求周长差", "method": "用字母设原尺寸 → 表示扩建尺寸 → 作差", "items": [{"text": "一个圆形花坛四周向外修了一条2米宽的小路，小路处处等宽，没有给花坛原来的大小，能否求出小路外边界比花坛周长增加了多少米？请画图说明。", "prompt": "路宽增加的是半径，还是整条边长？能用字母表示原来的大小吗？", "model": {"type": "expand", "shape": "circle", "w": 2}, "steps": ["把花坛原半径记为r。向外修2米宽的小路，外圆半径就是r+2。", "外周长减内周长：2π(r+2)−2πr=4π。", "取π≈3.14，增加的周长约为4×3.14=12.56（米）。", "原半径r消去了，所以不需要知道花坛原来的半径。"], "answers": [{"label": "周长增加量", "value": "12.56", "unit": "米"}], "captions": ["图只作示意，原来的大小未知，用字母表示。", "绿色为原花坛，橙色为后来修的小路。", "外圆半径只比内圆增加一个路宽。", "新旧周长相减，原半径消去，增加量为2π×路宽。"], "formula": "2π(r+2)−2πr=4π", "trap": "要先画清宽度使哪条长度增加多少，再列式；不能直接把路宽加到周长上。", "id": "u35-0", "level": "核心题", "chapter": 3}, {"text": "一个正方形花坛四周向外修了一条1.5米宽的小路，小路处处等宽，外边界仍为正方形。没有给花坛原来的大小，能否求出小路外边界比花坛周长增加了多少米？请画图说明。", "prompt": "路宽增加的是半径，还是整条边长？能用字母表示原来的大小吗？", "model": {"type": "expand", "shape": "square", "w": 1.5}, "steps": ["把原正方形边长记为a。每边两端各向外增加1.5米，新边长为a+3。", "外周长减内周长：4(a+3)−4a=12（米）。", "注意小路宽1.5米，但边长增加的是两侧合计3米。", "结果与原边长a无关，所以原边长没有给出也能求解。"], "answers": [{"label": "周长增加量", "value": "12", "unit": "米"}], "captions": ["图只作示意，原来的大小未知，用字母表示。", "绿色为原花坛，橙色为后来修的小路。", "每条边长在两侧各增加一个路宽。", "新旧周长相减，原边长消去，增加量为8×路宽。"], "formula": "4(a+3)−4a=12", "trap": "要先画清宽度使哪条长度增加多少，再列式；不能直接把路宽加到周长上。", "id": "u35-1", "level": "对应变式", "chapter": 3}]}, {"id": "u41", "c": 4, "title": "连续对应：先求其中的一部分，再求其余", "method": "找两个整体 → 连续求部分 → 回到全体求剩余", "items": [{"text": "学校科技小组有48人，其中3/4参加模型制作；参加模型制作的人中，又有2/3参加飞机制作。科技小组中没有参加飞机制作的一共有多少人？", "prompt": "两个分数分别对应谁？没参加飞机制作的人，是否全都在模型制作小组外？", "model": {"type": "nested", "N": 48, "a": "3/4", "b": "2/3", "k": 6, "n": 12, "inside": 24, "rest": 24}, "steps": ["第一个分数3/4对应整个科技小组，模型制作人数为48×3/4=36（人）。", "第二个分数2/3对应模型制作人数，飞机制作人数为36×2/3=24（人）。", "没有参加飞机制作的人数=48−24=24（人）。", "也可以先求飞机制作占整体的1/2，再求其补部分：48×(1−3/4×2/3)=24。"], "answers": [{"label": "未参加飞机制作", "value": "24", "unit": "人"}], "captions": ["整条线段表示学校这个小组的全部人数。", "蓝色部分参加模型制作，第一个分数对应全部人数。", "只在蓝色部分内部，再找参加飞机制作的人。", "最后要求的是飞机制作以外的所有人，包括图中两种未选部分。"], "formula": "48×(1−3/4×2/3)=24", "trap": "第二个分数对应模型制作人数；不能直接从整体减去两个分数。", "id": "u41-0", "level": "核心题", "chapter": 4}, {"text": "学校社团有60人，其中4/5参加模型制作；参加模型制作的人中，又有3/4参加飞机制作。社团中没有参加飞机制作的一共有多少人？", "prompt": "两个分数分别对应谁？没参加飞机制作的人，是否全都在模型制作小组外？", "model": {"type": "nested", "N": 60, "a": "4/5", "b": "3/4", "k": 9, "n": 12, "inside": 36, "rest": 24}, "steps": ["第一个分数4/5对应整个社团，模型制作人数为60×4/5=48（人）。", "第二个分数3/4对应模型制作人数，飞机制作人数为48×3/4=36（人）。", "没有参加飞机制作的人数=60−36=24（人）。", "也可以先求飞机制作占整体的3/5，再求其补部分：60×(1−4/5×3/4)=24。"], "answers": [{"label": "未参加飞机制作", "value": "24", "unit": "人"}], "captions": ["整条线段表示学校这个小组的全部人数。", "蓝色部分参加模型制作，第一个分数对应全部人数。", "只在蓝色部分内部，再找参加飞机制作的人。", "最后要求的是飞机制作以外的所有人，包括图中两种未选部分。"], "formula": "60×(1−4/5×3/4)=24", "trap": "第二个分数对应模型制作人数；不能直接从整体减去两个分数。", "id": "u41-1", "level": "对应变式", "chapter": 4}]}, {"id": "u42", "c": 4, "title": "比较标准变化：同一个差，两个不同分率", "method": "画齐两端 → 标出差 → 分别确定比较标准", "items": [{"text": "一件商品原价40元，现在售价50元。（1）现在比原来提高了几分之几？（2）反过来，原来比现在少几分之几？", "prompt": "相差量有没有变？两问拿来作比较标准的量，是否相同？", "model": {"type": "compare", "old": 40, "new": 50, "diff": 10, "unit": "元"}, "steps": ["两问的相差量相同，都是10元。", "第一问以原来的40元为标准，分率=10÷40=1/4。", "第二问以现在的50元为标准，分率=10÷50=1/5。", "相差量虽然相同，但比较标准不同，两个分率不能照抄。"], "answers": [{"label": "第（1）问", "value": "1/4", "unit": ""}, {"label": "第（2）问", "value": "1/5", "unit": ""}], "captions": ["两条线段左端对齐，长度按实际数量比例画。", "突出两条线段的差，两个问题的差量相同。", "第一问用原来作标准，第二问改用现在作标准。", "分别得到1/4和1/5，分母随比较标准改变。"], "formula": "第（1）问：10÷40；第（2）问：10÷50", "trap": "“比谁多/少”，就除以谁；别只看“多”和“少”选乘除。", "id": "u42-0", "level": "核心题", "chapter": 4}, {"text": "同一段路，原来坐火车需要30小时，现在只需24小时。（1）现在比原来减少了几分之几？（2）反过来，原来比现在多几分之几？", "prompt": "相差量有没有变？两问拿来作比较标准的量，是否相同？", "model": {"type": "compare", "old": 30, "new": 24, "diff": 6, "unit": "小时"}, "steps": ["两问的相差量相同，都是6小时。", "第一问以原来的30小时为标准，分率=6÷30=1/5。", "第二问以现在的24小时为标准，分率=6÷24=1/4。", "相差量虽然相同，但比较标准不同，两个分率不能照抄。"], "answers": [{"label": "第（1）问", "value": "1/5", "unit": ""}, {"label": "第（2）问", "value": "1/4", "unit": ""}], "captions": ["两条线段左端对齐，长度按实际数量比例画。", "突出两条线段的差，两个问题的差量相同。", "第一问用原来作标准，第二问改用现在作标准。", "分别得到1/5和1/4，分母随比较标准改变。"], "formula": "第（1）问：6÷30；第（2）问：6÷24", "trap": "“比谁多/少”，就除以谁；别只看“多”和“少”选乘除。", "id": "u42-1", "level": "对应变式", "chapter": 4}]}, {"id": "u43", "c": 4, "title": "先增减，再合计：中间量不是最终答案", "method": "找单位“1” → 求比较量 → 求合计", "items": [{"text": "养殖场有白兔48只，黑兔比白兔多1/4。黑兔和白兔一共有多少只？", "prompt": "先把哪一个量看成单位“1”？求出另一个量后，是否已经答完题目？", "model": {"type": "relative", "base": 48, "f": "1/4", "mode": "more", "other": 60, "unit": "只"}, "steps": ["以已知的48只为单位“1”。另一个量是它的1+1/4。", "另一个量=48×(1+1/4)=60（只）。"
