<main class="oral-main"><div class="oral-intro"><div><p class="eyebrow">做完题后的课堂复述</p><h1>说出来，再展开。</h1><p>学生先口头回答；老师展开规则与例子核对，再根据<strong>展开前的回答</strong>记录。只展开答案不会自动算掌握。</p></div><div id="oralStats" class="oral-stats" role="status" aria-live="polite"></div></div>

<p id="oralMessage" class="oral-message" role="status"></p>
<div id="oralTree" class="oral-tree" aria-label="可逐层展开的词形变化导图"></div>

<p id="oralStorage" class="oral-footnote">口头复习由老师记录，保存在当前浏览器；与书面答题成绩分开。再次打开时导图默认收起，核对记录保留。</p></main>
