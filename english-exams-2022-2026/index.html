    const anchor=event.target.closest('a[href]');if(!anchor||event.ctrlKey||event.metaKey||event.shiftKey||anchor.target==='_blank'||anchor.download)return;
    const url=new URL(anchor.href,doc.baseURI);if(url.origin!==location.origin)return;
    if(url.pathname===new URL('../',location.href).pathname){event.preventDefault();window.location.assign(url.href);return;}
    const target=Object.entries(modules).find(([,m])=>new URL(m.path,location.href).pathname===url.pathname);
    if(!target)return;event.preventDefault();let key=target[0];const desired=url.searchParams.get('module');if(key==='exams'&&Object.prototype.hasOwnProperty.call(modules,desired))key=desired;
    const nextUrl=new URL(location.href);if(key==='exams')nextUrl.searchParams.delete('module');else nextUrl.searchParams.set('module',key);
    const requestedPaper=url.searchParams.get('paper');if(key==='exams'&&requestedPaper&&mById(requestedPaper))nextUrl.searchParams.set('paper',requestedPaper);
    if(key!=='exams'&&url.hash)pendingHashes[key]=url.hash;history.pushState(null,'',nextUrl);selectModule(key);if(key!=='exams'&&url.hash&&frames[key]&&document.getElementById('hub-'+key).dataset.ready==='true'){frames[key].contentWindow.location.hash=url.hash;delete pendingHashes[key];}
   });
   doc.addEventListener('keydown',event=>{if(event.key==='Escape')stopAudio()});
   const panel=document.getElementById('hub-'+id);panel.dataset.ready='true';panel.querySelector('.hub-loading').hidden=true;if(pendingHashes[id]){const requestedHash=pendingHashes[id];delete pendingHashes[id];frame.contentWindow.location.hash=requestedHash;}
  }catch{document.getElementById('hub-'+id).querySelector('.hub-loading').hidden=true}
 }
 function ensureFrame(id){
  if(frames[id])return;
  const panel=document.getElementById('hub-'+id),frame=document.createElement('iframe');frame.title=modules[id].label.endsWith('课堂')?modules[id].label:modules[id].label+'课堂';frame.dataset.classroomFrame=id;frame.allow='autoplay';frame.addEventListener('load',()=>adaptFrame(frame,id));
  frame.src=new URL(modules[id].path,location.href).href;frames[id]=frame;panel.append(frame);
 }
 function selectModule(id,updateUrl=false){
  if(!Object.prototype.hasOwnProperty.call(modules,id))id='exams';
  savedScroll[active]=window.scrollY;stopAudio();document.querySelector('.modal-backdrop')?.remove();active=id;
  document.body.dataset.classroomModule=id;
  for(const key of Object.keys(modules))document.getElementById('hub-'+key).hidden=key!==id;
  for(const button of buttons){const selected=button.dataset.classroomTab===id;button.setAttribute('aria-selected',selected?'true':'false');button.tabIndex=selected?0:-1}
  if(id!=='exams')ensureFrame(id);
  document.getElementById('hub-open').href=new URL(modules[id].path,location.href).href;
  if(updateUrl){const url=new URL(location.href);if(id==='exams')url.searchParams.delete('module');else url.searchParams.set('module',id);history.pushState(null,'',url)}
  if(id==='exams'){const requestedPaper=new URL(location.href).searchParams.get('paper');if(requestedPaper&&mById(requestedPaper)&&(screen!=='practice'||state.module!==requestedPaper))openModule(requestedPaper);}
  window.scrollTo(0,id==='exams'?savedScroll.exams||0:0);
 }
 buttons.forEach((button,index)=>{
  button.addEventListener('click',()=>selectModule(button.dataset.classroomTab,true));
  button.addEventListener('keydown',event=>{
   if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();event.stopImmediatePropagation();
   const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[next].focus();selectModule(buttons[next].dataset.classroomTab,true);
  });
 });
 window.addEventListener('popstate',()=>selectModule(moduleFromUrl()));
 document.querySelector('[data-classroom-stop]').addEventListener('click',stopAudio);
 document.addEventListener('keydown',event=>{if(event.key==='Escape')stopAudio()});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio()});
 window.addEventListener('pagehide',stopAudio);
 selectModule(moduleFromUrl());
})();
</script></body></html>
