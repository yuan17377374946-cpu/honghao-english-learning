<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九年级数学期中 · 逐题讲评</title>
<meta name="description" content="九年级数学期中 20 道题，含重绘题图、分步讲解和板书草稿纸。">
<style>
:root{color-scheme:light;--bg:#edf3f5;--paper:#fff;--ink:#18313a;--muted:#516872;--line:#d3e0e4;--accent:#08746a;--deep:#173a46}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,"Microsoft YaHei",sans-serif}
.wrap{width:min(1390px,calc(100% - 32px));margin:auto}
header{background:var(--deep);color:white;padding:24px 0 20px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.65rem,4vw,2.5rem);line-height:1.18}
header p{color:#d3e9eb;margin-top:8px}
nav{display:grid;grid-template-columns:8fr 5fr 5fr;gap:9px;margin:14px 0}
.nav-group{border:1px solid var(--line);border-radius:12px;background:white;padding:8px 10px}
.nav-group h2{font-size:.82rem;color:var(--muted);margin-bottom:5px}
.numbers,.actions{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
button{font:inherit;color:inherit;background:white;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.44;cursor:default}
button:focus-visible,summary:focus-visible{outline:3px solid #ac5a22;outline-offset:3px}
.numbers button{min-width:2.5rem;padding:4px 7px;font-variant-numeric:tabular-nums}
button[aria-current="true"],.primary{background:var(--deep);color:white;border-color:var(--deep);font-weight:700}
.question-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:12px 0}
.question-head h2{font-size:clamp(1.35rem,3.4vw,2rem);line-height:1.3}
.eyebrow{font-size:.82rem;color:var(--accent);font-weight:750;margin-bottom:3px}
.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:start}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:14px 17px;min-width:0}
.panel h3{font-size:1.1rem;margin-bottom:8px}
.prompt{line-height:1.85}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:9px}
summary{cursor:pointer;font-weight:700;color:var(--accent)}
.source-list{display:grid;gap:8px;margin-top:8px}
.source-list svg{width:100%;max-height:420px;border-radius:6px;background:#f4f7f7;display:block}
.board-figure{width:100%;height:auto;max-height:320px;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#f8fcfb}
.board-figure:not(.teaching-svg) text{font-size:14px;fill:var(--ink)}
.steps{padding-left:1.4rem;margin:10px 0}
.steps li{padding:6px 4px}
.steps li.latest{background:#edf7f5;border-radius:6px}
.answer{padding:10px;background:#e7f5f0;border-left:4px solid var(--accent);border-radius:5px;font-weight:700}
.empty{color:var(--muted);font-size:.93rem;margin-top:8px}
.question-note{background:#fff7e6;border-left:4px solid #a3561d;padding:8px 10px;margin-top:9px;border-radius:5px;font-size:.93rem}
footer{color:var(--muted);padding:16px 0 25px;font-size:.85rem}
[hidden]{display:none!important}
@media(max-width:850px){.columns{grid-template-columns:1fr}nav{grid-template-columns:1fr}.wrap{width:calc(100% - 22px)}.panel{padding:12px}.source-list svg{max-height:350px}}
</style>
<style>
body{font-family:"Noto Sans SC",system-ui,"Microsoft YaHei",sans-serif}
button,summary,textarea{outline-offset:3px}
button,summary{min-height:44px}
button{min-width:44px}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #a64324}
::selection{background:#c5e7df;color:#173a46}
.question-head{scroll-margin-top:10px}
.figure-head,.chalk-head,.paper-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.lesson-figure{margin:14px 0 4px}
.figure-head{margin-bottom:4px}
.figure-head h3{margin:0}
.figure-stage{margin:7px 0;color:#23564f;font-weight:750}
.figure-caption{color:var(--muted);font-size:.94rem;margin:6px 0 10px}
.figure-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.figure-actions .board-from-figure{margin-inline-start:auto}
.figure-count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.teaching-svg{max-height:clamp(230px,44vh,390px);background:#f8fcfb}
.teaching-svg text{font-weight:650}
@media (min-width:1050px){.lesson-source{position:sticky;top:12px}}
.lesson-workspace{display:grid;gap:12px;min-width:0}
.lesson-board{min-width:0;scroll-margin-top:12px}
.chalk-head{align-items:center;margin-bottom:9px}
.chalk-head h3{font-size:clamp(1.12rem,2.4vw,1.35rem);margin:0}
.paper-question{display:none}
@media(max-width:850px){
  .paper-question{display:block;background:#edf6f4;border-radius:7px;padding:8px 10px;margin-bottom:9px;font-size:.95rem}
}
.paper-toolbar{justify-content:flex-start;margin-bottom:9px}
.paper-tools{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.paper-tools + .paper-tools{padding-inline-start:8px;border-inline-start:1px solid var(--line)}
.paper-toolbar button{font-size:.94rem;padding:5px 9px}
.paper-toolbar button[aria-pressed="true"]{background:#e0f3ee;border-color:#3d7d73;font-weight:700}
.ink-dot{display:inline-block;width:.72em;height:.72em;border-radius:50%;background:var(--pen);margin-inline-end:5px}
.paper-surface{position:relative;aspect-ratio:16/9;isolation:isolate;background:#fff;border:1px solid #b9ced3;border-radius:8px;overflow:hidden}
.paper-surface[data-paper="grid"]{background-image:linear-gradient(#deeaee 1px,transparent 1px),linear-gradient(90deg,#deeaee 1px,transparent 1px);background-size:24px 24px}
.paper-art{position:absolute;inset:4%;display:grid;place-items:center;pointer-events:none}
.paper-art .board-figure{margin:0;border:0;background:transparent;width:100%;height:100%;max-height:100%;min-height:0;min-width:0}
.paper-surface:not([data-paper="figure"]) .paper-art{visibility:hidden}
.paper-surface canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.paper-surface canvas[data-mode="eraser"]{cursor:cell}
.paper-status{font-size:.85rem;color:var(--muted);margin:5px 0}
.paper-notes{margin-top:4px;padding-top:1px}
.paper-notes textarea{width:100%;min-height:5em;border:1px solid #a7bec5;border-radius:7px;padding:8px 10px;font:inherit;resize:vertical;color:inherit;background:white}
@media(max-width:600px){
  .figure-actions .board-from-figure{margin-inline-start:0}
  .paper-tools + .paper-tools{border:0;padding-inline-start:0}
  .teaching-svg{max-height:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.method-picker{margin:0 0 12px;padding:11px 16px;background:#f8fcfb;border:1px solid var(--line);border-radius:12px}
.method-picker h3{margin-bottom:7px;font-size:1rem}
.method-options{display:flex;flex-wrap:wrap;gap:7px}
.method-options button{font-size:.96rem}
.method-options button[aria-pressed="true"]{background:#deefe9;border-color:#418379;color:#14564e;font-weight:700}
.method-svg{max-height:none}
@media(min-width:1050px) and (max-height:850px){.method-svg{max-height:37vh}}
.figure-select{display:flex;align-items:center;gap:8px;margin:7px 0 9px;color:var(--muted);font-size:.94rem}
.figure-select select{min-height:44px;min-width:0;max-width:100%;flex:1;font:inherit;color:var(--ink);background:#fff;border:1px solid #9fb6bc;border-radius:8px;padding:5px 8px}
.figure-select select:focus-visible{outline:3px solid #a64324;outline-offset:3px}
@media(min-width:851px){.method-svg{max-height:clamp(250px,39vh,375px)}}

.bisector-proof{margin:10px 0 2px;padding:6px 11px 10px;border:1px solid #b6d8d0;border-radius:8px;background:#f8fcfb}
.bisector-proof summary{min-height:44px;line-height:1.45;padding:10px 0}
.bisector-proof p + p,.bisector-proof-figures + p{margin-top:8px}
.bisector-proof-figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,205px),1fr));gap:8px;margin-top:10px}
.bisector-proof-figures figure{margin:0;min-width:0}
.bisector-proof-figures figcaption{font-weight:700;color:#23564f}
.bisector-proof-figures .method-svg{max-height:none;margin:4px 0}
</style>
</head>
<body>
<header><div class="wrap"><h1>九年级数学期中 · 逐题讲评</h1><p>2026–2027 学年第一学期 · 学生练习与讲评</p></div></header>
<main class="wrap">
  <nav id="number-nav" aria-label="题号"></nav>
  <section id="question-board" aria-labelledby="question-title">
    <div class="question-head"></div>
    <section class="method-picker" aria-labelledby="method-heading" hidden></section>
    <div class="columns">
      <section class="panel lesson-source"></section>
      <div class="lesson-workspace">
        <section id="chalkboard" class="panel lesson-board" aria-labelledby="chalkboard-title" hidden>
          <div class="chalk-shell">
            <div class="chalk-head">
              <h3 id="chalkboard-title" tabindex="-1">板书草稿纸</h3>
              <button type="button" data-paper-action="close">收起板书</button>
            </div>
            <p class="paper-question"></p>
            <div class="paper-toolbar" aria-label="板书工具">
              <div class="paper-tools" role="group" aria-label="纸张">
                <button type="button" data-paper="grid" aria-pressed="true">方格纸</button>
                <button type="button" data-paper="blank" aria-pressed="false">白纸</button>
                <button type="button" data-paper="figure" aria-pressed="false">题图底纸</button>
              </div>
              <div class="paper-tools" role="group" aria-label="笔迹">
                <button type="button" data-paper-mode="pen" aria-pressed="true">画笔</button>
                <button type="button" data-paper-mode="eraser" aria-pressed="false">橡皮擦</button>
                <button type="button" data-ink="blue" aria-pressed="true"><span class="ink-dot" style="--pen:#224f87"></span>蓝笔</button>
                <button type="button" data-ink="red" aria-pressed="false"><span class="ink-dot" style="--pen:#ac3629"></span>红笔</button>
                <button type="button" data-ink="black" aria-pressed="false"><span class="ink-dot" style="--pen:#263e48"></span>黑笔</button>
              </div>
              <div class="paper-tools">
                <button type="button" data-paper-action="undo">撤销</button>
                <button type="button" data-paper-action="clear">清空笔迹</button>
              </div>
            </div>
            <div class="paper-surface" data-paper="grid">
              <div class="paper-art" aria-hidden="true"></div>
              <canvas aria-label="手写板书区域"></canvas>
            </div>
            <p class="paper-status" role="status"></p>
            <details class="paper-notes"><summary>展开键盘板书</summary><textarea aria-label="键盘板书" placeholder="输入公式、证明步骤或课堂笔记…"></textarea></details>
          </div>
        </section>
        <section class="panel lesson-steps"></section>
      </div>
    </div>
  </section>
  <footer>键盘 ←、→ 可切换题目。</footer>
</main>
<script>
const lessonVisuals = (() => {
  const ink = '#263e48';
  const faint = '#9aadb4';
  const teal = '#08746a';
  const blue = '#285aa3';
  const red = '#a64324';
  const gold = '#a56614';
  const wash = '#dff2ec';
  const sky = '#e2ecf9';

  const path = (points, color = ink, fill = 'none', closed = false, dash = false) =>
    '<polyline points="' + (closed ? [...points,points[0]] : points).map(([x,y])=>x+','+y).join(' ') +
    '" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="'+fill+'"'+
    (dash?' stroke-dasharray="6 5"':'')+'/>';
  const line = (a,b,color,dash=false) => path([a,b],color,'none',false,dash);
  const label = (x,y,value,color=ink,size=17) =>
    '<text x="'+x+'" y="'+y+'" fill="'+color+'" font-size="'+size+'">'+value+'</text>';
  const dot = (p,color=ink) => '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="'+color+'"/>';
  const circle = ([x,y],r,color=ink) => '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
  function diagram(height,title,content) {
    return '<svg class="board-figure teaching-svg" viewBox="0 0 480 '+height+'" role="img" aria-label="'+title+'">'+content+'</svg>';
  }
  function shape(p,keys,color,fill) {
    return path([...keys].map(key=>p[key]),color,fill,true);
  }
  function edge(p,a,b,color,dash) {
    return line(p[a],p[b],color,dash);
  }
  function labels(p,offsets) {
    return Object.entries(offsets).map(([k,[dx,dy]])=>dot(p[k])+label(p[k][0]+dx,p[k][1]+dy,k)).join('');
  }
  function right(p,a,b,color=ink) {
    const unit=q=>{const x=q[0]-p[0], y=q[1]-p[1], d=Math.hypot(x,y); return [9*x/d,9*y/d];};
    const [ux,uy]=unit(a), [vx,vy]=unit(b);
    return path([[p[0]+ux,p[1]+uy],[p[0]+ux+vx,p[1]+uy+vy],[p[0]+vx,p[1]+vy]],color);
  }

  function solid(stage) {
    const cylinder=path([[82,53],[164,53],[164,113],[82,113]],ink,stage===1?wash:'none',true);
    const cone=path([[82,113],[123,172],[164,113]],ink,stage===2?sky:'none',true);
    return diagram(207,'圆柱和圆锥的正投影对照',
      path([[82,55],[82,112],[123,171],[164,112],[164,55]],ink)+
      '<ellipse cx="123" cy="55" rx="41" ry="12" fill="#f8fcfb" stroke="#263e48" stroke-width="2.5"/>'+
      '<ellipse cx="123" cy="112" rx="41" ry="11" fill="none" stroke="#9aadb4" stroke-width="2"/>'+
      line([197,110],[261,110],blue)+path([[252,104],[262,110],[252,116]],blue)+label(195,92,'水平看',blue)+
      '<g transform="translate(223 0)">'+cylinder+cone+'</g>'+
      label(102,194,'立体')+label(313,194,'左视图'));
  }

  function parallels(stage) {
    const p={A:[125,49],B:[146,103],C:[174,175],D:[331,49],E:[289,103],F:[233,175]};
    return diagram(223,'三条平行线截取的对应线段',
      [49,103,175].map((y,i)=>line([53,y],[390,y],faint)+label(402,y+6,['l₁','l₂','l₃'][i])).join('')+
      edge(p,'A','C')+edge(p,'D','F')+
      (stage>=1?edge(p,'A','B',teal)+edge(p,'D','E',teal)+edge(p,'B','C',blue)+edge(p,'E','F',blue):'')+
      labels(p,{A:[-21,-7],B:[-23,-6],C:[-20,20],D:[8,-6],E:[8,-6],F:[10,20]})+
      label(105,83,'3',teal)+label(129,144,'4',blue)+label(272,145,'8',blue)+
      label(310,83,stage===2?'6':'？',teal));
  }

  function similar(stage) {
    const p={A:[235,35],B:[64,185],C:[413,185],D:[159,102],E:[342,125]};
    return diagram(218,'三角形 ABC 与三角形 AED 的对应边',
      shape(p,'ABC',ink,'#edf5f7')+shape(p,'ADE',teal,wash)+
      (stage?edge(p,'A','B',blue)+edge(p,'A','E',blue)+edge(p,'A','C',gold)+edge(p,'A','D',gold):'')+
      labels(p,{A:[-5,-10],B:[-17,17],C:[7,17],D:[-21,-5],E:[8,-4]})+
      (stage?label(205,121,'公共角',teal)+label(173,210,'AB ↔ AE　 AC ↔ AD',blue,15):''));
  }

  function overlap(stage) {
    const r=Math.sqrt(3), w=4+2*r;
    const p=Object.fromEntries(Object.entries({A:[0,0],B:[0,2],C:[w,2],D:[w,0],E:[w-1,2+r],
      F:[1,-r],G:[2*r,2],H:[4,0]}).map(([k,[x,y]])=>[k,[62+44*x,112+44*y]]));
    return diagram(315,'重叠矩形的公共部分与两侧直角三角形',
      shape(p,'ABCD',ink)+shape(p,'AECF',ink)+shape(p,'AGCH',teal,wash)+
      (stage===2?shape(p,'ABG',blue,sky)+right(p.B,p.A,p.G,blue)+label(162,194,'30°',blue):'')+
      (stage>=3?shape(p,'GEC',red,'#f9e9e2')+right(p.E,p.G,p.C,red)+label(231,216,'30°',red):'')+
      (stage===4?edge(p,'A','G',teal)+edge(p,'G','C',teal)+label(93,162,'AG = 4',teal)+label(264,189,'GC = 4',teal):'')+
      labels(p,{A:[-20,-6],B:[-19,17],C:[10,7],D:[8,-7],E:[4,20],F:[8,-5],G:[-5,23],H:[4,-8]})+
      label(22,161,'2',blue));
  }

  function park(stage) {
    const box=(x,y,w,h,fill)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+ink+'" stroke-width="1.5"/>';
    return diagram(238,'三条等宽绿化带与剩余面积',
      box(68,33,126,168,wash)+box(68,70,126,16,stage===1?'#e3b991':'#bccbd1')+
      box(68,139,126,16,stage===1?'#e3b991':'#bccbd1')+box(119,33,16,168,stage===2?'#e3b991':'#bccbd1')+
      label(100,225,'30 米')+label(12,125,'40 米')+
      (stage>=3?label(222,123,'挪拢 →',teal)+box(304,65,100,115,wash)+label(298,204,'30 − x',teal)+label(300,48,'40 − 2x',teal):''));
  }

  function golden(stage) {
    const p={A:[52,91],C:[194,91],B:[424,91]};
    return diagram(174,'黄金分割短段、长段与全长',
      edge(p,'A','C',gold)+edge(p,'C','B',teal)+labels(p,{A:[-5,27],C:[-5,27],B:[-5,27]})+
      label(102,66,stage?'2 − x':'短段 AC',gold)+label(268,66,stage?'x':'长段 BC',teal)+
      line([52,141],[424,141],faint)+label(182,165,'全长 2 cm',ink));
  }

  function squares(stage) {
    const p={A:[95,31],B:[95,207],C:[271,207],D:[271,31],O:[183,119],
      U:[95,119],V:[183,207],M:[95,141],N:[205,207],E:[65,148],F:[213,237],G:[95,266]};
    return diagram(282,'正方形中心到两边的距离与九十度旋转',
      shape(p,'ABCD',ink)+shape(p,'OEGF',faint)+shape(p,'AOM',teal,wash)+
      (stage>=3?shape(p,'CON',blue,sky):'')+
      edge(p,'A','C',faint)+edge(p,'B','D',faint)+edge(p,'O','M',teal)+edge(p,'O','N',blue)+
      (stage>=1?edge(p,'O','U',teal,true)+edge(p,'O','V',blue,true)+
        label(124,111,'4',teal)+label(164,169,'4',blue):'')+
      (stage>=2?label(46,95,'AM = 5',teal,15):'')+
      (stage>=3?label(308,113,'OM 转 90°',teal)+label(308,139,'落到 ON',blue):'')+
      (stage>=4?label(215,198,'CN = 3',blue,14):'')+
      labels(p,{A:[-20,-4],B:[-18,18],C:[7,18],D:[7,-3],O:[6,-9],M:[-22,4],N:[7,19],
        ...(stage>=1?{U:[-19,-5],V:[-12,21]}:{})}));
  }

  function angleStart() {
    const t=2-Math.sqrt(3), c=Math.cos(Math.PI/12), s=Math.sin(Math.PI/12);
    const p=Object.fromEntries(Object.entries({A:[0,0],B:[1,0],C:[.75,Math.sqrt(3)/4],
      D:[Math.sqrt(3)/2,Math.sqrt(3)*t/2],E:[c*c,c*s]}).map(([k,[x,y]])=>[k,[39+390*x,204-390*y]]));
    return diagram(231,'原图中的两个十五度角和垂足 E',
      shape(p,'ACD',teal,wash)+shape(p,'AEB',blue,sky)+edge(p,'C','B')+
      right(p.C,p.A,p.B)+right(p.E,p.A,p.B)+label(146,170,'15°',teal)+label(152,198,'15°',blue)+
      labels(p,{A:[-17,17],B:[8,16],C:[-3,-10],D:[-20,-9],E:[8,-6]}));
  }

  function angleCompare() {
    const triangle=(x,width,labels_)=>{
      const p={A:[x,141],[labels_[0]]:[x+width,141],[labels_[1]]:[x+width,141-width*(2-Math.sqrt(3))]};
      const [b,c]=labels_;
      return shape(p,'A'+b+c,teal,wash)+edge(p,'A',c,red)+edge(p,b,c,blue)+right(p[b],p.A,p[c])+
        labels(p,{A:[-14,18],[b]:[5,20],[c]:[5,-8]})+label(x+70,113,'A'+c,red)+label(x+width+9,119,b==='E'?'BE':'CD',blue);
    };
    return diagram(193,'三角形 ACD 和 AEB，斜边 AD 对 AB，短边 CD 对 BE',
      triangle(28,157,'CD')+triangle(253,174,'EB')+label(112,180,'△ACD ∽ △AEB',teal));
  }

  function dilation(stage) {
    const X=x=>248+28*x, Y=y=>173-24*y;
    const grid=Array.from({length:15},(_,i)=>line([X(i-7),Y(-3)],[X(i-7),Y(5)],i===7?ink:'#dfe9ec')).join('')+
      Array.from({length:9},(_,i)=>line([X(-7),Y(i-3)],[X(7),Y(i-3)],i===3?ink:'#dfe9ec')).join('');
    const old=[[-4,4],[-6,-2],[-4,0]], rightSide=[[2,1],[3,4],[2,3]];

<script>
const advancedMethods = (() => {
  const s3 = Math.sqrt(3);
  const ink = '#263e48', muted = '#647f89', teal = '#08746a', blue = '#285aa3', red = '#a64324', gold = '#956015';
  const path = (p, color = ink, fill = 'none', dash = false) =>
    '<polyline points="' + p.map(([x,y])=>x.toFixed(2)+','+y.toFixed(2)).join(' ') + '" fill="'+fill+'" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"'+(dash?' stroke-dasharray="6 5"':'')+'/>';

  const txt = (x,y,text,color=ink,size=15,anchor='start')=>'<text x="'+x+'" y="'+y+'" fill="'+color+'" font-size="'+size+'" text-anchor="'+anchor+'">'+text+'</text>';
  const svg = (h,title,content)=>'<svg class="board-figure teaching-svg method-svg" viewBox="0 0 480 '+h+'" role="img" aria-label="'+title+'">'+content+'</svg>';
  const stage = (step,title,draw,caption)=>({step,title,draw,caption});
  const labels = (p,offsets)=>Object.entries(offsets).map(([key,[dx,dy]])=>dot(p[key])+txt(p[key][0]+dx,p[key][1]+dy,key)).join('');
  const shape = (p,keys,color,fill)=>path([...keys,keys[0]].map(k=>p[k]),color,fill);
  const edges = (p,pairs)=>pairs.map(([a,b,color,dash])=>line(p[a],p[b],color,dash)).join('');
  const unit = ([x,y],[u,v])=>{const d=Math.hypot(u-x,v-y);return [(u-x)/d,(v-y)/d];};
  function right(p,a,b,color=ink) {
    const [x,y]=p,[u,v]=unit(p,a),[w,z]=unit(p,b);
    return path([[x+8*u,y+8*v],[x+8*(u+w),y+8*(v+z)],[x+8*w,y+8*z]],color);
  }
  function arc(p,a,b,r,color) {
    const [u,v]=unit(p,a),[w,z]=unit(p,b);
    return '<path d="M'+(p[0]+r*u)+' '+(p[1]+r*v)+' A'+r+' '+r+' 0 0 '+Number(u*z-v*w>0)+' '+(p[0]+r*w)+' '+(p[1]+r*z)+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
  }
  function angleFigure(kind) {
    const t=2-s3, p0={A:[0,0],B:[2,0],C:[1.5,s3/2],D:[s3,s3*t],E:[1+s3/2,.5]};
    p0.P=[s3,1]; p0.H=[s3,0];

    const marks={A:[-18,15],B:[9,18],C:[-14,-9],D:[-21,-8],E:[9,4]};
    let extra='', emphasis='';
    if(kind==='mirrorB'){
      Object.assign(marks,{P:[7,-6],H:[-11,19]});
      emphasis=shape(p,'ACD',teal,'#e3f3ed')+shape(p,'PHB',blue,'#e4eefb');
      extra=edges(p,[['C','P',teal,true],['P','B',blue],['P','H',red,true]])+right(p.H,p.A,p.P)+arc(p.P,p.H,p.B,28,blue)+txt(p.P[0]+11,p.P[1]+40,'15°',blue)+txt(p.H[0]-39,159,'PH = 1',red);
    } else if(kind==='mirrorD'){
      Object.assign(marks,{'D′':[9,-8],K:[-6,-12]});
      extra=edges(p,[['E','D′',teal,true],['B','D′',blue,true],['B','K',red,true]])+right(p.B,p.A,p['D′'])+arc(p.B,p.A,p.K,39,red)+txt(328,216,'15°',red);
    } else {
      emphasis=shape(p,'ACD',teal,'#e3f3ed')+shape(p,'AEB',blue,'#e4eefb');
    }
    return svg(255,'第13题。'+({mirrorB:'沿 AD 翻折 B 到 P，过 P 向 AB 作垂线。',mirrorD:'把 D 关于 E 中心对称到 D′，标出 AD′ 的中点 K。',base:'标出两个十五度角、直角 C 与垂足 E。'}[kind]),
      emphasis+edges(p,[['A','B'],['A','C',teal],['C','B'],['A','E',teal],['B','E',blue]])+extra+
      right(p.C,p.A,p.D)+right(p.E,p.A,p.B)+arc(p.A,p.E,p.C,85,teal)+arc(p.A,p.B,p.E,120,blue)+
      txt(128,183,'15°',teal)+txt(170,217,'15°',blue)+labels(p,marks));
  }
  function compare13(reflect) {
    function triangle(x,y,w,keys) {
      const [a,b,c]=keys;

      return shape(p,keys,ink,'#edf7f5')+edgeByKey(p,a,b,teal)+edgeByKey(p,a,c,red)+edgeByKey(p,b,c,blue)+
        right(p[b],p[a],p[c])+arc(p[a],p[b],p[c],45,teal)+txt(x+53,y-4,'15°',teal)+
        labels(p,{[a]:[-13,18],[b]:[7,18],[c]:[7,-5]})+
        txt(x+w*.57,y+28,a+b,teal,16,'middle')+txt(x+w*.57,y-w*.15-10,a+c,red,16,'middle');
    }
    return svg(174,reflect?'相似三角形 ACD 和 PHB。AC 对 PH，AD 对 PB。':'相似三角形 ACD 和 AEB。AD 对 AB，CD 对 EB。',
      triangle(26,114,159,'ACD')+triangle(258,114,159,reflect?'PHB':'AEB')+
      txt(240,28,reflect?'AC ↔ PH，AD ↔ PB':'AD ↔ AB，CD ↔ EB',ink,16,'middle'));
  }
  function edgeByKey(p,a,b,color){return line(p[a],p[b],color);}
  function midpoint13() {
    const t=2-s3, length=s3*Math.hypot(1,t), de=2*Math.cos(Math.PI/12)-length;
    const p={A:[35,90],K:[35+171*(length/2+de),90],D:[35+171*length,90],E:[35+171*(length+de),90],'D′':[35+171*(length+2*de),90]};
    return svg(174,'在 AD′ 上看中点 K 和线段 KE。KE 是 AD 的一半。',
      line(p.A,p['D′'],muted)+line(p.K,p.E,red)+

      line([p.A[0],57],[p.D[0],57],teal)+txt((p.A[0]+p.D[0])/2,45,'AD',teal,16,'middle')+
      txt((p.K[0]+p.E[0])/2,76,'KE',red,16,'middle')+txt(240,152,'KE = AE − AK = AD/2',ink,17,'middle'));
  }
  function bisectorAreaFigure(sharedHeight) {
    const A=[137,226-Math.sqrt(216**2-99**2)], C=[38,226], D=[182,226], B=[398,226];
    const foot=(point,start,end)=>{
      const [u,v]=unit(start,end);
      const t=(point[0]-start[0])*u+(point[1]-start[1])*v;
      return [start[0]+t*u,start[1]+t*v];
    };
    const p={A,B,C,D,T:[A[0],C[1]],K:foot(D,A,C),H:foot(D,A,B)};
    const main=shape(p,'ACD',teal,'#e3f3ed')+shape(p,'ADB',blue,'#e4eefb')+line(A,D,ink);
    const heights=sharedHeight
      ? line(A,p.T,gold,true)+right(p.T,A,C,gold)+txt(p.T[0]-12,144,'AT',gold,17,'end')+labels(p,{T:[-5,21]})
      : ['K','H'].map((key,i)=>{
          const q=p[key], [u,v]=unit(D,q);
          const [x,y]=[(D[0]+q[0])/2,(D[1]+q[1])/2];
          return line(D,q,gold,true)+right(q,i===0?A:B,D,gold)+line([x-v*5,y+u*5],[x+v*5,y-u*5],gold);
        }).join('')+arc(A,C,D,46,teal)+arc(A,D,B,46,blue)+labels(p,{K:[-20,0],H:[8,-7]});
    return svg(260,sharedHeight?'以 CD、DB 为底，共用高 AT':'以 AC、AB 为底，D 到两边的高 DK、DH 相等',
      main+heights+labels(p,{A:[-6,-10],C:[-13,20],D:[0,21],B:[7,19]}));
  }
  function bisectorProof() {
    return '<details class="bisector-proof"><summary>补习｜角平分线定理怎么来的？</summary>'+
      '<p><strong>结论。</strong>在 △ACB 中，若 AD 平分 ∠CAB，且 D 在 CB 上，则 <strong>CD / DB = AC / AB</strong>。靠 C 的两段放在一起，靠 B 的两段放在一起。</p>'+
      '<div class="bisector-proof-figures">'+
      '<figure><figcaption>① 以 CD、DB 为底</figcaption>'+bisectorAreaFigure(true)+'</figure>'+
      '<figure><figcaption>② 以 AC、AB 为底</figcaption>'+bisectorAreaFigure(false)+'</figure></div>'+
      '<p><strong>看左图。</strong>过 A 作 AT ⟂ CB。绿色 △ACD 和蓝色 △ADB 共用高 AT，所以 S△ACD / S△ADB = CD / DB。</p>'+
      '<p><strong>看右图。</strong>过 D 分别作 DK ⟂ AC、DH ⟂ AB。两个直角三角形 AKD、AHD 共用斜边 AD，又有 ∠KAD = ∠DAH，所以它们全等，得到 DK = DH。绿色和蓝色三角形换用 AC、AB 作底，高相等，所以 S△ACD / S△ADB = AC / AB。</p>'+
      '<p><strong>把同一个面积比连起来。</strong>CD / DB = AC / AB。</p>'+
      '<p><strong>练一遍。</strong>若 AC = 6、AB = 9、CB = 10，则 CD : DB = 2 : 3。全长 10 分成 5 份，每份长 2，所以 CD = 4、DB = 6。</p>'+
      '<p><strong>回到本题。</strong>把 AC = √3、AB = 2 代入，得到 CD : DB = √3 : 2。因为 CB = 1，CD 占全长的 √3/(√3 + 2)，所以 x = √3/(√3 + 2) = 2√3 − 3。</p></details>';
  }
  const angleBase=stage(0,'原图与两个 15°',()=>angleFigure('base'),'AD 平分 30°，所以两边各 15°。E 在 AD 的延长线上。');
  const ratio = 'AD / BE = 2√3';
  const methods13 = [
    {title:'翻折 B · 相似', answer:ratio, steps:[
      '<strong>沿角平分线翻折。</strong>把 B 沿 AD 翻到 P。因为 AD 平分 ∠CAB，所以 P 在射线 AC 上，AP = AB。BE ⟂ AD，所以 E 也是 BP 的中点，BP = 2BE。',
      '<strong>把 30° 用起来。</strong>过 P 作 PH ⟂ AB，垂足为 H。∠PAH = 30°，所以 PH = AP/2 = AB/2。原图中 ∠ABC = 60°，也有 AC = √3·AB/2。',

    {t:44/13,u:12,v:66/13,df:'38/13',projection:'BE = 44/13，CF = 66/13',extra:'EC = 112/13，CF = 66/13'}
  ];
  function rectangle20(item,mode='plain') {
    const X=x=>57+28*x, Y=y=>269-28*y;
    const {t,u,v}=item, top=v===8, m=t/8;
    const ix=8/(8/t+m);
    const p0={A:[0,8],B:[0,0],C:[12,0],D:[12,8],E:[t,0],F:[u,v],O:[ix,m*ix],H:[u,0]};
    const p=Object.fromEntries(Object.entries(p0).map(([k,[x,y]])=>[k,[X(x),Y(y)]]));
    const marks={A:[-19,-6],B:[-19,17],C:[8,17],D:[9,-6],E:[-5,20],F:top?[-5,-9]:[9,4],O:[-18,0]};
    let fills='', helper='';
    if(mode==='similar'){
      fills=shape(p,'ABE',blue,'#e4eefb')+shape(p,top?'BAF':'BCF',teal,'#e3f3ed');
      if(top) {
        helper=edgeByKey(p,'F','H',red)+right(p.H,p.E,p.F,red);
        if(u<t) delete marks.O;
        marks.H=[-6,20];
      } else helper=right(p.C,p.E,p.F,red);
    }
    if(mode==='coord'){
      const xEnd=[416,Y(0)], yEnd=[X(0),23];
      helper=line(p.B,xEnd,muted)+line(p.B,yEnd,muted)+txt(420,Y(0)+6,'x')+txt(X(0)-3,17,'y')+
        txt(206,313,top?'E(t, 0)，F(u, 8)':'E(t, 0)，F(12, v)',blue,16,'middle');
    }
    if(mode==='sum'){
      fills=shape(p,'ABO',blue,'#e4eefb')+shape(p,'EFO',blue,'#e4eefb');
      helper=edges(p,[['B','E',teal],['A','F',teal]])+txt(240,313,'AB² + EF² = BE² + AF²',blue,16,'middle');
    }
    return svg(325,'矩形 ABCD。'+item.projection+'，AE 垂直 BF，EF 等于 10，DF 等于 '+item.df,
      fills+shape(p,'ABCD',muted,'none')+helper+
      edges(p,[['A','E',blue],['B','F',teal],['E','F',red,true],['D','F',gold]])+
      right(p.O,p.A,p.F)+right(p.B,p.A,p.C)+labels(p,marks)+
      txt(22,161,'8')+txt(227,295,'BC = 12',ink,14,'middle')+txt(406,228,'EF = 10',red,13)+
      txt(195,24,'DF = '+item.df,gold,16,'middle'));
  }
  function locus20() {
    const X=x=>59+27*x,Y=y=>259-27*y;
    const B=[X(0),Y(0)],D=[X(12),Y(8)],A=[X(0),Y(8)],C=[X(12),Y(0)],T=[X(16/3),Y(0)];
    return svg(310,'从 B 出发的垂线只能在上边或右边离开矩形，过 D 时 BE 等于 16/3。',
      path([A,B,C,D,A],ink)+line(A,D,teal)+line(D,C,blue)+line(B,D,muted,true)+line(A,T,gold,true)+
      line(B,[X(7),Y(8)],teal)+line(B,[X(12),Y(5)],blue)+dot(T,gold)+
      labels({A,B,C,D},{A:[-16,-5],B:[-16,19],C:[7,18],D:[7,-6]})+
      txt(220,27,'AD 上的 F',teal,15,'middle')+txt(391,160,'CD 上的 F',blue,13)+
      txt(T[0],286,'BE = 16/3 时，BF 过 D',gold,15,'middle'));
  }
  function equal20(top) {
    const low=top?16/3:2.6,high=top?12:16/3;
    const bottom=top?62:98, upper=top?112:111;
    const X=t=>57+370*(t-low)/(high-low), Y=y=>242-182*(y-bottom)/(upper-bottom);
    const fn=top?t=>64+(64/t-t)**2:t=>(12-t)**2+(1.5*t)**2;
    const roots=top?q20Cases.slice(0,2).map(c=>c.t):q20Cases.slice(2).map(c=>c.t).reverse();
    const curve=Array.from({length:141},(_,i)=>{const t=low+(high-low)*i/140;return [X(t),Y(fn(t))];});
    const rootText=top?['√73 − 3','√73 + 3']:['44/13','4'];
    const turning=top?8:48/13;
    return svg(296,'EF 的平方随 BE 的变化图。水平线等于 100，与曲线有两个交点。',
      line([57,245],[449,245],muted)+line([57,251],[57,47],muted)+txt(66,41,'EF²')+txt(432,264,'BE')+
      line([57,Y(100)],[427,Y(100)],red,true)+txt(46,Y(100)+5,'100',red,14,'end')+
      path(curve,teal)+dot([X(turning),Y(fn(turning))],teal)+
      roots.map((t,i)=>dot([X(t),Y(100)],red)+line([X(t),Y(100)],[X(t),244],muted,true)+txt(X(t),264,rootText[i],red,15,'middle')).join('')+
      txt(240,286,top?'F 在 AD 上：t ≥ 16/3':'F 在 CD 上：t ≤ 16/3（放大交点附近）',ink,15,'middle'));
  }

  const answer20='DF = 2、38/13、9 − √73 或 15 − √73';
  const first20=stage(0,'先确定 F 可能落在哪条边',locus20,'∠ABE = 90° 已满足。蓝线、绿线分别示意 BF 先碰到 CD、AD 的情形，过 D 是分界。');
  const setup20='<strong>先定范围。</strong>E 在 BC 上，且四边形不退化，BE &gt; 0。∠ABE = 90°，两条对角线是 AE、BF，所以 AE ⟂ BF。BF 从 B 往右上方走，F 只能在 AD 或 CD。';
  const frames20=(stepTop,stepRight,mode)=>q20Cases.map((c,i)=>stage(i<2?stepTop:stepRight,
    (i<2?'F 在 AD':'F 在 CD')+' · '+c.projection,()=>rectangle20(c,mode),c.extra+'，所以 DF = '+c.df+'。'));
  const methods20=[
    {title:'相似三角形 · 勾股',answer:answer20,steps:[
      setup20,
      '<strong>F 在 AD 上，先找积。</strong>设 BE = t，AF = u。△ABE 与 △BAF 的 B、A 分别是直角，AB ⟂ AD，AE ⟂ BF，因此 ∠BAE = ∠AFB。故 △ABE ∽ △FAB，AB/AF = BE/AB，即 ut = 64。',
      '<strong>再找两段的差。</strong>从 F 向 BC 作垂线 FH，FH = 8，EF = 10。勾股得 EH = 6，因此 |u − t| = 6。图要画两张，F 可能在 E 的左上或右上。',
      '<strong>同时使用积和差。</strong>(u + t)² = (u − t)² + 4ut = 36 + 256 = 292。两段都为正，所以 u + t = 2√73。于是 u = √73 ± 3，两组 t、u 都在 (0, 12) 内。DF = 12 − u，得 9 − √73 或 15 − √73。',
      '<strong>F 在 CD 上，还是找相似。</strong>设 CF = v。∠ABE = ∠BCF = 90°，∠BAE = ∠CBF，因为 BA ⟂ BC、AE ⟂ BF。故 △ABE ∽ △BCF，v/12 = t/8，即 v = 3t/2。',
      '<strong>在 △ECF 里列勾股。</strong>(12 − t)² + (3t/2)² = 100。整理为 13t² − 96t + 176 = 0，即 (t − 4)(13t − 44) = 0。t = 4 或 44/13，得 v = 6 或 66/13。',
      '<strong>最后逐个验边。</strong>两组 t 都在 (0, 12)，两组 v 都在 (0, 8)。所以 DF = 8 − v，即 2 或 38/13。两条边合计四解。'
    ],visuals:[first20,...frames20(3,5,'similar')]},
    {title:'坐标斜率 · 一元二次方程',answer:answer20,steps:[
      setup20,
      '<strong>以 B 为原点。</strong>A(0, 8)，C(12, 0)，D(12, 8)，E(t, 0)。AE 的斜率是 −8/t，所以垂线 BF 的斜率是 t/8，方程是 y = tx/8。',
      '<strong>F 在上边时令 y = 8。</strong>设 F(u, 8)，有 u = 64/t。由距离公式 (u − t)² + 8² = 100，得 u − t = 6 或 −6。代入 u = 64/t，分别得 t² + 6t − 64 = 0 和 t² − 6t − 64 = 0。',
      '<strong>只取符合边长的根。</strong>两式的正根是 √73 − 3 和 √73 + 3（另外两个根为负）。对应 u = √73 + 3 或 √73 − 3，均小于 12。因此 DF = 12 − u = 9 − √73 或 15 − √73。',
      '<strong>F 在右边时令 x = 12。</strong>F(12, 3t/2)。代进 EF² = 100，得到 13t² − 96t + 176 = 0。Δ = 96² − 4·13·176 = 64，所以 t = (96 ± 8)/26，即 4 或 44/13。',
      '<strong>检查坐标并转成 DF。</strong>两组 F 的纵坐标分别为 6、66/13，都在 (0, 8)。于是 DF = 8 − y_F = 2 或 38/13。若 F = D，则 t = 16/3，但 EF² = 976/9 ≠ 100。'
    ],visuals:[first20,...frames20(3,5,'coord')]},
    {title:'对角线垂直 · 边长平方和',answer:answer20,steps:[
      setup20,
      '<strong>用四次勾股推出平方和。</strong>设 O = AE ∩ BF，四块直角三角形给出 AB² = AO² + BO²，EF² = EO² + FO²，BE² = BO² + EO²，AF² = AO² + FO²。所以 AB² + EF² = BE² + AF²，即 BE² + AF² = 164。',
      '<strong>F 在 AD，设 BE = t、AF = u。</strong>于是 t² + u² = 164。E、F 的竖直距离为 8，所以 (u − t)² = 36。两式相减得 2ut = 128，进而 (u + t)² = 164 + 128 = 292。',
      '<strong>求上边两解。</strong>u + t = 2√73，u − t = ±6，所以 u = √73 ± 3，均在 (0, 12) 内，对应的 t 也在 (0, 12) 内。DF = 12 − u，得 9 − √73 或 15 − √73。',
      '<strong>F 在 CD，设 CF = v。</strong>AF² = 12² + (8 − v)²。用平方和得 t² + v² − 16v = −44。再用 (12 − t)² + v² = 100，展开得 t² + v² − 24t = −44。两式相减得 16v = 24t。',
      '<strong>代回并检验。</strong>v = 3t/2，代回得 (t − 4)(13t − 44) = 0。t = 4 或 44/13，对应 v = 6 或 66/13，均在右边范围内。DF = 8 − v，得 2 或 38/13。'
    ],visuals:[first20,...frames20(3,5,'sum')]},
    {title:'函数图像 · 数清四种位置',answer:answer20,steps:[
      setup20,
      '<strong>用 BE = t 描述 F 移动。</strong>取 B 为原点，BF 的斜率为 t/8。它在 x = 12 处的高度是 3t/2，与矩形的高度 8 比较可知：0 &lt; t ≤ 16/3 时先碰到 CD；16/3 ≤ t ≤ 12 时先碰到 AD。',
      '<strong>右边这段画成抛物线。</strong>EF² = (12 − t)² + (3t/2)² = 13(t − 48/13)²/4 + 1296/13。让 EF² = 100，得到 (t − 48/13)² = (4/13)²，两个 t 为 44/13 和 4，均在右边对应范围。',
      '<strong>把右边两解画回矩形。</strong>CF = 3t/2，分别得 CF = 66/13、6，所以 DF = 38/13、2。图中 y = 100 的两个交点分别对应一个 F。',
      '<strong>上边这段也看水平线。</strong>AF = 64/t，所以 EF² = 64 + (64/t − t)²。64/t − t 在 [16/3, 12] 上严格下降，从 20/3 到 −20/3，因此它等于 6 和 −6 各一次。分别解得 t = √73 − 3、√73 + 3。',
      '<strong>把上边两解画回矩形。</strong>对应 AF = √73 + 3、√73 − 3，DF = 12 − AF，得 9 − √73、15 − √73。分界 t = 16/3 的 EF² = 976/9，大于 100，F = D 没有重复算入。'
    ],visuals:[first20,stage(3,'右边：水平线 EF² = 100 交两次',()=>equal20(false),'顶点横坐标是 48/13。只画交点附近，曲线由配方法精确确定。'),
      ...frames20(6,4,'coord').slice(2),
      stage(5,'上边：先降后升，水平线仍交两次',()=>equal20(true),'t = 8 时 E、F 上下对齐，EF 最短，为 8。'),
      ...frames20(6,4,'coord').slice(0,2)]}
  ];
  return {
    13:{heading:'第 13 题多种解法', methods:methods13},
    19:{heading:'第（4）问多种解法', prompt:'已知 y = ax² − 2ax − 3a（a ≠ 0）。取 −2 ≤ x ≤ 2 上的抛物线部分 G。若 G 与直线 y = x + 1 有两个不同交点，求 a 的取值范围。', methods:methods19},
    20:{heading:'最后一问 · 应用题多种解法', prompt:'【应用】矩形 ABCD 中，AB = 8、BC = 12。E 在 BC 上，F 在矩形的边上，EF = 10。若 ABEF 有一个内角为直角且两条对角线互相垂直，求 DF 的长。', methods:methods20}
  };
})();

<script>
const lessonBoard = (() => {
  const panel = document.querySelector('#chalkboard');
  const canvas = panel.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const surface = panel.querySelector('.paper-surface');
  const artwork = panel.querySelector('.paper-art');
  const notes = panel.querySelector('textarea');
  const status = panel.querySelector('[role="status"]');
  const palettes = {blue:'#224f87',red:'#ac3629',black:'#263e48'};
  const memory = new Map();
  let key = '';
  let state = {strokes:[],notes:''};
  let mode = 'pen';
  let color = palettes.blue;
  let active = null;
  let opener = null;

  function save() {
    if (!key) return;
    memory.set(key,state);
    try {
      localStorage.setItem(key,JSON.stringify(state));
    } catch {
      status.textContent = '浏览器无法保存，板书可在当前网页继续使用。';
    }
  }

  function getState(id) {
    if (memory.has(id)) return memory.get(id);
    try {
      const stored=JSON.parse(localStorage.getItem(id));
      if (Array.isArray(stored?.strokes) && typeof stored.notes==='string') return stored;
    } catch {}
    return {strokes:[],notes:''};
  }

  function paint(stroke,from,to) {
    const width=canvas.width;
    const height=canvas.height;
    const eraser=stroke.mode==='eraser';
    ctx.globalCompositeOperation=eraser?'destination-out':'source-over';
    ctx.strokeStyle=stroke.color;
    ctx.fillStyle=stroke.color;
    ctx.lineWidth=(eraser ? .024 : .0035)*width;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.beginPath();
    if (from===to) {
      ctx.arc(from[0]*width,from[1]*height,ctx.lineWidth/2,0,Math.PI*2);
      ctx.fill();
    } else {
      ctx.moveTo(from[0]*width,from[1]*height);
      ctx.lineTo(to[0]*width,to[1]*height);
      ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
  }

  function replay() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (const stroke of state.strokes) {
      if (stroke.mode==='clear') {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        continue;
      }
      const points=stroke.points;
      if (!points?.length) continue;
      paint(stroke,points[0],points[0]);
      for (let i=1;i<points.length;i++) paint(stroke,points[i-1],points[i]);
    }
  }

  function resize() {
    if (panel.hidden) return;
    const rect=canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dpi=Math.min(devicePixelRatio,2);
    const width=Math.round(rect.width*dpi), height=Math.round(rect.height*dpi);
    if (width!==canvas.width || height!==canvas.height) {
      canvas.width=width;
      canvas.height=height;
    }
    replay();
  }

  function point(event) {
    const r=canvas.getBoundingClientRect();
    return [(event.clientX-r.left)/r.width,(event.clientY-r.top)/r.height];
  }

  function sync() {
    const last=state.strokes.at(-1);
    panel.querySelector('[data-paper-action="undo"]').disabled=!last;
    panel.querySelector('[data-paper-action="clear"]').disabled=!last || last.mode==='clear';
    for (const button of panel.querySelectorAll('[data-paper-mode]')) {
      button.setAttribute('aria-pressed',String(button.dataset.paperMode===mode));
    }
    for (const button of panel.querySelectorAll('[data-ink]')) {
      button.setAttribute('aria-pressed',String(palettes[button.dataset.ink]===color));
    }
    canvas.dataset.mode=mode;
  }

  function paper(style) {
    surface.dataset.paper=style;
    for (const button of panel.querySelectorAll('[data-paper]')) {
      button.setAttribute('aria-pressed',String(button.dataset.paper===style));
    }
  }

  function finish(event) {
    if (!active || (event && event.pointerId!==active.pointer)) return;
    active=null;
    sync();
    save();
  }

  function undo() {
    finish();
    if (!state.strokes.length) return;
    state.strokes.pop();
    replay();
    sync();
    status.textContent='已撤销上一次操作。';
    save();
  }

  canvas.addEventListener('pointerdown',event=>{
    if (active || event.button!==0) return;
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    const pos=point(event);
    const stroke={mode,color,points:[pos]};
    active={stroke,pointer:event.pointerId};
    state.strokes.push(stroke);
    paint(stroke,pos,pos);
  });
  canvas.addEventListener('pointermove',event=>{
    if (!active || event.pointerId!==active.pointer) return;
    const {stroke}=active;
    const next=point(event);
    paint(stroke,stroke.points.at(-1),next);
    stroke.points.push(next);
  });
  for (const name of ['pointerup','pointercancel','lostpointercapture']) canvas.addEventListener(name,finish);

  panel.addEventListener('click',event=>{
    const button=event.target.closest('button');
    if (!button) return;
    const action=button.dataset.paperAction;
    if (action==='close') {hide();return;}
    if (action==='undo') undo();
    if (action==='clear') {
      finish();
      state.strokes.push({mode:'clear'});
      replay();
      status.textContent='已清空手写笔迹，可以撤销。';
      save();
    }
    if (button.dataset.paper) paper(button.dataset.paper);
    if (button.dataset.paperMode) mode=button.dataset.paperMode;
    if (button.dataset.ink) {
      color=palettes[button.dataset.ink];
      mode='pen';
    }
    sync();
  });
  panel.addEventListener('keydown',event=>{
    if (event.target!==notes && (event.ctrlKey || event.metaKey) && !event.shiftKey && event.key.toLowerCase()==='z') {
      event.preventDefault();
      undo();
    }
  });
  function setExpanded(expanded) {
    document.querySelector('[data-action="board"]')?.setAttribute('aria-expanded',String(expanded));
  }

  function hide() {
    finish();
    save();
    panel.hidden=true;
    setExpanded(false);
    const focus=opener?.isConnected?opener:document.querySelector('[data-action="board"]');
    focus?.focus({preventScroll:true});
  }

  function setFigure(markup) {
    artwork.innerHTML=markup;
    panel.querySelector('[data-paper="figure"]').hidden=!markup;
    if (!markup && surface.dataset.paper==='figure') paper('grid');
  }

  notes.addEventListener('input',()=>{
    state.notes=notes.value;
    save();
  });
  new ResizeObserver(resize).observe(surface);

  return {
    get open() {return !panel.hidden;},
    setPrompt(prompt) {panel.querySelector('.paper-question').innerHTML=prompt;},
    setQuestion(number,prompt,figureMarkup) {
      finish();
      key='midterm-chalkboard-v1-q'+number;
      state=getState(key);
      notes.value=state.notes;
      notes.closest('details').open=Boolean(state.notes);
      panel.querySelector('#chalkboard-title').textContent='第 '+number+' 题 · 板书草稿纸';
      panel.querySelector('.paper-question').innerHTML=prompt;
      status.textContent='笔迹和文字按题保存在当前浏览器。';
      setFigure(figureMarkup);
      sync();
      resize();
    },
    show(figureMarkup,withFigure,trigger) {
      opener=trigger;
      setFigure(figureMarkup);
      if (withFigure && figureMarkup) paper('figure');
      panel.hidden=false;
      setExpanded(true);
      resize();
      panel.querySelector('#chalkboard-title').focus({preventScroll:true});
      panel.scrollIntoView({block:'nearest'});
    }
  };
})();
</script>
<script>

    const options=[
      '<path d="M-26 16Q-26 10 0 10Q26 10 26 16V65L0 99L-26 65ZM-26 65Q0 73 26 65" fill="none" stroke="'+ink+'" stroke-width="1.9"/>',
      path([[-26,10],[26,10],[26,65],[0,99],[-26,65],[-26,10]])+line([-26,65],[26,65]),
      '<circle cx="0" cy="48" r="35" fill="none" stroke="'+ink+'" stroke-width="1.9"/>',
      '<path d="M-26 16Q-26 10 0 10Q26 10 26 16V65L0 99L-26 65Z" fill="none" stroke="'+ink+'" stroke-width="1.9"/>'

const nav = document.querySelector('#number-nav');

function figure(name) {
  const label = (x,y,value) => '<text x="' + x + '" y="' + y + '">' + value + '</text>';
  const line = (x,y,u,v,color='#78929a',dash='') => '<path d="M' + x + ' ' + y + 'L' + u + ' ' + v + '" fill="none" stroke="' + color + '" stroke-width="2" ' + (dash ? 'stroke-dasharray="5 4"' : '') + '/>';
  const dot = (x,y,color='#08746a') => '<circle cx="' + x + '" cy="' + y + '" r="3.8" fill="' + color + '"/>';
  const poly = (points,color) => '<polyline points="' + points.map(([x,y])=>x+','+y).join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2.7" stroke-linejoin="round"/>';
  const svg = (height,title,body) => '<svg class="board-figure" viewBox="0 0 460 ' + height + '" role="img" aria-label="' + title + '">' + body + '</svg>';
  if(name==='absolute'||name==='absolute-start'){
    const X=x=>169+55*x, Y=y=>186-17*y;
    const coords=Array.from({length:141},(_,i)=>-2.5+i/20).map(x=>[X(x),Y(Math.abs(x*x-2*x-3))]);
    const compare=name==='absolute';
    return svg(218,compare?'绝对值抛物线与 y 等于 4 的三个交点':'绝对值抛物线',
      line(25,Y(0),435,Y(0))+line(X(0),25,X(0),197)+(compare?line(25,Y(4),435,Y(4),'#b16a27',true):'')+
      poly(coords,'#08746a')+[-1,3].map(x=>dot(X(x),Y(0))+label(X(x)-9,Y(0)+20,String(x))).join('')+
      (compare?[1-Math.sqrt(8),1,1+Math.sqrt(8)].map(x=>dot(X(x),Y(4),'#b16a27')).join(''):'')+
      label(X(1)-9,Y(4)-12,'(1, 4)')+(compare?label(378,Y(4)-9,'y = 4'):'')+label(423,Y(0)-7,'x')+label(X(0)+6,32,'y'));
  }
  if(name==='angle'){
    const s=Math.sqrt(3), tangent=2-s;
    const d=s/(s+tangent), e=(1+Math.cos(Math.PI/6))/2, ey=.25;
    const points={A:[0,0],B:[1,0],C:[.75,s/4],D:[d,d*tangent],E:[e,ey],"D′":[2*e-d,2*ey-d*tangent],K:[(2*e-d)/2,(2*ey-d*tangent)/2]};
    const X=x=>52+322*x, Y=y=>184-322*y;
    const pos=key=>[X(points[key][0]),Y(points[key][1])];
    const edge=(u,v,color,dash)=>line(...pos(u),...pos(v),color,dash);
    const offsets={A:[-16,15],B:[5,18],C:[-1,-9],D:[-15,18],E:[-5,-11],"D′":[12,-3],K:[-3,-10]};
    return svg(212,'延长 AD 到 D′，标出中点 K',
      edge('A','C')+edge('C','B')+edge('A','B')+edge('A','D′','#08746a')+edge('B','E')+
      edge('B','D′','#29619b',true)+edge('B','K','#29619b',true)+
      Object.keys(points).map(k=>{const [x,y]=pos(k);return dot(x,y)+label(x+offsets[k][0],y+offsets[k][1],k);}).join(''));
  }
  if(name==='dilation'){
    const X=x=>245+26*x, Y=y=>126-21*y;
    const old=[[-4,4],[-6,-2],[-4,0]], next=old.map(([x,y])=>[x/2,y/2]);
    let grid='';
    for(let x=-7;x<=7;x++)grid+=line(X(x),22,X(x),Y(-3),x===0?'#607e88':'#deebec');
    for(let y=-3;y<=5;y++)grid+=line(X(-7),Y(y),X(7),Y(y),y===0?'#607e88':'#deebec');
    const shape=(points,tag,color)=>poly([...points,points[0]].map(([x,y])=>[X(x),Y(y)]),color)+points.map(([x,y],i)=>dot(X(x),Y(y),color)+label(X(x)+(i===1?-23:5),Y(y)+(i===2?17:-6),'ABC'[i]+tag)).join('');
    return svg(205,'原三角形和缩小后的三角形，A₂、B₂、C₂ 是相应线段的中点',
      grid+old.map(([x,y])=>line(X(0),Y(0),X(x),Y(y),'#99a9ae',true)).join('')+
      shape(old,'₁','#29619b')+shape(next,'₂','#08746a')+dot(X(0),Y(0))+label(X(0)+6,Y(0)+17,'O')+
      label(X(7)+8,Y(0)-6,'x')+label(X(0)+6,25,'y'));

  if(name==='parabola-family'||name==='parabola-intersections'){

    const curve=(a,color)=>poly(Array.from({length:121},(_,i)=>{

        curve(-.5,teal)+line(X(-2.48),Y(-1.48),X(2.55),Y(3.55),orange)+

      curve(2,blue)+curve(-.5,orange)+curve(1,teal)+'</svg>'+
      [[-1,0],[0,-3],[1,-4],[2,-3],[3,0]].map(([x,y])=>dot(X(x),Y(y),teal)).join('')+
      label(X(1)+7,Y(-4)+19,'(1, −4)')+label(290,18,'对称轴 x = 1')+
      label(56,263,'绿色 a = 1　　蓝色 a = 2　　橙色 a = −1/2'));

  if(name==='perpendicular-discovery'){
    const shape=(points,keys,color)=>poly([...keys,keys[0]].map(key=>points[key]),color);
    const names=(points,offsets)=>Object.entries(offsets).map(([key,[dx,dy]])=>label(points[key][0]+dx,points[key][1]+dy,key)).join('');

    return svg(202,'图 1 连接等距点 B 与 D。图 2 对照三角形 ABD 与 BCA',
      shape(p,['A','B','C','D'],'#78929a')+line(...p.A,...p.C,'#29619b')+line(...p.B,...p.D,'#08746a')+
      poly([[51,132],[62,132],[62,143]],'#78929a')+
      names(p,{A:[-13,-8],B:[-13,16],C:[5,14],D:[5,-8]})+
      shape(r,['A','B','D'],'#08746a')+shape(r,['B','C','A'],'#29619b')+line(...r.D,...r.C)+
      poly([[259,57],[269,57],[269,47]],'#78929a')+poly([[259,127],[269,127],[269,137]],'#78929a')+

      label(33,183,'图 1　看 AC 的垂直平分线')+label(246,183,'图 2　△ABD ∽ △BCA'));

  if(name==='perpendicular-rotation'){
    const X=x=>220+24*x, Y=y=>172-24*y;
    const p={A:[0,4],B:[-6,0],C:[6,0],D:[0,0],E:[48/13,72/13],F:[24/13,36/13]};
    const point=k=>[X(p[k][0]),Y(p[k][1])];
    const edge=(u,v,color,dash)=>line(...point(u),...point(v),color,dash);
    const names={A:[-12,-10],B:[-15,10],C:[6,10],D:[-5,17],E:[7,-1],F:[7,15]};
    return svg(222,'图 3，D 是 BC 的中点，旋转将 B 对到 C、D 对到 E；AC 垂直平分 DE',
      edge('B','C')+edge('B','A')+edge('A','D','#08746a')+edge('A','E','#08746a')+edge('C','E')+
      edge('D','E','#a3561d',true)+edge('A','C','#29619b')+
      poly([[X(0),Y(.48)],[X(.48),Y(.48)],[X(.48),Y(0)]],'#08746a')+
      Object.keys(p).map(k=>{const [x,y]=point(k);return dot(x,y,k==='F'?'#a3561d':'#08746a')+label(x+names[k][0],y+names[k][1],k);}).join('')+
      label(82,209,'D 处是内角直角　·　F 处是两条对角线垂直'));
  }
  if(name==='perpendicular-rectangle'){
    const sample=(left,onTop)=>{
      const X=x=>left+12*x, Y=y=>141-12*y;
      const E=onTop?[8,0]:[4,0], F=onTop?[8,8]:[12,6];
      const points={A:[0,8],B:[0,0],C:[12,0],D:[12,8],E,F};
      const point=k=>[X(points[k][0]),Y(points[k][1])];
      const offsets={A:[-13,-6],B:[-13,15],C:[4,15],D:[5,-6],E:[-3,17],F:[5,-7]};
      return poly(['A','B','C','D','A'].map(point),'#78929a')+
        line(...point('A'),...point('E'),'#29619b')+line(...point('B'),...point('F'),'#08746a')+
        line(...point('E'),...point('F'),'#a3561d',true)+
        Object.keys(points).map(k=>{const [x,y]=point(k);return dot(x,y)+label(x+offsets[k][0],y+offsets[k][1],k);}).join('')+
        label(left+31,183,onTop?'F 在 AD 上':'F 在 CD 上');
    };
    return svg(203,'图 4 的两种示意位置：F 在 AD 或 CD，蓝线 AE 垂直于绿线 BF',
      sample(38,true)+sample(266,false));
  }
  return '';
}

function navGroup(title,first,last){
  return '<div class="nav-group"><h2>'+title+'</h2><div class="numbers">'+questions.slice(first,last).map((q,i)=>
    '<button type="button" data-index="'+(first+i)+'" aria-label="第 '+(first+i+1)+' 题 '+q.title+'">'+String(first+i+1).padStart(2,'0')+'</button>'
  ).join('')+'</div></div>';
}

function selectedMethod(){
  return advancedMethods[current+1]?.methods[activeMethod];
}

function activePrompt(){
  return (selectedMethod() && advancedMethods[current+1].prompt) || questions[current].prompt;
}

function activeExplanation(){
  return selectedMethod() ?? questions[current];
}

function visualStages(){
  return selectedMethod()?.visuals ?? lessonVisuals[current+1] ?? [];
}

function renderMethodPicker(){
  const topic=advancedMethods[current+1];
  const picker=board.querySelector('.method-picker');
  picker.hidden=!topic;
  if(!topic){
    picker.replaceChildren();
    return;
  }
  const overview=current===12?'原讲解':'全题讲解';
  const methodButton=(title,index)=>'<button type="button" data-action="method" data-method="'+index+
    '" aria-pressed="'+(activeMethod===index)+'">'+title+'</button>';
  picker.innerHTML='<h3 id="method-heading">'+topic.heading+'</h3><div class="method-options" role="group" aria-labelledby="method-heading">'+
    methodButton(overview,-1)+topic.methods.map((method,index)=>methodButton(method.title,index)).join('')+'</div>';
}

function renderSteps(){
  const explanation=activeExplanation();
  board.querySelector('.lesson-steps').innerHTML =
    '<h3>'+(selectedMethod()?.title??'分步讲解')+'</h3><div class="actions"><button type="button" class="primary" data-action="step">展开第 1 步</button>'+
    '<button type="button" data-action="step-back" disabled>退一步</button><button type="button" data-action="all">展开全部</button>'+
    '<button type="button" data-action="reset" disabled>收起解析</button></div>'+
    '<p class="empty">先读题，讲到哪一步就展开哪一步。</p>'+
    '<ol class="steps">'+explanation.steps.map(text=>'<li hidden>'+text+'</li>').join('')+'</ol><p class="answer" hidden>答案　'+explanation.answer+'</p>';
}

function diagramPanel(){
  const stages=visualStages();
  if(!stages.length)return '';
  return '<figure class="lesson-figure" aria-label="讲解图">'+
    '<div class="figure-head"><h3>讲解图</h3><span class="figure-count"></span></div>'+
    '<figcaption class="figure-stage" aria-live="polite"></figcaption>'+
    '<div class="stage-art"></div><p class="figure-caption" hidden></p>'+
    (selectedMethod()?'<label class="figure-select">跳到图示 <select aria-label="跳到图示"></select></label>':'')+
    '<div class="figure-actions"><button type="button" data-action="figure-prev">上一幅</button>'+
    '<button type="button" data-action="figure-next">下一幅</button>'+
    '<button type="button" class="board-from-figure" data-action="board-figure">带图板书</button></div></figure>';
}

function updateFigure(followStep=false){
  const stages=visualStages();
  if(!stages.length)return;
  if(followStep){
    const targetStep=stages.reduce((step,stage)=>stage.step<=visible?Math.max(step,stage.step):step,0);
    figureIndex=stages.findIndex(stage=>stage.step===targetStep);
  }
  const stage=stages[figureIndex];
  board.querySelector('.stage-art').innerHTML=stage.draw();
  board.querySelector('.figure-stage').textContent=stage.title;
  board.querySelector('.figure-count').textContent=(figureIndex+1)+' / '+stages.length;
  const select=board.querySelector('.figure-select select');
  if(select){
    if(!select.options.length)select.replaceChildren(...stages.map((item,i)=>new Option(item.title,String(i))));
    select.value=String(figureIndex);
  }
  const caption=board.querySelector('.figure-caption');
  caption.hidden=!stage.caption;
  caption.textContent=stage.caption??'';
  board.querySelector('[data-action="figure-prev"]').disabled=figureIndex===0;
  board.querySelector('[data-action="figure-next"]').disabled=figureIndex===stages.length-1;
}

function renderSource(){
  const q=questions[current];
  const source=board.querySelector('.lesson-source');
  const originalOpen=source.querySelector('details')?.open??false;
  const drawing = cleanQuestionFigures(current+1,Boolean(selectedMethod()));
  const showDrawing = originalOpen || current === 0;
  source.innerHTML =
    '<h3>题目</h3><p class="prompt">'+activePrompt()+'</p>'+
    (q.note?'<p class="question-note">'+q.note+'</p>':'')+
    (drawing?'<details'+(showDrawing?' open':'')+'><summary>'+ (current===0?'查看题图与选项':'查看题图')+'</summary><div class="source-list">'+drawing+'</div></details>':'')+
    diagramPanel();
}

function render(){
  const q=questions[current];
  for(const b of nav.querySelectorAll('[data-index]'))b.setAttribute('aria-current',String(Number(b.dataset.index)===current));
  board.querySelector('.question-head').innerHTML =
    '<h2 id="question-title" tabindex="-1">第 '+(current+1)+' 题 · '+q.title+'</h2>'+
    '<div class="actions"><button type="button" data-action="prev" '+(current===0?'disabled':'')+'>← 上一题</button>'+
    '<button type="button" data-action="next" '+(current===questions.length-1?'disabled':'')+'>下一题 →</button>'+
    '<button type="button" data-action="board" aria-controls="chalkboard" aria-expanded="'+lessonBoard.open+'">板书草稿纸</button></div>';
  board.querySelector('.lesson-source').replaceChildren();
  renderSource();
  renderMethodPicker();
  renderSteps();
  updateFigure();
  lessonBoard.setQuestion(current+1,activePrompt(),board.querySelector('.stage-art')?.innerHTML??'');
}

function go(index,moveFocus=true){
  if(!Number.isInteger(index)||index<0||index>=questions.length)return;
  current=index;
  activeMethod=current===12?0:-1;
  visible=0;
  figureIndex=0;
  if(location.hash!=='#q'+(current+1))history.replaceState(null,'','#q'+(current+1));
  render();
  if(moveFocus){
    board.querySelector('#question-title').focus({preventScroll:true});
    board.scrollIntoView({block:'start'});
  }
}

function update(){
  const steps=board.querySelectorAll('.steps li');
  for(const [i,step] of steps.entries()){
    step.hidden=i>=visible;
    step.classList.toggle('latest',i===visible-1);
  }
  const done=visible===steps.length;
  board.querySelector('.empty').hidden=visible>0;
  board.querySelector('.answer').hidden=!done;
  const button=board.querySelector('[data-action="step"]');
  button.disabled=done;
  button.textContent=done?'已展开全部':'展开第 '+(visible+1)+' 步';
  board.querySelector('[data-action="all"]').disabled=done;
  board.querySelector('[data-action="step-back"]').disabled=visible===0;
  board.querySelector('[data-action="reset"]').disabled=visible===0;
  updateFigure(true);
}

nav.innerHTML=navGroup('选择题',0,8)+navGroup('填空题',8,13)+navGroup('解答题',13,questions.length);
nav.addEventListener('click',e=>{const button=e.target.closest('[data-index]');if(button)go(Number(button.dataset.index));});
board.addEventListener('click',e=>{
  const button=e.target.closest('[data-action]');
  const action=button?.dataset.action;
  if(action==='method'){
    const method=Number(button.dataset.method);
    if(method===activeMethod)return;
    activeMethod=method;
    visible=0;
    figureIndex=0;
    for(const option of board.querySelectorAll('[data-method]')){
      option.setAttribute('aria-pressed',String(Number(option.dataset.method)===method));
    }
    renderSource();
    renderSteps();
    updateFigure();
    lessonBoard.setPrompt(activePrompt());
    return;
  }
  if(action==='prev'||action==='next'){go(current+(action==='next'?1:-1));return;}
  if(action==='board'||action==='board-figure'){
    const art=board.querySelector('.stage-art')?.innerHTML??'';
    lessonBoard.show(art,action==='board-figure',button);
    return;
  }
  if(action==='figure-prev'||action==='figure-next'){
    figureIndex+=action==='figure-next'?1:-1;
    updateFigure();
    return;
  }
  if(action==='step'){visible=Math.min(visible+1,activeExplanation().steps.length);}
  else if(action==='step-back'){visible=Math.max(0,visible-1);}
  else if(action==='all'){visible=activeExplanation().steps.length;}
  else if(action==='reset'){visible=0;}
  else{return;}
  update();
});
board.addEventListener('change',e=>{
  if(!e.target.matches('.figure-select select'))return;
  figureIndex=Number(e.target.value);
  updateFigure();
});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||
    e.target.closest('input,textarea,select,[contenteditable]')||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'))return;
  e.preventDefault();
  go(current+(e.key==='ArrowRight'?1:-1));
});
const requested=Number(location.hash.match(/^#q(\d+)$/)?.[1]);
go(requested>=1&&requested<=questions.length?requested-1:0,false);
</script>
</body>
</html>
