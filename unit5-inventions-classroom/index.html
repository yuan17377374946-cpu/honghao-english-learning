add('K3',3,'choice','Compare Ben and Coco. Ben arrived ____ Coco.',{cn:'注意题目指定比较的是哪两个人。',people:[['Amy','9:00'],['Ben','9:10'],['Coco','9:15']],options:['earlier than','later than','the earliest'],answer:0,hints:['表中有三个人，句子正在比较哪两个人？','Ben 9:10，Coco 9:15。'],explain:['Ben 比 Coco 早到，用 earlier than。','表中人数不决定句型，要看句子比较的对象；Amy 才是三人中最早到的。'],skill:'识别实际比较对象'});
add('K4',3,'text','Press here ____ the machine.',{instruction:'Complete the label with start.',art:'button',answers:[['to start']],hints:['按这里，是为了做什么？','表示目的，可以用 to + 动词原形。'],explain:['Press here to start the machine.','to start 表示“为了启动”。'],skill:'to do 表示目的'});
add('K5',3,'text','These wheels make the job more easily.',{instruction:'Replace only “more easily”. Keep the rest of the sentence.',cn:'已知：With these wheels, the job is easier. 只改 more easily。',art:'wheel-cart',answers:[['easier']],placeholder:'Replace “more easily” with …',hints:['make the job … 说明“工作变得怎样”。','make + 宾语 + 形容词；此处还有“更容易”的比较含义。'],explain:['make the job easier：让工作变得更容易。','These wheels make the job easier.','如果重写成 help us move more easily，more easily 也可以；本题要求只改指定部分。'],skill:'make … easier'});
add('K6',3,'choice','Check the list. Which correction is needed?',{context:'one board · two wheel · three boxes',cn:'采购清单里只有一处错误。',options:['one boards','two wheels','three box'],answer:1,hints:['先看每个名词前的数量。','two 后面的可数名词应该用复数。'],explain:['one board 和 three boxes 已经正确。','two wheel 应改为 two wheels。'],skill:'名词单复数'});
add('K7',3,'text','There are three new ____ at our science fair. Each ____ solves a different problem.',{instruction:'Use invention or inventor. Change the form if needed.',cn:'注意句子介绍的是展品，而不是发明者。',art:'fair',answers:[['inventions'],['invention']],hints:['图中是三件展品，不是三个人。','three 后用复数；Each 后用单数。'],explain:['invention 表示发明；inventor 表示发明者。','three new inventions；Each invention。'],skill:'名词词义与数量'});
add('K8',3,'choice','This ramp is ____ here.',{cn:'门口有台阶，现在装上了斜坡。',art:'ramp',options:['useful','usefully','use'],answer:0,hints:['is 后面要描述这个斜坡怎么样。','需要形容词，表达“有用的”。'],explain:['useful 是形容词，表示“有用的”。','This ramp is useful here.'],skill:'词形与句子位置'});
add('R1',4,'choice','Which picture matches “They stopped at the library door”?',{cn:'结合故事情境选择图片。',material:'story',options:['A','B','C'],icons:['flat','steps','fallen'],answer:1,evidence:[3,4],hints:['他们停下来时，门口出现了什么困难？','文中提到了 two steps。'],explain:['他们到了门口，却不能把小车推上台阶。','B 图保留了小车、书和台阶这几个关键条件。'],skill:'图文信息匹配'});
add('R2',4,'choice','“The wheels solved every problem on the way.” Is that right?',{cn:'判断这个说法，并选择有依据的解释。',material:'story',options:['Yes. The wheels helped the cart go up the steps.','No. The wheels helped on the flat path, but a ramp was needed at the door.','No. The children carried all the books by hand.'],answer:1,evidence:[2,4,5,6],hints:['把平路上的情况和门口的情况分开看。','轮子帮助移动，但门口还有台阶。'],explain:['every problem 意味着“所有问题”，与故事不符。','平路上轮子帮忙；到门口还需要斜坡解决高度问题。'],skill:'因果与范围判断'});
add('R3',4,'choice','“They could not push the cart up them.” What does them refer to?',{cn:'them 指代前面出现的什么？',material:'story',options:['the books','the wheels','the steps'],answer:2,evidence:[4],hints:['先找到这句话所在的完整句子。','There were two steps, and … 两个分句在说明同一个障碍。'],explain:['them 指代前面的 two steps。','不能把车推上台阶，后面才需要 ramp。'],skill:'代词指代'});
add('T1',4,'choice','You want to learn how a lever lifts a box. Where should you go?',{cn:'按想了解的用途选择地点。',material:'table',options:['Library entrance','Workshop','Transport corner'],answer:1,evidence:[1],hints:['先在 Purpose 一栏找 lift a box。','找到用途后，再对应到同一行的地点。'],explain:['Workshop 的展示介绍杠杆怎样抬起箱子的一端。','按同一行对应 Machine、Purpose 和 Place。'],skill:'表格用途定位'});
add('T2',4,'choice','You arrive at 9:35 and leave at 9:55. Which complete demonstration can you watch?',{cn:'必须从头到尾完整观看。',material:'table',options:['Ramp · 9:20–9:30','Lever · 9:40–9:50','Wheel · 10:00–10:10'],answer:1,evidence:[1],hints:['能参加的整个展示时间，都要落在你停留的时间内。','9:40–9:50 在 9:35–9:55 之间。'],explain:['Ramp 展示已结束；Wheel 展示在离开后开始。','Lever 的完整展示在停留时间内。'],skill:'时间条件筛选'});
add('T3',4,'multi','Zoe wants to move a cart along the floor AND get it up to a higher doorway. Choose TWO.',{cn:'同时满足两个用途，要选择两种机械。',material:'table',options:['Ramp','Lever','Wheel'],answer:[0,2],evidence:[0,2],hints:['把两个目标拆开：在地面移动；到达较高门口。','分别找 move a cart 和 reach a higher doorway。'],explain:['Wheel 帮助小车沿地面移动。','Ramp 帮助小车到达较高的门口；两种作用配合。'],skill:'整合两个条件'});
add('W1',5,'writing','Create a label: My Favourite Simple Machine',{cn:'给低年级参观者介绍一种简单机械，讲清它怎样帮忙。',hints:['先选 wheel、ramp 或 lever，再想一个具体的使用地点。','对比没有它和有了它：什么原本很难，现在怎样变容易？'],explain:['先口头说：是什么 → 在哪里 → 遇到什么困难 → 它怎样帮忙。','课堂可先写 2–3 句，课后再整理成完整介绍牌。'],skill:'具体说明与连贯表达'});
add('E1',6,'text','We use this ramp ____ the cart up to the doorway.',{instruction:'Complete the sentence with move.',art:'ramp',answers:[['to move']],hints:['use something … 表达用某物去做什么。'],explain:['use … to do：用……做……。','We use this ramp to move the cart up to the doorway.'],skill:'用途表达迁移'});
add('E2',6,'text','The orange car moves ____ than the purple car.',{instruction:'Use slowly. Both cars travel 20 m and start together.',cars:true,answers:[['more slowly']],hints:['同样走 20 m，橙色 16 s，紫色 12 s。','比较指定的两辆车，并用 slowly。'],explain:['橙色车用时更长，移动更慢。','The orange car moves more slowly than the purple car.'],skill:'比较对象与数据迁移'});
add('E3',6,'open','Make “It is useful” more specific.',{cn:'选一种简单机械，说明在哪里、怎样帮忙。',art:'fair',sample:'A ramp helps us push a cart up to a higher doorway. / Wheels help us move heavy boxes along the floor.',hints:['只说 useful 不够，补充“帮谁做什么”。'],explain:['说明具体用途，听者才能明白它为什么有用。','合理的不同表达都可以，由老师结合句意判断。'],skill:'具体表达用途'});
const micro=[{q:'The boy moves more faster. → Replace “more faster”.',a:'faster',why:'fast 的比较级是 faster，不加 more。'},{q:'The robot moves slowlier. → Replace “slowlier”.',a:'more slowly',why:'slowly 的比较级是 more slowly。'},{q:'I use a cart ____ (carry) books.',a:'to carry',why:'use … to do，说明用途。'},{q:'These ramps make moving boxes ____ (easy).',a:'easier',why:'make + 宾语 + 形容词；此处表示更容易。'},{q:'We need three ____ (board).',a:'boards',why:'three 后面用可数名词复数。'},{q:'Handle the watch ____ (careful).',a:'carefully',why:'副词修饰动作 Handle。'},{q:'Each ____ (invention) helps us in a different way.',a:'invention',why:'Each 后接单数可数名词。'},{q:'A seesaw works like a ____.',a:'lever',why:'跷跷板围绕支点转动。'}];
function current(){return Q[state.index]||Q[0]}
function stats(){const evaluated=Q.filter(q=>!['demo','match'].includes(q.type));let independent=0,prompted=0,review=0,attempted=0;for(const q of evaluated){const r=state.records[q.id];if(!r?.first)continue;attempted++;if(r.teacher){if(r.first.correct&&!r.first.hinted)independent++;else if(r.teacher==='review')review++;else prompted++;}else if(r.first.correct&&!r.first.hinted)independent++;else if(r.correct)prompted++;else review++;}return {independent,prompted,review,attempted,total:evaluated.length};}
function topbar(){return `<header class="topbar"><button class="brand" data-action="home" aria-label="回到实验室首页">${svg('<rect x="14" y="18" width="49" height="43" rx="15" fill="#66d6c0"/><rect x="22" y="29" width="33" height="17" rx="8" fill="#eafff9"/><circle cx="32" cy="37" r="2"/><circle cx="46" cy="37" r="2"/><path d="M38 17V7m-7 0h14M31 53h15" fill="none"/>','0 0 78 72','Lab robot')}<span>发明小实验室<small>UNIT 5 · INVENTIONS</small></span></button><div class="top-tools"><button class="soft ${state.cn?'on':''}" data-action="cn" aria-pressed="${state.cn}">中文辅助 ${state.cn?'开':'关'}</button><button class="soft" data-action="vocab">21词卡</button><button class="soft desktop-only" data-action="fullscreen">全屏</button><button class="soft" data-action="summary">复习记录</button></div></header>`;}
function render(){const app=$('#app');app.innerHTML=`<div class="shell">${topbar()}${state.view==='home'?home():state.view==='summary'?summary():lesson()}</div>`;if(state.view==='lesson'){bindInputs();restoreDemo();}document.title=state.view==='lesson'?`${current().id} · Unit 5 发明小实验室`:'Unit 5 · 发明小实验室';}
function home(){const s=stats();return `<main class="home"><section class="hero"><div class="hero-copy"><p class="eyebrow">LOOK · THINK · TRY</p><h1>Small machines.<br><span>Big ideas!</span></h1><p class="intro">How do inventions change our lives?<br>从一辆推不上台阶的小车开始，发现简单机械怎样让生活更轻松。</p><div class="hero-actions"><button class="primary" data-action="start">${state.seen.length?'继续上课':'进入实验室'} →</button><button class="secondary" data-action="menu">选择环节</button></div><p class="small-note" style="margin-top:14px">六上英语 Unit 5 · 45分钟复习<br>可自由跳题，按表现调整课堂节奏。</p></div><div class="hero-art">${art('hero')}<div class="art-sticker">Let's make it easier!</div></div></section><div class="path-title"><h2>今晚的学习路线</h2><span class="small-note">7个环节 · 教师掌握节奏</span></div><section class="stage-grid">${stages.map((s,i)=>`<button class="stage-card" data-stage="${i}"><span class="stage-num">${i+1}</span><h3>${s[0]}</h3><p>${s[2]}<br>${s[1]}</p></button>`).join('')}</section>${s.attempted?`<div class="flow-notes"><span>已作答 ${s.attempted} 题</span><span>首次独立答对 ${s.independent} 题</span><span>配对 ${state.match.done.length}/12 组</span></div>`:''}<div class="home-foot"><span>原创练习 · 结合已核对教材与试卷考查方式设计</span><span>单词朗读需浏览器提供英文语音；其余环节可离线使用。</span></div></main>`;}
function lesson(){const q=current(),r=rec(q.id),group=Q.filter(x=>x.stage===q.stage),n=group.indexOf(q)+1;return `<main class="lesson"><div class="progress-wrap"><div class="progress" role="progressbar" aria-label="已浏览页面" aria-valuenow="${state.seen.length}" aria-valuemin="0" aria-valuemax="${Q.length}"><span style="width:${state.seen.length/Q.length*100}%"></span></div><span class="progress-label">已浏览 ${state.seen.length}/${Q.length} 页 · 作答 ${stats().attempted} 题</span></div><div class="lesson-head"><span class="stage-tag">${q.stage+1} · ${stages[q.stage][0]}</span><span class="question-count">环节内 ${n}/${group.length} · ${stages[q.stage][1]}</span><button class="soft jump" data-action="menu">跳转环节 ☷</button></div><section class="question-card" aria-labelledby="qtitle"><div class="q-top"><span class="q-id">${q.id}</span><div class="q-heading"><h1 id="qtitle" tabindex="-1">${esc(q.title)}</h1>${q.instruction?`<p class="instruction">${esc(q.instruction)}</p>`:''}${state.cn&&q.cn?`<p class="cn">${esc(q.cn)}</p>`:''}</div></div>${questionBody(q,r)}<div id="feedback">${feedback(q,r)}</div></section></main>${footer(q,r)}`;}
function visual(q,r){if(q.material==='story')return `<article class="reading"><h3>THE LIBRARY TRIP</h3>${story.map((s,i)=>`<span class="sentence">${r.evidence&&q.evidence.includes(i)?`<mark>${esc(s)}</mark>`:esc(s)}</span> `).join('')}</article>`;if(q.material==='dialogue')return `<article class="reading dialogue"><h3>AT THE SCIENCE CENTRE</h3>${dialogue.map(([who,s])=>{const m=s.match(/\{(\d)\}/);if(m){const no=+m[1];const old=state.records['U'+(no+2)];const txt=old?.correct?dialogOptions[[1,0,2][no-1]]:`${no}. ____`;s=`<span class="blank ${no===q.blank?'active':''}">${esc(txt)}</span>`;}else s=esc(s);return `<p class="dialogue-line"><b>${who}:</b> ${s}</p>`;}).join('')}</article>`;if(q.material==='table')return table(r.evidence?q.evidence:[]);if(q.people)return `<div class="visual"><div class="data-board">${q.people.map(([name,time],i)=>`<div class="data-person">${svg(person(0,0,['#7fd466','#6fc6e8','#f6a3b1'][i]),'0 0 120 150',name)}<b>${name}</b><strong>${time}</strong></div>`).join('')}</div><p class="art-caption">Same school · Same day</p></div>`;if(q.robots||q.cars)return `<div class="visual"><div class="data-board">${(q.robots?[['Blue','8 s','#1cb0f6'],['Red','10 s','#ec8c94'],['Green','12 s','#58cc02']]:[['Orange','16 s','#f5a94f'],['Purple','12 s','#a596d4']]).map(([name,time,color])=>`<div class="data-person"><div style="margin:auto;width:58px;height:42px;background:${color};border:4px solid #344f5d;border-radius:14px;position:relative"><span style="position:absolute;left:8px;bottom:-12px;width:13px;height:13px;border-radius:50%;background:#344f5d"></span><span style="position:absolute;right:8px;bottom:-12px;width:13px;height:13px;border-radius:50%;background:#344f5d"></span></div><b style="margin-top:22px">${name}</b><strong>${time}</strong></div>`).join('')}</div><p class="art-caption">Same start · Same distance: ${q.robots?'10':'20'} m</p></div>`;if(q.art)return `<div class="visual">${art(q.art)}<div class="art-caption">${q.id==='K5'?'With these wheels, the job is easier.':'Look closely. What can you notice?'}</div></div>`;return '';}
function table(rows=[]){const data=[['Library entrance','Ramp','Help a cart reach a higher doorway','9:20–9:30'],['Workshop','Lever','Lift one end of a box with a lever model','9:40–9:50'],['Transport corner','Wheel','See how wheels help a cart move','10:00–10:10']];return `<div><p class="eyebrow" style="margin-bottom:12px">SCIENCE FAIR · TODAY</p><div class="table-wrap"><table><thead><tr><th>Place / Machine</th><th>Purpose</th><th>Time</th></tr></thead><tbody>${data.map(([place,machine,purpose,time],i)=>`<tr class="${rows.includes(i)?'highlight':''}"><td><strong>${machine}</strong>${place}</td><td>${purpose}</td><td class="table-time">${time}</td></tr>`).join('')}</tbody></table></div></div>`;}
function questionBody(q,r){if(q.type==='match')return matchHTML();if(q.type==='demo')return demoHTML();if(q.type==='writing')return writingHTML(r);const vis=visual(q,r);return `<div class="workspace ${vis?'':'single'} ${q.material?'reading-work':''}">${vis}<div class="answer-zone">${q.context?`<p class="context-line">${esc(q.context)}</p>`:''}${q.type==='choice'||q.type==='multi'?optionsHTML(q,r):q.type==='text'?inputsHTML(q,r):openHTML(q,r)}${q.material&&q.evidence?`<button class="soft" style="margin-top:15px" data-action="evidence">${r.evidence?'隐藏':'查看'}阅读依据</button>`:''}</div></div>`;}
function optionsHTML(q,r){return `${q.type==='multi'?'<p class="choice-hint">选择两项后点“检查”</p>':''}<div class="option-list">${q.options.map((o,i)=>{const selected=q.type==='multi'?(r.answer||[]).includes(i):r.answer===i;const right=q.type==='multi'?q.answer.includes(i):q.answer===i;return `<div style="display:flex;gap:7px;align-items:stretch"><button class="option ${selected?'selected':''} ${r.checked&&selected?(right?'correct':'wrong'):''}" data-option="${i}" aria-pressed="${selected}"><span class="option-key">${String.fromCharCode(65+i)}</span>${q.icons?`<span class="option-icon">${art(q.icons[i],true)}</span>`:''}<span>${esc(o)}</span></button>${q.speakOptions?`<button class="soft" data-speak="${esc(o)}" aria-label="朗读 ${esc(o)}">♪</button>`:''}</div>`;}).join('')}</div>`;}
function inputsHTML(q,r){const a=Array.isArray(r.answer)?r.answer:[];return q.answers.map((accepted,i)=>`<label class="input-label" for="answer${i}">${q.answers.length>1?`空格 ${i+1}`:'Your answer'}</label><input class="answer-input" id="answer${i}" data-input="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(q.placeholder||'Type your answer …')}" value="${esc(a[i]||'')}">`).join('');}
function openHTML(q,r){return `<div class="teacher-prompt">先让学生说，再由老师按实际表现记录。<br>表达合理即可，不需要和示例一字不差。</div><label class="input-label" for="spoken-note">课堂记录（选填）</label><textarea class="answer-input" id="spoken-note" data-note rows="2" placeholder="可以记录学生说出的句子……">${esc(r.note||'')}</textarea>${assessmentHTML(r)}`;}
function assessmentHTML(r){return `<div class="assessment" aria-label="教师评价">${[['independent','独立完成'],['prompted','提示后完成'],['review','仍需复习']].map(([v,t])=>`<button class="soft ${r.teacher===v?'chosen':''}" data-assess="${v}" aria-pressed="${r.teacher===v}">${t}</button>`).join('')}</div>`;}
function feedback(q,r){let html='';if(r.checked){if(r.teacher){html+=`<div class="result ${r.teacher==='review'?'error':''}" role="status"><strong>${r.teacher==='independent'?'已记录：独立完成':r.teacher==='prompted'?'已记录：提示后完成':'已记录：仍需复习'}</strong></div>`;}else html+=`<div class="result ${r.correct?'':'error'}" role="status"><strong>${r.correct?'Nice work! ✓':'再看一看关键条件。'}</strong><br>${r.correct?(r.first?.correct&&!r.first?.hinted?'首次独立答对。': '这次完成了，保留首次作答记录。'):'可以重试，也可以点“提示”逐步找线索。'}</div>`;}
if(r.hints)html+=`<div class="hint-box"><b>提示 ${Math.min(r.hints,q.hints.length)} / ${q.hints.length}</b>${esc(q.hints[Math.min(r.hints,q.hints.length)-1])}</div>`;
if(r.explain){const lines=q.explain||[];html+=`<div class="explanation"><strong>一步步讲解 · ${Math.min(r.explain,lines.length)}/${lines.length}</strong>${lines.slice(0,r.explain).map((s,i)=>`<p>${i+1}. ${esc(s)}</p>`).join('')}${q.type==='open'?`<p><b>参考表达：</b>${esc(q.sample)}</p>`:''}</div>`;}return html;}
function footer(q,r){const assess=['open','writing'].includes(q.type),interactive=['demo','match'].includes(q.type);const can=q.type==='text'?Array.isArray(r.answer)&&q.answers.every((_,i)=>r.answer[i]?.trim()):q.type==='multi'?Array.isArray(r.answer)&&r.answer.length>0:r.answer!==null;return `<footer class="footer"><div class="footer-inner"><button class="secondary" data-action="prev" ${state.index===0?'disabled':''}>← 上题</button><button class="secondary" data-action="hint">提示${r.hints?` ${Math.min(r.hints,q.hints.length)}/${q.hints.length}`:''}</button><button class="secondary explain-btn" data-action="explain">${r.explain>=q.explain.length?'收起讲解':r.explain?'继续讲解':'讲解'}</button><span class="foot-status">${state.review?'错题回看中':'题目可跳过，记录按实际作答统计'}</span><div class="right">${!assess&&!interactive?`<button class="primary blue" id="check" data-action="check" ${!can?'disabled':''}>检查</button>`:''}<button class="primary" data-action="next">${state.index===Q.length-1?'完成复习':'下一题 →'}</button></div></div></footer>`;}
function shuffle(a,seed){let n=seed;return [...a].map(v=>{n=(n*9301+49297)%233280;return {v,k:n};}).sort((a,b)=>a.k-b.k).map(x=>x.v);}
function matchHTML(){const m=state.match,done=m.done,remain=state.match.only?.length?state.match.only:pairs;return `<div class="match-top"><span>Word → Picture / Meaning</span><b>已配对 ${done.filter(x=>remain.includes(x)).length} / ${remain.length}</b></div><div class="match-board"><div class="match-side">${shuffle(remain,49+m.round).map(w=>`<button class="match-card ${done.includes(w)?'done':''} ${selectedWord===w?'selected':''} ${flash.includes(w)?'miss':''}" data-word="${w}" ${done.includes(w)?'disabled':''}>${w}</button>`).join('')}</div><div class="match-side">${shuffle(remain,131+m.round).map(w=>`<button class="match-card ${['simple','tiny'].includes(w)?'definition':''} ${done.includes(w)?'done':''} ${selectedPicture===w?'selected':''} ${flash.includes(w)?'miss':''}" data-picture="${w}" aria-label="${['simple','tiny'].includes(w)?(w==='simple'?'easy to understand or use':'very small'):'图片 '+(pairs.indexOf(w)+1)}" ${done.includes(w)?'disabled':''}>${w==='simple'?'easy to understand<br>or use':w==='tiny'?'very small':art(w,true)}</button>`).join('')}</div></div><div class="mini-links"><button class="soft" data-action="match-reset">重新配对12组</button>${Object.keys(m.errors).length?'<button class="soft" data-action="match-missed">只练错词</button>':''}<button class="soft" data-action="vocab">完整21词卡</button></div>${done.filter(x=>remain.includes(x)).length===remain.length?'<div class="result"><strong>All matched! ✓</strong><br>再任选一个词，说说它在哪里、有什么作用。</div>':''}`;}
function demoHTML(){return `<div class="workspace"><div><div class="demo-tabs">${['lever','wheel','ramp'].map(v=>`<button class="soft ${state.demo===v?'active':''}" data-demo="${v}">${v}</button>`).join('')}</div><div class="visual" id="demo-visual">${art(state.demo==='wheel'?'wheel-cart':state.demo)}</div><div class="demo-controls"><button class="primary blue" data-action="demo-play">${demoPlaying&&!demoPaused?'暂停':'播放'} ▶</button><button class="secondary" data-action="demo-reset">重播 ↻</button></div></div><div><p class="eyebrow">BEFORE YOU PLAY</p><h2 style="font-size:29px;line-height:1.4;margin-top:14px">What will happen?</h2><div class="demo-note">${state.demo==='lever'?'Push one end down.<br>What happens to the other end?':state.demo==='wheel'?'The wheels turn.<br>How does the cart move?':'The doorway is higher.<br>How can the cart get up?'}</div><div class="teacher-prompt" style="margin-top:24px">先预测 → 手动播放 → 用一句话说明。<br>动画为机械原理示意，不表示真实速度或省力比例。</div><div class="flow-notes"><span>lever · 支点</span><span>wheel · 滚动</span><span>ramp · 高度</span></div></div></div>`;}
function restoreDemo(){const button=$('[data-action="demo-play"]');if(button)button.textContent=demoPlaying?(demoPaused?'继续 ▶':'暂停 Ⅱ'):'播放 ▶';const v=$('#demo-visual');if(v){v.classList.toggle('is-playing',demoPlaying);v.classList.toggle('paused',demoPaused);}}
function writingHTML(r){const machine=state.machine,frames={ramp:['My favourite simple machine is the ramp.','We can see one at ____.','Without it, it is hard to ____.','With it, we can ____.','I like it because ____.'],wheel:['My favourite simple machine is the wheel.','We can see wheels on ____.','Without wheels, it is hard to ____.','With them, we can ____.','I like this simple machine because ____.'],lever:['My favourite simple machine is the lever.','We can see one in ____.','Without it, it is hard to ____.','With it, we can ____.','I like it because ____.']},draft=state.drafts[machine]||'';return `<div class="writing-layout"><div><div class="writing-options" aria-label="选择机械">${['ramp','wheel','lever'].map(x=>`<button class="soft ${machine===x?'selected':''}" data-machine="${x}">${x}</button>`).join('')}</div><div class="visual">${art(machine)}</div><div class="flow-notes"><span>What is it?</span><span>Where is it?</span><span>Without it?</span><span>With it?</span></div></div><div><div class="writing-options" aria-label="写作提示程度">${['完整句架','关键词','只看图'].map((x,i)=>`<button class="soft ${state.support===i?'selected':''}" data-support="${i}">${x}</button>`).join('')}</div><div class="writing-frame">${state.support===0?frames[machine].map(s=>`<p>${esc(s)}</p>`).join(''):state.support===1?'<p><em>machine · place · problem · help · reason</em></p><p>without / with · help … do · use … to do · make … easier</p>':'<p>Look at your machine.<br>Tell visitors how it helps.</p>'}</div><div class="draft-label"><label for="draft">My exhibition label</label><span class="wordcount">${wordCount(draft)} words · <span class="saved">${storageOK?'已保存':'当前页面保留'}</span></span></div><textarea class="answer-input draft" id="draft" placeholder="先口头说，再写出2–3句……">${esc(draft)}</textarea><div class="rubric">${[['object','对象明确'],['help','用途具体'],['language','表达通顺']].map(([key,name])=>`<label><input type="checkbox" data-rubric="${key}" ${state.rubric[machine]?.[key]?'checked':''}>${name}</label>`).join('')}</div>${assessmentHTML(r)}<button class="soft" data-action="model" style="margin-top:14px">${r.model?'收起':'展开'}参考短文</button>${r.model?`<div class="explanation">${machine==='ramp'?'My favourite simple machine is the ramp. We can see one at our school entrance. There are steps at the door. Without the ramp, it is hard to push a cart inside. With it, we can move the cart up to the doorway. I like this simple machine because it helps people move things more easily.':machine==='wheel'?'My favourite simple machine is the wheel. We can see wheels on a cart. Without wheels, it is hard to move heavy books along the floor. With them, we can push the cart to the library. Wheels make moving things easier.':'My favourite simple machine is the lever. A seesaw in the playground works like a lever. When we push one end down, the other end goes up. We can also use a lever to lift one end of a heavy box. It helps us do the job more easily.'}</div>`:''}</div></div>`;}
function wordCount(s){return (s.trim().match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]).length;}
function bindInputs(){$$('[data-input]').forEach(el=>el.addEventListener('input',()=>{const r=rec(current().id);if(!Array.isArray(r.answer))r.answer=[];r.answer[+el.dataset.input]=el.value;r.checked=false;save();updateCheck();$('#feedback').innerHTML=feedback(current(),r);}));$('[data-note]')?.addEventListener('input',e=>{rec(current().id).note=e.target.value;save();});$('#draft')?.addEventListener('input',e=>{state.drafts[state.machine]=e.target.value;save();$('.wordcount').innerHTML=`${wordCount(e.target.value)} words · <span class="saved">${storageOK?'已保存':'当前页面保留'}</span>`;});}
function updateCheck(){const q=current(),r=rec(q.id);if($('#check'))$('#check').disabled=q.type==='text'?!q.answers.every((_,i)=>r.answer?.[i]?.trim()):q.type==='multi'?!r.answer?.length:r.answer===null;}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g,' ').replace(/[.!?。！]$/,'');}
function check(){const q=current(),r=rec(q.id);let correct=false;if(q.type==='choice')correct=r.answer===q.answer;else if(q.type==='multi')correct=Array.isArray(r.answer)&&r.answer.length===q.answer.length&&q.answer.every(v=>r.answer.includes(v));else if(q.type==='text')correct=q.answers.every((opts,i)=>opts.some(a=>norm(a)===norm(r.answer?.[i])));else return;r.tries++;if(!r.first)r.first={answer:JSON.parse(JSON.stringify(r.answer)),correct,hinted:!!(r.helpUsed||r.hints>0||r.explain>0||r.evidence)};r.correct=correct;r.checked=true;save();render();announce(correct?'答对了':'再看一看关键条件，可以重试。');}
function go(i){state.index=Math.max(0,Math.min(Q.length-1,i));state.view='lesson';const q=current();if(!state.seen.includes(q.id))state.seen.push(q.id);selectedWord=null;selectedPicture=null;flash=[];demoPlaying=false;demoPaused=false;closeModal(false);save();render();window.scrollTo({top:0,behavior:'instant'});$('#qtitle')?.focus({preventScroll:true});}
function reviewIds(){return Q.filter(q=>{const r=state.records[q.id];return r?.first&&(!r.first.correct||r.first.hinted||r.teacher==='review');}).map(q=>q.id);}
function next(){if(state.review){const ids=reviewIds();const at=ids.indexOf(current().id);if(at>=0&&at<ids.length-1){go(Q.findIndex(q=>q.id===ids[at+1]));return;}state.review=false;state.view='summary';save();render();return;}if(state.index===Q.length-1){state.view='summary';save();render();window.scrollTo(0,0);}else go(state.index+1);}
function summary(){const s=stats(),ids=reviewIds(),wrongWords=Object.entries(state.match.errors).sort((a,b)=>b[1]-a[1]);const targets=Array.from(new Set(ids.map(id=>Q.find(q=>q.id===id).skill))).slice(0,3);return `<main class="summary"><p class="eyebrow">TODAY'S LAB NOTES</p><h1>看看今晚学会了什么</h1><p class="summary-intro">已作答 ${s.attempted}/${s.total} 题 · 配对 ${state.match.done.length}/12 组。<br>统计保留首次作答；后续重试不会变成“首次独立答对”。</p><div class="stats"><div class="stat"><b>${s.independent}</b><span>首次独立完成</span></div><div class="stat"><b>${s.prompted}</b><span>订正或提示后完成</span></div><div class="stat"><b>${s.review}</b><span>当前仍需复习</span></div></div><section class="summary-card"><h2>下次优先回顾</h2>${targets.length?targets.map((x,i)=>`<p style="font-size:20px;line-height:1.9">${i+1}. ${esc(x)}</p>`).join(''):'<p class="empty">先完成几道题，再按真实作答情况确定复习重点。</p>'}${wrongWords.length?`<div class="flow-notes"><span>配对时出错的词</span>${wrongWords.map(([w,n])=>`<span>${esc(w)} · ${n}次</span>`).join('')}</div>`:''}</section><section class="summary-card"><h2>值得再做一次的题</h2>${ids.length?ids.map(id=>{const q=Q.find(x=>x.id===id),r=rec(id);return `<div class="review-item"><span><b>${id}</b> · ${esc(q.title)}<small>${r.first.correct?'首次完成前使用了帮助':'首次未独立完成'} · ${r.correct?'现已完成':'当前待巩固'}</small></span><button class="soft" data-goto="${id}">回看</button></div>`;}).join(''):'<p class="empty">目前没有需要回看的作答记录。未作答的题不会计为答对。</p>'}</section><div class="summary-actions"><button class="primary" data-action="review" ${!ids.length?'disabled':''}>回练这些题 →</button><button class="secondary" data-action="menu">选择其他题</button><button class="secondary" data-action="micro">8题微练</button><button class="secondary" data-action="export">导出课堂记录</button><button class="secondary" data-action="reset">清空本机记录</button></div><p class="small-note" style="margin-top:18px">开放题由老师判断表达。词汇配对单独记录，不计入单题正确数。记录只保存在当前浏览器。</p></main>`;}
function openModal(body,label){modalReturn=document.activeElement;$('#overlay').innerHTML=`<div class="modal" data-backdrop><section class="modal-panel" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="modal-heading"><h2>${esc(label)}</h2><button class="soft iconbutton" data-action="close" aria-label="关闭">×</button></div>${body}</section></div>`;document.body.classList.add('modal-open');$('.modal [data-action="close"]').focus();}
function closeModal(focus=true){$('#overlay').innerHTML='';document.body.classList.remove('modal-open');if(focus)modalReturn?.focus?.();}
function menu(){openModal(`<div class="menu-stages">${stages.map((s,i)=>`<section class="menu-stage"><h3>${i+1}. ${s[0]} · ${s[1]}</h3><p>${s[2]}</p><div class="mini-links">${Q.filter(q=>q.stage===i).map(q=>`<button class="soft" data-goto="${q.id}">${q.id} ${state.records[q.id]?.correct?'✓':''}</button>`).join('')}</div></section>`).join('')}</div><div class="bonus"><h3>灵活调整课堂</h3><p class="small-note">词汇环节可选2道句中运用；对话或语法耗时增加时，将完整写作留作课后，保留离堂检查。</p><div class="mini-links"><button class="soft" data-action="micro">8题微练</button><button class="soft" data-action="story-sort">阅读事件排序</button></div></div>`,'课堂路线 · 自由跳转');}
function vocabModal(){openModal(`<p class="small-note" style="margin-bottom:16px">点击词卡播放网页朗读。英文语音由浏览器提供，听不到时请换用 Chrome / Edge 或由老师领读。</p><div class="word-grid">${vocab.map(([w,def,cn])=>`<button class="word-item" data-speak="${w}"><b>${w} ♪</b><span>${def}</span>${state.cn?`<span class="word-cn">${cn}</span>`:''}</button>`).join('')}</div>`,'Unit 5 · 21词卡');}
function speak(t){if(!('speechSynthesis'in window)){toast('当前浏览器没有提供朗读功能，请由老师领读。');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;const voice=speechSynthesis.getVoices().find(v=>v.lang==='en-GB')||speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;let started=false;u.onstart=()=>{started=true;};u.onerror=()=>toast('未能播放英文朗读，可换用 Chrome / Edge，或由老师领读。');speechSynthesis.speak(u);setTimeout(()=>{if(!started)toast('朗读未启动，请检查设备声音，或由老师领读。');},2200);}
function matchClick(side,w){if(state.match.done.includes(w))return;if(side==='word')selectedWord=w;else selectedPicture=w;if(selectedWord&&selectedPicture){if(selectedWord===selectedPicture){state.match.done.push(w);announce(`配对正确，${state.match.done.length}组`);selectedWord=null;selectedPicture=null;}else{const bad=selectedWord;state.match.errors[bad]=(state.match.errors[bad]||0)+1;state.match.firstClean=false;flash=[selectedWord,selectedPicture];selectedWord=null;selectedPicture=null;announce('这两个还不匹配，再看图片或释义。');setTimeout(()=>{flash=[];if(state.view==='lesson'&&current().id==='V1')render();},650);}save();}render();}
function microModal(){openModal(`<p class="small-note" style="margin-bottom:15px">任选薄弱点加练；点击每题答案，再说明判断依据。此处不计入课堂首次作答统计。</p>${micro.map((x,i)=>`<details class="summary-card" style="margin:10px 0;padding:15px"><summary style="cursor:pointer;font-size:21px;line-height:1.5">${i+1}. ${esc(x.q)}</summary><p style="margin-top:12px;font-size:24px;color:#468d1b">${x.a}</p><p class="cn">${x.why}</p></details>`).join('')}`,'8题微练 · 按需使用');}
let sortedStory=[2,0,3,1];const sortTexts=['Use a cart to move the books.','Stop at the steps.','Put a ramp beside the steps.','Push the cart through the doorway.'];
function sortModal(){openModal(`<p class="small-note" style="margin-bottom:15px">根据刚才的短文还原事件，用上下箭头调整顺序。</p><div class="sort-list">${sortedStory.map((v,i)=>`<div class="sort-item"><b>${i+1}</b><span>${sortTexts[v]}</span><button data-sort="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="上移事件">↑</button><button data-sort="${i}" data-dir="1" ${i===3?'disabled':''} aria-label="下移事件">↓</button></div>`).join('')}</div><button class="primary blue" data-action="sort-check" style="margin-top:20px">检查顺序</button><div id="sort-result"></div>`,'故事事件排序');}
function exportNotes(){const s=stats(),data={unit:'Unit 5 · How do inventions change our lives?',date:new Date().toLocaleString('zh-CN'),statistics:s,words:state.match.errors,questions:Q.filter(q=>state.records[q.id]?.first).map(q=>({id:q.id,question:q.title,skill:q.skill,...state.records[q.id]})),writing:state.drafts};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Unit5-class-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el){if(e.target.matches('[data-backdrop]'))closeModal();return;}if(el.disabled)return;const d=el.dataset;if(d.stage!==undefined){state.review=false;go(Q.findIndex(q=>q.stage===+d.stage));return;}if(d.goto){go(Q.findIndex(q=>q.id===d.goto));return;}if(d.speak){speak(d.speak);return;}if(d.word){matchClick('word',d.word);return;}if(d.picture){matchClick('picture',d.picture);return;}if(d.option!==undefined){const q=current(),r=rec(q.id),i=+d.option;if(q.type==='multi'){r.answer=Array.isArray(r.answer)?r.answer:[];r.answer=r.answer.includes(i)?r.answer.filter(v=>v!==i):[...r.answer,i];}else r.answer=i;r.checked=false;save();render();return;}if(d.assess){const r=rec(current().id);r.teacher=d.assess;r.correct=d.assess!=='review';r.checked=true;if(!r.first)r.first={answer:r.note||state.drafts[state.machine]||'',correct:d.assess==='independent',hinted:!!(r.helpUsed||r.hints>0||r.explain>0||r.model||d.assess==='prompted')};save();render();return;}if(d.demo){state.demo=d.demo;demoPlaying=false;demoPaused=false;save();render();return;}if(d.machine){state.machine=d.machine;save();render();return;}if(d.support!==undefined){state.support=+d.support;save();render();return;}if(d.sort!==undefined){let i=+d.sort,j=i+(+d.dir);[sortedStory[i],sortedStory[j]]=[sortedStory[j],sortedStory[i]];sortModal();return;}const q=current(),r=rec(q.id);switch(d.action){case'home':state.view='home';state.review=false;save();render();window.scrollTo(0,0);break;case'start':go(state.index);break;case'cn':state.cn=!state.cn;save();render();if($('.word-grid'))vocabModal();break;case'menu':menu();break;case'close':closeModal();break;case'vocab':vocabModal();break;case'summary':state.view='summary';state.review=false;save();render();window.scrollTo(0,0);break;case'fullscreen':if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>toast('当前浏览器未允许全屏。'));else document.exitFullscreen?.();break;case'prev':go(state.index-1);break;case'next':next();break;case'check':check();break;case'hint':r.helpUsed=true;r.hints=Math.min((r.hints||0)+1,q.hints.length);save();render();break;case'explain':r.helpUsed=true;r.explain=r.explain>=q.explain.length?0:(r.explain||0)+1;save();render();break;case'evidence':r.helpUsed=true;r.evidence=!r.evidence;save();render();break;case'model':r.helpUsed=true;r.model=!r.model;save();render();break;case'demo-play':if(!demoPlaying){demoPlaying=true;demoPaused=false;}else demoPaused=!demoPaused;restoreDemo();el.textContent=demoPaused?'继续 ▶':'暂停 Ⅱ';break;case'demo-reset':demoPlaying=false;demoPaused=false;restoreDemo();requestAnimationFrame(()=>{demoPlaying=true;restoreDemo();});break;case'match-reset':state.match.done=[];state.match.only=null;state.match.round++;selectedWord=null;selectedPicture=null;save();render();break;case'match-missed':{const words=Object.keys(state.match.errors);if(!words.length)return;state.match.only=words;state.match.done=state.match.done.filter(w=>!words.includes(w));state.match.round++;selectedWord=null;selectedPicture=null;save();go(Q.findIndex(q=>q.id==='V1'));break;}case'review':state.review=true;go(Q.findIndex(q=>q.id===reviewIds()[0]));break;case'micro':microModal();break;case'story-sort':sortModal();break;case'sort-check':$('#sort-result').innerHTML=`<div class="result ${sortedStory.every((v,i)=>v===i)?'':'error'}">${sortedStory.every((v,i)=>v===i)?'顺序正确！再用 First / Then / Finally 说一遍。':'再想想：先在哪儿遇到困难，接着怎样解决？'}</div>`;break;case'export':exportNotes();break;case'reset':openModal('<p style="font-size:20px;line-height:1.8">清空后，本浏览器的答题、错词和写作草稿都会删除。</p><div class="mini-links"><button class="secondary" data-action="close">保留记录</button><button class="primary" data-action="confirm-reset">确认清空</button></div>','清空本机记录？');break;case'confirm-reset':try{localStorage.removeItem(KEY);}catch(e){}location.reload();break;}});
document.addEventListener('change',e=>{if(e.target.matches('[data-rubric]')){state.rubric[state.machine] ||= {};state.rubric[state.machine][e.target.dataset.rubric]=e.target.checked;save();}});
document.addEventListener('keydown',e=>{if($('.modal')){if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const items=$$('button:not(:disabled),a,input,textarea,select,summary',$('.modal'));const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(state.view!=='lesson'||/TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='Enter'&&e.target.matches('[data-input]')){e.preventDefault();if(!$('#check')?.disabled)check();}if(e.key==='ArrowRight'&&e.altKey){e.preventDefault();next();}if(e.key==='ArrowLeft'&&e.altKey){e.preventDefault();go(state.index-1);}});
if(!Q[state.index])state.index=0;if(state.view==='lesson'&&!state.seen.includes(current().id))state.seen.push(current().id);render();
</script>
</body></html>
