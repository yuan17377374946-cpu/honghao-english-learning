function basisMarkup(q,r,text,part,min=1){const tokens=BASIS[q.id]?.marks[part];if((r.basis||0)<min||!tokens)return esc(text);const ranges=[];for(const [word,tone,anchor] of tokens){const start=text.indexOf(word);if(start>=0&&!ranges.some(x=>start<x.end&&start+word.length>x.start))ranges.push({start,end:start+word.length,word,tone,anchor});}ranges.sort((a,b)=>a.start-b.start);let out='',at=0;for(const x of ranges){out+=esc(text.slice(at,x.start))+`<mark class="ev-mark ev-${x.tone}" ${x.anchor?`data-ev-anchor="${x.anchor}"`:''}>${esc(x.word)}</mark>`;at=x.end;}return out+esc(text.slice(at));}

function drawEvidenceArrows(){const overlay=$('.evidence-arrows'),q=current(),r=rec(q.id),b=BASIS[q.id];if(!overlay)return;overlay.innerHTML='';if(!b||r.basis<2||window.innerWidth<=760)return;const workspace=overlay.parentElement,box=workspace.getBoundingClientRect(),footer=$('.footer')?.getBoundingClientRect().top||innerHeight;const colors={blue:'#168db5',amber:'#bd8700',rose:'#c25674'};let markup=`<defs>${Object.entries(colors).map(([tone,c])=>`<marker id="ev-head-${tone}" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="${c}"/></marker>`).join('')}</defs>`;overlay.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);overlay.setAttribute('width',box.width);overlay.setAttribute('height',box.height);b.links.forEach((link,i)=>{const source=$(`[data-ev-anchor="${link.from}"]`,workspace),target=$(`[data-option="${link.option}"]`,workspace);if(!source||!target)return;const sr=source.getBoundingClientRect(),pane=source.closest('.reading,.table-wrap'),pr=pane?.getBoundingClientRect(),tr=target.getBoundingClientRect();const ar=target.closest('.answer-zone').getBoundingClientRect();if(tr.bottom<ar.top||tr.top>ar.bottom)return;if(!pr||sr.bottom<pr.top||sr.top>Math.min(pr.bottom,footer)||tr.top>footer||tr.bottom<0)return;const sy=Math.max(pr.top+13,Math.min((sr.top+sr.bottom)/2,pr.bottom-13))-box.top,sx=pr.right-box.left-6,ex=tr.left-box.left-4;const same=b.links.filter(x=>x.option===link.option),offset=same.length>1?(same.indexOf(link)-(same.length-1)/2)*16:0;const ey=(tr.top+Math.min(tr.height,80)/2+offset)-box.top;const mid=(sx+ex)/2,c=colors[link.tone];markup+=`<path d="M${sx} ${sy} C${mid} ${sy} ${mid} ${ey} ${ex} ${ey}" fill="none" stroke="${c}" stroke-width="3" marker-end="url(#ev-head-${link.tone})"/><circle cx="${sx-8}" cy="${sy}" r="10" fill="white" stroke="${c}" stroke-width="2"/><text x="${sx-8}" y="${sy+4}" text-anchor="middle" fill="${c}" font-size="12" font-weight="bold">${i+1}</text>`;});overlay.innerHTML=markup;}

const NOTE_DETAILS={"D1": ["判断依据：题目要求 sloping path，且小车要经过台阶。", "易错提醒：ladder 供人攀爬；lever 抬起一端，不能代替连续的斜面。"], "D2": ["判断依据：7:45 早于 7:55，相差10分钟。", "易错提醒：不要按数字大小说 later；时间较早表示更早到。"], "D3": ["组织表达：先说洗衣机，再说它帮助洗衣服。", "易错提醒：help us 后可接 wash；use it 后表达用途要接 to wash。"], "V2": ["判断依据：比较的是零件的大小，手表内部零件很小。", "易错提醒：tiny 不是 many（多），也不是 new（新）。"], "V3": ["拼写检查：题目要求写完整单词，因此填 boards，而不是 oards。", "易错提醒：wooden 表示木制的；复数词尾加在 board 后。"], "V4": ["句子结构：inside the watch 表示小轮子所在的位置。", "易错提醒：填完整的 inside；不要把已给首字母 i 漏掉。"], "V5": ["判断依据：小山属于自然地形；题中门口的斜坡由人搭建。", "易错提醒：表达“大自然”常直接用 nature，如 in nature。"], "P1": ["做题步骤：先分别听读三个词，再比较 ow 的声音。", "易错提醒：snow 是不同项；不能因三个词都有 ow 就认为读音相同。"], "P2": ["做题步骤：先读 snow 作参照，再将每个选项归类。", "易错提醒：题目要求 TWO，要选 yellow 和 slowly 两项。"], "U1": ["判断依据：higher doorway 是重点，B图存在高度差。", "易错提醒：轮子能在平地滚动，不等于能自行越过台阶。"], "U2": ["观察依据：中间有固定支点，两端上下变化。", "易错提醒：wheel 围绕轴滚动；ramp 提供斜面，结构都不同。"], "U3": ["作答顺序：前句 a lever 确定对象，后句 It can lift…确定问的是能力。", "易错提醒：选B后完整读一遍，确认下一句确实回答这个问题。"], "U4": ["作答顺序：前句提 wheels，后句说明 turn 和 roll 的因果。", "易错提醒：选A，不能继续问 lever；相同主题也要检查问答功能。"], "U5": ["作答顺序：先定位 two steps，再核对 up to the doorway。", "易错提醒：选C；D虽然也有 ramp，但 flat corridor 不对应门口的台阶。"], "K1": ["判断依据：空处说明 Handle 这个动作怎样进行，所以用副词 carefully。", "易错提醒：careful 是形容词，如 Be careful；不能直接用它完成本题。"], "K2": ["判断依据：同走10米，红色10秒、蓝色8秒，红色更慢；than 提示两者比较。", "易错提醒：题目指定 slowly，写 more slowly，不写 slowlier 或 more slower。"], "K2B": ["判断依据：绿色12秒最多，且 of the three 表示三者范围。", "易错提醒：副词最高级前 the 可省略；本题接受 most slowly 和 the most slowly。"], "K3": ["判断依据：Ben 9:10，Coco 9:15，所以Ben更早到。", "易错提醒：不要被表中三个人干扰；题目指定比较的只有两人。"], "K4": ["判断依据：按按钮是为了启动机器，后面的动作表示目的。", "易错提醒：start 保持原形，在前面加 to；不能填 starting。"], "K5": ["判断依据：the job 是宾语，后面说明工作变得更容易，用形容词比较级。", "易错提醒：easy 去 y 加 ier 成 easier；只替换指定部分，不改其他词。"], "K6": ["规则补充：一般名词加 s；box 以 x 结尾，复数加 es 成 boxes。", "易错提醒：one board 和 three boxes 不改，只把 two wheel 改为 two wheels。"], "K7": ["判断依据：solves a problem 描述发明的用途；图中是展品而非人。", "易错提醒：第一空 inventions，第二空 invention；不能两空都加 s。"], "K8": ["判断依据：is 后描述斜坡的特点，用形容词 useful。", "易错提醒：use 是动词或名词；usefully 是副词；useful 只有一个 l。"], "R1": ["定位方法：先找到 stopped，再读下一句 two steps 和 could not push…up。", "易错提醒：选B；A没有台阶，C书掉落的情节不见于原文。"], "R2": ["判断方法：把 every problem 拆成平路和台阶两个阶段逐一核对。", "易错提醒：选B；不能用“平路上有效”推出“所有困难都解决”。"], "R3": ["验证方法：把 the steps 代回 them，读成“不能把小车推上台阶”，意思通顺。", "易错提醒：选C；代词需要数量和语义都符合，不能只找最近的复数词。"], "T1": ["查表步骤：先找 lift one end of a box，再沿同一行找到 Workshop。", "易错提醒：选B；不要将不同行的用途和地点拼在一起。"], "T2": ["判断方法：展示开始时间和结束时间都必须落在9:35—9:55内。", "易错提醒：选B；只看结束早于离开还不够，还要能赶上开始。"], "T3": ["判断方法：AND连接两个必须同时达到的目标，不能满足一个就停止。", "易错提醒：选Ramp和Wheel两项；Lever不能替代连续上坡的通道。"], "W1": ["参考表达：A ramp is a simple machine. We can use it at a doorway. It helps us push a cart up the steps.", "检查清单：对象明确、地点合理、作用具体；单复数和动词形式一致。"], "E1": ["判断依据：use this ramp 后说明使用斜坡的目的，要用 to move。", "易错提醒：to 后面用 move 原形；不要只写 move，也不要写 moving。"], "E2": ["判断依据：同走20米，橙色16秒、紫色12秒，所以橙色更慢。", "易错提醒：than 表示比较；指定 slowly，完整填 more slowly 两个词。"], "E3": ["参考表达：A lever helps us lift one end of a heavy box.", "检查清单：换工具时也要换成对应作用；wheel移动、ramp上坡、lever抬起。"]};
function needsPaperNote(q,r){return true;}
function wasWrongForNote(q,r){return !!(r.hadMistake||r.first?.correct===false||(r.checked&&!r.correct)||r.teacher==='review'||(q.type==='match'&&Object.keys(state.match.errors).length));}
function paperNoteData(q){if(q.type==='match')return ['21项词汇：词义与辨认', ['辨认方法：具体物品看图片；抽象词看完整英文释义，不只找相同字母。',...vocab.map(([w,def,cn])=>w+'：'+cn+'；'+def),'易错对照：simple 简单的；basic 基本的；everyday 日常的；tiny 极小的。','动作短语：push down 是两个词；inside 表示在内部。']];if(q.type==='demo')return ['三种简单机械的原理',['观察方法：先预测运动方向，再播放验证。',...q.explain,'用途对照：lever 抬起；wheel 滚动；ramp 连接不同高度。','规范例句：A ramp helps us push a cart up to a higher doorway.']];const base=PAPER_NOTES[q.id]||[q.skill,q.explain];return [base[0],[...base[1],...(NOTE_DETAILS[q.id]||[])]];}
function paperNoteOpen(q,r){return r.noteOpen??(r.checked||r.correct||r.explain>0);}
function paperNoteHTML(q,r){if(!needsPaperNote(q,r))return '';const [title,lines]=paperNoteData(q),opened=paperNoteOpen(q,r);return `<section class="paper-note" id="paper-note" data-open="${opened}" aria-label="抄到纸本的笔记"><div class="paper-note-head"><div><p class="paper-eyebrow">✎ 抄到笔记本</p><h3>${esc(title)}</h3></div><button class="soft" data-action="paper-note">${opened?'收起':'展开'}抄记</button></div>${opened?`<p class="paper-instruction">${q.type==='match'?'完整词表供核对；今天不会的词优先抄写并朗读。':`本题共 ${lines.length} 条笔记，核对规则、依据和易错点后再抄。`}</p><ol>${lines.map(line=>`<li>${esc(line)}</li>`).join('')}</ol><label class="paper-check"><input type="checkbox" data-paper-done ${r.noteDone?'checked':''}>我已抄到笔记本</label><span class="paper-status">${r.noteDone?'已抄记 ✓':'待抄记'}</span>`:'<p class="paper-instruction">每题都有完整笔记。先独立作答，再展开核对；作答前看笔记会记为使用帮助。</p>'}</section>`;}
function paperNoteSummary(){const list=Q.filter(q=>needsPaperNote(q,rec(q.id)));if(!list.length)return '';const done=list.filter(q=>rec(q.id).noteDone).length;return `<section class="summary-card"><h2>纸本抄记清单 · ${done}/${list.length} 已抄</h2><p class="small-note">只勾选确实写进笔记本的题；抄记完成和答题正确分开记录。</p>${list.map(q=>`<div class="review-item"><span><b>${q.id}</b> · ${esc(paperNoteData(q)[0])}<small>${rec(q.id).noteDone?'已抄到笔记本':'待抄记'}</small></span><button class="soft" data-note-goto="${q.id}">${rec(q.id).noteDone?'查看笔记':'去抄记'}</button></div>`).join('')}</section>`;}
function revealPaperNote(){requestAnimationFrame(()=>{const target=$('#paper-note');if(!target)return;const footer=$('.footer').getBoundingClientRect().top;const overflow=target.getBoundingClientRect().bottom-footer+18;if(overflow>0)window.scrollBy({top:overflow,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});});}

function current(){return Q[state.index]||Q[0]}
function stats(){const evaluated=Q.filter(q=>!['demo','match'].includes(q.type));let independent=0,prompted=0,review=0,attempted=0;for(const q of evaluated){const r=state.records[q.id];if(!r?.first)continue;attempted++;if(r.teacher){if(r.first.correct&&!r.first.hinted)independent++;else if(r.teacher==='review')review++;else prompted++;}else if(r.first.correct&&!r.first.hinted)independent++;else if(r.correct)prompted++;else review++;}return {independent,prompted,review,attempted,total:evaluated.length};}
function topbar(){return `<header class="topbar"><button class="brand" data-action="home" aria-label="回到实验室首页">${svg('<rect x="14" y="18" width="49" height="43" rx="15" fill="#66d6c0"/><rect x="22" y="29" width="33" height="17" rx="8" fill="#eafff9"/><circle cx="32" cy="37" r="2"/><circle cx="46" cy="37" r="2"/><path d="M38 17V7m-7 0h14M31 53h15" fill="none"/>','0 0 78 72','Lab robot')}<span>发明小实验室<small>UNIT 5 · INVENTIONS</small></span></button><div class="top-tools"><button class="soft ${state.cn?'on':''}" data-action="cn" aria-pressed="${state.cn}">中文辅助 ${state.cn?'开':'关'}</button><button class="soft sound-button" data-action="sound" id="sound-button">🔊 试音</button><button class="soft" data-action="vocab">21词卡</button><button class="soft" data-action="oral-map">口头复习图</button><button class="soft desktop-only" data-action="fullscreen">全屏</button><button class="soft" data-action="summary">复习记录</button></div></header>`;}
function fitLesson(){if(state.view!=='lesson'||window.innerWidth<=760)return;const footer=$('.footer');if(!footer)return;const floor=footer.getBoundingClientRect().top;const answers=$('.evidence-open .answer-zone');if(answers)answers.style.maxHeight=Math.max(210,floor-answers.getBoundingClientRect().top-18)+'px';$$('.reading').forEach(el=>{el.style.maxHeight=Math.max(190,floor-el.getBoundingClientRect().top-18)+'px';const marked=el.querySelector('[data-ev-anchor]');const active=rec(current().id).basis?marked:el.querySelector('.blank.active');if(active){const offset=active.getBoundingClientRect().top-el.getBoundingClientRect().top;el.scrollTop=Math.max(0,el.scrollTop+offset-el.clientHeight*.36);}});}

function render(){const app=$('#app');app.innerHTML=`<div class="shell">${topbar()}${state.view==='home'?home():state.view==='summary'?summary():lesson()}</div>`;if(state.view==='lesson'){bindInputs();restoreDemo();requestAnimationFrame(()=>{fitLesson();drawEvidenceArrows();});}paintAudioState();document.title=state.view==='lesson'?`${current().id} · Unit 5 发明小实验室`:'Unit 5 · 发明小实验室';}
function home(){const s=stats();return `<main class="home"><section class="hero"><div class="hero-copy"><p class="eyebrow">LOOK · THINK · TRY</p><h1>Small machines.<br><span>Big ideas!</span></h1><p class="intro">How do inventions change our lives?<br>从一辆推不上台阶的小车开始，发现简单机械怎样让生活更轻松。</p><div class="hero-actions"><button class="primary" data-action="start">${state.seen.length?'继续上课':'进入实验室'} →</button><button class="secondary" data-action="menu">选择环节</button></div><p class="small-note" style="margin-top:14px">六上英语 Unit 5 · 45分钟复习<br>可自由跳题，按表现调整课堂节奏。</p></div><div class="hero-art">${art('hero')}<div class="art-sticker">Let's make it easier!</div></div></section><div class="path-title"><h2>今晚的学习路线</h2><span class="small-note">7个环节 · 教师掌握节奏</span></div><section class="stage-grid">${stages.map((s,i)=>`<button class="stage-card" data-stage="${i}"><span class="stage-num">${i+1}</span><h3>${s[0]}</h3><p>${s[2]}<br>${s[1]}</p></button>`).join('')}</section>${s.attempted?`<div class="flow-notes"><span>已作答 ${s.attempted} 题</span><span>首次独立答对 ${s.independent} 题</span><span>配对 ${state.match.everDone.filter(w=>pairs.includes(w)).length}/21 组</span></div>`:''}<div class="home-foot"><span>原创练习 · 结合已核对教材与试卷考查方式设计</span><span>内置27段MP3发音 · 点击喇叭播放 · 微信首次打开可先点“试音”。</span></div></main>`;}
function lesson(){const q=current(),r=rec(q.id),group=Q.filter(x=>x.stage===q.stage),n=group.indexOf(q)+1;return `<main class="lesson"><div class="progress-wrap"><div class="progress" role="progressbar" aria-label="已浏览页面" aria-valuenow="${state.seen.length}" aria-valuemin="0" aria-valuemax="${Q.length}"><span style="width:${state.seen.length/Q.length*100}%"></span></div><span class="progress-label">已浏览 ${state.seen.length}/${Q.length} 页 · 作答 ${stats().attempted} 题</span></div><div class="lesson-head"><span class="stage-tag">${q.stage+1} · ${stages[q.stage][0]}</span><span class="question-count">环节内 ${n}/${group.length} · ${stages[q.stage][1]}</span><button class="soft jump" data-action="menu">跳转环节 ☷</button></div><section class="question-card" aria-labelledby="qtitle"><div class="q-top"><span class="q-id">${q.id}</span><div class="q-heading"><h1 id="qtitle" tabindex="-1">${basisMarkup(q,r,q.title,'q')}</h1>${q.wordPrompt?`<p class="given-word"><span>指定用词</span><strong>${esc(q.wordPrompt)}</strong><span>请用它的适当形式</span></p>`:''}${q.instruction?`<p class="instruction">${esc(q.instruction)}</p>`:''}${state.cn&&q.cn?`<p class="cn">${esc(q.cn)}</p>`:''}</div></div>${basisToolbar(q,r)}${questionBody(q,r)}<div id="feedback">${feedback(q,r)}</div></section></main>${footer(q,r)}`;}
function visual(q,r){if(q.material==='story')return `<article class="reading"><h3>THE LIBRARY TRIP</h3>${story.map((s,i)=>`<span class="sentence">${r.evidence&&q.evidence.includes(i)?`<mark>${esc(s)}</mark>`:basisMarkup(q,r,s,'s'+i)}</span> `).join('')}</article>`;if(q.material==='dialogue')return `<article class="reading dialogue"><h3>AT THE SCIENCE CENTRE</h3>${dialogue.map(([who,s],line)=>{const m=s.match(/\{(\d)\}/);if(m){const no=+m[1];const old=state.records['U'+(no+2)];const txt=(no===q.blank?old?.checked&&old?.correct:old?.correct)?dialogOptions[[1,0,2][no-1]]:`${no}. ____`;s=`<span class="blank ${no===q.blank?'active':''}">${esc(txt)}</span>`;}else s=basisMarkup(q,r,s,'d'+line);return `<p class="dialogue-line"><b>${who}:</b> ${s}</p>`;}).join('')}</article>`;if(q.material==='table')return table(q,r);if(q.people)return `<div class="visual"><div class="data-board">${q.people.map(([name,time],i)=>`<div class="data-person">${svg(person(0,0,['#7fd466','#6fc6e8','#f6a3b1'][i]),'0 0 120 150',name)}<b>${name}</b><strong>${time}</strong></div>`).join('')}</div><p class="art-caption">Same school · Same day</p></div>`;if(q.robots||q.cars)return `<div class="visual"><div class="data-board">${(q.robots?[['Blue','8 s','#1cb0f6'],['Red','10 s','#ec8c94'],['Green','12 s','#58cc02']]:[['Orange','16 s','#f5a94f'],['Purple','12 s','#a596d4']]).map(([name,time,color])=>`<div class="data-person"><div style="margin:auto;width:58px;height:42px;background:${color};border:4px solid #344f5d;border-radius:14px;position:relative"><span style="position:absolute;left:8px;bottom:-12px;width:13px;height:13px;border-radius:50%;background:#344f5d"></span><span style="position:absolute;right:8px;bottom:-12px;width:13px;height:13px;border-radius:50%;background:#344f5d"></span></div><b style="margin-top:22px">${name}</b><strong>${time}</strong></div>`).join('')}</div><p class="art-caption">Same start · Same distance: ${q.robots?'10':'20'} m</p></div>`;if(q.art)return `<div class="visual">${art function table(q,r){const rows=r.evidence?q.evidence:[];const data=[['Library entrance','Ramp','Help a cart reach a higher doorway','9:20–9:30'],['Workshop','Lever','Lift one end of a box with a lever model','9:40–9:50'],['Transport corner','Wheel','See how wheels help a cart move','10:00–10:10']];return `<div><p class="eyebrow" style="margin-bottom:12px">SCIENCE FAIR · TODAY</p><div class="table-wrap"><table><thead><tr><th>Place / Machine</th><th>Purpose</th><th>Time</th></tr></thead><tbody>${data.map(([place,machine,purpose,time],i)=>`<tr class="${rows.includes(i)?'highlight':''}"><td><strong>${basisMarkup(q,r,machine,'t'+i+'-machine')}</strong>${basisMarkup(q,r,place,'t'+i+'-place')}</td><td>${basisMarkup(q,r,purpose,'t'+i+'-purpose')}</td><td class="table-time">${basisMarkup(q,r,time,'t'+i+'-time')}</td></tr>`).join('')}</tbody></table></div></div>`;}
function questionBody(q,r){if(q.type==='match')return matchHTML();if(q.type==='demo')return demoHTML();if(q.type==='writing')return writingHTML(r);const vis=visual(q,r);return `<div class="workspace ${vis?'':'single'} ${q.material?'reading-work':''} ${q.material&&r.basis?'evidence-open':''}">${vis}<div class="answer-zone">${basisNotes(q,r)}${q.context?`<p class="context-line">${esc(q.context)}</p>`:''}${q.type==='choice'||q.type==='multi'?optionsHTML(q,r):q.type==='text'?inputsHTML(q,r):openHTML(q,r)}${q.material?`<p class="basis-reminder">依据在原文里，点上方“看做题依据”逐步标出。</p>`:''}</div>${q.material?'<svg class="evidence-arrows" aria-hidden="true"></svg>':''}</div>`;}
function optionsHTML(q,r){const pictureGrid=['V2','U1','R1'].includes(q.id);return `${q.type==='multi'?`<p class="choice-hint">已选 ${(r.answer||[]).length}/${q.answer.length} 项 · 选齐后检查</p>`:''}<div class="option-list ${pictureGrid?'image-choice-grid':''}">${q.options.map((o,i)=>{const selected=q.type==='multi'?(r.answer||[]).includes(i):r.answer===i;const right=q.type==='multi'?q.answer.includes(i):q.answer===i;return `<div class="option-wrap ${r.basis>=3&&BASIS[q.id]?.reject[i]?'has-reason':''}" style="display:flex;gap:7px;align-items:stretch"><button class="option ${r.basis>=2&&(q.type==='multi'?q.answer.includes(i):q.answer===i)?'basis-answer':''} ${pictureGrid?'picture-option':''} ${selected?'selected':''} ${r.checked&&selected?(right?'correct':'wrong'):''}" data-option="${i}" aria-pressed="${selected}"><span class="option-key">${String.fromCharCode(65+i)}</span>${q.icons?`<span class="option-icon">${q.id==='R1'&&i===1&&r.basis>=2?art(q.icons[i],true).replace('</svg>','<path d="M367 285v-54h66v-54h140v108" fill="#ffc83d" fill-opacity=".23" stroke="#b78600" stroke-width="8" stroke-dasharray="12 7"/></svg>'):art(q.icons[i],true)}</span>`:''}<span>${basisMarkup(q,r,o,'o'+i,2)}</span></button>${q.speakOptions?`<button class="soft" data-speak="${esc(o)}" aria-label="朗读 ${esc(o)}">🔊</button>`:''}${r.basis>=3&&BASIS[q.id]?.reject[i]?`<p class="option-reason"><b>排除：</b>${esc(BASIS[q.id].reject[i])}</p>`:''}</div>`;}).join('')}</div>`;}
function inputsHTML(q,r){const a=Array.isArray(r.answer)?r.answer:[];return q.answers.map((accepted,i)=>`<label class="input-label" for="answer${i}">${q.answers.length>1?`空格 ${i+1}`:'Your answer'}</label><input class="answer-input" id="answer${i}" data-input="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(q.placeholder||'Type your answer …')}" value="${esc(a[i]||'')}">`).join('');}
function openHTML(q,r){return `<div class="teacher-prompt">先让学生说，再由老师按实际表现记录。<br>表达合理即可，不需要和示例一字不差。</div><label class="input-label" for="spoken-note">课堂记录（选填）</label><textarea class="answer-input" id="spoken-note" data-note rows="2" placeholder="可以记录学生说出的句子……">${esc(r.note||'')}</textarea>${assessmentHTML(r)}`;}
function assessmentHTML(r){return `<div class="assessment" aria-label="教师评价">${[['independent',(r.helpUsed||(current().type==='writing'&&state.support<2))?'完成（已用提示）':'独立完成'],['prompted','提示后完成'],['review','仍需复习']].map(([v,t])=>`<button class="soft ${r.teacher===v?'chosen':''}" data-assess="${v}" aria-pressed="${r.teacher===v}">${t}</button>`).join('')}</div>`;}
function wrongCue(q,r){if(nearMiss(q,r))return q.id==='K2B'?'“最慢”的关系判断对了；本题指定 slowly，最高级是 (the) most slowly。slow 才对应 slowest。':'“更慢”的比较关系判断对了；本题指定 slowly，所以用 more slowly。slow 才对应 slower。';if(q.id==='D1')return r.answer===1?'梯子方便人爬上去，但小车需要一条可以推上去的路。':'杠杆能抬起一端，但题目要给小车搭出一条倾斜的路。';const cues={D1:'小车需要一条能推上去的路，不能像人一样爬梯子。',D2:'先看谁先到，再看句子比较的是几个人。',K1:'这个词说明怎样操作，还是说明零件长什么样？',K2:'同样走10米，用时更多的是更快还是更慢？',K2B:'看 of the three，再找用时最长的机器人。',K3:'表中有三个人，但句子实际只比较 Ben 和 Coco。',K4:'这个空要说明按按钮的目的。',K5:'make the job … 说明工作变得怎样。',K6:'清单只有一处错，先核对数量和名词形式。',K7:'展品还是发明者？three 和 each 后的形式相同吗？',R2:'注意 every：门口的台阶也只靠轮子解决了吗？',R3:'回到完整句，看看 up 前面提到了什么障碍。',T2:'完整展示的开始和结束时间，都要落在停留时间内。',T3:'两个用途分别是什么？需要两种机械一起帮忙。'};if(q.id==='V3'||q.id==='V4')return '写完整单词，包含题目已经给出的首字母；再核对词义和数量。';return cues[q.id]||'回到题目里找依据；可以先用第一层提示，再试一次。';}
function feedback(q,r){let html='';if(r.checked){if(r.teacher){html+=`<div class="result ${r.teacher==='review'?'error':''}" role="status"><strong>${r.teacher==='independent'?(r.first?.hinted?'已记录：完成（使用过提示）':'已记录：独立完成'):r.teacher==='prompted'?'已记录：提示后完成':'已记录：仍需复习'}</strong></div>`;}else html+=`<div class="result ${r.correct?'':nearMiss(q,r)?'near-miss':'error'}" role="status"><strong>${r.correct?'Nice work! ✓':nearMiss(q,r)?'比较关系对了，调整一下词形。':'再看一看关键条件。'}</strong><br>${r.correct?(r.first?.correct&&!r.first?.hinted?'首次独立答对。': '这次完成了，保留首次作答记录。'):esc(wrongCue(q,r))}</div>`;}
if(r.hints)html+=`<div class="hint-box"><b>提示 ${Math.min(r.hints,q.hints.length)} / ${q.hints.length}</b>${esc(nearMiss(q,r)?(r.hints===1?'已经判断出比较关系了。接下来比较提示词 slow 和 slowly 的不同形式。':q.id==='K2B'?'slow → slowest；slowly → (the) most slowly。':'slow → slower；slowly → more slowly。'):q.hints[Math.min(r.hints,q.hints.length)-1])}</div>`;
if(r.explain){const lines=q.explain||[];html+=`<div class="explanation"><strong>一步步讲解 · ${Math.min(r.explain,lines.length)}/${lines.length}</strong>${lines.slice(0,r.explain).map((s,i)=>`<p>${i+1}. ${esc(s)}</p>`).join('')}${q.type==='open'?`<p><b>参考表达：</b>${esc(q.sample)}</p>`:''}</div>`;}return html+paperNoteHTML(q,r);}
function footer(q,r){const assess=['open','writing'].includes(q.type),interactive=['demo','match'].includes(q.type);const can=q.type==='text'?Array.isArray(r.answer)&&q.answers.every((_,i)=>r.answer[i]?.trim()):q.type==='multi'?Array.isArray(r.answer)&&r.answer.length===q.answer.length:r.answer!==null;return `<footer class="footer"><div class="footer-inner"><button class="secondary" data-action="prev" ${state.index===0?'disabled':''}>← 上题</button><button class="secondary" data-action="hint">提示${r.hints?` ${Math.min(r.hints,q.hints.length)}/${q.hints.length}`:''}</button><button class="secondary explain-btn" data-action="explain">${r.explain>=q.explain.length?'收起讲解':r.explain?'继续讲解':'讲解'}</button>${needsPaperNote(q,r)?'<button class="secondary" data-action="paper-note-jump">✎ 抄记</button>':''}<span class="foot-status">${state.review?'错题回看中':'题目可跳过，记录按实际作答统计'}</span><div class="right">${!assess&&!interactive?`<button class="primary blue" id="check" data-action="check" ${!can?'disabled':''}>检查</button>`:''}<button class="primary" data-action="next">${state.index===Q.length-1?'完成复习':'下一题 →'}</button></div></div></footer>`;}
function shuffle(a,seed){let n=seed;return [...a].map(v=>{n=(n*9301+49297)%233280;return {v,k:n};}).sort((a,b)=>a.k-b.k).map(x=>x.v);}

function demoHTML(){const prompts={lever:['按下杠杆的左端，另一端会怎样？','Push one end down. What happens to the other end?','The other end goes up. A lever can lift one side of a box.','另一端会上升。杠杆可以抬起箱子的一端。'],wheel:['轮子转动时，小车会怎样移动？','The wheels turn. How does the cart move?','The cart rolls along the floor. Wheels help us move heavy boxes.','小车沿地面滚动。轮子帮助我们移动重箱子。'],ramp:['门口比地面高，怎样用斜坡把小车推上去？','How does a ramp help the cart reach a higher doorway?','We can push the cart up the ramp. A ramp helps the cart reach the higher doorway.','沿着斜坡推小车，就能到达更高的门口。']};const [cn,en,sample,meaning]=prompts[state.demo],said=state.demoSpoken||{};return `<div class="demo-activity"><section class="demo-task"><span class="stage-tag">动画观察 · 口头回答</span><p class="demo-task-note">本页不用填空或选答案。请先说出预测，再播放验证，最后用英语说一句用途。</p><h2>${esc(cn)}</h2><p class="demo-question-en">${esc(en)}</p><ol class="demo-steps"><li>先口头预测</li><li>点“播放验证”看动画</li><li>说一句英语，完成后勾选</li></ol></section><div class="workspace demo-work"><div><div class="demo-tabs" aria-label="选择要观察的机械">${['lever','wheel','ramp'].map(v=>`<button class="soft ${state.demo===v?'active':''}" data-demo="${v}" aria-pressed="${state.demo===v}">${v}</button>`).join('')}</div><div class="visual" id="demo-visual">${art(state.demo==='wheel'?'wheel-cart':state.demo)}</div><div class="demo-controls"><button class="primary blue" data-action="demo-play">${demoPlaying?(demoPaused?'继续观察':'暂停动画'):'播放验证'}</button><button class="secondary" data-action="demo-reset">重播</button></div></div><section class="demo-speak"><p class="eyebrow">YOUR TURN · 口头说一说</p><h2>它怎样帮助我们？</h2><p>看完动画，试着用下面一个开头说完整：</p><p class="demo-sentence-frame">It can …<br>It helps us …<br>We use it to …</p><details class="demo-reference"><summary>我说完了，查看参考表达</summary><p>${esc(sample)}</p><p class="small-note">${esc(meaning)}</p><p class="small-note">意思合理、能说清用途即可，不必与参考句一字不差。</p></details><label class="paper-check"><input type="checkbox" data-demo-spoken ${said[state.demo]?'checked':''}>我已口头说出这种机械的用途</label><p id="demo-spoken-status" class="small-note">已勾选口述 ${['lever','wheel','ramp'].filter(v=>said[v]).length}/3 种 · 本页不计入答题正确率。</p></section></div></div>`;}
function restoreDemo(){const button=$('[data-action="demo-play"]');if(button)button.textContent=demoPlaying?(demoPaused?'继续观察':'暂停动画'):'播放验证';const v=$('#demo-visual');if(v){v.classList.toggle('is-playing',demoPlaying);v.classList.toggle('paused',demoPaused);}}
function writingHTML(r){const machine=state.machine,frames={ramp:['My favourite simple machine is the ramp.','We can see one at ____.','Without it, it is hard to ____.','With it, we can ____.','I like it because ____.'],wheel:['My favourite simple machine is the wheel.','We can see wheels on ____.','Without wheels, it is hard to ____.','With them, we can ____.','I like this simple machine because ____.'],lever:['My favourite simple machine is the lever.','We can see one in ____.','Without it, it is hard to ____.','With it, we can ____.','I like it because ____.']},draft=state.drafts[machine]||'';return `<div class="writing-layout"><div><div class="writing-options" aria-label="选择机械">${['ramp','wheel','lever'].map(x=>`<button class="soft ${machine===x?'selected':''}" data-machine="${x}">${x}</button>`).join('')}</div><div class="visual">${art(machine)}</div><div class="flow-notes"><span>What is it?</span><span>Where is it?</span><span>Without it?</span><span>With it?</span></div><div class="writing-frame">${state.support===0?frames[machine].map(s=>`<p>${esc(s)}</p>`).join(''):state.support===1?'<p><em>machine · place · problem · help · reason</em></p><p>without / with · help … do · use … to do · make … easier</p>':'<p>Look at your machine.<br>Tell visitors how it helps.</p>'}</div></div><div><div class="writing-options" aria-label="写作提示程度">${['完整句架','关键词','只看图'].map((x,i)=>`<button class="soft ${state.support===i?'selected':''}" data-support="${i}">${x}</button>`).join('')}</div><p class="writing-task">先口头说清4个要点，再写2–3句；句架按需使用。</p><div class="draft-label"><label for="draft">My exhibition label</label><span class="wordcount">${wordCount(draft)} words · <span class="saved">${storageOK?'已保存':'当前页面保留'}</span></span></div><textarea class="answer-input draft" id="draft" placeholder="先口头说，再写出2–3句……">${esc(draft)}</textarea><div class="rubric">${[['object','对象明确'],['help','用途具体'],['language','表达通顺']].map(([key,name])=>`<label><input type="checkbox" data-rubric="${key}" ${state.rubric[machine]?.[key]?'checked':''}>${name}</label>`).join('')}</div>${assessmentHTML(r)}<button class="soft" data-action="model" style="margin-top:14px">${r.model?'收起':'展开'}参考短文</button>${r.model?`<div class="explanation">${machine==='ramp'?'My favourite simple machine is the ramp. We can see one at our school entrance. There are steps at the door. Without the ramp, it is hard to push a cart inside. With it, we can move the cart up to the doorway. I like this simple machine because it helps people move things more easily.':machine==='wheel'?'My favourite simple machine is the wheel. We can see wheels on a cart. Without wheels, it is hard to move heavy books along the floor. With them, we can push the cart to the library. Wheels make moving things easier.':'My favourite simple machine is the lever. A seesaw in the playground works like a lever. When we push one end down, the other end goes up. We can also use a lever to lift one end of a heavy box. It helps us do the job more easily.'}</div>`:''}</div></div>`;}
function wordCount(s){return (s.trim().match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]).length;}
function bindInputs(){$$('[data-input]').forEach(el=>el.addEventListener('input',()=>{const r=rec(current().id);if(!Array.isArray(r.answer))r.answer=[];r.answer[+el.dataset.input]=el.value;r.checked=false;save();updateCheck();$('#feedback').innerHTML=feedback(current(),r);}));$('[data-note]')?.addEventListener('input',e=>{rec(current().id).note=e.target.value;save();});$('#draft')?.addEventListener('input',e=>{state.drafts[state.machine]=e.target.value;save();$('.wordcount').innerHTML=`${wordCount(e.target.value)} words · <span class="saved">${storageOK?'已保存':'当前页面保留'}</span>`;});}
function updateCheck(){const q=current(),r=rec(q.id);if($('#check'))$('#check').disabled=q.type==='text'?!q.answers.every((_,i)=>r.answer?.[i]?.trim()):q.type==='multi'?r.answer?.length!==q.answer.length:r.answer===null;}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g,' ').replace(/[.!?。！]$/,'');}
function check(){const q=current(),r=rec(q.id);let correct=false;if(q.type==='choice')correct=r.answer===q.answer;else if(q.type==='multi')correct=Array.isArray(r.answer)&&r.answer.length===q.answer.length&&q.answer.every(v=>r.answer.includes(v));else if(q.type==='text')correct=q.answers.every((opts,i)=>opts.some(a=>norm(a)===norm(r.answer?.[i])));else return;r.tries++;if(!correct)r.hadMistake=true;if(!r.first)r.first={answer:JSON.parse(JSON.stringify(r.answer)),correct,hinted:!!(r.helpUsed||r.hints>0||r.explain>0||r.evidence)};r.correct=correct;r.checked=true;save();render();revealFeedback();announce(correct?'答对了':'再看一看关键条件，可以重试。');}
function go(i){stopAudio();state.index=Math.max(0,Math.min(Q.length-1,i));state.view='lesson';const q=current();if(!state.seen.includes(q.id))state.seen.push(q.id);selectedWord=null;selectedPicture=null;flash=[];demoPlaying=false;demoPaused=false;closeModal(false);save();render();window.scrollTo({top:0,behavior:'instant'});$('#qtitle')?.focus({preventScroll:true});}
function prepareReview(id){const r=rec(id);r.answer=null;r.checked=false;r.hints=0;r.explain=0;r.evidence=false;r.model=false;r.teacher=null;r.basis=0;r.noteOpen=false;}
function reviewIds(){return Q.filter(q=>{const r=state.records[q.id];return r?.first&&(!r.first.correct||r.first.hinted||r.teacher==='review');}).map(q=>q.id);}
function next(){if(state.review){const ids=state.reviewQueue||reviewIds();const at=ids.indexOf(current().id);if(at>=0&&at<ids.length-1){prepareReview(ids[at+1]);go(Q.findIndex(q=>q.id===ids[at+1]));return;}state.review=false;state.view='summary';save();render();return;}if(state.index===Q.length-1){state.view='summary';save();render();window.scrollTo(0,0);}else go(state.index+1);}
function summary(){const s=stats(),ids=reviewIds(),wrongWords=Object.entries(state.match.errors).sort((a,b)=>b[1]-a[1]);const targets=Array.from(new Set(ids.map(id=>{const q=Q.find(q=>q.id===id),r=rec(id);return nearMiss(q,{answer:r.first?.answer})?'提示词变形：slow / slowly 的比较形式':q.skill;}))).slice(0,3);return `<main class="summary"><p class="eyebrow">TODAY'S LAB NOTES</p><h1>看看今晚学会了什么</h1><p class="summary-intro">已作答 ${s.attempted}/${s.total} 题 · 配对 ${state.match.everDone.filter(w=>pairs.includes(w)).length}/21 组。<br>统计保留首次作答；后续重试不会变成“首次独立答对”。</p><div class="stats"><div class="stat"><b>${s.independent}</b><span>首次独立完成</span></div><div class="stat"><b>${s.prompted}</b><span>订正或提示后完成</span></div><div class="stat"><b>${s.review}</b><span>当前仍需复习</span></div></div><section class="summary-card"><h2>下次优先回顾</h2>${targets.length?targets.map((x,i)=>`<p style="font-size:20px;line-height:1.9">${i+1}. ${esc(x)}</p>`).join(''):'<p class="empty">先完成几道题，再按真实作答情况确定复习重点。</p>'}${wrongWords.length?`<div class="flow-notes"><span>配对时出错的词</span>${wrongWords.map(([w,n])=>`<span>${esc(w)} · ${n}次</span>`).join('')}</div>`:''}</section>${paperNoteSummary()}${vocabularySummary()}<section class="summary-card"><h2>值得再做一次的题</h2>${ids.length?ids.map(id=>{const q=Q.find(x=>x.id===id),r=rec(id);return `<div class="review-item"><span><b>${id}</b> · ${esc(q.title)}<small>${r.first.correct?'首次完成前使用了帮助':'首次未独立完成'} · ${r.correct?'现已完成':'当前待巩固'}</small></span><button class="soft" data-goto="${id}">回看</button></div>`;}).join(''):'<p class="empty">目前没有需要回看的作答记录。未作答的题不会计为答对。</p>'}</section><div class="summary-actions"><button class="primary" data-action="review" ${!ids.length?'disabled':''}>回练这些题 →</button><button class="secondary" data-action="menu">选择其他题</button><button class="secondary" data-action="oral-map">单元思维导图</button><button class="secondary" data-action="micro">8题微练</button><button class="secondary" data-action="export">导出课堂记录</button><button class="secondary" data-action="reset">清空本机记录</button></div><p class="small-note" style="margin-top:18px">开放题由老师判断表达。词汇配对单独记录，不计入单题正确数。记录只保存在当前浏览器。</p></main>`;}

function spellingAction(action){const w=spellingWords()[state.spelling.index],r=spellingRec(w);if(action==='note'){if(!r.checked)r.hint=true;r.noteOpen=!(r.noteOpen??r.checked);save();spellingOpen();return;}if(action==='check'){if(!r.draft.trim())return;const correct=norm(r.draft)===norm(w);r.tries++;if(!r.first)r.first={answer:r.draft,correct,hinted:r.hint};r.correct=correct;r.checked=true;if(!correct)r.hadMistake=true;save();spellingOpen();return;}if(action==='hint'){r.hint=true;save();spellingOpen();return;}if(action==='next'){if(state.spelling.index===spellingWords().length-1){spellingProgressModal();return;}state.spelling.index++;}else if(action==='prev')state.spelling.index=Math.max(0,state.spelling.index-1);else if(action==='progress'){spellingProgressModal();return;}else if(action==='all'||action==='missed'){spellingOpen(action);return;}else if(action==='match'){state.review=false;go(Q.findIndex(q=>q.id==='V1'));return;}spellingOpen();}

function vocabularySummary(){return `<section class="summary-card"><h2>全单元21词练习</h2><p>词义配对：${state.match.everDone.filter(w=>pairs.includes(w)).length}/21 项已完成。</p>${spellingProgressHTML()}<div class="mini-links"><button class="primary" data-spell-action="all">练21词拼写</button><button class="soft" data-goto="V1">练21词配对</button></div></section>`;}
function matchPool(){return state.match.only?.length?state.match.only:pairs;}
function matchHTML(){const m=state.match,done=m.done,pool=matchPool(),pages=Math.ceil(pool.length/7);m.page=Math.min(m.page||0,pages-1);const remain=pool.slice(m.page*7,m.page*7+7),complete=remain.every(w=>done.includes(w)),defs=['invention','machine','playground','point','nature','simple','everyday','tiny','basic'];return `<div class="match-top"><span class="match-instruction">先点左边单词，再点右边图片或英文释义。</span><b>本轮 ${done.filter(w=>pool.includes(w)).length}/${pool.length}</b></div><div class="mini-links">${Array.from({length:pages},(_,i)=>`<button class="soft ${m.page===i?'on':''}" data-match-page="${i}" aria-pressed="${m.page===i}">第${i+1}组 · ${pool.slice(i*7,i*7+7).filter(w=>done.includes(w)).length}/${pool.slice(i*7,i*7+7).length}</button>`).join('')}</div><div class="match-message" role="status">${esc(matchMessage||'21项分3组练，每组7项；三组都完成才算全覆盖。')}</div><div class="match-board"><div class="match-side">${shuffle(remain,49+m.round).map(w=>`<button class="match-card ${done.includes(w)?'done':''} ${selectedWord===w?'selected':''} ${flash.includes(w)?'miss':''}" data-word="${esc(w)}" ${done.includes(w)?'disabled':''}>${esc(w)}</button>`).join('')}</div><div class="match-side">${shuffle(remain,131+m.round).map(w=>{const def=vocab.find(v=>v[0]===w)[1];return `<button class="match-card ${defs.includes(w)?'definition':''} ${done.includes(w)?'done':''} ${selectedPicture===w?'selected':''} ${flash.includes(w)?'miss':''}" data-picture="${esc(w)}" aria-label="${defs.includes(w)?esc(def):'图片 '+(pairs.indexOf(w)+1)}" ${done.includes(w)?'disabled':''}>${defs.includes(w)?esc(def):art(w==='inside'?'inside-box':w,true)}</button>`;}).join('')}</div></div>${complete?`<div class="result"><strong>本组配对完成 ✓</strong><div class="mini-links">${m.page<pages-1?`<button class="primary" data-match-page="${m.page+1}">练第${m.page+2}组</button>`:'<button class="primary" data-spell-action="all">接着练21词拼写</button>'}</div>${pool.every(w=>done.includes(w))?'<p>本轮所有词已配对完成！</p>':''}</div>`:''}<div class="mini-links"><button class="soft" data-action="match-reset">重练全部21项</button>${Object.keys(m.errors).length?'<button class="soft" data-action="match-missed">只练配错的词</button>':''}<button class="soft" data-spell-action="all">21词句中拼写</button><button class="soft" data-action="vocab">完整21词卡</button></div>`;}

const audioPlayer=$('#word-audio');
const audioState={word:'',phase:'idle',message:'',sequence:0,failedSequence:-1,watchdog:null};
let audioAlternate=null;
function audioSource(word){return AUDIO_EMBEDDED[word]||'audio/'+word.replace(/ /g,'-')+'.mp3';}
function paintAudioState(){
 const button=$('#sound-button');
 if(button){button.textContent=audioState.phase==='playing'?'🔊 播放中':audioState.phase==='loading'?'🔊 加载中':'🔊 试音';button.setAttribute('aria-label','声音设置与试音');}
 $$('[data-speak]').forEach(el=>{const active=el.dataset.speak===audioState.word&&audioState.phase==='playing';el.classList.toggle('audio-playing',active);el.setAttribute('aria-busy',String(el.dataset.speak===audioState.word&&audioState.phase==='loading'));});
 const status=$('#audio-live-status');if(status)status.textContent=audioState.message||'点播放器左边的三角，试听 now。';
}
function audioStatus(phase,message){audioState.phase=phase;audioState.message=message;paintAudioState();}
function stopAudio(){
 clearTimeout(audioState.watchdog);audioState.sequence++;
 audioPlayer.pause();if(audioAlternate)audioAlternate.pause();
 if(audioState.word)audioStatus('paused','已暂停：'+audioState.word);
}
function showAudioFallback(message){
 if(audioState.failedSequence===audioState.sequence)return;audioState.failedSequence=audioState.sequence;
 audioStatus('error',message);
 const panel=$('.modal-panel');
 if(panel){
  let box=$('#inline-audio-help');
  if(!box){box=document.createElement('section');box.id='inline-audio-help';box.className='audio-help';panel.insertBefore(box,panel.children[1]||null);}
  box.innerHTML=audioHelpHTML(message);wireNativeAudio();
 }else{soundModal(message);}
}
function audioHelpHTML(message){const word=audioState.word||'now';return `<p class="audio-guidance">${esc(message||'请点下方播放器的三角按钮，试听 '+word+'。')}</p><p class="audio-current-word">${esc(word)}</p><audio id="native-audio" controls preload="metadata" playsinline webkit-playsinline src="${esc(audioSource(word))}" aria-label="${esc(word)} 发音播放器"></audio><p id="audio-live-status" role="status" class="small-note">${esc(audioState.message||'点击三角开始播放。')}</p><div class="mini-links"><button class="soft" data-action="audio-stop">暂停</button><button class="soft" data-action="audio-retry">重新播放</button></div>`;}
function soundModal(message){
 if(audioPlayer&&!audioPlayer.paused)stopAudio();
 openModal(`<section class="audio-help">${audioHelpHTML(message)}</section><div class="audio-tips"><h3>微信里这样听</h3><p>1. 点上方播放器的三角按钮，或点“重新播放”。</p><p>2. 把手机的媒体音量调高；若连着蓝牙耳机，声音会从耳机播放。</p><p>3. 切回聊天再回来后，需要重新点一次播放。</p></div><p class="small-note">27段发音已随课堂提供，无需调用手机语音引擎。发音来源：有道词典英式发音，仅用于课堂学习。</p>`,'声音设置与试音');
 wireNativeAudio();
}
function wireNativeAudio(){
 const native=$('#native-audio');if(!native)return;
 if(audioAlternate&&audioAlternate!==native)audioAlternate.pause();audioAlternate=native;
 native.addEventListener('playing',()=>{audioPlayer.pause();audioStatus('playing','正在播放：'+(audioState.word||'now'));});
 native.addEventListener('ended',()=>audioStatus('ended','播放完成，可以继续点词卡。'));
 native.addEventListener('pause',()=>{if(!native.ended)audioStatus('paused','已暂停。点三角继续播放。');});
 native.addEventListener('error',()=>audioStatus('error','音频未加载成功，请检查网络后点“重新播放”。'));
}
function speak(text){
 const word=String(text).trim().toLowerCase();if(!AUDIO_WORDS.includes(word)){toast('这一项暂时没有录音。');return;}
 const sequence=++audioState.sequence;clearTimeout(audioState.watchdog);
 if(audioAlternate)audioAlternate.pause();audioPlayer.pause();audioState.word=word;
 audioStatus('loading','正在加载：'+word);
 const src=audioSource(word);if(audioPlayer.getAttribute('src')!==src)audioPlayer.src=src;else{try{audioPlayer.currentTime=0;}catch{}}
 audioPlayer.muted=false;audioPlayer.volume=1;audioPlayer.playbackRate=1;
 // Keep play() in this click handler: mobile WebViews require a direct user gesture.
 let promise;try{promise=audioPlayer.play();}catch(error){showAudioFallback('请再点下方播放器的三角按钮播放。');return;}
 if(promise&&typeof promise.catch==='function')promise.catch(error=>{
  if(sequence!==audioState.sequence||error.name==='AbortError')return;
  showAudioFallback(error.name==='NotAllowedError'?'微信或手机暂未允许声音，请亲手点下方播放器的三角按钮。':'音频未能播放，请用下方播放器重试。');
 });
 audioState.watchdog=setTimeout(()=>{if(sequence===audioState.sequence&&audioState.phase==='loading')showAudioFallback('音频加载较慢，请检查网络，或点下方三角按钮重试。');},7000);
}
audioPlayer.addEventListener('playing',()=>{clearTimeout(audioState.watchdog);audioStatus('playing','正在播放：'+audioState.word);});
audioPlayer.addEventListener('ended',()=>{clearTimeout(audioState.watchdog);audioStatus('ended','播放完成：'+audioState.word);});
audioPlayer.addEventListener('pause',()=>{if(!audioPlayer.ended&&audioState.phase==='playing')audioStatus('paused','已暂停：'+audioState.word);});
audioPlayer.addEventListener('error',()=>{clearTimeout(audioState.watchdog);if(audioState.word)showAudioFallback('音频加载失败，请检查网络后用下方播放器重试。');});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio();});
// Bridge readiness is used only for harmless preloading, never for autoplay.
document.addEventListener('WeixinJSBridgeReady',()=>{if(!audioState.word&&audioPlayer.paused){audioPlayer.src=audioSource('now');audioPlayer.load();}});

function matchClick(side,w){if(state.match.done.includes(w))return;if(side==='word'){selectedWord=w;matchMessage='已选 '+w+'，请找右边的图片或释义。';}else{selectedPicture=w;matchMessage='图片已选，请找左边的单词。';}if(selectedWord&&selectedPicture){if(selectedWord===selectedPicture){state.match.done.push(w);state.match.everDone=Array.from(new Set([...state.match.everDone,w]));matchMessage='配对成功，继续找下一组。';announce(`配对正确，${state.match.done.length}组`);selectedWord=null;selectedPicture=null;}else{const bad=selectedWord;state.match.errors[bad]=(state.match.errors[bad]||0)+1;state.match.firstClean=false;matchMessage='还没配上，再看看物体的形状、位置或动作。';flash=[selectedWord,selectedPicture];selectedWord=null;selectedPicture=null;announce('这两个还不匹配，再看图片或释义。');setTimeout(()=>{flash=[];if(state.view==='lesson'&&current().id==='V1')render();},650);}save();}render();}
function microModal(){openModal(`<p class="small-note" style="margin-bottom:15px">任选薄弱点加练；点击每题答案，再说明判断依据。此处不计入课堂首次作答统计。</p>${micro.map((x,i)=>`<details class="summary-card" style="margin:10px 0;padding:15px"><summary style="cursor:pointer;font-size:21px;line-height:1.5">${i+1}. ${esc(x.q)}</summary><p style="margin-top:12px;font-size:24px;color:#468d1b">${x.a}</p><p class="cn">${x.why}</p></details>`).join('')}`,'8题微练 · 按需使用');}
let sortedStory=[2,0,3,1];const sortTexts=['Use a cart to move the books.','Stop at the steps.','Put a ramp beside the steps.','Push the cart through the doorway.'];
function sortModal(){openModal(`<p class="small-note" style="margin-bottom:15px">根据刚才的短文还原事件，用上下箭头调整顺序。</p><div class="sort-list">${sortedStory.map((v,i)=>`<div class="sort-item"><b>${i+1}</b><span>${sortTexts[v]}</span><button data-sort="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="上移事件">↑</button><button data-sort="${i}" data-dir="1" ${i===3?'disabled':''} aria-label="下移事件">↓</button></div>`).join('')}</div><button class="primary blue" data-action="sort-check" style="margin-top:20px">检查顺序</button><div id="sort-result"></div>`,'故事事件排序');}
function exportNotes(){const s=stats(),data={unit:'Unit 5 · How do inventions change our lives?',date:new Date().toLocaleString('zh-CN'),statistics:s,words:state.match.errors,spelling:state.spelling.records,questions:Q.filter(q=>state.records[q.id]?.first).map(q=>({id:q.id,question:q.title,skill:q.skill,...state.records[q.id]})),writing:state.drafts};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Unit5-class-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el){if(e.target.matches('[data-backdrop]'))closeModal();return;}if(el.disabled)return;const d=el.dataset;if(d.mapAction){mapAction(d.mapAction);return;}if(d.mapMark){state.unitMap.marks[d.mapMark]=d.mapValue;const label=$('[data-map-mark-label="'+d.mapMark+'"]');if(label)label.textContent=d.mapValue==='yes'?'会说了 ✓':'需要再复习';save();mapStatus();return;}if(d.spellAction){spellingAction(d.spellAction);return;}if(d.spellWord){state.spelling.only=null;state.spelling.index=pairs.indexOf(d.spellWord);spellingOpen();return;}if(d.matchPage!==undefined){state.match.page=+d.matchPage;selectedWord=null;selectedPicture=null;flash=[];matchMessage='';save();render();return;}if(d.stage!==undefined){state.review=false;go(Q.findIndex(q=>q.stage===+d.stage));return;}if(d.noteGoto){state.review=false;const index=Q.findIndex(q=>q.id===d.noteGoto);if(!rec(d.noteGoto).checked)rec(d.noteGoto).helpUsed=true;rec(d.noteGoto).noteOpen=true;go(index);revealPaperNote();return;}if(d.goto){state.review=false;go(Q.findIndex(q=>q.id===d.goto));return;}if(d.speak){speak(d.speak);return;}if(d.word){matchClick('word',d.word);return;}if(d.picture){matchClick('picture',d.picture);return;}if(d.basis!==undefined){const r=rec(current().id);r.basis=+d.basis;r.helpUsed=true;r.evidence=false;save();render();return;}if(d.option!==undefined){const q=current(),r=rec(q.id),i=+d.option;if(q.type==='multi'){r.answer=Array.isArray(r.answer)?r.answer:[];if(!r.answer.includes(i)&&r.answer.length===q.answer.length){toast('这题选 '+q.answer.length+' 项；先取消一项，再换选项。');return;}r.answer=r.answer.includes(i)?r.answer.filter(v=>v!==i):[...r.answer,i];}else r.answer=i;r.checked=false;save();render();return;}if(d.assess){const r=rec(current().id);r.teacher=d.assess;if(d.assess==='review')r.hadMistake=true;r.correct=d.assess!=='review';r.checked=true;if(!r.first)r.first={answer:r.note||state.drafts[state.machine]||'',correct:d.assess==='independent',hinted:!!(r.helpUsed||r.hints>0||r.explain>0||r.model||(current().type==='writing'&&state.support<2)||d.assess==='prompted')};save();render();return;}if(d.demo){state.demo=d.demo;demoPlaying=false;demoPaused=false;save();render();return;}if(d.machine){state.machine=d.machine;save();render();return;}if(d.support!==undefined){state.support=+d.support;if(state.support<2)rec(current().id).helpUsed=true;save();render();return;}if(d.sort!==undefined){let i=+d.sort,j=i+(+d.dir);[sortedStory[i],sortedStory[j]]=[sortedStory[j],sortedStory[i]];sortModal();return;}const q=current(),r=rec(q.id);switch(d.action){case'home':state.view='home';state.review=false;save();render();window.scrollTo(0,0);break;case'start':go(state.index);break;case'cn':state.cn=!state.cn;save();render();if($('.word-grid'))vocabModal();break;case'menu':menu();break;case'close':closeModal();break;case'vocab':vocabModal();break;case'oral-map':oralMap();break;case'sound':soundModal();break;case'audio-stop':stopAudio();break;case'audio-retry':speak(audioState.word||'now');break;case'summary':state.view='summary';state.review=false;save();render();window.scrollTo(0,0);break;case'fullscreen':if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>toast('当前浏览器未允许全屏。'));else document.exitFullscreen?.();break;case'prev':go(state.index-1);break;case'next':next();break;case'check':check();break;case'paper-note-jump':if(!r.checked)r.helpUsed=true;r.noteOpen=true;save();render();revealPaperNote();break;case'paper-note':if(!r.checked)r.helpUsed=true;r.noteOpen=!paperNoteOpen(q,r);save();render();if(r.noteOpen)revealPaperNote();break;case'basis':r.basis=r.basis?0:1;if(r.basis)r.helpUsed=true;r.evidence=false;save();render();break;case'hint':r.helpUsed=true;r.hints=Math.min((r.hints||0)+1,q.hints.length);save();render();revealFeedback();break;case'explain':r.helpUsed=true;r.explain=r.explain>=q.explain.length?0:(r.explain||0)+1;save();render();revealFeedback();break;case'evidence':r.helpUsed=true;r.evidence=!r.evidence;save();render();requestAnimationFrame(()=>{$('.reading mark')?.scrollIntoView({block:'nearest'});});break;case'model':r.helpUsed=true;r.model=!r.model;save();render();break;case'demo-play':if(!demoPlaying){demoPlaying=true;demoPaused=false;}else demoPaused=!demoPaused;restoreDemo();el.textContent=demoPaused?'继续观察':'暂停动画';break;case'demo-reset':demoPlaying=false;demoPaused=false;restoreDemo();requestAnimationFrame(()=>{demoPlaying=true;restoreDemo();});break;case'match-reset':state.match.page=0;matchMessage='新一轮开始，已完成的历史记录保留。';state.match.done=[];state.match.only=null;state.match.round++;selectedWord=null;selectedPicture=null;save();render();break;case'match-missed':{state.match.page=0;matchMessage='只回练配错过的词，其他完成记录保留。';const words=Object.keys(state.match.errors);if(!words.length)return;state.match.only=words;state.match.done=state.match.done.filter(w=>!words.includes(w));state.match.round++;selectedWord=null;selectedPicture=null;save();go(Q.findIndex(q=>q.id==='V1'));break;}case'review':state.reviewQueue=reviewIds();state.review=true;prepareReview(state.reviewQueue[0]);go(Q.findIndex(q=>q.id===state.reviewQueue[0]));break;case'micro':microModal();break;case'story-sort':sortModal();break;case'sort-check':$('#sort-result').innerHTML=`<div class="result ${sortedStory.every((v,i)=>v===i)?'':'error'}">${sortedStory.every((v,i)=>v===i)?'顺序正确！再用 First / Then / Finally 说一遍。':'再想想：先在哪儿遇到困难，接着怎样解决？'}</div>`;break;case'export':exportNotes();break;case'reset':openModal('<p style="font-size:20px;line-height:1.8">清空后，本浏览器的答题、错词和写作草稿都会删除。</p><div class="mini-links"><button class="secondary" data-action="close">保留记录</button><button class="primary" data-action="confirm-reset">确认清空</button></div>','清空本机记录？');break;case'confirm-reset':try{localStorage.removeItem(KEY);}catch(e){}location.reload();break;}});
document.addEventListener('change',e=>{if(e.target.matches('[data-demo-spoken]')){state.demoSpoken ||= {};state.demoSpoken[state.demo]=e.target.checked;save();const status=$('#demo-spoken-status');if(status)status.textContent='已勾选口述 '+['lever','wheel','ramp'].filter(v=>state.demoSpoken[v]).length+'/3 种 · 本页不计入答题正确率。';return;}if(e.target.matches('[data-spell-note]')){spellingRec(spellingWords()[state.spelling.index]).noteDone=e.target.checked;save();return;}if(e.target.matches('[data-paper-done]')){rec(current().id).noteDone=e.target.checked;save();render();return;}if(e.target.matches('[data-rubric]')){state.rubric[state.machine] ||= {};state.rubric[state.machine][e.target.dataset.rubric]=e.target.checked;save();}});
document.addEventListener('keydown',e=>{if($('.modal')){if(e.key==='Enter'&&e.target.id==='spell-answer'){e.preventDefault();spellingAction('check');return;}if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const items=$$('button:not(:disabled),a,input,textarea,select,summary,audio[controls]',$('.modal'));const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(state.view!=='lesson'||/TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='Enter'&&e.target.matches('[data-input]')){e.preventDefault();if(!$('#check')?.disabled)check();}if(e.key==='ArrowRight'&&e.altKey){e.preventDefault();next();}if(e.key==='ArrowLeft'&&e.altKey){e.preventDefault();go(state.index-1);}});
if(!Q[state.index])state.index=0;if(state.view==='lesson'&&!state.seen.includes(current().id))state.seen.push(current().id);render();
