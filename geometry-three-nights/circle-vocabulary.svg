<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 810" role="img" aria-label="圆的要素综合识别图：圆O、直径AB、弦CD、垂线段OM、圆上点T、相交直线m、相切直线l、相离直线n、圆心到n的垂足H，以及点N和P"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#193548}.v-title{font-size:28px;font-weight:700}.v-letter{font-size:27px;font-weight:700;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.v-note{font-size:21px}.base{stroke:#176fc2;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.inner{stroke:#66839b;stroke-width:2.8}.aux{stroke:#b8671b;stroke-dasharray:10 7;stroke-width:3}.right{stroke:#b8671b;stroke-width:3;fill:none}.angle{stroke:#459331;stroke-width:3;fill:none}.highlight{stroke:#e58d16;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.85}.highlight .spot{stroke-width:5;fill:#fff0c4}.highlight .area{fill:#f5b84b;fill-opacity:.38;stroke-width:4}.dots{fill:#193548;stroke:white;stroke-width:2}.v-small{font-size:20px;fill:#526a79}</style><rect width="920" height="810" rx="20" fill="white"/><text x="460" y="47" text-anchor="middle" class="v-title">圆的要素综合识别图</text><text x="460" y="83" text-anchor="middle" class="v-small">先指图说名称，再用字母写出对象</text><g transform="translate(0,80)"><g class="base"><circle cx="430" cy="370" r="240"/><path d="M70 50 H850 M70 130 H850 M70 370 H850"/><path class="" d="M292.34 173.40 L292.34 566.60"/><path class="inner" d="M430.00 370.00 L292.34 173.40"/><path class="inner" d="M430.00 370.00 L292.34 566.60"/><path class="inner" d="M670.00 370.00 L292.34 173.40"/><path class="inner" d="M670.00 370.00 L292.34 566.60"/><path class="inner" d="M430.00 370.00 L430.00 130.00"/><path class="aux" d="M430.00 130.00 L430.00 50.00"/><path class="aux" d="M430.00 370.00 L292.34 370.00"/><path class="right" d="M306.34165527574896 370 v-14 h-14 M430 144 h14 v-14 M430 64 h14 v-14"/></g><path class="angle" d="M404.19 333.14 A45 45 0 0 0 404.19 406.86 M621.21 344.60 A55 55 0 0 0 621.21 395.40"/><g class="highlight"></g><