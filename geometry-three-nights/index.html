 "OB是直角三角形ABC斜边上的中线，所以OB＝AC/2。由OB＝2得AC＝4，BC＝2。", "why": "直角与斜边中点条件均已满足"}, {"title": "勾股求出AB", "body": "在Rt△ABC中，AB²＝AC²－BC²＝4²－2²＝12，所以AB＝2√3。", "why": "勾股定理"}], "answer": "（1）以A为圆心、BC长为半径作弧，与AC交于O，连接OB。（2）AB＝2√3。", "pitfall": "不能仅因为图上O看着在中间就认定为中点；必须先由AO＝BC＝AC/2证明。", "diagram": {"points": {"A": [0, 0], "B": [3.4641016151, 0], "C": [3.4641016151, 2], "O": [1.7320508076, 1, 5, -10, "aux"]}, "edges": [["A", "B"], ["B", "C"], ["C", "A"]], "aux": [["O", "B"]], "right": [{"p": ["A", "B", "C"]}], "labels": [{"at": [0.7, 0.15], "text": "30°"}]}, "presentation": "按原题数学条件整理，几何图按题意重绘。"}, {"id": "practice-bisector-ratio", "day": 0, "type": "practice", "title": "角平分线为什么能列边比？", "tags": ["角平分线定理", "面积推导"], "stem": ["△ABC中，AB＝8，AC＝12，BC＝15。AD平分∠BAC，D在线段BC上。"], "asks": ["先用面积关系说明BD/DC＝AB/AC。", "求BD、DC。"], "hint": ["从D向AB、AC分别作垂线，垂线段的长有什么关系？", "同样两个三角形，换一组底和高表示面积。"], "steps": [{"title": "用等距建立第一组面积比", "body": "过D作DM⊥AB、DN⊥AC。D在角平分线上，所以DM＝DN。于是S△ABD/S△ACD＝AB/AC。", "why": "角平分线等距性质；三角形面积公式。"}, {"title": "用公共高建立第二组面积比", "body": "若改选BD、DC为底，△ABD和△ACD从A到BC的高相同，所以S△ABD/S△ACD＝BD/DC。两式相等，得BD/DC＝AB/AC。", "why": "同高三角形面积比等于底边比。"}, {"title": "由比与总长求两段", "body": "BD:DC＝8:12＝2:3，且BD＋DC＝15。设BD＝2k、DC＝3k，则5k＝15，k＝3。", "why": "比值关系与线段和。"}], "answer": "BD＝6，DC＝9。", "pitfall": "角平分线一般不平分对边；列比例前核对相邻边与对边分段的对应顺序。", "diagram": {"points": {"A": [4.833333333333333, 6.374863832968426, -10, -12], "B": [0, 0, -20, 23], "C": [15, 0, 9, 23], "D": [6, 0, -5, 24], "M": [2.1901041666666665, 2.888610174313818, -25, -3, "aux"], "N": [8.539930555555555, 4.050694727198687, 10, -3, "aux"]}, "edges": [["A", "B"], ["B", "C"], ["C", "A"], ["A", "D"]], "aux": [["D", "M"], ["D", "N"]], "labels": [{"at": [1.7666666666666666, 3.187431916484213], "text": "8"}, {"at": [10.516666666666666, 3.187431916484213], "text": "12"}, {"at": [6.7, -0.8], "text": "BC＝15"}]}, "time": "10分钟", "difficulty": "基础应用"}, {"id": "exam-suzhou-2024-20", "day": 0, "type": "exam", "title": "从作弧痕迹到等长与垂直", "year": 2024, "region": "江苏省苏州市", "number": "第20题", "source": "https://zhekaotong.cn/papers/bee12752-4920-4599-b05e-e86af5c34088", "tags": ["等腰三角形", "垂直平分线", "三线合一", "30°直角三角形", "全等作为工具"], "difficulty": "中等", "time": "10分钟", "stem": ["△ABC中AB＝AC。以B、C为圆心，用相同且大于BC一半的半径作弧，两弧交于D；连接BD、CD、AD，AD与BC交于E。"], "asks": ["证明△ABD≌△ACD。", "已知BD＝2，∠BDC＝120°，求BC。"], "hint": ["作弧能直接给哪一组等长？A和D到B、C均等距，又能说明AD是什么直线？"], "steps": [{"title": "从作弧提取等长", "body": "由等半径作弧可知BD＝CD。", "why": "同一半径作弧"}, {"title": "组织三边全等", "body": "在△ABD与△ACD中，AB＝AC、BD＝CD、AD＝AD，所以△ABD≌△ACD（SSS）。", "why": "SSS"}, {"title": "两点等距确定中垂线", "body": "由AB＝AC与DB＝DC可知，A、D都在线段BC的垂直平分线上；所以AD垂直平分BC，即DE⊥BC且BE＝CE。", "why": "垂直平分线判定"}, {"title": "高平分等腰顶角", "body": "△BDC为等腰三角形，DE是底边BC上的高，因此DE也平分顶角∠BDC。故∠BDE＝60°，∠DBE＝30°。", "why": "等腰三角形三线合一"}, {"title": "30°确定短直角边", "body": "Rt△BDE中，BD＝2，30°所对直角边DE＝BD/2＝1。", "why": "30°直角三角形性质"}, {"title": "勾股后还原整边", "body": "由勾股定理，BE＝√(BD²－DE²)＝√3。因此BC＝2BE＝2√3。", "why": "BE＝CE；勾股定理"}], "answer": "（1）△ABD≌△ACD（SSS）；（2）BC＝2√3。", "pitfall": "第二问的60°应由等腰三角形的高平分顶角推出；不能看到一条中间线就直接把120°除以2。", "diagram": {"points": {"A": [0, 3], "B": [-1.7320508076, 0], "C": [1.7320508076, 0], "D": [0, -1, 4, 27], "E": [0, 0, 8, -7]}, "edges": [["A", "B"], ["B", "C"], ["C", "A"], ["B", "D"], ["C", "D"], ["A", "D"]], "aux": [], "equal": [["A", "B", 1], ["A", "C", 1], ["B", "D", 2], ["C", "D", 2]], "labels": [{"at": [0, -0.75], "text": "120°", "dx": 10, "dy": -4}]}, "presentation": "按原题数学条件整理，几何图按题意重绘。"}, {"id": "exam-meishan-2024-07", "day": 0, "type": "exam", "title": "不分别求两段，能求周长吗？", "year": 2024, "region": "四川省眉山市", "number": "第7题", "source": "https://kaosj.com/papers/2024/07/2024-zhongkao-math-sichuan-meishan-a180d803ce-paper/", "tags": ["垂直平分线", "尺规作图痕迹", "线段长度转移", "周长"], "difficulty": "基础至中等", "time": "10分钟", "stem": ["△ABC中AB＝AC＝6，BC＝4。以A、B为圆心，用同一半径作相交圆弧，交点为E、F；直线EF交AC于D，连接BD。"], "asks": ["求△BCD的周长，并说明作图痕迹起了什么作用。"], "hint": ["不要先求BD和CD各有多长。先看看作图痕迹给了哪一组等长，再把周长中的两段拼成整边。"], "steps": [{"title": "识别作图的中垂线", "body": "从两端点等半径作弧的痕迹可知，直线EF是线段AB的垂直平分线。", "why": "两端点等半径相交弧"}, {"title": "把BD转成AD", "body": "D在EF上，所以DA＝DB。", "why": "垂直平分线性质"}, {"title": "重组目标周长", "body": "△BCD的周长为BD＋DC＋BC。用等长DA替换BD，得到DA＋DC＋BC。", "why": "等量替换"}, {"title": "两段拼成一条整边", "body": "D在线段AC上，因此DA＋DC＝AC。故周长＝AC＋BC＝6＋4＝10。", "why": "D在线段AC内部"}], "answer": "C，周长为10。", "pitfall": "只能在D在线段AC上时直接写AD＋DC＝AC；还要先说明EF为什么是中垂线。", "diagram": {"points": {"A": [0, 5.6568542495], "B": [-2, 0], "C": [2, 0], "D": [1.2857142857, 2.0203050891], "E": [-3.4944382578, 3.7103442284], "F": [1.4944382578, 1.9465100211]}, "edges": [["A", "B"], ["B", "C"], ["C", "A"], ["B", "D"], ["E", "F"]], "aux": [], "labels": [{"at": [-1.2, 3.6], "text": "6"}, {"at": [1.6, 3.7], "text": "6"}, {"at": [-0.2, -0.7], "text": "4"}]}, "presentation": "原选择题改为解释周长的问答题，原数值条件保留。"}, {"id": "practice-triangle-exit", "day": 0, "type": "practice", "title": "独立检验：中线何时也是高？", "tags": ["等腰三角形", "三线合一", "证明后计算"], "stem": ["△ABC中，AB＝AC＝10，BC＝12，D是BC的中点。"], "asks": ["证明AD⊥BC，且AD平分∠BAC。", "求AD和△ABC的面积。"], "hint": ["先找两侧三角形的三组对应边。", "全等得到两个相等的邻补角后，角度是多少？"], "steps": [{"title": "由三边对应相等组织全等", "body": "AB＝AC、BD＝DC、AD＝AD，所以△ABD≌△ACD（SSS）。", "why": "题设等腰与中点，公共边。"}, {"title": "由等角得到垂直与角平分", "body": "全等给出∠BAD＝∠CAD，故AD平分∠BAC；也给出∠ADB＝∠ADC。两角和为180°，所以各为90°，即AD⊥BC。", "why": "全等性质；B、D、C共线。"}, {"title": "证明后计算", "body": "BD＝6。在Rt△ABD中，AD²＝10²－6²＝64，所以AD＝8。S△ABC＝12×8÷2＝48。", "why": "勾股定理；三角形面积公式。"}], "answer": "AD⊥BC，AD平分顶角；AD＝8，S△ABC＝48。", "pitfall": "等腰、中点条件都用上后才有三线合一，不能仅凭AD是中线就说它是高。", "diagram": {"points": {"A": [0, 8, -8, -14], "B": [-6, 0, -22, 22], "C": [6, 0, 10, 22], "D": [0, 0, -6, 24]}, "edges": [["A", "B"], ["B", "C"], ["C", "A"], ["A", "D"]], "aux": [], "equal": [["A", "B", 1], ["A", "C", 1], ["B", "D", 2], ["D", "C", 2]], "labels": [{"at": [-3.5, 4.4], "text": "10"}, {"at": [3.2, 4.4], "text": "10"}, {"at": [-1, -0.8], "text": "BC＝12"}]}, "time": "10分钟", "difficulty": "基础应用"}, {"id": "practice-quad-check", "day": 1, "type": "practice", "title": "先判图形，再使用性质", "tags": ["四边形判定", "缺少前提"], "stem": ["分别判断下面三个说法。可用反例说明错误，也可补一个足够的前提。"], "asks": ["任意四边形的两条对角线相等，它一定是矩形。", "任意四边形的两条对角线垂直，它一定是菱形。", "一组对边平行且相等的四边形，一定是平行四边形。"], "hint": ["前两句若先知道它是平行四边形，结论会怎样？", "第三句中的平行与相等必须指同一组对边。"], "steps": [{"title": "相等不够判矩形", "body": "等腰梯形也可以有相等的对角线。若补“该四边形是平行四边形”，对角线相等才足以判为矩形。", "why": "矩形判定要核对适用前提。"}, {"title": "垂直不够判菱形", "body": "对角线互相垂直但不互相平分的风筝形可以不是菱形。补平行四边形前提后，可用垂直对角线判菱形。", "why": "菱形判定的前提。"}, {"title": "同一组对边同时满足", "body": "第三句正确。连接一条对角线，可用SAS证明两三角形全等，得到另一组对边平行，故为平行四边形。", "why": "全等应用；平行线判定；平行四边形定义。"}], "answer": "①错误；②错误；③正确。", "pitfall": "先分清已知形状与待证形状；未证明矩形或菱形前，不能先用它们的专属性质。", "diagram": {"points": {"A": [-3, 3, -20, -10], "B": [3, 3, 8, -10], "C": [5, 0, 8, 22], "D": [-5, 0, -25, 22]}, "edges": [["A", "B"], ["B", "C"], ["C", "D"], ["D", "A"]], "aux": [["A", "C"], ["B", "D"]], "labels": [{"at": [-1.7, 1.4], "text": "等腰梯形"}]}, "time": "6分钟", "difficulty": "基础应用"}, {"id": "exam-cqb2024-21", "day": 1, "type": "exam", "title": "矩形中的中垂线与菱形", "year": 2024, "region": "重庆B卷", "number": "第21题", "source": "https://kaosj.com/papers/2024/07/2024-zhongkao-math-chongqing-1ecbaa81ce-paper/", "tags": ["垂直平分线", "全等应用", "菱形判定", "证明填空"], "difficulty": "中等应用", "time": "12分钟", "stem": ["矩形ABCD中，O为对角线AC的中点。过O作AC的垂线，分别交AB、CD于E、F；连接AF、CE。"], "asks": ["证明四边形AECF为菱形。", "选做：原矩形改为平行四边形，且上述交点仍存在时，结论是否仍成立？"], "hint": ["题目先让你补出全等，最终却要证菱形：全等会给哪一组对角线被平分？", "平行四边形的对角线互相平分；菱形还需要再增加什么？"], "steps": [{"title": "由平行找对应角", "body": "AB∥CD，EF作截线，所以∠CFO＝∠AEO；AC作截线，所以∠OCF＝∠OAE。", "why": "平行线的内错角相等"}, {"title": "补齐全等条件", "body": "O是AC的中点，故CO＝AO。由两角和一组对应边，△CFO≌△AEO（AAS）。", "why": "O为AC中点；AAS"}, {"title": "对角线互相平分", "body": "由全等得FO＝EO。故四边形AECF的两条对角线AC、EF互相平分，所以AECF是平行四边形。", "why": "全等性质；平行四边形判定"}, {"title": "垂直对角线判菱形", "body": "又EF⊥AC，对角线互相垂直的平行四边形是菱形，所以AECF是菱形。", "why": "菱形判定的平行四边形前提"}, {"title": "检查延伸情形", "body": "把原矩形改成平行四边形，AB∥CD仍成立，以上证明仍可进行，故猜想成立（须保留题设中的交点存在条件）。", "why": "相交条件与两组对边平行仍成立"}], "answer": "（1）四边形AECF是菱形；（2）原图改为平行四边形且上述交点存在时，结论仍成立。", "pitfall": "四边形顺序是AECF，AC与EF才是它的两条对角线。；仅有对角线垂直不能判任意四边形为菱形，必须先证明平行四边形。；延伸猜想不是所有垂线一定交边内；保留图中相交条件。", "diagram": {"points": {"A": [0, 4], "B": [8, 4], "C": [8, 0], "D": [0, 0], "O": [4, 2], "E": [5, 4], "F": [3, 0]}, "edges": [["A", "B"], ["B", "C"], ["C", "D"], ["D", "A"], ["A", "C"], ["E", "F"], ["A", "F"], ["C", "E"]], "aux": [], "right": [{"p": ["A", "O", "E"]}], "equal": [["A", "O", 1], ["O", "C", 1]]}, "presentation": "原题为尺规作图与证明填空；此处整理条件，调整为完整证明及延伸问答。"}, {"id": "exam-bj2025-20", "day": 1, "type": "exam", "title": "中位线连接矩形证明", "year": 2025, "region": "北京", "number": "第20题", "source": "https://zy.21cnjy.com/23366730", "tags": ["三角形中位线", "矩形判定", "作高", "勾股定理"], "difficulty": "中等应用", "time": "14分钟", "stem": ["D、E分别为△ABC的AB、AC中点。从D向BC作垂线，垂足为F；G在DE的延长线上，且DG＝FC。"], "asks": ["证明四边形DFCG是矩形。", "若∠B＝45°，DF＝3，DG＝5，求BC、AC。"], "hint": ["先看D、E这两个中点能给哪一条平行关系。", "证明矩形可以先证明平行四边形，再补一个直角。", "第二问可过A作BC上的高；中点让这条高与DF形成2倍关系。"], "steps": [{"title": "两中点给平行", "body": "（1）D、E分别为AB、AC中点，所以DE是△ABC的中位线，DE∥BC。", "why": "三角形中位线定理"}, {"title": "先证平行四边形", "body": "G在DE的延长线上，故DG∥FC；又DG＝FC，所以四边形DFCG是平行四边形。", "why": "一组对边平行且相等"}, {"title": "再补一个直角", "body": "DF⊥BC，所以∠DFC＝90°。有一个角是直角的平行四边形是矩形，因此DFCG是矩形。", "why": "矩形判定"}, {"title": "用45°求底边", "body": "（2）DG＝FC＝5。在Rt△BDF中，∠DBF＝45°，所以BF＝DF＝3，故BC＝BF＋FC＝8。", "why": "等腰直角三角形"}, {"title": "作高建立两倍关系", "body": "过A作AH⊥BC于H。DF∥AH，且D是AB中点，所以△BDF∽△BAH，相似比BD:BA＝1:2，得BH＝2BF＝6，AH＝2DF＝6。也可应用三角形中位线。", "why": "中位线或相似应用"}, {"title": "勾股求AC", "body": "由原图位置H在BC上，CH＝BC－BH＝2。在Rt△AHC中，AC²＝AH²＋CH²＝36＋4＝40，所以AC＝2√10。", "why": "先确认CH＝BC－BH"}], "answer": "（1）四边形DFCG是矩形；（2）BC＝8，AC＝2√10。", "pitfall": "不要未证矩形就直接使用矩形性质。；G不是DE的中点；DG等于FC，而不是DE等于FC。；求AC时的直角三角形是AHC，水平直角边是CH＝2。", "diagram": {"points": {"A": [6, 6], "B": [0, 0], "C": [8, 0], "D": [3, 3, -26, 0], "E": [7, 3, -12, -12], "F": [3, 0], "G": [8, 3, 10, -9], "H": [6, 0, -10, 25, "aux"]}, "edges": [["A", "B"], ["A", "C"], ["B", "C"], ["D", "G"], ["D", "F"], ["C", "G"]], "aux": [["A", "H"]], "right": [{"p": ["D", "F", "B"]}, {"p": ["A", "H", "B"], "aux": true}]}, "presentation": "按原题数学条件整理，几何图按题意重绘。"}, {"id": "practice-double-median", "day": 1, "type": "practice", "title": "为什么要把中线延长一倍？", "tags": ["倍长中线", "构造全等", "线段转移"], "stem": ["△ABC中，D是BC的中点。延长AD至E，使DE＝AD，连接BE。"], "asks": ["证明BE＝AC。", "进一步证明2AD＜AB＋AC，并说明辅助线起了什么作用。"], "hint": ["△BDE和△CDA有哪些对应条件？", "把2AD看成哪一条完整线段？"], "steps": [{"title": "新增等长配合原中点", "body": "BD＝DC，DE＝DA。直线BC与AE相交于D，所以∠BDE＝∠CDA。", "why": "中点；辅助线作法；对顶角。"}, {"title": "用全等转移长度", "body": "△BDE≌△CDA（SAS），因此BE＝AC。", "why": "两边及其夹角对应相等。"}, {"title": "把目标放进一个三角形", "body": "AE＝AD＋DE＝2AD。在△ABE中，AE＜AB＋BE；代入BE＝AC，得2AD＜AB＋AC。", "why": "三角形任意两边之和大于第三边。"}], "answer": "BE＝AC；2AD＜AB＋AC。倍长把中线和分散的边转移到△ABE中。", "pitfall": "不要见中点就机械倍长；应先看目标是否需要把长度转移到同一个三角形。", "diagram": {"points": {"A": [-1, 5, -12, -12], "B": [-4, 0, -23, 20], "C": [4, 0, 10, 20], "D": [0, 0, 10, -5], "E": [1, -5, 10, 21, "aux"]}, "edges": [["A", "B"], ["B", "C"], ["C", "A"], ["A", "D"]], "aux": [["D", "E"], ["B", "E"]], "equal": [["B", "D", 1], ["D", "C", 1]]}, "time": "8分钟", "difficulty": "基础应用"}, {"id": "exam-yn2024-24", "day": 1, "type": "exam", "title": "中点四边形反推菱形", "year": 2024, "region": "云南", "number": "第24题", "source": "https://kaosj.com/papers/2024/07/2024-zhongkao-math-yunnan-f120a2e6b5-paper/", "tags": ["三角形中位线", "菱形判定", "面积", "完全平方公式"], "difficulty": "中等应用", "time": "15分钟", "stem": ["四边形ABCD满足AB∥CD、AD∥BC。E、F、G、H依次是AB、BC、CD、DA的中点，且EFGH为矩形。"], "asks": ["证明ABCD是菱形。", "若矩形EFGH周长为22，ABCD面积为10，求AB。"], "hint": ["观察中点小矩形的边分别平行于原图哪两条线。", "第二问不必分别求出两条对角线；先求它们的和与积，再求平方和。"], "steps": [{"title": "确认外层图形", "body": "AB∥CD，AD∥BC，所以ABCD是平行四边形。连接AC、BD交于O。", "why": "两组对边平行"}, {"title": "中位线连接第一条对角线", "body": "H、G分别是AD、CD的中点，所以HG是△ADC的中位线，HG∥AC，HG＝AC/2。", "why": "三角形中位线定理"}, {"title": "中位线连接第二条对角线", "body": "F、G分别是BC、CD的中点，所以FG是△BCD的中位线，FG∥BD，FG＝BD/2。", "why": "三角形中位线定理"}, {"title": "把小矩形的垂直传出去", "body": "EFGH是矩形，所以HG⊥FG。结合两组平行关系得AC⊥BD。对角线互相垂直的平行四边形是菱形，故ABCD是菱形。", "why": "平行关系与菱形判定"}, {"title": "周长转成对角线的和", "body": "（2）矩形EFGH周长22，所以2(HG＋FG)＝22。由中位线关系得AC＋BD＝22。", "why": "中位线等于对应边的一半"}, {"title": "面积转成积与平方和", "body": "菱形面积为AC·BD/2＝10，所以AC·BD＝20。于是AC²＋BD²＝(AC＋BD)²－2AC·BD＝484－40＝444。", "why": "菱形面积；完全平方公式"}, {"title": "勾股求边长", "body": "菱形对角线互相垂直平分，所以在Rt△AOB中，AB²＝AO²＋BO²＝(AC²＋BD²)/4＝111，得AB＝√111。", "why": "菱形对角线垂直平分"}], "answer": "（1）四边形ABCD是菱形；（2）AB＝√111。", "pitfall": "中位线是对应第三边的一半，不能丢掉1/2。；EFGH为矩形并不能无条件推出外层任意四边形为菱形；还需题给两组对边平行。；菱形面积是对角线乘积的一半。", "diagram": {"points": {"A": [-6, 0], "B": [0, 3], "C": [6, 0], "D": [0, -3], "E": [-3, 1.5], "F": [3, 1.5], "G": [3, -1.5], "H": [-3, -1.5], "O": [0, 0, 9, -6, "aux"]}, "edges": [["A", "B"], ["B", "C"], ["C", "D"], ["D", "A"], ["E", "F"], ["F", "G"], ["G", "H"], ["H", "E"]], "aux": [["A", "C"], ["B", "D"]]}, "presentation": "保留原题条件与两问。采用一般位置示意，不按第2问数值比例绘制。"}, {"id": "practice-coordinate-area", "day": 1, "type": "practice", "title": "坐标、面积与点的位置范围", "tags": ["坐标", "面积", "等腰分类"], "stem": ["矩形ABCD中，A(0，0)、B(8，0)、C(8，6)、D(0，6)。P在AD内部，设P(0，t)，所以0＜t＜6。图中示意t＝3的位置。"], "asks": ["用t表示S△ABP；若S△ABP＝16，求t。", "选做：当△PBC为等腰三角形时，求所有可能的t。"], "hint": ["AB为底时，P到AB的距离就是t。", "等腰需要分别检查PB＝PC、PB＝BC、PC＝BC。"], "steps": [{"title": "先用合法的底与高表达面积", "body": "AB＝8，P到AB的高为t，因此S△ABP＝8t÷2＝4t。令4t＝16，得t＝4，满足0＜t＜6。", "why": "矩形坐标；面积公式；取值范围。"}, {"title": "列出等腰的三种可能", "body": "PB²＝64＋t²，PC²＝64＋(6－t)²，BC²＝36。PB与PC都至少为8，均大于BC＝6，所以只有PB＝PC有可能。", "why": "勾股定理；长度比较；分类讨论。"}, {"title": "解方程并检查范围", "body": "64＋t²＝64＋(6－t)²，得12t＝36，t＝3。它位于(0，6)内，因此为唯一可行值。", "why": "等边条件；方程；范围检验。"}], "answer": "S△ABP＝4t；面积为16时t＝4；选做等腰条件下t＝3。", "pitfall": "等腰不能只列一组相等就结束；其他两种要判断为什么不可能。", "diagram": {"points": {"A": [0, 0, -23, 21], "B": [8, 0, 10, 21], "C": [8, 6, 10, -9], "D": [0, 6, -22, -10], "P": [0, 3, -24, 6]}, "edges": [["A", "B"], ["B", "C"], ["C", "D"], ["D", "A"], ["P", "B"], ["P", "C"]], "aux": [], "fill": [{"points": ["A", "B", "P"], "color": "#d5eee6"}], "labels": [{"at": [3, -0.7], "text": "8"}, {"at": [8.5, 2.6], "text": "6"}]}, "time": "12分钟", "difficulty": "基础应用"}, {"id": "exam-bj2025-15", "day": 1, "type": "exam", "title": "正方形里的30°与面积", "year": 2025, "region": "北京", "number": "第15题", "source": "https://zy.21cnjy.com/23366730", "tags": ["正方形", "30°直角三角形", "作高", "面积"], "difficulty": "中等应用", "time": "8分钟", "stem": ["正方形ABCD的边长为1，E在CD上。CF⊥BE于F，且∠EBC＝30°。"], "asks": ["求S△ABF，并明确你选用的底和高。"], "hint": ["△ABF的底可以选AB，但CF并不是这条底对应的高。", "先求BF，再过F向AB作垂线；或者用坐标求F到AB的距离。"], "steps": [{"title": "确定直角三角形的斜边", "body": "正方形ABCD中，BC＝AB＝1。F在BE上，所以∠FBC＝30°；CF⊥BE，所以△BCF为直角三角形，BC为斜边。", "why": "矩形直角；题设垂直"}, {"title": "先求CF和BF", "body": "由30°所对直角边为斜边的一半，CF＝1/2；由勾股定理BF＝√(1－1/4)＝√3/2。", "why": "30°性质；勾股定理"}, {"title": "为AB补对应的高", "body": "过F作FH⊥AB于H。AB⊥BC，所以∠FBH＝60°。于是FH＝BF·sin60°＝(√3/2)·(√3/2)＝3/4。", "why": "直角三角形边角关系"}, {"title": "用正确底高算面积", "body": "以AB为底、FH为高，S△ABF＝AB·FH/2＝1·(3/4)/2＝3/8。", "why": "三角形面积公式"}], "answer": "3/8。", "pitfall": "不能把CF直接当成△ABF底AB上的高。；△BCF中斜边是BC＝1，而不是BF。", "diagram": {"points": {"A": [0, 1], "B": [0, 0], "C": [1, 0], "D": [1, 1], "E": [1, 0.5773502691896258, 10, -2], "F": [0.75, 0.4330127018922193, 4, 23], "H": [0, 0.4330127018922193, -24, 6, "aux"]}, "edges": [["A", "B"], ["B", "C"], ["C", "D"], ["D", "A"], ["B", "E"], ["C", "F"], ["A", "F"]], "aux": [["F", "H"]], "right": [{"p": ["B", "F", "C"]}, {"p": ["B", "H", "F"], "aux": true}]}, "presentation": "原填空题补充“说明底与高”的课堂追问，原数值与求解目标保留。"}, {"id": "practice-square-exit", "day": 1, "type": "practice", "title": "独立检验：从条件走到正方形", "tags": ["正方形判定", "中位线"], "stem": ["已知四边形ABCD是平行四边形，AB＝BC，∠ABC＝90°。E、F分别是AB、BC的中点，连接EF。"], "asks": ["证明ABCD为正方形。", "若AB＝4，求EF，并说明EF与AC的位置关系。"], "hint": ["已知平行四边形后，一个直角和一组相等邻边分别补出了什么？", "E、F在△ABC中是哪两个点？"], "steps": [{"title": "补齐矩形与菱形条件", "body": "ABCD是平行四边形且∠ABC＝90°，所以它是矩形；又AB＝BC，即矩形相邻两边相等，故它是正方形。", "why": "矩形判定；正方形判定。"}, {"title": "在大图中找中位线", "body": "E、F分别为AB、BC中点，所以EF是△ABC的中位线，得EF∥AC且EF＝AC/2。", "why": "三角形中位线定理。"}, {"title": "由直角求对角线", "body": "△ABC为等腰直角三角形，AC²＝4²＋4²＝32，AC＝4√2，所以EF＝2√2。", "why": "勾股定理；半长关系。"}], "answer": "ABCD是正方形；EF∥AC，EF＝2√2。", "pitfall": "EF是△ABC的中位线，不是正方形对角线的一部分。", "diagram": {"points": {"A": [0, 0, -22, 22], "B": [4, 0, 10, 22], "C": [4, 4, 10, -10], "D": [0, 4, -22, -10], "E": [2, 0, -4, 24], "F": [4, 2, 11, 6]}, "edges": [["A", "B"], ["B", "C"], ["C", "D"], ["D", "A"], ["E", "F"]], "aux": [["A", "C"]], "right": [{"p": ["A", "B", "C"]}], "equal": [["A", "E", 1], ["E", "B", 1], ["B", "F", 2], ["F", "C", 2]]}, "time": "8分钟", "difficulty": "基础应用"}, {"id": "practice-circle-check", "day": 2, "type": "practice", "title": "圆里先找直角、等角和等长", "tags": ["圆周角", "垂径定理", "等半径"], "stem": ["⊙O半径为5，AB为直径，C在圆上。另有弦DE＝8，过O作OH⊥DE，H为垂足。"], "asks": ["写出∠ACB，并说明依据。", "求OH。"], "hint": ["直径对应的圆周角是多少？", "从圆心向弦作垂线后，弦的两段各有多长？"], "steps": [{"title": "直径给出直角", "body": "AB为直径且C在圆上，故∠ACB＝90°。", "why": "直径所对的圆周角是直角。"}, {"title": "垂径定理把弦分成两半", "body": "OH⊥DE且O为圆心，所以DH＝HE＝DE/2＝4。连接OD，得OD＝5。", "why": "垂径定理；半径相等。"}, {"title": "转入直角三角形", "body": "在Rt△ODH中，OH²＝OD²－DH²＝25－16＝9，所以OH＝3。", "why": "勾股定理。"}], "answer": "∠ACB＝90°；OH＝3。", "pitfall": "圆周角的顶点要在圆上；弦心距对应的直角三角形用半弦而不是整弦。", "diagram": {"points": {"O": [0, 0, -19, -7], "A": [-5, 0, -25, 9], "B": [5, 0, 10, 10], "C": [3, 4, 11, -8], "D": [-4, -3, -20, 20], "E": [4, -3, 10, 21], "H": [0, -3, -5, 25]}, "edges": [["A", "B"], ["A", "C"], ["B", "C"], ["D", "E"], ["O", "H"]], "aux": [["O", "D"]], "circles": [{"center": "O", "r": 5}], "right": [{"p": ["O", "H", "D"]}]}, "time": "6分钟", "difficulty": "基础应用"}, {"id": "exam-2024-beijing-24-1", "day": 2, "type": "exam", "title": "直径与角平分线推出平行", "year": 2024, "region": "北京", "number": "第24(1)题", "source": "https://www.xbjy.com/xhtml/202409/1056.html", "tags": ["圆周角", "等腰三角形", "三线合一", "平行线"], "difficulty": "基础到中等", "time": "7分钟", "stem": ["AB为⊙O的直径，C、D位于圆上；OD平分∠AOC。"], "asks": ["求证：OD∥BC。"], "hint": ["连接AC。一个直角来自直径，另一个垂直关系能否由等腰三角形与角平分线得到？"], "steps": [{"title": "补连AC", "body": "连接AC，记OD与AC的交点为H。", "why": "为直径对应的圆周角补全两边"}, {"title": "由等腰与角平分得垂直", "body": "OA＝OC，所以△AOC为等腰三角形。OD平分顶角∠AOC，由等腰三角形三线合一，得OD⊥AC。", "why": "OA＝OC；三线合一"}, {"title": "由直径得另一个垂直", "body": "AB为直径，C在圆上，所以∠ACB＝90°，即BC⊥AC。", "why": "圆周角定理"}, {"title": "用同垂直推出平行", "body": "OD与BC都垂直于AC，故OD∥BC。", "why": "同平面内垂直于同一直线的两直线平行"}], "answer": "OD∥BC。", "pitfall": "不能只根据角平分线就断定垂直；必须先写OA＝OC。", "diagram": {"points": {"O": [0, 0, -5, 25], "A": [-1, 0], "B": [1, 0], "C": [0.5, 0.8660254038], "D": [-0.5, 0.8660254038], "H": [-0.25, 0.4330127019, 9, 10, "aux"]}, "edges": [["A", "B"], ["O", "C"], ["O", "D"], ["B", "C"]], "aux": [["A", "C"]], "circles": [{"center": "O", "r": 1, "semi": false}], "right": [{"p": ["O", "H", "A"], "aux": true}]}, "presentation": "选取原第24题的第(1)问。"}, {"id": "exam-2024-shenzhen-18", "day": 2, "type": "exam", "title": "等腰三角形、切线与圆的半径", "year": 2024, "region": "广东深圳", "number": "第18题", "source": "https://kaosj.com/papers/2024/07/2024-zhongkao-math-guangdong-shenzhen-8d2b1fd738-paper/", "tags": ["圆与切线", "垂直平分线", "矩形", "勾股定理"], "difficulty": "中等", "time": "14分钟", "stem": ["△ABD中AB＝BD，A、B、D在⊙O上。BE与圆相切于B，AC为直径。直线DC与BE相交于E，点的排列如图。"], "asks": ["证明DE⊥BE。", "若AB＝5√6、BE＝5，求圆的半径。"], "hint": ["看到切线先连半径；AB＝BD与OA＝OD能说明BO和AD是什么关系？"], "steps": [{"title": "连接圆心并找中垂线", "body": "连接BO并延长，交AD于H。AB＝BD，所以B到A、D等距；OA＝OD，所以O也到A、D等距。因此直线BO是AD的垂直平分线，BH⊥AD，AH＝DH。", "why": "等距点的垂直平分线判定"}, {"title": "由直径构造直角", "body": "AC是直径，D在圆上，所以∠ADC＝90°，即AD⊥DC。BH与DC都垂直于AD，因此BH∥DC，也就有BH∥DE。", "why": "直径所对圆周角为直角"}, {"title": "使用已知切线的性质", "body": "BE为圆在B点的切线，所以OB⊥BE。BH与OB共线，故BH⊥BE；由DE∥BH，得到DE⊥BE。", "why": "切线与过切点的半径垂直"}, {"title": "构造矩形转移长度", "body": "BH⊥AD、DE⊥AD、BH⊥BE，所以四边形BHDE为矩形。于是DH＝BE＝5，故AH＝5。", "why": "平行与垂直；矩形性质"}, {"title": "勾股算出BH", "body": "在Rt△ABH中，BH²＝AB²－AH²＝(5√6)²－5²＝125，因此BH＝5√5。", "why": "AB＝5√6，AH＝5"}, {"title": "设半径并列方程", "body": "设半径为r。图中B、O、H依次共线，所以OH＝BH－BO＝5√5－r。Rt△AOH中，r²＝5²＋(5√5－r)²。", "why": "B、O、H依次共线；勾股定理"}, {"title": "化简并求半径", "body": "展开并化简：r²＝25＋125－10√5r＋r²，故10√5r＝150，解得r＝3√5。", "why": "等价变形"}], "answer": "(1)DE⊥BE；(2)半径3√5。", "pitfall": "矩形BHDE只能直接给出DH＝BE；BH还需在Rt△ABH中用勾股定理求出，不能误写BH＝BE。", "diagram": {"points": {"O": [0, 0], "B": [0, 6.7082039325, -22, -10], "A": [-5, -4.472135955], "D": [5, -4.472135955, 12, 20], "C": [5, 4.472135955], "E": [5, 6.7082039325, 12, -10], "H": [0, -4.472135955, -8, 26, "aux"]}, "edges": [["A", "B"], ["B", "D"], ["A", "D"], ["A", "C"], ["D", "E"], ["B", "E"]], "aux": [["B", "H"], ["O", "A"]], "circles": [{"center": "O", "r": 6.7082039325, "semi": false}]}, "presentation": "按原题数学条件整理，几何图按题意重绘。"}, {"id": "practice-tangent-two", "day": 2, "type": "practice", "title": "切点未知，怎样证明相切？", "tags": ["角平分线等距", "切线判定"], "stem": ["点O在∠BAC的内部角平分线上。⊙O与边AB相切于M，过O向AC作垂线，垂足为N。"], "asks": ["证明AC也是⊙O的切线。"], "hint": ["已知一条切线，能得到哪个垂直关系？", "把OM、ON都看成到角两边的距离。"], "steps": [{"title": "先由已知切线得到垂直", "body": "⊙O与AB相切于M，所以OM⊥AB，且OM为半径。", "why": "切线性质。"}, {"title": "角平分线转化为等距", "body": "ON⊥AC，且O位于∠BAC的角平分线上，所以ON＝OM。于是圆心O到直线AC的距离等于半径。", "why": "角平分线等距性质。"}, {"title": "确认N在圆上再判相切", "body": "ON等于半径，因此N在⊙O上。又ON⊥AC，所以AC是⊙O在N点的切线。", "why": "圆的定义；切线判定。"}], "answer": "AC与⊙O相切于N。", "pitfall": "不能仅由ON⊥AC就说相切；必须先证明ON等于半径。", "diagram": {"points": {"A": [0, 0, -22, 21], "B": [9, 0, 10, 20], "C": [4.5, 7.794, -6, -11], "O": [5.196152423, 3, 10, -9], "M": [5.196152423, 0, -5, 24], "N": [2.5980762115, 4.5, -25, -4]}, "edges": [["A", "B"], ["A", "C"], ["A", "O"], ["O", "M"], ["O", "N"]], "aux": [], "circles": [{"center": "O", "r": 3}], "right": [{"p": ["O", "M", "A"]}, {"p": ["O", "N", "A"]}]}, "time": "8分钟", "difficulty": "基础应用"}, {"id": "practice-translation-overlap", "day": 2, "type": "practice", "title": "平移以后，重叠部分怎样计算？", "tags": ["平移", "对应关系", "重叠面积"], "stem": ["矩形ABCD中，AB＝4，BC＝3。将矩形沿AB方向平移x个单位，得到A′B′C′D′，其中0≤x≤4。图示x＝2的位置。"], "asks": ["x＝2时，求两矩形重叠部分的面积。", "用x表示重叠面积S；若S＝3，求x。"], "hint": ["平移后高有没有改变？", "重叠部分沿AB方向剩下多长？"], "steps": [{"title": "确定重叠图形的底与高", "body": "在0≤x≤4内，两矩形重叠部分是高为3、宽为4－x的矩形（端点处允许面积为0）。", "why": "平移对应长度不变；当前位移范围。"}, {"title": "表达并代入", "body": "S＝3(4－x)。当x＝2时，S＝3×2＝6。", "why": "矩形面积公式。"}, {"title": "解方程并检查", "body": "令3(4－x)＝3，得x＝3，符合0≤x≤4。", "why": "方程及范围检验。"}], "answer": "x＝2时S＝6；S＝3(4－x)；S＝3时x＝3。", "pitfall": "若平移超出给定范围，重叠形状或是否重叠会改变，不能无限套用这一公式。", "diagram": {"points": {"A": [0, 0, -20, 23], "B": [4, 0, -5, 23], "C": [4, 3, -5, -12], "D": [0, 3, -20, -12], "A′": [2, 0, -10, 25], "B′": [6, 0, 9, 22], "C′": [6, 3, 10, -10], "D′": [2, 3, -11, -12]}, "edges": [["A", "B"], ["B", "C"], ["C", "D"], ["D", "A"], ["A′", "B′"], ["B′", "C′"], ["C′", "D′"], ["D′", "A′"]], "aux": [], "fill": [{"points": ["A′", "B", "C", "D′"], "color": "#c9e8e2"}]}, "time": "8分钟", "difficulty": "基础应用"}, {"id": "exam-2022-jingzhou-fold-tangent", "day": 2, "type": "exam", "title": "矩形折叠与切线判定", "year": 2022, "region": "湖北荆州", "number": "第24题(1)(2)", "source": "https://zy.21cnjy.com/14817805", "tags": ["折叠", "切线判定", "相似三角形", "勾股定理"], "difficulty": "中等", "time": "13分钟", "stem": ["矩形ABCD中AB＝4、AD＝3。O在AB上且O≠A，设OA＝x。沿OD折叠△OAD，使A落到E；以O为圆心、OA为半径作AB上方的半圆。"], "asks": ["求证：DE是半圆O的切线。", "当E落在BD上时，求x。"], "hint": ["折叠保持长度和角：原来的OA与∠OAD分别变成了什么？"], "steps": [{"title": "提取折叠条件", "body": "折叠把A映到E，O、D在折痕上不动，所以OE＝OA，DE＝DA＝3，∠OED＝∠OAD＝90°。", "why": "对应边、对应角相等"}, {"title": "确认切点与垂直", "body": "OE＝OA说明E在以O为圆心、OA为半径的半圆上；OE⊥DE，故DE是半圆O在E点的切线。", "why": "OE为半径；切线判定"}, {"title": "求整条与分段", "body": "当E在BD上时，在Rt△ABD中，BD＝√(4²＋3²)＝5。DE＝3，故BE＝5－3＝2。", "why": "勾股定理；DE＝AD"}, {"title": "在特殊位置找相似", "body": "∠BEO＝90°＝∠BAD；又BO与BA共线，BE与BD共线，所以∠OBE＝∠ABD。故△BOE∽△BDA。", "why": "两组对应角相等"}, {"title": "列比例后解x", "body": "对应边比BO/BD＝BE/BA，所以(4－x)/5＝2/4，解得x＝3/2。", "why": "对应边比例与BO＝4－x"}], "answer": "(1)DE与半圆O相切于E；(2)x＝3/2。", "pitfall": "证切线需要先确认E在圆上，再确认OE⊥DE；DE＝AD来自折叠，不能把DE误写成OA。", "diagram": {"points": {"A": [0, 0], "B": [4, 0], "C": [4, 3], "D": [0, 3], "O": [1.5, 0, -9, 25], "E": [2.4, 1.2, 10, -6]}, "edges": [["A", "B"], ["B", "C"], ["C", "D"], ["D", "A"], ["O", "D"], ["O", "E"], ["D", "E"]], "aux": [["B", "D"]], "circles": [{"center": "O", "r": 1.5, "semi": true}], "right": [{"p": ["O", "E", "D"], "aux": true}]}, "presentation": "选取原第24题的第(1)(2)问；省略仅供后问使用的F、G等构造。图为第(2)问的特定位置。"}, {"id": "exam-2022-yiyang-10", "day": 2, "type": "exam", "title": "旋转50°后哪些结论仍成立", "year": 2022, "region": "湖南益阳", "number": "第10题", "source": "https://www.yeyulingfeng.com/wendang/636940.html", "tags": ["旋转", "平行线", "等腰三角形", "角度计算"], "difficulty": "基础到中等", "time": "10分钟", "stem": ["△ABC中∠CAB＝20°、∠ABC＝30°。绕A逆时针转动50°，对应图形记为△AB′C′。"], "asks": ["判断①BC＝B′C′；②AC∥C′B′；③C′B′⊥BB′；④∠ABB′＝∠ACC′，并说明理由。"], "hint": ["先写旋转直接给出的等边、等角，再看△ABB′与△ACC′这两个等腰三角形。"], "steps": [{"title": "判断①", "body": "旋转保持长度，所以BC＝B′C′，①正确。", "why": "旋转保持长度"}, {"title": "判断②", "body": "∠BAB′＝50°，∠BAC＝20°，因此∠B′AC＝30°。旋转又给∠AB′C′＝∠ABC＝30°，由内错角相等可得AC∥C′B′，②正确。", "why": "旋转角及平行线判定"}, {"title": "计算△ABB′的底角", "body": "AB＝AB′，且∠BAB′＝50°，所以△ABB′两底角均为(180°－50°)/2＝65°。", "why": "等腰三角形内角和"}, {"title": "判断③", "body": "由图中射线次序，∠C′B′B＝∠C′B′A＋∠AB′B＝30°＋65°＝95°，并非90°，③错误。", "why": "按图中射线次序求角度和"}, {"title": "判断④", "body": "AC＝AC′，且∠CAC′＝50°，所以△ACC′两底角同样为65°。于是∠ABB′＝∠ACC′，④正确。", "why": "另一等腰三角形有相同顶角"}], "answer": "B，正确结论①②④。", "pitfall": "旋转角为50°，不意味着图上任意两条对应线段都垂直；先看旋转中心和对应点。", "diagram": {"points": {"A": [0, 0, -20, 20], "B": [1, 0], "C": [0.6133407985, 0.2232377941, 5, 20], "B′": [0.6427876097, 0.7660444431, 10, -8], "C′": [0.2232377941, 0.6133407985, -29, -7]}, "edges": [["A", "B"], ["B", "C"], ["C", "A"], ["A", "B′"], ["B′", "C′"], ["C′", "A"]], "aux": [["B", "B′"], ["C", "C′"]]}, "presentation": "原选择题改为逐条判断并说明理由，保留四个待判断结论。"}, {"id": "practice-fold-exit", "day": 2, "type": "practice", "title": "独立检验：折叠后用什么列方程？", "tags": ["折叠", "等长", "勾股定理"], "stem": ["矩形ABCD中，AB＝6，BC＝8。E在BC上且BE＝4。沿直线PQ折叠，使A与E重合，其中P在AB上，Q在AD上。"], "asks": ["求AP。写清等长关系来自哪里。"], "hint": ["折痕上的P不动，A与E是对应点。", "设AP＝x，在△PBE中哪两条直角边可以用x表示？"], "steps": [{"title": "先从折叠提取等长", "body": "P在折痕上，所以PA＝PE。设AP＝x，则PE＝x，PB＝AB－AP＝6－x。", "why": "折痕上的点到两个对应点等距。"}, {"title": "寻找包含未知量的直角三角形", "body": "PB沿AB，BE沿BC，而AB⊥BC，所以△PBE为直角三角形。由勾股定理，x²＝(6－x)²＋4²。", "why": "矩形直角；勾股定理。"}, {"title": "解方程与位置核验", "body": "展开得x²＝36－12x＋x²＋16，所以12x＝52，x＝13/3。0＜13/3＜6，P确实在线段AB内。", "why": "方程；P的位置范围。"}], "answer": "AP＝13/3。", "pitfall": "PA＝PE来自折叠，不能把AP当成PB，也不能漏掉PB＝6－x。", "diagram": {"points": {"A": [0, 0, -23, 22], "B": [6, 0, 10, 22], "C": [6, 8, 10, -12], "D": [0, 8, -22, -12], "E": [6, 4, 12, 5], "P": [4.333333333333333, 0, -5, 25], 不能说明相切？","rules":[["先作距离","过O作OH⊥直线l，垂足为H，OH就是圆心到直线的距离。"],["再证明等于半径","若OH＝r，则H在圆上，直线l与圆相切。"],["三种位置","距离d＞r为相离，d＝r为相切，d＜r为相交。"]],"trap":"任意圆心都能向任意直线作垂线；关键还在于垂线段长度等于半径。","bridge":"结合角平分线等距、全等或勾股定理，证明圆心到直线的距离等于已知半径。"},{"title":"平移与旋转：先列对应点","prompt":"旋转中心不动，你能先写出两组确定的等长吗？","rules":[["平移","对应长度、角度不变；各点位移的方向和距离相同。对应线段平行或共线。"],["旋转","绕A旋转时A不动，B→B′、C→C′，所以AB＝AB′、AC＝AC′，对应边角相等。"],["旋转角","∠BAB′与∠CAC′均对应同一次旋转的转角（按题目方向理解）；可构造△ABB′、△ACC′两个等腰三角形。"]],"trap":"旋转角是同一原点、像点与中心形成的转角；不能把图上任意两条线之间的角都当旋转角。","bridge":"先写对应表和等长，再标旋转角，最后用全等、相似或等腰三角形求角。"},{"title":"折叠：等长与折痕的中垂性质","prompt":"点P在折痕上，A折到E后，哪两条线段相等？","rules":[["对应关系","A折到E，折痕上的P、Q不动，所以PA＝PE、QA＝QE，对应角也相等。"],["折痕性质","若A与E不同，折痕是线段AE的垂直平分线；AE与折痕的交点是AE中点。"],["接上计算","先把对应线段标等，再寻找矩形中的直角，用勾股定理或相似列方程。"]],"trap":"折痕上的点不一定是原图某条边的中点；“中点”针对的是原点与像点的连线。","bridge":"未知长设为x，把折叠给的等长代入同一个直角三角形，写明范围再求解。"}],"checks":[{"q":"AB是⊙O的直径，C在圆上且不同于A、B。一定是直角的是？","options":["∠AOC","∠ACB","∠CAB"],"answer":1,"why":"∠ACB是直径AB所对的圆周角，所以等于90°。","review":"圆周角、直径与内接四边形"},{"q":"⊙O半径为5，过O作OH⊥直线l。若要用距离证明l为切线，还需要？","options":["OH＝5","OH＜5","只要OH⊥l就够"],"answer":0,"why":"垂线只确定了距离；还需OH等于半径5，才能确定H在圆上并判定相切。","review":"切点未知：作垂线比半径"},{"q":"沿直线PQ折叠，使A与E重合。P在折痕上，一定成立的是？","options":["PA＝PE","PA＝AE","P是AE的中点"],"answer":0,"why":"P是折叠中的不动点，到对应点A、E等距。折痕与AE的交点才是AE中点，P未必是那个交点。","review":"折叠：等长与折痕的中垂性质"}]}];
const STORE='honghao_geometry_three_nights_v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch{}
let state={day:0,index:0,filter:'all',font:22,focus:false,stage:'review',...saved.view};
let reviewData=saved.reviewData||{};
if(!['review','exercise'].includes(state.stage))state.stage='review';
state.day=Math.max(0,Math.min(2,Number(state.day)||0));state.font=Math.max(18,Math.min(30,Number(state.font)||22));
let progress=saved.progress||{},reveal={},auxiliary={},marks={},hintSeen={},toastTimer;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(STORE,JSON.stringify({view:state,progress,reviewData}))}catch{}}
function current(){const list=QUESTIONS.filter(q=>q.day===state.day);return list[Math.min(list.length-1,Math.max(0,state.index))]}
function notify(msg){clearTimeout(toastTimer);$('#toast').textContent=msg;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2200)}
function saveNote(){const q=current(),note=$('#notes');if(note){progress[q.id]={...(progress[q.id]||{}),note:note.value};persist()}}
function selectQuestion(day,index){saveNote();state.day=day;state.index=index;state.stage='exercise';persist();render();window.scrollTo({top:0,behavior:'instant'})}
function svgFigure(d,aux=false,showMarks=true){
 if(!d)return '<p>请在草稿纸上按题意画图。</p>';
 const W=560,H=390,P=48,pts=d.points||{},all=Object.values(pts).map(v=>[v[0],v[1]]);
 for(const c of d.circles||[]){const o=typeof c.center==='string'?pts[c.center]:c.center;all.push([o[0]-c.r,o[1]-(c.semi?0:c.r)],[o[0]+c.r,o[1]+c.r])}
 const xs=all.map(v=>v[0]),ys=all.map(v=>v[1]);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 const scale=Math.min((W-2*P)/(maxX-minX||1),(H-2*P)/(maxY-minY||1));
 const X=x=>(W-(maxX-minX)*scale)/2+(x-minX)*scale,Y=y=>(H-(maxY-minY)*scale)/2+(maxY-y)*scale;
 const xy=k=>{let p=typeof k==='string'?pts[k]:k;return [X(p[0]),Y(p[1])]};
 const line=(a,b,cls='geo-line')=>{let A=xy(a),B=xy(b);return `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" class="${cls}"/>`};
 let body='';
 for(const poly of d.fill||[]){if(poly.aux&&!aux)continue;body+=`<polygon points="${poly.points.map(k=>xy(k).join(',')).join(' ')}" fill="${poly.color||'#d9e9ff'}" opacity=".65"/>`}
 for(const c of d.circles||[]){let o=xy(c.center),r=c.r*scale;if(c.semi)body+=`<path d="M${o[0]-r},${o[1]} A${r},${r} 0 0 1 ${o[0]+r},${o[1]}" class="geo-line"/>`;else body+=`<circle cx="${o[0]}" cy="${o[1]}" r="${r}" class="${c.aux?'aux':'geo-line'}"/>`}
 for(const edge of d.edges||[])body+=line(edge[0],edge[1]);
 if(aux)for(const edge of d.aux||[])body+=line(edge[0],edge[1],'aux');
 if(showMarks){
  for(const ra of d.right||[]){if(ra.aux&&!aux)continue;let a=xy(ra.p[0]),v=xy(ra.p[1]),b=xy(ra.p[2]),da=[a[0]-v[0],a[1]-v[1]],db=[b[0]-v[0],b[1]-v[1]],la=Math.hypot(...da),lb=Math.hypot(...db),n=13;da=da.map(x=>x/la*n);db=db.map(x=>x/lb*n);body+=`<path d="M${v[0]+da[0]},${v[1]+da[1]} L${v[0]+da[0]+db[0]},${v[1]+da[1]+db[1]} L${v[0]+db[0]},${v[1]+db[1]}" class="mark"/>`}
  for(const e of d.equal||[]){let a=xy(e[0]),b=xy(e[1]),dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),n=e[2]||1;for(let j=0;j<n;j++){let offset=(j-(n-1)/2)*5,mx=(a[0]+b[0])/2+dx/len*offset,my=(a[1]+b[1])/2+dy/len*offset;body+=`<line x1="${mx-dy/len*5}" y1="${my+dx/len*5}" x2="${mx+dy/len*5}" y2="${my-dx/len*5}" class="mark"/>`}}
 }
 for(const [name,p] of Object.entries(pts)){if(p[4]==='aux'&&!aux)continue;let a=xy(name);body+=`<circle cx="${a[0]}" cy="${a[1]}" r="2.8" class="point"/><text x="${a[0]+(p[2]??9)}" y="${a[1]+(p[3]??-10)}">${esc(name)}</text>`}
 for(const l of d.labels||[]){if(l.aux&&!aux)continue;let a=xy(l.at);body+=`<text x="${a[0]+(l.dx||0)}" y="${a[1]+(l.dy||0)}" style="font-size:18px;fill:${l.color||'#50637b'}">${esc(l.text)}</text>`}
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.alt||'题目几何示意图，点与条件见题干')}">${body}</svg>`
}
function render(){
 const q=current();if(!q)return;document.documentElement.style.setProperty('--body-size',state.font+'px');document.body.classList.toggle('focus-mode',state.focus);$('#focus').textContent=state.focus?'退出专注':'课堂专注';
 $('#night-tabs').innerHTML=DAYS.map((d,i)=>{let qs=QUESTIONS.filter(q=>q.day===i),n=qs.filter(q=>progress[q.id]?.status==='mastered').length;return `<button class="night ${state.day===i?'active':''}" data-day="${i}" aria-pressed="${state.day===i}"><span class="day">${d.name}</span><span><strong>${d.title}</strong><small>${d.date}</small></span><span class="count">已掌握 ${n}/${qs.length}</span></button>`}).join('');
 $('#sidebar-title').textContent=DAYS[state.day].name+'课堂题单';$('#sidebar-summary').textContent=DAYS[state.day].summary;
 document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===state.filter));
 const all=QUESTIONS.filter(x=>x.day===state.day),list=all.filter(x=>state.filter==='all'||(state.filter==='exam'&&x.type==='exam')||(state.filter==='review'&&progress[x.id]?.status==='review'));
 $('#question-list').innerHTML=list.length?list.map(x=>{let index=all.indexOf(x),s=progress[x.id]?.status;return `<button class="question-item ${x.id===q.id?'active':''}" data-question="${index}" ${x.id===q.id?'aria-current="true"':''}><span class="n">${String(index+1).padStart(2,'0')}</span><span class="item-text">${esc(x.title)}<small>${esc(x.type==='exam'?x.year+'年'+x.region+'中考':'方法练习')} · ${esc(x.time||'8分钟')}</small></span><span class="state" aria-label="${s==='mastered'?'已掌握':s==='review'?'待回练':'未标记'}">${s==='mastered'?'✓':s==='review'?'↻':''}</span></button>`}).join(''):'<p class="empty">这一晚还没有标记待回练的题。可在做题后标记“需要回练”。</p>';
 $('#lesson-meta').innerHTML=`<span class="badge ${q.type==='exam'?'':'practice'}">${q.type==='exam'?'中考真题':'方法练习'}</span><span>${esc(q.type==='exam'?q.year+'年 · '+q.region+(q.number?' · '+q.number:''):'原创诊断与迁移')}</span><span class="tag">${esc(q.difficulty||'基础应用')} · 建议${esc(q.time||'8分钟')}</span>`;
 $('#lesson-title').textContent=q.title;$('#lesson-subline').textContent=(q.tags||[]).join(' / ');
 $('#stem').innerHTML=q.stem.map(s=>`<p>${esc(s)}</p>`).join('');$('#asks').innerHTML=(q.asks||[]).map(x=>`<li>${esc(x)}</li>`).join('');$('#asks').hidden=!(q.asks||[]).length;
 $('#figure').innerHTML=svgFigure(q.diagram,!!auxiliary[q.id],marks[q.id]!==false);$('#aux-toggle').disabled=!(q.diagram?.aux?.length);$('#aux-toggle').classList.toggle('on',!!auxiliary[q.id]);$('#aux-toggle').textContent=auxiliary[q.id]?'隐藏辅助线':'显示辅助线';$('#marks-toggle').textContent=marks[q.id]===false?'显示条件标记':'隐藏条件标记';
 $('#hint').open=false;$('#answer-detail').open=false;$('#hint-content').innerHTML='<ol>'+q.hint.map(s=>`<li>${esc(s)}</li>`).join('')+'</ol>';$('#answer').textContent=q.answer;$('#pitfall').textContent='易错提醒：'+q.pitfall;
 $('#notes').value=progress[q.id]?.note||'';
 $('#mastered').classList.toggle('selected',progress[q.id]?.status==='mastered');$('#review').classList.toggle('selected',progress[q.id]?.status==='review');
 $('#source').innerHTML=q.source?`题源：${esc(q.year+'年'+q.region+'中考'+(q.number?' '+q.number:''))}。${esc(q.presentation||'题干按数学条件整理，图形按题意重绘。')} <a href="${esc(q.source)}" target="_blank" rel="noopener noreferrer">查看题源</a>`:'本题为原创方法练习，用于检查概念、补充推导或迁移应用。';
 $('#prev').disabled=state.day===0&&state.index===0;$('#next').disabled=state.day===2&&state.index===all.length-1;$('#next').textContent=state.index===all.length-1&&state.day<2?'进入下一晚':'下一题';
 $('#position').textContent=`${DAYS[state.day].name} · 第${state.index+1} / ${all.length}题`;
 renderProof();renderReview();
}
function renderProof(){let q=current(),n=reveal[q.id]||0;$('#proof-progress').textContent=`已展开 ${n}/${q.steps.length} 步`;$('#proof').innerHTML=n?q.steps.slice(0,n).map((s,i)=>`<div class="proof-step"><span class="step-no">${i+1}</span><div><h4>${esc(s.title)}</h4><p>${esc(s.body)}</p><p class="reason">依据：${esc(s.why)}</p></div></div>`).join(''):'<div class="proof-empty">先标出条件，试着说出第一步。需要帮助时，可展开思路提示或逐步查看证明。</div>';$('#step-next').disabled=n>=q.steps.length;$('#step-all').textContent=n===q.steps.length?'收起解析':'完整解析'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.day!==undefined){selectDay(Number(b.dataset.day))}
 if(b.dataset.question!==undefined)selectQuestion(state.day,Number(b.dataset.question));
 if(b.dataset.filter){saveNote();state.filter=b.dataset.filter;persist();render()}
});
$('#step-next').onclick=()=>{let q=current();reveal[q.id]=Math.min(q.steps.length,(reveal[q.id]||0)+1);renderProof()};
$('#step-all').onclick=()=>{let q=current();reveal[q.id]=(reveal[q.id]||0)===q.steps.length?0:q.steps.length;renderProof()};
$('#aux-toggle').onclick=()=>{let q=current();auxiliary[q.id]=!auxiliary[q.id];$('#figure').innerHTML=svgFigure(q.diagram,!!auxiliary[q.id],marks[q.id]!==false);$('#aux-toggle').textContent=auxiliary[q.id]?'隐藏辅助线':'显示辅助线';$('#aux-toggle').classList.toggle('on',!!auxiliary[q.id])};
$('#marks-toggle').onclick=()=>{let q=current();marks[q.id]=marks[q.id]===false;$('#figure').innerHTML=svgFigure(q.diagram,!!auxiliary[q.id],marks[q.id]);$('#marks-toggle').textContent=marks[q.id]?'隐藏条件标记':'显示条件标记'};
$('#figure-zoom').onclick=()=>{let q=current();$('#zoom-body').innerHTML=svgFigure(q.diagram,!!auxiliary[q.id],marks[q.id]!==false);$('#zoom').showModal()};
$('#notes').addEventListener('input',saveNote);
for(const [id,status]of[['mastered','mastered'],['review','review']])$('#'+id).onclick=()=>{saveNote();let q=current();progress[q.id]={...(progress[q.id]||{}),status:progress[q.id]?.status===status?'':status};persist();render();notify(status==='mastered'?'已更新掌握情况':'已更新回练题单')};
$('#prev').onclick=()=>{const list=QUESTIONS.filter(q=>q.day===state.day);if(state.index>0)selectQuestion(state.day,state.index-1);else if(state.day>0)selectQuestion(state.day-1,QUESTIONS.filter(q=>q.day===state.day-1).length-1)};
$('#next').onclick=()=>{const list=QUESTIONS.filter(q=>q.day===state.day);if(state.index<list.length-1)selectQuestion(state.day,state.index+1);else if(state.day<2)selectDay(state.day+1)};
$('#font-up').onclick=()=>{state.font=Math.min(30,state.font+2);document.documentElement.style.setProperty('--body-size',state.font+'px');persist()};
$('#font-down').onclick=()=>{state.font=Math.max(18,state.font-2);document.documentElement.style.setProperty('--body-size',state.font+'px');persist()};
$('#focus').onclick=()=>{saveNote();state.focus=!state.focus;persist();render()};
function openTheorems(){$('#theorem-body').innerHTML=THEOREMS.map(([t,b])=>`<section class="theorem"><h3>${esc(t)}</h3><p>${esc(b)}</p></section>`).join('');$('#theorems').showModal()}
$('#theorem-open').onclick=openTheorems;$('#theorem-top').onclick=openTheorems;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
$('#print').onclick=()=>window.print();
$('#export').onclick=()=>{saveNote();const data=JSON.stringify({format:STORE,date:new Date().toISOString(),progress,reviewData},null,2),url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='几何三晚-学习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('学习记录已导出')};
$('#hint').addEventListener('toggle',()=>{if($('#hint').open)hintSeen[current().id]=true});
function dayReview(){return reviewData[state.day]||(reviewData[state.day]={card:0,answers:{}})}
function selectDay(day){saveNote();state.day=day;state.index=0;state.filter='all';state.stage='review';persist();render();window.scrollTo({top:0,behavior:'instant'})}
function openReview(checks=false){saveNote();state.stage='review';persist();render();if(checks)document.querySelector('#review-checks').scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0,behavior:'instant'})}
function renderReview(){
 const active=state.stage!=='exercise';$('#review-view').hidden=!active;$('#exercise-view').hidden=active;document.body.classList.toggle('reviewing',active);
 document.querySelectorAll('[data-stage]').forEach(b=>{b.classList.toggle('active',active?b.dataset.stage==='review':b.dataset.stage==='exercise');b.setAttribute('aria-pressed',String(active?b.dataset.stage==='review':b.dataset.stage==='exercise'))});
 const data=REVIEWS[state.day],r=dayReview();if(!r.answers||typeof r.answers!=='object')r.answers={};r.card=Math.max(0,Math.min(data.cards.length-1,Number(r.card)||0));const card=data.cards[r.card];
 $('#review-view').innerHTML=`<section class="review-page" aria-label="${esc(DAYS[state.day].name)}课前知识回顾"><p class="review-kicker">${esc(DAYS[state.day].name)} · 先回顾，再做题</p><h2>${esc(DAYS[state.day].title)}：知识回顾</h2><p class="review-intro">${esc(data.goal)}</p><p class="review-time">${esc(data.minutes)}：知识回顾约8—10分钟，自测约4—5分钟。全等、相似作为已有方法调用。</p><div class="recall-method"><strong>每个知识点说清三件事：</strong><span>什么条件？ → 什么结论？ → 什么时候不能用？</span></div><nav class="concept-tabs" aria-label="选择回顾知识点">${data.cards.map((c,i)=>`<button data-concept="${i}" aria-pressed="${i===r.card}">${i+1}. ${esc(c.title)}</button>`).join('')}</nav><section class="concept-card" aria-labelledby="concept-title"><header class="concept-heading"><h3 id="concept-title">${esc(card.title)}</h3><p class="recall-prompt">先口述：${esc(card.prompt)}</p></header><div class="concept-layout ${card.diagram?'':'no-figure'}"><div class="concept-rules">${card.rules.map(([a,b])=>`<div class="concept-rule"><strong>${esc(a)}</strong><p>${esc(b)}</p></div>`).join('')}</div>${card.diagram?`<div class="concept-figure"><div class="figure-wrap">${svgFigure(card.diagram,true,true)}</div><p>${esc(card.figureNote||'图形用于说明定理的条件与结论。')}</p></div>`:''}</div><p class="concept-trap"><strong>容易用错：</strong>${esc(card.trap)}</p><p class="concept-bridge"><strong>做题时怎么想到：</strong>${esc(card.bridge)}</p></section><div class="concept-nav"><button data-concept-prev ${r.card===0?'disabled':''}>上个知识点</button><span>第 ${r.card+1} / ${data.cards.length} 个知识点</span><button data-concept-next class="primary">${r.card===data.cards.length-1?'进入3题自测':'下个知识点'}</button></div><section id="review-checks" class="review-checks" aria-label="课前短题自测"><h3>先合上讲解，做3道短题</h3><p class="check-instruction">先独立选择，再看理由。答错后回看对应知识点，也可以继续进入练习。</p>${data.checks.map((c,i)=>{const a=r.answers[i],chosen=Number.isInteger(a?.selected),correct=chosen&&a.selected===c.answer;return `<article class="check-card"><p class="check-question">${i+1}. ${esc(c.q)}</p><div class="check-options">${c.options.map((option,j)=>`<button data-check="${i}" data-option="${j}" ${chosen?'disabled':''} class="${chosen&&a.selected===j?'chosen ':''}${chosen&&j===c.answer?'correct':chosen&&a.selected===j?'wrong':''}">${String.fromCharCode(65+j)}. ${esc(option)}${chosen&&j===c.answer?' ✓':''}</button>`).join('')}</div>${chosen?`<div class="check-feedback" role="status"><strong>${correct?'答对了，继续检查理由。':'这题需要回顾：'+esc(c.review)}</strong><p>${esc(c.why)}</p><button data-revisit="${i}">回看对应知识点</button></div>`:''}</article>`}).join('')}<div class="check-summary" role="status">${reviewSummary(data,r)}</div><div class="review-start"><button class="primary" data-start-practice>开始正式练习 · 第1题</button><button data-reset-checks>重新做3题</button></div><p class="review-note">自测只帮助找薄弱点，不锁定题目。自测选择和练习草稿保存在当前浏览器。</p></section></section>`;
}
function reviewSummary(data,r){const done=data.checks.filter((c,i)=>Number.isInteger(r.answers[i]?.selected)).length,correct=data.checks.filter((c,i)=>r.answers[i]?.selected===c.answer).length;if(!done)return '<p>还未作答。建议先完成3题，确认会用后再进入真题。</p>';const weak=data.checks.filter((c,i)=>Number.isInteger(r.answers[i]?.selected)&&r.answers[i].selected!==c.answer).map(c=>c.review);return `<p>已答 ${done}/3 题，答对 ${correct} 题。${done<3?'还有 '+(3-done)+' 题未答。':''}</p>${weak.length?`<p>建议回看：${esc(weak.join('；'))}。</p>`:done===3?'<p>这3个检查点已通过。进入练习，试着自己写出每一步依据。</p>':''}`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.stage==='review'||b.id==='review-return')openReview();
 if(b.dataset.stage==='check')openReview(true);
 if(b.dataset.stage==='exercise')selectQuestion(state.day,state.index);
 if(b.dataset.concept!==undefined){dayReview().card=Number(b.dataset.concept);persist();renderReview()}
 if(b.hasAttribute('data-concept-prev')){dayReview().card=Math.max(0,dayReview().card-1);persist();renderReview()}
 if(b.hasAttribute('data-concept-next')){if(dayReview().card<REVIEWS[state.day].cards.length-1){dayReview().card++;persist();renderReview()}else $('#review-checks').scrollIntoView({behavior:'smooth',block:'start'})}
 if(b.dataset.check!==undefined){const index=Number(b.dataset.check),selected=Number(b.dataset.option);if(!dayReview().answers[index]){dayReview().answers[index]={selected};persist();renderReview()}}
 if(b.dataset.revisit!==undefined){const c=REVIEWS[state.day].checks[Number(b.dataset.revisit)],index=REVIEWS[state.day].cards.findIndex(x=>x.title===c.review);dayReview().card=Math.max(0,index);persist();renderReview();$('#concept-title').scrollIntoView({behavior:'smooth',block:'start'})}
 if(b.hasAttribute('data-start-practice'))selectQuestion(state.day,0);
 if(b.hasAttribute('data-reset-checks')){dayReview().answers={};persist();renderReview();$('#review-checks').scrollIntoView({behavior:'smooth',block:'start'})}
});

render();
window.geometryClassroom={questions:QUESTIONS,days:DAYS,reviews:REVIEWS,selectDay,openReview,renderReview,svgFigure,selectQuestion,current,getState:()=>({state,progress,reviewData})};
</script></body></html>
