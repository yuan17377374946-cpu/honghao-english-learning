<script>const DAYS=[{name:'周一',date:'11月23日',title:'三角形与三种重要线',summary:'中线 · 高 · 角平分线 · 等腰 · 中垂线'},{name:'周二',date:'11月24日',title:'四边形与辅助线',summary:'判定 · 中点 · 构造 · 面积与坐标'},{name:'周三',date:'11月25日',title:'圆与图形变换',summary:'切线 · 平移 · 折叠 · 旋转'}];
const THEOREMS=[
['中线','连接顶点与对边中点。中线把原三角形分成两个等面积三角形；一般不能直接推出垂直或角平分。'],
['高','从顶点向对边所在直线作垂线，顶点到垂足的线段是高。钝角三角形有两条高在外部；直角三角形的两条高分别与直角边重合。'],
['角平分线','先由定义得到等角。角平分线上的点到角两边的距离相等，距离必须用垂线段表示；角内部一点到两边等距，可反推它在角平分线上。'],
['角平分线与边比','AD平分△ABC的内角A且D在BC上时，BD/DC＝AB/AC。可先比较同高三角形的面积比，再用D到AB、AC等距建立另一组面积比。'],
['等腰三角形三线合一','在AB＝AC的等腰三角形中，顶角A的平分线、底边BC上的中线和高重合。使用前先确认哪两边相等。'],
['斜边中线','直角三角形斜边上的中线等于斜边的一半。斜边中点到三个顶点等距；先确认直角、斜边和中点。'],
['垂直平分线','线上点到线段两端点距离相等；到两个端点等距的点位于该线段的垂直平分线上。垂直与平分两个条件不能漏。'],
['中位线','连接三角形两边中点的线段，平行于第三边且等于第三边的一半。它的两个端点都是中点，与中线不同。'],
['倍长中线','延长中线AD至E，使DE＝AD。原中点条件、新等长条件与对顶角可构造全等，将分散的线段转移到一个三角形中。'],
['四边形判定','常先证平行四边形，再补条件：一个直角或对角线相等可判矩形；邻边相等或对角线垂直可判菱形。矩形加邻边相等，或菱形加直角，可判正方形。'],
['圆的角与弦','同圆或等圆中，同弧或等弧所对的圆周角相等；直径所对圆周角是90°。垂直于弦的直径平分这条弦，常连半径构造直角三角形。'],

['平移、折叠、旋转','先写对应点。平移保留长度和角度，对应线段平行或共线；折痕垂直平分两个不同对应点的连线；旋转保留长度、角度和同中心的旋转角。'],
['面积与坐标','同高三角形面积比等于底边比；相似三角形面积比等于对应边比的平方。坐标差表示长度时检查方向与绝对值；动点求解后检查范围，并排除三个顶点共线、不能组成三角形的情况。']];
const QUESTIONS=[{"id":"practice-lines","day":0,"type":"practice","title":"三种线，各能推出什么？","tags":["条件辨析","中线","高","角平分线"],"stem":["在△ABC中，D在线段BC内部，连接AD。下面三个条件分别单独给出，不相互叠加。"],"asks":["若BD＝DC，能否推出AD⊥BC、∠BAD＝∠CAD、S△ABD＝S△ACD？逐项说明。","若AD⊥BC，能直接得到什么？若AD平分∠BAC呢？"],"hint":["把中线、高、角平分线的定义分别写成符号。","中线分出的两三角形选BD、DC为底时，高是否相同？"],"steps":[{"title":"把中点条件翻译成中线","body":"D在线段BC上，且BD＝DC，所以D是BC的中点，AD是BC边上的中线。","why":"中点和中线的定义。"},{"title":"先指出所用的底与高","body":"记A到直线BC的距离为h。△ABD以BD为底时的高为h；△ACD以DC为底时的高也为h。","why":"BD与DC位于同一直线BC上，两三角形的第三个顶点都是A。"},{"title":"写出面积公式再比较","body":"S△ABD＝BD·h/2，S△ACD＝DC·h/2。因为BD＝DC，所以S△ABD＝S△ACD。","why":"等量代入三角形面积公式。"},{"title":"说明中线不能额外推出什么","body":"只知道AD是中线，不能推出AD⊥BC，也不能推出∠BAD＝∠CAD。等腰三角形底边的三线合一需要AB＝AC这一额外前提。","why":"中线定义不包含垂直或角平分；三线合一有适用条件。"},{"title":"单独处理高的条件","body":"如果另一个情形只给AD⊥BC，则D在BC上，所以∠ADB＝∠ADC＝90°。仅凭这个条件，不能保证BD＝DC。","why":"垂直的定义；两个情形的条件不能混用。"},{"title":"单独处理角平分线的条件","body":"如果只给AD平分∠BAC，则∠BAD＝∠CAD＝∠BAC/2。一般不能因此写BD＝DC；可得的边比见角平分线定理。","why":"内角平分线定义。"}],"answer":"中线：等分对边、等分面积。高：得到垂直和直角。角平分线：得到两个相等的角。","pitfall":"图中AD故意画成斜线，不能用外观替代条件。","diagram":{"points":{"A":[-1,5,-13,-12],"B":[-3,0,-20,23],"C":[5,0,10,23],"D":[1,0,-7,24]},"edges":[["A","B"],["B","C"],["C","A"],["A","D"]],"aux":[]},"time":"6分钟","difficulty":"基础应用","lemmas":["lines","area"]},{"id":"exam-yn-2024-08","day":0,"type":"exam","title":"底边上的高，还是什么线？","year":2024,"region":"云南省","number":"第8题","source":"https://zy.21cnjy.com/20621963","tags":["等腰三角形三线合一","角平分线等距性质","三角形的高"],"difficulty":"基础","time":"10分钟","stem":["等腰△ABC以BC为底边，AF⊥BC，F在BC上。F到直线AB的距离为3。"],"asks":["求F到直线AC的距离，并说明理由。"],"hint":["底边上的高在等腰三角形中还具有什么身份？距离要画成什么线段？"],"steps":[{"title":"先明确两腰与底边","body":"△ABC以BC为底边且是等腰三角形，所以两腰是AB、AC，AB＝AC。AF⊥BC，F为BC上的垂足。","why":"题设；等腰三角形和高的定义。"},{"title":"把高转化为角平分线","body":"在AB＝AC的等腰三角形中，AF是底边BC上的高。由三线合一，AF同时平分顶角A，故∠BAF＝∠FAC。","why":"已核对等腰、底边、高三个使用条件；三线合一推导见本题结论。"},{"title":"把两种距离画成垂线段","body":"过F分别作FM⊥AB于M、FN⊥AC于N。题给F到直线AB的距离为3，即FM＝3；待求距离为FN。","why":"点到直线的距离，是该点到直线的垂线段长度。"},{"title":"写出全等的对应条件","body":"在Rt△AMF与Rt△ANF中，∠AMF＝∠ANF＝90°，∠MAF＝∠NAF，AF为公共斜边，所以△AMF≌△ANF（AAS）。","why":"角平分线给一组锐角相等，另有一组直角和公共边。"},{"title":"用对应边得到答案","body":"由全等得FM＝FN。代入FM＝3，得到FN＝3，因此F到直线AC的距离为3。","why":"全等三角形对应边相等；这也是角平分线等距性质的本题证明。"}],"answer":"3。","pitfall":"到直线的距离是垂线段长度，不能把FA、FB或FC当作该距离。","diagram":{"points":{"A":[0,5],"B":[-3.75,0],"C":[3.75,0],"F":[0,0],"M":[-2.4,1.8,-22,-5,"aux"],"N":[2.4,1.8,10,-5,"aux"]},"edges":[["A","B"],["B","C"],["C","A"],["A","F"]],"aux":[["F","M"],["F","N"]],"right":[{"p":["A","F","B"]},{"p":["F","M","A"],"aux":true},{"p":["F","N","A"],"aux":true}],"equal":[["A","B",1],["A","C",1]]},"presentation":"原选择题改为问答呈现，条件与求解目标保留。","lemmas":["isosceles","angle-distance"]},{"id":"practice-median-area","day":0,"type":"practice","title":"两层中点，怎样比较面积？","tags":["中线","公共高","面积"],"stem":["△ABC中，AD为BC边上的中线，E为AD的中点，连接BE、CE。已知S△ABC＝48。"],"asks":["求S△ABE。","求S△BEC，并解释每一次面积相等的依据。"],"hint":["先用BC的中点把总面积分成两半。","比较△ABE和△BDE时，要改选AE、ED为底。"],"steps":[{"title":"第一层中点先给等底","body":"AD是BC边上的中线，所以BD＝DC。△ABD、△ACD选BD、DC为底时，从A到BC的高相同，因此两部分面积相等。","why":"中线定义；同高三角形的面积比等于底边比。"},{"title":"由总面积求第一层面积","body":"△ABD与△ACD拼成△ABC，故S△ABD＋S△ACD＝48。两者相等，所以S△ABD＝S△ACD＝48/2＝24。","why":"无重叠的面积相加。"},{"title":"第二层必须换底线","body":"E为AD中点，所以AE＝ED。比较△ABE和△BDE时，以AE、ED为底；两者从B到直线AD的高相同，因此S△ABE＝S△BDE。","why":"同底线上的等底、同高关系；这次公共高来自顶点B。"},{"title":"求出第一问","body":"△ABE与△BDE拼成△ABD，所以它们的面积之和是24，且相等，得到S△ABE＝S△BDE＝12。","why":"上一部分的面积值与等分关系。"},{"title":"在另一侧重复第二层比较","body":"在△ACD内，△ACE与△CDE同样以AE、ED为底，从C到AD的高相同；AE＝ED，故两者面积相等，各为24/2＝12。","why":"这次公共高来自顶点C。"},{"title":"拼出目标△BEC","body":"D在线段BC上，因此△BEC由△BDE与△CDE组成。S△BEC＝12＋12＝24。","why":"目标三角形内部的面积相加；无重叠。"}],"answer":"S△ABE＝12；S△BEC＝24。","pitfall":"每次说等面积时，都要指出所选底和对应的公共高。","diagram":{"points":{"A":[-1,6,-12,-12],"B":[-4,0,-20,23],"C":[6,0,8,23],"D":[1,0,-5,24],"E":[0,3,10,-5]},"edges":[["A","B"],["B","C"],["C","A"],["A","D"],["B","E"],["C","E"]],"aux":[],"equal":[["B","D",1],["D","C",1],["A","E",2],["E","D",2]],"fill":[{"points":["B","E","C"],"color":"#d5eee6"}]},"time":"8分钟","difficulty":"基础应用","lemmas":["area"]},{"id":"exam-gx-2023-21","day":0,"type":"exam","title":"30°条件与斜边中线","year":2023,"region":"广西壮族自治区","number":"第21题","source":"https://kmath.cn/math/Papername.aspx?paperid=476&papername=广西壮族自治区2023年中考数学试卷","tags":["含30°角的直角三角形","斜边中线","勾股定理","尺规作图"],"difficulty":"基础至中等","time":"10分钟","stem":["△ABC中，∠A＝30°，∠B＝90°。"],"asks":["在斜边AC上作点O，使AO＝BC，并连接OB；保留尺规作图痕迹。","若OB＝2，求AB。"],"hint":["先用30°所对直角边与斜边的关系，判断作出的点O是什么点。"],"steps":[{"title":"先按要求完成尺规作图","body":"以A为圆心，以线段BC的长为半径作弧，与线段AC交于O，连接OB。保留圆弧痕迹。作图直接给出AO＝BC。","why":"尺规转移线段长度；此时还不能直接说O是中点。"},{"title":"认准30°的对边和斜边","body":"∠B＝90°，所以AC是斜边。∠A＝30°，它的对边是BC。由30°直角三角形性质，BC＝AC/2。","why":"30°所对直角边等于斜边的一半；完整推导见本题结论。"},{"title":"证明作出的O是斜边中点","body":"AO＝BC＝AC/2。又O在线段AC上，OC＝AC－AO＝AC/2，所以AO＝OC，O是AC的中点。","why":"线段和；中点定义。"},{"title":"核对斜边中线性质的条件","body":"△ABC在B处为直角，O是斜边AC的中点，因此BO是斜边上的中线，BO＝AC/2。","why":"直角三角形斜边中线性质，不能用于任意中线。"},{"title":"由OB求两条已知边","body":"OB＝2，且OB＝AC/2，故AC＝4；又BC＝AC/2，所以BC＝2。","why":"等式代入。"},{"title":"勾股定理逐项代入","body":"在Rt△ABC中，AB²＋BC²＝AC²，所以AB²＝AC²－BC²＝4²－2²＝16－4＝12。","why":"勾股定理；AC为斜边。"},{"title":"开平方并取正值","body":"AB为线段长度，AB＞0，所以AB＝√12＝√(4×3)＝2√3。","why":"非负平方根及根式化简。"}],"answer":"（1）以A为圆心、BC长为半径作弧，与AC交于O，连接OB。（2）AB＝2√3。","pitfall":"不能仅因为图上O看着在中间就认定为中点；必须先由AO＝BC＝AC/2证明。","diagram":{"points":{"A":[0,0],"B":[3.4641016151,0],"C":[3.4641016151,2],"O":[1.7320508076,1,5,-10,"aux"]},"edges":[["A","B"],["B","C"],["C","A"]],"aux":[["O","B"]],"right":[{"p":["A","B","C"]}],"labels":[{"at":[0.7,0.15],"text":"30°"}]},"presentation":"按原题数学条件整理，几何图按题意重绘。","lemmas":["right30","hypotenuse-median"]},{"id":"practice-bisector-ratio","day":0,"type":"practice","title":"角平分线为什么能列边比？","tags":["角平分线定理","面积推导"],"stem":["△ABC中，AB＝8，AC＝12，BC＝15。AD平分∠BAC，D在线段BC上。"],"asks":["先用面积关系说明BD/DC＝AB/AC。","求BD、DC。"],"hint":["从D向AB、AC分别作垂线，垂线段的长有什么关系？","同样两个三角形，换一组底和高表示面积。"],"steps":[{"title":"把角平分线转成两段等距","body":"过D作DM⊥AB、DN⊥AC，垂足分别为M、N。因为D在∠BAC的内部角平分线上，所以DM＝DN，记这个共同长度为d。","why":"角平分线等距性质；M、N为垂足。"},{"title":"第一种选底：选AB与AC","body":"S△ABD＝AB·d/2，S△ACD＝AC·d/2。两式相除，得S△ABD/S△ACD＝(AB·d/2)/(AC·d/2)＝AB/AC。","why":"三角形面积公式；两条对应高相等。"},{"title":"第二种选底：选BD与DC","body":"记A到直线BC的距离为h。S△ABD＝BD·h/2，S△ACD＝DC·h/2，因此两面积之比＝BD/DC。","why":"D在线段BC上；两三角形同高。"},{"title":"同一个面积比得到边比","body":"以上两式左边是同一对三角形的面积比，所以BD/DC＝AB/AC。这就完成了本题所需角平分线定理的推导。","why":"等量传递；使用条件为内角平分线与对边线段相交。"},{"title":"代入数值并设份数","body":"BD:DC＝8:12＝2:3。设BD＝2k、DC＝3k，k＞0。又D在线段BC上，BD＋DC＝BC＝15。","why":"比例的对应关系和线段和。"},{"title":"解出两段并核对","body":"2k＋3k＝15，所以5k＝15、k＝3。BD＝6、DC＝9；核对6＋9＝15，6:9＝8:12，均符合题意。","why":"方程求解及结果检验。"}],"answer":"BD＝6，DC＝9。","pitfall":"角平分线一般不平分对边；列比例前核对相邻边与对边分段的对应顺序。","diagram":{"points":{"A":[4.833333333333333,6.374863832968426,-10,-12],"B":[0,0,-20,23],"C":[15,0,9,23],"D":[6,0,-5,24],"M":[2.1901041666666665,2.888610174313818,-25,-3,"aux"],"N":[8.539930555555555,4.050694727198687,10,-3,"aux"]},"edges":[["A","B"],["B","C"],["C","A"],["A","D"]],"aux":[["D","M"],["D","N"]],"labels":[{"at":[1.7666666666666666,3.187431916484213],"text":"8"},{"at":[10.516666666666666,3.187431916484213],"text":"12"},{"at":[6.7,-0.8],"text":"BC＝15"}]},"time":"10分钟","difficulty":"基础应用","lemmas":["angle-distance","area","angle-ratio"]},{"id":"exam-suzhou-2024-20","day":0,"type":"exam","title":"从作弧痕迹到等长与垂直","year":2024,"region":"江苏省苏州市","number":"第20题","source":"https://zhekaotong.cn/papers/bee12752-4920-4599-b05e-e86af5c34088","tags":["等腰三角形","垂直平分线","三线合一","30°直角三角形","全等作为工具"],"difficulty":"中等","time":"10分钟","stem":["△ABC中AB＝AC。以B、C为圆心，用相同且大于BC一半的半径作弧，取与A位于BC异侧的交点D；连接BD、CD、AD，AD与BC交于E。"],"asks":["证明△ABD≌△ACD。","已知BD＝2，∠BDC＝120°，求BC。"],"hint":["作弧能直接给哪一组等长？A和D到B、C均等距，又能说明AD是什么直线？"],"steps":[{"title":"说明作弧留下的等长","body":"D在以B、C为圆心且半径相同的两条圆弧上，因此BD和CD都等于这个作图半径，BD＝CD。","why":"同半径作弧；不是凭图观察。"},{"title":"逐条列出SSS的三组边","body":"在△ABD和△ACD中：AB＝AC（已知），BD＝CD（作弧），AD＝AD（公共边）。所以△ABD≌△ACD（SSS），对应A↔A、B↔C、D↔D。","why":"三边对应相等。"},{"title":"用两个等距点确定中垂线","body":"AB＝AC说明A到B、C等距；DB＝DC说明D到B、C等距。A、D为不同的点，故直线AD是BC的垂直平分线。","why":"中垂线判定；两点确定直线。"},{"title":"把交点E的性质写完整","body":"E为直线AD与BC的交点，所以BE＝CE，DE⊥BC，∠BED＝90°。D、E、A共线。","why":"垂直平分线同时满足垂直和过中点。"},{"title":"在正确的等腰三角形内平分顶角","body":"BD＝CD，所以△BDC以BC为底边。DE为该底边上的高，由三线合一，∠BDE＝∠EDC＝120°/2＝60°。","why":"等腰三角形底边上的高也是顶角平分线。"},{"title":"求出30°并用半斜边","body":"Rt△BDE中，∠DBE＝180°－90°－60°＝30°。BD＝2为斜边，所以30°对边DE＝BD/2＝1。","why":"内角和；30°直角三角形性质。"},{"title":"勾股求半条底边","body":"BE²＝BD²－DE²＝2²－1²＝3；BE＞0，所以BE＝√3。","why":"在直角三角形BDE中用勾股定理。"},{"title":"从半边还原整边","body":"BE＝CE，且E在线段BC上，所以BC＝BE＋CE＝2BE＝2√3。","why":"中点等长与线段相加。"}],"answer":"（1）△ABD≌△ACD（SSS）；（2）BC＝2√3。","pitfall":"第二问的60°应由等腰三角形的高平分顶角推出；不能看到一条中间线就直接把120°除以2。","diagram":{"points":{"A":[0,3],"B":[-1.7320508076,0],"C":[1.7320508076,0],"D":[0,-1,4,27],"E":[0,0,8,-7]},"edges":[["A","B"],["B","C"],["C","A"],["B","D"],["C","D"],["A","D"]],"aux":[],"equal":[["A","B",1],["A","C",1],["B","D",2],["C","D",2]],"labels":[{"at":[0,-0.75],"text":"120°","dx":10,"dy":-4}]},"presentation":"按原题数学条件整理，几何图按题意重绘。 本页另用文字写明原图采用的交点位置，避免仅凭图形猜测。","lemmas":["perpendicular-bisector","isosceles","right30"]},{"id":"exam-meishan-2024-07","day":0,"type":"exam","title":"不分别求两段，能求周长吗？","year":2024,"region":"四川省眉山市","number":"第7题","source":"https://kaosj.com/papers/2024/07/2024-zhongkao-math-sichuan-meishan-a180d803ce-paper/","tags":["垂直平分线","尺规作图痕迹","线段长度转移","周长"],"difficulty":"基础至中等","time":"10分钟","stem":["△ABC中AB＝AC＝6，BC＝4。以A、B为圆心，用同一半径作相交圆弧，交点为E、F；直线EF交AC于D，连接BD。"],"asks":["求△BCD的周长，并说明作图痕迹起了什么作用。"],"hint":["不要先求BD和CD各有多长。先看看作图痕迹给了哪一组等长，再把周长中的两段拼成整边。"],"steps":[{"title":"由圆弧分别确认两个等距点","body":"E在以A、B为圆心、同一半径作出的圆弧上，所以EA＝EB；同理FA＝FB。","why":"同半径作弧的长度关系。"},{"title":"从两个点推出整条中垂线","body":"EA＝EB、FA＝FB，因此E、F都在AB的垂直平分线上。E≠F，两点确定直线，所以EF就是AB的垂直平分线。","why":"线段垂直平分线判定及两点定线。"},{"title":"交点D给出一组新等长","body":"D在EF上，所以D到A、B两端点等距，即DA＝DB。","why":"垂直平分线上的点到线段两端点距离相等。"},{"title":"把周长式写出再替换","body":"△BCD的周长L＝BD＋DC＋BC。用BD＝AD替换，得L＝AD＋DC＋BC。","why":"周长定义与等量替换。"},{"title":"利用D的位置合并线段","body":"按题图，D在线段AC内部，因此AD＋DC＝AC。L＝AC＋BC＝6＋4＝10。","why":"线段相加必须使用正确的位置关系。"}],"answer":"△BCD的周长为10。","pitfall":"只能在D在线段AC上时直接写AD＋DC＝AC；还要先说明EF为什么是中垂线。","diagram":{"points":{"A":[0,5.6568542495],"B":[-2,0],"C":[2,0],"D":[1.2857142857,2.0203050891],"E":[-3.4944382578,3.7103442284],"F":[1.4944382578,1.9465100211]},"edges":[["A","B"],["B","C"],["C","A"],["B","D"],["E","F"]],"aux":[],"labels":[{"at":[-1.2,3.6],"text":"6"},{"at":[1.6,3.7],"text":"6"},{"at":[-0.2,-0.7],"text":"4"}]},"presentation":"原选择题改为解释周长的问答题，原数值条件保留。","lemmas":["perpendicular-bisector"]},{"id":"practice-triangle-exit","day":0,"type":"practice","title":"独立检验：中线何时也是高？","tags":["等腰三角形","三线合一","证明后计算"],"stem":["△ABC中，AB＝AC＝10，BC＝12，D是BC的中点。"],"asks":["证明AD⊥BC，且AD平分∠BAC。","求AD和△ABC的面积。"],"hint":["先找两侧三角形的三组对应边。","全等得到两个相等的邻补角后，角度是多少？"],"steps":[{"title":"先列三组对应边","body":"D是BC中点，所以BD＝DC。已知AB＝AC，另有AD＝AD，三组边分别对应相等。","why":"中点、等腰条件与公共边。"},{"title":"写出全等及对应关系","body":"△ABD≌△ACD（SSS），对应关系A↔A、B↔C、D↔D。","why":"三边全等判定。"},{"title":"得到顶角被平分","body":"由全等得∠BAD＝∠CAD，所以AD平分∠BAC。","why":"全等对应角相等；角平分线定义。"},{"title":"由等角加邻补推出直角","body":"全等还给∠ADB＝∠ADC。B、D、C共线，两角之和为180°，所以每个角等于90°，即AD⊥BC。","why":"相等的两个邻补角都是直角。"},{"title":"求出半条底边","body":"BD＝DC＝BC/2＝12/2＝6。△ABD中∠ADB＝90°，AB＝10是斜边。","why":"中点等分对边；先确认直角三角形。"},{"title":"勾股求高，再求面积","body":"AD²＝AB²－BD²＝10²－6²＝100－36＝64，所以AD＝8。以BC为底、AD为高，S△ABC＝BC·AD/2＝12×8/2＝48。","why":"勾股定理、长度取正值及对应底高的面积公式。"}],"answer":"AD⊥BC，AD平分顶角；AD＝8，S△ABC＝48。","pitfall":"等腰、中点条件都用上后才有三线合一，不能仅凭AD是中线就说它是高。","diagram":{"points":{"A":[0,8,-8,-14],"B":[-6,0,-22,22],"C":[6,0,10,22],"D":[0,0,-6,24]},"edges":[["A","B"],["B","C"],["C","A"],["A","D"]],"aux":[],"equal":[["A","B",1],["A","C",1],["B","D",2],["D","C",2]],"labels":[{"at":[-3.5,4.4],"text":"10"},{"at":[3.2,4.4],"text":"10"},{"at":[-1,-0.8],"text":"BC＝12"}]},"time":"10分钟","difficulty":"基础应用","lemmas":["isosceles","area"]},{"id":"practice-quad-check","day":1,"type":"practice","title":"先判图形，再使用性质","tags":["四边形判定","缺少前提"],"stem":["分别判断下面三个说法。可用反例说明错误，也可补一个足够的前提。"],"asks":["任意四边形的两条对角线相等，它一定是矩形。","任意四边形的两条对角线垂直，它一定是菱形。","一组对边平行且相等的四边形，一定是平行四边形。"],"hint":["前两句若先知道它是平行四边形，结论会怎样？","第三句中的平行与相等必须指同一组对边。"],"steps":[{"title":"第①句：用具体等腰梯形反驳","body":"取A(−3,3)、B(3,3)、C(5,0)、D(−5,0)。AB∥CD，AB＝6、CD＝10，是等腰梯形。AC²＝8²＋3²＝73，BD²＝(−8)²＋3²＝73，所以两对角线相等；但它不是平行四边形，不能是矩形。","why":"一个满足条件而不满足结论的反例即可否定命题。"},{"title":"第①句：补全能使用的判定","body":"如果补充ABCD先是平行四边形，再给AC＝BD，就能由“对角线相等的平行四边形是矩形”判定。","why":"矩形判定的前提。"},{"title":"第②句：给出垂直但非菱形的反例","body":"另取A(0,3)、B(−2,0)、C(0,−1)、D(2,0)。AC竖直、BD水平，所以AC⊥BD；但AB²＝13、BC²＝5，邻边不等，四边形不是菱形。","why":"两对角线垂直不足以使四边相等。"},{"title":"第②句：补齐前提","body":"如果先给ABCD为平行四边形，再给AC⊥BD，就能判定它为菱形。","why":"对角线垂直的平行四边形是菱形。"},{"title":"第③句：明确同一组对边","body":"设四边形ABCD满足AB∥CD、AB＝CD，连接AC。因为AB∥CD，所以∠BAC＝∠DCA。","why":"必须是同一组对边AB、CD同时平行且相等。"},{"title":"用SAS补出另一组平行","body":"在△BAC与△DCA中，BA＝DC、AC＝CA、夹角∠BAC＝∠DCA，所以两三角形全等（SAS），得∠BCA＝∠DAC。","why":"两边及其夹角对应相等；全等对应角相等。"},{"title":"完成第三句的判定","body":"∠BCA＝∠DAC是直线BC、AD被AC截出的内错角，因此BC∥AD。结合AB∥CD，两组对边分别平行，故ABCD是平行四边形。第③句正确。","why":"内错角相等，两直线平行；平行四边形定义。"}],"answer":"①错误；②错误；③正确。","pitfall":"先分清已知形状与待证形状；未证明矩形或菱形前，不能先用它们的专属性质。","diagram":{"points":{"A":[-3,3,-20,-10],"B":[3,3,8,-10],"C":[5,0,8,22],"D":[-5,0,-25,22]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"]],"aux":[["A","C"],["B","D"]],"labels":[{"at":[-1.7,1.4],"text":"等腰梯形"}]},"time":"6分钟","difficulty":"基础应用","lemmas":["parallelogram","rectangle","rhombus"]},{"id":"exam-cqb2024-21","day":1,"type":"exam","title":"矩形中的中垂线与菱形","year":2024,"region":"重庆B卷","number":"第21题","source":"https://kaosj.com/papers/2024/07/2024-zhongkao-math-chongqing-1ecbaa81ce-paper/","tags":["垂直平分线","全等应用","菱形判定","证明填空"],"difficulty":"中等应用","time":"12分钟","stem":["矩形ABCD中，O为对角线AC的中点。过O作AC的垂线，分别交AB、CD于E、F；连接AF、CE。"],"asks":["证明四边形AECF为菱形。","选做：原矩形改为平行四边形，且上述交点仍存在时，结论是否仍成立？"],"hint":["题目先让你补出全等，最终却要证菱形：全等会给哪一组对角线被平分？","平行四边形的对角线互相平分；菱形还需要再增加什么？"],"steps":[{"title":"列出平行线与中点条件","body":"矩形ABCD有AB∥CD。E在AB上、F在CD上，所以AE∥CF。O是AC中点，故AO＝CO，且A、O、C共线，E、O、F共线。","why":"矩形性质；题设交点和中点。"},{"title":"分别找两组对应角","body":"AE∥CF，以EF为截线，∠CFO＝∠AEO；以AC为截线，∠OCF＝∠OAE。","why":"平行线的内错角相等，按题图的射线位置对应。"},{"title":"按AAS写出全等","body":"在△CFO与△AEO中，有上述两组对应角相等，且CO＝AO，所以△CFO≌△AEO（AAS）。对应关系C↔A、F↔E、O↔O。","why":"两角及其中一角的对边对应相等。"},{"title":"全等给第二条对角线中点","body":"由全等得FO＝EO。原来已有AO＝CO，所以O同时平分AC与EF。","why":"全等三角形对应边相等。"},{"title":"先证明目标图形是平行四边形","body":"四边形按A—E—C—F顺序命名，它的对角线是AC和EF。两对角线互相平分，故AECF为平行四边形。","why":"平行四边形判定，注意图形的顶点顺序。"},{"title":"再补垂直判菱形","body":"题设EF⊥AC。AECF已是平行四边形，且对角线互相垂直，所以AECF是菱形。","why":"菱形判定，平行四边形前提已证出。"},{"title":"延伸时逐项检查条件","body":"把外层矩形改成平行四边形，AB∥CD仍成立，O为AC中点、EF⊥AC等条件也保留，因此上面每一步仍成立，结论仍是菱形；须保证题设的交点存在且按图构成所述四边形。","why":"证明只用到外层的一组对边平行，没有用到外层直角。"}],"answer":"（1）四边形AECF是菱形；（2）原图改为平行四边形且上述交点存在时，结论仍成立。","pitfall":"四边形顺序是AECF，AC与EF才是它的两条对角线；仅有对角线垂直不能判任意四边形为菱形，必须先证明平行四边形；延伸猜想不是所有垂线一定交边内；保留图中相交条件。","diagram":{"points":{"A":[0,4],"B":[8,4],"C":[8,0],"D":[0,0],"O":[4,2],"E":[5,4],"F":[3,0]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"],["E","F"],["A","F"],["C","E"]],"aux":[],"right":[{"p":["A","O","E"]}],"equal":[["A","O",1],["O","C",1]]},"presentation":"原题为尺规作图与证明填空；此处整理条件，调整为完整证明及延伸问答。","lemmas":["parallelogram","rhombus"]},{"id":"exam-bj2025-20","day":1,"type":"exam","title":"中位线连接矩形证明","year":2025,"region":"北京","number":"第20题","source":"https://zy.21cnjy.com/23366730","tags":["三角形中位线","矩形判定","作高","勾股定理"],"difficulty":"中等应用","time":"14分钟","stem":["D、E分别为△ABC的AB、AC中点。从D向BC作垂线，垂足为F；G在DE的延长线上，且DG＝FC。点的位置按题图：B、F、C依次在线段BC上，D、E、G依次共线。"],"asks":["证明四边形DFCG是矩形。","若∠B＝45°，DF＝3，DG＝5，求BC、AC。"],"hint":["先看D、E这两个中点能给哪一条平行关系。","证明矩形可以先证明平行四边形，再补一个直角。","第二问可过A作BC上的高；中点让这条高与DF形成2倍关系。"],"steps":[{"title":"两个中点先给中位线","body":"D、E分别为AB、AC的中点，所以DE是△ABC的中位线，DE∥BC。","why":"三角形中位线定理，两个中点条件都满足。"},{"title":"确认目标四边形的一组对边","body":"D、E、G共线，所以DG∥BC；F、C在BC上，因此DG∥FC。又题给DG＝FC。","why":"共线转移平行关系；一组对边同时平行且相等。"},{"title":"先判定平行四边形","body":"在按D—F—C—G顺序命名的四边形中，DG与FC是对边，且平行、相等，所以DFCG是平行四边形。","why":"一组对边平行且相等的判定。"},{"title":"用直角升级为矩形","body":"DF⊥BC，而FC在BC上，所以∠DFC＝90°。平行四边形DFCG有一个直角，故它是矩形。","why":"矩形判定。"},{"title":"第二问先确定BF","body":"D在BA上，F在射线BC上，所以∠DBF＝∠ABC＝45°。△BDF中∠BFD＝90°，故∠BDF＝45°，两直角边BF＝DF＝3。","why":"内角和及等角对等边；等腰直角三角形结论。"},{"title":"求BC并说明相加位置","body":"DG＝FC＝5。按题图F在线段BC内部，所以BC＝BF＋FC＝3＋5＝8。","why":"题设等长及线段相加。"},{"title":"为AC补一条高","body":"过A作AH⊥直线BC于H。DF⊥BC，所以DF∥AH；D在AB上，B、F、H共线，得到∠BFD＝∠BHA＝90°、∠DBF＝∠ABH。","why":"同垂直得平行；共线与两组对应角。"},{"title":"写相似并核对对应边","body":"△BDF∽△BAH（AA），对应B↔B、D↔A、F↔H。因此BD/BA＝BF/BH＝DF/AH。D为AB中点，BD/BA＝1/2。","why":"相似三角形对应边成比例。"},{"title":"求出高和水平分段","body":"由BF/BH＝1/2，得BH＝2BF＝6；由DF/AH＝1/2，得AH＝2DF＝6。BC＝8且BH＝6，故H在线段BC上，CH＝8－6＝2。","why":"相似比、长度代入和位置检查。"},{"title":"最后用勾股求AC","body":"在Rt△AHC中，AC²＝AH²＋CH²＝6²＋2²＝40。AC＞0，所以AC＝√40＝2√10。","why":"AH⊥HC；勾股定理及根式化简。"}],"answer":"（1）四边形DFCG是矩形；（2）BC＝8，AC＝2√10。","pitfall":"不要未证矩形就直接使用矩形性质；G不是DE的中点；DG等于FC，而不是DE等于FC；求AC时的直角三角形是AHC，水平直角边是CH＝2。","diagram":{"points":{"A":[6,6],"B":[0,0],"C":[8,0],"D":[3,3,-26,0],"E":[7,3,-12,-12],"F":[3,0],"G":[8,3,10,-9],"H":[6,0,-10,25,"aux"]},"edges":[["A","B"],["A","C"],["B","C"],["D","G"],["D","F"],["C","G"]],"aux":[["A","H"]],"right":[{"p":["D","F","B"]},{"p":["A","H","B"],"aux":true}]},"presentation":"按原题数学条件整理，几何图按题意重绘。 本页另用文字写明原图采用的交点位置，避免仅凭图形猜测。","lemmas":["midsegment","parallelogram","rectangle","right45","similar-area"]},{"id":"practice-double-median","day":1,"type":"practice","title":"为什么要把中线延长一倍？","tags":["倍长中线","构造全等","线段转移"],"stem":["△ABC中，D是BC的中点。延长AD至E，使DE＝AD，连接BE。"],"asks":["证明BE＝AC。","进一步证明2AD＜AB＋AC，并说明辅助线起了什么作用。"],"hint":["△BDE和△CDA有哪些对应条件？","把2AD看成哪一条完整线段？"],"steps":[{"title":"把原条件和作法分别写清","body":"D是BC的中点，所以BD＝DC。延长AD至E且DE＝AD，所以A、D、E依次共线，D是AE中点。","why":"中点与倍长作法。"},{"title":"找到夹在等边之间的角","body":"直线BC和AE在D相交，∠BDE与∠CDA为对顶角，所以它们相等。","why":"对顶角相等，且它是所用两组等边的夹角。"},{"title":"写出全等及边的对应","body":"BD＝DC、DE＝DA、∠BDE＝∠CDA，所以△BDE≌△CDA（SAS）；对应B↔C、D↔D、E↔A，故BE＝CA。","why":"两边及其夹角对应相等；全等对应边。"},{"title":"把2AD换成整段AE","body":"A、D、E依次共线，AE＝AD＋DE＝2AD。","why":"线段相加和DE＝AD。"},{"title":"在一个三角形里使用不等式","body":"在△ABE中，AE＜AB＋BE。这里三条线段都属于同一个三角形，才能直接使用两边之和大于第三边。","why":"三角形三边关系。"},{"title":"把辅助线结果代回目标","body":"把AE＝2AD、BE＝AC代入，得2AD＜AB＋AC。辅助线同时把“二倍中线”变成整边AE，把AC转移成BE。","why":"等量替换，完成目标不等式。"}],"answer":"BE＝AC；2AD＜AB＋AC。倍长把中线和分散的边转移到△ABE中。","pitfall":"不要见中点就机械倍长；应先看目标是否需要把长度转移到同一个三角形。","diagram":{"points":{"A":[-1,5,-12,-12],"B":[-4,0,-23,20],"C":[4,0,10,20],"D":[0,0,10,-5],"E":[1,-5,10,21,"aux"]},"edges":[["A","B"],["B","C"],["C","A"],["A","D"]],"aux":[["D","E"],["B","E"]],"equal":[["B","D",1],["D","C",1]]},"time":"8分钟","difficulty":"基础应用","lemmas":["double-median"]},{"id":"exam-yn2024-24","day":1,"type":"exam","title":"中点四边形反推菱形","year":2024,"region":"云南","number":"第24题","source":"https://kaosj.com/papers/2024/07/2024-zhongkao-math-yunnan-f120a2e6b5-paper/","tags":["三角形中位线","菱形判定","面积","完全平方公式"],"difficulty":"中等应用","time":"15分钟","stem":["四边形ABCD满足AB∥CD、AD∥BC。E、F、G、H依次是AB、BC、CD、DA的中点，且EFGH为矩形。"],"asks":["证明ABCD是菱形。","若矩形EFGH周长为22，ABCD面积为10，求AB。"],"hint":["观察中点小矩形的边分别平行于原图哪两条线。","第二问不必分别求出两条对角线；先求它们的和与积，再求平方和。"],"steps":[{"title":"先确认外层的图形身份","body":"AB∥CD、AD∥BC，两组对边分别平行，所以ABCD是平行四边形。连接AC、BD交于O。","why":"平行四边形定义。"},{"title":"第一条中位线对应AC","body":"H、G分别是AD、CD的中点。在△ADC中，HG为中位线，所以HG∥AC，HG＝AC/2。","why":"三角形中位线定理。"},{"title":"第二条中位线对应BD","body":"F、G分别是BC、CD的中点。在△BCD中，FG为中位线，所以FG∥BD，FG＝BD/2。","why":"三角形中位线定理。"},{"title":"把内层直角转成对角线垂直","body":"EFGH为矩形，所以HG⊥FG；HG∥AC、FG∥BD，因此AC⊥BD。","why":"对应平行直线间的夹角相同。"},{"title":"带着前提判定外层菱形","body":"ABCD已经是平行四边形，现在又有AC⊥BD，因此ABCD是菱形。","why":"垂直对角线的平行四边形是菱形；不能遗漏第一步。"},{"title":"用周长求两对角线之和","body":"矩形EFGH周长为22，所以2(HG＋FG)＝22。代入HG＝AC/2、FG＝BD/2，得AC＋BD＝22。","why":"矩形周长及中位线半长关系。"},{"title":"用面积求两对角线之积","body":"菱形面积S＝AC·BD/2。已知S＝10，所以AC·BD＝20；公式的四个直角三角形推导见本题结论。","why":"菱形面积与对角线关系。"},{"title":"展开平方和，避免分别求两条对角线","body":"(AC＋BD)²＝AC²＋2AC·BD＋BD²，因此AC²＋BD²＝22²－2×20＝484－40＝444。","why":"完全平方公式，移项时保留2倍乘积。"},{"title":"在小直角三角形中求边长","body":"菱形对角线互相垂直平分，故AO＝AC/2、BO＝BD/2、∠AOB＝90°。AB²＝AO²＋BO²＝(AC²＋BD²)/4＝444/4＝111。","why":"菱形对角线性质和勾股定理。"},{"title":"开方并写出最终结论","body":"AB为正长度，所以AB＝√111。这里无需分别解出AC和BD。","why":"长度取正平方根。"}],"answer":"（1）四边形ABCD是菱形；（2）AB＝√111。","pitfall":"中位线是对应第三边的一半，不能丢掉1/2；EFGH为矩形并不能无条件推出外层任意四边形为菱形；还需题给两组对边平行；菱形面积是对角线乘积的一半。","diagram":{"points":{"A":[-6,0],"B":[0,3],"C":[6,0],"D":[0,-3],"E":[-3,1.5],"F":[3,1.5],"G":[3,-1.5],"H":[-3,-1.5],"O":[0,0,9,-6,"aux"]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["E","F"],["F","G"],["G","H"],["H","E"]],"aux":[["A","C"],["B","D"]]},"presentation":"保留原题条件与两问。采用一般位置示意，不按第2问数值比例绘制。","lemmas":["midsegment","midpoint-quadrilateral","rhombus","rhombus-area"]},{"id":"practice-coordinate-area","day":1,"type":"practice","title":"坐标、面积与点的位置范围","tags":["坐标","面积","等腰分类"],"stem":["矩形ABCD中，A(0，0)、B(8，0)、C(8，6)、D(0，6)。P在AD内部，设P(0，t)，所以0＜t＜6。图中示意t＝3的位置。"],"asks":["用t表示S△ABP；若S△ABP＝16，求t。","选做：当△PBC为等腰三角形时，求所有可能的t。"],"hint":["AB为底时，P到AB的距离就是t。","等腰需要分别检查PB＝PC、PB＝BC、PC＝BC。"],"steps":[{"title":"把坐标转成底与高","body":"A(0,0)、B(8,0)，所以AB在x轴上且AB＝8。P(0,t)且0＜t＜6，所以P到直线AB的距离为t。","why":"水平线段长度与点到x轴的距离。"},{"title":"写面积表达式并解第一问","body":"S△ABP＝AB·t/2＝8t/2＝4t。面积为16时，4t＝16，得t＝4；检查0＜4＜6，符合P在AD内部。","why":"三角形面积公式及范围检查。"},{"title":"选做先把三条边平方写出","body":"BC＝6。PB²＝(8－0)²＋(0－t)²＝64＋t²；PC²＝(8－0)²＋(6－t)²＝64＋(6－t)²。","why":"坐标差构造直角三角形；勾股定理。"},{"title":"分类一：检查PB＝BC","body":"若PB＝BC，则64＋t²＝36，得t²＝−28，实数范围内不可能，所以这一类没有解。","why":"实数的平方非负。"},{"title":"分类二：检查PC＝BC","body":"若PC＝BC，则64＋(6－t)²＝36，得(6－t)²＝−28，也不可能，所以这一类没有解。","why":"实数的平方非负。"},{"title":"分类三：解PB＝PC","body":"若PB＝PC，则64＋t²＝64＋(6－t)²。展开右侧为64＋36－12t＋t²，约去64和t²，得12t＝36，所以t＝3。","why":"正长度相等可等价转为平方相等；方程展开。"},{"title":"检查取值范围，以及三个顶点是否共线","body":"t＝3满足0＜t＜6。P的横坐标为0，B、C的横坐标为8，所以P、B、C三个点不在同一直线上，能组成三角形。三种等腰可能已全部检查，唯一解为t＝3。","why":"取值范围、非共线检查及分类完整性。"}],"answer":"S△ABP＝4t；面积为16时t＝4；选做等腰条件下t＝3。","pitfall":"等腰不能只列一组相等就结束；其他两种要判断为什么不可能。","diagram":{"points":{"A":[0,0,-23,21],"B":[8,0,10,21],"C":[8,6,10,-9],"D":[0,6,-22,-10],"P":[0,3,-24,6]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["P","B"],["P","C"]],"aux":[],"fill":[{"points":["A","B","P"],"color":"#d5eee6"}],"labels":[{"at":[3,-0.7],"text":"8"},{"at":[8.5,2.6],"text":"6"}]},"time":"12分钟","difficulty":"基础应用","lemmas":["coordinates","area"]},{"id":"exam-bj2025-15","day":1,"type":"exam","title":"正方形里的30°与面积","year":2025,"region":"北京","number":"第15题","source":"https://zy.21cnjy.com/23366730","tags":["正方形","30°直角三角形","作高","面积"],"difficulty":"中等应用","time":"8分钟","stem":["正方形ABCD的边长为1，E在CD上。CF⊥BE于F，且∠EBC＝30°。"],"asks":["求S△ABF，并明确你选用的底和高。"],"hint":["△ABF的底可以选AB，但CF并不是这条底对应的高。","先求BF，再过F向AB作垂线；或者用坐标求F到AB的距离。"],"steps":[{"title":"先确定F所在直线与直角","body":"F在BE上，所以∠FBC＝∠EBC＝30°。又CF⊥BE，所以∠BFC＝90°，△BCF是直角三角形，斜边BC＝1。","why":"垂足和正方形边长；斜边是直角所对的BC。"},{"title":"求30°所对边CF","body":"在Rt△BCF中，30°所对的直角边是CF，故CF＝BC/2＝1/2。","why":"30°直角三角形半斜边结论。"},{"title":"勾股求BF","body":"BF²＝BC²－CF²＝1－1/4＝3/4，BF＞0，所以BF＝√3/2。","why":"勾股定理，取正平方根。"},{"title":"为底AB补出真正的高","body":"过F作FH⊥AB于H。正方形中AB⊥BC，且BF在∠ABC内，所以∠FBH＝90°－∠FBC＝60°。","why":"H在射线BA上；同一个直角被BF分成两角。"},{"title":"在第二个直角三角形中找30°","body":"在Rt△BFH中，∠FHB＝90°、∠FBH＝60°，所以∠BFH＝30°。它的斜边是BF，30°对边为BH，因此BH＝BF/2＝√3/4。","why":"内角和及30°所对边等于斜边的一半。"},{"title":"用勾股求高FH，不跳三角函数值","body":"FH²＝BF²－BH²＝3/4－3/16＝9/16，故FH＝3/4。","why":"第二个直角三角形BFH中的勾股定理。"},{"title":"使用对应底高计算面积","body":"△ABF选AB为底时，对应高为FH，不是CF。S△ABF＝AB·FH/2＝1×(3/4)/2＝3/8。","why":"三角形面积公式，底高正确配对。"}],"answer":"3/8。","pitfall":"不能把CF直接当成△ABF底AB上的高；△BCF中斜边是BC＝1，而不是BF。","diagram":{"points":{"A":[0,1],"B":[0,0],"C":[1,0],"D":[1,1],"E":[1,0.5773502691896258,10,-2],"F":[0.75,0.4330127018922193,4,23],"H":[0,0.4330127018922193,-24,6,"aux"]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["B","E"],["C","F"],["A","F"]],"aux":[["F","H"]],"right":[{"p":["B","F","C"]},{"p":["B","H","F"],"aux":true}]},"presentation":"原填空题补充“说明底与高”的课堂追问，原数值与求解目标保留。","lemmas":["right30"]},{"id":"practice-square-exit","day":1,"type":"practice","title":"独立检验：从条件走到正方形","tags":["正方形判定","中位线"],"stem":["已知四边形ABCD是平行四边形，AB＝BC，∠ABC＝90°。E、F分别是AB、BC的中点，连接EF。"],"asks":["证明ABCD为正方形。","若AB＝4，求EF，并说明EF与AC的位置关系。"],"hint":["已知平行四边形后，一个直角和一组相等邻边分别补出了什么？","E、F在△ABC中是哪两个点？"],"steps":[{"title":"从平行四边形先判矩形","body":"已知ABCD为平行四边形，且∠ABC＝90°，所以ABCD是矩形。","why":"有一个直角的平行四边形是矩形。"},{"title":"再补邻边相等判正方形","body":"矩形ABCD还有AB＝BC，故一组邻边相等。两组对边分别相等，进而四边全部相等，因此ABCD是正方形。","why":"邻边相等的矩形是正方形。"},{"title":"在△ABC里识别中位线","body":"E为AB中点，F为BC中点，所以EF是△ABC的中位线，EF∥AC、EF＝AC/2。","why":"三角形两边中点连线的性质。"},{"title":"求出对角线AC","body":"AB＝BC＝4，∠ABC＝90°，所以AC²＝AB²＋BC²＝4²＋4²＝32，得AC＝4√2。","why":"勾股定理；对角线AC是Rt△ABC的斜边。"},{"title":"代回半长关系并回答位置","body":"EF＝AC/2＝2√2，且EF∥AC。EF不是AC的一部分，只是与AC平行且长度为一半。","why":"中位线的两项结论。"}],"answer":"ABCD是正方形；EF∥AC，EF＝2√2。","pitfall":"EF是△ABC的中位线，不是正方形对角线的一部分。","diagram":{"points":{"A":[0,0,-22,22],"B":[4,0,10,22],"C":[4,4,10,-10],"D":[0,4,-22,-10],"E":[2,0,-4,24],"F":[4,2,11,6]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["E","F"]],"aux":[["A","C"]],"right":[{"p":["A","B","C"]}],"equal":[["A","E",1],["E","B",1],["B","F",2],["F","C",2]]},"time":"8分钟","difficulty":"基础应用","lemmas":["rectangle","square","midsegment","right45"]},{"id":"practice-circle-check","day":2,"type":"practice","title":"圆里先找直角、等角和等长","tags":["圆周角","垂径定理","等半径"],"stem":["⊙O半径为5，AB为直径，C在圆上且不同于A、B。另有弦DE＝8，过O作OH⊥DE，H为垂足。"],"asks":["写出∠ACB，并说明依据。","求OH。"],"hint":["直径对应的圆周角是多少？","从圆心向弦作垂线后，弦的两段各有多长？"],"steps":[{"title":"核对直径圆周角的条件","body":"AB是直径，C在圆上且不同于A、B，因此∠ACB为直径AB所对的圆周角，∠ACB＝90°。","why":"直径所对圆周角是直角；顶点C必须在圆上。"},{"title":"从圆心垂线得半弦","body":"O为圆心，OH⊥DE于H，所以H为弦DE的中点，DH＝HE＝DE/2＝8/2＝4。","why":"垂径定理；完整全等推导见本题结论。"},{"title":"补连半径并认直角","body":"连接OD。D在圆上，所以OD＝r＝5。又DH在弦DE所在直线上，所以∠OHD＝90°，△ODH为直角三角形。","why":"半径与垂直关系。"},{"title":"用半弦与半径列勾股式","body":"OH²＋DH²＝OD²，故OH²＝5²－4²＝25－16＝9；OH为长度，所以OH＝3。","why":"勾股定理；使用半弦DH＝4，不能使用整弦8。"}],"answer":"∠ACB＝90°；OH＝3。","pitfall":"圆周角的顶点要在圆上；弦心距对应的直角三角形用半弦而不是整弦。","diagram":{"points":{"O":[0,0,-19,-7],"A":[-5,0,-25,9],"B":[5,0,10,10],"C":[3,4,11,-8],"D":[-4,-3,-20,20],"E":[4,-3,10,21],"H":[0,-3,-5,25]},"edges":[["A","B"],["A","C"],["B","C"],["D","E"],["O","H"]],"aux":[["O","D"]],"circles":[{"center":"O","r":5}],"right":[{"p":["O","H","D"]}]},"time":"6分钟","difficulty":"基础应用","lemmas":["diameter-angle","perpendicular-chord"]},{"id":"exam-2024-beijing-24-1","day":2,"type":"exam","title":"直径与角平分线推出平行","year":2024,"region":"北京","number":"第24(1)题","source":"https://www.xbjy.com/xhtml/202409/1056.html","tags":["圆周角","等腰三角形","三线合一","平行线"],"difficulty":"基础到中等","time":"7分钟","stem":["AB为⊙O的直径，C、D位于圆上，C不同于A、B；OD平分△AOC的内角∠AOC。"],"asks":["求证：OD∥BC。"],"hint":["连接AC。一个直角来自直径，另一个垂直关系能否由等腰三角形与角平分线得到？"],"steps":[{"title":"把直径对应的三角形补全","body":"连接AC，并记射线OD与AC的交点为H。此处H在△AOC的边AC上。","why":"给圆周角补边，并把角平分线落到对边。"},{"title":"先证明△AOC等腰","body":"OA＝OC，因为它们都是⊙O的半径。故△AOC以AC为底边、O为顶角顶点，是等腰三角形。","why":"同圆半径相等。"},{"title":"说明OH为什么既平分角又垂直","body":"OD平分∠AOC，且O、H、D共线，因此OH是△AOC顶角的平分线。由等腰三角形三线合一，OH⊥AC，所以直线OD⊥AC。","why":"三线合一需要前一步的OA＝OC。"},{"title":"由直径求第二个垂直关系","body":"AB为直径且C在圆上，所以∠ACB＝90°，即BC⊥AC。","why":"直径所对圆周角为直角。"},{"title":"写清哪两条直线同垂直","body":"OD⊥AC、BC⊥AC，且OD、BC是同一平面内两条不同直线，所以OD∥BC。","why":"同平面内垂直于同一直线的两条不同直线平行。"}],"answer":"OD∥BC。","pitfall":"不能只根据角平分线就断定垂直；必须先写OA＝OC。","diagram":{"points":{"O":[0,0,-5,25],"A":[-1,0],"B":[1,0],"C":[0.5,0.8660254038],"D":[-0.5,0.8660254038],"H":[-0.25,0.4330127019,9,10,"aux"]},"edges":[["A","B"],["O","C"],["O","D"],["B","C"]],"aux":[["A","C"]],"circles":[{"center":"O","r":1,"semi":false}],"right":[{"p":["O","H","A"],"aux":true}]},"presentation":"选取原第24题的第(1)问。","lemmas":["isosceles","diameter-angle","parallel-perpendicular"]},{"id":"exam-2024-shenzhen-18","day":2,"type":"exam","title":"等腰三角形、切线与圆的半径","year":2024,"region":"广东深圳","number":"第18题","source":"https://kaosj.com/papers/2024/07/2024-zhongkao-math-guangdong-shenzhen-8d2b1fd738-paper/","tags":["圆与切线","垂直平分线","矩形","勾股定理"],"difficulty":"中等","time":"14分钟","stem":["△ABD中AB＝BD，A、B、D在⊙O上。BE与圆相切于B，AC为直径。直线DC与BE相交于E，点的排列如图。"],"asks":["证明DE⊥BE。","若AB＝5√6、BE＝5，求圆的半径。"],"hint":["看到切线先连半径；AB＝BD与OA＝OD能说明BO和AD是什么关系？"],"steps":[{"title":"先用两组等距确定中垂线","body":"连接BO，延长直线BO与AD交于H。AB＝BD说明B到A、D等距；OA＝OD（半径）说明O到A、D等距。B≠O，所以BO是AD的垂直平分线。","why":"两个不同等距点确定同一条垂直平分线。"},{"title":"把H的两个性质写出","body":"由BO垂直平分AD，得BH⊥AD、AH＝DH，且A、H、D共线、B、O、H共线。","why":"垂直平分线同时包含垂直和中点信息。"},{"title":"直径给出AD与DC垂直","body":"AC为直径，D在圆上，所以∠ADC＝90°，即AD⊥DC。D、C、E共线，因此AD⊥DE。","why":"直径所对圆周角是直角；共线转移垂直关系。"},{"title":"先把BH与DE连成平行关系","body":"BH⊥AD，DE⊥AD，因此BH∥DE。","why":"同平面内两条不同直线同垂直于AD。"},{"title":"已知切线给半径垂直","body":"BE在B处与圆相切，所以OB⊥BE。BH与OB共线，因此BH⊥BE；再由BH∥DE，得DE⊥BE，完成第(1)问。","why":"切线垂直于过切点的半径；平行线传递垂直。"},{"title":"第二问先严格判定矩形","body":"BH∥DE；AD⊥BH且BE⊥BH，所以HD∥BE。两组对边分别平行，BHDE为平行四边形，又∠BHD＝90°，故BHDE为矩形。","why":"先有平行四边形，再有一个直角，才判矩形。"},{"title":"从矩形转移题给长度","body":"矩形对边相等，DH＝BE＝5。又AH＝DH，故AH＝5。注意这里不能写BH＝BE。","why":"矩形对边相等；H为AD中点。"},{"title":"在第一个直角三角形里求BH","body":"△ABH在H处为直角，AB＝5√6为斜边。BH²＝AB²－AH²＝(5√6)²－5²＝150－25＝125，所以BH＝5√5。","why":"勾股定理，长度取正值。"},{"title":"设半径，先保留位置的绝对值","body":"设半径为r＞0，则BO＝OA＝r。H是弦AD的中点，Rt△AOH给OH²＝r²－AH²＜r²，所以H在圆内。B、O、H共线且B在圆上，因此O、H同在从B向圆心方向的射线上，OH＝|BH－BO|＝|5√5－r|。","why":"先确认H在圆内，再按共线点距离取绝对值；不预设O、H的先后。"},{"title":"在第二个直角三角形中列方程","body":"OA为半径，且OH⊥AH，所以在Rt△AOH中：OA²＝AH²＋OH²，即r²＝25＋(5√5－r)²。","why":"勾股定理；绝对值平方等于原式平方。"},{"title":"逐项展开并消去r²","body":"(5√5－r)²＝125－10√5r＋r²。代回得r²＝25＋125－10√5r＋r²；两边减r²，得0＝150－10√5r。","why":"完全平方公式与等式同减。"},{"title":"解半径并检查","body":"10√5r＝150，所以r＝15/√5＝3√5＞0。又r＜BH＝5√5，算后确认O在B、H之间，与题图一致。","why":"方程求解、分母有理化和位置检查。"}],"answer":"(1)DE⊥BE；(2)半径3√5。","pitfall":"矩形BHDE给的是DH＝BE；BH需用勾股定理求出。半径方程中OH可先写绝对值距离，求出r后再核对O、H的先后。","diagram":{"points":{"O":[0,0],"B":[0,6.7082039325,-22,-10],"A":[-5,-4.472135955],"D":[5,-4.472135955,12,20],"C":[5,4.472135955],"E":[5,6.7082039325,12,-10],"H":[0,-4.472135955,-8,26,"aux"]},"edges":[["A","B"],["B","D"],["A","D"],["A","C"],["D","E"],["B","E"]],"aux":[["B","H"],["O","A"]],"circles":[{"center":"O","r":6.7082039325,"semi":false}]},"presentation":"按原题数学条件整理，几何图按题意重绘。","lemmas":["perpendicular-bisector","diameter-angle","tangent","rectangle"]},{"id":"practice-tangent-two","day":2,"type":"practice","title":"切点未知，怎样证明相切？","tags":["角平分线等距","切线判定"],"stem":["点O在∠BAC的内部角平分线上。⊙O与边AB相切于M，过O向AC作垂线，垂足为N。"],"asks":["证明AC也是⊙O的切线。"],"hint":["已知一条切线，能得到哪个垂直关系？","把OM、ON都看成到角两边的距离。"],"steps":[{"title":"从已知相切提取半径与垂直","body":"圆在M处与AB相切，因此M在圆上，OM＝r，且OM⊥AB。","why":"切线性质；OM为过切点的半径。"},{"title":"确认另外一条距离的表达","body":"题设ON⊥AC于N，所以ON为圆心O到直线AC的距离；OM为O到直线AB的距离。","why":"点到直线距离的定义。"},{"title":"用角平分线比较两种距离","body":"O在∠BAC内部的角平分线上，所以ON＝OM。结合OM＝r，得ON＝r。","why":"角平分线上的点到角两边等距。"},{"title":"不能漏掉N在圆上这一句","body":"ON＝r，所以N到圆心O的距离等于半径，故N在⊙O上。","why":"圆的定义。"},{"title":"最后按切线判定完成证明","body":"AC经过圆上点N，半径ON⊥AC，因此AC是⊙O在N处的切线。","why":"圆上接触点与对应半径垂直，两个条件都已证明。"}],"answer":"AC与⊙O相切于N。","pitfall":"不能仅由ON⊥AC就说相切；必须先证明ON等于半径。","diagram":{"points":{"A":[0,0,-22,21],"B":[9,0,10,20],"C":[4.5,7.794,-6,-11],"O":[5.196152423,3,10,-9],"M":[5.196152423,0,-5,24],"N":[2.5980762115,4.5,-25,-4]},"edges":[["A","B"],["A","C"],["A","O"],["O","M"],["O","N"]],"aux":[],"circles":[{"center":"O","r":3}],"right":[{"p":["O","M","A"]},{"p":["O","N","A"]}]},"time":"8分钟","difficulty":"基础应用","lemmas":["angle-distance","tangent","tangent-distance"]},{"id":"practice-translation-overlap","day":2,"type":"practice","title":"平移以后，重叠部分怎样计算？","tags":["平移","对应关系","重叠面积"],"stem":["矩形ABCD中，AB＝4，BC＝3。将矩形沿AB方向平移x个单位，得到A′B′C′D′，其中0≤x≤4。图示x＝2的位置。"],"asks":["x＝2时，求两矩形重叠部分的面积。","用x表示重叠面积S；若S＝3，求x。"],"hint":["平移后高有没有改变？","重叠部分沿AB方向剩下多长？"],"steps":[{"title":"先写平移后的对应关系","body":"A→A′、B→B′、C→C′、D→D′。沿AB方向平移x，所以AA′＝BB′＝CC′＝DD′＝x，方向都与AB相同；高保持BC＝3。","why":"平移的方向和距离对每个点相同，对应长度不变。"},{"title":"说明重叠部分的宽为什么减x","body":"0≤x≤4时，沿AB方向原图占据长度区间[0,4]，平移图占据[x,x＋4]，共同部分为[x,4]，宽度为4－x，高度为3。","why":"两段区间的交集；这是本题图形重叠的依据。"},{"title":"写出面积函数并回答第一问","body":"S＝3(4－x)。当x＝2时，S＝3(4－2)＝6。","why":"重叠部分为矩形，面积＝宽×高。"},{"title":"令面积为3，逐步解方程","body":"若S＝3，则3(4－x)＝3，两边除以3得4－x＝1，所以x＝3。","why":"等式变形。"},{"title":"检查取值范围和端点","body":"x＝3满足0≤x≤4。x＝0时完全重合、S＝12；x＝4时只剩公共边、S＝0，均与公式相符。","why":"范围检验与端点核对；公共边没有面积。"}],"answer":"x＝2时S＝6；S＝3(4－x)；S＝3时x＝3。","pitfall":"若平移超出给定范围，重叠形状或是否重叠会改变，不能无限套用这一公式。","diagram":{"points":{"A":[0,0,-20,23],"B":[4,0,-5,23],"C":[4,3,-5,-12],"D":[0,3,-20,-12],"A′":[2,0,-10,25],"B′":[6,0,9,22],"C′":[6,3,10,-10],"D′":[2,3,-11,-12]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["A′","B′"],["B′","C′"],["C′","D′"],["D′","A′"]],"aux":[],"fill":[{"points":["A′","B","C","D′"],"color":"#c9e8e2"}]},"time":"8分钟","difficulty":"基础应用","lemmas":["transforms","coordinates"]},{"id":"exam-2022-jingzhou-fold-tangent","day":2,"type":"exam","title":"矩形折叠与切线判定","year":2022,"region":"湖北荆州","number":"第24题(1)(2)","source":"https://zy.21cnjy.com/14817805","tags":["折叠","切线判定","相似三角形","勾股定理"],"difficulty":"中等","time":"13分钟","stem":["矩形ABCD中AB＝4、AD＝3。O在AB上且O≠A，设OA＝x。沿OD折叠△OAD，使A落到E；以O为圆心、OA为半径作AB上方的半圆。"],"asks":["求证：DE是半圆O的切线。","当E落在BD上时，求x。"],"hint":["折叠保持长度和角：原来的OA与∠OAD分别变成了什么？"],"steps":[{"title":"列出折叠对应点","body":"沿OD折叠时，O、D在折痕上不动，A映到E，因此△OAD与△OED全等，对应O↔O、A↔E、D↔D。","why":"折叠保留对应边长与角度。"},{"title":"把三个需要的关系分别写出","body":"对应边给OE＝OA、DE＝DA＝3；对应角给∠OED＝∠OAD＝90°，即OE⊥DE。","why":"矩形中OA沿AB，AD⊥AB；折叠对应角相等。"},{"title":"先确认E在所作圆上","body":"半圆的圆心是O、半径是OA；OE＝OA，且折叠后E在AB上方，因此E在题设半圆上。","why":"圆的定义以及半圆所在一侧。"},{"title":"用切线判定回答第一问","body":"DE经过半圆上的点E，且半径OE⊥DE，所以DE在E处与半圆所在圆相切。","why":"先有圆上点，再有半径垂直。"},{"title":"第二问先求整条对角线","body":"当E落在线段BD上时，Rt△ABD中，BD²＝AB²＋AD²＝4²＋3²＝25，所以BD＝5。","why":"矩形直角与勾股定理。"},{"title":"利用折叠等长求BE","body":"DE＝DA＝3，且E在线段BD上，所以BE＝BD－DE＝5－3＝2。","why":"第2步的折叠等长与线段相减。"},{"title":"找相似所需的两组角","body":"E在BD内部，BE与DE共线，所以∠BEO＝90°。OE＞0且OE⊥BD，故O不在BD上，特别地O≠B。又∠BAD＝90°；BO与BA同向共线，BE与BD同向共线，因此∠OBE＝∠ABD。","why":"先确认三个顶点不在同一直线上，再用直角与同向射线找对应角。"},{"title":"写相似和对应关系","body":"△BOE∽△BDA（AA），对应B↔B、O↔D、E↔A。于是BO对应BD，BE对应BA，OE对应DA。","why":"两角分别相等的三角形相似。"},{"title":"列比例并代入参数","body":"BO/BD＝BE/BA。设OA＝x，因O在线段AB上，BO＝AB－AO＝4－x；代入得(4－x)/5＝2/4。","why":"相似三角形对应边成比例；线段相减。"},{"title":"交叉相乘并验算","body":"4(4－x)＝10，16－4x＝10，4x＝6，所以x＝3/2。0＜3/2＜4，符合O的位置。此时BO＝5/2，(5/2)/5＝2/4，比例正确。","why":"方程展开、范围检验与代回核对。"}],"answer":"(1)DE与半圆O相切于E；(2)x＝3/2。","pitfall":"证切线需要先确认E在圆上，再确认OE⊥DE；DE＝AD来自折叠，不能把DE误写成OA。","diagram":{"points":{"A":[0,0],"B":[4,0],"C":[4,3],"D":[0,3],"O":[1.5,0,-9,25],"E":[2.4,1.2,10,-6]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["O","D"],["O","E"],["D","E"]],"aux":[["B","D"]],"circles":[{"center":"O","r":1.5,"semi":true}],"right":[{"p":["O","E","D"],"aux":true}]},"presentation":"选取原第24题的第(1)(2)问；省略仅供后问使用的F、G等构造。图为第(2)问的特定位置。","lemmas":["transforms","tangent","similar-area"]},{"id":"exam-2022-yiyang-10","day":2,"type":"exam","title":"旋转50°后哪些结论仍成立","year":2022,"region":"湖南益阳","number":"第10题","source":"https://www.yeyulingfeng.com/wendang/636940.html","tags":["旋转","平行线","等腰三角形","角度计算"],"difficulty":"基础到中等","time":"10分钟","stem":["△ABC中∠CAB＝20°、∠ABC＝30°。绕A逆时针转动50°，对应图形记为△AB′C′。"],"asks":["判断①BC＝B′C′；②AC∥C′B′；③C′B′⊥BB′；④∠ABB′＝∠ACC′，并说明理由。"],"hint":["先写旋转直接给出的等边、等角，再看△ABB′与△ACC′这两个等腰三角形。"],"steps":[{"title":"先写对应点，判断①","body":"旋转中心A不动，B→B′、C→C′。对应边BC＝B′C′，所以①正确。","why":"旋转保留对应长度。"},{"title":"把旋转角与原角分清","body":"按题图射线次序，AB到AB′逆时针转50°，AB到AC为20°，AC位于AB与AB′之间。因此∠B′AC＝50°－20°＝30°。","why":"同一顶点处按射线位置相减，不能只看角的数值。"},{"title":"由对应角加内错角判断②","body":"旋转对应给∠AB′C′＝∠ABC＝30°。它与∠B′AC是直线B′C′、AC被AB′截出的内错角，所以AC∥B′C′，②正确。","why":"内错角相等，两直线平行。"},{"title":"构造第一个等腰三角形","body":"旋转给AB＝AB′，且∠BAB′＝50°，所以△ABB′为等腰三角形。两底角之和为180°－50°＝130°，故∠ABB′＝∠AB′B＝65°。","why":"等边对等角和三角形内角和。"},{"title":"先确认③中三条射线的次序","body":"在B′处，按题图射线B′A位于B′C′与B′B之间，所以∠C′B′B＝∠C′B′A＋∠AB′B＝30°＋65°＝95°。","why":"角相加依赖射线位置，不能无条件相加。"},{"title":"用角度否定垂直","body":"两直线C′B′与BB′形成的这个角为95°，其邻角为85°，均不是90°，所以它们不垂直，③错误。","why":"垂直的定义。"},{"title":"构造第二个等腰三角形判断④","body":"同样由旋转得AC＝AC′、∠CAC′＝50°，所以△ACC′两底角各为(180°－50°)/2＝65°。于是∠ACC′＝65°＝∠ABB′，④正确。","why":"同中心旋转产生等腰三角形；两底角公式。"},{"title":"汇总四个判断","body":"①正确、②正确、③错误、④正确，因此正确结论为①②④。","why":"逐项判断，不依赖未显示的原选择题选项字母。"}],"answer":"正确结论为①②④；③错误。","pitfall":"旋转角为50°，不意味着图上任意两条对应线段都垂直；先看旋转中心和对应点。","diagram":{"points":{"A":[0,0,-20,20],"B":[1,0],"C":[0.6133407985,0.2232377941,5,20],"B′":[0.6427876097,0.7660444431,10,-8],"C′":[0.2232377941,0.6133407985,-29,-7]},"edges":[["A","B"],["B","C"],["C","A"],["A","B′"],["B′","C′"],["C′","A"]],"aux":[["B","B′"],["C","C′"]]},"presentation":"原选择题改为逐条判断并说明理由，保留四个待判断结论。","lemmas":["transforms","rotation-isosceles"]},{"id":"practice-fold-exit","day":2,"type":"practice","title":"独立检验：折叠后用什么列方程？","tags":["折叠","等长","勾股定理"],"stem":["矩形ABCD中，AB＝6，BC＝8。E在BC上且BE＝4。沿直线PQ折叠，使A与E重合，其中P在AB上，Q在AD上。"],"asks":["求AP。写清等长关系来自哪里。"],"hint":["折痕上的P不动，A与E是对应点。","设AP＝x，在△PBE中哪两条直角边可以用x表示？"],"steps":[{"title":"先说明P为什么到A、E等距","body":"P在折痕PQ上，折叠时P不动，A映到E，所以线段PA映成PE，PA＝PE。","why":"折叠对应边相等；折痕等距结论的来源。"},{"title":"设未知数并表达相关线段","body":"若P＝A，则PA＝0而PE＞0，与PA＝PE矛盾；若P＝B，则PA＝6、PE＝4，也矛盾。因此P在AB内部。设AP＝x，则0＜x＜6，PE＝x，PB＝AB－AP＝6－x。","why":"先排除端点，再使用等长替换和线段相减。"},{"title":"确认列方程所用的直角","body":"PB沿AB，BE沿BC；矩形中AB⊥BC，因此∠PBE＝90°。Rt△PBE的斜边是PE，两直角边为PB、BE。","why":"矩形直角及点在线段上的位置。"},{"title":"先写勾股关系再代入","body":"PE²＝PB²＋BE²。代入PE＝x、PB＝6－x、BE＝4，得到x²＝(6－x)²＋4²。","why":"勾股定理，每个式子明确对应一条边。"},{"title":"把平方展开完整","body":"(6－x)²＝36－12x＋x²，4²＝16，因此x²＝36－12x＋x²＋16＝52－12x＋x²。","why":"完全平方公式，不能漏掉−12x。"},{"title":"消去平方项并解方程","body":"两边同时减x²，得0＝52－12x，所以12x＝52，x＝52/12＝13/3。","why":"等式同减、移项及约分。"},{"title":"检查位置并代回核对","body":"0＜13/3＜6，P在AB内部。PB＝6－13/3＝5/3；(5/3)²＋4²＝25/9＋144/9＝169/9＝(13/3)²，满足勾股关系。故AP＝13/3。","why":"取值范围与代回验算。"}],"answer":"AP＝13/3。","pitfall":"PA＝PE来自折叠，不能把AP当成PB，也不能漏掉PB＝6－x。","diagram":{"points":{"A":[0,0,-23,22],"B":[6,0,10,22],"C":[6,8,10,-12],"D":[0,8,-22,-12],"E":[6,4,12,5],"P":[4.333333333333333,0,-5,25],"Q":[0,6.5,-25,5]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["P","Q"],["P","E"],["Q","E"]],"aux":[],"fill":[{"points":["A","P","Q"],"color":"#e0eaff"},{"points":["E","P","Q"],"color":"#d8eee6"}],"labels":[{"at":[2,-0.8],"text":"AB＝6"},{"at":[6.25,1.8],"text":"4"}]},"time":"10分钟","difficulty":"基础应用","lemmas":["fold-bisector"]}];

积都为54/6＝9，但只知道面积相等，不能推出它们全等。"]}]},{"title":"等腰、等边与三线合一","prompt":"哪条边上的中线、高和哪一个角的平分线能够重合？","rules":[["先确认等腰","AB＝AC，所以∠B＝∠C；反过来，∠B＝∠C可推出AB＝AC。"],["再用三线合一","在AB＝AC中，底边BC上的中线、高、顶角A的平分线重合，三者给出其一可得另外两者。"],["等边三角形","三边相等，三个角均为60°；三角形中三个角相等也可推出等边。"]],"trap":"不是任意顶点、任意边都能套用三线合一。先写清两腰和底边。","bridge":"证明垂直或角平分时，可先寻找等腰和底边中点。","diagram":{"points":{"A":[0,4,-8,-12],"B":[-3,0,-20,24],"C":[3,0,10,24],"D":[0,0,-6,25]},"edges":[["A","B"],["B","C"],["C","A"],["A","D"]],"aux":[],"equal":[["A","B",1],["A","C",1],["B","D",2],["D","C",2]],"right":[{"p":["A","D","B"]}]},"lemmas":["equal-triangles","isosceles"]},{"title":"直角三角形的斜边中线","prompt":"使用“一半”之前，必须检查哪两个条件？","rules":[["条件","∠BAC＝90°，M是斜边BC的中点。"],["结论","AM＝BM＝CM＝BC/2。"],["用法","连接直角顶点与斜边中点，构造等腰三角形，或把已知斜边化为中线长度。"]],"trap":"“任意三角形的中线等于对边一半”是错误的；直角与斜边中点两个条件都要有。","bridge":"看到直角和斜边中点，优先连接中点与直角顶点。","diagram":{"points":{"A":[0,0,-22,23],"B":[6,0,10,23],"C":[0,8,-20,-10],"M":[3,4,13,0]},"edges":[["A","B"],["B","C"],["C","A"],["A","M"]],"aux":[],"right":[{"p":["B","A","C"]}],"equal":[["A","M",1],["B","M",1],["C","M",1]]},"lemmas":["hypotenuse-median"]},{"title":"角平分线：等角、等距与边比","prompt":"角平分线的三种用法，各需要补充什么条件？","rules":[["等角","AD平分∠BAC，得∠BAD＝∠DAC。"],["等距及逆用","D在角平分线上，DM⊥AB、DN⊥AC，得DM＝DN；角内部一点到两边等距，可反推在角平分线上。"],["边比","当D在线段BC上且AD平分内角A时，BD/DC＝AB/AC。例如AB＝6、AC＝4，则BD:DC＝3:2。"],["用面积解释","以BD、DC为底，两三角形同高，面积比为BD/DC；以AB、AC为底，对应高DM＝DN，面积比为AB/AC。"]],"trap":"“到两边距离”指垂线段长度；列比例时要让BD对应AB、DC对应AC。","bridge":"证线段相等时考虑作垂线；求对边分段时考虑面积比。","diagram":{"points":{"A":[4.5,3.968626967,-5,-14],"B":[0,0,-22,23],"C":[5,0,10,23],"D":[3,0,-6,24]},"edges":[["A","B"],["B","C"],["C","A"],["A","D"]],"aux":[],"labels":[{"at":[1.6,2.1],"text":"6"},{"at":[5.05,2.1],"text":"4"}]},"figureNote":"AD平分顶角A，D在BC上。","lemmas":["angle-distance","angle-ratio"]},{"title":"线段的垂直平分线","prompt":"它平分的是角，还是线段？","rules":[["性质","PM⊥AB且AM＝MB，则垂直平分线上的点P满足PA＝PB。"],["判定","若PA＝PB，则P在线段AB的垂直平分线上。"],["常见连接","把等距点P与线段中点M连接，可结合等腰三角形证明PM⊥AB。"]],"trap":"“垂直”与“平分”缺一不可；角平分线对应到两边等距，中垂线对应到两端点等距。","bridge":"看到中垂线与一边的交点，先把两端点到交点的线段标成相等。","diagram":{"points":{"A":[-3,0,-23,23],"B":[3,0,10,23],"M":[0,0,-6,25],"P":[0,4,-7,-12]},"edges":[["A","B"],["P","M"],["P","A"],["P","B"]],"aux":[],"right":[{"p":["P","M","A"]}],"equal":[["A","M",2],["M","B",2],["P","A",1],["P","B",1]]},"lemmas":["perpendicular-bisector"]},{"title":"面积关系：同高、同底与中线","prompt":"面积相等，是由哪一对底和高保证的？","rules":[["同高比较底","D在BC上时，S△ABD/S△ACD＝BD/DC，因为两者从A到直线BC的高相同。"],["中线分面积","若BD＝DC，则两部分面积相等，各占S△ABC的一半。"],["同底比较高","同底三角形的面积比等于对应高的比；用两种底和高可表示同一个三角形面积。"]],"trap":"底和高必须对应。面积相等本身不能直接推出三角形全等或所有对应边相等。","bridge":"卡在边长比时，试着把同一组面积比用两种方式表示。","lemmas":["area","similar-area"]}],"checks":[{"q":"△ABC中，D是BC的中点。只凭这一条件，一定成立的是？","options":["AD⊥BC","∠BAD＝∠CAD","S△ABD＝S△ACD"],"answer":2,"why":"两部分以BD、DC为底时同高，且BD＝DC，因此面积相等。垂直和角平分需要更多条件。","review":"中线、高、角平分线"},{"q":"AB＝AC，AD为BC边上的高。可以继续推出？","options":["BD＝DC，且∠BAD＝∠CAD","只有BD＝DC","AD＝BC/2"],"answer":0,"why":"AB＝AC明确了底边BC；底边上的高由三线合一同时是中线和顶角平分线。","review":"等腰、等边与三线合一"},{"q":"AD平分△ABC的内角A，D在BC上。AB＝6，AC＝4，BC＝10，则BD＝？","options":["4","5","6"],"answer":2,"why":"BD:DC＝AB:AC＝3:2。BC共5份，每份2，所以BD＝3×2＝6。","review":"角平分线：等角、等距与边比"}],"extraTime":"新增重心回顾和短练习约5—8分钟；完整推导可按掌握情况展开。"},{"goal":"把性质和判定分清，看到中点能想到中位线或构造全等。","minutes":"建议12—15分钟","cards":[{"title":"四边形：先看已知身份","prompt":"题目已经给了平行四边形，还需要从头证明吗？","rules":[["平行四边形的性质","对边平行且相等，对角相等，邻角互补，对角线互相平分。"],["常用判定","两组对边分别平行；两组对边分别相等；一组对边平行且相等；对角线互相平分。各自都可判定平行四边形。"],["证明顺序","先读取题目已经给出的图形身份，再寻找从这个身份到目标图形所缺的条件。"]],"trap":"“一组对边平行，另一组对边相等”不能套用“一组对边平行且相等”。","bridge":"先标对边平行、对角线被平分，给后续全等或中位线提供条件。","diagram":{"points":{"A":[0,3,-20,-12],"B":[5,3,10,-12],"C":[7,0,10,23],"D":[2,0,-20,23],"O":[3.5,1.5,10,-10]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"],["B","D"]],"aux":[]},"lemmas":["parallelogram-properties","parallelogram"]},{"title":"矩形、菱形与正方形","prompt":"判定时，“平行四边形”这个前提能省略吗？","rules":[["平行四边形→矩形","补一个直角，或补对角线相等；矩形性质还包括对角线相等。"],["平行四边形→菱形","补一组邻边相等，或补对角线垂直；菱形四边相等，对角线互相垂直。"],["矩形或菱形→正方形","矩形再有一组邻边相等，或菱形再有一个直角；正方形兼具两者性质。"]],"trap":"一般四边形仅有对角线相等，不能直接判矩形；仅有对角线垂直，不能直接判 ","DE∥BC，DE＝5","DE∥BC，DE＝10"],"answer":1,"why":"两边中点连线是中位线，平行于第三边且等于第三边的一半。","review":"中位线：两个中点连起来"},{"q":"A(−2,1)、B(3,1)。线段AB的长度是？","options":["−5","1","5"],"answer":2,"why":"A、B纵坐标相同，AB为水平线段。AB＝|3−(−2)|＝5。","review":"坐标与分类：解完还要检查"}]},{"goal":"先把圆和变换的条件转化为直角、等长、等角，再接上已有证明方法。","minutes":"建议12—15分钟","cards":[{"title":"圆周角、直径与内接四边形","prompt":"“直径所对的角是直角”中，角的顶点在哪里？","rules":[["直径给直角","AB是直径，C在圆上且不同于A、B，则∠ACB＝90°。"],["同弧给等角","同圆或等圆中，同弧或等弧所对的圆周角相等；同一条弦所对的圆周角若顶点分居弦两侧，则两角互补。"],["圆心角与圆周角","同一弧所对的圆心角是圆周角的2倍。圆内接四边形的对角互补。"]],"trap":"只有AB是直径还不够；C必须在圆上。圆心O处的∠AOB不是直径所对的圆周角。","bridge":"看到直径先连接直径端点与圆上的第三点，寻找直角三角形。","diagram":{"points":{"O":[0,0,-10,25],"A":[-5,0,-24,23],"B":[5,0,10,23],"C":[3,4,12,-7]},"edges":[["A","B"],["A","C"],["B","C"]],"aux":[],"circles":[{"center":"O","r":5}],"right":[{"p":["A","C","B"]}]},"lemmas":["diameter-angle","circle-angles"]},{"title":"垂径定理与半弦","prompt":"连半径、作垂线后，直角三角形的三条边是谁？","rules":[["条件与结论","过圆心O的直线垂直弦AB于H，则AH＝BH。"],["直角三角形","连接OA，得到OA²＝OH²＋AH²，即r²＝圆心到弦的距离²＋半弦长²。"],["逆用要检查","过圆心且平分一条非直径弦的直线垂直于弦；逆用时不能漏掉非直径条件。"]],"trap":"勾股定理里用的是半弦AH，不是整弦AB。","bridge":"看到弦长和圆心到弦的距离，作垂线并连接一个弦端点与圆心。","diagram":{"points":{"O":[0,0,-10,25],"A":[-4,3,-23,-5],"B":[4,3,10,-5],"H":[0,3,-7,-12]},"edges":[["A","B"],["O","H"],["O","A"]],"aux":[],"circles":[{"center":"O","r":5}],"right":[{"p":["O","H","A"]}],"equal":[["A","H",1],["H","B",1]]},"lemmas":["perpendicular-chord"]},{"title":"切点已知：连接半径","prompt":"证明切线前，需要先交代哪一个点在圆上？","rules":[["切线性质","已知直线l在P处与⊙O相切，则OP⊥l。"],["切线判定","已知P在⊙O上，若直线l经过P且OP⊥l，则l是圆在P处的切线。"],["证明结构","P在圆上 → OP为半径 → 证明OP与l垂直 → 判定相切。"]],"trap":"“某线垂直某线”不够；垂直的必须是经过圆上接触点的半径与待证切线。","bridge":"有切点先连半径，再用等腰、平行、角度和或全等把垂直证出来。","diagram":{"points":{"O":[0,0,-8,25],"P":[0,3,-22,-9],"L":[-5,3,-20,-10],"R":[5,3,10,-10]},"edges":[["O","P"],["L","R"]],"aux":[],"circles":[{"center":"O","r":3}],"right":[{"p":["O","P","R"]}]},"figureNote":"直线LR在圆上点P处与半径OP垂直。","lemmas":["tangent"]},{"title":"切点未知：作垂线比半径","prompt":"只证圆心到直线的垂线，为什么还不能说明相切？","rules":[["先作距离","过O作OH⊥直线l，垂足为H，OH就是圆心到直线的距离。"],["再证明等于半径","若OH＝r，则H在圆上，直线l与圆相切。"],["三种位置","距离d＞r为相离，d＝r为相切，d＜r为相交。"]],"trap":"任意圆心都能向任意直线作垂线；关键还在于垂线段长度等于半径。","bridge":"结合角平分线等距、全等或勾股定理，证明圆心到直线的距离等于已知半径。","lemmas":["tangent-distance"]},{"title":"平移与旋转：先列对应点","prompt":"旋转中心不动，你能先写出两组确定的等长吗？","rules":[["平移","对应长度、角度不变；各点位移的方向和距离相同。对应线段平行或共线。"],["旋转","绕A旋转时A不动，B→B′、C→C′，所以AB＝AB′、AC＝AC′，对应边角相等。"],["旋转角","∠BAB′与∠CAC′均对应同一次旋转的转角（按题目方向理解）；可构造△ABB′、△ACC′两个等腰三角形。"]],"trap":"旋转角是同一原点、像点与中心形成的转角；不能把图上任意两条线之间的角都当旋转角。","bridge":"先写对应表和等长，再标旋转角，最后用全等、相似或等腰三角形求角。","lemmas":["transforms","rotation-isosceles"]},{"title":"折叠：等长与折痕的中垂性质","prompt":"点P在折痕上，A折到E后，哪两条线段相等？","rules":[["对应关系","A折到E，折痕上的P、Q不动，所以PA＝PE、QA＝QE，对应角也相等。"],["折痕性质","若A与E不同，折痕是线段AE的垂直平分线；AE与折痕的交点是AE中点。"],["接上计算","先把对应线段标等，再寻找矩形中的直角，用勾股定理或相似列方程。"]],"trap":"折痕上的点不一定是原图某条边的中点；“中点”针对的是原点与像点的连线。","bridge":"未知长设为x，把折叠给的等长代入同一个直角三角形，写明范围再求解。","lemmas":["fold-bisector"]}],"checks":[{"q":"AB是⊙O的直径，C在圆上且不同于A、B。一定是直角的是？","options":["∠AOC","∠ACB","∠CAB"],"answer":1,"why":"∠ACB是直径AB所对的圆周角，所以等于90°。","review":"圆周角、直径与内接四边形"},{"q":"⊙O半径为5，过O作OH⊥直线l。若要用距离证明l为切线，还需要？","options":["OH＝5","OH＜5","只要OH⊥l就够"],"answer":0,"why":"垂线只确定了距离；还需OH等于半径5，才能确定H在圆上并判定相切。","review":"切点未知：作垂线比半径"},{"q":"沿直线PQ折叠，使A与E重合。P在折痕上，一定成立的是？","options":["PA＝PE","PA＝AE","P是AE的中点"],"answer":0,"why":"P是折叠中的不动点，到对应点A、E等距。折痕与AE的交点才是AE中点，P未必是那个交点。","review":"折叠：等长与折痕的中垂性质"}]}];
const LEMMAS=[{"id":"lines","title":"中线、高、内角平分线：定义与区别","day":0,"kind":"定义","conditions":["A、B、C三个顶点不在同一直线上；D在线段BC上。"],"conclusion":"中线：BD＝DC；高：从顶点到对边所在直线的垂线段；内角平分线：∠BAD＝∠DAC。三种条件各自成立，不可互相替代。","proof":["AD为中线 ⇔ D是BC的中点 ⇔ BD＝DC。","AD为BC边上的高 ⇔ AD⊥直线BC（这里D为垂足）。钝角三角形有些垂足在边的延长线上。","AD为内角A的平分线 ⇔ ∠BAD＝∠DAC＝∠BAC/2。","一般三角形中，以上任何一个条件都不能单独推出另外两个；等腰三角形的底边情形另见“三线合一”。"],"pitfall":"“中线”不等于“中位线”；点到直线的距离必须用垂线段长度表示。","diagram":null},{"id":"area","title":"同高面积比、中线分面积与两层中点","day":0,"kind":"常用推论","conditions":["D在线段BC内部；比较△ABD与△ACD。"],"conclusion":"S△ABD/S△ACD＝BD/DC；若BD＝DC，则各占S△ABC的一半。若E又是AD中点，则S△ABE＝S△ABC/4，S△BEC＝S△ABC/2。","proof":["记A到直线BC的距离为h。两三角形选BD、DC为底时，对应高都是h。","S△ABD＝BD·h/2，S△ACD＝DC·h/2，相除并约去h/2，得面积比BD/DC。","若BD＝DC，两部分面积相等；又两部分之和是S△ABC，所以各为总面积的1/2。","若E是AD中点，AE＝ED。△ABE、△BDE选AE、ED为底，从B到直线AD的高相同，因此各为S△ABD的1/2，也就是总面积的1/4。","同理，S△CDE＝S△ABC/4。因为D在线段BC上，△BEC由△BDE、△CDE无重叠地拼成，所以S△BEC＝S△ABC/2。"],"pitfall":"必须指出具体的底与对应高；面积相等不能直接推出全等。","diagram":null},{"id":"isosceles","title":"等腰三角形的三线合一：三种入口","day":0,"kind":"性质与推论","conditions":["AB＝AC；D在线段BC上。三线合一针对底边BC与顶角A。"],"conclusion":"BD＝DC、AD⊥BC、∠BAD＝∠CAD，这三个条件中任给一个，都能推出另外两个。","proof":["入口一：已知BD＝DC。在△ABD与△ACD中，AB＝AC、BD＝DC、AD＝AD，所以△ABD≌△ACD（SSS）。","由全等得∠BAD＝∠CAD、∠ADB＝∠ADC。B、D、C共线，两后者之和为180°，所以各为90°，得到AD⊥BC。","入口二：已知AD⊥BC。两侧均为直角三角形，斜边AB＝AC，直角边AD公共，所以△ABD≌△ACD（HL）；得BD＝DC及顶角被平分。","入口三：已知∠BAD＝∠CAD。AB＝AC、AD公共、夹角相等，所以△ABD≌△ACD（SAS）；得BD＝DC及∠ADB＝∠ADC，再由邻补角推出垂直。"],"pitfall":"先写AB＝AC，再用三线合一。不能对等腰三角形的任意一条中线都这样使用。","diagram":null},{"id":"angle-distance","title":"角平分线等距性质及其逆用","day":0,"kind":"性质与判定","conditions":["P在∠BAC内部；PM⊥AB于M，PN⊥AC于N。使用下面的直角三角形证明时，M、N在角的两边射线上。"],"conclusion":"AP平分∠BAC ⇒ PM＝PN；反过来，在上述条件下PM＝PN ⇒ AP平分∠BAC。","proof":["性质方向：若∠MAP＝∠PAN，则Rt△AMP与Rt△ANP中，∠AMP＝∠ANP＝90°、AP为公共斜边，另有一组对应锐角相等。","由AAS（或先用内角和补齐另一锐角，再用ASA），得△AMP≌△ANP，所以PM＝PN。","逆用方向：若PM＝PN，则Rt△AMP与Rt△ANP斜边AP公共、一组直角边相等，所以两三角形全等（HL）。","由全等得∠MAP＝∠PAN，因此AP平分∠BAC。"],"pitfall":"等距是到两条边的垂直距离，不是PA＝PB或PA＝PC；逆用要交代P在角内部。","diagram":null},{"id":"angle-ratio","title":"内角平分线定理：对边分段比","day":0,"kind":"常用二级结论","conditions":["AD平分△ABC的内角A，D在线段BC内部。"],"conclusion":"BD/DC＝AB/AC。分段BD对应邻边AB，分段DC对应邻边AC。","proof":["过D分别作DM⊥AB、DN⊥AC，垂足为M、N；记DM＝DN＝d（角平分线等距性质）。","以AB、AC为底：S△ABD＝AB·d/2，S△ACD＝AC·d/2，所以两面积之比等于AB/AC。","再记A到直线BC的距离为h。改以BD、DC为底：两面积之比＝(BD·h/2)/(DC·h/2)＝BD/DC。","以上是同一对三角形的面积比，因此BD/DC＝AB/AC。","若AB:AC＝m:n，BC＝a，可设BD＝mk、DC＝nk；由(m＋n)k＝a解k，再分别求出两段。"],"pitfall":"只讨论内角平分线与线段BC的交点；不能无条件套到外角平分线，或把比例左右对应顺序写反。","diagram":null},{"id":"right30","title":"30°直角三角形：半斜边与边长比","day":0,"kind":"常用二级结论","conditions":["△ABC中∠B＝90°、∠A＝30°，AC为斜边。"],"conclusion":"BC＝AC/2；三条边按“30°对边 : 60°对边 : 斜边”排列，比例为1:√3:2。","proof":["延长CB到D，使BD＝BC，连接AD。C、B、D依次共线。","△ABC与△ABD中，AB公共、BC＝BD、∠ABC＝∠ABD＝90°，所以两三角形全等（SAS）。","于是AC＝AD，∠BAD＝∠BAC＝30°，所以∠CAD＝60°。","△ACD为等腰三角形且顶角为60°，两底角均为(180°－60°)/2＝60°，所以它是等边三角形，AC＝CD。","CD＝CB＋BD＝2BC，因此AC＝2BC，BC＝AC/2。","设BC＝a，则AC＝2a。由勾股定理AB²＝(2a)²－a²＝3a²，所以AB＝√3a，得到1:√3:2。"],"pitfall":"先认准30°所对的边；不是任意一条直角边都等于斜边的一半。","diagram":{"points":{"A":[3.4641016151377544,0,10,24],"B":[0,0,-24,5],"C":[0,2,-22,-8],"D":[0,-2,-22,23]},"edges":[["A","B"],["B","C"],["A","C"]],"aux":[["B","D"],["A","D"]],"right":[{"p":["A","B","C"]}],"equal":[["B","C",1],["B","D",1]],"labels":[{"at":[2.4,0.35],"text":"30°"}]}},{"id":"hypotenuse-median","title":"直角三角形的斜边中线","day":0,"kind":"常用二级结论","conditions":["△ABC中∠B＝90°；M为斜边AC的中点。"],"conclusion":"BM＝AM＝CM＝AC/2。","proof":["延长BM至D，使MD＝BM，连接AD、CD。A、M、C共线，B、M、D共线。","AM＝CM、BM＝DM，∠AMB＝∠CMD为对顶角，所以△AMB≌△CMD（SAS），得到AB＝CD以及AB∥CD。","同理由△CMB≌△AMD（SAS），得到BC∥AD。因此四边形ABCD为平行四边形。","又∠ABC＝90°，所以ABCD是矩形。在Rt△ABC与Rt△DCB中，AB＝DC、BC公共、夹角均为90°，两三角形全等（SAS），所以AC＝DB。","BM＝DB/2，AM＝CM＝AC/2，结合AC＝DB，即得BM＝AM＝CM＝AC/2。"],"pitfall":"直角、斜边、中点三个身份必须核对；一般三角形不能直接写中线等于对边的一半。","diagram":{"points":{"A":[0,0,-20,23],"B":[6,0,10,23],"C":[6,4,10,-12],"M":[3,2,-20,-8],"D":[0,4,-22,-12]},"edges":[["A","B"],["B","C"],["A","C"],["B","M"]],"aux":[["M","D"],["D","A"],["D","C"]],"right":[{"p":["A","B","C"]}],"equal":[["A","M",1],["M","C",1],["B","M",2],["M","D",2]]}},{"id":"perpendicular-bisector","title":"垂直平分线：等距性质、判定与两点定线","day":0,"kind":"性质与判定","conditions":["M为线段AB的中点；P为平面内一点。"],"conclusion":"P在AB的垂直平分线上 ⇔ PA＝PB。两个不同的等距点确定的直线，就是AB的垂直平分线。","proof":["性质方向：若PM⊥AB，则△PMA与△PMB中，PM公共、MA＝MB、夹角均为90°，所以两三角形全等（SAS），得PA＝PB。","判定方向：若PA＝PB且P≠M，则△PMA与△PMB中，PA＝PB、MA＝MB、PM公共，所以两三角形全等（SSS）。","由全等得∠PMA＝∠PMB；两角是邻补角，所以各为90°，PM⊥AB。结合MA＝MB，P在中垂线上。若P＝M，则P本来就在中垂线上。","若X、Y为两个不同的点，且XA＝XB、YA＝YB，则X、Y都在AB的中垂线上；两点确定一条直线，所以XY就是该中垂线。"],"pitfall":"要把两个点到“同一线段的两个端点”等距分别写出；连接的两个点还必须不同。","diagram":null},{"id":"right45","title":"等腰直角三角形的边角关系","day":1,"kind":"常用二级结论","conditions":["△ABC中∠C＝90°，且∠A＝45°，或已知两直角边AC＝BC。"],"conclusion":"∠A＝∠B＝45°，AC＝BC；若直角边为a，则斜边AB＝a√2。","proof":["若已知∠A＝45°，则∠B＝180°－90°－45°＝45°，由等角对等边得AC＝BC。","若先给AC＝BC，则两底角相等，且两角之和为90°，所以各为45°。","设AC＝BC＝a＞0。由勾股定理AB²＝a²＋a²＝2a²，取正值得AB＝a√2。"],"pitfall":"“45°对应两直角边相等”以直角三角形为前提。","diagram":null},{"id":"midsegment","title":"三角形中位线：平行与一半","day":1,"kind":"性质与推论","conditions":["D、E分别是△ABC两边AB、AC的中点。"],"conclusion":"DE∥BC，DE＝BC/2。","proof":["延长DE至F，使EF＝DE，连接CF。A、E、C共线，D、E、F共线。","在△AED与△CEF中，AE＝CE、DE＝FE、∠AED＝∠CEF（对顶角），所以两三角形全等（SAS）。","由全等得AD＝CF，∠DAE＝∠FCE，所以AD∥CF。B、D、A共线，因此BD∥CF。","D为AB中点，所以BD＝AD＝CF。按B—D—F—C顺序组成四边形BDFC，它的一组对边BD、FC平行且相等，因此它是平行四边形。","于是DF∥BC，DF＝BC。DE＝EF，故DE＝DF/2＝BC/2；又D、E、F共线，所以DE∥BC。"],"pitfall":"两端点都要是边的中点；只有一个中点不能直接套定理。","diagram":{"points":{"A":[0,4,-14,-12],"B":[-4,0,-24,24],"C":[4,0,10,24],"D":[-2,2,-25,-8],"E":[2,2,-7,-12],"F":[6,2,10,-8]},"edges":[["A","B"],["B","C"],["C","A"],["D","E"]],"aux":[["E","F"],["C","F"]],"equal":[["A","E",1],["E","C",1],["D","E",2],["E","F",2]]}},{"id":"double-median","title":"倍长中线：构造全等与中线不等式","day":1,"kind":"辅助线模型","conditions":["D为△ABC中BC的中点；延长AD至E，使DE＝AD，连接BE。"],"conclusion":"△BDE≌△CDA，BE＝AC；进而2AD＜AB＋AC。","proof":["BD＝DC（D为中点），DE＝DA（辅助线作法）。直线BC与AE在D相交，所以∠BDE＝∠CDA。","在△BDE与△CDA中，两边及其夹角对应相等，所以△BDE≌△CDA（SAS）；对应关系B↔C、D↔D、E↔A。","由全等得BE＝CA。又A、D、E依次共线，AE＝AD＋DE＝2AD。","A、B、E三个顶点不在同一直线上，所以在△ABE中，两边AB、BE之和大于第三边AE，即AE＜AB＋BE。","代入AE＝2AD、BE＝AC，得到2AD＜AB＋AC。"],"pitfall":"“倍长”要求D在A、E之间且DE＝AD；三角形不等式要放在同一个三角形里使用。","diagram":null},{"id":"parallelogram","title":"平行四边形四种常用判定","day":1,"kind":"判定汇总","conditions":["ABCD为按顺序命名的简单凸四边形。每种判定是一套独立的充分条件。"],"conclusion":"两组对边分别平行；两组对边分别相等；同一组对边平行且相等；两条对角线互相平分。满足其中任一套即可判为平行四边形。","proof":["两组对边分别平行：AB∥CD且AD∥BC，直接符合定义。","两组对边分别相等：连接AC。AB＝CD、BC＝DA、AC公共，得△ABC≌△CDA（SSS）；对应内错角相等，得到AB∥CD、BC∥DA。","一组对边平行且相等：例如AB∥CD且AB＝CD。连接AC，有∠BAC＝∠DCA、AC公共，得△BAC≌△DCA（SAS）；从∠BCA＝∠DAC推出BC∥AD。","两条对角线互相平分：设交点为O，AO＝CO、BO＝DO。利用两组对顶角，分别用SAS证△AOB≌△COD、△AOD≌△COB；对应内错角相等，得到两组对边分别平行。"],"pitfall":"“AB∥CD、AD＝BC”不是同一组对边同时平行且相等，不能用第三种判定。","diagram":null},{"id":"rectangle","title":"矩形：性质与两个常用判定","day":1,"kind":"性质与判定","conditions":["已知ABCD为平行四边形。"],"conclusion":"补一个直角，或补AC＝BD，均可判矩形；矩形四角为90°，对角线相等且互相平分。","proof":["平行四边形有一个直角：其邻角互补，所以相邻角也为90°；对角相等，所以四角都为90°，符合矩形定义。","矩形的对角线相等：△ABC与△DCB中，AB＝DC、BC公共、∠ABC＝∠DCB＝90°，由SAS全等得到AC＝DB。互相平分则来自平行四边形性质。","对角线相等的平行四边形：△ABC与△BAD中，AB公共、BC＝AD、AC＝BD，所以△ABC≌△BAD（SSS）。","因此∠ABC＝∠BAD；这两个角又是平行四边形的一对邻补角，所以各为90°，从而该图形是矩形。"],"pitfall":"任意四边形仅有对角线相等不够；等腰梯形就是反例。","diagram":null},{"id":"rhombus","title":"菱形：邻边、对角线与判定前提","day":1,"kind":"性质与判定","conditions":["已知ABCD为平行四边形；O为两条对角线的交点。"],"conclusion":"一组邻边相等，或对角线互相垂直，均可判菱形。菱形四边相等，对角线互相垂直平分，且每条对角线分别平分所连的一组对角。","proof":["若AB＝BC，结合平行四边形对边相等AB＝CD、BC＝AD，得到四边全部相等，所以是菱形。","若ABCD为菱形，则AO＝CO；在△AOB与△COB中，AB＝CB、AO＝CO、OB公共，用SSS全等得∠AOB＝∠COB。","A、O、C共线，两角和为180°，所以均为90°，AC⊥BD；对角线互相平分来自平行四边形性质。","证明平分顶角：在△ABC与△ADC中，AB＝AD、BC＝DC、AC公共，由SSS全等得∠BAC＝∠DAC、∠BCA＝∠DCA，所以AC平分A、C两角。同理由△ABD≌△CBD（SSS），得BD平分B、D两角。","反过来，若平行四边形AC⊥BD，则在Rt△AOB与Rt△COB中，AO＝CO、OB公共、夹角均为90°，用SAS得两三角形全等，推出AB＝CB。","已有平行四边形身份，再有邻边AB＝CB，由第一步判定为菱形。"],"pitfall":"只给任意四边形对角线垂直不够，还要先有平行四边形身份或另一套充分条件。","diagram":null},{"id":"square","title":"正方形：把两套条件合在一起","day":1,"kind":"性质与判定","conditions":["路线一：已是矩形且一组邻边相等。路线二：已是菱形且有一个直角。"],"conclusion":"矩形＋邻边相等 ⇒ 正方形；菱形＋一个直角 ⇒ 正方形。正方形兼具矩形、菱形的全部性质。","proof":["路线一：矩形四角都是90°，两组对边分别相等；补一组邻边相等后，四条边全相等，所以是正方形。","路线二：菱形四边全相等；补一个直角后，由平行四边形邻角互补、对角相等，得到四个直角，所以是正方形。","因此正方形对角线既相等，又互相垂直平分；对角线分别平分所连顶角。"],"pitfall":"一个直角加一组邻边相等，不足以判任意四边形为正方形；先确认矩形、菱形或平行四边形身份。","diagram":null},{"id":"rhombus-area","title":"菱形面积＝对角线乘积的一半","day":1,"kind":"常用二级结论","conditions":["ABCD为菱形，两条对角线AC、BD交于O。"],"conclusion":"S菱形ABCD＝AC·BD/2；边长AB²＝(AC²＋BD²)/4。","proof":["菱形对角线垂直平分：AO＝CO＝AC/2，BO＝DO＝BD/2，且AC⊥BD。","四个小三角形AOB、BOC、COD、DOA均为直角三角形，每个面积为(AC/2)·(BD/2)/2＝AC·BD/8。","四个面积相加，S＝4·AC·BD/8＝AC·BD/2。","在Rt△AOB中，由勾股定理AB²＝AO²＋BO²＝AC²/4＋BD²/4。"],"pitfall":"乘积前的1/2不能漏；边长公式要先确认两条对角线垂直且互相平分。","diagram":null},{"id":"midpoint-quadrilateral","title":"中点四边形与原图对角线","day":1,"kind":"常用二级结论","conditions":["E、F、G、H依次是简单凸四边形ABCD四边的中点。"],"conclusion":"EFGH总是平行四边形，边长分别为原图两条对角线的一半；若内层是矩形，则AC⊥BD。只有再给外层为平行四边形，才可进一步判外层为菱形。","proof":["在△ABC与△ADC中应用中位线：EF∥AC、HG∥AC，且EF＝HG＝AC/2。","在△BCD与△BAD中应用中位线：FG∥BD、EH∥BD，且FG＝EH＝BD/2。因此EFGH为平行四边形。","若EFGH是矩形，则HG⊥FG。由HG∥AC、FG∥BD，得到AC⊥BD。","若外层ABCD另已知为平行四边形，则可由垂直对角线判定外层为菱形；若没有该前提，就不能直接下此结论。","内层周长＝2(AC/2＋BD/2)＝AC＋BD。结合外层菱形面积，常可同时求对角线的和与积。"],"pitfall":"“内层中点四边形为矩形”不能单独推出任意外层四边形是菱形。","diagram":null},{"id":"coordinates","title":"坐标表示长度、面积与等腰分类","day":1,"kind":"方法结论","conditions":["在平面直角坐标系中，P(x₁,y₁)、Q(x₂,y₂)。长度按非负值计算，动点另有题给范围。"],"conclusion":"PQ²＝(x₂－x₁)²＋(y₂－y₁)²；水平长度取横坐标差的绝对值，竖直长度取纵坐标差的绝对值。等腰分类要检查三组边相等。","proof":["过两点作水平、竖直辅助线，可组成直角三角形，两直角边长分别为|x₂－x₁|、|y₂－y₁|。","由勾股定理得PQ²＝(x₂－x₁)²＋(y₂－y₁)²；水平或竖直时其中一项为0。","求三角形面积时，先选一条水平或竖直边为底，再用顶点到该边所在直线的垂直距离为高。","等腰三角形可能是第一边＝第二边、第一边＝第三边、第二边＝第三边，三种都要列出或说明不可能。","解出参数后逐一检验点的取值范围、端点是否允许、三点是否共线及是否有重复解。"],"pitfall":"不要把斜线段长当成横坐标之差，也不要解出方程就省略范围检查。","diagram":null},{"id":"diameter-angle","title":"直径所对的圆周角是直角","day":2,"kind":"课本性质","conditions":["AB为⊙O的直径，C在圆上且不同于A、B。"],"conclusion":"∠ACB＝90°。直径是AB，圆周角顶点是C。","proof":["连接OC。OA＝OC，所以△AOC中∠OAC＝∠ACO，记为α。","OB＝OC，所以△BOC中∠OBC＝∠BCO，记为β。","因为O在线段AB内部，∠CAB＝α、∠CBA＝β，且∠ACB＝α＋β。","在△ABC中，α＋β＋(α＋β)＝180°，所以α＋β＝90°，即∠ACB＝90°。"],"pitfall":"圆周角的顶点必须在圆上；∠AOB是圆心角，不能套这个结论。","diagram":null},{"id":"circle-angles","title":"同弧角与圆内接四边形","day":2,"kind":"课本定理与推论","conditions":["同圆或等圆中，比较的是同一条弧或等弧；圆内接四边形的四个顶点按顺序位于圆上。"],"conclusion":"同弧或等弧所对圆周角相等；同弧所对圆周角等于对应圆心角的一半。圆内接四边形的对角互补。","proof":["圆周角定理的起点：设∠APB顶点P在圆上，先看PB为直径的情形。连接OA，OA＝OP，所以∠OAP＝∠APO＝α；∠AOB是△AOP在O处的外角，故∠AOB＝2α，而∠APB＝α，得到圆周角等于所对圆心角的一半。","一般情形：过圆周角顶点P作直径PQ。若射线PQ在∠APB内部，将原角分为∠APQ与∠QPB；分别用上一步，两小角各等于所对弧AQ、QB度数的一半，相加得到原角等于所对弧AB度数的一半。","若射线PQ在∠APB外部，则用同一方法求两个以PQ为一边的角，再按射线位置相减；对应弧度数也作同样相减，结论仍为原角等于所对弧度数的一半。若PQ与角的一边重合，就是第一步。","因此同弧或等弧所对的圆周角相等。这里用的是同一条弧，而不能只看弦的端点相同。","设ABCD为圆内接四边形。∠BAD对应不经过A的弧BCD，∠BCD对应不经过C的弧BAD。","这两条弧合成整圆，弧度数之和为360°，两角分别为所对弧度数的一半，因此∠BAD＋∠BCD＝180°。同理另一组对角也互补。"],"pitfall":"“同一条弦”不等于“同一条弧”；顶点位于该弦两侧的两圆周角通常互补，不能直接说相等。","diagram":null},{"id":"perpendicular-chord","title":"垂径定理与弦心距","day":2,"kind":"课本性质与计算推论","conditions":["O为圆心，AB为弦，OH⊥AB于H；OA＝OB＝r。"],"conclusion":"AH＝HB＝AB/2，且OH²＋(AB/2)²＝r²。逆用“平分弦的直径垂直弦”时，该弦须不是直径。","proof":["在Rt△OHA与Rt△OHB中，OA＝OB为半径，OH为公共直角边，所以两三角形全等（HL）。","因此AH＝BH，结合AH＋BH＝AB，得到AH＝BH＝AB/2。","连接OA。在Rt△OHA中应用勾股定理：OA²＝OH²＋AH²，代入OA＝r及AH＝AB/2即可。","逆用：若H为一条非直径弦AB的中点，则O与H不重合，线段OH的长度大于0。OA＝OB、AH＝BH、OH公共，SSS全等得到∠OHA＝∠OHB；两角互补，所以各为90°。"],"pitfall":"勾股式中使用半弦，不是整弦；若AB是直径，则H＝O，线段OH的长度为0，无法组成上述直角三角形，因此以上逆用证明不适用。","diagram":null},{"id":"tangent","title":"切线性质与判定：切点已知","day":2,"kind":"课本性质与判定","conditions":["P为⊙O上的点，直线l经过P。"],"conclusion":"l在P处相切 ⇔ OP⊥l。证明切线时必须同时有“P在圆上”和“OP垂直l”。","proof":["判定方向：设OP⊥l，取l上任一点Q≠P，则Rt△OPQ中OQ²＝OP²＋PQ²＞OP²＝r²，所以Q不在圆上。","P本身在圆上，而直线l上没有其他圆上点，因此l与圆只有一个交点P，l为切线。","性质方向：已知l与圆只有一个交点P，故O不在l上，否则l过圆心，会交圆于一直径的两个端点。作OH⊥l，垂足为H。","若H≠P，在l上取P关于H的对称点Q，则Q≠P且HQ＝HP。在两个直角三角形中用勾股定理，OQ²＝OH²＋HQ²＝OH²＋HP²＝OP²＝r²。","所以Q也在圆上，与只有一个交点矛盾。故H＝P，于是OP⊥l。"],"pitfall":"直线过圆上一点且垂直一条别的半径，不足以判定在该点相切。","diagram":null},{"id":"tangent-distance","title":"切点未知：圆心到直线距离等于半径","day":2,"kind":"常用二级结论","conditions":["过圆心O作OH⊥直线l，H为垂足；圆半径r＞0。"],"conclusion":"OH＝r ⇒ l为圆在H处的切线。证明的关键是先让垂足H落在圆上。","proof":["若OH＝r，则按圆的定义，H到圆心的距离等于半径，所以H在⊙O上。","又OH⊥l且H在l上，由“切点已知”的切线判定，可得l在H处相切。","也可直接验证唯一交点：任取l上Q≠H，OQ²＝OH²＋HQ²＞r²，所以Q不在圆上；l与圆只交于H。","相应位置关系是：OH＞r时相离；OH＝r时相切；OH＜r时相交。"],"pitfall":"任意圆心都可以向任意直线作垂线；只有垂直关系不能证明相切，还要证明OH＝r。","diagram":null},{"id":"transforms","title":"平移、旋转、折叠：完整对应关系","day":2,"kind":"基本变换性质","conditions":["先明确原图与像图的对应点；平移给方向和距离，旋转给中心、方向、角度，折叠给折痕。"],"conclusion":"三种变换都保持对应长度和角度；旋转中心、折痕上的点不动。平移中的每个点具有相同位移。","proof":["先写对应点，例如A↔A′、B↔B′、C↔C′。由变换的保距、保角性质，AB＝A′B′、BC＝B′C′、∠ABC＝∠A′B′C′等。","平移：AA′、BB′、CC′方向相同、长度相等；对应边平行或共线。","绕O旋转：O不动，OA＝OA′、OB＝OB′；射线OA转到OA′、OB转到OB′的有向转角等于题给旋转角。","沿l折叠：l上的点不动，线段与角映成对应的等长线段、相等角，图形朝向翻转。","这些是变换本身的基础性质；做题时应把它们落实为具体点名的等式，再接全等、相似或勾股定理。"],"pitfall":"不能把旋转角当成任意两条线的夹角；共线线段的角度与方向要按具体射线判断。","diagram":null},{"id":"rotation-isosceles","title":"旋转后连接对应点形成等腰三角形","day":2,"kind":"常用二级结论","conditions":["以O为中心旋转，P映到P′；P≠O，P′≠P。这里取0°＜θ＝∠POP′＜180°。"],"conclusion":"OP＝OP′，△OPP′为等腰三角形，两底角均为(180°－θ)/2。","proof":["旋转保留点到中心的距离，所以OP＝OP′，得到等腰三角形OPP′。","等腰三角形等边对等角，记∠OPP′＝∠OP′P＝α。","内角和给2α＋θ＝180°，解得α＝(180°－θ)/2。","例如θ＝50°，则两底角均为65°。本页旋转题对B、B′和C、C′分别使用这一结论。"],"pitfall":"当旋转转角大于180°时，小于180°的三角形顶角要重新判断，不能直接把有向转角代入公式。","diagram":null},{"id":"fold-bisector","title":"折痕垂直平分原点与像点的连线","day":2,"kind":"常用二级结论","conditions":["沿直线l折叠，A映到E，A≠E；P、Q是折痕上两个不同的点。"],"conclusion":"PA＝PE、QA＝QE；折痕l是线段AE的垂直平分线。只有折痕与AE的交点才是AE的中点。","proof":["P、Q在折痕上不动；折叠将线段PA映成PE、QA映成QE，故PA＝PE、QA＝QE。","由线段垂直平分线的判定，P、Q都在AE的垂直平分线上。","P、Q为两个不同的点，它们确定的直线PQ就是AE的垂直平分线，因此l⊥AE，且l与AE的交点平分AE。","在折叠计算题中，PA＝PE可先设为x，再把另一段写成“整段－x”，放进直角三角形用勾股定理列式。"],"pitfall":"折痕上的任意点P未必是AE中点；也不能由折痕交原图某条边，就说它平分那条边。","diagram":null},{"id":"parallel-perpendicular","title":"两线同垂直于一线，为什么平行","day":2,"kind":"基础推论","conditions":["在同一平面内，l、m是两条不同的直线，且l⊥n、m⊥n。"],"conclusion":"l∥m；若两线重合，则不能称为两条不同的平行线。","proof":["以n为截线，l与m分别和n构成直角。","相应的一组同位角都为90°，所以这组同位角相等。","由同位角相等、两直线平行，得到l∥m。"],"pitfall":"证明时把两条待证平行线都垂直于哪一条直线写清；还需同一平面内。","diagram":null},{"id":"similar-area","title":"相似三角形：对应边、对应高与面积比","day":1,"kind":"已有方法与常用推论","conditions":["先用两角分别相等（AA）等已学判定确认相似；每个三角形的三个顶点都不在同一直线上，顶点按对应顺序命名。"],"conclusion":"若△ABC∽△DEF，则A↔D、B↔E、C↔F，AB/DE＝BC/EF＝AC/DF＝k＞0；对应高之比为k，面积比为k²。","proof":["AA判定的写法：若∠A＝∠D、∠B＝∠E，第三组角由内角和也相等，按A↔D、B↔E、C↔F写△ABC∽△DEF。AA是已学的基础相似判定。","相似成立后，按对应顶点取边：AB对应DE、BC对应EF、AC对应DF，所以AB/DE＝BC/EF＝AC/DF；不能在某一项中颠倒分子与分母。","分别从一对对应顶点向对应底边所在直线作高。对应角相等，作出的两个对应直角三角形可由AA判为相似。","由对应边成比例，得到两条对应高的比等于对应底边的比k。若垂足恰为底边端点，则直接使用原相似关系的对应直角边。","设两底为b₁、b₂，两对应高为h₁、h₂，则S₁/S₂＝(b₁h₁/2)/(b₂h₂/2)＝(b₁/b₂)(h₁/h₂)＝k²。"],"pitfall":"比例各项要统一方向；若边长比为2:3，面积比为4:9。解动点题还要排除三个顶点共线、不能组成三角形的位置。","diagram":null},{"id":"equal-triangles","title":"等腰等边：等边、等角的互推","day":0,"kind":"性质与判定","conditions":["A、B、C三个顶点不在同一直线上；讨论AB、AC与它们的对角∠C、∠B。"],"conclusion":"AB＝AC ⇔ ∠B＝∠C；三边相等 ⇔ 三角相等 ⇔ 三角均为60°。等腰三角形中有一个角为60°，即可推出等边。","proof":["等边推等角：已知AB＝AC，作顶角A的平分线AD交BC于D。AB＝AC、AD公共、∠BAD＝∠CAD，得△ABD≌△ACD（SAS），于是∠B＝∠C。","等角推等边：已知∠B＝∠C，仍作顶角平分线AD。两侧三角形有∠BAD＝∠CAD、∠ABD＝∠ACD及公共边AD，由AAS全等，得到AB＝AC。","三边相等时，分别使用等边对等角，得三个角相等。三角形内角和为180°，所以各为60°。反过来，三个角相等时用等角对等边，得三边相等。","等腰顶角为60°时，两底角各为(180°－60°)/2＝60°；若给一个底角为60°，另一底角也为60°，顶角为180°－120°＝60°。两种情形都得到等边。"],"pitfall":"等角对等边要在同一个三角形中使用，并认准每个角对面的边。","diagram":null},{"id":"parallelogram-properties","title":"平行四边形的对边、邻角和对角线性质","day":1,"kind":"课本性质","conditions":["ABCD为平行四边形；AC、BD相交于O。"],"conclusion":"AB＝CD、AD＝BC；对角相等、邻角互补；AO＝CO、BO＝DO。","proof":["连接AC。由AB∥CD得∠BAC＝∠DCA，由BC∥AD得∠BCA＝∠DAC，AC公共，所以△BAC≌△DCA（ASA）。","由全等得AB＝CD、BC＝DA、∠ABC＝∠CDA。再由平行线同旁内角互补，∠BAD＋∠ABC＝180°、∠ABC＋∠BCD＝180°，从而∠BAD＝∠BCD。","AB∥CD给∠ABO＝∠CDO、∠BAO＝∠DCO；又AB＝CD，所以△ABO≌△CDO（ASA）。","对应边相等，得到AO＝CO、BO＝DO，即两条对角线互相平分。"],"pitfall":"对角线互相平分，不代表两条对角线彼此相等；彼此相等需要矩形等额外条件。","diagram":null},{"id":"centroid","title":"三角形重心：三中线共点与2∶1","day":0,"kind":"重心性质与完整推导","conditions":["A、B、C三个顶点不在同一直线上。D、E、F分别是BC、CA、AB的中点，AD、BE、CF为三条中线。"],"conclusion":"三条中线交于同一点G，G叫三角形的重心。G总在三角形内部，且AG:GD＝BG:GE＝CG:GF＝2:1。较长的“2份”靠近顶点；AG＝2AD/3，GD＝AD/3。确认两条中线后，它们的交点就能确定重心。","proof":["先取两条中线AD、BE在三角形内部的交点G，连接DE。D是BC中点，E是CA中点，所以在△CBA中，DE是中位线，DE∥AB且DE＝AB/2。","A、G、D依次共线，B、G、E依次共线。因此∠DGE＝∠AGB（对顶角），∠GDE＝∠GAB（DE∥AB形成的内错角），故△GDE∽△GAB（AA）。对应关系G↔G、D↔A、E↔B。","由对应边成比例，GD/GA＝GE/GB＝DE/AB＝1/2。所以GA＝2GD、GB＝2GE，即AG:GD＝BG:GE＝2:1。","证明第三条中线也经过G：设CF与AD交于G′。D、F分别为BC、BA中点，在△BCA中，DF∥CA，DF＝CA/2。","A、G′、D共线，C、G′、F共线。利用对顶角及DF∥CA，同样可得△G′DF∽△G′AC（AA），所以G′D/G′A＝G′F/G′C＝DF/AC＝1/2。","由AG＝2GD且AG＋GD＝AD，得AG＝2AD/3。同理由AG′＝2G′D，得AG′＝2AD/3。G、G′均在线段AD上，到A的距离相同，所以G′与G是同一点。于是第三条中线CF也经过G。","将G′＝G代回第5步，得GF/GC＝1/2，即CG:GF＝2:1。三条中线的分段比至此全部得到，共同交点G就是重心。","以AD为例，设GD＝k，则AG＝2k，AD＝3k，所以AG＝2AD/3、GD＝AD/3。G位于中线AD的内部，且也在另外两条中线上，因此位于三角形内部。"],"pitfall":"重心是中线的交点，不是把高或角平分线的交点换一个名称。2∶1是“顶点到重心 : 重心到对边中点”，不能写反，也不能把整条中线当成2份。一般不能推出AG＝BG＝CG或AD⊥BC。","diagram":{"points":{"A":[-1,6,-12,-13],"B":[-4,0,-24,24],"C":[5,0,10,24],"D":[0.5,0,-5,25],"E":[2,3,13,0],"F":[-2.5,3,-27,0],"G":[0,2,11,14]},"edges":[["A","B"],["B","C"],["C","A"],["A","D"],["B","E"],["C","F"]],"aux":[["D","E"],["D","F"]],"equal":[["B","D",1],["D","C",1],["C","E",2],["E","A",2],["A","F",3],["F","B",3]],"alt":"三角形ABC的三条中线AD、BE、CF交于重心G；D、E、F分别是对边中点"}},{"id":"centroid-area","title":"重心面积关系：三个1/3与六个1/6","day":0,"kind":"重心与面积的常用推论","conditions":["D、E、F分别是△ABC的BC、CA、AB中点，三条中线交于重心G；三角形面积大于0。"],"conclusion":"S△ABG＝S△BCG＝S△CAG＝S△ABC/3。三条中线分出的六个小三角形AGF、BGF、BGD、CGD、CGE、AGE面积都等于S△ABC/6。它们面积相等，一般不能推出它们全等。","proof":["BD＝DC。△BGD、△CGD以BD、DC为底，从G到直线BC的高相同，所以两者面积相等，设各为x。","△ABG与△BGD分别以AG、GD为底，从B到直线AD的高相同。重心给AG:GD＝2:1，因此S△ABG＝2S△BGD＝2x。","同理，△ACG与△CGD分别以AG、GD为底，从C到AD的高相同，得到S△ACG＝2S△CGD＝2x。","△BCG由△BGD、△CGD拼成，面积为x＋x＝2x。于是△ABG、△BCG、△CAG的面积都是2x。","这三个大三角形无重叠地拼成△ABC，所以S△ABC＝2x＋2x＋2x＝6x，得到x＝S△ABC/6，每个大三角形面积为S△ABC/3。","F是AB中点，因此△AGF、△BGF以AF、FB为底时同高且等底，各占S△ABG的一半，所以各为x。","E是AC中点，同理△AGE、△CGE各占S△ACG的一半，各为x。再加上开始的△BGD、△CGD，六个小三角形面积都为x，即总面积的1/6。"],"pitfall":"“六等分”指面积，不是六个小三角形一定全等，也不是所有小线段都相等；先核对D、E、F都是中点、G确为重心。","diagram":{"points":{"A":[-1,6,-12,-13],"B":[-4,0,-24,24],"C":[5,0,10,24],"D":[0.5,0,-5,25],"E":[2,3,13,0],"F":[-2.5,3,-27,0],"G":[0,2,11,14]},"edges":[["A","B"],["B","C"],["C","A"],["A","D"],["B","E"],["C","F"]],"aux":[],"equal":[["B","D",1],["D","C",1],["C","E",2],["E","A",2],["A","F",3],["F","B",3]],"alt":"三角形ABC的三条中线AD、BE、CF交于重心G；D、E、F分别是对边中点"}}];
const STORE='honghao_geometry_three_nights_v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch{}
let state={day:0,index:0,filter:'all',font:22,focus:false,stage:'review',...saved.view};
let reviewData=saved.reviewData||{};
if(!['review','exercise'].includes(state.stage))state.stage='review';
state.day=Math.max(0,Math.min(2,Number(state.day)||0));state.font=Math.max(18,Math.min(30,Number(state.font)||22));
let progress=saved.progress||{},reveal={},auxiliary={},marks={},hintSeen={},toastTimer;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(STORE,JSON.stringify({view:state,progress,reviewData}))}catch{}}
function current(){const list=QUESTIONS.filter(q=>q.day===state.day);return list[Math.min(list.length-1,Math.max(0,state.index))]}
function notify(msg){clearTimeout(toastTimer);$('#toast').textContent=msg;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2200)}
function saveNote(){const q=current(),note=$('#notes');if(note){progress[q.id]={...(progress[q.id]||{}),note:note.value};persist()}}
function selectQuestion(day,index){saveNote();state.day=day;state.index=index;state.stage='exercise';persist();render();window.scrollTo({top:0,behavior:'instant'})}
function svgFigure(d,aux=false,showMarks=true){
 if(!d)return '<p>请在草稿纸上按题意画图。</p>';
 const W=560,H=390,P=48,pts=d.points||{},all=Object.values(pts).map(v=>[v[0],v[1]]);
 for(const c of d.circles||[]){const o=typeof c.center==='string'?pts[c.center]:c.center;all.push([o[0]-c.r,o[1]-(c.semi?0:c.r)],[o[0]+c.r,o[1]+c.r])}
 const xs=all.map(v=>v[0]),ys=all.map(v=>v[1]);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 const scale=Math.min((W-2*P)/(maxX-minX||1),(H-2*P)/(maxY-minY||1));
 const X=x=>(W-(maxX-minX)*scale)/2+(x-minX)*scale,Y=y=>(H-(maxY-minY)*scale)/2+(maxY-y)*scale;
 const xy=k=>{let p=typeof k==='string'?pts[k]:k;return [X(p[0]),Y(p[1])]};
 const line=(a,b,cls='geo-line')=>{let A=xy(a),B=xy(b);return `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" class="${cls}"/>`};
 let body='';
 for(const poly of d.fill||[]){if(poly.aux&&!aux)continue;body+=`<polygon points="${poly.points.map(k=>xy(k).join(',')).join(' ')}" fill="${poly.color||'#d9e9ff'}" opacity=".65"/>`}
