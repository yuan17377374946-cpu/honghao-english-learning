P('p10','垂直对角线怎样判菱形','ABCD是平行四边形，AC⊥BD，交点O。','ABCD是菱形。','已经有平行四边形，只需补出一组邻边相等。',[

 'ABCD是有一组邻边相等的平行四边形，故为菱形。',

P('p11','四边相等与内角平分线的判定','路线一：AB＝BC＝CD＝DA；路线二：平行四边形中AC平分∠DAB。','两条路线都能判菱形。','先有图形身份，再从等角得到邻边相等。',[

 '又有AB＝BC，故它是有一组邻边相等的平行四边形，即菱形。',
 '路线二：ABCD是平行四边形，BC∥AD，所以∠BCA＝∠CAD。',

],'“有一条角平分线”不是单独判一般四边形为菱形的充分条件。','rhombus'),
P('p12','正方形的判定与45°结构','从矩形、菱形或平行四边形的已有身份出发。','补齐正方形的两类条件。','正方形同时是矩形和菱形，不必另背一套孤立规则。',[

 '若已是菱形，补一个直角即可判矩形；若补对角线相等，也可先判矩形。',

 '对角线又垂直，因此交点周围四个三角形均为等腰直角三角形，且彼此全等。',

P('p13','三角形中位线怎样证明','D、E分别为△ABC的AB、AC中点。','DE∥BC且DE＝BC/2。','延长DE到F使EF＝DE，先用全等转移一组边。',[

 '对应边和角相等得AD＝CF、∠DAE＝∠FCE，所以AD∥CF。因B、D、A共线，BD∥CF。',

],'先说明D、E在哪个三角形的哪两边上。','mid'),
P('p14','中点四边形的分类与面积','E、F、G、H依次为凸四边形ABCD各边中点。','EFGH是平行四边形，并由原对角线控制特殊形状。','每一条新边都放回一个三角形中，利用中位线。',[
 '在△ABC与△ADC中，EF∥AC、HG∥AC，且EF＝HG＝AC/2。',
 '在△BCD与△BAD中，FG∥BD、EH∥BD，且FG＝EH＝BD/2。因此新图是平行四边形。',
 '若AC⊥BD，则EF⊥FG，新图有一个直角，所以为矩形。若AC＝BD，则EF＝FG，所以新图为菱形。两条件兼有时为正方形。',
 '边长关系还给出新图周长＝2(AC/2＋BD/2)＝AC＋BD。',
 '△AEH与△ABD的两组邻边比分别为1/2，夹角A相同，两三角形相似，面积比1/4。同理，四角小三角形面积之和＝(S△ABD＋S△ABC＋S△BCD＋S△CDA)/4。',
 '括号里恰为原四边形面积的2倍，故四角面积和为原面积的一半；剩余的中点四边形也占一半。'
],'原图为一般四边形时，新图为矩形不能直接推出原图为菱形。','midpoint'),
P('p15','菱形面积为什么是对角线乘积的一半','凸四边形AC⊥BD，交点O在两条对角线内部。','面积＝AC×BD/2；菱形是其特殊情形。','把整块面积拆成四个直角三角形。',[
 '四个三角形的面积分别为AO·BO/2、CO·BO/2、CO·DO/2、AO·DO/2。',
 '相加并分组：S＝[(AO＋CO)BO＋(AO＋CO)DO]/2。',
 '提取共同因式：S＝(AO＋CO)(BO＋DO)/2＝AC·BD/2。',

],'这个面积公式成立，并不反过来说明图形一定是菱形。','rhombus'),
P('p16','四个等面积三角形为何不都全等','平行四边形ABCD的两条对角线交于O。','S△AOB＝S△BOC＝S△COD＝S△DOA。','用中点把相同高度的三角形配对。',[

 'BO＝DO，所以△AOB和△AOD以BO、DO为底时，从A到BD的高相同，面积相等。',
 '同理由中点与同高关系得到其余两块也相等，四块各占总面积的1/4。',
 '相对两块如△AOB与△COD，有AO＝CO、BO＝DO及对顶角相等，可用SAS判全等。',

P('p17','梯形中位线与等腰梯形','拓展：梯形ABCD中AB∥CD，E、F为AD、BC中点。','EF∥AB且EF＝(AB＋CD)/2。','补一条对角线AC，以其中点连接两个腰的中点。',[
 '取AC中点M。在△ADC中，EM∥CD，EM＝CD/2。',

 'AB∥CD，所以EM与MF平行；又同过M，因此E、M、F共线。',
 'M在E、F之间，因此EF＝EM＋MF＝(CD＋AB)/2，EF平行于两底。',
 '等腰梯形可从较短底两端向长底作高。两个直角三角形斜边是两条相等的腰，高相等，用HL证全等，得到同底两角相等。',

P('p18','圆内接四边形与矩形共圆','圆上四点按A、B、C、D依次排列；另讨论矩形。','圆内接四边形对角互补；矩形四顶点共圆。','圆周角对应的两段弧合成一整圆。',[
 '圆周角∠A所对的是不含A的弧BCD，∠C所对的是不含C的弧DAB。两弧合为整圆。',

],'使用圆周角时先指出具体所对弧。','rect'),
P('p19','角平分线与平行边怎样产生等腰','平行四边形ABCD中，AE平分∠DAB，交BC于内部点E。','AB＝BE，并理解E的位置条件。','把平分角的一半，借平行线搬到三角形另一端。',[
 'AD∥BC且E在BC上，所以∠DAE＝∠AEB（内错角）。',
 'AE平分∠DAB，故∠BAE＝∠DAE。',
 '结合得到∠BAE＝∠AEB。在△ABE中，等角对等边，故AB＝BE。',
 '若E在线段BC内部，就有AB＝BE＜BC；若AB＝BC，交点到C；若AB＞BC，则应在BC越过C的延长线上讨论。',
 '相邻内角互补，分别取一半后和为90°，可进一步研究两条内角平分线的垂直关系；须排除交点重合等退化情形。'
],'从内部情形改到延长线，不能未经点序检查直接写差。','angle'),
P('p20','正方形半角：怎样转出线段和','正方形ABCD中，E、F分别在BC、CD内部，∠EAF＝45°。','EF＝BE＋DF；并联系60°菱形。','把△ABE绕A旋转90°，使B落到D，转移BE。',[
 '旋转得到点X，AB落到AD，AE落到AX，因此AX＝AE、DX＝BE，X、D、F依次共线。',
 '∠XAE＝90°，而∠EAF＝45°，所以∠XAF＝45°。',
 '在△AXF与△AEF中，AX＝AE、AF公共、夹角都为45°，故两三角形全等（SAS）。',
 '所以XF＝EF。又XF＝XD＋DF＝BE＋DF，得到EF＝BE＋DF。',
 '相关结构：菱形ABCD若∠BAD＝60°且边长a，△ABD为等边三角形，BD＝a。由半对角线勾股得AC＝√3a，面积＝√3a²/2。'

P('p21','中线等于半边，为什么能反推直角','△ABC中，M为BC中点，AM＝BC/2。','∠BAC＝90°；并比较四种中点辅助线。','先把条件变成三条等长线段。',[
 'M为BC中点，故BM＝CM＝BC/2；又AM＝BC/2，所以AM＝BM＝CM。',
 '设∠BAM＝α、∠MAC＝β。由AM＝BM，△ABM等腰，得∠ABM＝α；由AM＝CM，得∠ACM＝β。',
 'M在BC上，所以∠ABC＝α，∠ACB＝β，∠BAC＝α＋β。',
 '由△ABC内角和，(α＋β)＋α＋β＝180°，故α＋β＝90°，即∠BAC＝90°。',
 '选辅助线时比较：两个边中点用中位线；经过中点且要转移线段可倍长；直角与斜边中点用半斜边；等腰底边中点用三线合一。'
],'必须是“一边上的中线”等于该边一半，任意一条半长线段不够。','converse'),
P('p22','距离和、平方和与面积定值','矩形ABCD；距离和先限定P在内部。','找到随点移动保持不变的量。','把每个量还原为高或勾股表达式，再合并相消。',[
 '矩形内部一点P到一组对边作垂线，两段垂距相加恰为这两条平行线之间的固定距离。因此该距离和不变。',
 '设A(0,0)、B(a,0)、C(a,b)、D(0,b)、P(x,y)。由勾股，PA²＝x²＋y²，PC²＝(x−a)²＋(y−b)²。',
 '同理PB²＝(x−a)²＋y²，PD²＝x²＋(y−b)²。相加比较得到PA²＋PC²＝PB²＋PD²；这条平方和关系对任意平面点P都成立。',
 '底边固定、另一顶点在与底边平行的直线上移动，三角形高等于两平行线间固定距离，故面积不变。',
 '最值与定值不同：最值还要证明界限，并检查等号位置是否在允许范围内；垂足不在线段内时，须比较端点。'
],'平方和不能去掉平方写成距离和。','rect')
];

const EXAMS=[{"id":"exam-cqb2024-21","day":1,"type":"exam","title":"矩形中的中垂线与菱形","year":2024,"region":"重庆B卷","number":"第21题","source":"https://kaosj.com/papers/2024/07/2024-zhongkao-math-chongqing-1ecbaa81ce-paper/","tags":["垂直平分线","全等应用","菱形判定","证明填空"],"difficulty":"中等应用","time":"12分钟","stem":["矩形ABCD中，O为对角线AC的中点。过O作AC的垂线，分别交AB、CD于E、F；连接AF、CE。"],"asks":["证明四边形AECF为菱形。","选做：原矩形改为平行四边形，且上述交点仍存在时，结论是否仍成立？"],"hint":["题目先让你补出全等，最终却要证菱形：全等会给哪一组对角线被平分？","平行四边形的对角线互相平分；菱形还需要再增加什么？"],"steps":[{"title":"列出平行线与中点条件","body":"矩形ABCD有AB∥CD。E在AB上、F在CD上，所以AE∥CF。O是AC中点，故AO＝CO，且A、O、C共线，E、O、F共线。","why":"矩形性质；题设交点和中点。"},{"title":"分别找两组对应角","body":"AE∥CF，以EF为截线，∠CFO＝∠AEO；以AC为截线，∠OCF＝∠OAE。","why":"平行线的内错角相等，按题图的射线位置对应。"},{"title":"按AAS写出全等","body":"在△CFO与△AEO中，有上述两组对应角相等，且CO＝AO，所以△CFO≌△AEO（AAS）。对应关系C↔A、F↔E、O↔O。","why":"两角及其中一角的对边对应相等。"},{"title":"全等给第二条对角线中点","body":"由全等得FO＝EO。原来已有AO＝CO，所以O同时平分AC与EF。","why":"全等三角形对应边相等。"},{"title":"先证明目标图形是平行四边形","body":"四边形按A—E—C—F顺序命名，它的对角线是AC和EF。两对角线互相平分，故AECF为平行四边形。","why":"平行四边形判定，注意图形的顶点顺序。"},{"title":"再补垂直判菱形","body":"题设EF⊥AC。AECF已是平行四边形，且对角线互相垂直，所以AECF是菱形。","why":"菱形判定，平行四边形前提已证出。"},{"title":"延伸时逐项检查条件","body":"把外层矩形改成平行四边形，AB∥CD仍成立，O为AC中点、EF⊥AC等条件也保留，因此上面每一步仍成立，结论仍是菱形；须保证题设的交点存在且按图构成所述四边形。","why":"证明只用到外层的一组对边平行，没有用到外层直角。"}],"answer":"（1）四边形AECF是菱形；（2）原图改为平行四边形且上述交点存在时，结论仍成立。","pitfall":"四边形顺序是AECF，AC与EF才是它的两条对角线；仅有对角线垂直不能判任意四边形为菱形，必须先证明平行四边形；延伸猜想不是所有垂线一定交边内；保留图中相交条件。","diagram":{"points":{"A":[0,4],"B":[8,4],"C":[8,0],"D":[0,0],"O":[4,2],"E":[5,4],"F":[3,0]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["A","C"],["E","F"],["A","F"],["C","E"]],"aux":[],"right":[{"p":["A","O","E"]}],"equal":[["A","O",1],["O","C",1]]},"presentation":"原题为尺规作图与证明填空；此处整理条件，调整为完整证明及延伸问答。","lemmas":["parallelogram","rhombus","angle-tools"]},{"id":"exam-bj2025-20","day":1,"type":"exam","title":"中位线连接矩形证明","year":2025,"region":"北京","number":"第20题","source":"https://zy.21cnjy.com/23366730","tags":["三角形中位线","矩形判定","作高","勾股定理"],"difficulty":"中等应用","time":"14分钟","stem":["D、E分别为△ABC的AB、AC中点。从D向BC作垂线，垂足为F；G在DE的延长线上，且DG＝FC。点的位置按题图：B、F、C依次在线段BC上，D、E、G依次共线。"],"asks":["证明四边形DFCG是矩形。","若∠B＝45°，DF＝3，DG＝5，求BC、AC。"],"hint":["先看D、E这两个中点能给哪一条平行关系。","证明矩形可以先证明平行四边形，再补一个直角。","第二问可过A作BC上的高；中点让这条高与DF形成2倍关系。"],"steps":[{"title":"两个中点先给中位线","body":"D、E分别为AB、AC的中点，所以DE是△ABC的中位线，DE∥BC。","why":"三角形中位线定理，两个中点条件都满足。"},{"title":"确认目标四边形的一组对边","body":"D、E、G共线，所以DG∥BC；F、C在BC上，因此DG∥FC。又题给DG＝FC。","why":"共线转移平行关系；一组对边同时平行且相等。"},{"title":"先判定平行四边形","body":"在按D—F—C—G顺序命名的四边形中，DG与FC是对边，且平行、相等，所以DFCG是平行四边形。","why":"一组对边平行且相等的判定。"},{"title":"用直角升级为矩形","body":"DF⊥BC，而FC在BC上，所以∠DFC＝90°。平行四边形DFCG有一个直角，故它是矩形。","why":"矩形判定。"},{"title":"第二问先确定BF","body":"D在BA上，F在射线BC上，所以∠DBF＝∠ABC＝45°。△BDF中∠BFD＝90°，故∠BDF＝45°，两直角边BF＝DF＝3。","why":"内角和及等角对等边；等腰直角三角形结论。"},{"title":"求BC并说明相加位置","body":"DG＝FC＝5。按题图F在线段BC内部，所以BC＝BF＋FC＝3＋5＝8。","why":"题设等长及线段相加。"},{"title":"为AC补一条高","body":"过A作AH⊥直线BC于H。DF⊥BC，所以DF∥AH；D在AB上，B、F、H共线，得到∠BFD＝∠BHA＝90°、∠DBF＝∠ABH。","why":"同垂直得平行；共线与两组对应角。"},{"title":"写相似并核对对应边","body":"△BDF∽△BAH（AA），对应B↔B、D↔A、F↔H。因此BD/BA＝BF/BH＝DF/AH。D为AB中点，BD/BA＝1/2。","why":"相似三角形对应边成比例。"},{"title":"求出高和水平分段","body":"由BF/BH＝1/2，得BH＝2BF＝6；由DF/AH＝1/2，得AH＝2DF＝6。BC＝8且BH＝6，故H在线段BC上，CH＝8－6＝2。","why":"相似比、长度代入和位置检查。"},{"title":"最后用勾股求AC","body":"在Rt△AHC中，AC²＝AH²＋CH²＝6²＋2²＝40。AC＞0，所以AC＝√40＝2√10。","why":"AH⊥HC；勾股定理及根式化简。"}],"answer":"（1）四边形DFCG是矩形；（2）BC＝8，AC＝2√10。","pitfall":"不要未证矩形就直接使用矩形性质；G不是DE的中点；DG等于FC，而不是DE等于FC；求AC时的直角三角形是AHC，水平直角边是CH＝2。","diagram":{"points":{"A":[6,6],"B":[0,0],"C":[8,0],"D":[3,3,-26,0],"E":[7,3,-12,-12],"F":[3,0],"G":[8,3,10,-9],"H":[6,0,-10,25,"aux"]},"edges":[["A","B"],["A","C"],["B","C"],["D","G"],["D","F"],["C","G"]],"aux":[["A","H"]],"right":[{"p":["D","F","B"]},{"p":["A","H","B"],"aux":true}]},"presentation":"按原题数学条件整理，几何图按题意重绘。 本页另用文字写明原图采用的交点位置，避免仅凭图形猜测。","lemmas":["midsegment","parallelogram","rectangle","right45","similar-area","pythagoras","angle-tools"]},{"id":"exam-yn2024-24","day":1,"type":"exam","title":"中点四边形反推菱形","year":2024,"region":"云南","number":"第24题","source":"https://kaosj.com/papers/2024/07/2024-zhongkao-math-yunnan-f120a2e6b5-paper/","tags":["三角形中位线","菱形判定","面积","完全平方公式"],"difficulty":"中等应用","time":"15分钟","stem":["四边形ABCD满足AB∥CD、AD∥BC。E、F、G、H依次是AB、BC、CD、DA的中点，且EFGH为矩形。"],"asks":["证明ABCD是菱形。","若矩形EFGH周长为22，ABCD面积为10，求AB。"],"hint":["观察中点小矩形的边分别平行于原图哪两条线。","第二问不必分别求出两条对角线；先求它们的和与积，再求平方和。"],"steps":[{"title":"先确认外层的图形身份","body":"AB∥CD、AD∥BC，两组对边分别平行，所以ABCD是平行四边形。连接AC、BD交于O。","why":"平行四边形定义。"},{"title":"第一条中位线对应AC","body":"H、G分别是AD、CD的中点。在△ADC中，HG为中位线，所以HG∥AC，HG＝AC/2。","why":"三角形中位线定理。"},{"title":"第二条中位线对应BD","body":"F、G分别是BC、CD的中点。在△BCD中，FG为中位线，所以FG∥BD，FG＝BD/2。","why":"三角形中位线定理。"},{"title":"把内层直角转成对角线垂直","body":"EFGH为矩形，所以HG⊥FG；HG∥AC、FG∥BD，因此AC⊥BD。","why":"对应平行直线间的夹角相同。"},{"title":"带着前提判定外层菱形","body":"ABCD已经是平行四边形，现在又有AC⊥BD，因此ABCD是菱形。","why":"垂直对角线的平行四边形是菱形；不能遗漏第一步。"},{"title":"用周长求两对角线之和","body":"矩形EFGH周长为22，所以2(HG＋FG)＝22。代入HG＝AC/2、FG＝BD/2，得AC＋BD＝22。","why":"矩形周长及中位线半长关系。"},{"title":"用面积求两对角线之积","body":"菱形面积S＝AC·BD/2。已知S＝10，所以AC·BD＝20；公式的四个直角三角形推导见本题结论。","why":"菱形面积与对角线关系。"},{"title":"展开平方和，避免分别求两条对角线","body":"(AC＋BD)²＝AC²＋2AC·BD＋BD²，因此AC²＋BD²＝22²－2×20＝484－40＝444。","why":"完全平方公式，移项时保留2倍乘积。"},{"title":"在小直角三角形中求边长","body":"菱形对角线互相垂直平分，故AO＝AC/2、BO＝BD/2、∠AOB＝90°。AB²＝AO²＋BO²＝(AC²＋BD²)/4＝444/4＝111。","why":"菱形对角线性质和勾股定理。"},{"title":"开方并写出最终结论","body":"AB为正长度，所以AB＝√111。这里无需分别解出AC和BD。","why":"长度取正平方根。"}],"answer":"（1）四边形ABCD是菱形；（2）AB＝√111。","pitfall":"中位线是对应第三边的一半，不能丢掉1/2；EFGH为矩形并不能无条件推出外层任意四边形为菱形；还需题给两组对边平行；菱形面积是对角线乘积的一半。","diagram":{"points":{"A":[-6,0],"B":[0,3],"C":[6,0],"D":[0,-3],"E":[-3,1.5],"F":[3,1.5],"G":[3,-1.5],"H":[-3,-1.5],"O":[0,0,9,-6,"aux"]},"edges":[["A","B"],["B","C"],["C","D"],["D","A"],["E","F"],["F","G"],["G","H"],["H","E"]],"aux":[["A","C"],["B","D"]]},"presentation":"保留原题条件与两问。采用一般位置示意，不按第2问数值比例绘制。","lemmas":["midsegment","midpoint-quadrilateral","rhombus","rhombus-area","pythagoras"]}];

function teachingFigureSvg(f){let svg=checkFigureSvg(f);if(f.diagram?.compass){const d=f.diagram,ps=Object.values(d.points),xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),scale=Math.min(464/(maxX-minX||1),294/(maxY-minY||1));const xy=p=>[(560-(maxX-minX)*scale)/2+(p[0]-minX)*scale,(390-(maxY-minY)*scale)/2+(maxY-p[1])*scale];const arcs=d.compass.map(a=>{const c=d.points[a.center],one=(a.angle-12)*Math.PI/180,two=(a.angle+12)*Math.PI/180,p=xy([c[0]+a.r*Math.cos(one),c[1]+a.r*Math.sin(one)]),q=xy([c[0]+a.r*Math.cos(two),c[1]+a.r*Math.sin(two)]);return `<path d="M${p[0]},${p[1]} A${a.r*scale},${a.r*scale} 0 0 0 ${q[0]},${q[1]}" class="compass-arc"/>`}).join('');svg=svg.replace('<text',arcs+'<text')}return svg}

function svgFigure(d,aux=false,showMarks=true){
 if(!d)return '<p>请在草稿纸上按题意画图。</p>';
 const W=560,H=390,P=48,pts=d.points||{},all=Object.values(pts).map(v=>[v[0],v[1]]);
 for(const c of d.circles||[]){const o=typeof c.center==='string'?pts[c.center]:c.center;all.push([o[0]-c.r,o[1]-(c.semi?0:c.r)],[o[0]+c.r,o[1]+c.r])}
 const xs=all.map(v=>v[0]),ys=all.map(v=>v[1]);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 const scale=Math.min((W-2*P)/(maxX-minX||1),(H-2*P)/(maxY-minY||1));
 const X=x=>(W-(maxX-minX)*scale)/2+(x-minX)*scale,Y=y=>(H-(maxY-minY)*scale)/2+(maxY-y)*scale;
 const xy=k=>{let p=typeof k==='string'?pts[k]:k;return [X(p[0]),Y(p[1])]};
 const line=(a,b,cls='geo-line')=>{let A=xy(a),B=xy(b);return `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" class="${cls}"/>`};
 let body='';
 for(const poly of d.fill||[]){if(poly.aux&&!aux)continue;body+=`<polygon points="${poly.points.map(k=>xy(k).join(',')).join(' ')}" fill="${poly.color||'#d9e9ff'}" opacity=".65"/>`}
 for(const c of d.circles||[]){let o=xy(c.center),r=c.r*scale;if(c.semi)body+=`<path d="M${o[0]-r},${o[1]} A${r},${r} 0 0 1 ${o[0]+r},${o[1]}" class="geo-line"/>`;else body+=`<circle cx="${o[0]}" cy="${o[1]}" r="${r}" class="${c.aux?'aux':'geo-line'}"/>`}
 for(const edge of d.edges||[])body+=line(edge[0],edge[1]);
 if(aux)for(const edge of d.aux||[])body+=line(edge[0],edge[1],'aux');
 if(showMarks){
  for(const ra of d.right||[]){if(ra.aux&&!aux)continue;let a=xy(ra.p[0]),v=xy(ra.p[1]),b=xy(ra.p[2]),da=[a[0]-v[0],a[1]-v[1]],db=[b[0]-v[0],b[1]-v[1]],la=Math.hypot(...da),lb=Math.hypot(...db),n=13;da=da.map(x=>x/la*n);db=db.map(x=>x/lb*n);body+=`<path d="M${v[0]+da[0]},${v[1]+da[1]} L${v[0]+da[0]+db[0]},${v[1]+da[1]+db[1]} L${v[0]+db[0]},${v[1]+db[1]}" class="mark"/>`}
  for(const mark of d.angles||[]){let a=xy(mark.p[0]),v=xy(mark.p[1]),b=xy(mark.p[2]),start=Math.atan2(a[1]-v[1],a[0]-v[0]),end=Math.atan2(b[1]-v[1],b[0]-v[0]),delta=((end-start+Math.PI*3)%(Math.PI*2))-Math.PI,r=mark.r||24;let x1=v[0]+r*Math.cos(start),y1=v[1]+r*Math.sin(start),x2=v[0]+r*Math.cos(start+delta),y2=v[1]+r*Math.sin(start+delta);body+=`<path d="M${x1},${y1} A${r},${r} 0 0 ${delta>=0?1:0} ${x2},${y2}" class="mark"/>`}
  for(const e of d.equal||[]){let a=xy(e[0]),b=xy(e[1]),dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),n=e[2]||1;for(let j=0;j<n;j++){let offset=(j-(n-1)/2)*5,mx=(a[0]+b[0])/2+dx/len*offset,my=(a[1]+b[1])/2+dy/len*offset;body+=`<line x1="${mx-dy/len*5}" y1="${my+dx/len*5}" x2="${mx+dy/len*5}" y2="${my-dx/len*5}" class="mark"/>`}}
 }
 for(const [name,p] of Object.entries(pts)){if(p[4]==='aux'&&!aux)continue;let a=xy(name);body+=`<circle cx="${a[0]}" cy="${a[1]}" r="2.8" class="point"/><text x="${a[0]+(p[2]??9)}" y="${a[1]+(p[3]??-10)}">${esc(name)}</text>`}
 for(const l of d.labels||[]){if(l.aux&&!aux)continue;let a=xy(l.at);body+=`<text x="${a[0]+(l.dx||0)}" y="${a[1]+(l.dy||0)}" style="font-size:18px;fill:${l.color||'#50637b'}">${esc(l.text)}</text>`}
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.alt||'题目几何示意图，点与条件见题干')}">${body}</svg>`
}

function review(){let list=EXAMS.filter(q=>progress[q.id]?.status==='review');const wrongChecks=CHECKS.map((c,i)=>({c,i})).filter(({c,i})=>checks[i]&&checks[i].selected!==c.a);return title('错题与回练','先找到卡点，再合上解析独立重做。',`<button class="small" data-export>导出学习记录</button>`)+`<div class="home-columns"><section class="sheet"><h2>待回练的真题 <span class="count-badge">${list.length}</span></h2>${list.length?list.map(q=>`<div class="review-item"><span class="quiet">${esc(q.origin)}</span><h3>${esc(q.title)}</h3><p>${esc(progress[q.id]?.reason||'可以先选出这道题的主要卡点。')}</p><button class="primary" data-retry="${q.id}">开始独立回练</button></div>`).join(''):`<div class="empty-state">${figure('square',true)}<h3>这里会收集你标记的题</h3><p>在真题页点击“还要回练”，就能按卡点再做一遍。</p>${btn('去看中考真题','exam','exam-cqb2024-21','primary')}</div>`}</section><section class="sheet"><h2>短诊断的薄弱点 <span class="count-badge">${wrongChecks.length}</span></h2>${wrongChecks.length?wrongChecks.map(({c,i})=>`<div class="review-item"><h3>${i+1}．${esc(c.q)}</h3><p>${esc(c.why)}</p>${checkVisual(i,true)}${btn('回看知识','learn',c.lesson,'small')}</div>`).join(''):'<p>完成短诊断后，答错的知识点会出现在这里。</p>'}${wrongChecks.length?'<button class="primary small" data-retry-checks>只重练错题</button>':''}${btn('继续短诊断','check','','small')}<div class="import-section"><h3>更换设备时</h3><p>先导出记录，再在另一台设备导入。</p><label class="file-label" for="import-record">导入学习记录</label><input type="file" id="import-record" accept="application/json,.json" hidden/></div></section></div>`}

let exploreMode='para',exploreT=32,exploreDiag=true,midMode='free',rotationFrame=0;
function explore(){return title('动手看图，再写出理由','数值用于观察；结论仍要用定理和证明说明。')+`<div class="explore-grid"><section class="sheet explorer"><h2>同一组边，可以怎样变化？</h2><div class="segmented">${[['para','平行四边形'],['rect','矩形'],['rhombus','菱形'],['square','正方形']].map(([v,l])=>`<button data-explore-mode="${v}" class="${v===exploreMode?'active':''}">${l}</button>`).join('')}</div><div id="family-figure" class="figure-wrap"></div><label class="slider-label" for="shape-slider">改变倾斜程度 <output id="shape-angle"></output></label><input type="range" id="shape-slider" min="0" max="65" value="${exploreT}" ${['rect','square'].includes(exploreMode)?'disabled':''}/><label class="check-label"><input type="checkbox" id="show-diagonals" ${exploreDiag?'checked':''}/> 显示两条对角线</label><div id="shape-observation" class="observation" aria-live="polite"></div>${btn('看性质与判定','learn','para','small')}</section><section class="sheet explorer"><h2>中点四边形怎样跟着变？</h2><div class="segmented">${[['free','一般四边形'],['rect','原图是矩形'],['rhombus','原图是菱形'],['square','原图是正方形']].map(([v,l])=>`<button data-mid-mode="${v}" class="${v===midMode?'active':''}">${l}</button>`).join('')}</div><div id="midpoint-figure" class="figure-wrap"></div><div id="midpoint-observation" class="observation" aria-live="polite"></div><p class="figure-note">深蓝为原图，绿色为中点四边形，橙色虚线为原对角线。</p>${btn('为什么看原对角线？','proof','p14','small')}</section><section class="sheet explorer rotation-explorer"><div><h2>45°半角题：旋转为什么有用？</h2><p>将△ABE绕A旋转90°，使B落到D。把BE转移到D旁边，再用全等拼出BE＋DF。</p><div class="segmented">${['原图','旋转后的图','拼出线段和'].map((l,i)=>`<button data-rotation-frame="${i}" class="${rotationFrame===i?'active':''}">${l}</button>`).join('')}</div><div id="rotation-explanation" class="observation"></div>${btn('展开完整推导','proof','p20','small')}</div><div id="rotation-figure" class="figure-wrap"></div></section><section class="sheet explorer counter-explorer"><div><h2>相等又垂直，也可能不是正方形</h2><p>这张图中AC＝BD＝6，且AC⊥BD，但AO＝2、OC＝4，两条对角线没有互相平分。</p><div class="pitfall"><strong>还缺什么？</strong><p>要从一般 function familyDrawing(){let angle=(90-exploreT)*Math.PI/180,side=['rhombus','square'].includes(exploreMode)?5:7;let v=['rect','square'].includes(exploreMode)?[0,4.5]:[4.5*Math.cos(angle),4.5*Math.sin(angle)];if(exploreMode==='rhombus')v=[side*Math.cos(angle),side*Math.sin(angle)];if(exploreMode==='square')v=[0,side];const pts={A:[0,0],B:[side,0],C:[side+v[0],v[1]],D:[v[0],v[1]],O:[(side+v[0])/2,v[1]/2]};const d={points:pts,edges:[['A','B'],['B','C'],['C','D'],['D','A']],aux:exploreDiag?[['A','C'],['B','D']]:[]};$('#family-figure').innerHTML=draw(d,true);$('#shape-angle').textContent=Math.round(Math.atan2(v[1],v[0])*180/Math.PI)+'°';const p=Math.hypot(side+v[0],v[1]),q=Math.hypot(side-v[0],v[1]);$('#shape-observation').innerHTML=`<strong>${({para:'保持两组对边平行',rect:'保持四个直角',rhombus:'保持四边相等',square:'保持等边与直角'})[exploreMode]}</strong><p>AC≈${p.toFixed(2)}，BD≈${q.toFixed(2)}。对角线一直互相平分。</p><p>${exploreMode==='para'?'倾斜改变时，边长保持不变；某些特殊位置也会成为矩形。':exploreMode==='rect'?'对角线相等；一般不垂直。':exploreMode==='rhombus'?'对角线垂直；只有特殊位置相等。':'对角线同时相等、垂直，且互相平分。'}</p>`}
function midpointDrawing(){const sets={free:[[-5,0],[-1,4],[5,2],[2,-3]],rect:[[-5,3],[5,3],[5,-3],[-5,-3]],rhombus:[[-5,0],[0,3],[5,0],[0,-3]],square:[[-3,3],[3,3],[3,-3],[-3,-3]]};const a=sets[midMode],points={};'ABCD'.split('').forEach((x,i)=>points[x]=a[i]);'EFGH'.split('').forEach((x,i)=>points[x]=[(a[i][0]+a[(i+1)%4][0])/2,(a[i][1]+a[(i+1)%4][1])/2]);let d={points,edges:[['A','B'],['B','C'],['C','D'],['D','A']],aux:[['A','C'],['B','D']]};let svg=draw(d,true);let inner=draw({points,edges:[['E','F'],['F','G'],['G','H'],['H','E']]},false);const lines=inner.match(/<line[^>]*class="geo-line"[^>]*\/>/g)||[];svg=svg.replace('</svg>',`<g class="mid-green">${lines.join('')}</g></svg>`);$('#midpoint-figure').innerHTML=svg;const names={free:'平行四边形',rect:'菱形',rhombus:'矩形',square:'正方形'};$('#midpoint-observation').innerHTML=`<strong>中点四边形是${names[midMode]}</strong><p>${({free:'新边分别平行于原图的两条对角线。',rect:'原矩形对角线相等，所以新图邻边相等。',rhombus:'原菱形对角线垂直，所以新图有直角。',square:'原对角线既相等又垂直，新图两类条件兼有。'})[midMode]}</p>`}
function rotationDrawing(){let d=structuredClone(QUAD_BASE.half);if(rotationFrame===2){d.fill=[{points:['A','E','F'],color:'#c9eafa'},{points:['A','X','F'],color:'#daf3c5',aux:true}];d.labels=[{at:[-1.5,4.55],text:'BE'},{at:[.35,4.55],text:'DF'}]}$('#rotation-figure').innerHTML=draw(d,rotationFrame>0);$('#rotation-explanation').textContent=['先保留原图：∠EAF＝45°。目标是EF＝BE＋DF。','旋转后AX＝AE、DX＝BE。X、D、F依次共线，∠XAF也是45°。','△AXF与△AEF由SAS全等，XF＝EF；又XF＝XD＋DF＝BE＋DF。'][rotationFrame]}
