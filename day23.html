<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宏浩英语 · Day 23 · 拼读与火影阅读</title><style>
:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#172434;background:#f4f7fb;--blue:#173b67;--line:#dce5ef}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--blue)}button:hover{background:#eaf4ff}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e7a641;outline-offset:2px}header{padding:20px 28px;background:var(--blue);color:white;display:flex;align-items:center;justify-content:space-between;gap:15px}header a{color:white}h1{font-size:25px;margin:5px 0}small,.hint{font-size:13px;line-height:1.8}.hint{color:#657386}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 28px;background:white;border-bottom:1px solid var(--line)}nav{display:flex;gap:8px;flex-wrap:wrap}nav button.active,.primary{background:var(--blue);color:white}main{padding:24px 28px;max-width:1500px;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px}h2{font-size:24px;margin:0 0 14px}h3{margin:0 0 12px}p{line-height:1.9}.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;height:calc(100dvh - 225px);min-height:390px}.pane{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;border:1px solid var(--line);background:white;border-radius:16px;padding:25px}.article{font-size:21px;line-height:2}.article p{margin-bottom:24px}.blank{display:inline-block;border-radius:7px;background:#eaf4ff;color:#173b67;padding:0 7px;font-weight:700;min-width:55px}.question{padding:17px 0;border-bottom:1px solid var(--line)}label.option{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:pointer}label.option:has(input:checked){background:#eaf4ff;border-color:#2f70b7}input[type=radio]{accent-color:var(--blue);width:18px;height:18px}.analysis{background:#fff6e7;padding:15px;border-radius:10px;line-height:1.8;margin-top:12px}.result{font-weight:700;color:var(--blue);margin-top:15px}input[type=text]{border:1px solid #b6c8db;border-radius:10px;padding:13px;width:min(100%,380px)}.wordgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.word{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}.word strong{font-size:29px}.word p{font-size:19px}.meaning{background:#eaf4ff;padding:10px;margin-top:10px;border-radius:7px}.bank p{margin:10px 0;font-size:17px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.badge{display:inline-block;padding:6px 10px;background:#eaf4ff;color:var(--blue);border-radius:8px;margin:3px;font-size:12px}.marked{background:#fff0ad;border-radius:4px}.token{cursor:pointer}.token:hover{background:#eaf4ff}#tip{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173b67;color:white;padding:15px 22px;border-radius:12px;z-index:50;max-width:90%;box-shadow:0 5px 25px #0003}select{padding:10px;border-radius:8px;border:1px solid #b6c8db;background:white}.status{font-size:13px;color:#657386;margin-left:auto}@media(max-width:700px){header,main,.toolbar{padding:15px}h1{font-size:21px}.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;height:calc(100dvh - 280px)}.pane{padding:12px}.article{font-size:17px}.wordgrid{grid-template-columns:1fr}.bank p{font-size:15px}label.option{padding:8px;font-size:14px}.badge{font-size:11px}}@media print{header,.toolbar,.actions,button,#tip{display:none!important}.split{height:auto;display:block}.pane{overflow:visible;border:0}.analysis{display:none}main{padding:0}.card{border:0}.token{background:none!important}}
</style></head><body><header><div><small>2026.10.13 / DAY 23</small><h1>听音拼词 · 火影剧情阅读</h1></div><a href="index.html">课程首页 ↗</a></header><div class="toolbar"><nav id="nav"></nav><button id="timer" onclick="toggleTimer()">▶ 计时</button><span id="time">00:00</span><button onclick="download()">下载记录</button><span class="status" id="status">答案自动保存在当前浏览器</span></div><main id="main"></main><div id="tip" hidden></div><script src="cloud-sync.js?v=7"></script><script src="day23-data.js"></script><script>
'use strict';const KEY='honghao-day23-v1';const names=['10词听写','ck · ai · ay','完形填空','六选五'];const review=['chair','teacher','lunch','she','fish','shop','see','tree','green','three'];const rz=['椅子','老师','午餐','她','鱼','商店','看见','树','绿色','三'];const initial={stage:0,group:0,answers:[[],[]],first:[null,null],submitted:[false,false],dict:{},di:0,mean:{},marked:{},seconds:[0,0,0,0]};function loadState(){try{return Object.assign(structuredClone(initial),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(initial)}}let S=loadState(),running=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{document.getElementById('status').textContent='保存失败，请下载记录'}}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(s,slow=false){if(!('speechSynthesis' in window)){tip('浏览器不支持朗读，请老师读词。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=slow?.65:.85;speechSynthesis.speak(u)}function tip(s){let t=document.getElementById('tip');t.textContent=s;t.hidden=false;clearTimeout(window.tipTimer);window.tipTimer=setTimeout(()=>t.hidden=true,3500)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function toggleTimer(){running=!running;document.getElementById('timer').textContent=running?'Ⅱ 暂停':'▶ 计时'}setInterval(()=>{if(running){S.seconds[S.stage]++;save()}document.getElementById('time').textContent=fmt(S.seconds[S.stage])},1000);function go(n){S.stage=n;save();render()}function render(){document.getElementById('nav').innerHTML=names.map((s,i)=>`<button class="${S.stage===i?'active':''}" onclick="go(${i})">${i+1}. ${s}</button>`).join('');document.getElementById('main').innerHTML=S.stage===0?dictation():S.stage===1?phonics():reading(S.stage-2);document.getElementById('time').textContent=fmt(S.seconds[S.stage]);}
function dictation(){let i=S.di,e=S.dict[i]||{},count=Object.values(S.dict).filter(x=>x.first===true).length;return `<section class="card"><span class="badge">复习 ch / sh / ee</span><h2>先听发音，再推测字母组合</h2><p class="hint">使用本次备课选出的10词；老师先确认是否与昨天摘抄一致。先听音独立写，检查后再看中文提示。</p><h3>第 ${i+1} / 10 词</h3><div class="actions"><button class="primary" onclick="say(review[S.di])">♪ 听单词</button><button onclick="say(review[S.di],true)">慢速听</button></div><p><input type="text" id="dict" aria-label="听写答案" autocomplete="off" spellcheck="false" value="${esc(e.value||'')}" oninput="dictInput(this.value)" onkeydown="if(event.key==='Enter')checkDict()"> <button onclick="checkDict()">检查拼写</button></p>${e.checked?`<div class="analysis">${e.correct?'✓ 正确':'再试一次'} · 中文提示：${rz[i]}${e.reveal?' · 正确拼写：'+review[i]:''}</div>`:''}<div class="actions"><button onclick="revealDict()">显示拼写并订正</button><button onclick="dictMove(-1)" ${i===0?'disabled':''}>上一个</button><button onclick="dictMove(1)">${i===9?'返回第1词':'下一个'}</button><button onclick="wrongDict()">重练错词</button></div><p class="hint">首次正确：${count} / 10；订正不改写首次结果。</p></section>`}function dictInput(v){let e=S.dict[S.di]||{};e.value=v;S.dict[S.di]=e;save()}function checkDict(){dictInput(document.getElementById('dict').value);let e=S.dict[S.di];e.correct=e.value.trim().toLowerCase()===review[S.di];if(e.first===undefined)e.first=e.correct;e.checked=true;save();render()}function revealDict(){let e=S.dict[S.di]||{};if(e.first===undefined)e.first=false;e.checked=true;e.reveal=true;S.dict[S.di]=e;save();render()}function dictMove(d){S.di=(S.di+d+10)%10;save();render()}function wrongDict(){let i=review.findIndex((w,i)=>!S.dict[i]?.correct);if(i<0){tip('10个词当前都写对了');return}S.di=i;save();render()}
function phonics(){let g=D.groups[S.group];return `<section class="card"><h2>读句子，猜词义</h2><p class="hint">ck读/k/；ai、ay常读/eɪ/。这组词中ai在词中、ay在词尾。听音不能唯一确定拼写，还要记住单词。每组10词，先猜意思，再揭示。</p><div class="actions">${D.groups.map((x,i)=>`<button class="${i===S.group?'primary':''}" onclick="S.group=${i};save();render()">${x[0]} → ${x[1]} · 10词</button>`).join('')}</div></section><div class="wordgrid">${g[2].map((w,i)=>{let id=g[0]+i;return `<section class="word"><strong>${esc(w[0])}</strong> <button onclick="say(D.groups[S.group][2][${i}][0])">♪</button><p>${esc(w[2]).replace(new RegExp('\\b'+w[0]+'\\b','g'),'<b>'+w[0]+'</b>')}</p><button onclick="S.mean['${id}']=!S.mean['${id}'];save();render()">${S.mean[id]?'隐藏':'我猜好了，查看意思'}</button>${S.mean[id]?`<div class="meaning">${w[1]}</div>`:''}</section>`}).join('')}</div>`}
const glossary={ninja:'忍者',forest:'森林',headband:'护额',bells:'铃铛',bell:'铃铛',tied:'绑着的',teamwork:'团队合作',teammates:'队友',alone:'独自；孤单',pass:'通过',test:'考试；考验',hurt:'伤害',safe:'安全的',believes:'相信',fight:'与……战斗',save:'救',share:'分享',trouble:'麻烦',real:'真正的',special:'特殊的',train:'训练',families:'家庭；家人',finally:'终于',himself:'他自己',cares:'关心',learns:'学习；得知',gives:'给',food:'食物',twelve:'十二',lunch:'午餐',before:'在……之前',together:'一起',leaves:'离开',suddenly:'突然',jumps:'跳',front:'前面',happily:'高兴地',using:'使用；利用',own:'自己的',ways:'方法'};function tokens(s){return s.split(/([A-Za-z]+(?:'[A-Za-z]+)?)/g).map(w=>/^[A-Za-z]/.test(w)?`<span class="token ${S.marked[w.toLowerCase()]?'marked':''}" data-word="${esc(w)}" onclick="wordClick(this)">${esc(w)}</span>`:esc(w)).join('')}function wordClick(el){let w=el.dataset.word,k=w.toLowerCase();S.marked[k]=!S.marked[k];save();el.classList.toggle('marked',S.marked[k]);tip(w+' · '+(glossary[k]||'已记录；请结合上下文或向老师确认词义'))}function articlePara(s){return s.split(/(\{\{\d+\}\})/g).map(t=>t.startsWith('{{')?`<span class="blank">(${t.slice(2,-2)}) ____</span>`:tokens(t)).join('')}
function reading(r){let d=r===0?D.cloze:D.gap,n=d[2].length;return `<div class="split"><section class="pane article" aria-label="文章独立滚动区"><h2>${r===0?'Naruto and Iruka':'The Bell Test'}</h2><div><span class="badge">建议词汇量：约600—800词（估计）</span><span class="badge">完整正文：${r===0?'154':'159'}词</span><span class="badge">不重复词：${r===0?'83':'88'}个</span></div><p class="hint">真实剧情简化改写 · ${r===0?'ninja 忍者；forest 森林；headband 护额。special book 指封印之书。Iruka 伊鲁卡；Mizuki 水木。':'bell 铃铛；be tied to 被绑在；teamwork 团队合作；teammate 队友。Kakashi 卡卡西；Sasuke 佐助；Sakura 小樱。'}<br>点击词可标记生词；部分词提供中文提示。左右各自滚动，作答不会被清空。</p>${d[0].map((s,i)=>`<p><small class="hint">段落 ${i+1}</small><br>${articlePara(s)}</p>`).join('')}</section><section class="pane" aria-label="题目独立滚动区"><h2>${r===0?'完形填空 · 10题':'六选五 · 月考26—30题型'}</h2><p class="hint">${r===0?'每题选一个最符合上下文的词或词组。':'从6句中选5句填入文章，每项只用一次，1句多余。'}</p>${r===1?`<div class="bank card">${d[1].map((s,i)=>`<p><b>${'ABCDEF'[i]}.</b> ${esc(s)}</p>`).join('')}</div>`:''}${Array.from({length:n},(_,i)=>`<div class="question"><h3>第 ${i+1} ${r===0?'题':'空'}</h3>${r===0?d[1][i].map((s,j)=>`<label class="option"><input type="radio" name="q${r}-${i}" value="${j}" ${S.answers[r][i]===j?'checked':''} onchange="answer(${r},${i},${j})">${'ABCD'[j]}. ${esc(s)}</label>`).join(''):`<select aria-label="第${i+1}空答案" onchange="answer(1,${i},this.value===''?null:Number(this.value))"><option value="">选择句子</option>${d[1].map((s,j)=>`<option value="${j}" ${S.answers[r][i]===j?'selected':''}>${'ABCDEF'[j]}</option>`).join('')}</select>`}${S.submitted[r]?`<div class="analysis">${S.answers[r][i]===d[2][i]?'✓ 正确':'需订正'} · 正确答案 ${'ABCDEF'[d[2][i]]}<br>${esc((r===0?D.ca:D.ga)[i])}</div>`:''}</div>`).join('')}<div class="actions"><button class="primary" onclick="submit(${r})">提交并查看解析</button><button onclick="window.print()">打印学生题</button></div><div id="result" class="result">${S.first[r]?`首次成绩：${S.first[r].score} / ${n}；当前已选 ${S.answers[r].filter(x=>Number.isInteger(x)).length} / ${n}`:''}</div></section></div>`}function answer(r,i,v){S.answers[r][i]=v;save();let e=document.getElementById('result');if(e)e.textContent='已保存 · '+S.answers[r].filter(x=>Number.isInteger(x)).length+'题已选；首次成绩'+(S.first[r]?S.first[r].score:'尚未提交')}function submit(r){let d=r===0?D.cloze:D.gap;if(d[2].some((v,i)=>!Number.isInteger(S.answers[r][i]))){tip('请完成所有题目再提交');return}if(r===1&&new Set(S.answers[1]).size<5){tip('六选五每个选项只能用一次，请检查重复选项');return}let score=d[2].filter((v,i)=>S.answers[r][i]===v).length;if(!S.first[r])S.first[r]={answers:[...S.answers[r]],score,date:new Date().toISOString()};S.submitted[r]=true;save();const pane=document.querySelectorAll('.pane')[1],y=pane.scrollTop,leftY=document.querySelectorAll('.pane')[0].scrollTop;document.getElementById('main').innerHTML=reading(r);document.querySelectorAll('.pane')[1].scrollTop=y;document.querySelectorAll('.pane')[0].scrollTop=leftY;tip('本次正确 '+score+' / '+d[2].length+'，首次成绩已保留')}function download(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='宏浩_Day23_课堂记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.addEventListener('honghao:cloud-synced',()=>{S=loadState();render()});render();
</script></body></html>
