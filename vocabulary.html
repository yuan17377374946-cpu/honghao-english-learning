<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b67">
  <title>宏浩云端生词本</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#172434;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.shell{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 90px}.home{display:inline-flex;margin-bottom:15px;padding:8px 12px;border:1px solid #dce5ef;border-radius:10px;background:#fff;color:#173b67;font-size:.82rem;font-weight:800;text-decoration:none}.hero{padding:24px;border-radius:23px;background:linear-gradient(120deg,#0d294a,#173b67);color:#fff}.hero h1{margin:0 0 7px}.hero p{margin:0;color:#dceaff;line-height:1.6}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.toolbar button{padding:9px 13px;border:1px solid #dce5ef;border-radius:10px;background:#fff;color:#173b67;font-weight:800;cursor:pointer}.toolbar button.active{border-color:#2f70b7;background:#eaf4ff}.summary{margin-left:auto;align-self:center;color:#657386;font-size:.82rem}.table-wrap{overflow:auto;border:1px solid #dce5ef;border-radius:18px;background:#fff;box-shadow:0 10px 28px rgba(27,57,91,.06)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:14px 15px;border-bottom:1px solid #e5ebf1;text-align:left}th{background:#f5f8fb;color:#657386;font-size:.75rem}td strong{color:#173b67}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:.72rem;font-weight:800}.unknown{background:#ffe6e6;color:#9a3030}.uncertain{background:#fff4bd;color:#7e6200}.empty{padding:42px 20px;text-align:center;color:#657386}.hint{margin-top:13px;color:#657386;font-size:.78rem;line-height:1.6}@media(max-width:600px){.summary{width:100%;margin-left:0}}
  </style>
</head>
<body>
  <main class="shell">
    <a class="home" href="index.html">← 返回课程记录</a>
    <section class="hero"><h1>宏浩云端生词本</h1><p>阅读正文、题目或选项中点击过的词会自动收集。后续出题可以优先使用这些词。</p></section>
    <div class="toolbar"><button class="active" data-filter="all">全部</button><button data-filter="unknown">不认识</button><button data-filter="uncertain">有点模糊</button><span id="summary" class="summary">等待登录云端账号</span></div>
    <section class="table-wrap"><div id="empty" class="empty">请先点击右下角登录宏浩账号。</div><table id="wordTable" hidden><thead><tr><th>单词</th><th>词性</th><th>中文</th><th>熟悉程度</th><th>来源</th><th>最近记录</th></tr></thead><tbody id="wordRows"></tbody></table></section>
    <p class="hint">这里不会公开展示给其他人。只有登录同一个宏浩账号后，才能读取这份生词记录。</p>
  </main>
  <script>(function(){const s=document.createElement("script");s.src=location.hostname==="htmlpreview.github.io"?"https://cdn.jsdelivr.net/gh/yuan17377374946-cpu/honghao-english-learning@main/cloud-sync.js?v=2":"cloud-sync.js";document.body.append(s)})();</script>
  <script>
    let vocabulary=[],filter="all";
    const $=selector=>document.querySelector(selector);
    function render(){const rows=filter==="all"?vocabulary:vocabulary.filter(item=>item.status===filter);$("#summary").textContent="共 "+vocabulary.length+" 个生词，当前显示 "+rows.length+" 个";$("#wordRows").innerHTML="";$("#empty").hidden=rows.length>0;$("#wordTable").hidden=rows.length===0;if(!rows.length)$("#empty").textContent=vocabulary.length?"这个分类暂时没有单词。":"还没有云端生词记录。";rows.forEach(item=>{const tr=document.createElement("tr");[item.word,item.part_of_speech||"—",item.meaning||"—"].forEach((text,index)=>{const td=document.createElement("td");if(index===0){const strong=document.createElement("strong");strong.textContent=text;td.append(strong)}else td.textContent=text;tr.append(td)});const status=document.createElement("td"),badge=document.createElement("span");badge.className="status "+item.status;badge.textContent=item.status==="uncertain"?"有点模糊":"不认识";status.append(badge);tr.append(status);const source=document.createElement("td");source.textContent=String(item.source||"").replace("day","Day ");tr.append(source);const date=document.createElement("td");date.textContent=item.last_seen?new Date(item.last_seen).toLocaleString("zh-CN",{hour12:false}):"—";tr.append(date);$("#wordRows").append(tr)})}
    async function loadWords(){await window.HonghaoCloud.ready;if(!window.HonghaoCloud.isSignedIn()){$("#summary").textContent="等待登录云端账号";$("#empty").textContent="请先点击右下角登录宏浩账号。";$("#empty").hidden=false;$("#wordTable").hidden=true;return}try{vocabulary=await window.HonghaoCloud.listVocabulary();render()}catch(error){$("#empty").textContent=error.message;$("#empty").hidden=false;$("#wordTable").hidden=true}}
    document.querySelectorAll("[data-filter]").forEach(button=>button.onclick=()=>{filter=button.dataset.filter;document.querySelectorAll("[data-filter]").forEach(item=>item.classList.toggle("active",item===button));render()});
    document.addEventListener("honghao:cloud-synced",loadWords);if(window.HonghaoCloud)loadWords();else document.addEventListener("honghao:cloud-ready",loadWords,{once:true});
    if(location.hostname==="htmlpreview.github.io"){const source=decodeURIComponent(location.search.slice(1));document.querySelector(".home").href="?"+source.replace(/\/[^/]+(?:\?.*)?$/,"/index.html")}
  </script>
</body>
</html>
