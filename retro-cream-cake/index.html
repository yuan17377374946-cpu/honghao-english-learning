<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="一层蛋糕体、一层夹心，叠好后抹奶油、裱花，再摆上水果。">
<title>复古蛋糕店</title>
<link rel="stylesheet" href="style.css?v=fillings">
<script src="cake.js?v=fillings" defer></script>
</head>
<body>
<main class="shop">
  <h1 class="sr-only">复古蛋糕店</h1>
  <section class="workbench" aria-label="蛋糕工作台">
    <div class="stage">
      <canvas id="cake" width="1122" height="1020" tabindex="0" aria-label="蛋糕装饰画布" aria-describedby="hint"></canvas>
      <button id="eraser" class="eraser-button" type="button" aria-pressed="false" title="擦除蛋糕上的装饰" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.6 13.7 12.2 5a2 2 0 0 1 2.8 0l5.1 5.1a2 2 0 0 1 0 2.8L13 20H8.7l-5.1-5.1a.9.9 0 0 1 0-1.2ZM8 9.3l8.6 8.6M13 20h8"/>
        </svg>
        橡皮擦
      </button>
      <button id="undo" class="scene-button undo" type="button" aria-label="撤销" title="撤销"></button>
      <button id="rotate" class="scene-button rotate" type="button" aria-label="转动蛋糕" title="转动蛋糕"></button>
      <section id="gift" class="gift" aria-labelledby="gift-title" hidden>
        <img src="box.webp" alt="">
        <h2 id="gift-title">蛋糕装好啦</h2>
        <p id="gift-message"></p>
        <div><button type="button" id="unbox">打开盒子</button><button type="button" id="gift-save">保存成品照</button></div>
      </section>
    </div>
    <nav class="tabs" aria-label="制作步骤">
      <button type="button" data-tab="build" aria-pressed="false">蛋糕胚</button>
      <button type="button" data-tab="base" aria-pressed="false">奶油</button>
      <button type="button" data-tab="icing" aria-pressed="true">裱花</button>
      <button type="button" data-tab="topping" aria-pressed="false">装饰</button>
      <button type="button" data-tab="packing" aria-pressed="false">装盒</button>
    </nav>
    <section class="tray" aria-label="制作托盘">
      <section id="assembly" aria-labelledby="assembly-title" hidden>
        <div class="assembly-heading">
          <h2 id="assembly-title" tabindex="-1" aria-live="polite">选第一层蛋糕体</h2>
          <span id="layer-count"></span>
        </div>
        <div id="filling-groups" class="filling-groups" role="group" aria-label="夹心分类" hidden>
          <span id="filling-total"></span>
        </div>
        <div id="layer-choices" class="tools"></div>
        <ol id="layer-stack" class="layer-stack" aria-label="从底到顶的蛋糕夹层"></ol>
        <div class="assembly-actions">
          <button id="remove-layer" type="button" hidden>拿掉最上层</button>
          <button id="finish-assembly" type="button">叠好了，去抹奶油</button>
        </div>
      </section>
      <div id="tools" class="tools"></div>
      <div id="catalog-nav" class="catalog-nav" hidden>
        <span id="catalog-count" aria-live="polite"></span>
        <div class="page-controls">
          <button id="prev-page" type="button" aria-label="上一页">‹</button>
          <span id="page-number"></span>
          <button id="next-page" type="button" aria-label="下一页">›</button>
        </div>
      </div>
      <div id="icing-colors" class="icing-colors">
        <span class="color-label">裱花奶油 <strong id="color-name"></strong></span>
        <div id="colors" class="colors" aria-label="裱花奶油颜色"></div>
      </div>
      <div id="fruit-size-controls" class="fruit-size-controls" hidden>
        <label for="fruit-size">水果大小</label>
        <input id="fruit-size" type="range" min="50" max="160" step="5" value="100" aria-describedby="hint">
        <output id="fruit-size-value" for="fruit-size" aria-hidden="true">100%</output>
        <button id="resize-fruit" type="button" aria-pressed="false">调整已放水果</button>
      </div>
      <div id="packing" class="packing" hidden>
        <label for="message">蛋糕上的祝福<input id="message" maxlength="14" autocomplete="off" placeholder="写一句生日快乐"></label>
        <button type="button" id="box" class="stamp"><img src="box.webp" alt="">盖上蛋糕盒</button>
      </div>
    </section>
    <div class="recipe-note">
      <p id="hint">沿着蛋糕边拖动，挤一圈厚厚的贝壳花。</p>
      <div class="note-actions">
        <button id="reset" type="button">从蛋糕胚开始</button>
        <button id="sample" type="button">恢复示例</button>
      </div>
      <p id="notice" class="sr-only" role="status"></p>
    </div>
  </section>
</main>
</body>
</html>
